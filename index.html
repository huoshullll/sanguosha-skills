数不能超过存活人数）； ②直至其回合结束其攻击范围-X。（X为因此亮出的牌数）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋沮授","t":"忠不逢时","k":"群","kh":3,"mh":3,"g":"","s":[["佐军","出牌阶段限一次，你可选择一名角色，令其摸3张牌并选择一项： ①这些牌无法使用且不计入手牌上限，直到其下回合结束； ②失去1点体力，再摸一张牌并使用其中任意张牌，弃置没使用的牌。",[]],["暮往","锁定技，当你每回合第一次失去的一张基本牌或普通锦囊牌进入弃牌堆时，你将之收回手牌。你本回合再次失去此牌后弃置一张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋陈琳","t":"文翻云海","k":"群","kh":3,"mh":3,"g":"","s":[["邀作","出牌阶段限一次，所有其他角色可选择交给你一张牌，最快者选择另一名其他角色，视为你对其所选角色使用“撰文”。未交给你牌的角色，本回合你下次对其造成的伤害+1。",[]],["撰文","结束阶段，你可选择一名其他角色，展示牌堆顶X张牌并选择一项执行： ①对其使用其中的伤害牌； ②令其获得其中的非伤害牌。 然后将剩余牌放置在牌堆顶。 （X为其手牌数且至多为5，至多为5且至少为1）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋邓艾","t":"奇锋厄川","k":"魏","kh":4,"mh":4,"g":"","s":[["骤袭","出牌阶段限一次，你弃置所有当前无法指定其他角色目标的手牌，根据弃牌数依次选择等量项： ①本回合与其他角色距离-X； ②视为对至多X名角色使用【顺手牵羊】； ③视为对至多X名角色使用【杀】。若你执行了所有选项此技能视为未发动过（X为该项被选择的次序）。",[]],["恃矜","限定技，出牌阶段，若本回合你造成过伤害，可摸两张牌，直至你的下个回合开始前你受到伤害时防止此伤害并摸一张牌，你的下个回合开始时弃置所有【杀】并流失等量体力，若你未因此流失体力此技能视为未发动过。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋骆统","t":"知寒始北","k":"吴","kh":3,"mh":3,"g":"","s":[["举策","你于回合内第一次使用基本或普通锦囊牌指定目标时，可多选择一个目标。若如此做，该角色下回合使用的第一张基本或普通锦囊牌指定目标后，你成为此牌的额外目标。",[]],["抗明","以你为目标的牌结算后，你摸一张牌并选择一项： ①展示一张本回合未展示过的【杀】或普通锦囊牌视为对使用者使用； ②再摸三张牌且此技能失效至你的回合开始（若是你的回合则改为回合结束）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋诸葛亮","t":"武侯","k":"蜀","kh":3,"mh":3,"g":"","s":[["知天","出牌阶段，牌堆顶的7张牌对你可见。你的【火攻】结算中，你可观看并选择牌堆顶7张牌中的一张牌代替【火攻】弃牌。",[]],["武靖","锁定技，你的回合内，有牌不因使用而进入弃牌堆后，你使用的下一张牌无次数限制；每回合首次有不为手牌的牌进入弃牌堆后，你摸一张牌。",["锁定技"]],["智绝","转换技，出牌阶段，阳：你可将牌堆顶的一张牌当【火攻】使用；阴：将一种颜色的手牌置入弃牌堆（每种颜色每回合限一次），然后可视为使用其中一张基本或普通锦囊牌。若未造成伤害，你摸两张牌，然后令“知天”可见与观看的牌数-1（至多减至4）。",["转换技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋戏志才","t":"烬途明灯","k":"魏","kh":3,"mh":3,"g":"","s":[["薪传","当你使用的锦囊牌置入弃牌堆后，你可以令一名角色依次摸X张牌并依次弃置X张牌（X为本回合弃牌堆缺失的花色数），若其手牌数变为体力值，其下家继续执行剩余流程。",[]],["金烬","你可以移出本回合弃牌堆中任意张不同花色的牌并失去本技能视为使用一张普通锦囊牌，然后你下次造成或受到伤害的回合结束时令一名角色获得移出牌和本技能。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋夏侯惇","t":"独眼的罗刹","k":"魏","kh":4,"mh":4,"g":"","s":[["刚烈","出牌阶段限一次，你可以选择任意名本局游戏中对你造成过伤害的角色，对其造成2点伤害，然后该角色视为未对你造成伤害。",[]],["清俭","当一张牌非因使用而进入弃牌堆时，若你的“清俭”牌不足X张（X为你的体力值），你将之置于你的武将牌上，称为“清俭”牌；结束阶段，你将这些牌分配给任意角色。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋张角","t":"驱雷掣电","k":"群","kh":3,"mh":3,"g":"","s":[["雷击","出牌阶段，你可以： ①弃4枚“道兵”，对一名其他角色造成1点雷电伤害； ②弃6枚“道兵”，对一名其他角色造成2点雷电伤害。",[]],["鬼道","每轮游戏开始时，你获得4枚“道兵”（“道兵”数量至多为8）。 当一名角色受到属性伤害时，你获得2枚“道兵”。 每回合限一次，当你受到伤害时，你可以弃2枚“道兵”，防止此伤害 每当你累计弃置8枚“道兵”后，你可令场上的任意名角色进行依次【闪电】判定。",[]],["黄天","主公技，锁定技，当其他群势力角色造成伤害后，若你拥有技能“鬼道”，你获得2枚“道兵”（每轮至多以此法获得4枚“道兵”）。",["主公技","锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋孙权","t":"江东大帝","k":"吴","kh":4,"mh":4,"g":"","s":[["制衡","出牌阶段限一次，你可以弃置任意张牌，然后摸等量的牌。若你以此法弃置了装备区里的牌，你多摸一张牌。",[]],["任贤","锁定技，若本局游戏牌堆未洗过牌，则你视为拥有“英姿”和“固政”。",["锁定技"]],["救援","主公技，出牌阶段限一次，你可以获得一名其他吴势力角色装备区里的所有牌，然后你回复1点体力。",["主公技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋甄姬","t":"薄幸幽兰","k":"魏","kh":3,"mh":3,"g":"女","s":[["洛神","当你失去最后一张红色手牌后，你可以展示牌堆顶的一张牌，然后若此牌为： ①黑色：重复此流程，且可以立即使用此牌； ②红色：获得此牌。",[]],["倾国","出牌阶段限两次，你可以将一张红色手牌交给场上的一名其他角色，然后令其交给你一张黑色牌。 当你成为其他角色【杀】或普通锦囊的目标时，你可以弃置一张黑色牌，令此牌对你无效。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋甘宁","t":"兴王定霸","k":"吴","kh":4,"mh":4,"g":"","s":[["奇袭","出牌阶段限一次，你可以选择一种花色，然后令一名其他角色声明一个此次未以此法声明过的花色，若此花色与其声明的花色： ①不同，重复此流程； ②相同，你弃置其区域里的X张牌（X为其声明花色的次数）。",[]],["奋威","出牌阶段限一次，你可以将至多三张牌分别置于等量名角色的武将牌上，称为“威”，然后你摸等量的牌。 有“威”的角色成为普通锦囊牌的目标时，你须选择一项： ①令其获得“威”； ②移去其“威”，此牌对其无效； ③移去其“威”，令其不可响应； ④移去其“威”，你摸一张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋关羽","t":"威震华夏","k":"蜀","kh":4,"mh":4,"g":"","s":[["威临","每回合限一次，你可以将一张牌当任意一种【杀】或【酒】使用，此牌目标角色与此牌颜色相同的手牌视为【杀】直到回合结束。 当你累计使用或打出7张及以上牌后，你可获得一张【水淹七军】。",[]],["夺首","锁定技，每回合你使用的首张红色牌无距离限制； 使用的首张基本牌无次数限制； 使用首张【杀】指定目标时，摸2X张牌（X为目标数）； 首次造成伤害后获得其一张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋黄月英","t":"足智多谋","k":"蜀","kh":3,"mh":3,"g":"女","s":[["集智","锁定技，当你使用非转化锦囊牌时，你摸一张牌，你使用锦囊牌无距离限制。",[]],["奇才","转换技，游戏开始时可自选阴阳状态。出牌阶段， 阳：每回合限两次，令你使用的下一张普通锦囊牌（除【无懈可击】外）可增加或减少一个目标； 阴：每回合限两次，你可以弃置一张基本牌，获得一张锦囊牌。",["转换技"]],["流马","出牌阶段结束时，你可以将至多X张手牌扣置于公用区上，称为“流马”（X为当前体力值，“流马”至多为5），你可以将场上的“流马”正常使用或打出。 每轮游戏开始时，若场上仅有你拥有“流马”，你可令一名其他角色获得“流马”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋夏侯氏","t":"燕语呢喃","k":"蜀","kh":3,"mh":3,"g":"女","s":[["樵拾","每回合限一次，你受到其他角色造成的伤害后，你可令你回复等同此次伤害值的体力，若如此做，该角色摸两张牌。",[]],["燕语","一名角色的出牌阶段开始时，你可以弃置一张牌。若如此做，此回合限两次，每当本回合的出牌阶段有与你弃置牌类别相同的其他牌进入弃牌堆时，你可令任意一名角色获得至多一张。若牌名也相同，则可重置并立即发动“燕语”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋姜维","t":"炎志灼心","k":"蜀","kh":4,"mh":4,"g":"","s":[["逐日","你的阶段结束时，若你本阶段手牌数变化过，你可以拼点，若你：①赢，你可以使用一张拼点牌；②没赢，你失去1点体力或失去此技能直到回合结束。",[]],["燃己","限定技，结束阶段，若你本回合使用过牌的阶段数： ①不小于体力值，你可以获得“困奋”； ②不大于体力值，你可以获得“诈降”。 若如此做，你将手牌数和体力值调整至上限，然后你不能回复体力直到杀死角色。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋周瑜","t":"炽谋英隽","k":"吴","kh":4,"mh":4,"g":"","s":[["融火","锁定技，有角色受到火焰伤害后，你下一次使用【火杀】或【火攻】额外指定1个目标，你使用【火杀】或【火攻】造成的伤害+X（X为全场势力数）。",["锁定技"]],["英谋","转换技，游戏开始时可自选阴阳状态。每回合限一次，当你对其他角色使用牌后，可选择其中一个目标： 阳：你摸牌至与其相同（最多摸5张），然后视为对其使用【火攻】； 阴：令全场手牌数最多的一名角色对其使用手牌中所有【杀】和伤害锦囊（没有需弃牌至与你相同）。 若其未因此受到伤害，你对其造成1点火焰伤害。",["转换技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋司马懿","t":"韬谋韫势","k":"魏","kh":3,"mh":3,"g":"","s":[["平辽","锁定技，当你使用【杀】指定目标时，不公开指定的目标。你攻击范围内的其他角色依次选择是否打出一张红色基本牌。若此【杀】的目标未打出基本牌，其本回合无法使用或打出手牌；若至少有一名非目标打出基本牌，你摸两张牌且此阶段出【杀】次数+1。",["锁定技"]],["权谋","转换技，游戏开始时可自选阴阳状态。出牌阶段每名角色限一次，你可以令攻击范围内一名其他角色交给你一张牌，阳：防止你此阶段下次对其造成的伤害；阴：此阶段你下次对其造成伤害后，可以对至多三名其他角色（该角色除外）各造成1点伤害。",["转换技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋孙尚香","t":"骄豪明俏","k":"吴","kh":3,"mh":3,"g":"女","s":[["枭姬","当你失去装备区里的一张牌后，你摸两张牌，然后你可以弃置场上的一张牌。",[]],["结姻","游戏开始时，你可选择一名其他角色令你与其获得“姻”标记，其获得“结姻”，然后你变更势力与其相同。 出牌阶段限一次，你可以交给有“姻”标记的其他角色一张手牌或将一张装备牌置入其装备区，然后自己回复1点体力，并摸一张牌。 拥有“姻”的角色阵亡时，你获得其区域内所有的牌。",[]],["返乡","限定技，出牌阶段，你可以获得有“姻”的其他角色装备区里的所有牌，然后移除场上所有的“姻”和“结姻”，你获得“舞剑”并修改势力为吴。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋马超","t":"阻戎负勇","k":"蜀","kh":4,"mh":4,"g":"","s":[["驭马","锁定技，你计算与其他角色的距离-1。当你失去装备区里的一张坐骑牌后，你摸两张牌。",["锁定技"]],["铁骑","你使用【杀】指定其他角色为目标后，你可令其本回合内非锁定技失效、无法响应此【杀】，并与你进行“谋弈”： ①直取敌营：你获得其一张牌； ②扰阵疲敌：你摸两张牌。 “谋弈”成功后，本回合出【杀】次数+1，然后你可以弃置一张手牌，获得一张【杀】。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋赵云","t":"七进七出","k":"蜀","kh":4,"mh":4,"g":"","s":[["龙胆","剩余可用X次（X初始为1且最大为3，每名角色的回合结束后X加1），你可以将一张基本牌当做任意基本牌使用或打出，若如此做，你摸一张牌。",[]],["识略","当你发动“龙胆”使用或打出【杀】、【闪】时，你可与对方进行谋弈： ①偃旗息鼓：获得一张非基本牌； ②胆壮心雄：增加一次“龙胆”次数。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋刘备","t":"雄才盖世","k":"蜀","kh":4,"mh":4,"g":"","s":[["仁德","出牌阶段开始时，你获得3个“仁”标记。 出牌阶段，你可以将任意张牌交给一名本阶段未获得过“仁德”牌的其他角色，然后你获得同等数量的“仁”标记（你至多拥有10个“仁”标记）。 每回合限一次，当你需要使用或打出基本牌或普通锦囊牌时，你可以移除2个（锦囊牌3个）“仁”标记视为使用或打出之。",[]],["章武","限定技，出牌阶段，你可以令本局游戏中所有获得过“仁德”牌的角色依次交给你X张牌（X为游戏轮数-1，且最大为3），若如此做，你回复3点体力，然后本回合结束前无法再发动“仁德”。",[]],["激将","主公技，出牌阶段结束时，你可以指定一名其他角色，并令另一名攻击范围内含有其的其他蜀势力角色选择一项： ①其视为对你指定的角色使用张【杀】； ②跳过下一个出牌阶段。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋徐晃","t":"径行截辎","k":"魏","kh":4,"mh":4,"g":"","s":[["断粮","出牌阶段各限一次，你可以摸一张牌并选择一项： ①将此牌当做【兵粮寸断】对其他角色使用且无距离限制，若其判定区有【兵粮寸断】则改为获得其一张牌； ②将此牌当作任意伤害牌使用。",[]],["势迫","结束阶段，你可以令一名其它角色，其与所有判定区有【兵粮寸断】的其他角色选择一项： ①交给你一张手牌； ②受到1点伤害。 若你以此法获得了牌，则你可以将其中任意张牌交给一名其他角色。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋吕蒙","t":"苍江一笠","k":"吴","kh":4,"mh":4,"g":"","s":[["克己","若你未于出牌阶段内使用或打出过【杀】，你可以跳过弃牌阶段并摸一张牌。",[]],["夺荆","出牌阶段限两次，你可以与一名其他角色进行“谋弈”： ①休养生息：获得目标角色一张牌并回复一点体力，然后你可以摸X张牌，并弃置等量的牌（X为已损失体力值）； ②白衣渡江：视为对目标使用一张不计次数且无视距离和防具的【杀】，然后本回合可额外使用一次【杀】，且使用或打出过的【杀】不影响“克己”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋袁绍","t":"高贵的名门","k":"群","kh":4,"mh":4,"g":"","s":[["乱击","出牌阶段，你可以将两张手牌当【万箭齐发】使用（不能使用本回合此前发动该技能已使用过的颜色）； 当其他角色打出【闪】响应【万箭齐发】时，你摸一张牌（每回合限五次）； 【万箭齐发】造成伤害后，你可以弃置受伤角色的一张牌或令其摸2张牌（每回合限五次）。",[]],["血裔","主公技，锁定技，你的手牌上限+X（X为群势力角色数的2倍）；当你使用牌指定群势力角色为目标后，你摸一张牌（每回合你以此法至多获得两张牌）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋于禁","t":"威严毅重","k":"魏","kh":4,"mh":4,"g":"","s":[["狭援","每轮限一次，其他角色濒死时，你可以弃置至多两张牌，令其回复等同于弃置牌数的体力。",[]],["节钺","准备阶段，你可以令一名其他角色摸一张牌，然后令其执行一次“军令”（军令一、军令二、军令三、军令四）。若其： ①执行，你摸一张牌； ②不执行，则你摸三张牌，然后其本回合受到的伤害+1。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋黄忠","t":"没金铩羽","k":"蜀","kh":4,"mh":4,"g":"","s":[["烈弓","若你未装备武器，你的【杀】只能当作普通【杀】使用或打出。你使用牌时或成为其他角色使用牌的目标后，若此牌的花色未被记录，则记录此花色。 当你使用【杀】指定唯一目标后，你可以亮出并获得牌堆顶的X张牌（X为你记录的花色数-1，且至少为0），每有一张牌花色与记录的花色相同，你令此【杀】伤害+1，且其不能使用已记录花色的牌响应此【杀】。若如此做，此【杀】结算结束后，清除记录的花色。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋曹操","t":"魏武大帝","k":"魏","kh":4,"mh":4,"g":"","s":[["奸雄","游戏开始时，你可以获得至多2枚“治世”标记（至多拥有2枚）；当你受到伤害后，你可以获得对你造成伤害的牌并摸2-X张牌（X为“治世”标记数），然后你可以增减1枚“治世”标记。",[]],["清正","出牌阶段限一次，你可以弃置手牌中3-X种花色的所有牌（X为“治世”标记数），并观看一名有手牌的其他角色的手牌，弃置其中一种花色的所有牌，若其被弃置的牌数小于你弃置的牌数，你对其造成1点伤害，然后你可以增减1枚“治世”标记。",[]],["护驾","主公技，每轮限一次，当你受到伤害时，你可以将此伤害转移给一名其他魏势力角色。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋黄盖","t":"轻身为国","k":"吴","kh":4,"mh":4,"g":"","s":[["苦肉","出牌阶段限一次，你可以失去1点体力并令你手牌上限和体力值上限+1，直到下回合开始。 当你回复体力后，“苦肉”视为未发动过。",[]],["诈降","锁定技，当你失去1点体力后，你摸3张牌；回合结束时，摸X张牌，你于每回合使用的前X张【杀】无距离和次数限制且不能被响应（X为你已损失的体力值的一半，向上取整）。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋董承","t":"汉室孤忠","k":"群","kh":4,"mh":4,"g":"","s":[["保驾","游戏开始时，选择一名其他角色。你与其每回合首次受到卡牌造成的伤害时，你可废弃1个装备栏防止此伤害，且此牌结算完毕后你获得之。",[]],["斗围","出牌阶段，你可弃置1张伤害牌，视为对任意名攻击范围内包含你的其他角色使用之，若其因此进入濒死，你回复1点体力并恢复1个装备栏，然后本回合此技能失效。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋曹洪","t":"奉令西迎","k":"魏","kh":4,"mh":4,"g":"","s":[["迎驾","锁定技，你对其他角色使用牌后，本回合你与其计算距离为1，然后若你与所有其他角色距离均为1，可获得一名其他角色所有手牌，然后交给其等量的牌。（每名角色每回合限一次）。",["锁定技"]],["险拒","出牌阶段限一次，你可获得攻击范围内所有角色1张牌，若如此做，出牌阶段结束时，你弃置攻击范围外角色数张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋刘协","t":"玉辂东归","k":"群","kh":3,"mh":3,"g":"","s":[["斩绊","出牌阶段限一次，你可以摸或弃至多三张牌，然后令所有其他角色将手牌数调整至与你相同。以此法弃牌的角色摸三张牌；以此法摸牌的角色弃置三张牌；手牌数没变化的角色受到你造成的1点伤害。",[]],["沉声","其他角色的回合结束时，若你和当前回合角色都不是手牌数唯一最多的角色，则你可以摸一张牌。",[]],["天承","你发动“斩绊”时，可以选择一名其他角色不成为“斩绊”的目标。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋法正","t":"洞人识心","k":"蜀","kh":3,"mh":3,"g":"","s":[["缜鉴","每轮开始时，你选择一名其他角色并秘密选择1种普通锦囊牌名，本轮内其使用普通锦囊牌时： ①若与你选择的牌名不同，你可令此牌增加或减少1个目标（目标数至少为1）。 ②若与你选择的牌名相同，你摸1张牌且此技能本回合失效。",[]],["悉性","出牌阶段限一次，你可以观看一名其他角色的手牌并获得其中1张牌，然后若你使用的下一张牌对其造成伤害，此技能视为未发动过。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"谋吴懿","t":"恤下媲子","k":"蜀","kh":4,"mh":4,"g":"","s":[["识变","每轮开始时，你可选择一名其他角色，本轮其攻击范围内的角色视为在你的攻击范围内，且你使用【杀】与普通锦囊牌可指定其攻击范围内的1名角色为额外目标。",[]],["庇部","你的上家和下家每回合首次成为其他角色使用的【杀】或普通锦囊牌的唯一目标时，你可摸1张牌并令此牌的目标改为你； 你的上家和下家每回合首次使用【杀】或普通锦囊牌结算完毕后，你可摸1张牌，然后可视为使用此牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP贾诩","t":"料事如神","k":"魏","kh":3,"mh":3,"g":"","s":[["缜略","你使用的普通锦囊牌不能被【无懈可击】响应；你不能成为延时类锦囊牌的目标。",["锁定技"]],["间书","出牌阶段限一次，你可以将一张手牌交给一名其他角色，然后选择另一名其他角色，令其与另一名角色拼点：赢的角色随机交给你一张牌，没赢的角色失去1点体力。若有角色因此阵亡，此技能视为未发动过。",[]],["拥嫡","限定技，出牌阶段，你可选择一名角色，若其体力值或体力上限是全场最少的，则回复1点体力或加1点体力上限；若其手牌数是全场最少的，则摸体力上限张牌（最多摸五张）。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP曹操","t":"踌躇的孤雁","k":"群","kh":4,"mh":4,"g":"","s":[["西向","出牌阶段各限一次，你可以将至少X张牌当一张无距离和次数限制的【杀】或【决斗】使用。此牌结算后，若目标角色体力值： ①大于你的手牌数，你摸一张牌； ②大于你的体力值，你回复1点体力，然后获得其一张牌。 （X为所有角色本回合已使用过基本牌的次数+1）",[]],["哀歌","觉醒技，一回合内第二次有角色进入濒死状态后，你失去“西向”，获得“逐北”，然后将手牌摸至与其体力上限相同、回复体力至与其体力上限相同。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP刘备","t":"","k":"群","kh":4,"mh":4,"g":"","s":[["逐义","每轮每项限一次： 1、你获得牌后，你可弃置一张牌令一名角色摸两张牌； 2、一名角色受到伤害时，你可弃置一张牌防止之； 3、一名角色的回合开始时，你可弃置一张牌令其获得一张基本牌，且此牌伤害或回复值+1。 当你一轮内执行了所有选项时，你可为“侠锋”增加一个基本牌牌名。",[]],["侠锋","每回合限一次，当你使用【杀】结算结束后，你可对场上体力值最高的一名角色造成1点伤害或令体力值最低的一名角色回复1点体力。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP姜维","t":"幼麒","k":"魏","kh":4,"mh":4,"g":"","s":[["困奋","结束阶段，你可以失去1点体力，然后摸两张牌，并可以视为对一名角色使用【火攻】。",[]],["逢亮","觉醒技，当你进入濒死状态时，你减1点体力上限并恢复体力值至3点，然后获得“挑衅”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP黄月英","t":"闺中璞玉","k":"群","kh":3,"mh":3,"g":"女","s":[["机巧","出牌阶段开始时，你可以弃置任意张非锦囊牌，然后你亮出牌堆顶两倍数量的牌，获得其中的锦囊牌，若其中没有锦囊牌，你获得1张锦囊牌。",[]],["玲珑","锁定技，若你的装备区里没有防具牌，你视为装备着【八卦阵】；若你的装备区里没有坐骑牌，你的手牌上限+1；若你装备区没有装备，你视为拥有“奇才”和“集智”.",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP太史慈","t":"北海酬恩","k":"群","kh":4,"mh":4,"g":"","s":[["击虚","出牌阶段限一次，你可令至多四名其他角色各猜测你的手牌区里是否有【杀】。猜错的角色，你弃置其一张牌，然后视为你对其使用一张杀；你获得X张牌，且本回合手牌上限+X（X为猜对的角色数+1）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP孟获","t":"勒格诗惹","k":"群","kh":4,"mh":4,"g":"","s":[["蛮王","出牌阶段，你可以弃置任意张牌依次执行前等量项： ①获得“叛侵”； ②摸一张牌； ③回复一点体力； ④摸两张牌并失去“叛侵”；若你如此做，直到你的下回合开始前，你拥有“祸首”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP徐晃","t":"","k":"魏","kh":4,"mh":4,"g":"","s":[["宽猛","每回合限一次，当你体力值变化后，若你不处于濒死状态，你可以摸两张牌并弃置任意张手牌，然后你可令一名其他角色摸或弃置X张牌。（X为选择其他角色时，场上与你手牌数相同的角色数）。",[]],["血奉","出牌阶段限一次，你可令一名其他角色执行一项： ①交给你一张基本牌且此牌伤害值或回复值+1； ②失去1点体力并令你回复1点体力。 然后你执行另一项。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP马超","t":"西凉的猛狮","k":"群","kh":4,"mh":4,"g":"","s":[["追击","锁定技，你计算与体力值小于等于你的角色的距离视为1，体力值大于等于你的角色无法响应你的【杀】。",["锁定技"]],["誓仇","当你使用【杀】指定目标后，你可以多选择至多X名的角色成为此【杀】的目标（X为你已损失的体力值+1）；若此【杀】没有造成伤害，你摸一张【杀】，此【杀】每造成一次伤害，你摸一张牌（每回合限三次）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP孙坚","t":"","k":"群","kh":4,"mh":4,"g":"","s":[["英毅","每轮开始时，你可以失去一半体力（向下取整且至少为1），令一名其他角色弃置所有黑色牌，你将这些牌依次当做【杀】对其使用直至造成伤害，然后你获得剩余的牌。若你未因此获得牌，本轮你对其使用【杀】无次数限制。",["锁定技"]],["烈志","锁定技，每回合限三次，你使用牌指定其他角色为唯一目标时，若其于本回合未受过你造成的伤害，你摸X张牌。（X为本回合烈志发动的次数）",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP庞德","t":"抬榇之悟","k":"魏","kh":4,"mh":4,"g":"","s":[["决死","出牌阶段，你可以弃置一张【杀】并选择你攻击范围内的一名其他角色，然后该角色弃置一张牌。若其弃置： ①不是【杀】且你的体力值小于等于该角色，你可以摸两张牌； ②【杀】，你视为对其使用【决斗】。",[]],["驭马","锁定技，你计算与其他角色的距离-1。当你失去装备区里的一张坐骑牌后，你摸两张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP庞统","t":"南州士冠","k":"吴","kh":3,"mh":3,"g":"","s":[["过论","出牌阶段限一次，你可展示一名其他角色的一张手牌。然后你可选择你的一张牌，若： ①其选择的牌点数小，你与其交换这两张牌，其摸一张牌，你回复1点体力； ②你选择的牌点数小，你与其交换这两张牌，你摸两张牌。",[]],["送丧","当其他角色死亡时，你可加1点体力上限并回复1点体力。",[]],["展骥","锁定技，当你于出牌阶段内因摸牌且并非因发动此技能而得到牌时，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP大乔","t":"韶光易逝","k":"吴","kh":3,"mh":3,"g":"女","s":[["言笑","出牌阶段，你可以将一张方块牌置于一名角色的判定区内，判定区内有“言笑”牌的角色下个判定阶段开始时，获得其判定区里的所有牌，并进行一次判定，若为红色，摸一张牌，若为黑色，本回合出杀次数+1。",[]],["国色","锁定技，当你失去方块牌时，摸一张牌。",["锁定技"]],["安娴","每当你使用【杀】指定目标时，你可以令其弃置一张手牌；当你成为【杀】的目标时，你可以弃置一张手牌使之对你无效，然后该【杀】的使用者摸一张牌，若你弃置的是方块牌，则视为对【杀】的来源使用一张【杀】（此杀不能触发安娴）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP甄姬","t":"薄幸的美人","k":"群","kh":3,"mh":3,"g":"女","s":[["惊鸿","准备阶段，你可以选择至多X名其他角色（X为场上存活角色数-1，最多为4），随机展示其一张手牌： ①若为黑色，你获得之（这些牌不计入你本回合的手牌上限）； ②若为红色，其弃置之。",[]],["洛神","你可以将一张黑色牌当【闪】使用或打出； 每轮限一次，你以此法使用或打出【闪】时，可以进行判定，若结果为： ①黑色，获得此牌，然后你可以重复此流程； ②红色，获得此牌，然后结束此流程。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP关羽","t":"汉寿亭侯","k":"魏","kh":4,"mh":4,"g":"","s":[["武圣","回合开始时，你获得一张红色牌，你可以将一张红色牌当【杀】使用或打出；你的非转化的红色【杀】伤害+1；你使用方块【杀】无距离限制。",[]],["单骑","觉醒技，当你累计使用和打出5张牌或造成6点伤害后，回满体力，立即获得“驭马”和“怒斩”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP曹仁","t":"鬼神之勇","k":"魏","kh":4,"mh":4,"g":"","s":[["伪溃","出牌阶段限一次，你可以失去1点体力并选择一名有手牌的其他角色，你观看其手牌：若其手牌中没有【闪】，则视为你对其使用【杀】（无次数限制），且本回合你计算与其的距离视为1；若其手牌中有【闪】，你获得其中一张牌并回复1点体力。",[]],["励战","回合结束阶段时，你可以令任意名已受伤的角色摸一张牌；然后其中每存在一名手牌数与体力值相等的角色，你摸1张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP张辽","t":"功果显名","k":"群","kh":4,"mh":4,"g":"","s":[["募兵","出牌阶段限一次，你可以观看牌堆顶的四张牌，然后你可以弃置任意张手牌，获得任意张展示的牌（你弃置的牌点数和不得小于你获得的牌的点数之和），将其余牌置入弃牌堆。",[]],["资取","每名角色每轮限一次，你对一名角色造成伤害时，你可防止此伤害，其选择一张点数最大的牌令你获得之。",[]],["调令","出牌阶段，你可以将任意张“募兵”牌交给一名其他角色，若以此法给出的牌点数连续且各不相同，你可以获得场上至多X名其他角色的各一张手牌（X为给出的“募兵”牌数-1）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP张郃","t":"倾柱覆州","k":"群","kh":4,"mh":4,"g":"","s":[["周旋","弃牌阶段开始时，你可将任意张手牌置于武将牌上（称为“旋”，“旋”最多为5）。当你使用或打出一张牌时，你摸一张牌，然后随机移去一张“旋”，若你的手牌不是场上唯一最多且X大于1，则改为摸X张牌，然后随机移去两张“旋”（X为“旋”的数量）；当你没有“旋”时，你可令使用的非装备牌结算后成为“旋”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP张飞","t":"","k":"蜀","kh":4,"mh":4,"g":"","s":[["咆哮","锁定技，你使用【杀】无次数距离限制，每回合第二张【杀】起伤害+1；第三张【杀】起无视防具且不可响应。",["锁定技"]],["虚吓","锁定技，你的【杀】被【闪】抵消后，你与目标各摸一张牌；你使用或打出【闪】后，摸一张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP孙策","t":"壮武命世","k":"群","kh":4,"mh":4,"g":"","s":[["连讨","出牌阶段开始时，你可以令一名其他角色选择一种颜色，然后你展示所有手牌并依次将此颜色的手牌当【决斗】对其使用，直到有一方进入濒死状态，然后你摸X张牌（X为你此法造成的伤害值）。若该角色未因此受到伤害，你摸一张牌、本回合手牌上限+1且不能使用【杀】。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP赵云","t":"常山的游龙","k":"群","kh":3,"mh":3,"g":"","s":[["龙胆","你可以将一张【杀】当【闪】、【闪】当【杀】使用或打出。",[]],["冲阵","当你发动【龙胆】时，你可以获得对方的一张手牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP孙尚香","t":"梦醉良缘","k":"蜀","kh":3,"mh":3,"g":"女","s":[["良助","当一名角色于其出牌阶段内回复体力后，你可以选择一项： ①摸一张牌； ②令其摸两张牌； ③获得其装备区的武器牌。",[]],["返乡","觉醒技，准备阶段，若你发动过“良助”，则你加1点体力上限，然后回复1点体力，失去“良助”并获得“枭姬”和“舞剑”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP祝融","t":"诗惹喜莫","k":"群","kh":4,"mh":4,"g":"女","s":[["蛮后","出牌阶段限一次，你可以摸任意张牌并依次执行等量的选项（至多为4）：①重铸一张牌；②弃置一张手牌；③弃置场上一张牌；④失去1点体力且“探乱”视为未发动过。",[]],["探乱","出牌阶段限一次，你可以使用一张本回合因弃置而进入弃牌堆的牌，若因此使用的牌被【无懈可击】抵消或对其他角色造成了伤害，蛮后视为未发动过。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP蔡文姬","t":"金璧之才","k":"魏","kh":3,"mh":3,"g":"女","s":[["陈情","每回合限一次，当一名角色进入濒死状态时，你可以令另一名角色摸五张牌，然后弃置四张牌，若花色各不相同，则其视为对处于濒死状态的角色使用一张【桃】。",[]],["默识","结束阶段，你可以将一张手牌当你出牌阶段内使用过的第一张基本牌或普通锦囊牌使用，然后你可以将一张手牌当你出牌阶段使用过的第二张基本牌或普通锦囊牌使用。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP小乔","t":"","k":"吴","kh":3,"mh":3,"g":"女","s":[["星舞","出牌阶段限一次，你可以翻面并弃置一张手牌，然后弃置一名其他角色装备区里的一张牌，并对其造成2点伤害（若为女性角色则改为1点伤害）。",[]],["落雁","锁定技，当你发动星舞后，直到你的下个出牌阶段开始前，你拥有“天香”和“红颜”。",["锁定技"]],["回眸","当你于回合外 使用打出红桃牌或发动天香时，你可以选择一名角色从背面翻至正面。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"SP貂蝉","t":"绝世的舞姬","k":"群","kh":3,"mh":3,"g":"女","s":[["离魂","出牌阶段限一次，你可翻面，并获得一名其他角色所有手牌。出牌阶段结束时，你须为该角色每1点体力分配给其一张牌。",[]],["翩仪","回合结束阶段开始时，你可以摸一张牌，如你处于翻面状态，则摸三张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"关索","t":"倜傥孑侠","k":"蜀","kh":4,"mh":4,"g":"","s":[["撷芳","锁定技，你计算与其他角色的距离-X，且你的手牌上限+X（X为全场女性角色数，且最少为1）。",["锁定技"]],["征南","每名角色限一次，当一名角色进入濒死状态时，你可以回复1点体力，然后摸一张牌并选择获得下列技能中的一个：“武圣”、“当先”和“制蛮”（若技能都已获得改为摸三张牌），若自己濒死，则回复体力和摸牌数+1。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"鲍三娘","t":"南中武娘","k":"蜀","kh":3,"mh":3,"g":"女","s":[["武娘","当你使用或打出【杀】时，你可以获得一名其他角色的一张牌。若如此做，其摸一张牌。（若你已发动许身，则关索也摸一张牌）",[]],["许身","限定技，当你进入濒死状态后，你可以回复1点体力并获得技能“镇南”，然后如果你脱离濒死状态且“关索”不在场，你可令一名其他角色选择是否用“关索”代替其武将并令其摸三张牌。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"文鸯","t":"万将披靡","k":"魏","kh":5,"mh":5,"g":"","s":[["膂力","每回合限一次，当你造成伤害后，你可以将手牌摸至与体力值相同或将体力回复至与手牌数相同。",[]],["仇决","觉醒技，每个回合结束时，若你的手牌数和体力值相差3或更多，你减1点体力上限并获得技能“背水”，然后“膂力”改为“在自己的回合时每回合限两次”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"留赞","t":"啸天亢声","k":"吴","kh":4,"mh":4,"g":"","s":[["奋音","你的回合内，每当有一种花色的牌本回合第一次进入弃牌堆后，你摸一张牌。",["锁定技"]],["力激","出牌阶段限零次，你可以弃置一张牌然后对一名其他角色造成一点伤害。你的回合内，本回合进入弃牌堆的牌每次达到“八”的倍数张时（存活人数小于5时改为“四”的倍数），此技能使用次数+1。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"郭照","t":"碧海青天","k":"魏","kh":3,"mh":3,"g":"女","s":[["偏宠","摸牌阶段，你可以改为从牌堆获得红色牌和黑色牌各一张，然后选择一项直到你的下回合开始： ①你每失去一张红色牌时摸一张黑色牌； ②你每失去一张黑色牌时摸一张红色牌。",[]],["尊位","出牌阶段限一次，你可以选择一名其他角色，并选择执行以下一项，然后移除该选项： ①将手牌数摸至与该角色相同（最多摸五张）； ②随机使用牌堆中的装备牌至与该角色相同； ③将体力值回复至与该角色相同。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"樊玉凤","t":"红鸾寡宿","k":"群","kh":3,"mh":3,"g":"女","s":[["把盏","转换技，出牌阶段限一次， 阳：你可以交给一名其他角色至多两张手牌； 阴：你可以获得一名其他角色至多两张手牌。 然后若这些牌里包括【酒】或红桃牌，你可令获得此牌的角色回复1点体力或复原武将牌。",["转换技"]],["醮影","其他角色获得你的手牌后，该角色本回合不能使用或打出与此牌颜色相同的牌。然后此回合结束阶段时，若其本回合没有再使用牌，你令一名角色将手牌摸至五张。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"阮瑀","t":"斐章雅律","k":"魏","kh":3,"mh":3,"g":"","s":[["兴作","出牌阶段开始时，你可以观看牌堆底的三张牌并用任意张手牌替换其中等量的牌。若如此做，结束阶段，你可以令一名有手牌的角色用所有手牌替换牌堆底的三张牌。",[]],["妙弦","若你的手牌中仅有一张：①黑色牌，你可将此牌当作任意普通锦囊使用（每回合限一次）；②红色牌，你使用此牌时摸一张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"何晏","t":"傅粉何郎","k":"魏","kh":3,"mh":3,"g":"","s":[["崖柴","当你受到伤害后，你可以令伤害来源选择一项： ①弃置一半数量的手牌（向上取整且至少一张）； ②本回合不能再使用手牌，然后令你摸两张牌； ③展示所有手牌，然后交给你手牌中一种花色的所有牌（至少一张）。",[]],["清谈","出牌阶段限一次，你可以令所有有手牌的角色选择一张手牌并同时展示之，然后你可以获得其中一种花色的牌，展示此花色的牌的角色各摸一张牌，且弃置其他展示的牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"潘淑","t":"神女","k":"吴","kh":3,"mh":3,"g":"女","s":[["织纴","你的回合内，当你使用第一张非转化的牌时，根据此牌名称字数，你可以依次执行以下选项： ①观看牌堆顶X张牌并以任意顺序放回牌堆顶或牌堆 底（X为此牌名称字数）； ②弃置场上一张装备牌和一张延时锦囊牌； ③回复1点体力； ④摸三张牌。",[]],["燕尔","当其他角色于其自己的出牌阶段失去最后的手牌时，你可以与其各摸两张牌（每回合限一次）。若你摸的两张牌类型相同，则“织纴”改为回合外也可发动直到你的下个回合开始；若该角色摸的两张牌类型相同，其回复1点体力。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"吕玲绮","t":"无双虓姬","k":"群","kh":4,"mh":4,"g":"女","s":[["帼武","出牌阶段开始时，你可以展示全部手牌，根据你展示的类型数，你获得对应效果： ①至少一类，从弃牌堆获得一张【杀】； ②至少两类，此阶段使用牌无距离限制； ③至少三类，此阶段使用【杀】或普通锦囊牌可以多指定两个目标。",[]],["妆戎","觉醒技，每个回合结束时，若你的体力值或手牌数为1，你减1点体力上限并回满体力，将手牌摸至体力上限，然后获得“神威”和“无双”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"张昌蒲","t":"矜严明训","k":"魏","kh":3,"mh":3,"g":"女","s":[["严教","出牌阶段限一次，你可以选择一名角色。从牌堆顶亮出三张牌，该角色选择并获得点数之和不大于总点数一半的牌（最少获得一张），你获得剩余的牌；若你选的是自己，则弃置剩余的牌。",[]],["省身","当你受到伤害后，你可以摸一张牌（若你的手牌数为全场最少，改为摸两张牌），令下一次发动“严教”亮出的牌数+1（若你的体力值为全场最少，改为+2）且至多+5。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"张琪瑛","t":"禳祷西东","k":"群","kh":3,"mh":3,"g":"女","s":[["法箓","当你失去1张手牌时，记录此牌花色（只记录最近3次）。当记录的3个花色相同时，你移除记录花色并从牌堆中获得其他3种花色的牌各1张；当记录的3个花色各不相同时，你移除记录花色并可令一名角色失去或回复1点体力。",[]],["真仪","锁定技，当“法箓”移除3个同花色后，你本局游戏使用此花色的牌无距离限制且不能被响应。当“法箓”移除3个各不相同的花色后，你本局游戏“点化”可观看的牌数+1（最多+4）。",["锁定技"]],["点化","准备阶段或结束阶段，你可观看牌堆顶1张牌，然后获得其中1张牌，其余牌以任意顺序放回牌堆顶。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"蒲元","t":"淬炼百兵","k":"蜀","kh":4,"mh":4,"g":"","s":[["天匠","游戏开始时，你随机获得两张不同副类别的装备牌，并置入你的装备区。出牌阶段，你装备区里的牌可以移动至其他角色的装备区并替换其原有装备，若你移动的是“铸刃”打造的装备，你摸两张牌。",[]],["铸刃","出牌阶段限一次，你可以弃置一张手牌。根据此牌的花色点数，你有一定概率打造成功并获得一张武器牌（若打造失败或武器已有则改为摸一张【杀】，花色决定武器名称，点数决定成功率）。此武器牌进入弃牌堆时，将其移出游戏。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"许劭","t":"识人读心","k":"群","kh":4,"mh":4,"g":"","s":[["评荐","你可以于以下时机发动“评荐”：出牌阶段限一次；结束阶段开始时；当你受到伤害后。随机出现三张拥有此时机可发动技能的武将牌，你选择其中一个武将并发动其技能。每个技能只能发动一次。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"杜夔","t":"律吕调阳","k":"魏","kh":3,"mh":3,"g":"","s":[["泛音","出牌阶段限一次，你可以亮出牌堆中点数最小的一张牌并选择一项： ①使用之（无距离和次数限制）； ②令你本回合使用的下一张牌可以多选择一个目标。 然后亮出牌堆中点数翻倍的一张牌并重复此流程。",[]],["配器","当你受到伤害后，你可以移动场上至多两张牌并摸一张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"夏侯玄","t":"玄隐山林","k":"魏","kh":3,"mh":3,"g":"","s":[["博玄","你使用手牌指定其他角色为目标结算完毕后，可展示牌堆底的3张牌，若展示牌中有牌与你使用的牌： ①牌名字数相同，你摸1张牌； ②花色相同，你可弃置一名其他角色1张牌； ③类型相同，你可使用1张展示牌。",[]],["议政","你的回合开始，你可与任意名其他角色各展示1张手牌，若展示的牌类型均相同，你可将这些牌交给其中一名角色，若类型不同，你弃置这些牌。",[]],["归林","限定技，出牌阶段或你进入濒死状态时，可回复满体力值，然后失去“议政”并修改“博玄”。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"阮籍","t":"命世大贤","k":"魏","kh":3,"mh":3,"g":"","s":[["昭文","出牌阶段开始时，你可以展示所有手牌。若如此做，你本回合： ①可以将其中的黑色牌当任意一张普通锦囊牌使用（每种牌名每回合限一次）； ②使用其中的红色牌时摸一张牌。",[]],["酒遁","你使用的【酒】的加伤效果不会因回合结束而消失；当你成为其他角色使用黑色牌的目标后，若你不处于【酒】的加伤状态，则你可以摸一张牌并视为使用一张【酒】，否则你可以弃置一张手牌令此牌对你无效。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"杜预","t":"文成武德","k":"群","kh":4,"mh":4,"g":"","s":[["武库","锁定技，当一名角色使用装备牌时，你获得1枚“武库”然后摸一张牌。（“武库”数至多为体力上限）",["锁定技"]],["三陈","觉醒技，当你的“武库”数为3时，你加1点体力上限，回复1点体力，然后获得“灭吴”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"刘晔","t":"佐世之才","k":"魏","kh":3,"mh":3,"g":"","s":[["破垣","游戏开始时或回合开始时，若你的装备区里没有【霹雳车】，则你可以将【霹雳车】置入你的装备区； 若你的装备区里有【霹雳车】，你可以弃置一名其他角色的至多2张牌。",[]],["画策","出牌阶段限一次，你可以将1张手牌当上一轮没有角色使用过的普通锦囊牌使用。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"文鸳","t":"揾泪红袖","k":"蜀","kh":3,"mh":3,"g":"女","s":[["铿锵","每回合限一次，当你使用伤害牌时，你可选择1项： ①摸X张牌且本回合不计入手牌上限（X为你的体力上限）； ②此伤害+1，且你获得造成伤害的牌。",[]],["匮饬","锁定技，回合结束时，若你本回合摸牌数和造成的伤害值均大于等于你的体力上限，你失去1点体力。",["锁定技"]],["殇决","觉醒技，你进入濒死状态时，将体力值回复至1点，加1点体力上限并获得“困励”，然后将“铿锵”改为每回合每项限一次。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"周不疑","t":"幼有异才","k":"魏","kh":3,"mh":3,"g":"","s":[["十计","一名角色的结束阶段，若其本回合未造成伤害，你可以声明一种普通锦囊牌，然后其可以将一张牌当你声明的牌使用。（每轮每种牌名限一次，其不能对自己使用此牌）",[]],["四论","准备阶段或当你受到伤害后，你可以摸4张牌，然后将4张牌依次置于场上或牌堆两端，装备区的牌数因此变化的角色复原其武将牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"许靖","t":"璞玉有瑕","k":"蜀","kh":3,"mh":3,"g":"","s":[["赏誉","锁定技，游戏开始时，你获得一张【杀】并标记之，然后可以将之交给一名角色。当此【杀】造成伤害后，你和使用者各摸一张牌；此【杀】进入弃牌堆后，你将之交给一名本回合未以此法指定过的角色。",["锁定技"]],["才瑕","当你造成或受到伤害后，你可以摸至多X张牌（X为游戏人数且至多为5。发动此技能后，你需累计使用了等量的牌才可再次发动）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"赵嫣","t":"霞蔚青歇","k":"吴","kh":3,"mh":3,"g":"女","s":[["锦绘","出牌阶段限一次，你可以随机亮出牌堆中三张不同名且仅指定单一目标的非伤害牌，然后选择一名其他角色，该角色选择并使用其中一张，然后你可以依次使用其余两张（目标不为自己的牌必须选择对方为目标，无距离和次数限制）。",[]],["轻幔","锁定技，每个回合结束时，你将手牌摸至X（X为当前回合角色装备区的空位数）。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"王朗","t":"凤鹛","k":"魏","kh":3,"mh":3,"g":"","s":[["鼓舌","出牌阶段，你可以用一张手牌与至多三名角色同时拼点，没赢的角色选择一项： ①弃置一张牌； ②令你摸一张牌。 若你没赢，获得一个“饶舌”标记。当你一回合内累计七次拼点赢时（每有一个“饶舌”标记，此累计次数减1，你有7个饶舌标记时，你死亡），本回合此技能失效。",[]],["激词","锁定技，当你的拼点牌亮出后，若此牌点数小于等于X，则点数+X（X为“饶舌”标记的数量）且你获得本次拼点中点数最大的牌。你死亡时，杀死你的角色弃置7-X张牌并失去1点体力。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"周夷","t":"靛情雨黛","k":"吴","kh":3,"mh":3,"g":"女","s":[["逐寇","当你于每个回合的出牌阶段第一次造成伤害后，你可以摸X张牌（X为本回合你已使用的牌数）。你的结束阶段，若你本回合没有造成伤害，你可以对两名其他角色各造成1点伤害。",[]],["氓情","觉醒技，准备阶段，若受伤角色数大于你的体力值，你加3点体力上限并回复3点体力，失去“逐寇”，获得“玉殒”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"曹金玉","t":"金乡公主","k":"魏","kh":3,"mh":3,"g":"女","s":[["隅泣","每回合限两次，当有角色受到伤害后，若你计算与其的距离其不大于0，你可以观看牌堆顶的3张牌，将其中至多1张交给受伤角色，获得至多1张牌，剩余的牌放回牌堆顶。",[]],["善身","当有角色死亡时，你可令“隅泣”中的一个数字+2（单项不能超过5）。若你没有对死亡角色造成过伤害，你回复1点体力。",[]],["娴静","准备阶段，你可令“隅泣”中的一个数字+1。（若你满体力值，则再令“隅泣”中的一个数字+1；单项不能超过5）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"刘徽","t":"周天古率","k":"群","kh":4,"mh":4,"g":"","s":[["割圆","锁定技，游戏开始时，将A~K的所有点数随机排列成一个圆环；有牌进入弃牌堆时，将满足圆环进度的点数记录在圆环内。 圆环完成后，你获得牌堆和场上所有完成此圆环最初和最后点数的牌，然后从圆环中移除这两个点数，重新开始圆环。",["锁定技"]],["解术","锁定技，非圆环内点数的牌不计入你的手牌上限。当你使用或打出牌时，若满足圆环进度点数，你摸一张牌。",["锁定技"]],["股算","觉醒技，每个回合结束时，若圆环点数为3个，你减1点体力上限，并修改“割圆”。",["觉醒技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"卢弈","t":"落子惊鸿","k":"群","kh":3,"mh":3,"g":"女","s":[["邀弈","锁定技，游戏开始时，给全场没有转换技的角色增加技能“手谈”。你发动“手谈”无需弃置牌且无次数限制。所有角色使用牌只能指定自己及与自己转换技状态不同的角色为目标。",["锁定技"]],["复学","准备阶段，你可以从弃牌堆中选择至多X张不是因使用而进入弃牌堆的牌获得。结束阶段，若你手中没有以此法获得的牌，你摸X张牌。（X为你的体力值）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"孙翊","t":"虎风快意","k":"吴","kh":5,"mh":5,"g":"","s":[["激峭","出牌阶段开始时，你可将牌堆顶X张牌置于武将牌上直到本阶段结束（x为你的体力上限）。你使用一张牌后，获得其中一张牌，然后若其余牌中两种颜色数量： ①相等，你回复1点体力； ②不等，你失去1点体力。",[]],["凶疑","限定技，当你处于濒死状态时，你可回复体力至3点并将角色替换为“徐氏”。若“徐氏”在场，改为回复体力至1点并获得“魂姿”。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"冯妤","t":"泣珠伊人","k":"群","kh":3,"mh":3,"g":"女","s":[["涕泣","其他角色的出牌阶段开始前，若其本回合摸牌阶段摸牌数不等于2，则你摸与超出或少于2等量的牌，然后可以令该角色本回合手牌上限增加或减少同样的数值。",[]],["宝梳","准备阶段，你可以选择至多X名角色（X为你的体力上限），这些角色各获得一个“梳”标记（有“梳”标记的角色摸牌阶段多摸与其“梳”等量的牌，然后移去其所有“梳”），你每少选一名角色，每名目标角色便多获得一个“梳”。获得“梳”的角色重置武将牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"孙翎鸾","t":"弦凤栖梧","k":"吴","kh":3,"mh":3,"g":"女","s":[["聆乐","锁定技，一名角色在一轮首次造成伤害后，你摸一张牌。若此时是该角色回合外，改为摸X张牌（X为本回合全场造成的伤害值）。",["锁定技"]],["盻睇","出牌阶段，你可以选择一名本回合未造成过伤害的其他角色，你此阶段使用的下一张牌，视为该角色使用。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"庞凤衣","t":"瞳悉万机","k":"蜀","kh":3,"mh":3,"g":"女","s":[["异瞳","锁定技，游戏开始时，你选择一种花色。每回合该花色的牌首次因使用而进入弃牌堆后，你随机获得与此花色不同花色的牌各一张。",["锁定技"]],["醅酿","你可以将一张“异瞳”选择花色的牌当无次数限制的【酒】使用。有角色进入濒死状态时，你可以对其使用【酒】。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"滕公主","t":"芳华荏苒","k":"吴","kh":3,"mh":3,"g":"女","s":[["幸宠","每轮游戏开始时，你可以摸任意张牌并展示任意张牌（摸牌和展示牌的总数不能超过你的体力上限且至多为5）。若如此做，本轮内当你失去一张以此法展示的手牌后，你摸两张牌。",[]],["流年","锁定技，牌堆第一次洗牌后，你于当前回合结束时加1点体力上限。牌堆第二次洗牌后，你于当前回合结束时回复1点体力，然后本局游戏手牌上限+10。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"杨婉","t":"融沫之鲡","k":"蜀","kh":3,"mh":3,"g":"女","s":[["诱言","出牌阶段限一次，你可以主动弃置任意张牌； 你的回合内，当你的牌因弃置进入弃牌堆后，你可以从牌堆中获得本次弃牌中没有的花色的牌各一张（出牌阶段、弃牌阶段各限一次）。",[]],["追还","结束阶段，你可以选择一名角色。直到该角色的下个准备阶段，此期间内对其造成过伤害的角色，若体力值： ①大于该角色，则受到其造成的2点伤害； ②小于等于该角色，则随机弃置两张手牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"张嫙","t":"玉宇嫁蔷","k":"吴","kh":4,"mh":4,"g":"女","s":[["同礼","出牌阶段，当你使用牌指定目标后，若你手牌中的花色数等于你此阶段已使用牌的张数，你可令此牌效果额外执行X次（X为你手牌中的花色数）。",[]],["奢葬","每回合限一次，当你或你回合内有角色进入濒死状态时，你可以从牌堆获得不同花色的牌各一张。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"孙茹","t":"呦呦鹿鸣","k":"吴","kh":3,"mh":3,"g":"女","s":[["撷翠","有角色在自己回合内使用牌首次造成伤害时，你可令此伤害+1。若该角色手牌数大于等于体力值，其获得此伤害牌且本回合手牌上限+1。",[]],["忧恤","一名角色回合结束时，若其手牌数大于体力值，你可以展示其一张手牌然后交给另一名角色。若获得牌的角色体力值全场最低，其回复1点体力。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"骆统","t":"蹇谔匪躬","k":"吴","kh":3,"mh":3,"g":"","s":[["仁政","锁定技，当有伤害被减少或防止后，你摸两张牌。",["锁定技"]],["进谏","当你造成伤害时，你可以令此伤害+1，若如此做，你此回合下次造成的伤害-1且不能发动“进谏”；当你受到伤害时，你可以令此伤害-1，若如此做，你此回合下次受到的伤害+1且不能发动“进谏”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"柳婒","t":"维情所止","k":"蜀","kh":3,"mh":3,"g":"女","s":[["经音","有角色于其回合外使用的【杀】进入弃牌堆后，你可令除使用者之外的一名角色获得此【杀】，且此牌无次数限制（每回合限一次）。",[]],["迟行","一名角色出牌阶段结束时，若此阶段有【杀】进入弃牌堆，你可摸等量的牌。若其中有【杀】你可使用其中1张。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"贾充","t":"始作俑者","k":"魏","kh":3,"mh":3,"g":"","s":[["悖逆","出牌阶段限一次，你可以将手牌调整至体力上限+1，然后依次选择两名角色，你令这两名角色的非锁定技本回合失效、第一名角色视为对第二名角色使用一张【杀】。",[]],["恃纵","当你需要使用一张基本牌时，你可以交给一名其他角色X张牌（X为此技能本回合发动次数），然后其可以将一张牌置于牌堆底，视为你使用之。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"滕芳兰","t":"铃兰零落","k":"吴","kh":3,"mh":3,"g":"女","s":[["落宠","每轮游戏开始时，你可弃置任意名角色区域内共计至多四张牌（若弃了同一名角色区域内超过两张牌，此技能可弃牌数-1）。",[]],["哀尘","锁定技，若牌堆牌数： ①大于80张，你发动“落宠”弃自己区域内的牌后摸2张牌； ②大于40张，你跳过弃牌阶段； ③小于40张，你不能响应黑桃牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"薛灵芸","t":"霓裳缀红泪","k":"魏","kh":3,"mh":3,"g":"女","s":[["霞泪","当你的红色牌进入弃牌堆后，你可观看牌堆顶的三张牌，然后你获得一张并可将其他牌置于牌堆底，你本回合观看牌数-1。",[]],["暗织","出牌阶段或当你受到伤害后，你可以进行一次判定，若结果为： ①红色，重置“霞泪”； ②黑色，你可以令一名非当前回合角色获得本回合进入弃牌堆的两张牌，且你本回合不能再发动此技能。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"芮姬","t":"柔荑弄钺","k":"吴","kh":4,"mh":4,"g":"女","s":[["妄缘","你在回合外失去牌后，可随机将牌堆中一张基本牌或锦囊牌置于武将牌上，称为“妄”。（不会随机到已有“妄”同名的牌，不能超过游戏总人数）",[]],["铃音","出牌阶段开始时，你可获得至多X张“妄”（X为游戏轮数）。若如此做，且剩余“妄”颜色相同，你本回合对其他角色造成伤害+1，且可将武器或防具牌当【决斗】使用。",[]],["俐影","你在摸牌阶段外获得牌后，可将这些牌交给一名其他角色，然后你摸一张牌。（每回合限一次，若此时是你的回合内，再增加一个“妄”）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"柏灵筠","t":"玲珑心窍","k":"魏","kh":3,"mh":3,"g":"女","s":[["灵慧","一名角色的结束阶段，若其为你或本回合有角色进入过濒死状态，你可以观看牌堆顶的三张牌，然后可以使用其中一张牌并随机获得剩余的一张。",[]],["黠策","每回合各限一次，当你受到伤害后，你可以令一名其他角色的所有非锁定技失效直到回合结束；当你造成伤害后，你可以弃置一张牌并回复1点体力。",[]],["御心","限定技，当一名角色进入濒死状态时，你可以令其回复体力至X点（X为你的体力值且至少为1）。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"孙寒华","t":"青丝慧剑","k":"吴","kh":3,"mh":3,"g":"女","s":[["汇灵","锁定技，你使用或弃置牌时，若弃牌堆中： ①红色牌较多，你回复1点体力。 ②黑色牌较多，可弃一名其他角色区域内的一张牌。 你使用牌时，若其颜色在弃牌堆中较少，你获得一个“灵”标记。",["锁定技"]],["冲虚","限定技，出牌阶段，若“灵”的数量大于等于4，你可以失去“汇灵”，增加等量点体力上限，获得“踏寂”和“青荒”。（增加的体力上限值不会超过牌局开始时的场上人数）",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"朱佩兰","t":"景皇后","k":"吴","kh":3,"mh":3,"g":"女","s":[["辞虑","你成为普通锦囊牌目标后，可以摸剩余选项数张牌（至少为1）。若你手牌数大于体力上限，你选择一项并移除该选项： ①此牌对你无效； ②防止此牌造成的伤害； ③此牌结算完毕后获得此牌。",[]],["痛悼","限定技，当你处于濒死状态时，你可以令一名角色技能还原为游戏开始时状态。若该角色不为你，你回复体力至与其相同。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星曹仁","t":"伏波四方","k":"魏","kh":4,"mh":4,"g":"","s":[["肃军","你使用一张牌时，若你手牌中基本牌与非基本牌的数量相等，可摸2张牌。",[]],["砺锋","将一张本回合未使用过的颜色的手牌当无次数限制的【杀】或【无懈可击】使用。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星董卓","t":"千里草的魔阀","k":"群","kh":5,"mh":5,"g":"","s":[["威凌","锁定技，当你于回合内对一名角色造成伤害时，若其本回合未受到过伤害，且你本回合使用的牌数不小于其体力值，你令此伤害+1。",["锁定技"]],["掌戎","准备阶段，你可以选择至多X名体力值或手牌数不小于你的角色，若其： ①体力值不小于你，其失去1点体力； ②手牌数不小于你，其弃置一张手牌。 选择完成后，你摸与选择角色数等量的牌。（X为你的体力值）",[]],["豪首","主公技，当其他群势力角色使用【酒】后，其可以令你回复1点体力。",["主公技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星袁术","t":"狂貔猖貅","k":"群","kh":4,"mh":4,"g":"","s":[["残玺","锁定技，游戏开始时，你获得场上各势力的“玺角”标记（每少1个“玺角”，则加1点体力上限）。 每轮开始时，你选择1枚“玺角”并选择一个效果生效直到下轮开始： ①妄生：与生效“玺角”势力相同的角色每回合首次造成的伤害+1，计算与其他角色的距离-1。 ②向死：与生效“玺角”势力相同的其他角色每回合首次回复体力后，失去1点体力；每回合对你使用的第一张牌对你无效。",["锁定技"]],["圮秩","锁定技，结束阶段，你摸X张牌。当一名角色死亡时，若其势力与生效“玺角”的势力相同或其为其势力最后一名角色，你失去该“玺角”，然后摸X张牌并回复1点体力（X为4-你当前拥有的“玺角”数）。",["锁定技"]],["冢骨","主公技，锁定技，若游戏轮数大于等于群势力角色数，你摸牌阶段摸牌数+2。",["主公技","锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星张昭","t":"忠危方直","k":"吴","kh":3,"mh":3,"g":"","s":[["忠言","出牌阶段限一次，你可展示牌堆顶三张牌，然后令一名角色将一张手牌交换其中一张牌。若如此做，且此时这些牌颜色相同，其回复1点体力或获得场上一张牌，然后若不是你，你执行另一项。",[]],["经纶","每回合限一次，你距离1以内的角色造成伤害后，你可以选择一项： ①令其摸X张牌并对其发动“忠言”； ②对其发动““忠言”并令其弃X张牌。 （X为其装备区牌数）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星袁绍","t":"熏灼群魔","k":"群","kh":4,"mh":4,"g":"","s":[["硝焰","游戏开始时，所有其他角色各受到你造成的1点火焰伤害，然后这些角色依次选择一项： ①交给你一张牌并回复1点体力； ②令你摸1张牌。",[]],["纵势","出牌阶段，你可以选择一张基本牌或普通锦囊牌，然后将此花色的所有其他手牌当此牌对选择的角色使用。此牌可指定的目标数改为以此法使用的牌数。然后摸X张牌。（X为以此法使用牌时少指的目标数）",[]],["骄妄","每轮结束时，若本轮没有角色死亡，则你可失去1点体力并发动“硝焰”。",[]],["傲势","主公技，其他群势力角色的出牌阶段限一次，其可以交给你一张手牌，然后你可以发动一次“纵势”。",["主公技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星张春华","t":"皑雪皎月","k":"魏","kh":3,"mh":3,"g":"女","s":[["梁燕","出牌阶段限一次，你可以选择一名其他角色，你摸/弃置至多两张牌，该角色弃置/摸等量的牌，以此法摸牌的角色跳过下一个弃牌阶段。",[]],["明慧","每回合结束时，若你的手牌数全场： ①最少，你可以视为使用一张无距离限制的【杀】； ②最多，你可以将手牌弃置至不为全场最多，然后令一名角色回复1点体力。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星法正","t":"定军佐功","k":"蜀","kh":3,"mh":3,"g":"","s":[["知机","准备阶段，你可以弃置任意张手牌，将手牌摸至五张。若你因此弃置的牌数： ①比摸牌数多，你可以对至多X名其他角色各造成1点伤害（X为弃置的牌数减摸牌数）； ②与摸牌数相等，你本回合使用牌不能被响应； ③比摸牌数少，你本回合手牌上限+2。",[]],["谙计","锁定技，有角色使用牌时，若此牌花色是本轮中使用次数最少，你摸1张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星荀彧","t":"怀忠念治","k":"魏","kh":3,"mh":3,"g":"","s":[["安庶","每轮开始时，你可以将弃牌堆中牌名不同的基本牌各一张置于牌堆顶，然后视为使用一张你选择的目标开始结算的【五谷丰登】。若如此做，本轮结束前，若有角色失去了以此法获得的牌，此回合结束时，你可以令其将手牌调整至X张（X为其体力上限且至多为5）。",[]],["匡祚","限定技，出牌阶段，你可以令一名角色获得“承奉”（若其为主公且没有主公技，则额外获得“统荫”），然后令另一名角色将每种花色各一张牌置于获得技能角色的武将牌上，称为“匡祚”。",["限定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星张让","t":"斗筲穿窬","k":"群","kh":3,"mh":3,"g":"","s":[["蠹害","当你成为其他角色使用牌的目标后，你可以选择一种花色，然后令其获得此花色的“蠹”。其回合结束时，若其有与“蠹”花色相同的手牌，其失去对应花色数点体力，然后弃对应花色的“蠹”且你摸剩余“蠹”数的牌。",[]],["令色","出牌阶段限一次，你可以交给一名其他角色一张牌，然后随机获得其与此牌类别相同的三张牌。若获得的牌数小于3，其视为对你使用一张【杀】，若此【杀】造成伤害，此技能视为未发动过。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星孙坚","t":"破虏将军","k":"群","kh":5,"mh":5,"g":"","s":[["锐军","出牌阶段，当你首次使用牌指定其他角色为目标后，你可以摸X+1张牌（X为你损失体力值）。若如此做，此阶段内，除该角色外其他角色均不在你的攻击范围内，你对其使用牌无距离限制，且每次你对该角色造成伤害时，伤害值均比上一次增加1（至多为5）。",[]],["刚毅","锁定技，回合结束时，若你本回合没有造成伤害，下回合出杀次数+1，你处于濒死状态时，【桃】或【酒】回复值+1。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星孙尚香","t":"鸳袖衔剑珮","k":"吴","kh":3,"mh":3,"g":"女","s":[["飒影","每轮每种牌名限一次，当你需要使用1张【杀】或【闪】时，你可以使用一张装备牌，然后视为使用之；当你需要使用1张【桃】或【酒】时，你可回收装备区里的一张牌，然后视为使用之。",[]],["骄豪","出牌阶段限一次，你可与一名其他角色拼点，然后你可以令拼点赢的角色获得拼点的牌或令其使用一张【杀】。若你赢，则你获得“枭姬”直到你的下个回合开始。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星丁奉","t":"廓清阶陛","k":"吴","kh":4,"mh":4,"g":"","s":[["荡尘","出牌阶段开始时，你可以令一名其他角色交给你至少1张牌，然后你可以弃置等量张牌。若你弃牌，本阶段内你使用【杀】或普通锦囊牌指定其为目标后，可以判定：若结果点数为X的整数倍，则此牌额外结算一次。（X为你的弃牌数）",[]],["翦羽","锁定技，其他角色于你的回合内每失去一张装备牌，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星甘宁","t":"铃震没羽","k":"群","kh":4,"mh":4,"g":"","s":[["锦帆","游戏开始和弃牌阶段开始时，你可以将任意张手牌置于武将牌上，称为“铃”。你可以如手牌般使用或打出“铃”。 当“铃”离开你的武将牌上时，你从牌堆中获得X张同花色的牌。（X为武将牌上铃的数量且至少为1，每种花色的“铃”至多各一张）",[]],["射却","一名其他角色的准备阶段，若其拥有装备牌，你可以对其使用一张无视防具且无距离限制的【杀】。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"星司马懿","t":"","k":"魏","kh":3,"mh":3,"g":"","s":[["狼顾","出牌阶段开始或你受到伤害时，你可以观看牌堆底5张牌，并将其中任意张牌与当前回合角色等量张手牌交换；然后你从牌堆底最后一张牌起获得花色相同且连续的牌，至多为5；若你以此法获得牌不足5张，你可移动场上的一张牌。",[]],["机变","每回合结束阶段时，若你本回合： ①发动过“狼顾”，你可查看并以任意顺序排列牌堆底的五张牌； ②未发动过“狼顾”，你可对你或当前回合角色造成1点伤害。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐蔡文姬","t":"胡笳十八拍","k":"群","kh":3,"mh":3,"g":"女","s":[["霜笳","锁定技，游戏开始时，你的初始手牌增加“胡笳”标记且不计入手牌上限。你每拥有一张“胡笳”，其他角色计算与你距离+1（最多+5）。 回合开始时，若你手中没有“胡笳”，本回合摸牌阶段获得的牌增加“胡笳”标记。",["锁定技"]],["悲愤","锁定技，当你失去“胡笳”后，你获得与手中“胡笳”花色均不同的牌各一张。你手中“胡笳”少于其他牌时，你使用牌无距离和次数限制。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐周妃","t":"芙蓉泣露","k":"吴","kh":3,"mh":3,"g":"女","s":[["灵箜","锁定技，准备阶段，你的所有手牌标记为“箜篌”；你每回合首次摸牌阶段外获得的牌标记为“箜篌”；“箜篌”牌不计入手牌上限。",["锁定技"]],["贤淑","出牌阶段，你可以交给一名其他角色一张“箜篌”并摸X张牌（X为你与该角色体力值之差且至少为1至多为5），若此牌为： ①红色，且该角色体力值小于等于你，该角色回复1点体力； ②黑色，且该角色体力值大于等于你，该角色失去1点体力。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐诸葛果","t":"玉笛朝真","k":"蜀","kh":3,"mh":3,"g":"女","s":[["羲笛","锁定技，游戏开始时，你的初始手牌增加“笛”标记且不计入手牌上限。准备阶段和结束阶段，你观看牌堆顶的X张牌（X为你手中”笛”牌张数且至少为1至多为8），然后以任意顺序放回牌堆顶或牌堆底。。",["锁定技"]],["乘烟","你使用【杀】或普通锦囊牌指定其他角色为目标后，可以摸一张牌并展示。 若展示牌为【杀】或普通锦囊牌，将使用牌的效果改为展示牌的效果；否则摸一张牌并标记为“笛”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐蔡邕","t":"焦尾识音","k":"群","kh":3,"mh":3,"g":"","s":[["焦尾","锁定技，游戏开始时，你的初始手牌增加“弦”标记且不计入手牌上限。当你失去“弦”后，防止你本回合下次受到的伤害。",["锁定技"]],["飞白","当你使用牌后，你可以从随机两张字数为X的牌中挑选一张获得（X为此牌与你本回合使用的上一张牌两张牌字数之和）。若发动此技能未获得牌，你摸两张牌并标记为“弦”，然后此技能本回合失效。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐大乔","t":"玉桐姊韵","k":"吴","kh":3,"mh":3,"g":"女","s":[["绮琴","锁定技，游戏开始时，你的初始手牌数量+1，这些牌标记为“琴”且不计入手牌上限。准备阶段，你获得弃牌堆中所有“琴”。",["锁定技"]],["姊希","出牌阶段开始时和结束时，你可将一张“琴”放置在一名角色的判定区。你使用基本牌或普通锦囊牌指定唯一目标后，可根据其判定区牌数执行以下效果： ①为1：此牌对其额外结算1次; ②为2：你摸2张牌或执行效果①； ③为3：弃置其判定区所有牌并对其造成3点伤害或执行效果②。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐小乔","t":"绿绮嫒媛","k":"吴","kh":3,"mh":3,"g":"女","s":[["绮琴","锁定技，游戏开始时，你的初始手牌数量+1，这些牌标记为“琴”且不计入手牌上限。准备阶段，你获得弃牌堆中所有“琴”。",["锁定技"]],["媦婉","出牌阶段限一次，你可以弃置一张“琴”并选择一名其他角色，随机获得其区域内与该“琴”不同花色的牌各一张。若你获得牌的张数为： ①1张：其失去1点体力； ②2张：你本回合对其使用牌无距离和次数限制； ③3张：你本回合无法对其使用牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐貂蝉","t":"檀声向晚","k":"群","kh":3,"mh":3,"g":"女","s":[["檀板","游戏开始和摸牌阶段结束时，你可为任意张手牌增加或去除“檀板”标记。“檀板”不计入你的手牌上限。",[]],["低讴","当你使用“檀板”结算结束后，你可以展示一张非“檀板”手牌，若展示了基本牌或普通锦囊牌，你视为使用之。若此牌为本回合首次以此法展示或与你使用的牌牌名相同，你摸两张牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"乐周瑜","t":"顾曲周郎","k":"吴","kh":3,"mh":3,"g":"","s":[["顾音","锁定技，你没有初始手牌，其他角色的初始手牌+1。其他角色失去初始手牌后，你摸一张牌。",["锁定技"]],["平虏","出牌阶段，你可以随机获得攻击范围内每名角色各一张手牌，然后你此阶段不能再发动此技能直到这些牌离开你的手牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威孙权","t":"坐断东南","k":"吴","kh":4,"mh":4,"g":"","s":[["斡衡","出牌阶段或当你受到伤害后，你可令一名其他角色摸或弃置X张牌（X为此技能本轮发动次数）。此技能结算后，若其手牌数与你不同或X大于3，你摸2张牌且此技能本回合失效。",[]],["御麾","结束阶段，选择一名其他吴势力角色，其出牌阶段开始时可选择交给你一张红色基本牌并发动一次X为1的“斡衡”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威吕布","t":"虓虎叱北地","k":"群","kh":5,"mh":5,"g":"","s":[["骁武","出牌阶段限一次，你可弃置一张牌，然后从牌堆获得1张牌面信息中有【杀】字的牌（不计次数）。当你造成伤害后，此技能视为未发动过且本回合获得牌张数改为2张。",[]],["霸关","连招技（单目标牌+武器牌），你可以将至多X张手牌当一张【杀】使用（X为你武器牌字数）。此【杀】基础伤害等于你以此法转化牌数。",["连招技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威曹操","t":"山海归心","k":"魏","kh":4,"mh":4,"g":"","s":[["掇月","出牌阶段开始时，你可进行至多三次拼点，你可令赢的角色摸当前拼点次数张牌。若你赢，你可改为对一名角色造成1点伤害并终止后续拼点。",[]],["军合","准备阶段，你可展示任意张颜色或类别相同的牌并获得“军合”效果： ①下X次造成伤害时，可弃置一张与展示牌颜色或类别相同的牌令此伤害+1； ②下X次受到伤害后摸两张牌。（X为你展示的牌数+1）",[]],["雄威","你和魏势力角色拼点后，你获得其拼点的牌。若如此做，且该角色没有“军合”效果，则你可以将任意次数的“军合”转移给该角色。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威孙策","t":"勇冠三江势","k":"吴","kh":5,"mh":5,"g":"","s":[["猘锋","每回合限X次（X为游戏人数），若你的手牌数： ①大于体力值，你可以将任意张黑色牌当无次数限制的【酒】使用； ②小于体力值，你可以将一张红色牌当无距离限制的任意【杀】使用或打出，然后将手牌摸至体力上限； ③等于体力值，你可以将任意张牌当【决斗】对至多两名角色使用。",[]],["威靖","其他吴势力角色的回合开始时，你可以选择一项： ①对其造成1点伤害； ②令其交给你一张牌，然后其可以发动一次“猘锋”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威刘备","t":"志昭义烈","k":"蜀","kh":4,"mh":4,"g":"","s":[["烈骧","出牌阶段限一次，你可以摸至多5张牌并对一名其他角色造成1点伤害，若你的手牌数： ①大于该角色，本回合你出【杀】次数+1且可交给一名其他角色至多X张牌； ②等于该角色，你获得其1张牌且其下回合使用的前X张牌无效； ③小于该角色，你失去X点体力，本回合此技能修改为“出牌阶段限两次”且可额外选择X名其他角色。 （X为你选择的摸牌数）",[]],["仁彀","其他蜀势力角色出牌阶段限一次，其可弃置1张牌并令你回复1点体力，然后你可令其发动一次至多摸2张牌的“烈骧”。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-限","n":"威孙尚香","t":"巽荷绽情","k":"吴","kh":3,"mh":3,"g":"女","s":[["淑任","出牌阶段限一次，你可废除一个装备栏，亮出牌堆顶三张牌，你选择其中一张牌获得并可选择一名其他角色获得其中一张牌，若此装备栏有牌则此技能视为未发动过并恢复1点体力。",[]],["飒然","你的装备区每有一张牌，你出牌阶段可使用杀次数+1。你受到或造成一点伤害后，从牌堆或弃牌堆中随机使用一张装备牌，若有废除的装备栏可先选择一个装备栏恢复。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"念孙权","t":"","k":"吴","kh":4,"mh":4,"g":"","s":[["权衡","每回合限一次，出牌阶段或受到致命伤害时，你可进行一次“权衡”，成功后可令场上至多X名角色回复或流失1点体力。 若此次权衡填满了所有的地块，则重置所有地块且本回合“念影”无次数限制，然后你可令场上的一名角色回复4点体力并摸4张牌。 （X为权衡游戏中，本次单侧放入的格子数的一半向上取整）",[]],["任才","每回合限一次，任意角色重铸牌时，你可从因此进入弃牌堆的牌中选择一张牌立即使用，然后获得剩余的牌。",[]],["念影","每回合限一次，当有角色回复体力或流失体力后，你可选择一项“念影”执行（权御天下外的每局限一次）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"念诸葛亮","t":"迟暮的丞相","k":"蜀","kh":3,"mh":3,"g":"","s":[["定乱","每回合限一次，你的回合开始时或你受到伤害时，你可以进行一次“定乱”（每个势力限成功一次），成功后你增加一点体力上限和体力，并将场上对应势力的角色全部修改为蜀势力。",[]],["燎原","出牌阶段限一次，你可以视为使用一张【火攻】；你使用【火攻】可以指定任意名角色为目标。",[]],["念影","若满足（非魏蜀吴群神的势力不计算）： ①你的回合开始时，场上角色势力均为蜀； ②任意角色回合结束时，本回合场上蜀势力角色数发生过变化。 则你可以摸两张牌并选择一项“念影”执行（奖率三军外的每局限一次）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"念吕布","t":"武的化身","k":"群","kh":5,"mh":5,"g":"","s":[["踏阵","锁定技，回合开始时，进行一次“踏阵”，成功后摸一张【杀】并获得“无双”直到你的下回合开始，若你本次“踏阵”过程未路经： ①一整列，令“踏阵”中击败的角色依次选择一张牌令你获得； ②一整行，依次视为对“踏阵”中击败的角色使用一张无次数、距离限制的【杀】。 ③中心格，直到你的下回合开始前，“踏阵”中击败的角色不能对你使用【杀】。",["锁定技"]],["斗破","锁定技，你的【决斗】可额外指定至多两个目标，且你的【决斗】改为“令目标角色依次打出一张【杀】，若：均打出，你需选择打出一张【杀】并重复此【决斗】流程，或受到首个目标角色造成的1点伤害；有角色未打出，你立即对未打出的角色造成1点伤害。此【决斗】结算后你依次获得决斗失败的角色随机一张手牌”。",["锁定技"]],["念影","每回合限一次，当你本回合造成或受到累计2点及以上伤害时，你可选择一项“念影”执行（斗破千军外的每局限一次）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"念周瑜","t":"大都督","k":"吴","kh":4,"mh":4,"g":"","s":[["溯洄","每轮限一次，任意角色回合结束时，你可进行一轮“奏乐”，根据结果令其回溯至本回合的某一阶段： ①3枚同名音符，回到弃牌阶段； ②4枚同名音符，回到出牌阶段； ③5枚同名音符，回到准备阶段； （实际为依次执行对应阶段） 然后令目标角色获得其从本回合进入弃牌堆的所有手牌且本回合手牌上限+X。（X为本次奏乐时的同名音符数量）",[]],["重奏","锁定技，每种类型每回合限一次，你首次使用或打出任意同名牌后，立即获得一张不同类型的牌，并令下轮奏乐时即兴次数+1。",["锁定技"]],["念影","任意角色回合结束时，若其本回合使用或打出了至少2组同名牌，你可选择一项“念影”执行（江东双壁外的每局限一次）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"念曹丕","t":"霸业的继承者","k":"魏","kh":3,"mh":3,"g":"","s":[["登极","每回合限一次，游戏开始或你受到伤害后，你可进行一次“登阶”。",[]],["念影","每回合限一次，摸牌阶段外获得手牌时，你可选择一项“念影”执行（恣意而为外的每局限一次）。",[]],["承命","出牌阶段，你可以重铸X张同花色的牌，然后获得一张指定花色的牌。（X为本回合承命发动的次数+1，可重铸和指定的花色种类由登阶中击败的目标决定）。",[]],["颂威","主公技，当其他魏势力角色的判定牌生效后，其可以令你摸一张牌。",["主公技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战赵云","t":"","k":"蜀","kh":4,"mh":4,"g":"","s":[["龙战","战场技，你累计使用或打出X张非虚拟牌后，你进入“长坂坡战场”。 “长坂坡战场”下，你手中的【杀】和【闪】视为【杀/闪】牌且出杀次数+X。 当此牌当作【杀】使用或打出时，你可以获得一名其他角色的一张牌； 当此牌当作【闪】使用或打出后，你可以视为对一名其他角色使用一张【杀】。 累计使用或打出X张【杀/闪】牌后退出战场。 （X为本局游戏中进入战场的次数，最少为1且最大为7）",["锁定技","战场技"]],["沥血","锁定技，每当任意角色： ①进入战场时，你获得1点护甲（至多为5）； ②退出战场时，你摸2张牌。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战袁绍","t":"","k":"群","kh":4,"mh":4,"g":"","s":[["迫战","战场技，游戏开始时，选择2到5之间的一个点数，称之为“迫”，当你累计失去6-X张牌后，进入界桥战场。界桥战场下，全场角色累计使用或打出X张【杀】之后，你可摸4张牌并令当前回合角色立即发动一次“乱击”，然后退出界桥战场并重新选择“迫”。（X为“迫”的点数）",["锁定技","战场技"]],["合斗","每回合各限一次，当任意角色使用多目标锦囊牌指定目标后，你可以选择一项： ①令此牌对其中一个目标生效两次且对其余目标无效； ②令此牌对其中一个目标无效且进入弃牌堆后获得此牌。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战姜维","t":"","k":"蜀","kh":4,"mh":4,"g":"","s":[["毅略","出牌阶段限一次，你可选择一项： ①选择一名角色，令其对一名你指定的其他角色发动“挑衅”； ②展示牌堆顶的五张牌并选择至多5名角色，依次获得其中一张牌，其余牌放回牌堆顶，然后获得【杀】的角色可立即使用之。 若有角色因此使用或弃置了【杀】，你失去1点体力。",[]],["锲志","锁定技，当你的体力值减少后，你摸X张牌；出牌阶段限5次，当你的体力值回复后，可弃置一张牌令“毅略”本阶段发动次数+1。（X为你当前已损失体力值）",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战吕蒙","t":"","k":"吴","kh":4,"mh":4,"g":"","s":[["暗渡","战场技，你的回合开始时或任意角色的弃牌阶段未弃牌时，进入“江陵战场”，令场上所有角色获得“克己”，直至其下回合结束； 场上角色失去“克己”时，你摸一张牌； 最后一个角色失去“克己”时，退出“江陵战场”。 “江陵战场”下，其他角色回合结束时，若其本回合： ①发动过“克己”，你可获得其所有的【杀】； ②未发动“克己”，你可获得其一张牌并视为对其使用一张【杀】。",["锁定技","战场技"]],["明探","准备阶段，你可以视为对一名其他角色使用至多X张【过河拆桥】并摸X张牌；然后，所有拥有“克己”的角色需对其使用一张【杀】或失去“克己”。（X为拥有“克己”的角色数且至少为1，至多为5）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战马超","t":"威震西凉","k":"群","kh":4,"mh":4,"g":"","s":[["荡锋","每个角色回合结束时，你依次执行以下效果： ①若本回合没有角色受伤，你获得一张【杀】； ②若本回合没有角色使用过【杀】，你可使用一张【杀】。",[]],["骇击","锁定技，你使用【杀】指定目标后，你本轮计算与其他角色距离-1。若此【杀】目标均在你距离1以内，你摸一张牌；若你计算与所有其他角色的距离均为1以内，此【杀】拥有“铁骑”效果。 每回合首张【杀】可额外指定一个目标。",["锁定技"]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战陆逊","t":"儒生雄才","k":"吴","kh":4,"mh":4,"g":"","s":[["蓄锐","战场技，一名角色的手牌数为0时，切换至“夷陵战场”。 “夷陵战场”下，当前回合角色使用牌指定其他角色为唯一目标时，若你手牌数为全场最少，你可以选择一项并发动一次“连营”： ①此牌结算后对目标角色的上家造成1点火焰伤害； ②此牌结算后对目标角色的下家造成1点火焰伤害； ③此牌造成的伤害+1且改为火焰伤害。 任意角色造成火焰伤害后，若本回合造成的火焰伤害数大于2点，则退出“夷陵战场”。",["锁定技","战场技"]],["势节","每轮游戏开始时，若你没有“势”，你可以将任意张手牌置于武将牌上，称为“势”。经过X个回合后，获得所有“势”并摸等量的牌。（X为武将牌上“势”的数量）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战典韦","t":"古之恶来","k":"魏","kh":5,"mh":5,"g":"","s":[["创烈","战场技，一名角色使用牌时，若其为本回合第三次指定其中一名目标角色为目标，你进入“宛城战场”。当你在“宛城战场”下： ①其他角色成为【杀】的唯一目标时，若使用者不为你，你可将此【杀】的目标更改为你； ②未造成伤害的【杀】结算完毕后，你可对此【杀】使用者或其中一个目标发动一次“强袭”； ③当你进入濒死状态时，则你回复2点体力并退出“宛城战场”。",["锁定技","战场技"]],["狂戟","游戏开始时，你可以将至多两张手牌置于牌堆顶，然后从牌堆底获得等量张武器牌。 每回合限一次，你可以将一张武器牌以如下方式使用或打出： ①视为使用X张无次数限制的【杀】； ②视为使用一张【闪】，然后摸X张牌。 （X为此武器攻击范围的一半，向上取整）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战张辽","t":"掩其无备","k":"魏","kh":4,"mh":4,"g":"","s":[["飚袭","战场技，每阶段限一次，任意角色于其出牌阶段失去至少2张基本牌后，你进入合肥战场；合肥战场下，任意角色使用【杀】结算结束后，你可令你或被杀的角色立即执行一次“突袭”（可获得场上至多两名其他角色各1张牌），若该角色因此手牌数成为全场唯一最多，立即退出合肥战场。",["锁定技","战场技"]],["破阵","当其他角色的牌进入你的手牌区或装备区后，你可以重铸至多等量的牌，若被重铸的牌中包含： ①基本牌：本回合出杀次数+1； ②非基本牌：下个摸牌阶段摸牌数+1（至多+5）。",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"战黄忠","t":"老当益壮","k":"蜀","kh":4,"mh":4,"g":"","s":[["定军","战场技，任意角色使用非虚拟【杀】造成1点伤害后，士气+1；士气每增加1点摸1张牌，达到X层时，切换至“定军山战场”，“定军山战场”下，任意角色使用【杀】时你可消耗2层士气令其视为拥有“烈弓”；每个结束阶段，若士气为0，则退出“定军山战场”（X为本局游戏人数）。",["锁定技","战场技"]],["力斩","出牌阶段，你可以将至少两张【杀】当作一张【杀】使用且令此【杀】伤害改为X；目标角色响应此【杀】时每张【闪】仅可抵消1点伤害，最多可使用X张【闪】；以此法造成伤害后，你可视为对另一名角色使用一张唯一目标无距离次数限制的伤害类牌。(X为【杀】的数量且至多为5）",[]]],"r":[]},{"p":"欢乐","sp":"欢乐-专","n":"隐贾诩","t":"","k":"群","kh":3,"mh":3,"g":"","s":[["隐策","每轮开始时，你可以交给场上至多3名角色各一张牌并摸等量的牌。 此牌会被隐藏所有信息，可在出牌阶段选择一名角色并使用（无次数距离限制），拥有此 const G = DATA.generals, PKGS = DATA.packages, KDS = DATA.kingdoms, TAGS = DATA.tags;
const PAGE = 40;

const state = {q:'', view:'general', pkg:new Set(), kd:new Set(), tag:new Set(), hp:new Set(), ls:new Set(), ar:new Set()};
let list = [], cursor = 0, timer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kdClass = k => (['魏','蜀','吴','群','神','晋','秦','魔'].includes(k) ? k : '其他');

function qGroups(){
  return state.q.trim().toLowerCase().split(/。+/)
    .map(part => part.trim().split(/\s+/).filter(Boolean))
    .filter(grp => grp.length);
}
/* 高亮用：所有关键词去重合并（括号限定、技能板不参与高亮） */
function tokens(){
  const out = [];
  qSeq().forEach(grp => grp.forEach(t => {
    if(t.sub || t.bd) return;
    if(out.indexOf(t.low) === -1) out.push(t.low);
  }));
  return out;
}
/* 匹配：以「。」分成若干组，组内空格=同时满足，组间=或 */
function qHit(hay){
  const gs = qGroups();
  if(!gs.length) return true;
  return gs.some(grp => grp.every(t => hay.indexOf(t) !== -1));
}
function hl(text){
  let h = esc(text); const ts = tokens();
  ts.forEach(t=>{
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
    h = h.replace(re, '<mark>$1</mark>');
  });
  return h;
}
function hit(all, ts){ return ts.every(t => all.indexOf(t) !== -1); }

function genHay(g){
  let s = [g.n, g.t, g.sp, g.p, g.k, g.g].join('\u0001');
  g.s.forEach(k => { s += '\u0001' + k[0] + '\u0001' + k[1]; });
  g.r.forEach(k => { s += '\u0001' + k[0] + '\u0001' + k[1]; });
  return s.toLowerCase();
}

const JIE_PKG = '界限突破';
const MOU_PKG = '各服谋将';
/* 筛选按键顺序：真实扩展包去掉「界限突破」，末尾依次补「界限突破」「各服谋将」 */
const PKG_CHIPS = PKGS.map(p => p.n).filter(n => n !== JIE_PKG).concat([JIE_PKG, MOU_PKG]);
const VIRT_PKG = { '界限突破':'界', '各服谋将':'谋' };
function pkgHit(g){
  if(!state.pkg.size) return true;
  const real = [], virt = [];
  state.pkg.forEach(n => { (VIRT_PKG[n] ? virt : real).push(n); });
  if(real.length && real.indexOf(g.p) === -1) return false;
  if(virt.length){
    const nm = String(g.n);
    if(!virt.some(v => nm.indexOf(VIRT_PKG[v]) === 0)) return false;
  }
  return true;
}
const HP_CHIPS = [1,2,3,4,5,6,7,8,'9+'];
const LS_CHIPS = [0,1,2,3,4,'5+'];
const AR_CHIPS = [0,1,'2+'];
function hpLabel(v, kind){
  if(kind === 'ar') return v === 0 ? '0' : String(v);
  return String(v);
}
function valHit(sel, v){
  if(!sel.size) return true;
  let hit = false;
  sel.forEach(x => {
    const isOpen = (typeof x === 'string' && x.slice(-1) === '+');
    if(isOpen){ if(v >= parseInt(x, 10)) hit = true; }
    else if(v === Number(x)) hit = true;
  });
  return hit;
}
function hpCount(kind, v){
  let n = 0;
  G.forEach(g => {
    const val = kind === 'hp' ? g.kh : kind === 'ls' ? (g.mh - g.kh) : (g.ar || 0);
    if(valHit(new Set([v]), val)) n++;
  });
  return n;
}
function hpRowsHit(g){
  if(!valHit(state.hp, g.kh)) return false;
  if(!valHit(state.ls, g.mh - g.kh)) return false;
  if(!valHit(state.ar, g.ar || 0)) return false;

function baseGenOK(g){
  if(!hpRowsHit(g)) return false;
  if(!pkgHit(g)) return false;
  if(state.kd.size && !state.kd.has(g.k)) return false;
  if(state.tag.size){
    const all = g.s.concat(g.r);
    if(!all.some(k => k[2].some(t => state.tag.has(t)))) return false;
  }

}
function baseSkillOK(g, k){
  if(!hpRowsHit(g)) return false;
  if(!pkgHit(g)) return false;
  if(state.kd.size && !state.kd.has(g.k)) return false;
  if(state.tag.size && !(k[2].some(t => state.tag.has(t)))) return false;

/* ---- 搜索串解析：技能板视为一个整体 token ---- */
let _qSeqCache = {q: null, seq: []};
/* 关键词是否为技能板名；是则返回技能板键，否则 null */
function boardOf(t){
  const k = String(t == null ? '' : t).trim();
  if(!k) return null;
  if(BOARDS[k]) return k;
  if(SPECIAL_ALIAS[k]) return SPECIAL_ALIAS[k];
  const low = k.toLowerCase();
  for(const name in BOARDS){
    if(name.toLowerCase() === low) return name;
    if(SPECIAL_ALIAS[name] && String(SPECIAL_ALIAS[name]).toLowerCase() === low) return name;
  }
  for(const al in SPECIAL_ALIAS){
    if(al.toLowerCase() === low) return SPECIAL_ALIAS[al];
  }
  return null;
}
/* 括号（…）内为次级扩展包限定，可只写片段，如（山河煮酒）刘备、（界）仁德 */
function bracketSubs(part){
  const out = [];
  const rest = part.replace(/[（(]([^）)]*)[）)]/g, function(m, inner){
    const v = String(inner == null ? '' : inner).trim();
    if(v) out.push(v.toLowerCase());
    return ' ';
  });
  return {subs: out, rest: rest};
}
function parsePart(p){
  const r = bracketSubs(p);
  const toks = [];
  r.subs.forEach(function(v){ toks.push({raw: '（' + v + '）', low: v, bd: null, sub: v}); });
  r.rest.trim().split(/\s+/).filter(Boolean).forEach(function(t){
    toks.push({raw: t, low: t.toLowerCase(), bd: boardOf(t), sub: null});
  });
  return toks;
}
function qSeq(){
  if(_qSeqCache.q === state.q) return _qSeqCache.seq;
  const seq = state.q.trim().split(/。+/)
    .map(function(p){ return parsePart(p); })
    .filter(function(grp){ return grp.length; });
  _qSeqCache = {q: state.q, seq: seq};
  return seq;
}
function anyBoard(){
  let found = null;
  qSeq().forEach(grp => grp.forEach(t => { if(t.bd && !found) found = t.bd; }));
  return found;
}
function qOnlyBoard(){
  const seq = qSeq();
  return seq.length === 1 && seq[0].length === 1 && !!seq[0][0].bd;
}
const _bdGen = {};
function bdGenSet(key){
  if(!_bdGen[key]){
    const set = new Set();
    (BOARDS[key] || []).forEach(it => set.add(it[0] + '|' + it[1] + '|' + it[2]));
    _bdGen[key] = set;
  }
  return _bdGen[key];
}
const _bdSk = {};
function bdSkillIndex(key){
  if(!_bdSk[key]){
    const map = new Map();
    (BOARDS[key] || []).forEach((it, i) => {
      const k = it[0] + '|' + it[1] + '|' + it[2] + '|' + it[3];
      if(!map.has(k)) map.set(k, i);
    });
    _bdSk[key] = map;
  }
  return _bdSk[key];
}
const _genHay = new WeakMap();
function genHayC(g){
  let h = _genHay.get(g);
  if(h === undefined){ h = genHay(g); _genHay.set(g, h); }
  return h;
}
const _skHay = new WeakMap();
function skillHayC(g, k){
  let h = _skHay.get(k);
  if(h === undefined){
    h = [g.n,g.t,g.p,g.sp,g.k,k[0],k[1]].join('\u0001').toLowerCase();
    _skHay.set(k, h);
  }
  return h;
}
function subHit(g, low){ return String(g.sp || '').toLowerCase().indexOf(low) !== -1; }
function genTokHit(g, tok){
  if(tok.sub) return subHit(g, tok.sub);
  if(tok.bd) return bdGenSet(tok.bd).has(g.p + '|' + g.sp + '|' + g.n);
  return genHayC(g).indexOf(tok.low) !== -1;
}
function skillTokHit(g, k, tok){
  if(tok.sub) return subHit(g, tok.sub);
  if(tok.bd) return bdSkillIndex(tok.bd).has(g.p + '|' + g.sp + '|' + g.n + '|' + k[0]);
  return skillHayC(g, k).indexOf(tok.low) !== -1;
}
function mixedGenHit(g){
  const seq = qSeq();
  if(!seq.length) return true;
  return seq.some(grp => grp.every(t => genTokHit(g, t)));
}
function mixedSkillHit(g, k){
  const seq = qSeq();
  if(!seq.length) return true;
  return seq.some(grp => grp.every(t => skillTokHit(g, k, t)));
}
function matchGeneral(g){ return baseGenOK(g) && mixedGenHit(g); }
function matchSkill(g, k){ return baseSkillOK(g, k) && mixedSkillHit(g, k); }

function buildSpecialList(){
  const seen = new Set();

    const p = it[0], sp = it[1], n = it[2], sk = it[3];
    const g = G.filter(function(x){ return x.p === p && x.sp === sp && x.n === n; })[0];
    if(!g) return;
    const k = g.s.concat(g.r).filter(function(z){ return z[0] === sk; })[0];
    if(state.view === 'general'){
      if(!seen.has(g)){ seen.add(g); list.push(g); }

function buildMixedGeneral(){
  const seq = qSeq();
  const seen = new Set();
  const add = g => { if(!seen.has(g)){ seen.add(g); list.push(g); } };
  if(!seq.length){ G.forEach(g => { if(baseGenOK(g)) add(g); }); return; }
  seq.forEach(grp => {
    let cands = G.filter(baseGenOK);
    grp.forEach(t => { cands = cands.filter(g => genTokHit(g, t)); });
    const bt = grp.filter(t => t.bd)[0];
    if(bt){
      const idx = new Map();
      (BOARDS[bt.bd] || []).forEach((it, i) => {
        const key = it[0] + '|' + it[1] + '|' + it[2];
        if(!idx.has(key)) idx.set(key, i);
      });
      const rank = g => { const key = g.p + '|' + g.sp + '|' + g.n; return idx.has(key) ? idx.get(key) : 999; };
      cands.sort((a, b) => rank(a) - rank(b));
    }
    cands.forEach(add);
  });

  const seen = new Set();
  const add = it => {
    const key = it.g.p + '|' + it.g.sp + '|' + it.g.n + '|' + it.k[0] + '|' + it.k[1];
    if(!seen.has(key)){ seen.add(key); list.push(it); }
  };
  if(!seq.length){ all.forEach(it => { if(baseSkillOK(it.g, it.k)) add(it); }); return; }
  seq.forEach(grp => {
    let cands = all.filter(it => baseSkillOK(it.g, it.k));
    grp.forEach(t => { cands = cands.filter(it => skillTokHit(it.g, it.k, t)); });
    const bt = grp.filter(t => t.bd)[0];
    if(bt){
      const idx = new Map();
      (BOARDS[bt.bd] || []).forEach((it, i) => {
        const key = it[0] + '|' + it[1] + '|' + it[2] + '|' + it[3];
        if(!idx.has(key)) idx.set(key, i);
      });
      const rank = it => { const key = it.g.p + '|' + it.g.sp + '|' + it.g.n + '|' + it.k[0]; return idx.has(key) ? idx.get(key) : 999; };
      cands.sort((a, b) => rank(a) - rank(b));

    const disps = bt ? (BOARD_SKILL_DISP[bt.bd] || {}) : {};

  }
  $('#empty').style.display = list.length ? 'none' : 'block';
  if(list.length){ state.view === 'general' ? renderGeneral() : renderSkill(); }
  else { $('#more').style.display = 'none'; }
  counts();
}

function counts(){
  const hasBoard = !!anyBoard();
  $('#lbl-s').textContent = hasBoard ? '特殊' : '技能';
  let cg = 0, cs = 0;
  const ps = new Set();
  G.forEach(g => {
    if(matchGeneral(g)){ cg++; ps.add(g.p); }
    g.s.concat(g.r).forEach(k => { if(matchSkill(g, k)) cs++; });
  });
  $('#cnt-g').textContent = cg;
  $('#cnt-s').textContent = cs;
  $('#stat').textContent = cg + ' 名武将 · ' + cs + ' 条技能 · ' + ps.size + ' 个扩展包';
}

/* ================= 导出 Word：纯前端生成 .docx ================= */
const ENC = new TextEncoder();
const CRC_T = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(items){
  const now = new Date();
  const tm = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dt = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  const parts = [], central = [];
  let off = 0;
  items.forEach(it => {
    const nb = ENC.encode(it.name);
    const data = typeof it.data === 'string' ? ENC.encode(it.data) : it.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nb.length);
    const v1 = new DataView(lh.buffer);
    v1.setUint32(0, 0x04034b50, true); v1.setUint16(4, 20, true); v1.setUint16(6, 0x0800, true);
    v1.setUint16(8, 0, true); v1.setUint16(10, tm, true); v1.setUint16(12, dt, true);
    v1.setUint32(14, crc, true); v1.setUint32(18, data.length, true); v1.setUint32(22, data.length, true);
    v1.setUint16(26, nb.length, true); v1.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nb.length);
    const v2 = new DataView(cd.buffer);
    v2.setUint32(0, 0x02014b50, true); v2.setUint16(4, 20, true); v2.setUint16(6, 20, true);
    v2.setUint16(8, 0x0800, true); v2.setUint16(10, 0, true); v2.setUint16(12, tm, true); v2.setUint16(14, dt, true);
    v2.setUint32(16, crc, true); v2.setUint32(20, data.length, true); v2.setUint32(24, data.length, true);
    v2.setUint16(28, nb.length, true); v2.setUint32(42, off, true);
    cd.set(nb, 46);
    central.push(cd);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const v3 = new DataView(eocd.buffer);
  v3.setUint32(0, 0x06054b50, true); v3.setUint16(8, items.length, true); v3.setUint16(10, items.length, true);
  v3.setUint32(12, cdSize, true); v3.setUint32(16, off, true);
  const out = new Uint8Array(off + cdSize + 22);
  let p = 0;
  parts.forEach(b => { out.set(b, p); p += b.length; });
  central.forEach(b => { out.set(b, p); p += b.length; });
  out.set(eocd, p);
  return out;
}
const xesc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
function para(text, style){
  return '<w:p><w:pPr><w:pStyle w:val="' + style + '"/></w:pPr><w:r><w:t xml:space="preserve">' + xesc(text) + '</w:t></w:r></w:p>';
}
function paraRuns(runs, style){
  return '<w:p><w:pPr><w:pStyle w:val="' + style + '"/></w:pPr>' + runs.map(r =>
    '<w:r>' + (r[1] ? '<w:rPr><w:b/></w:rPr>' : (r[2] ? '<w:rPr><w:color w:val="' + r[2] + '"/></w:rPr>' : '')) +
    '<w:t xml:space="preserve">' + xesc(r[0]) + '</w:t></w:r>').join('') + '</w:p>';
}
function filterText(){
  const parts = [];
  if(state.pkg.size) parts.push('扩展包：' + [...state.pkg].join('、'));
  if(state.kd.size) parts.push('势力：' + [...state.kd].join('、'));
  if(state.tag.size) parts.push('技能标签：' + [...state.tag].join('、'));
  const ts = tokens();
  if(ts.length) parts.push('关键词：' + ts.join(' '));
  return parts.length ? parts.join('；') : '未设置筛选条件（全部条目）';
}
function buildDocx(){
  const now = new Date();
  const pad = n => (n < 10 ? '0' + n : '' + n);
  const stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  const isG = state.view === 'general';
  const body = [];
  body.push(para('武将技能查询' + (isG ? '（按武将）' : '（按技能）'), 'Title'));
  body.push(para('导出时间：' + stamp + '　|　共 ' + (isG ? list.length + ' 名武将' : list.length + ' 条技能'), 'Meta'));
  body.push(para('筛选条件：' + filterText(), 'Meta'));
  if(isG){
    list.forEach(g => {
      const line = g.n + '（' + g.k + '）' + (g.t ? '　' + g.t : '') + '　·　' + g.sp +
        '　·　体力 ' + g.kh + (g.mh && g.mh !== g.kh ? '/' + g.mh : '') + '　·　' + g.g +
        (g.vt ? '　·　同名异版 ' + g.vi + '/' + g.vt : '');
      body.push(para(line, 'GHead'));
      g.s.concat(g.r).forEach(k => {
        body.push(paraRuns([
          [(k[2].indexOf('衍生技')!==-1?'★ ':'') + k[0], true, ''],
          [k[2].length ? '〔' + k[2].join('、') + '〕' : '', false, '9A6A2E'],
          [k[1] ? '：' + k[1] : '', false, ''],
        ], 'Body'));
      });
    });
  } else {
    list.forEach(it => {
      body.push(paraRuns([
        [it.g.n + '（' + it.g.k + '）　', false, '666666'],
        [(it.k[2].indexOf('衍生技')!==-1?'★ ':'') + it.k[0], true, ''],
        [it.k[2].length ? '〔' + it.k[2].join('、') + '〕' : '', false, '9A6A2E'],
        [it.k[1] ? '：' + it.k[1] : '', false, ''],
      ], 'Body'));
      body.push(para(it.g.sp + ' · ' + it.g.p, 'Meta'));
    });
  }
  const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' +
    body.join('') +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>' +
    '</w:body></w:document>';
  const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Microsoft YaHei" w:hAnsi="Microsoft YaHei" w:eastAsia="微软雅黑"/><w:sz w:val="21"/><w:lang w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="288" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:pPr><w:spacing w:after="200"/></w:pPr><w:rPr><w:b/><w:sz w:val="36"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Meta"><w:name w:val="Meta"/><w:pPr><w:spacing w:after="60"/></w:pPr><w:rPr><w:sz w:val="17"/><w:color w:val="7A7368"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="GHead"><w:name w:val="GHead"/><w:pPr><w:spacing w:before="260" w:after="60"/><w:keepNext/></w:pPr><w:rPr><w:b/><w:sz w:val="26"/><w:color w:val="8A2B22"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Body"><w:name w:val="Body"/><w:pPr><w:spacing w:after="60"/></w:pPr></w:style>' +
    '</w:styles>';
  const contents = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';
  const drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';
  return zipStore([
    {name: '[Content_Types].xml', data: contents},
    {name: '_rels/.rels', data: rels},
    {name: 'word/document.xml', data: documentXml},
    {name: 'word/_rels/document.xml.rels', data: drels},
    {name: 'word/styles.xml', data: stylesXml},
  ]);
}
$('#word').onclick = () => {
  const bytes = buildDocx();
  const blob = new Blob([bytes], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a = document.createElement('a');
  const now = new Date();
  const pad = n => (n < 10 ? '0' + n : '' + n);
  a.href = URL.createObjectURL(blob);
  a.download = exportName('docx');
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

/* 导出文件名：直接按当前筛选条件命名 */
function safeName(s){
  return String(s).replace(/[\\/:*?"<>|\r\n\t]/g, '').replace(/\s+/g, ' ').trim();
}
function exportName(ext){
  const bk = boardKey();
  const parts = [];
  if(bk){
    parts.push(bk);
  } else {
    const q = state.q.trim();
    if(q){
      let kq = q.replace(/。+/g, '、').replace(/[ \t]+/g, '＋').replace(/、+/g, '、');
      kq = kq.replace(/^、|、$/g, '');
      if(kq) parts.push(kq);
    }
    if(state.pkg.size) parts.push([...state.pkg].join('、'));
    if(state.hp.size) parts.push('体力' + [...state.hp].join('/'));
    if(state.ls.size) parts.push('已损失' + [...state.ls].join('/'));
    if(state.ar.size) parts.push('护甲' + [...state.ar].join('/'));
    if(state.kd.size) parts.push([...state.kd].join('、'));
    if(state.tag.size) parts.push([...state.tag].join('、'));
  }
  const view = state.view === 'general' ? '武将' : '技能';
  const d = new Date();
  const pad2 = n => (n < 10 ? '0' + n : '' + n);
  const ds = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  let name = view + '_' + (parts.length ? parts.join('_') : '全部') + '_' + ds;
  name = safeName(name).replace(/_+/g, '_');
  if(name.length > 110) name = name.slice(0, 110).replace(/_+$/, '');
  return name + '.' + ext;
}

$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value; counts(); apply(); }, 140);
});
$('#clear').onclick = () => {
  $('#q').value = ''; state.q = ''; state.pkg.clear(); state.kd.clear(); state.tag.clear();
  state.hp.clear(); state.ls.clear(); state.ar.clear();
  buildChips(); counts(); apply(); $('#q').focus();
};
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    state.view = t.dataset.view;
    counts(); apply(); window.scrollTo({top:0, behavior:'smooth'});
  };
});
$('#more').onclick = () => { state.view === 'general' ? renderGeneral() : renderSkill(); };
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key === 'Escape' && document.activeElement === $('#q')){ $('#q').value=''; state.q=''; counts(); apply(); }
});

$('#export').onclick = () => {
  let rows;
  if(state.view === 'general'){
    rows = [['扩展包','子扩展','武将','称号','势力','体力上限','性别','技能','标签','描述']];
    list.forEach(g => g.s.concat(g.r).forEach(k => rows.push([g.p,g.sp,g.n,g.t,g.k,g.mh,g.g,(k[2].indexOf('衍生技')!==-1?'★ ':'')+k[0],k[2].join('、'),k[1]])));
  } else {
    rows = [['扩展包','子扩展','武将','势力','技能','标签','描述']];
    list.forEach(it => rows.push([it.g.p,it.g.sp,it.g.n,it.g.k,(it.k[2].indexOf('衍生技')!==-1?'★ ':'')+it.k[0],it.k[2].join('、'),it.k[1]]));
  }
  const csv = rows.map(r => r.map(v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportName('csv');
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};

(function(){
  const box = document.querySelector('#filters'), bar = document.querySelector('#fbar'), tg = document.querySelector('#ftg');
  if(!box) return;
  const sync = () => { tg.textContent = box.classList.contains('collapsed') ? '筛选 ▾' : '收起 ▴'; };
  bar.onclick = () => { box.classList.toggle('collapsed'); sync(); };
  document.querySelector('#freset').onclick = e => {
    e.stopPropagation();
    state.pkg.clear(); state.kd.clear(); state.tag.clear();
    state.hp.clear(); state.ls.clear(); state.ar.clear();
    buildChips(); counts(); apply();
  };
  if(window.innerWidth <= 760){ box.classList.add('collapsed'); }
  sync();
})();
