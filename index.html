牌阶段，你可以选择：1.获得场上的所有装备牌，你对以此法被你获得牌的角色依次可以令其摸等量的牌并回复1点体力；2.获得弃牌堆中的所有装备牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吴兰","t":"剑齿之鼍","k":"蜀","kh":4,"mh":4,"g":"男","s":[["挫锐","出牌阶段开始时，你可以弃置一名你计算与其距离不大于1的角色区域里的一张牌。若如此做，你选择一项：1.弃置另一名其他角色装备区里至多两张与此牌颜色相同的牌；2.展示另一名其他角色的至多两张手牌，然后获得其中与此牌颜色相同的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武张飞","t":"烈武桓威","k":"蜀","kh":4,"mh":4,"g":"男","s":[["恣胜","你使用点数大于3且为3的倍数的牌时，可以从牌堆中随机三张点数为3的牌（若多张牌则点数相加），选择其中一张获得；你弃置或获得其他角色牌时，可以对该角色造成与弃置或获得牌数相等的伤害（不超过该角色当前体力值）。",[]],["显略","出牌阶段每名角色限一次，你可以观看本回合受到过伤害或失去过牌的一名其他角色的手牌并记录其中所有牌的点数。当本次记录点数的数量超过3、6、9时，你摸三张牌。若已因此记录了所有点数，则清除记录且〖豪贤〗视为未发动过。你每次造成伤害令其他角色进入濒死状态后，本次记录触发后续的点数减少3个。",[]],["豪贤","限定技，出牌阶段，你可以将弃牌堆中所有点数为3的牌洗入牌库，然后获得其他角色手牌中点数为3的牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武诸葛亮","t":"忠武良弼","k":"蜀","kh":4,"mh":7,"g":"男","s":[["尽瘁","锁定技，游戏开始时，你将手牌补至7张。准备阶段，你的体力值调整为与牌堆中点数为7的游戏牌数量相等（至少为1），然后观看牌堆顶X张牌（X为你的体力值），以任意顺序置于牌堆顶或牌堆底。",["锁定技"]],["情势","当你于出牌阶段内使用牌时（每种牌名每回合限一次），若手牌中有同名牌，你可以选择一项：1.令此牌对其中一个目标造成的伤害值+1；2.令任意名其他角色各摸一张牌；3.摸三张牌，然后此技能本回合失效。",[]],["智哲","限定技，出牌阶段，你可以复制一张手牌。此牌因你使用或打出而进入弃牌堆后，你获得且本回合不能再使用或打出之。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯霸","t":"棘途壮志","k":"蜀","kh":4,"mh":4,"g":"男","s":[["豹变","锁定技，当你受到伤害后，你依次获得以下一个技能：〖挑衅〗、〖咆哮〗、〖神速〗。",["锁定技"]],["挑衅","出牌阶段限一次，你可以指定一名你在其攻击范围内的角色，其需包括你在内的角色使用一张【杀】，否则你弃置其一张牌。",["衍生技"]],["咆哮","锁定技，你使用【杀】无次数限制；当你使用的【杀】被抵消后，你本回合下次【杀】造成的伤害+1。",["锁定技","衍生技"]],["神速","你可以做出如下选择：1.跳过判定阶段和摸牌阶段；2.跳过出牌阶段并弃置一张装备牌；3.跳过弃牌阶段并翻面。你每选择一项，便视为使用一张无距离限制的【杀】。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"向宠","t":"镇军之岳","k":"蜀","kh":5,"mh":5,"g":"男","s":[["固营","结束阶段，你可以选择一名角色，直到你下个结束阶段开始前：当其下一次受到伤害后，摸体力上限张牌（最多摸5张），然后将超出体力上限的手牌交给你。若在此期间没有触发此效果，则你下次发动〖固营〗时可以多选择一名角色。",[]],["睦阵","出牌阶段每种类型限一次，你可以将一种类型的至多三张牌交给一名其他角色，然后选择一项： 1.令其弃置等量其他类型的牌，不足则全弃并展示手牌； 2.获得其场上等量的牌； 3.令其展示牌堆顶等量的牌，获得其中此类型的牌，你获得剩余的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"向朗","t":"校书翾翻","k":"蜀","kh":3,"mh":3,"g":"男","s":[["勘集","出牌阶段限两次，你可以展示所有手牌，若花色均不同，你摸两张牌，然后若因此使手牌包含四种花色，则你跳过本回合的弃牌阶段。",[]],["愆正","每回合限两次，当你成为其他角色使用普通锦囊牌或【杀】的目标时，你可以重铸两张牌，若这两张牌与使用牌类型均不同，此牌结算后你可以获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星董允","t":"謇谔镇慝","k":"蜀","kh":4,"mh":4,"g":"男","s":[["弼士","每轮限一次，一名角色的回合结束时，你可以交给其任意张牌，然后若其手牌数与体力值相等，其执行一个仅有出牌阶段的额外回合，此阶段内其使用的第一张牌不能被响应，且每次使用伤害牌时你摸一张牌。",[]],["正听","出牌阶段限一次，你可以选择一名其他角色，你与其互相观看对方手牌，然后你选择一项：1.你与其分别将手牌弃置至每种花色仅剩一张；2.你与其分别将手牌中没有的花色各摸一张。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星法正","t":"定军佐功","k":"蜀","kh":3,"mh":3,"g":"男","s":[["知机","准备阶段，你可以弃置任意张手牌（可以不弃），然后将手牌摸至5张。若你因此弃牌数比摸牌数：多，你可以对至多X名其他角色各造成1点伤害（X为弃牌数比摸牌数多的数量）；相等，你本回合使用牌不能被响应；少，你本回合手牌上限+2。",[]],["谙计","锁定技，当一名角色使用牌时，若此牌花色是本轮中使用次数最少的，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星蒋琬","t":"讬忠赞业","k":"蜀","kh":3,"mh":3,"g":"男","s":[["镇庭","一名角色回合结束时，若本回合至少两名角色受到过伤害，你可以选择一项：1.令一名本回合受到过伤害的角色回复1点体力并摸一张牌；2.令一名本回合造成过伤害的角色获得两张本回合进入弃牌堆的牌。",[]],["持国","出牌阶段开始时，你可以观看牌堆底三张牌。若如此做，本阶段当你使用一张牌时，亮出牌堆底牌，若这两张牌：花色相同，你为使用的牌增加或减少一个目标（目标数至少为一）；不同，你将亮出的牌交给其中一名目标角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星夏侯霸","t":"箍围抗尽","k":"蜀","kh":4,"mh":4,"g":"男","s":[["维谷","你使用伤害牌指定唯一目标或成为伤害牌唯一目标时，你可以弃置一张可指定自己为目标的牌，然后选择一项：1.移动场上一张牌；2.令你攻击范围内除此牌使用者之外的所有角色也成为此牌目标。结算后若此牌未造成伤害，你失去1点体力并摸两张牌。",[]],["绝伐","限定技，出牌阶段，你可以将〖维谷〗中“移动场上一张牌”改为“对一名角色造成2点伤害”直到你的下个回合结束。若如此做，当你于此期间通过〖维谷〗杀死角色后，你将手牌和体力值调整至体力上限；若于此效果结束时你未杀死过角色，你失去所有体力。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星张松","t":"乌鹊折槁","k":"蜀","kh":3,"mh":3,"g":"男","s":[["悉诵","每轮限一次，其他角色的出牌阶段开始时，你可以观看其手牌，若如此做，此阶段结束时，你声明一个类别、花色和点数并展示其手牌，若其中有完全符合你声明的牌，此技能视为未发动过，然后其弃置此牌，若你能使用则使用之。",[]],["放浪","摸牌阶段，你可以展示一张此阶段摸到的牌，然后直到你的下回合开始，除展示的牌之外，你每回合使用或打出第一张牌时，你摸X张牌（X为此牌与展示牌类别、花色、点数相同的项数）。 结束阶段，你可以弃置一张牌，然后你获得弃牌堆中与此牌类别、点数、花色相同的牌各一张。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"郤正","t":"君子有取","k":"蜀","kh":3,"mh":3,"g":"男","s":[["耽意","你使用牌指定目标后，若此牌目标与你使用的上一张牌有相同的目标，你可以摸X张牌（X为这些目标的数量）。",[]],["文灿","出牌阶段限一次，你可以选择至多两名体力值不同的角色，这些角色依次选择一项：1.弃置两张花色不同的牌；2.本回合你对其使用牌无距离和次数限制。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"许靖","t":"璞玉有瑕","k":"蜀","kh":3,"mh":3,"g":"男","s":[["赏誉","锁定技，游戏开始时，你获得一张【杀】并标记之，然后可以将之交给一名角色。此【杀】造成伤害后，你和使用者各摸一张牌；进入弃牌堆后，你将之交给一名本回合未以此法选择过的角色。",["锁定技"]],["才瑕","当你造成或受到伤害后，你可以摸至多X张牌（X为游戏人数且至多为5）。若如此做，此技能失效直到你累计使用了等量的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杨婉","t":"融沫之鲡","k":"蜀","kh":3,"mh":3,"g":"女","s":[["诱言","你的回合内，当你的牌因使用或打出之外的方式进入弃牌堆后，你可以从牌堆中获得本次失去的牌中没有的花色的牌各一张（出牌阶段、弃牌阶段各限一次）。",[]],["追还","结束阶段，你可以秘密选择一名角色。直到该角色的下个准备阶段，此期间内对其造成过伤害的角色：若体力值大于该角色，则受到其造成的2点伤害；若体力值不大于该角色，则随机弃置两张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杨仪","t":"武侯长史","k":"蜀","kh":3,"mh":3,"g":"男","s":[["狷狭","结束阶段，你可以选择一名其他角色，依次视为对其使用至多三张牌名各不相同的仅指定唯一目标的普通锦囊牌（无距离限制）。若如此做，该角色的结束阶段，其可以视为对你使用等量张【杀】。",[]],["定措","每回合限一次，当你造成或受到伤害后，你可以摸两张牌，若这两张牌颜色不同，你弃置一张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"有诸葛亮","t":"应有尽有","k":"蜀","kh":3,"mh":3,"g":"男","s":[["应有","你的回合开始时，结束阶段开始时，或当你受到伤害后，你可以选择一项执行并摸一张牌：1.随机获得一个五虎将的技能；2.将【真·诸葛连弩】置入你的装备区；3.获得10吨馒头（当你使用手牌时，可消耗等同于此牌点数吨馒头令此牌额外结算一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张瑾云","t":"慧秀淑德","k":"蜀","kh":3,"mh":3,"g":"女","s":[["蕙质","准备阶段，你可以弃置任意张手牌（可以不弃），然后将手牌摸至与全场手牌最多的角色相同（至少摸一张，至多摸五张）。",[]],["继椒","限定技，出牌阶段，你可以令一名角色获得弃牌堆中本局游戏你使用和弃置的所有普通锦囊牌，这些牌不能被抵消。每回合结束后，若此回合内牌堆洗过牌或有角色死亡，此技能视为未发动过。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张翼","t":"执忠守义","k":"蜀","kh":4,"mh":4,"g":"男","s":[["暮锐","你可以于以下时机使用一张牌：1.每轮开始时；2.有角色死亡的回合结束时；3.你的回合开始时。若此牌造成了伤害，则你摸两张牌并删除对应选项。",[]],["鏖刃","每轮限X次（为〖暮锐〗已删除选项数），你使用基本牌结算完毕后，可以将之收回手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张裕","t":"预己知命","k":"蜀","kh":3,"mh":3,"g":"男","s":[["相谶","出牌阶段限一次，你可以选择一名角色并随机出现与其势力和初始体力值相同的武将的三个技能（限定技、觉醒技、主公技除外），你从中选择一个获得（以此法获得的技能存在三个时改为摸一张牌），你的回合结束时，你失去以此法获得的技能；你或你上次发动〖相谶〗的目标角色体力值变化后，你可以发动此技能。",[]],["命定","限定技，当你进入濒死状态时，你可以失去除〖命定〗外的所有技能并将体力值回复至1点，若如此做，你摸〖相谶〗获得过的技能数张牌（至多五张）并随机获得其中三个技能，然后直到你的下个回合结束，防止你受到的伤害，你的下个回合的回合结束时，你失去所有体力。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵统赵广","t":"翊赞季兴","k":"蜀","kh":4,"mh":4,"g":"男","s":[["翊赞","你可以将两张牌（其中至少一张是基本牌）当任意基本牌使用或打出。",[]],["龙渊","觉醒技，一名角色的结束阶段，若你本局游戏内发动过至少三次〖翊赞〗，你摸两张牌并回复1点体力，将〖翊赞〗中的“两张牌”修改为“一张牌”。",["觉醒技"]],["青刃","结束阶段，你可以摸X张牌（X为你本回合发动〖翊赞〗的次数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"赵襄","t":"拾梅鹊影","k":"蜀","kh":4,"mh":4,"g":"女","s":[["芳魂","当你使用【杀】指定目标后或成为【杀】的目标后，你获得1个“梅影”标记；你可以移去1个“梅影”标记发动〖龙胆〗并摸一张牌。",[]],["扶汉","限定技，回合开始时，若你有“梅影”标记，你可以移去所有“梅影”标记并摸等量的牌，然后从X张（X为存活人数且至少为4）蜀势力武将牌中选择并获得至多两个技能（限定技、觉醒技、主公技除外）。若此时你是体力值最低的角色，你回复1点体力。",["限定技"]],["龙胆","你可以将一张【杀】当【闪】、【闪】当【杀】使用或打出，然后若你本回合未造成过伤害，你摸一张牌。 ⬤　二级：你可以将一张基本牌当任意本回合未以此法转化过的基本牌使用或打出，然后你摸一张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵直","t":"捕梦黄粱","k":"蜀","kh":3,"mh":3,"g":"男","s":[["统观","一名角色的第一个回合开始时，你为其选择一项属性（每种属性至多被选择两次）。",[]],["梦解","一名角色的回合结束时，若其本回合完成了其属性对应内容，你执行对应效果。 武勇：造成伤害；对一名其他角色造成1点伤害 刚硬：回复体力或手牌数大于体力值；选择一名角色，令其回复1点体力 多谋：摸牌阶段外摸牌；摸两张牌 果决：弃置或获得其他角色的牌；弃置一名其他角色区域内的至多两张牌 仁智：交给其他角色牌；令一名其他角色将手牌摸至体力上限（至多摸五张）",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"诸葛果","t":"祈福安宁","k":"蜀","kh":3,"mh":3,"g":"女","s":[["祈禳","当你使用装备牌时，你可以从牌堆获得一张锦囊牌，本回合使用此牌可以额外指定一个目标。",[]],["羽化","锁定技，你的非基本牌不计入手牌上限；结束阶段，若你的手牌数大于体力上限，你观看牌堆顶一张牌，置于牌堆顶或牌堆底。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"诸葛均","t":"三珠之隐根","k":"蜀","kh":3,"mh":3,"g":"男","s":[["耕读","出牌阶段开始时，你可以亮出牌堆顶四张牌，并选择一种颜色的牌获得： 黑色牌，然后本阶段限X次，当你使用黑色牌后，你摸两张牌，本回合不能使用或打出这些牌且不计入手牌上限； 红色牌，然后本阶段限X次，你可以将一张红色牌当一张本回合未使用过的普通锦囊牌使用。 （X为你本次未以此法获得的牌数）",[]],["孤脉","每轮限一次，当你造成/受到伤害时，你可以展示所有手牌，令此伤害+1/-1。若展示的牌花色均相同，你可以弃置一张手牌令此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"诸葛尚","t":"尚节殉义","k":"蜀","kh":3,"mh":3,"g":"男","s":[["三顾","结束阶段，你可以依次选择至多三张【杀】或普通锦囊牌（【借刀杀人】、【无懈可击】除外）并指定一名其他角色，其下个出牌阶段使用或打出的前X张牌视为你选择的牌（X为你选择的牌数）。若你选择的牌均为本回合你使用过的牌，防止“三顾”牌对你造成的伤害。",[]],["轶祖","锁定技，每回合限一次，当你成为【杀】或【决斗】的目标后，若你的体力值不大于使用者的体力值，你回复1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"宗预","t":"九酝鸿胪","k":"蜀","kh":3,"mh":3,"g":"男","s":[["气傲","每回合限两次，当你成为其他角色使用牌的目标后，你可以弃置其一张牌，然后你弃置一张牌。",[]],["承赏","每阶段限一次，当你于出牌阶段内使用指定其他角色为目标的牌结算后，若此牌没有造成伤害，你可以获得牌堆中所有与此牌花色点数均相同的牌。若你没有因此获得牌，此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"岑昏","t":"伐梁倾瓴","k":"吴","kh":4,"mh":4,"g":"男","s":[["极奢","出牌阶段，若你的手牌上限大于0，你可以摸一张牌，然后本回合你的手牌上限-1；结束阶段，若你没有手牌，你可以横置至多X名角色（X为你的体力值）。",[]],["链祸","锁定技，当你受到火焰伤害时，若你处于连环状态且你是传导伤害的起点，则此伤害+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"程秉","t":"通达五经","k":"吴","kh":3,"mh":3,"g":"男","s":[["经造","出牌阶段每名角色限一次，你可以选择一名其他角色并亮出牌堆顶三张牌，然后该角色选择一项：1.弃置一张与亮出牌同名的牌，然后此技能本回合亮出的牌数+1；2.令你随机获得这些牌中牌名不同的牌各一张，每获得一张，此技能本回合亮出的牌数-1。",[]],["恩遇","锁定技，当你成为其他角色使用【杀】或普通锦囊牌的目标后，若你本回合已成为过同名牌的目标，此牌对你无效。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈武董袭","t":"壮怀激烈","k":"吴","kh":4,"mh":4,"g":"男","s":[["断绁","出牌阶段限一次，你可以令一名其他角色横置，然后你横置。",[]],["奋命","结束阶段，若你处于横置状态，你可以弃置所有处于横置状态角色的各一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"大乔小乔","t":"国色天香","k":"吴","kh":3,"mh":3,"g":"女","s":[["星舞","弃牌阶段开始时，你可以将一张手牌置于武将牌上，称为“舞”。若你的“舞”达到三张，则你可以移去三张“舞”，弃置一名其他角色装备区里的所有牌，然后对其造成X点伤害（X为移去“舞”的花色数，若为女性角色则为1）。",[]],["落雁","锁定技，若你的武将牌上有“舞”，你视为拥有技能〖天香〗和〖流离〗。",["锁定技"]],["天香","当你受到伤害时，你可以弃置一张♥手牌并选择一名其他角色。你防止此伤害并选择一项：1.伤害来源对其造成1点伤害，其摸X张牌（X为其已损失的体力值且至多为5）；2.令其失去1点体力，其获得牌堆或弃牌堆中你以此法弃置的牌。",["衍生技"]],["流离","当你成为【杀】的目标时，你可以弃置一张牌并选择你攻击范围内为此【杀】合法目标（无距离限制）的一名角色：若如此做，该角色代替你成为此【杀】的目标。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"邓晚棠","t":"黛流宫传","k":"吴","kh":4,"mh":4,"g":"女","s":[["黛颊","每轮开始时，你可以随机将牌堆里的体力上限张红色牌置于武将牌上（均称为“黛”），然后回复1点体力；当牌使用结算结束后，若目标角色包含你，你随机获得一张“黛”；每轮结束时，你获得所有“黛”。",[]],["承宠","锁定技，当你不因此技能而得到牌后，若你手牌区里的除这些牌以外的牌中的红色牌数不小于黑色牌数，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"冯熙","t":"东吴苏武","k":"吴","kh":3,"mh":3,"g":"男","s":[["玉碎","每回合限一次，当你成为其他角色使用黑色牌的目标后，你可以失去1点体力，然后选择一项：1.令其弃置手牌至与你相同；2.令其失去体力值至与你相同。",[]],["驳言","出牌阶段限一次，你可以选择一名其他角色，该角色将手牌摸至体力上限（最多摸至5张），其本回合不能使用或打出手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"葛玄","t":"太极仙翁","k":"吴","kh":3,"mh":3,"g":"男","s":[["炼化","你的回合外，当其他角色受到伤害后，你获得一枚“丹血”标记（阵营与你相同为红色，不同则为黑色，颜色不可见）直到你出牌阶段开始。 准备阶段，根据“丹血”标记的数量和颜色，你获得相应的牌和相应的技能直到回合结束： 3枚或以下：【桃】和〖英姿〗； 超过3枚且红色“丹血”较多：【无中生有】和〖观星〗； 超过3枚且黑色“丹血”较多：【顺手牵羊】和〖直言〗； 超过3枚且红色和黑色一样多：【杀】、【决斗】和〖攻心〗。",[]],["札符","限定技，出牌阶段，你可以选择一名其他角色。该角色的下个弃牌阶段开始时，其选择保留一张手牌，将其余手牌交给你。",["限定技"]],["英姿","锁定技，摸牌阶段，你多摸一张牌；你的手牌上限等同于你的体力上限。",["锁定技","衍生技"]],["观星","准备阶段，你可以观看牌堆顶5张牌（场上存活角色数小于4时改为3张），并以任意顺序置于牌堆顶或牌堆顶。若你将这些牌均放至牌堆底，则结束阶段你可以发动〖观星〗。",["衍生技"]],["直言","结束阶段，你可以令一名角色摸一张牌并展示之，若此牌为：基本牌，你摸一张牌；装备牌，其使用此牌并回复1点体力。",["衍生技"]],["攻心","出牌阶段限一次，你可以观看一名其他角色的手牌并可以展示其中的一张♥牌，选择：1.弃置此牌；2.将此牌置于牌堆顶。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"阚泽","t":"慧眼的博士","k":"吴","kh":3,"mh":3,"g":"男","s":[["下书","出牌阶段开始时，你可以将所有手牌交给一名其他角色，然后该角色亮出任意数量的手牌（至少一张），令你选择一项：1.获得其亮出的手牌；2.获得其未亮出的手牌。",[]],["宽释","结束阶段，你可以选择一名角色。直到你的下回合开始，该角色一回合内受到第2点伤害后回复1点体力（每回合限一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蒋钦","t":"祁奚之器","k":"吴","kh":4,"mh":4,"g":"男","s":[["尚义","出牌阶段限一次，你可以令一名其他角色观看你的手牌。若如此做，你观看其手牌并可以弃置其中的一张♠牌和一张♣牌。",[]],["鸟翔","锁定技，当你使用【杀】指定目标后，若你在其攻击范围内，其响应此【杀】的方式改为依次使用两张【闪】。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界步练师","t":"无冕之后","k":"吴","kh":3,"mh":3,"g":"女","s":[["安恤","出牌阶段限一次，你可以选择两名手牌数不同的其他角色，令其中手牌少的角色获得手牌多的角色一张手牌并展示之：若此牌不为♠，你摸一张牌；若其手牌数因此相同，你回复1点体力。",[]],["追忆","当你死亡时，可以令一名其他角色（杀死你的角色除外）摸X张牌（X为存活角色数）并回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界程普","t":"三朝虎臣","k":"吴","kh":4,"mh":4,"g":"男","s":[["疬火","当你使用普通【杀】时，你可以将此【杀】改为火【杀】，然后此【杀】结算结束后，若此【杀】造成过伤害，你失去1点体力；你使用火【杀】可以多选择一个目标。你每回合使用的第一张牌结算后，若此牌为【杀】，你可以将之置为“醇”。",[]],["醇醪","出牌阶段结束时，若你没有“醇”，你可以将任意张【杀】置为“醇”；当一名角色处于濒死状态时，你可以将一张“醇”置入弃牌堆，视为该角色使用一张【酒】；若你此法置入弃牌堆的是：火【杀】，你回复1点体力；雷【杀】，你摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界顾雍","t":"秉忠如一","k":"吴","kh":3,"mh":3,"g":"男","s":[["慎行","出牌阶段，你可以弃置X张牌，然后摸一张牌（X为你此阶段发动本技能次数，至多为2）。",[]],["秉壹","结束阶段，你可以展示所有手牌，若均为同一颜色，你可以令至多X名角色各摸一张牌（X为你的手牌数）；若点数也相同，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界韩当","t":"石城侯","k":"吴","kh":4,"mh":4,"g":"男","s":[["弓骑","出牌阶段限一次，你可以弃置一张牌，此回合你的攻击范围无限，使用此花色的【杀】无次数限制。若弃置的牌为装备牌，你可以弃置一名其他角色的一张牌。",[]],["解烦","限定技，出牌阶段，你可以选择一名角色，然后令攻击范围内有该角色的所有角色各选择一项：1.弃置一张武器牌；2.令其摸一张牌。若此时为第一轮，此回合结束时本技能视为未发动过。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界凌统","t":"豪情烈胆","k":"吴","kh":4,"mh":4,"g":"男","s":[["旋风","当你失去装备区里的牌后，或当你于弃牌阶段弃置至少两张牌时，若没有角色处于濒死状态，你可以依次弃置一至两名其他角色的共计两张牌。若此时是你的回合内，你可以对其中一名角色造成1点伤害。",[]],["勇进","限定技，出牌阶段，你可以依次移动场上至多三张装备牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界潘璋马忠","t":"夺敌兵刃","k":"吴","kh":4,"mh":4,"g":"男","s":[["夺刀","当你成为【杀】的目标后，你可以弃置一张牌，获得使用者装备区里的武器牌。",[]],["暗箭","锁定技，当你使用【杀】指定目标后，若你不在其攻击范围内，此【杀】无视其防具且伤害+1；若该角色因此进入濒死状态，其不能使用【桃】直到此次濒死结算结束。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界全琮","t":"钱唐侯","k":"吴","kh":4,"mh":4,"g":"男","s":[["邀名","每回合每项限一次，当你造成或受到伤害后，你可以选择一项：1.弃置一名其他角色的一张手牌；2.令一名其他角色摸一张牌；3.令一名角色弃置至多两张牌，摸等量的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界孙登","t":"才高德茂","k":"吴","kh":4,"mh":4,"g":"男","s":[["匡弼","出牌阶段开始时，你可以令一名其他角色将一至三张牌置于你的武将牌上，本阶段结束时将“匡弼”牌置入弃牌堆。当你于有“匡弼”牌时使用牌时，若你：有与之花色相同的“匡弼”牌，则随机将其中一张置入弃牌堆，然后你与该角色各摸一张牌；没有与之花色相同的“匡弼”牌，则随机将一张置入弃牌堆，然后你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界孙鲁班","t":"谗言毁谤","k":"吴","kh":3,"mh":3,"g":"女","s":[["谮毁","当你使用【杀】或普通锦囊牌指定唯一目标时，你可以令另一名其他角色选择一项：1.交给你一张牌，然后代替你成为此牌的使用者；2.也成为此牌的目标，然后〖谮毁〗本回合失效。",[]],["骄矜","当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以弃置一张装备牌，令此牌对你无效，此牌结算结束后你获得之。若该角色为女性，〖骄矜〗本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界孙休","t":"兴学重教","k":"吴","kh":3,"mh":3,"g":"男","s":[["宴诛","出牌阶段限一次，你可以令一名其他角色选择一项：1.弃置一张牌，其下次受到伤害+1直到其下个回合开始；2.你获得其装备区内所有的牌，修改〖宴诛〗和〖兴学〗。",[]],["兴学","结束阶段，你可以令至多X名角色依次摸一张牌，然后其中手牌数大于体力值的角色依次将一张牌置于牌堆顶（X为你的体力值）。",[]],["诏缚","主公技，锁定技，与你距离为1的角色视为在其他吴势力角色的攻击范围内。",["主公技","锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界吴国太","t":"武烈皇后","k":"吴","kh":3,"mh":3,"g":"女","s":[["甘露","出牌阶段限一次，你可以选择两名角色，交换其装备区内的所有牌，然后若其装备区牌数之差大于你已损失体力值，你弃置两张手牌。",[]],["补益","当一名角色进入濒死状态时，你可以展示其一张手牌，若不为基本牌，则其弃置此牌并回复1点体力。若其因此弃置最后一张手牌，其摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界徐盛","t":"江东的铁壁","k":"吴","kh":4,"mh":4,"g":"男","s":[["破军","当你使用【杀】指定一个目标后，你可以将其至多X张牌移出游戏直到回合结束（X为其体力值），若其中有：装备牌，你弃置其中一张；锦囊牌，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界虞翻","t":"微妙玄通","k":"吴","kh":3,"mh":3,"g":"男","s":[["纵玄","当你的牌因弃置而置入弃牌堆后，若其中有锦囊牌，你可以令一名其他角色获得其中一张锦囊牌，然后你可以将其余的牌中任意张置于牌堆顶。",[]],["直言","结束阶段，你可以令一名角色摸一张牌并展示之，若此牌为：基本牌，你摸一张牌；装备牌，其使用此牌并回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界朱桓","t":"勇烈奋励","k":"吴","kh":4,"mh":4,"g":"男","s":[["奋励","若你的手牌数为全场最多，你可以跳过判定和摸牌阶段；若你的体力值为全场最多，你可以跳过出牌阶段；若你的装备区里有牌且数量为全场最多，你可以跳过弃牌阶段。",[]],["平寇","回合结束时，你可以对至多X名其他角色各造成1点伤害（X为你本回合跳过的阶段数），然后若你选择的角色数小于X，你再选择其中一名角色，令其随机弃置装备区里的一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界朱然","t":"胆略无双","k":"吴","kh":4,"mh":4,"g":"男","s":[["胆守","每回合限一次，当你成为基本牌或锦囊牌的目标后，你可以摸X张牌（X为你本回合成为基本牌或锦囊牌目标的次数）；一名角色的结束阶段，若你本回合没有以此法摸牌，你可以弃置其手牌数的牌，对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界朱治","t":"安国将军","k":"吴","kh":4,"mh":4,"g":"男","s":[["安国","出牌阶段限一次，你可以选择一名其他角色，若其手牌数为全场最少，其摸一张牌；体力值为全场最低，回复1点体力；装备区内牌数为全场最少，随机使用一张装备牌。然后若该角色有未执行的效果且你满足条件，你执行之。若双方执行了全部分支，你可以重铸任意张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"经典孙权","t":"年轻的贤君","k":"吴","kh":4,"mh":4,"g":"男","s":[["制衡","出牌阶段限一次，你可以弃置任意张牌，然后摸等量的牌。若你以此法弃置了所有的手牌，额外摸一张牌。出牌阶段对每名角色限一次，当你对其他角色造成伤害后，此技能本阶段可发动次数+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐大乔","t":"玉桐姊韵","k":"吴","kh":4,"mh":4,"g":"女","s":[["绮琴","锁定技，游戏开始时，你的初始手牌增加“琴”标记且不计入手牌上限。准备阶段，你获得弃牌堆中所有“琴”牌。",["锁定技"]],["姊希","出牌阶段开始时和结束时，你可以将至多两张“琴”置入一名角色的判定区。当你使用基本牌或普通锦囊牌指定唯一目标后，你可以根据其判定区牌的张数执行效果：1张，此牌对其额外结算1次；2张，你摸两张牌；3张，获得其判定区和装备区所有牌，对其造成3点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐小乔","t":"绿绮嫒媛","k":"吴","kh":3,"mh":3,"g":"女","s":[["绮琴","锁定技，游戏开始时，你的初始手牌增加“琴”标记且不计入手牌上限。准备阶段，你获得弃牌堆中所有“琴”牌。",["锁定技"]],["媦婉","出牌阶段限一次，你可以弃置一张“琴”并选择一名其他角色，随机获得其区域内与此“琴”不同花色的牌各一张。若你获得的牌数为：1，其失去1点体力；2，你本回合对其使用牌无距离与次数限制；3，你本回合不能对其使用牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐周妃","t":"芙蓉泣露","k":"吴","kh":3,"mh":3,"g":"女","s":[["灵箜","锁定技，游戏开始时，你的初始手牌增加“箜篌”标记且不计入手牌上限。每回合你于摸牌阶段外首次获得牌后，将这些牌标记为“箜篌”。",["锁定技"]],["贤淑","出牌阶段，你可以将一张“箜篌”牌交给一名其他角色并摸X张牌（X为你与该角色体力值之差且至多为5），若此牌为：红色，且该角色体力值不大于你，该角色回复1点体力；黑色，且该角色体力值不小于你，该角色失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐周瑜","t":"顾曲周郎","k":"吴","kh":3,"mh":3,"g":"男","s":[["顾音","锁定技，你没有初始手牌，其他角色的初始手牌+1。其他角色的初始手牌被使用或弃置进入弃牌堆后，你摸一张牌。",["锁定技"]],["平虏","出牌阶段，你可以获得攻击范围内每名其他角色各一张随机手牌。你此阶段不能再发动该技能直到这些牌离开你的手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"凌操","t":"激浪奋孤胆","k":"吴","kh":4,"mh":5,"g":"男","s":[["独锋","锁定技，出牌阶段开始时，你选择至少一项：1.失去1点体力；2.废除一个装备栏。然后你摸X张牌，并将你的攻击范围和出牌阶段使用【杀】的次数上限改为X（X为你已损失的体力值与已废除的装备栏数之和，且至多为你的体力上限）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"凌烈","t":"烈虎千狩","k":"吴","kh":4,"mh":4,"g":"男","s":[["狩虎","出牌阶段限一次，你可以视为对一名其他角色使用一张【杀】，结算后本回合你计算与其距离+1。当其因此【杀】而进入濒死状态时，你摸体力上限张牌，且以此法获得的牌无次数限制；本阶段有角色进入你的攻击范围时此技能视为未发动过。",[]],["凝准","每回合每项限一次，当你一回合每使用两张牌结算结束后，你可以选择一项：1.攻击范围-1；2.攻击范围+1；3.移动场上一张牌。本回合你每执行过其中两项，此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"留赞","t":"啸天亢声","k":"吴","kh":4,"mh":4,"g":"男","s":[["奋音","锁定技，你的回合内，每当一种花色的牌进入弃牌堆后（每回合每种花色各限一次），你摸一张牌。",["锁定技"]],["力激","出牌阶段限零次，你可以弃置一张牌，对一名其他角色造成1点伤害。你的回合内，本回合进入弃牌堆的牌每次达到8的倍数张时（存活人数小于5时改为4的倍数），此技能使用次数+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李异谢旌","t":"踵蹑袭进","k":"吴","kh":4,"mh":4,"g":"男","s":[["斗阵","转换技，锁定技，你的回合内，阳：你的黑色基本牌视为【决斗】，且使用时获得目标一张牌；阴：你的红色基本牌视为【杀】，且使用时无次数限制。",["转换技","锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"陆凯","t":"青辞宰辅","k":"吴","kh":4,"mh":4,"g":"男","s":[["卜筮","你使用♠牌无次数限制； 你使用或打出♥牌后，摸一张牌； 当你成为♣牌的目标后，你可以弃置一张手牌令此牌对你无效； 结束阶段，你获得一张♦牌。 准备阶段，你可以将以上四种花色重新分配。",[]],["忠壮","锁定技，你使用【杀】造成伤害时，若你的攻击范围大于3，则此伤害+1；若你的攻击范围小于3，则此伤害改为1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"骆统","t":"蹇谔匪躬","k":"吴","kh":3,"mh":3,"g":"男","s":[["仁政","锁定技，当有伤害被减少或防止后，你摸两张牌。",["锁定技"]],["进谏","当你造成伤害时，你可以令此伤害+1，若如此做，你此回合下次造成的伤害-1且不能发动〖进谏〗；当你受到伤害时，你可以令此伤害-1，若如此做，你此回合下次受到的伤害+1且不能发动〖进谏〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"陆文漪","t":"卷中避世","k":"吴","kh":3,"mh":3,"g":"女","s":[["才韵","出牌阶段限一次，你可以选择一名其他角色并与其各从牌堆随机获得一张指定类型的牌，然后直到你的下个回合开始，你与其使用该类型的牌时，从牌堆随机获得两张与使用的牌类型不同的牌（每人至多两次）。",[]],["怯言","锁定技，你不能响应距离你为1的角色使用的牌。其他角色使用牌指定你为目标结算完毕后，本回合其与你计算距离+1，若你因此脱离其攻击范围，你回复1点体力并摸两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陆郁生","t":"义姑","k":"吴","kh":3,"mh":3,"g":"女","s":[["贞特","每回合限一次，当你成为其他角色使用基本牌或普通锦囊牌的目标后，你可以令其选择一项：1.本回合不能再使用此颜色的牌；2.此牌对你无效。",[]],["至微","游戏开始时，你选择一名其他角色： 该角色造成伤害后，你摸一张牌； 该角色受到伤害后，你随机弃置一张手牌； 你弃牌阶段弃置的牌均被该角色获得。 准备阶段，若场上没有“至微”角色，你可以重新选择一名其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"吕岱","t":"清身奉公","k":"吴","kh":4,"mh":4,"g":"男","s":[["勤国","当你于回合内使用装备牌结算结束后，你可以视为使用【杀】；当你的装备区里的牌数变化后，若你装备区里的牌数与你的体力值相等，你回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吕范","t":"忠笃亮直","k":"吴","kh":3,"mh":3,"g":"男","s":[["调度","出牌阶段开始时，你可以获得距离1以内一名角色装备区内的一张牌，然后将此牌交给除其以外一名角色，该角色选择一项：1.使用此牌，你摸一张牌；2.不使用此牌，其摸一张牌。",[]],["典财","其他角色出牌阶段结束时，若你此阶段失去了至少X张牌，你可以将手牌摸至体力上限（X为你的体力值，至多为5），然后你可以发动一次〖调度〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吕据","t":"仗钺征镇","k":"吴","kh":4,"mh":4,"g":"男","s":[["征越","回合开始时，若你的武将牌上没有“征越”牌，你可以将牌堆顶至多五张牌以任意顺序置于武将牌上。当你使用牌结算后，若与武将牌上第一张“征越”牌点数或花色或牌名相同，移去第一张“征越”牌并摸两张牌；若皆不同，将此牌置于武将牌上并任意调整顺序（至多5张“征越”牌），当你一回合内以此法将两张牌置为“征越”牌后，你不能使用手牌直到回合结束。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋程普","t":"平江定乱","k":"吴","kh":5,"mh":5,"g":"男","s":[["坚卫","锁定技，你的起始手牌数+4。摸牌阶段，若你手牌数小于2，你多摸四张牌。",["锁定技"]],["举战","每回合限一次，你使用【杀】或普通锦囊牌指定目标后，若你的手牌数大于等于体力值，你可以弃置一张手牌令此牌额外结算一次。其他角色对你使用的【杀】或普通锦囊牌结算完成后，若你的手牌数小于等于体力值，你可以将一张手牌当此【杀】或普通锦囊牌对其使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋黄盖","t":"毁身纾难","k":"吴","kh":4,"mh":4,"g":"男","s":[["烈计","当你使用锦囊牌结算结束后，你可以令你当前手牌中的所有伤害牌的伤害基数+1直到回合结束。",[]],["趋舟","出牌阶段限一次，你可以亮出牌堆顶一张牌，若此牌为：【杀】，你使用之；不为【杀】，你选择一项：1.获得此流程中亮出的所有牌；2.若此流程中亮出的牌数小于存活人数，你重复此流程。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋骆统","t":"知寒始北","k":"吴","kh":3,"mh":3,"g":"男","s":[["举策","你于回合内首次使用基本牌或普通锦囊牌指定目标时，你可以多选择一个目标。若如此做，该角色下回合使用的第一张基本牌或普通锦囊牌额外指定你为目标。",[]],["抗明","以你为目标的牌结算结束后，你摸一张牌并选择一项：1.展示一张本回合未以此法展示过的【杀】或普通锦囊牌视为对使用者使用；2.再摸三张牌，此技能失效直到你下回合开始（若此时是你的回合，则改为本回合结束）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋鲁肃","t":"鸿谋翼远","k":"吴","kh":3,"mh":3,"g":"男","s":[["明势","摸牌阶段结束时，你可以摸两张牌，然后展示三张手牌并令一名其他角色获得其中一张，若你手牌数不为全场最多，你再摸两张牌。",[]],["盟谋","转换技，游戏开始时可自选阴阳状态。每回合各限一次，当你获得其他角色的牌后，或当其他角色获得你的牌后，你可以令该角色： 阳：使用X张【杀】，每造成1点伤害你与其各回复1点体力； 阴：打出X张【杀】，每少打出一张其失去1点体力。 （X为你的体力上限）",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋陆逊","t":"渊谋谦略","k":"吴","kh":4,"mh":4,"g":"男","s":[["隽谋","转换技，游戏开始时可自选阴阳状态。以你为目标的牌结算结束后，你可以选择一张手牌， 阳：此牌视为无次数和距离限制的火【杀】并摸一张牌，你可以额外摸一张牌令此技能本阶段失效； 阴：此颜色的牌不计入手牌上限并横置一名角色，你可以额外横置一名角色令此技能本阶段失效。",["转换技"]],["绽炎","限定技，出牌阶段，你可以回复所有体力并横置所有对你造成过伤害的角色，然后选择任意名横置的其他角色，所选角色同时展示一张手牌，然后你可以弃置至少一张其中含有的花色的牌并对展示了对应花色的角色各造成1点火焰伤害，若所选角色均因此受到了伤害则你重复此流程。此技能结算期间每当你失去牌后你摸等量张牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋吕蒙","t":"诡识渐近","k":"吴","kh":4,"mh":4,"g":"男","s":[["横野","锁定技，当你造成伤害后，你令你本局游戏以下每个数值各+1（至多+3）： 1.摸牌阶段摸牌数；2.出牌阶段使用【杀】次数；3.攻击范围；4.手牌上限。 达到+3后，你每回合开始时回复1点体力。当你杀死一名角色后，重置此技能。",["锁定技"]],["英博","当你使用伤害牌时，若本轮已有角色使用过，此牌造成的伤害改为火焰伤害且伤害+1；没有，则此牌不能被响应，结算结束后你可以将之交给一名其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋徐盛","t":"穰苴之风","k":"吴","kh":4,"mh":4,"g":"男","s":[["勤强","每回合每项限一次，你使用手牌时，你可以选择一项：1.令此牌伤害+X；2.摸X张牌（X为你本回合此前与此牌连续使用同颜色的牌数）。",[]],["疑阵","当你受到伤害后，你可以与伤害来源互相观看对方手牌，然后各弃置其中一张牌，若这两张牌颜色相同，则你获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋周瑜","t":"炽谋英隽","k":"吴","kh":4,"mh":4,"g":"男","s":[["融火","锁定技，有角色受到火焰伤害后，你下一次使用【火杀】或【火攻】额外指定1个目标，你使用【火杀】或【火攻】造成的伤害+X（X为全场势力数）。",["锁定技"]],["英谋","转换技，游戏开始时可自选阴阳状态。每回合限一次，当你对其他角色使用牌后，你可以选择其中一个目标： 阳：你摸牌至与其相同（至多摸5张），然后视为对其使用【火攻】； 阴：令全场手牌数最多的一名角色对其使用手中所有【杀】和伤害锦囊牌（没有需弃牌至与你相同）。 若其未因此受到伤害，你对其造成1点火焰伤害。",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋诸葛瑾","t":"清雅德纯","k":"吴","kh":3,"mh":3,"g":"男","s":[["讨州","出牌阶段，你可以选择一名有手牌的其他角色并从1~3中秘密选择一个数字，此技能失效至对应轮数后恢复，其可以交给你至多三张手牌，若其以此法交给你的牌数： 不小于你选择的数字，你与其各摸一张牌； 小于你选择的数字，其下X次受到的伤害+1（X为两者差值），若X大于1，其获得〖自矜〗。",[]],["厚德","当你于其他角色的出牌阶段内：首次成为红色【杀】的目标后，你可以弃置一张牌，令此【杀】对你无效；首次成为黑色普通锦囊牌的目标后，你可以弃置其一张牌，令此锦囊牌对你无效。",[]],["自矜","锁定技，当你使用牌后，若此牌未造成伤害，你需弃置一张牌或失去1点体力。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋朱然","t":"孤城镇岳","k":"吴","kh":4,"mh":4,"g":"男","s":[["镇御","当你需要使用基本牌时，你可以横置一名角色，然后视为使用之。若如此做，此技能失效直到每轮结束或你从手牌中使用了以此法使用的基本牌。",[]],["截路","出牌阶段，你可以重置一名已横置角色并弃置其一张牌，然后若此回合下一次进入弃牌堆的牌点数大于此弃牌，你对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"庞统","t":"南州士冠","k":"吴","kh":3,"mh":3,"g":"男","s":[["过论","出牌阶段限一次，你可以展示一名其他角色的一张手牌，然后你可以展示一张手牌，交换这两张牌，展示牌点数小的角色摸一张牌。",[]],["送丧","限定技，当其他角色死亡时，若你已受伤，你可以回复1点体力；若你未受伤，你可以加1点体力上限。然后你获得〖展骥〗。",["限定技"]],["展骥","锁定技，当你于出牌阶段内不因此技能摸牌后，你摸一张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"潘濬","t":"方严疾恶","k":"吴","kh":3,"mh":3,"g":"男","s":[["观微","每回合限一次，一名角色的出牌阶段结束时，若其于此回合内使用过至少两张牌，且这些牌花色均相同或均没有花色，你可以弃置一张牌，令其摸两张牌并执行一个额外的出牌阶段。",[]],["公清","锁定技，当你受到伤害时，若伤害来源的攻击范围小于3，将伤害值改为1；当你受到伤害时，若伤害来源的攻击范围大于3，你令此伤害值+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"潘淑","t":"神女","k":"吴","kh":3,"mh":3,"g":"女","s":[["织纴","你的回合内，当你使用本回合的第一张非转化牌时，若X：不小于1，你观看牌堆顶X张牌并以任意顺序放回牌堆顶或牌堆底；不小于2，你可以弃置场上一张装备牌和一张延时锦囊牌；不小于3，你回复1点体力；不小于4，你摸三张牌（X为此牌牌名字数）。",[]],["燕尔","每回合限一次，当其他角色于其出牌阶段内失去最后的手牌后，你可以与其各摸两张牌，然后若因此摸到相同类型的两张牌的角色为：你，〖织纴〗改为回合外也可以发动直到你的下个回合开始；其，其回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"桥公","t":"崧岳执柯","k":"吴","kh":4,"mh":4,"g":"男","s":[["怀姝","游戏开始时，你获得♦和♥的非装备牌各一张，称为“明珠”。你失去“明珠”牌时，若为：♦，你可以弃置一名角色场上的一张牌；♥，你可以令一名角色失去1点体力并摸两张牌。结束阶段，你获得牌堆或弃牌堆中的一张“明珠”牌，然后你可以将此牌交给一名其他角色并摸一张牌。",[]],["遗珠","限定技，出牌阶段若你没有“明珠”，或你处于濒死状态时，你可以将所有红色牌交给一名其他角色。若如此做，你回复等量体力并摸两张牌，然后〖怀姝〗的结束阶段改为每个结束阶段。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"全惠解","t":"春宫早深","k":"吴","kh":3,"mh":3,"g":"女","s":[["慧淑","摸牌阶段结束时，你可以摸3张牌然后弃置1张手牌。若如此做，你本回合弃置超过2张牌时，从弃牌堆中随机获得等量的非基本牌。",[]],["易数","锁定技，当你于出牌阶段外失去牌后，〖慧淑〗中最小的一个数字+2且最大的一个数字-1。",["锁定技"]],["离宫","觉醒技，准备阶段，若〖慧淑〗有数字达到5，你加1点体力上限并回复1点体力，失去〖易数〗，然后从随机四个吴国女性武将中选择至多两个技能获得并失去〖慧淑〗（如果不获得技能则改为摸三张牌）。",["觉醒技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"芮姬","t":"柔荑弄钺","k":"吴","kh":4,"mh":4,"g":"女","s":[["妄缘","当你于回合外失去牌后，你可以随机将牌堆中一张基本牌或锦囊牌置于你的武将牌上，称为“妄”（“妄”的牌名不重复且至多为游戏人数）。",[]],["铃音","出牌阶段开始时，你可以获得至多X张“妄”（X为游戏轮数）。然后若“妄”颜色均相同，你本回合对其他角色造成的伤害+1且可以将武器或防具牌当【决斗】使用。",[]],["俐影","每回合限一次，当你于摸牌阶段外获得牌后，你可以将其中任意张牌交给一名其他角色，然后你摸一张牌。若此时是你的回合内，再增加一张“妄”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"食岑昏","t":"生啖其肉","k":"吴","kh":3,"mh":3,"g":"男","s":[["暴食","摸牌阶段结束时，你可以亮出牌堆顶的两张牌。若亮出牌的牌名字数之和不大于10（【桃】或【酒】不计入牌名字数统计），你选择一项：1.获得所有亮出的牌；2.再亮出一张。",[]],["兴功","出牌阶段限一次，你可以选择获得任意张本回合进入弃牌堆的牌，若张数大于当前体力值，每超出一张对自己造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"是仪","t":"清恪贞佐","k":"吴","kh":3,"mh":3,"g":"男","s":[["榱椽","出牌阶段限一次，你可以弃置一张手牌并选择一名角色，从牌堆中将一张随机装备牌置入其装备区空位，你摸X张牌（X为其装备区牌数）。若其装备区内的牌因此达到4张或以上，你失去〖榱椽〗并获得〖佐谏〗，然后令其在此回合结束后获得一个额外回合。",[]],["正序","每回合各限一次，当你失去牌后，你本回合下一次受到伤害时，你可以防止此伤害；当你受到伤害后，你本回合下一次失去牌后，你可以摸等量的牌。",[]],["佐谏","出牌阶段结束时，若你此阶段使用的牌数不小于你的体力值，你可以选择一项：1.令装备区牌数大于你的角色摸一张牌；2.弃置装备区牌数小于你的每名角色各一张手牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"双璧孙策","t":"江东双璧","k":"吴","kh":4,"mh":4,"g":"男","s":[["双璧","出牌阶段限一次，你可以选择一名周瑜助战： 界周瑜：摸X张牌，本回合手牌上限+X； 神周瑜：弃置至多X张牌，随机造成等量的火焰伤害； 谋周瑜：视为使用X张火【杀】或【火攻】。 （X为存活角色数，至多为你的体力上限）",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"苏飞","t":"义荐恩还","k":"吴","kh":4,"mh":4,"g":"男","s":[["数荐","出牌阶段限三次，你可以交给一名其他角色一张牌，然后其选择一项：1.令你摸3张牌并弃2张牌；2.视为使用3张【过河拆桥】，本回合此技能失效。此阶段下次发动该技能，选项中所有数字-1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙霸","t":"庶怨嫡位","k":"吴","kh":4,"mh":4,"g":"男","s":[["结党","回合开始时，你可以令所有角色将任意张牌置于你的武将牌上，因此失去牌的角色摸一张牌。你在以下时机须移去武将牌上一种类别的牌并摸等量的牌：1.进入濒死状态时；2.出牌阶段开始时；3.结束阶段。",[]],["觊嫡","锁定技，体力值大于你的角色对你造成伤害时，其失去1点体力；手牌数大于你的角色对你造成伤害时，其随机弃置两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙綝","t":"凶竖盈溢","k":"吴","kh":4,"mh":4,"g":"男","s":[["自固","出牌阶段限一次，你可以弃置一张牌，然后获得场上一张装备牌。若你没有因此获得其他角色的牌，你摸一张牌。",[]],["作威","当你于回合内使用牌时，若你当前手牌数：大于X，你可以令此牌不可响应；等于X，你可以对一名其他角色造成1点伤害；小于X，你可以摸两张牌并令本回合此选项失效（X为你装备区内的牌数且至少为1）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙寒华","t":"青丝慧剑","k":"吴","kh":3,"mh":3,"g":"女","s":[["汇灵","锁定技，你使用牌时，若弃牌堆中的红色牌数量多于黑色牌，你回复1点体力；黑色牌数量多于红色牌，你可以弃置一名其他角色区域内的一张牌；牌数较少的颜色与你使用牌的颜色相同，你获得一个“灵”标记。",["锁定技"]],["冲虚","限定技，出牌阶段，若“灵”的数量不小于4，你可以失去〖汇灵〗，增加等量的体力上限，并获得〖踏寂〗和〖清荒〗。",["限定技"]],["踏寂","当你失去手牌后，你根据此牌的失去方式执行效果：\n使用-弃置一名其他角色一张牌；\n打出-摸一张牌；\n弃置-回复1点体力；\n其他-你下次对其他角色造成的伤害+1。",["衍生技"]],["清荒","出牌阶段开始时，你可以减1点体力上限，然后你本回合发动〖踏寂〗时随机额外执行一种效果。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙皓","t":"时日曷丧","k":"吴","kh":5,"mh":5,"g":"男","s":[["残蚀","摸牌阶段，你可以额外摸X张牌(X为已受伤的角色数)，然后本回合你使用【杀】或普通锦囊牌时，弃置一张牌。",[]],["仇海","锁定技，当你受到【杀】造成的伤害时，若你没有手牌，此伤害+1。",["锁定技"]],["归命","主公技，锁定技，其他吴势力角色于你的摸牌阶段视为已受伤的角色。",["主公技","锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"孙和","t":"位废南鲁","k":"吴","kh":4,"mh":4,"g":"男","s":[["冠宠","每回合限一次，其他角色在摸牌阶段外单次获得超过一张牌时，你可以令其交给你一张指定类型的手牌，若其没有此类型的手牌，你摸一张牌，你因此技能获得牌后所有手牌点数+1。",[]],["谗黜","锁定技，你的回合开始时，令所有角色弃置一张手牌并选择支持你或反对你，若所有选择反对的角色弃置的牌点数和大于等于所有选择支持的角色弃置的牌点数和，你失去1点体力并获得本回合因此技能弃置的点数最大的牌；否则你令至多三名其他角色失去1点体力并随机获得这些角色各一张手牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙桓","t":"扼龙决险","k":"吴","kh":4,"mh":4,"g":"男","s":[["逆击","当你成为非装备牌的目标后，你可以摸一张牌，本回合结束阶段弃置这些牌，弃置前你可以先使用其中一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"孙峻","t":"骄矜险害","k":"吴","kh":5,"mh":5,"g":"男","s":[["备诛","每回合结束时，若你本回合满足过以下一项，你可以执行与之相邻的一项，然后令一名角色执行剩余的一项：1.至少受到序号数点伤害；2.至少弃置序号数张牌；3.至少摸序号数张牌。你的回合开始时，你可以交换两个相邻的选项。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"孙翎鸾","t":"弦凤栖梧","k":"吴","kh":3,"mh":3,"g":"女","s":[["聆乐","锁定技，一名角色每轮首次造成伤害后，你摸一张牌。若此时是该角色回合外，改为摸X张牌（X为本回合全场造成的伤害值）。",["锁定技"]],["盻睇","出牌阶段，你可以选择一名本回合未造成过伤害的其他角色，你此阶段使用的下一张牌，视为该角色使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙鲁育","t":"舍身饲虎","k":"吴","kh":3,"mh":3,"g":"女","s":[["魅步","其他角色的出牌阶段开始时，若你在其攻击范围内，你可以弃置一张牌，令该角色于本回合内拥有〖止息〗。若其本回合因〖止息〗弃置牌的花色与你本次发动〖魅步〗弃置牌的花色相同，你获得之。",[]],["穆穆","出牌阶段开始时，你可以选择一项：1.弃置一名其他角色装备区里的一张牌，你本回合出牌阶段使用【杀】次数上限+1；2.获得一名其他角色装备区里的一张牌，你本回合出牌阶段使用【杀】次数上限-1。",[]],["止息","锁定技，出牌阶段，当你使用【杀】或锦囊牌时，需弃置一张手牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙茹","t":"呦呦鹿鸣","k":"吴","kh":3,"mh":3,"g":"女","s":[["撷翠","当一名角色于其回合内使用牌首次造成伤害时，你可以令此伤害+1。若该角色为吴势力角色，其获得此伤害牌且本回合手牌上限+1。",[]],["忧恤","一名角色回合结束时，若其手牌数大于体力值，你可以展示其一张手牌并交给另一名角色，若获得牌的角色体力值全场最低，其回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙翊","t":"虓风快意","k":"吴","kh":5,"mh":5,"g":"男","s":[["激峭","出牌阶段开始时，你可以将牌堆顶X张牌置于武将牌上（X为你的体力上限）；当你使用一张牌结算结束后，若你的武将牌上有“激峭”牌，你获得其中一张，然后若剩余其中两种颜色牌的数量相等，你回复1点体力，否则你失去1点体力；出牌阶段结束时，移去所有“激峭”牌。",[]],["凶疑","限定技，当你处于濒死状态时，若徐氏：不在场，你可以将体力值回复至3点并将武将牌替换为徐氏；在场，你可以将体力值回复至1点并获得技能〖魂姿〗。",["限定技"]],["魂姿","觉醒技，准备阶段，若你的体力值不大于2，你减1点体力上限，然后获得〖英姿〗和〖英魂〗。",["觉醒技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙瑜","t":"镇据边陲","k":"吴","kh":3,"mh":3,"g":"男","s":[["劝守","一名角色回合开始时，若其手牌数不大于体力上限，你可以令其选择：1.将手牌摸至体力上限（至多摸五张），其于此回合的出牌阶段内使用【杀】次数上限-1；2.其于此回合内使用牌被抵消后，你摸一张牌。",[]],["设学","出牌阶段开始时，你可以将一张牌当上个回合角色出牌阶段内使用过的一张基本牌或普通锦囊牌使用（无距离限制）；出牌阶段结束时，你可以令下个回合角色于其出牌阶段开始时可以将一张牌当你本阶段使用过的一张基本牌或普通锦囊牌使用（无距离限制）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陶璜","t":"威惠素著","k":"吴","kh":4,"mh":4,"g":"男","s":[["制绝","锁定技，你计算与其他角色的距离-2；当你造成伤害后，若你的手牌数小于体力上限，你将手牌摸至体力上限且此技能失效直到回合结束。",["锁定技"]],["维卫","每回合限一次，当你成为其他角色使用牌的目标后，你可以与其各摸两张牌，然后交换一张手牌，此牌结算后你可以使用其交给你的牌；若你交给其的牌此回合结束时仍在其手牌中，则你可以对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"滕芳兰","t":"铃兰零落","k":"吴","kh":3,"mh":3,"g":"女","s":[["落宠","每轮开始时，你可以弃置任意名角色区域内共计至多4张牌，若你一次性弃置了一名角色区域内至少3张牌，〖落宠〗弃置牌数-1。",[]],["哀尘","锁定技，若剩余牌堆牌数大于80，当你发动〖落宠〗弃置自己区域内的牌后，你摸两张牌；若剩余牌堆数大于40，你跳过弃牌阶段；若剩余牌堆数小于40，当你成为♠牌的目标后，你不能响应此牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"滕公主","t":"芳华荏苒","k":"吴","kh":3,"mh":3,"g":"女","s":[["幸宠","每轮游戏开始时，你可以摸任意张牌并展示任意张牌（摸牌和展示牌的总数不能超过你的体力上限）。若如此做，本轮内当你失去一张以此法展示的手牌后，你摸两张牌。",[]],["流年","锁定技，牌堆第一次洗牌的回合结束时，你加1点体力上限。牌堆第二次洗牌的回合结束时，你回复1点体力，然后本局游戏手牌上限+10。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"滕胤","t":"厉操遵蹈","k":"吴","kh":3,"mh":3,"g":"男","s":[["陈见","准备阶段，你可以亮出牌堆顶的三张牌，执行任意项：1.弃置一张牌，令一名角色获得其中此牌花色的牌；2.使用其中一张牌。若两项均执行，则本局游戏你发动〖陈见〗亮出牌数+1（最多五张），然后你重铸所有手牌。",[]],["皙秀","锁定技，当你成为其他角色使用牌的目标后，若你装备区内有与此牌花色相同的牌，你摸一张牌；其他角色不能弃置你装备区内的最后一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"王笙","t":"承嗣尊后","k":"吴","kh":4,"mh":4,"g":"女","s":[["遭谮","其他角色出牌阶段限一次，其可以弃置一张非基本牌，然后令你视为对一名角色使用一张【杀】，若此【杀】造成伤害，本回合你视为所有【杀】的使用者；若此【杀】未造成伤害，你视为对当前回合角色依次使用两张【杀】。",[]],["追懿","锁定技，你使用牌结算完毕后，若你是本局游戏使用此牌名的牌数唯一最多的，你摸一张牌；你死亡时，令一名其他角色从牌堆获得触发过此技能的牌名不同的牌各一张。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威孙策","t":"勇冠三江势","k":"吴","kh":5,"mh":5,"g":"男","s":[["猘锋","每回合限X次（X为游戏人数），若你的手牌数：大于体力值，你可将至少一张黑色牌当不计入次数的【酒】使用；小于体力值，你可将一张红色牌当无距离限制的任意【杀】使用或打出，然后将手牌摸至体力上限；等于体力值，你可将至少一张牌当【决斗】对至多两名目标使用。",[]],["威靖","其他吴势力角色的回合开始时，你可以选择一项令其执行：1.受到你造成的1点伤害；2.交给你一张牌，然后其可发动一次对应条件的“猘锋”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威孙权","t":"坐断东南","k":"吴","kh":4,"mh":4,"g":"男","s":[["斡衡","出牌阶段或当你受到伤害后，你可以令一名其他角色摸或弃置X张牌（X为本轮发动此技能次数）。然后若其手牌数与你不同或X大于3，你摸两张牌且此技能本回合失效。",[]],["御麾","结束阶段，你可以选择一名吴势力的其他角色，其出牌阶段开始时可以交给你一张红色基本牌并发动一次X为1的〖斡衡〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威孙尚香","t":"巽荷绽情","k":"吴","kh":3,"mh":3,"g":"女","s":[["淑任","出牌阶段限一次，你可废除一个装备栏，亮出牌堆顶三张牌，你选择其中一张牌获得并可选择一名其他角色获得其中一张牌，若此装备栏有牌则此技能视为未发动过并恢复1点体力。",[]],["飒然","你的装备区每有一张牌，你出牌阶段使用【杀】次数+1。你受到或造成1点伤害后，从牌堆或弃牌堆中随机使用一张装备牌（优先使用空置装备栏对应类别的牌），若有废除的装备栏可以先选择一个装备栏恢复。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"卫温诸葛直","t":"帆至夷洲","k":"吴","kh":4,"mh":4,"g":"男","s":[["浮海","出牌阶段对每名角色限一次，你可以展示一张手牌并选择上家或下家，该角色展示一张手牌。若你的牌点数：不小于其，你弃置你展示的牌，然后对其上家或下家重复此流程；小于其，其弃置其展示的牌，然后你与其各摸X张牌（X为你本阶段发动此技能选择过的角色数），本阶段〖浮海〗失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吴范","t":"占星定卜","k":"吴","kh":4,"mh":4,"g":"男","s":[["天运","获得起始手牌后，你再从牌堆中随机获得手牌中没有的花色各一张牌。 一名角色回合开始时，若其座次等于游戏轮数，你可以观看牌堆顶的X张牌，然后以任意顺序置于牌堆顶或牌堆底，若你将所有牌均置于牌堆底，则你可以令一名角色摸X张牌（X为你手牌中的花色数），若如此做，你失去1点体力。",[]],["预言","每轮开始时，你选择一名角色，若其是本轮第一个进入濒死状态的角色，则你获得技能〖奋音〗直到你的回合结束；若其是本轮第一个造成伤害的角色，则你摸两张牌。",[]],["奋音","锁定技，你的回合内，每当一种花色的牌进入弃牌堆后（每回合每种花色各限一次），你摸一张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武陆抗","t":"桢武熙朝","k":"吴","kh":4,"mh":4,"g":"男","s":[["审断","当你拼点时，你可以弃置一张牌，改为用牌堆中点数最大的一张牌拼点。当一次拼点结算后，赢的角色的拼点牌置于牌堆底，然后本次用K拼点的角色各摸一张牌堆中点数最小的牌。",[]],["克构","出牌阶段开始时或你使用或打出过牌的回合结束时，你可以与一名其他角色拼点，若你赢，你获得牌堆中最小的两个点数的牌各一张；若你没赢，其可以视为对你使用一张【杀】，然后你可以继续重复此流程。",[]],["砥贤","限定技，出牌阶段，你可以选择一个点数。若牌堆中所有牌均不小于此点数，你摸此点数张牌，你本局游戏使用不大于此点数的牌无距离次数限制；若牌堆中有小于此点数的牌，你获得场上、牌堆和弃牌堆中所有点数为K的牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武陆逊","t":"释武怀儒","k":"吴","kh":3,"mh":3,"g":"男","s":[["雄幕","每轮开始时，你可以将手牌摸至体力上限，然后将任意张牌随机置入牌堆，从牌堆或弃牌堆中获得等量的点数为8的牌，这些牌此轮内不计入你的手牌上限。当你每回合受到第一次伤害时，若你的手牌数不大于体力值，此伤害-1。",[]],["彰才","当你使用或打出点数为8的牌时，你可以摸X张牌（X为手牌中与使用的牌点数相同的牌的数量且至少为1）。",[]],["儒贤","限定技，出牌阶段，你可以将〖彰才〗改为所有点数均可触发摸牌直到你的下回合开始。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"小孙权","t":"牌堆的掌控者","k":"吴","kh":3,"mh":3,"g":"男","s":[["会玩","每回合每种牌名限一次，当你摸牌时，你可以选择至多等量牌堆中有的基本牌或普通锦囊牌牌名，改为从牌堆中获得你选择的牌。",[]],["唤理","结束阶段，若你本回合内使用牌指定自己为目标至少三次，你可以令一名其他角色所有技能失效，其获得〖直谏〗和〖固政〗直到其下回合结束。若你本回合内使用牌指定同一名其他角色为目标至少三次，你可以令其所有技能失效，其获得〖英姿〗和〖反间〗直到其下回合结束。若两项均执行，你获得〖制衡〗直到你下回合结束。",[]],["直谏","出牌阶段，你可以将手牌中的一张装备牌置于其他角色的装备区里，然后摸一张牌。",["衍生技"]],["固政","其他角色的弃牌阶段结束时，你可以将此阶段中其弃置的一张手牌交给该角色，然后你可以获得其余此阶段内弃置的牌。",["衍生技"]],["英姿","锁定技，摸牌阶段，你多摸一张牌；你的手牌上限等同于你的体力上限。",["锁定技","衍生技"]],["反间","出牌阶段限一次，你可以展示一张手牌并交给一名其他角色，然后其选择：1.展示所有手牌，弃置所有与你以展示的牌花色相同的牌；2.失去1点体力。",["衍生技"]],["制衡","出牌阶段限一次，你可以弃置任意张牌并摸等量的牌。若你以此法弃置了所有的手牌，你多摸一张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"谢灵毓","t":"淑静才媛","k":"吴","kh":3,"mh":3,"g":"女","s":[["元嫡","其他角色于其出牌阶段使用第一张牌时，若此牌没有指定除其以外的角色为目标，你可以选择一项：1.弃置其一张手牌；2.你与其各摸一张牌。",[]],["心幽","出牌阶段限一次，你可以回复体力至体力上限并将手牌摸至体力上限。若你因此摸超过两张牌，结束阶段你失去1点体力；若你因此回复体力，结束阶段你弃置一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星丁奉","t":"廓清阶陛","k":"吴","kh":4,"mh":4,"g":"男","s":[["荡尘","出牌阶段开始时，你可以令一名其他角色交给你至少一张牌，然后你可以弃置等量的牌，若你弃置了牌，本阶段【杀】或普通锦囊牌指定其为目标后，你可以进行判定，若判定结果点数为X的倍数，此牌额外结算一次效果。（X为弃牌数）",[]],["翦羽","锁定技，其他角色于你的回合内失去装备区的牌后，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星孙尚香","t":"鸳袖衔剑珮","k":"吴","kh":3,"mh":3,"g":"女","s":[["飒影","每轮每种牌名限一次，当你需要使用【杀】或【闪】时，你可以使用一张装备牌，然后视为使用之；当你需要使用【桃】或【酒】时，你可以收回装备区里的一张牌，然后视为使用之。",[]],["骄豪","出牌阶段限一次，你可以与装备区里的牌数不大于你的角色拼点，然后你可以令拼点赢的角色获得拼点的牌或者令其使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星张昭","t":"忠謇方直","k":"吴","kh":3,"mh":3,"g":"男","s":[["忠言","出牌阶段限一次，你可展示牌堆顶三张牌，令一名角色将一张手牌交换其中一张牌。然后若这些牌颜色相同，其选择回复1点体力或获得场上一张牌；若该角色不为你，你执行另一项。",[]],["经纶","每回合限一次，你距离1以内的角色造成伤害后，你可以令其摸X张牌，并对其发动〖忠言〗（X为其装备区牌数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星诸葛瑾","t":"怀玉之臣","k":"吴","kh":3,"mh":3,"g":"男","s":[["尊谏","出牌阶段每种花色限一次，你可以弃置一种花色的所有手牌并令一名角色摸X张牌 （X为你手牌中缺少的花色数），然后若其手牌数为全场唯一最多，此技能本回合失效，其可以交给你至多两张手牌。",[]],["弘雅","每回合限一次，当你成为其他角色使用牌的目标时，你可以重铸一张比其使用的牌点数更大的手牌，令其使用的牌对你无效；若你重铸的牌点数为你手牌中点数最大的牌，则你额外摸X张牌（X为你手牌中缺少的花色数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"许贡","t":"独计击流","k":"吴","kh":3,"mh":3,"g":"男","s":[["表召","结束阶段，你可以将一张牌置于武将牌上，称为“表”。 当一张与“表”花色点数均相同的牌进入弃牌堆后，若此牌是其他角色弃置的牌，则其获得“表”，否则你移去“表”并失去1点体力。 准备阶段，你移去“表”，令一名角色回复1点体力，其将手牌摸至与手牌最多的角色相同（至多摸五张）。",[]],["业仇","你死亡时，你可以选择一名已损失的体力值大于1的角色。若如此做，每名角色的结束阶段，其失去1点体力，直到其下回合开始。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"徐琨","t":"平虏击逆","k":"吴","kh":4,"mh":4,"g":"男","s":[["筏铸","准备阶段，你可以重铸你区域内任意张非伤害牌，然后将因此获得的牌交给至多等量名角色各一张，以此法获得牌的角色可以依次使用一张【杀】（无距离限制）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"徐馨","t":"望云思归","k":"吴","kh":3,"mh":3,"g":"女","s":[["育贤","每轮开始时，你可以依次选择至多4张手牌展示并记录花色，其他角色回合该角色使用前4张牌时，每有1张牌与你记录花色相同且对应顺序，你可与其各摸一张牌。",[]],["愍善","当你受到1点伤害后，可令一名角色从牌堆中获得两张牌（优先获得你所记录的花色）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"严畯","t":"志存补益","k":"吴","kh":3,"mh":3,"g":"男","s":[["观潮","出牌阶段开始时，你可以选择“递增”或“递减”，本阶段当你使用牌时，若你此阶段使用过的所有牌点数均为严格递增或严格递减，你摸一张牌。",[]],["逊贤","每回合限一次，你使用或打出的牌置入弃牌堆时，你可以将之交给一名手牌数或体力值大于你的角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"袁姬","t":"袁门贵女","k":"吴","kh":3,"mh":3,"g":"女","s":[["芳妒","锁定技，你的回合外，你每回合第一次受到普通伤害后回复1点体力，你每回合第一次受到属性伤害后随机获得伤害来源一张手牌。",["锁定技"]],["节行","当你的体力值变化后，你可以摸一张牌，此牌于本回合内不计入手牌上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张奋","t":"御驰大攻","k":"吴","kh":4,"mh":4,"g":"男","s":[["望橹","锁定技，准备阶段，你将【大攻车】置入你的装备区，若你的装备区内已有【大攻车】，则改为执行一个额外的出牌阶段。",["锁定技"]],["陷筑","当你使用【杀】造成伤害后，你可以升级【大攻车】（每个【大攻车】最多升级5次）。",[]],["拆械","锁定技，当你的【大攻车】销毁后，你摸X张牌（X为该【大攻车】的升级次数）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"张纮","t":"文理意正","k":"吴","kh":4,"mh":4,"g":"男","s":[["擘画","一名角色的摸牌阶段开始时，你可以令其此阶段摸牌数-1，然后该角色本回合获得技能〖扩谏〗。此回合结束时，若其未发动〖扩谏〗，则此技能本轮失效。",[]],["共略","出牌阶段限一次，你可以选择一名手牌数与你不同的角色，令手牌数较少的一方摸至与另一方相同（至多摸五张）。若如此做，因此摸牌的角色可以将一张手牌当未摸牌的一方手牌中的一张基本牌或普通锦囊牌使用（无距离次数限制），且未摸牌的一方下次于出牌阶段摸牌时，摸牌数翻倍（至多多摸五张）直到其出牌阶段结束。",[]],["扩谏","出牌阶段限一次，你可以将任意张不同花色的牌当【无中生有】使用，此【无中生有】摸牌数+X（X为你以此法使用的花色数）。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张怀","t":"连理分枝","k":"吴","kh":3,"mh":3,"g":"女","s":[["劳燕","锁定技，其他角色使用牌指定包括你在内的多个目标后，此牌对其他目标无效，你从牌堆获得点数小于此牌的牌每个点数各一张，当前回合结束时弃置这些牌。",["锁定技"]],["诀言","当你使用仅指定唯一目标的手牌结算结束后（每回合每种类别限一次），你可以选择一项： 1.摸1张牌； 2.随机获得弃牌堆1张牌； 3.与一名角色拼点，赢的角色对没赢的角色造成1点伤害。 然后，此次选择的选项的数值改为1，其他选项的数值+1（至多为3）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张温","t":"冲天孤鹭","k":"吴","kh":3,"mh":3,"g":"男","s":[["颂蜀","出牌阶段限一次，你可以与一名其他角色拼点：若你没赢，你和该角色各摸两张牌；若你赢，视为本阶段此技能未发动过。",[]],["思辩","摸牌阶段，你可以放弃摸牌，改为亮出牌堆顶的4张牌，你获得其中所有点数最大和最小的牌，然后你可以将剩余的牌交给一名手牌数最少的角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张嫙","t":"玉宇嫁蔷","k":"吴","kh":4,"mh":4,"g":"女","s":[["同礼","出牌阶段，当你使用牌指定目标后，若你手牌中的花色数等于你此阶段已使用牌的张数，你可以令此牌效果额外执行X次（X为你手牌中的花色数）。",[]],["奢葬","每轮限一次，当你或你回合内有角色进入濒死状态时，你可以从牌堆获得不同花色的牌各一张。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张媱","t":"琼楼孤蒂","k":"吴","kh":3,"mh":3,"g":"女","s":[["怨语","出牌阶段限一次，你可以摸一张牌并将一张手牌置于武将牌上，称为“怨”，然后选择一名其他角色：你与其弃牌阶段开始时，或当该角色造成1点伤害后，其也须放置一张“怨”直到你触发〖夕颜〗。",[]],["夕颜","每次增加“怨”时，若“怨”的花色数达到4种，你可以获得所有“怨”。然后若此时是你的回合，你的〖怨语〗视为未发动过，本回合手牌上限+4且使用牌无次数限制；若不是你的回合，你可以令当前回合角色本回合手牌上限-4且本回合不能使用基本牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"张昭","t":"威德翕赫","k":"吴","kh":4,"mh":4,"g":"男","s":[["佐政","其他角色出牌阶段开始时，若其手牌数不大于你，你可以观看其手牌并使用其中一张牌，若其本阶段使用的下一张牌与此牌目标或类型相同，你选择与其各获得一张同类型牌或各回复1点体力，若不同，你不可使用与此牌花色相同的牌直到此回合结束。",[]],["弘敏","每轮开始时，你可以展示手牌中一种花色的牌并摸等量牌（至多摸五张），若如此做，直至本轮结束，你防止下次受到的伤害，且有角色弃牌阶段弃置与此牌颜色相同的牌时，你获得之，并可以将其中至多五张牌分配给一名其他角色或置于牌堆顶。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵嫣","t":"霞蔚青歇","k":"吴","kh":3,"mh":3,"g":"女","s":[["锦绘","出牌阶段限一次，你可以亮出牌堆里随机三张牌名各不相同且目标数为一的非伤害牌，然后选择一名其他角色，该角色使用其中一张，然后你可以依次使用其余两张（必须选择你或其为目标，无距离限制）。",[]],["轻幔","锁定技，每个回合结束时，你将手牌摸至X张（X为当前回合角色装备区内的空位数）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"周鲂","t":"下发载义","k":"吴","kh":3,"mh":3,"g":"男","s":[["断发","出牌阶段，你可以弃置任意张黑色牌，然后摸等量的牌（你每阶段以此法弃置的牌数总和不能大于体力上限）。",[]],["诱敌","结束阶段，你可以令一名其他角色弃置你一张手牌，若弃置的牌不是【杀】，则你获得其一张牌；若弃置的牌不是黑色，则你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"周善","t":"荆吴刑天","k":"吴","kh":4,"mh":4,"g":"男","s":[["密运","锁定技，每轮开始时，你展示并获得一名其他角色的一张牌，称为『安』；每轮结束时，你将包括『安』在内的任意张手牌交给一名其他角色，然后你将手牌摸至体力上限。不以此法失去『安』时，你失去1点体力。",["锁定技"]],["胆迎","每回合限一次，你可以展示手牌中的『安』，视为使用或打出一张【杀】或【闪】。若如此做，本回合你下次成为牌的目标后，使用者弃置你一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"周夷","t":"靛情雨黛","k":"吴","kh":4,"mh":4,"g":"女","s":[["逐寇","当你于每回合的出牌阶段首次造成伤害后，你可以摸X张牌（X为本回合你已使用的牌数）。结束阶段，若你本回合未造成过伤害，你可以对两名其他角色各造成1点伤害。",[]],["氓情","觉醒技，每个回合结束时，若已受伤角色数大于等于你的体力值，你加3点体力上限并回复3点体力，失去〖逐寇〗，获得〖玉殒〗。",["觉醒技"]],["玉殒","锁定技，出牌阶段开始时，你失去1点体力或体力上限（你的体力上限不能以此法被减至1以下），然后选择X+1项（X为你已损失的体力值）：\n1.摸两张牌；\n2.对一名其他角色造成1点伤害，然后本回合对其使用【杀】无距离和次数限制；\n3.本回合没有手牌上限；\n4.获得一名其他角色区域内的一张牌；\n5.令一名其他角色将手牌摸至体力上限（最多摸至5）。",["锁定技","衍生技"]],["玉陨","锁定技，出牌阶段开始时，你失去1点体力或体力上限（你的体力上限不能以此法被减至1以下），然后选择X+1项（X为你已损失的体力值）：\n1.摸两张牌；\n2.对一名其他角色造成1点伤害，然后本回合对其使用【杀】无距离和次数限制；\n3.本回合没有手牌上限；\n4.获得一名其他角色区域内的一张牌；\n5.令一名其他角色将手牌摸至体力上限（最多摸至5）。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"朱佩兰","t":"景皇后","k":"吴","kh":3,"mh":3,"g":"女","s":[["辞虑","当你成为普通锦囊牌的目标后，你可以摸X张牌（X为此技能的剩余选项数），若你的手牌数大于你的体力上限，你选择并移除一项：1.此牌对你无效；2.此牌造成伤害时防止之；3.此牌结算结束后你获得之。",[]],["痛悼","限定技，当你处于濒死状态时，你可以令一名角色技能还原为游戏开始时状态。若不为你，你回复体力至与其相同。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹豹","t":"杯盏游神","k":"群","kh":4,"mh":5,"g":"男","s":[["厌酒","锁定技，每轮结束时，你失去X点体力，若因此失去体力，你选择一名其他角色下次受到【杀】伤害+1，若未因此失去体力，你回复1点体力（X为你本轮使用【酒】的数量）。",["锁定技"]],["迫饮","锁定技，回合开始时，你摸体力上限张牌，并选择其中已损失体力值或当前体力值张牌视为【酒】；回合结束时，手牌数全场最多的角色猜测你手牌中【酒】数是否大于其他手牌数，若猜对，其从牌堆中获得一张【杀】，若猜错，你可以重铸任意张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹性","t":"健儿","k":"群","kh":4,"mh":4,"g":"男","s":[["流矢","出牌阶段，你可以将一张♥牌置于牌堆顶，视为对一名角色使用一张【杀】（无距离次数限制）。受到此【杀】伤害的角色手牌上限-1。",[]],["斩腕","锁定技，受到〖流矢〗效果影响的角色弃牌阶段结束时，若其于此阶段内弃置过牌，你摸等量的牌，然后移除其〖流矢〗的效果。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹媛","t":"千娇百媚","k":"群","kh":3,"mh":3,"g":"女","s":[["妩艳","出牌阶段，或当你受到伤害后，你可以选择一名男性角色，令其可以对你选择的一名其他角色使用一张手牌。若其使用了牌，你摸两张牌；若其未使用牌或未造成伤害，此技能本阶段失效，然后你可以令其失去1点体力。",[]],["占欲","回合开始时，你可以展示一张手牌，令所有其他角色随机弃置一张相同花色的手牌，然后你获得其中一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈登","t":"湖海之士","k":"群","kh":3,"mh":3,"g":"男","s":[["望族","每回合限一次，当你受到其他角色造成的伤害时，你可以随机弃置一张手牌令此伤害-1，若你所在的阵营存活人数全场最多，则改为选择一张手牌弃置。",[]],["营说","出牌阶段限一次，你可以将一张牌交给你攻击范围内的一名角色，其选择：1.你对其造成1点伤害；2.将至少两张装备牌交给你。",[]],["扶援","当一名角色成为【杀】的目标后，若其本回合此前未成为过红色牌的目标，你可以令其摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈珪","t":"弄虎如婴","k":"群","kh":3,"mh":3,"g":"男","s":[["营图","每回合限一次，当一名角色于其摸牌阶段外获得牌后，若其是你的上家或下家，你可以获得该角色的一张牌，然后交给你的下家或上家一张牌。若以此法给出的牌为装备牌，获得牌的角色使用之。",[]],["从势","锁定技，当一名角色使用装备牌结算结束后，若其装备区里的牌数为全场最多，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"淳于琼","t":"西原右校尉","k":"群","kh":4,"mh":4,"g":"男","s":[["仓储","锁定技，游戏开始时，你获得3枚“粮”标记；每拥有1枚“粮”手牌上限+1；当你于回合外获得牌时，获得1枚“粮”（每回合限一枚，且“粮”的总数不能大于存活角色数）。",["锁定技"]],["粮营","弃牌阶段开始时，你可以选择至多X名角色并摸等量张牌，然后交给其中每名其他角色各一张手牌（X为“粮”的数量）。",[]],["失守","锁定技，当你使用【酒】或受到火焰伤害后，你失去1枚“粮”。准备阶段，若你没有“粮”，你失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"崔烈","t":"镇纲责僭","k":"群","kh":4,"mh":4,"g":"男","s":[["赀爵","出牌阶段限一次，你可以令一名其他角色声明2~4之间的一个数字，你可以交给其X张牌并回复1点体力，然后直到你的下个回合开始：其他角色与你计算距离+X，你的拼点牌点数+X且拼点后摸一张牌；若你未交给其牌则你摸X张牌（X为其声明的数字）。",[]],["斥避","当其他角色使用牌指定距离其大于1的角色为目标时，你可以与其拼点，若你：赢，你令此牌无效并获得此牌；没赢，你成为此牌的额外目标，且此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"丁原","t":"养虎为患","k":"群","kh":4,"mh":4,"g":"男","s":[["慈孝","准备阶段，若场上没有“义子”，你可以令一名其他角色获得一个“义子”标记；若场上有“义子”标记，你可以弃置一张牌移动“义子”标记。拥有“义子”标记的角色获得技能〖叛弑〗。",[]],["先率","锁定技，一名角色造成伤害后，若此伤害是本轮第一次造成伤害，你摸一张牌；若伤害来源为你，你对受到伤害的角色造成1点伤害。",["锁定技"]],["叛弑","锁定技，准备阶段，你交给有〖慈孝〗的角色一张手牌。你于出牌阶段使用的【杀】对其造成的伤害+1且使用【杀】对其造成伤害后结束出牌阶段。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董白","t":"魔姬","k":"群","kh":3,"mh":3,"g":"女","s":[["连诛","出牌阶段限一次，你可以展示并交给一名其他角色一张牌，若此牌为：红色，你摸一张牌；黑色，其选择一项：1.你摸两张牌；2.弃置两张牌。",[]],["黠慧","锁定技，你的黑色牌不占用手牌上限；其他角色获得你的黑色牌后，这些牌标记为“黠慧”，其不能使用、打出、弃置“黠慧”牌直到其体力值减少。其他角色回合结束时，若其本回合失去过“黠慧”牌且手牌中没有“黠慧”牌，其失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董承","t":"扬义誓诛","k":"群","kh":4,"mh":4,"g":"男","s":[["血诏","出牌阶段限一次，你可以弃置一张手牌并选择至多X名其他角色（X为你的体力上限），然后令这些角色依次选择是否交给你一张牌，若选择是，该角色摸一张牌且你本阶段使用【杀】的次数上限+1；若选择否，该角色本阶段不能响应你使用的牌。若没有角色交给你牌，你将手牌摸至体力上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董贵人","t":"衣雪宫柳","k":"群","kh":3,"mh":3,"g":"女","s":[["连枝","游戏开始时，你选择一名其他角色。每回合限一次，当你进入濒死状态时，若该角色没有死亡，你回复1点体力并与其各摸一张牌。该角色死亡时，你可以选择一名其他角色，你与其获得〖受责〗，其获得与你等量的“绞”标记（至少1个）。",[]],["凌芳","锁定技，准备阶段，或当其他角色对你使用，或当你对其他角色使用的黑色牌结算后，你获得一枚“绞”标记。",["锁定技"]],["风影","一名角色的回合开始时，记录弃牌堆中的黑色基本牌和黑色普通锦囊牌牌名。你可以将一张点数不大于“绞”标记数的手牌当一张记录的本回合未以此法使用过的牌使用（无距离次数限制）。",[]],["受责","锁定技，结束阶段，你弃置一枚“绞”，然后随机获得弃牌堆一张黑色牌并失去1点体力。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董绾","t":"蜜言如鸩","k":"群","kh":3,"mh":3,"g":"女","s":[["生妒","回合开始时，你可以选择一名没有“生妒”标记的其他角色，该角色获得“生妒”标记。有“生妒”标记的角色摸牌阶段摸牌后，每有一个“生妒”你摸等量的牌，然后移去“生妒”标记。",[]],["介绫","出牌阶段每种花色限一次，你可以将两张花色不同的手牌当无距离次数限制的【杀】使用。若此【杀】：造成伤害，其失去1点体力；没造成伤害，其获得一个“生妒”标记。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董翓","t":"暗夜豺狐","k":"群","kh":4,"mh":4,"g":"女","s":[["狡黠","出牌阶段开始时，你可以令本阶段你的手牌均视为【杀】。若你以此法使用的【杀】造成了伤害，此【杀】结算后你可以视为使用原卡牌（有次数限制）。出牌阶段，你对每名角色使用第一张【杀】无距离和次数限制。",[]],["狐魅","出牌阶段每项限一次，你可以选择一项，令一名体力值不大于X的角色执行（X为你本阶段造成伤害点数）：1.摸一张牌；2.交给你一张牌；3.回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董絮","t":"琼芳坠枝","k":"群","kh":3,"mh":3,"g":"女","s":[["清冷","你成为黑色非转化牌的目标后，你可以弃置任意一名角色一张牌。若此弃牌：是装备牌，该黑色牌对你无效；不是装备牌，你可将该黑色牌视为列入下次“酖毒”可使用的牌中。",[]],["酖毒","出牌阶段结束时，你可以展示至多5张基本或普通锦囊牌，然后你的下个回合开始时视为依次使用这些牌（无距离限制）。你使用这些牌期间有角色回复体力或受到伤害后，你摸一张牌（因此摸到的牌不计本回合手牌上限）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"段煨","t":"凉国之英","k":"群","kh":4,"mh":4,"g":"男","s":[["狼灭","其他角色出牌阶段结束时，若其本阶段使用过至少两张相同类别的牌，你可以摸一张牌；其他角色的结束阶段，若其本回合造成过至少2点伤害，你可以弃置一张牌，对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"樊稠","t":"庸生变难","k":"群","kh":4,"mh":4,"g":"男","s":[["兴乱","每阶段限一次，当你于你出牌阶段使用一张仅指定一名目标角色的牌结算结束后，你可以从牌堆中获得一张点数为6的牌（若牌堆中没有点数为6的牌，改为摸6张牌）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"樊玉凤","t":"红鸾寡宿","k":"群","kh":3,"mh":3,"g":"女","s":[["把盏","转换技，出牌阶段限一次，阳：你可以交给一名其他角色至多两张手牌；阴：你可以获得一名其他角色至多两张手牌。若其中包括【酒】或♥牌，你可以令获得牌的角色回复1点体力或复原武将牌。",["转换技"]],["醮影","锁定技，其他角色获得你的手牌后，该角色本回合不能使用或打出与此牌颜色相同的牌。此回合结束阶段，若其本回合没有再使用牌，你可以令一名角色将手牌摸至五张。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"菲菲公主","t":"","k":"群","kh":4,"mh":4,"g":"女","s":[["聪慧","你使用一张牌时，若此牌花色是本回合第一次被使用，你可以摸一张牌。每个回合结束时，若本回合已有4种花色的牌被使用过，你摸两张牌。",[]],["舞棒","出牌阶段内限一次，你使用伤害牌指定目标时，可以弃置任意张花色不同的牌，然后根据你弃置的牌数依次执行以下选项： 1张：随机获得目标角色手牌中一张你没有的花色的牌； 2张：可多选一个目标； 3张：此牌伤害+1； 4张：你本回合获得的牌不计手牌上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"冯方","t":"监彻京师","k":"群","kh":3,"mh":3,"g":"男","s":[["谛听","其他角色出牌阶段开始时，若你在其攻击范围内，你可以观看其X张手牌（X为你的体力值），然后秘密选择其中一张。若如此做，本阶段：当该角色使用此牌指定你为目标后，此牌对你无效；使用此牌时没有指定你为目标，你摸两张牌；本阶段结束时此牌仍在其手牌中，你获得之。",[]],["避祸","当你受到其他角色造成的伤害后，你可以令一名角色下回合摸牌阶段摸牌数+1；当你对其他角色造成伤害后，你可以令一名角色下回合摸牌阶段摸牌数-1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"冯妤","t":"泣珠伊人","k":"群","kh":3,"mh":3,"g":"女","s":[["涕泣","其他角色的出牌阶段开始前，若其本回合额定摸牌阶段摸牌数不为2，则你摸此摸牌数与2之差的牌，然后可以令其本回合手牌上限增加或减少同样的数值。",[]],["宝梳","准备阶段，你可以选择至多X名角色（X为你的体力上限），这些角色各获得一个“梳”标记并重置武将牌，你每少选一名角色，每名目标角色便多获得一个“梳”。有“梳”标记的角色摸牌阶段多摸其“梳”数量的牌，然后移去其所有“梳”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"傅干","t":"察策明谏","k":"群","kh":3,"mh":3,"g":"男","s":[["巧谏","出牌阶段每名角色限一次，你可以选择一名其他角色，双方同时弃置任意张牌，若你弃置牌点数之和较大，你回复1点体力并选择一项令其执行：1.其下个回合首次使用【杀】与锦囊牌可各额外结算一次；2.其下个回合不可使用伤害牌。否则，你获得双方弃置牌并不计入手牌上限。",[]],["析察","你受到1点伤害后，你可以观看伤害来源手牌，并秘密选择其中两张，若其下次使用牌为此牌，令该牌无效，你获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"伏完","t":"沉毅的国丈","k":"群","kh":4,"mh":4,"g":"男","s":[["谋溃","当你使用【杀】指定目标后，你可以选择任意项：1.摸一张牌；2.弃置其中一名目标角色一张牌。若两项均选择，此【杀】被其无效或抵消后，该角色弃置你的一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"高览","t":"诽殇之柱","k":"群","kh":4,"mh":4,"g":"男","s":[["袭阵","出牌阶段开始时，你可以选择一名其他角色，视为对其使用【杀】或【决斗】，然后本阶段你的牌每次被使用或打出牌响应时，该角色回复1点体力，你摸一张牌（若其未受伤，改为两张）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"公孙度","t":"雄张海东","k":"群","kh":4,"mh":4,"g":"男","s":[["震泽","弃牌阶段开始时，你可以选择一项：1.令所有手牌数和体力值的大小关系与你不同的角色失去1点体力；2.令所有手牌数和体力值的大小关系与你相同的角色回复1点体力。",[]],["安辽","出牌阶段限X次（X为群势力角色数），你可以重铸一名角色的一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"公孙修","t":"寸莛击钟","k":"群","kh":5,"mh":5,"g":"男","s":[["干蛊","锁定技，每回合限一次，当有其他角色失去体力后，你摸三张牌，然后若你的体力值不为全场最少，失去1点体力。",["锁定技"]],["溃阵","出牌阶段限一次，你可以交给一名其他角色任意张手牌并随机获得其等量的手牌，以此法留在其手中的牌称为“溃阵”牌。其他角色每次使用“溃阵”牌时，你摸一张牌。其失去全部“溃阵”牌的回合结束时，失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"管亥","t":"掠地劫州","k":"群","kh":4,"mh":4,"g":"男","s":[["索粮","每回合限一次，你对一名其他角色造成伤害后，你可以展示该角色的至多X张牌（X为其体力上限且最多为5），获得其中的♥和♣牌。若你未获得牌，则弃置你选择的牌。",[]],["侵暴","锁定技，手牌数不小于你的其他角色不能响应你使用的【杀】或普通锦囊牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"管宁","t":"辟境归元","k":"群","kh":3,"mh":7,"g":"男","s":[["遁世","每回合限一次，你可以视为使用或打出一张【杀】【闪】【桃】【酒】。然后当前回合角色本回合下次造成伤害时，你选择两项： 1.防止此伤害，选择一个包含“仁义礼智信”的技能令其获得； 2.减1点体力上限并摸X张牌（X为你已删除的牌名数）； 3.删除你本次视为使用的牌名。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"郭汜","t":"党豺为虐","k":"群","kh":4,"mh":4,"g":"男","s":[["贪狈","出牌阶段限一次，你可以令一名其他角色选择一项：1.你随机获得其区域内的一张牌，本回合不能再对其使用牌；2.你本回合对其使用牌无距离和次数限制。",[]],["伺盗","每阶段限一次，当你于出牌阶段内对一名其他角色连续使用两张牌后，你可以将一张手牌当【顺手牵羊】对其使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"寒冰剑少女","t":"冰之剑","k":"群","kh":3,"mh":3,"g":"女","s":[["冰伶","当你使用【杀】指定目标时，你可以弃置目标角色两张牌。若这两张牌类别/花色/牌名字数/点数相同，则你获得这两张牌/回复1点体力/摸相当于其中一张牌名字数的牌/令其失去所有体力；若皆不同，则你受到1点无来源的火焰伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"韩馥","t":"度势恇然","k":"群","kh":4,"mh":4,"g":"男","s":[["节应","结束阶段，你可以选择一名其他角色，然后该角色的下回合内：其使用【杀】或普通锦囊牌无距离限制，若仅指定一个目标则可以多指定一个目标；当其造成伤害后，其不能再使用牌直到回合结束。",[]],["危迫","锁定技，当你成为其他角色使用【杀】或普通锦囊牌的目标后，你将手牌摸至体力上限。若如此做，此牌结算结束后，若你的手牌数小于体力上限，你需交给该角色一张手牌且此技能失效直到你下回合开始。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"韩嵩","t":"楚国之望","k":"群","kh":3,"mh":3,"g":"男","s":[["隐避","锁定技，你的手牌上限等于场上手牌上限最大角色的手牌上限。若没有角色手牌数与你相同，你使用牌无距离次数限制。",["锁定技"]],["率言","其他角色摸牌阶段或弃牌阶段结束时，若其手牌数与你相等，你可以摸一张牌或弃置其一张牌。你的摸牌阶段或弃牌阶段结束时，你可以摸X张牌（X为手牌数与你相等的角色数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"韩遂","t":"雄踞北疆","k":"群","kh":4,"mh":4,"g":"男","s":[["逆乱","出牌阶段，你可以将一张黑色牌当【杀】使用，若此【杀】未造成伤害，则不计入使用次数限制。",[]],["违忤","出牌阶段限一次，你可以将一张红色牌当无距离限制的【顺手牵羊】使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"郝萌","t":"悖虎之伥","k":"群","kh":7,"mh":7,"g":"男","s":[["雄莽","你可以将任意张花色不同的手牌当【杀】使用，此【杀】目标数上限等于用于转化的牌数。此【杀】结算结束后，若此【杀】：未造成伤害，你减1点体力上限；造成伤害，此阶段你使用【杀】的次数上限+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"何进","t":"色厉内荏","k":"群","kh":4,"mh":4,"g":"男","s":[["谋诛","出牌阶段限一次，你可以选择任意名与你距离为1或体力值与你相同的其他角色，依次执行：将一张手牌交给你，然后若其手牌数小于你，其视为对你使用一张【杀】或【决斗】。",[]],["延祸","当你死亡时，你可以令本局接下来所有【杀】的伤害基数值+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"侯成","t":"猢威挽骊","k":"群","kh":5,"mh":5,"g":"男","s":[["献酿","每轮每项限一次，当你的牌被其他角色弃置或受到伤害后，你可以获得一名手牌数不小于你的角色至多两张牌，并可以交给另一名其他角色至多等量张牌；因此获得或交出的基本牌只能当【酒】使用。若你本轮因此技能获得的牌超过两张，则你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"侯昭宁","t":"贤助抚外","k":"群","kh":3,"mh":3,"g":"女","s":[["望资","每轮限一次，其他角色的出牌阶段开始时，你可以弃置至多五张牌，令其从牌堆获得等量黑色牌，此阶段其使用这些牌后你与其各摸一张牌。",[]],["和戎","出牌阶段限一次，你可展示一名其他角色的一张手牌，然后你选择一张手牌与其交换，若这两张牌：1.类型相同，防止你下次受到的伤害，你与其各从牌堆获得一张装备牌；2.类型不同，你弃置其两张牌，然后你对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"黄承彦","t":"捧月共明","k":"群","kh":3,"mh":3,"g":"男","s":[["解阵","出牌阶段限一次，你可以令一名其他角色所有技能替换为〖八阵〗（锁定技、限定技、觉醒技、主公技除外）。你的回合开始时或当其【八卦阵】判定后，其失去〖八阵〗并获得原技能，然后你获得其区域里的一张牌。",[]],["择才","限定技，一轮结束时，你可以令一名其他角色获得〖集智〗直到下一轮结束，若其是本轮使用锦囊牌数唯一最多的角色，其执行一个额外的回合。",["限定技"]],["隐世","锁定技，你每回合首次受到无色牌或非游戏牌造成的伤害时，防止此伤害。当场上有角色判定【八卦阵】时，你获得其生效的判定牌。",["锁定技"]],["八阵","锁定技，若你没有装备防具，视为你装备着【八卦阵】。",["锁定技","衍生技"]],["集智","当你使用锦囊牌时，你可以摸一张牌。若此牌为基本牌且此时是你的回合内，则你可以弃置之，然后令本回合手牌上限+1。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"皇甫嵩","t":"志定雪霜","k":"群","kh":4,"mh":4,"g":"男","s":[["奋钺","出牌阶段限X次（X为与你不同阵营的存活角色数），你可以与一名角色拼点，若你赢，根据你拼点的牌的点数执行以下效果：小于等于K：视为对其使用一张雷【杀】；小于等于9：获得牌堆中的一张【杀】；小于等于5：获得其一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"黄祖","t":"引江为弣","k":"群","kh":4,"mh":4,"g":"男","s":[["精弓","你可以将装备牌当无距离限制的【杀】使用，此【杀】的伤害基数值改为X（X为你至第一名目标角色的距离且至多为5）。",[]],["骁隽","你使用牌指定其他角色为唯一目标后，你可以弃置其一半手牌（向下取整），若其中有与你使用牌花色相同的牌，你弃置一张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"胡车儿","t":"惩奸除恶","k":"群","kh":4,"mh":4,"g":"男","s":[["盗戟","当其他角色本局游戏第一次使用武器牌时，你可以选择一项：1.获得此武器牌；2.其本回合不能使用或打出【杀】。",[]],["负重","锁定技，当你于回合外得到手牌后，你获得一枚“重”标记。若你的“重”标记数： 大于等于1，摸牌阶段，你多摸一张牌； 大于等于2，你计算与其他角色的距离-2； 大于等于3，你的手牌上限+3； 大于等于4，结束阶段，你对一名其他角色造成1点伤害，然后移去4个“重”。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"胡昭","t":"阖门守静","k":"群","kh":3,"mh":3,"g":"男","s":[["弥笃","出牌阶段限一次，你可以选择一项：1.废除任意个装备栏或判定区，令一名角色摸等量的牌；2.恢复一个被废除的装备栏或判定区，你获得〖活墨〗直到你下个回合开始。",[]],["贤望","锁定技，若你有废除的装备栏，其他角色计算与你的距离+1，你计算与其他角色的距离-1；若你有至少三个废除的装备栏，以上数字改为2。",["锁定技"]],["活墨","当你需要使用基本牌时（每种牌名每回合限一次），你可以将一张黑色非基本牌置于牌堆顶，视为使用此基本牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界蔡夫人","t":"议献荆州","k":"群","kh":3,"mh":3,"g":"女","s":[["窃听","其他角色的回合结束时，若其本回合：没有造成过伤害，你可以将其装备区一张牌移至你的装备区；没有对其他角色使用过牌，你摸一张牌。",[]],["献州","限定技，出牌阶段，你可以将装备区里的所有牌交给一名其他角色，然后你回复X点体力，并对其攻击范围内至多X名角色各造成1点伤害（X为你交给其的牌数）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界陈宫","t":"刚直壮烈","k":"群","kh":3,"mh":3,"g":"男","s":[["明策","出牌阶段限一次，你可以将一张装备牌或【杀】交给一名其他角色，其选择一项：1.视为对你指定的另一名角色使用【杀】，若此【杀】造成伤害，执行选项2；2.你与其各摸一张牌。",[]],["智迟","锁定技，你的回合外，当你受到伤害后，此回合【杀】和普通锦囊牌对你无效。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界伏皇后","t":"与世不侵","k":"群","kh":3,"mh":3,"g":"女","s":[["惴恐","其他角色的准备阶段，若你已受伤，你可以与其拼点：若你赢，本回合该角色其使用牌不能指定除其以外的角色为目标；若你没赢，你获得其拼点的牌，然后其视为对你使用一张【杀】。",[]],["求援","当你成为【杀】的目标时，你可以令另一名其他角色交给你一张除【杀】以外的基本牌，否则其也成为此【杀】的目标且不能响应此【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界高顺","t":"攻无不克","k":"群","kh":4,"mh":4,"g":"男","s":[["陷阵","每回合限一次，出牌阶段，你可以与一名角色拼点：若你赢，本回合你无视该角色的防具、对其使用牌无距离和次数限制，且你本回合使用牌对其造成伤害时，此伤害+1（每回合每种牌名限一次）；若你没赢，本回合你不能使用【杀】且你的【杀】不计入手牌上限。",[]],["禁酒","锁定技，你的【酒】视为点数为K的【杀】；你的回合内，其他角色不能使用【酒】。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界公孙渊","t":"乐浪公","k":"群","kh":4,"mh":4,"g":"男","s":[["怀异","出牌阶段限一次，你可以展示所有手牌。若仅有一种颜色，你摸一张牌，然后此技能本阶段改为“出牌阶段限两次”；若有两种颜色，你弃置其中一种颜色的牌，然后获得至多X名角色各一张牌（X为弃置的手牌数），若你获得的牌大于一张，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界公孙瓒","t":"白马将军","k":"群","kh":4,"mh":4,"g":"男","s":[["趫猛","当你使用黑色牌指定目标后，你可以弃置其中一名其他角色的一张牌，若此牌为：锦囊牌，此牌不能被响应；装备牌，改为你获得之。",[]],["义从","锁定技，你计算与其他角色的距离-1；若你已损失的体力值不小于2，其他角色计算与你的距离+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界郭图逄纪","t":"急攻猛进","k":"群","kh":3,"mh":3,"g":"男","s":[["急攻","出牌阶段开始时，你可以摸至多三张牌，若如此做，你本回合的手牌上限改为你此阶段造成的伤害值；弃牌阶段结束时，若伤害值不小于因此摸的牌数，你回复1点体力。",[]],["饰非","当你需要使用或打出【闪】时，你可以令当前回合角色摸一张牌，然后若其手牌数不是全场唯一最多的，你弃置一名手牌全场最多的角色一张牌，视为你使用或打出一张【闪】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界黄月英","t":"闺中璞玉","k":"群","kh":3,"mh":3,"g":"女","s":[["机巧","出牌阶段开始时，你可以弃置任意张牌，然后你亮出牌堆顶等量的牌，你弃置的牌中每有一张装备牌，则多亮出一张牌。然后你获得其中的非装备牌。",[]],["玲珑","锁定技，若你的装备区里没有防具牌，你视为装备【八卦阵】；若你的装备区里没有坐骑牌，你的手牌上限+2；若你的装备区里没有宝物牌，你视为拥有〖奇才〗。若均满足，你使用的【杀】和普通锦囊牌不能被其他角色响应。",["锁定技"]],["奇才","你使用锦囊牌无距离限制。出牌阶段限一次，你可以选择一名其他角色，将手牌或弃牌堆中一张装备牌置入其装备区（若为斗地主模式，则改为防具牌且每种牌名限一次），然后其获得“奇”标记。有“奇”标记的角色接下来获得的三张普通锦囊牌须交给你。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界沮授","t":"徐图渐营","k":"群","kh":3,"mh":3,"g":"男","s":[["渐营","当你使用牌时，若此牌与你使用的上一张牌点数或花色相同，你可以摸一张牌。",[]],["矢北","锁定技，你每回合受到第一次伤害后，你回复1点体力；你每回合受到第二次伤害后，你失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界李儒","t":"决计策士","k":"群","kh":3,"mh":3,"g":"男","s":[["绝策","结束阶段，你可以对一名没有手牌的其他角色造成1点伤害。",[]],["灭计","出牌阶段限一次，你可以将一张武器牌或黑色锦囊牌置于牌堆顶，令一名有手牌的其他角色选择一项：弃置一张锦囊牌；或依次弃置两张非锦囊牌。",[]],["焚城","限定技，出牌阶段，你可以选择一名角色，从该角色开始，所有其他角色依次选择一项：1.弃置至少X张牌（X为上一名角色因此弃置的牌数+1）；2.你对其造成2点火焰伤害。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界刘表","t":"跨蹈汉南","k":"群","kh":3,"mh":3,"g":"男","s":[["自守","摸牌阶段，你可以多摸X张牌（X为全场势力数），然后本回合你对其他角色造成伤害时，防止此伤害。结束阶段，若你本回合没有使用牌指定其他角色为目标，你可以弃置任意张花色各不相同的手牌，摸等量的牌。",[]],["宗室","锁定技，你的手牌上限+X（X为全场势力数）。你的回合外，若你的手牌数不小于手牌上限，延时锦囊牌和无色牌对你无效。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界太史慈","t":"北海酬恩","k":"群","kh":4,"mh":4,"g":"男","s":[["击虚","出牌阶段限一次，你可以令至多你体力值数量的其他角色各猜测你的手牌中是否有【杀】。若你的手牌中：有【杀】，此阶段你使用【杀】次数上限+X且可以额外指定所有猜错的角色为目标；没有【杀】，你弃置所有猜错的角色各一张牌。然后你摸X张牌（X为猜错的角色数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"纪灵","t":"仲家的主将","k":"群","kh":4,"mh":4,"g":"男","s":[["双刃","出牌阶段开始时，你可以与一名角色拼点。若你赢，你选择与其势力相同的一至两名角色（若选择两名，其中一名须为该角色），视为对选择的角色使用一张不计入次数的【杀】；若你没赢，你本阶段不能使用【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吉邈吉穆","t":"勠力同心","k":"群","kh":4,"mh":4,"g":"男","s":[["诹议","出牌阶段限一次，你可以选择至多两项：1.摸两张牌，然后可以弃置一名其他角色一张牌；2.弃置一张牌，然后可以令一名其他角色摸两张牌。结算后，〖掩袭〗使用次数增加手牌数与你相同的角色数并回复等量体力。",[]],["掩袭","每局游戏限零次，其他角色回合结束时，你可以视为对其使用一张【杀】，此【杀】造成的伤害改为失去体力，结算后若此技能可使用次数不为0，再次发动直到无使用次数或其阵亡。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吉平","t":"白虹贯日","k":"群","kh":3,"mh":3,"g":"男","s":[["询疠","锁定技，当黑色牌因弃置进入弃牌堆后，将之置于你的武将牌上，称为“疠”（至多9张）。出牌阶段开始时，你可以用任意张黑色手牌交换等量的“疠”。",["锁定技"]],["指誓","结束阶段，你可以选择一名角色，直到你下回合开始，该角色成为【杀】的目标后或进入濒死状态时，你可以移去任意张“疠”，令其摸等量的牌。",[]],["烈医","出牌阶段限一次，你可以展示所有“疠”并选择一名其他角色，并依次对其使用所有“疠”（无距离次数限制），不可使用的置入弃牌堆。然后若该角色未因此进入濒死状态，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"轲比能","t":"瀚海鲸波","k":"群","kh":4,"mh":4,"g":"男","s":[["寇旌","出牌阶段开始时，你可以选择任意张手牌，这些牌本回合视为不计入次数的【杀】。其他角色受到以此法使用的【杀】的伤害后展示这些牌，其可用所有手牌交换这些牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孔融","t":"凛然重义","k":"群","kh":3,"mh":3,"g":"男","s":[["名士","锁定技，当你受到伤害时，若伤害来源的手牌数大于你，其需弃置一张手牌，否则此伤害-1。",["锁定技"]],["礼让","当你的牌因弃置而进入弃牌堆后，你可以将其中任意张牌交给其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"来莺儿","t":"雀台歌女","k":"群","kh":3,"mh":3,"g":"女","s":[["绡舞","出牌阶段限一次，你可以从你的上家或下家起选择任意名座位连续的其他角色，每名角色依次选择一项：1.令你摸一张牌；2.自己摸一张牌。若令你摸牌的选择人数较多，你获得一个“沙”标记；若自己摸牌的选择人数较多，你对这些角色各造成1点伤害。",[]],["化萍","限定技，一名其他角色死亡时，你可以获得其所有技能，然后你失去〖绡舞〗和所有“沙”标记并摸等量的牌。当你死亡时，你可以令一名其他角色获得技能〖沙舞〗和所有“沙”标记。",["限定技"]],["沙舞","当你使用【杀】指定目标后，你可以弃置两张手牌或1枚“沙”标记对目标角色造成1点伤害。若你弃置的是“沙”标记，你摸两张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐蔡文姬","t":"胡笳十八拍","k":"群","kh":3,"mh":3,"g":"女","s":[["霜笳","锁定技，游戏开始时，你的初始手牌增加“胡笳”标记且不计入手牌上限。你每拥有一张“胡笳”，其他角色计算与你距离+1（最多+5）。",["锁定技"]],["悲愤","锁定技，当你失去“胡笳”后，你获得与手中“胡笳”花色均不同的牌各一张。你手中“胡笳”少于其他牌时，你使用牌无距离和次数限制。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐蔡邕","t":"焦尾识音","k":"群","kh":3,"mh":3,"g":"男","s":[["焦尾","锁定技，游戏开始时，你的初始手牌增加“弦”标记且不计入手牌上限。当你失去“弦”后，防止你本回合下一次受到的伤害。",["锁定技"]],["飞白","当你使用牌后，你可以从牌堆或弃牌堆随机两张字数为X的牌中选择一张获得（X为此牌与你本回合使用的上一张牌牌名字数之和，若没有上一张牌则上一张字数视为0）。若没有字数为X的牌，你摸两张牌并标记为“弦”，此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐貂蝉","t":"檀声向晚","k":"群","kh":3,"mh":3,"g":"女","s":[["檀板","游戏开始时，你的初始手牌增加“檀板”标记且不计入手牌上限。摸牌阶段结束时，你可以交换手牌区里的“檀板”牌和非“檀板”牌的标记。",[]],["低讴","当你使用“檀板”牌结算结束后，你可以展示一张不为“檀板”牌的手牌，若展示了基本牌或普通锦囊牌，你视为使用展示牌。若为你本回合第一次展示此牌或与使用的“檀板”牌牌名相同，你摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"雷薄","t":"背仲豺寇","k":"群","kh":4,"mh":4,"g":"男","s":[["私掠","游戏开始时，你选择一名其他角色为“私掠”角色。 “私掠”角色造成伤害后，你可以获得受伤角色一张牌（每回合每名角色限一次）。 “私掠”角色受到伤害后，你需对伤害来源使用一张【杀】（无距离限制），否则你弃置一张手牌。",[]],["衰劫","限定技，出牌阶段，若你体力值与装备区里的牌均大于“私掠”角色或“私掠”角色已死亡，你可以减1点体力上限，然后选择一项： 1.获得“私掠”角色至多3张牌；2.从牌堆获得三张类型不同的牌。然后“私掠”角色改为你。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐就","t":"仲家军督","k":"群","kh":4,"mh":4,"g":"男","s":[["催进","当你或攻击范围内的角色使用【杀】或【决斗】时，你可以弃置一张牌，令此【杀】或【决斗】的伤害值基数+1。每当若此牌未对目标造成伤害，你摸两张牌，对使用者造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐祢衡","t":"鹗立鸷群","k":"群","kh":3,"mh":3,"g":"男","s":[["激鼓","锁定技，游戏开始时，你的初始手牌增加“激鼓”标记且不计入手牌上限。当你造成或受到伤害后，若你手牌中的“激鼓”数等于装备区牌数，你摸X张牌（X为你空置的装备栏数）；本轮内发动次数达到本局游戏已进入过回合的角色数后本轮失效。",["锁定技"]],["思锐","出牌阶段限一次，你可以将一张牌当牌名字数相等的基本牌或普通锦囊牌使用（无距离和次数限制）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐邹氏","t":"淯水吟","k":"群","kh":3,"mh":3,"g":"女","s":[["韵筝","锁定技，游戏开始时，你的初始手牌增加“筝”标记且不计入手牌上限。手牌有“筝”的其他角色非锁定技失效。",["锁定技"]],["惑心","当你使用非装备牌时，你可以展示一名其他角色的一张手牌并标记为“筝”，若此牌与你使用的牌花色相同或已被标记，你可以获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"梁兴","t":"凶豺掠豹","k":"群","kh":4,"mh":4,"g":"男","s":[["掳掠","出牌阶段开始时，你可以令一名有手牌且手牌数小于你的其他角色选择：1.将所有手牌交给你，你翻面；2.翻面，视为对你使用【杀】。",[]],["追袭","锁定技，当你对其他角色造成伤害时，或当你受到其他角色造成的伤害时，若你与其翻面状态不同，此伤害+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李采薇","t":"啼雨孤鸯","k":"群","kh":3,"mh":3,"g":"女","s":[["异教","出牌阶段限一次，你可以选择一名其他角色并选择一个1~4的数字，该角色获得十倍的“异”标记；有“异”标记的角色结束阶段，若其本回合使用牌的点数之和： 1.小于“异”标记数，其随机弃置一至三张手牌； 2.等于“异”标记数，你摸两张牌且其于本回合结束后进行一个额外的回合； 3.大于“异”标记数，你摸三张牌。",[]],["泣别","一名角色死亡后，你可以弃置所有手牌，然后回复1点体力值并摸X+2张牌（X为你以此法弃置牌数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"烈袁绍袁术","t":"四世三公","k":"群","kh":4,"mh":4,"g":"男","s":[["烈悌","锁定技，分发起始手牌时，你额外获得一组初始手牌并增加武将名称标记（第一组标记为“袁术”，第二组标记为“袁绍”）；当你获得手牌时，根据当前武将为手牌增加武将标记。你只能使用或打出当前武将标记的手牌。非当前武将标记的手牌不计手牌上限。",["锁定技"]],["世公","锁定技，你的武将标记初始为“袁绍”。你每回合使用的第一张手牌不受〖烈悌〗限制，然后你切换标记为对应武将。若因此切换为袁绍，你视为使用一张【万箭齐发】；若因此切换为袁术，你摸两张牌。",["锁定技"]],["乱魁","你每回合第二次造成伤害后，可以弃置一张“袁绍”牌令你本回合下次造成的伤害翻倍；你每回合第二次获得牌后，可以弃置一张“袁术”牌令你本回合下次摸牌翻倍。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李傕","t":"奸谋恶勇","k":"群","kh":4,"mh":6,"g":"男","s":[["狼袭","准备阶段，你可以对一名体力值不大于你的其他角色随机造成0~2点伤害。",[]],["亦算","每阶段限一次，当你于出牌阶段内使用普通锦囊牌结算后，你可以减1点体力上限，从弃牌堆获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李傕郭汜","t":"犯祚倾祸","k":"群","kh":4,"mh":4,"g":"男","s":[["凶算","出牌阶段限一次，你可以弃置一张手牌并对一名角色造成1点伤害，然后摸三张牌。若该角色不为你，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"灵雎","t":"情随梦逝","k":"群","kh":3,"mh":3,"g":"女","s":[["竭缘","当你对其他角色造成伤害时，若其体力值不小于你，你可以弃置一张黑色手牌令此伤害+1；当你受到其他角色造成的伤害时，若其体力值不小于你，你可以弃置一张红色手牌令此伤害-1。",[]],["焚心","锁定技，当一名角色首次受到伤害后，你选择一项修改〖竭缘〗：减少伤害无体力值限制；增加伤害无体力值限制；弃置牌时无颜色限制且可以弃置装备牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李肃","t":"魔使","k":"群","kh":2,"mh":2,"g":"男","s":[["利熏","锁定技，当你受到伤害时，防止此伤害，改为获得等同于伤害值的“珠”标记。出牌阶段开始时，你进行一次判定，若结果点数小于“珠”数，你弃置等同于“珠”数的手牌，若弃牌数不足，则失去不足数量的体力值。",["锁定技"]],["馈珠","出牌阶段结束时，你可以选择体力值全场最大的一名其他角色，将手牌摸至与该角色相同（最多摸至五张），然后该角色观看你的手牌，弃置任意张手牌并从观看的牌中获得等量的牌，若其获得的牌数大于1，则你选择一项：1.移去一个“珠”；2.令其对其攻击范围内的一名角色造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘辩","t":"弘农怀王","k":"群","kh":3,"mh":3,"g":"男","s":[["诗怨","每回合每项限一次，当你成为其他角色使用牌的目标后：1.若其体力值比你多，你摸三张牌；2.若其体力值与你相同，你摸两张牌；3.若其体力值比你少，你摸一张牌。",[]],["毒逝","锁定技，你处于濒死状态时，其他角色不能对你使用【桃】。你死亡时，你选择一名其他角色获得〖毒逝〗。",["锁定技"]],["余威","主公技，锁定技，其他群雄角色的回合内，〖诗怨〗改为“每回合每项限两次”。",["主公技","锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘宠骆俊","t":"定境安民","k":"群","kh":3,"mh":3,"g":"男","s":[["悯泽","出牌阶段每名角色限一次，你可以将至多两张牌名不同的牌交给一名手牌数小于你的角色。结束阶段，你将手牌补至X张（X为本回合你因此技能失去牌的牌名数，至多为5）。",[]],["击逆","当你受到伤害后，你可以重铸任意张手牌（每回合以此法重铸的牌数不能超过你的体力上限），若你以此法获得了【杀】，你可以对伤害来源使用一张无距离限制且不可响应的【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘宏","t":"汉灵帝","k":"群","kh":4,"mh":4,"g":"男","s":[["鬻爵","出牌阶段限一次，你可以废除一个装备栏并选择一名有手牌的其他角色，令其交给你一张手牌，其获得技能〖执笏〗直到你下个回合开始。",[]],["图兴","锁定技，当你废除一个装备栏时，你加1点体力上限并回复1点体力。当你首次废除所有装备栏后，你减4点体力上限，你本局游戏造成的伤害+1。",["锁定技"]],["执笏","锁定技，每回合限两次，当你对其他角色造成伤害后，你摸两张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"刘徽","t":"周天古率","k":"群","kh":4,"mh":4,"g":"男","s":[["割圆","锁定技，游戏开始时，将A~K的所有点数随机排列成一个圆环。有牌进入弃牌堆时，将满足圆环进度的点数记录在圆环内。当圆环完成后，你获得牌堆和场上所有完成此圆环最初和最后点数的牌，然后从圆环中移除这两个点数（不会被移除到三个以下），重新开始圆环。",["锁定技"]],["解术","锁定技，非圆环内点数的牌不计入你的手牌上限。你使用或打出牌时，若满足圆环进度点数，你摸一张牌。",["锁定技"]],["股算","觉醒技，每个回合结束时，若圆环剩余点数为3个，你减1点体力上限，并修改〖割圆〗。",["觉醒技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘辟","t":"慕义渠帅","k":"群","kh":4,"mh":4,"g":"男","s":[["踞营","出牌阶段结束时，若你本阶段使用【杀】或【酒】的次数小于次数上限，你可以选择任意项：1.下个回合出牌阶段使用【杀】次数上限+1；2.本回合手牌上限+2；3.摸三张牌。若你选择的选项数大于你的体力值，你弃置一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘琦","t":"居外而安","k":"群","kh":3,"mh":3,"g":"男","s":[["问计","出牌阶段开始时，你可以令一名其他角色交给你一张牌，你于本回合内使用与该牌同类别的牌不能被其他角色响应。",[]],["屯江","结束阶段，若你本回合出牌阶段内未使用牌指定过其他角色为目标，你可以摸X张牌（X为全场势力数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"刘协曹节","t":"双宿双飞","k":"群","kh":2,"mh":2,"g":"男","s":[["眷侣","当你使用牌指定异性角色为目标后，你可以令其选择弃置一张手牌或令你摸一张牌。",[]],["齐心","转换技，出牌阶段，你可以：阳，将性别变为女性，然后将体力值调整为“齐心”记录的数值并记录调整前的体力；阴，将性别变为男性，然后将体力调整为“齐心”记录的数值并记录调整前的体力。 隐藏效果：当你获得此技能时，记录你的体力上限并将你的性别改为男性；当濒死求桃结束后，若你仍处于濒死状态且“齐心”记录的数值大于0，则你将体力调整至记录的数值且清除此记录，将你的性别改为异性，“齐心”失效。",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"刘焉","t":"裂土之宗","k":"群","kh":3,"mh":3,"g":"男","s":[["图射","当你使用非装备牌指定目标后，若你没有基本牌，则你可以摸X张牌（X为此牌指定的目标数）。",[]],["立牧","出牌阶段，你可以将一张♦牌当【乐不思蜀】对自己使用，然后回复1点体力；你的判定区有牌时，你对攻击范围内的其他角色使用牌无距离次数限制。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"刘繇","t":"宗英外镇","k":"群","kh":4,"mh":4,"g":"男","s":[["戡难","出牌阶段限X次（X为你的体力值），你可以与一名你于此阶段内未以此法选择过的角色拼点。若你赢，你使用的下一张【杀】伤害值基数+1且你于此阶段内不能发动此技能；其赢，其使用的下一张【杀】的伤害值基数+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘懿君","t":"恶嫉蔑死","k":"群","kh":3,"mh":3,"g":"女","s":[["妒戮","出牌阶段限一次，你可以对任意名对你使用过牌的其他角色各造成1点伤害并随机弃置其一张手牌，然后直到你的下个回合结束，其进入濒死状态时，你获得其所有黑色牌。",[]],["缚己","每轮限一次，其他角色出牌阶段开始时，你可以令其观看你的手牌。若如此做，本回合结束时，你回复1点体力并摸三张牌；本轮当其他角色使用牌指定你为目标后，你可以将所有手牌交给一名其他角色并令此牌无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘虞","t":"维城燕北","k":"群","kh":3,"mh":3,"g":"男","s":[["绥抚","其他角色的结束阶段，若本回合你和一号位共计至少受到2点伤害，你可将当前回合角色的所有手牌置于牌堆顶，视为使用一张【五谷丰登】。",[]],["辟境","结束阶段，你可以选择包含你的任意名角色，这些角色获得〖自牧〗直到下次发动〖辟境〗。",[]],["自牧","锁定技，当你受到伤害后，有〖自牧〗的角色各摸一张牌，然后你失去〖自牧〗。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"卢弈","t":"落子惊鸿","k":"群","kh":3,"mh":3,"g":"女","s":[["复学","准备阶段，你可以从弃牌堆中获得至多X张不因使用而进入弃牌堆的牌。结束阶段，若你手中没有以此法获得的牌，你摸X张牌。（X为你的体力值）",[]],["邀弈","锁定技，游戏开始时，所有没有转换技的角色获得〖手谈〗；你发动〖手谈〗无需弃置牌且无次数限制。所有角色使用牌只能指定自己及与自己转换技状态不同的角色为目标。",["锁定技"]],["手谈","转换技，出牌阶段限一次，你可以弃置一张：阳：非黑色手牌；阴：黑色手牌。",["转换技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"吕伯奢","t":"恩罹横灾","k":"群","kh":8,"mh":8,"g":"男","s":[["豕宴","出牌阶段限一次，你可以摸体力上限张牌（至多摸五张），然后交给等量名其他角色各一张手牌。这些角色同时猜测你的手牌中非伤害牌与伤害牌哪个数量更多，每有一名猜对的角色便防止你本阶段受到的一次伤害，然后猜错的角色依次视为对你使用【杀】，你受到此【杀】造成的伤害后减少1点体力上限并摸一张牌。",[]],["愧绝","锁定技，若你的体力上限：大于等于4，你的回合内获得过牌的其他角色无法响应你使用的第一张牌；大于等于3，你的回合内你使用的第二张牌若对本回合获得过牌的其他角色使用则不限次数；大于等于2，你的攻击范围+3。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吕玲绮","t":"无双虓姬","k":"群","kh":4,"mh":4,"g":"女","s":[["帼武","出牌阶段开始时，你可以展示所有手牌，若包含的类别数：不小于1，你从弃牌堆中获得一张【杀】；不小于2，你本阶段使用牌无距离限制；不小于3，你本阶段使用【杀】或普通锦囊牌可以多指定两个目标。",[]],["妆戎","觉醒技，一名角色的回合结束时，若你的手牌数或体力值为1，你减1点体力上限并将体力值回复至体力上限，然后将手牌摸至体力上限，获得技能〖神威〗和〖无双〗。",["觉醒技"]],["神威","锁定技，摸牌阶段，你额外摸两张牌；你的手牌上限+2。",["锁定技","衍生技"]],["无双","锁定技，当你使用【杀】指定目标后，其使用【闪】抵消此【杀】的方式改为需连续使用两张【闪】；当你使用【决斗】指定目标后，或当你成为【决斗】的目标后，你令其打出【杀】响应此【决斗】的方式改为需连续打出两张【杀】。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马超","t":"威震西凉","k":"群","kh":4,"mh":4,"g":"男","s":[["追击","锁定技，你对其他角色使用牌结算后，本回合你计算与其距离视为1。",["锁定技"]],["誓仇","出牌阶段，你可以将一张牌当不计次数的【杀】使用：若为红色，目标需弃置一张装备牌；若为黑色，目标需弃置一张黑色手牌。否则此【杀】不能被其响应。每种颜色每回合各限一次，且必须指定同一个目标。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"忙牙长","t":"截头蛮锋","k":"群","kh":4,"mh":4,"g":"男","s":[["截刀","当你每回合第一次造成伤害时，你可以令此伤害至多+X（X为你损失的体力值）。然后若受到此伤害的角色没有死亡，你弃置等同于此伤害加值的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马日磾","t":"南冠楚囚","k":"群","kh":4,"mh":6,"g":"男","s":[["秉节","出牌阶段开始时，你可以减1点体力上限，然后当你本回合使用【杀】或普通锦囊牌指定目标后，除你以外的目标角色各弃置一张牌，若弃置的牌与你使用的牌颜色相同，其无法响应此牌。",[]],["正订","锁定技，你的回合外，当你使用或打出牌响应其他角色使用的牌时，若你使用或打出的牌与其使用的牌颜色相同，你加1点体力上限，回复1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马腾","t":"驰骋西陲","k":"群","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["雄异","限定技，出牌阶段，你可以选择一名其他角色，你与其各摸三张牌，然后若你体力值全场唯一最少，你回复1点体力。当你进入濒死状态被救回后，若你发动过此技能，此技能视为未发动过并移除回复体力的效果。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马铁","t":"紫骊奔北","k":"群","kh":4,"mh":4,"g":"男","s":[["追击","锁定技，你对其他角色使用牌结算后，本回合你计算与其距离视为1。",["锁定技"]],["驱险","回合开始时和结束时，你可以从牌堆中获得一张【杀】并选择一名其他角色，攻击范围内含有有其的其他角色依次可以对其使用一张【杀】，每有一名角色使用【杀】你摸一张牌。若其未以此法受到过伤害，未使用【杀】的角色各失去X点体力（X为以此法使用【杀】的角色数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孟获","t":"勒格诗惹","k":"群","kh":4,"mh":4,"g":"男","s":[["蛮王","出牌阶段，你可以弃置任意张牌依次执行前等量项：1.获得〖叛侵〗；2.摸一张牌；3.回复1点体力；4.摸两张牌并失去〖叛侵〗。",[]],["叛侵","出牌阶段结束时，或弃牌阶段结束时，你可以将本阶段你因弃置进入弃牌堆且仍在弃牌堆的牌当【南蛮入侵】使用，然后若此牌目标数不小于这些牌的数量，你执行并移除〖蛮王〗的最后一项，然后加1点体力上限并回复1点体力。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孟节","t":"万安隐者","k":"群","kh":3,"mh":3,"g":"男","s":[["引路","游戏开始时，你令三名角色依次获得以下一个标记：“乐泉”、“藿溪”、“瘴气”，然后你获得一个“芸香”。 准备阶段，你可以移动一个标记；有标记的角色死亡时，你可以移动其标记。拥有标记的角色获得对应的效果： 乐泉：结束阶段，你可以弃置一张♦牌，然后回复1点体力； 藿溪：结束阶段，你可以弃置一张♥牌，然后摸两张牌； 瘴气：结束阶段，你需要弃置一张♠牌，否则失去1点体力； 芸香：结束阶段，你可以弃置一张♣牌，获得一个“芸香”；当你受到伤害时，你可以移去所有“芸香”并防止等量的伤害。",[]],["幽栖","锁定技，其他角色因〖引路〗弃置牌时，你有概率获得此牌，该角色距离你越近，概率越高。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孟优","t":"蛮杰陷谋","k":"群","kh":5,"mh":5,"g":"男","s":[["蛮裔","锁定技，【南蛮入侵】对你无效。",["锁定技"]],["蛮智","准备阶段，你可以选择一名其他角色，然后选择一项： 1.令其交给你两张牌，然后其视为使用一张无距离限制的【杀】； 2.获得其区域内的至多两张牌，然后交给其等量牌并摸一张牌。 结束阶段，若你的体力值与此回合准备阶段开始时相等，你可以执行此回合未选择过的一项。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"祢衡","t":"狂傲奇人","k":"群","kh":3,"mh":3,"g":"男","s":[["狂才","锁定技，你的回合内，你使用牌无距离和次数限制。 弃牌阶段开始时，若你本回合：没有使用过牌，你的手牌上限+1；使用过牌且没有造成伤害，你手牌上限-1。 结束阶段，若你本回合造成过伤害，你摸等于伤害值数量的牌（最多摸五张）。",["锁定技"]],["舌剑","每回合限两次，当你成为其他角色使用牌的唯一目标后，你可以弃置至少两张手牌，然后弃置其等量的牌或对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋陈琳","t":"文翻云海","k":"群","kh":3,"mh":3,"g":"男","s":[["邀作","出牌阶段限一次，你可以令所有其他角色选择是否交给你一张牌，你以此法获得的牌不计入手牌上限。然后交给你牌最快者选择另一名其他角色，你对其所选角色发动〖撰文〗；未交给你牌的角色，本回合你下次对其造成的伤害+1。",[]],["撰文","结束阶段，你可以展示牌堆顶X张牌并选择一项对一名角色执行：1.对其依次使用其中的伤害牌；2.令其获得其中的非伤害牌。然后将剩余牌置于牌堆顶（X为你的手牌数，至多为5）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋淳于琼","t":"殊死难当","k":"群","kh":5,"mh":5,"g":"男","s":[["领戍","若你当前回合未造成或受到过伤害，你可以将一张非基本牌当任意基本牌使用或打出。你每回合首次造成或受到伤害后，可以随机获得一张本回合进入弃牌堆的牌。",[]],["顽抗","当你处于濒死状态时，你可以回复1点体力，获得一枚“抗”并摸两张牌。若如此做，当前回合结束时，你对本回合对你造成过伤害的角色使用至多“抗”数量张【杀】，每使用一张便移去一枚“抗”，若以此法击杀一名对你造成过伤害的角色，移去所有“抗”；然后若仍有“抗”，你阵亡。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋董承","t":"汉室孤忠","k":"群","kh":4,"mh":4,"g":"男","s":[["保驾","游戏开始时，你选择一名其他角色，你或其每回合首次受到牌造成的伤害时，你可以废除一个装备栏防止此伤害，此牌结算结束后你获得之。",[]],["斗围","出牌阶段，你可以弃置一张伤害牌，视为对任意名攻击范围内包含你的其他角色使用之，若其因此进入濒死状态，你回复1点体力并恢复一个装备栏，此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋胡车儿","t":"有力逮戟","k":"群","kh":4,"mh":4,"g":"男","s":[["孔武","出牌阶段限一次，你可以选择一名其他角色并展示其一张手牌，令其弃置手牌中所有与此牌花色相同的牌，然后你视为对其使用X张【杀】（X为该角色手牌和装备区里与此牌类别相同的牌数）。若其没有因此受到伤害，你将手牌摸至体力上限。此阶段结束时，若其手牌数和体力值均不大于你，其下回合装备区内的牌失效且摸牌阶段摸牌数-1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋贾诩","t":"晦谋独善","k":"群","kh":3,"mh":3,"g":"男","s":[["肃身","限定技，出牌阶段，你可以记录你的体力值、手牌数和〖覆谋〗的阴阳状态，然后获得〖入世〗。",["限定技"]],["覆谋","转换技，游戏开始时可自选阴阳状态。出牌阶段限一次，你可以观看一名其他角色的所有手牌，展示其中至多一半的牌（向上取整），阳：令另一名其他角色获得这些牌，你与失去牌的角色各摸等量张牌。阴：令其按你选择的顺序依次使用这些牌（无距离限制且不能被响应）。",["转换技"]],["入世","限定技，出牌阶段，你可以将体力值、手牌数和〖覆谋〗的阴阳状态依次调整为〖肃身〗记录值且视为于此阶段内未发动过〖覆谋〗。",["限定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋沮授","t":"忠不逢时","k":"群","kh":3,"mh":3,"g":"男","s":[["佐军","出牌阶段限一次，你可以选择一名角色，其摸三张牌并选择：1.直到其下个回合结束，其不能使用这些牌且不计入其手牌上限；2.失去1点体力再摸一张牌，然后使用其中任意张牌，弃置剩余的牌。",[]],["暮往","锁定技，当你每回合第一次失去的一张基本牌或普通锦囊牌进入弃牌堆后，你将之收回手牌。你本回合再次失去此牌后弃置一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋孔融","t":"溢才命世","k":"群","kh":4,"mh":4,"g":"男","s":[["卓荦","你的回合外，当有未造成伤害的伤害牌进入弃牌堆时，你可以获得之，若你本回合因此获得的牌数超过你的体力值，你弃置一张非伤害牌。",[]],["举政","出牌阶段限两次，你可以选择一名其他角色，与其比较手牌中伤害牌的数量：若你较多，你观看其手牌并选择弃置其中一张伤害牌，视为对其使用；若其较多，其随机弃置两张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋刘协","t":"玉辂东归","k":"群","kh":3,"mh":3,"g":"男","s":[["斩绊","出牌阶段限一次，你可以摸或弃至多三张牌，令所有其他角色将手牌数调整至与你相同，因此弃牌的角色摸三张牌；因此摸牌的角色弃置三张牌；若未摸牌或弃牌，你对其造成1点伤害。",[]],["沉声","其他角色回合结束时，若你与其均不为手牌数唯一最多的角色，你摸一张牌。",[]],["天承","主公技，当你发动〖斩绊〗时，你可以选择任意名群势力角色不成为此次〖斩绊〗的目标。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋刘璋","t":"半圭黯暗","k":"群","kh":3,"mh":3,"g":"男","s":[["据土","若你手牌数大于体力值，当你受到伤害时，你可以弃置一张红色牌防止该伤害。每回合结束时，若你本回合未受到过伤害且手牌数小于等于体力值，你可以摸两张牌。",[]],["仁善","每回合限X次，你不以此法获得牌后，你可以摸一张牌并交给一名手牌数不大于你的其他角色一张牌（X为你的体力值）。",[]],["益治","主公技，出牌阶段限一次，你可以视为对群势力角色使用一张【五谷丰登】。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋兀突骨","t":"","k":"群","kh":12,"mh":12,"g":"男","s":[["恶援","每名角色出牌阶段限一次，其可以交给你任意张牌并展示之，然后你选择等量的其他角色，若其中：伤害牌/非伤害牌较多，你视为对这些角色使用一张【杀】/【南蛮入侵】。若你没有因此造成伤害，你受到1点火焰伤害并减1点体力上限。",[]],["岌危","限定技，出牌阶段，你可以摸体力上限一半的牌（向下取整）。若如此做，本轮结束时，若你本轮造成伤害值小于以此法摸牌数，你失去X点体力（X为摸牌数减伤害值）。",["限定技"]],["焚乱","锁定技，你无法响应火焰伤害的牌；每当你受到火焰伤害后，你下次发动〖恶援〗时，改为选择所有其他角色。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋许攸","t":"智士濡足","k":"群","kh":3,"mh":3,"g":"男","s":[["谟猷","你每使用两张手牌结算后，可以摸三张牌令本回合使用牌无距离限制，并选择一种花色弃置手牌中所有此花色的牌，若你的手牌未含有所有类型，则你下次使用基本牌无次数限制，下次使用锦囊牌不可响应。",[]],["恃傲","锁定技，当你的非装备牌进入弃牌堆后，若此牌造成过伤害，本回合你摸牌时摸牌数+1；若此牌因弃置进入弃牌堆，本回合你摸牌时摸牌数-1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋杨奉","t":"猰貐","k":"群","kh":3,"mh":3,"g":"男","s":[["逐波","每回合限一次，一名角色于其出牌阶段外造成伤害时，你可以失去1点体力并选择一项：1.你与其各摸两张牌；2.此伤害+1。",[]],["挟势","其他角色的结束阶段，若你手牌数与本回合开始不同，你可以视为使用一张本回合进入弃牌堆的基本牌或普通锦囊牌。",[]],["歧抉","限定技，一名角色进入濒死状态时，你可以令其回复2点体力并摸两张牌，然后将〖逐波〗中的“造成”改为“受到”；若该角色是你，将〖逐波〗的时机修改为“你于回合外造成或受到伤害时”，并且不再需要失去体力。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋张任","t":"尖峰致溃","k":"群","kh":5,"mh":5,"g":"男","s":[["慑道","其他角色的牌于你的回合内移至弃牌堆后，你可以选择一项：1.获得其中至少一张红色牌并弃置一张黑色牌，然后本回合这些牌不计入手牌上限；2.获得其中的【杀】并永久视为雷【杀】。",[]],["迅矢","锁定技，你使用雷【杀】无距离和次数限制；当你使用雷【杀】对一名角色造成伤害后，其随机弃置一张牌，你摸两张牌。",["锁定技"]],["震弓","限定技，出牌阶段，你可以弃置任意张同名牌，然后对任意名其他角色造成共计与弃牌数等量的伤害，因此受到伤害的角色本回合非锁定技失效。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋张绣","t":"凌枪破宛","k":"群","kh":4,"mh":4,"g":"男","s":[["附袭","其他角色的出牌阶段开始时，若其为手牌数最多的角色，你可以选择：1.将一张牌交给其，你摸两张牌；2.弃置其一张牌，视为对其使用【杀】。",[]],["豪义","结束阶段，你可以获得弃牌堆中所有本回合进入且未造成过伤害的伤害类牌，然后可以任意分配给其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"木鹿大王","t":"八纳洞主","k":"群","kh":5,"mh":5,"g":"男","s":[["咒法","出牌阶段限一次，你可以将一张非基本牌当伤害牌使用，此牌造成的伤害改为雷电伤害。",[]],["兽群","摸牌阶段，你可以改为展示牌堆顶你的体力上限张牌，并选择一项：1.获得其中的坐骑牌、锦囊牌、【杀】和【酒】，然后你的体力上限+1（不能超过初始上限）；2.获得展示亮出牌，然后直到你的下回合开始，你获得〖驭象〗且每次受到火焰伤害后，体力上限-1。",[]],["驭象","锁定技，你计算与其他角色的距离-2；你对距离2以内的角色使用【杀】不可被响应。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"穆顺","t":"疾风劲草","k":"群","kh":4,"mh":4,"g":"男","s":[["劲坚","当你造成或受到伤害后，你获得一个“劲”标记，然后你可以与伤害来源拼点：若你赢，你回复1点体力。每有一个“劲”你的攻击范围+1。",[]],["失诏","锁定技，你的回合外，当你每回合首次失去最后一张手牌时：若你有“劲”，你移去一个“劲”并摸两张牌；没有“劲”，你本回合下一次受到的伤害+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"南华老仙","t":"仙人指路","k":"群","kh":4,"mh":4,"g":"男","s":[["共修","结束阶段，若你本回合发动过〖经合〗，你可以选择一项：1.令所有本回合因〖经合〗获得过技能的角色摸一张牌；2.令所有本回合未因〖经合〗获得过技能的其他角色弃置一张手牌。",[]],["经合","出牌阶段限一次，你可以展示至多四张牌名各不同的手牌，选择等量的角色，从“写满技能的天书”随机展示四个技能，这些角色依次选择并获得其中一个，直到你下回合开始或你死亡。",[]],["雷击","当你使用或打出【闪】后，你可以令一名其他角色进行一次判定，若结果为：♠，你对其造成2点雷电伤害；♣，你回复1点体力，对其造成1点雷电伤害。",["衍生技"]],["阴兵","锁定技，你使用【杀】即将造成的伤害视为失去体力。当其他角色失去体力后，你摸一张牌。",["锁定技","衍生技"]],["活气","出牌阶段限一次，你可以弃置一张牌，然后令一名体力最少的角色回复1点体力并摸一张牌。",["衍生技"]],["鬼助","每回合限一次，当一名角色进入濒死状态时，你可以摸两张牌。",["衍生技"]],["仙授","出牌阶段限一次，你可以令一名角色摸一张牌。若其未受伤，则多摸一张牌。",["衍生技"]],["论道","当你受到伤害后，若伤害来源的手牌多于你，你可以弃置其一张牌；若伤害来源的手牌数少于你，你摸一张牌。",["衍生技"]],["观月","结束阶段，你可以观看牌堆顶的两张牌，然后获得其中一张，将另一张置于牌堆顶。",["衍生技"]],["言政","准备阶段，若你的手牌数大于1，你可以选择一张手牌并弃置其余的牌，然后对至多等于弃置牌数的角色各造成1点伤害。",["衍生技"]],["闭月","结束阶段，你可以摸一张牌，若你没有手牌则改为两张。",["衍生技"]],["突袭","摸牌阶段，你可以少摸任意张牌并获得等量其他角色各一张手牌。",["衍生技"]],["明策","出牌阶段限一次，你可以将一张装备牌或【杀】交给一名其他角色，其选择一项：1.视为对你指定的另一名角色使用【杀】，若此【杀】造成伤害，执行选项2；2.你与其各摸一张牌。",["衍生技"]],["直言","结束阶段，你可以令一名角色摸一张牌并展示之，若此牌为：基本牌，你摸一张牌；装备牌，其使用此牌并回复1点体力。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"牛辅","t":"魔郎","k":"群","kh":4,"mh":7,"g":"男","s":[["宵袭","锁定技，出牌阶段开始时，你需减少1或2点体力上限，然后选择一项：1.获得你攻击范围内一名其他角色等量的牌；2.视为对你攻击范围内的一名其他角色使用等量张【杀】。",["锁定技"]],["熊扰","限定技，准备阶段，你可以令所有其他角色本回合除锁定技、限定技、觉醒技以外的技能全部失效，然后你将体力上限增加至7并摸等同于增加体力上限张数的牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"潘凤","t":"联军上将","k":"群","kh":4,"mh":4,"g":"男","s":[["狂斧","出牌阶段限一次，你可以弃置场上的一张装备牌，视为使用一张【杀】（无距离次数限制）。若弃置的不是你的牌且此【杀】未造成伤害，你弃置两张手牌；若弃置的是你的牌且此【杀】造成伤害，你摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"庞德公","t":"友睦风疏","k":"群","kh":3,"mh":3,"g":"男","s":[["和洽","出牌阶段开始时，你可以选择一项：1.你交给一名其他角色至少一张牌；2.令一名有手牌的其他角色交给你至少一张牌。然后获得牌的角色可以将一张手牌当任意基本牌使用（无距离限制），且此牌目标上限改为X（X为其本次获得的牌数）。",[]],["隐逸","锁定技，每回合限一次，当你受到非属性伤害时，若伤害来源的手牌数与体力值均与你不同，防止此伤害。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"裴秀","t":"玄静守真","k":"群","kh":3,"mh":3,"g":"男","s":[["制图","你使用基本牌和单目标普通锦囊牌可以指定任意名你与其距离相等的角色为目标。",[]],["复爵","出牌阶段限一次，你可以将你的手牌调整至五张，然后移动场上一张牌。若此过程中你获得且失去过牌，本回合你计算与其他角色的距离-1且你下次使用的牌无法被响应。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"裴元绍","t":"买椟还珠","k":"群","kh":4,"mh":4,"g":"男","s":[["没欲","出牌阶段，你可以获得一名此阶段内未选择过的一名其他角色区域里的一张牌，然后该角色可以对你使用一张【杀】（无距离限制），若此【杀】：未对你造成过伤害，你于此阶段内下次发动此技能改为获得两张牌；对你造成过伤害，此技能于此回合内无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"桥蕤","t":"跛夫猎虎","k":"群","kh":4,"mh":4,"g":"男","s":[["隘守","结束阶段，你可以摸X张牌（X为你的体力上限），这些牌标记为“隘”。当你于回合外失去最后一张“隘”后，你减1点体力上限。准备阶段，弃置你手牌中的所有“隘”，若弃置的“隘”数大于你的体力值，你加1点体力上限。",[]],["扫围","当其他角色使用【杀】结算后，若目标角色在你的攻击范围内，你可以将一张“隘”当【杀】对该目标角色使用。若此【杀】造成伤害，你获得之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"秦宜禄","t":"尘垢粃糠","k":"群","kh":3,"mh":3,"g":"男","s":[["漂萍","锁定技，转换技，当你使用一张牌时，阳：你摸X张牌；阴：你弃置X张牌（X为本回合〖漂萍〗发动次数且至多为你当前体力值）。",["锁定技","转换技"]],["托献","每局游戏限一次，当你因〖漂萍〗弃置的牌进入弃牌堆后，你可以将这些牌交给一名其他角色，然后其选择一项：1.弃置其区域内等量的牌；2.令〖漂萍〗本回合失效。",[]],["惴栗","锁定技，当你成为其他角色使用黑色牌的目标后，若此时〖漂萍〗状态为：阳，令〖托献〗可使用次数+1，然后若〖托献〗可使用次数超过3，此技能本回合失效；阴，令〖漂萍〗状态转换为阳。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"丘力居","t":"乌丸王","k":"群","kh":4,"mh":6,"g":"男","s":[["寇略","当你于出牌阶段内对其他角色造成伤害后，你可以展示其X张手牌（X为其已损失体力值），你获得其中的【杀】和伤害锦囊牌。若展示牌中有红色牌：若你已受伤则减1点体力上限，未受伤则失去1点体力；然后你摸两张牌。",[]],["随认","你死亡时，可以将手牌中所有【杀】和伤害锦囊牌交给一名其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"麴义","t":"名门的骁将","k":"群","kh":4,"mh":4,"g":"男","s":[["伏骑","锁定技，你距离其为1的其他角色不能响应你使用的【杀】或普通锦囊牌。",["锁定技"]],["骄恣","锁定技，当你造成或受到伤害时，若你的手牌为全场唯一最多，则此伤害+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"屈原","t":"楚辞之祖","k":"群","kh":3,"mh":3,"g":"男","s":[["求索","当你造成或受到伤害后，你可以从牌堆或弃牌堆中随机获得一张【铁索连环】。",[]],["离骚","出牌阶段限一次，你可以令至多两名角色同时回答《离骚》选择题（有角色答对则立即停止作答，答错则剩余角色可继续作答），答对的角色展示所有手牌，答错或未作答的角色本回合不能响应你使用的牌且受到的伤害翻倍。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"史阿","t":"传锋承刃","k":"群","kh":5,"mh":5,"g":"男","s":[["砺刃","锁定技，你的攻击范围始终为2。有【杀】造成伤害后，你获得此【杀】；有【杀】被抵消后，你摸一张牌。每回合至多以此法获得三张牌。",["锁定技"]],["剑出","觉醒技，你在摸牌阶段外累计获得五张牌时，你回复1点体力并获得〖击格〗，本局游戏你所有的【闪】视为【杀】，且你阵亡时可以令一名其他角色获得〖砺刃〗。",["觉醒技"]],["击格","你成为【杀】的目标时，可以打出一张点数比其大的【杀】抵消之；你对其他角色使用【杀】造成伤害时，可以弃置你与其手牌中所有的【杀】，此牌伤害增加你比其多弃置的牌数。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"士燮","t":"雄长百越","k":"群","kh":3,"mh":3,"g":"男","s":[["避乱","结束阶段，若有其他角色计算与你的距离为1，你可以弃置一张牌，令其他角色计算与你的距离+X（X为全场角色数且至多为4）。",[]],["礼下","锁定技，其他角色的结束阶段，若你不在其攻击范围内，你选择一项：1.摸一张牌；2.令其摸两张牌。然后其他角色计算与你的距离-1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"舒邵","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["竞殉","每回合限一次，当有角色受到致命伤害时，你可以防止此伤害并与一名其他角色拼点，赢的角色受到等量的伤害。若没有角色因此进入濒死状态，你与拼点角色各摸X张牌（X为你的体力值）。",[]],["赈民","你每回合首次获得牌时，你可以将等量张牌交给一名其他角色，若其手牌数/体力值不为全场最多，则其摸两张牌/回复1点体力；若均为最多，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"司马徽","t":"水镜先生","k":"群","kh":3,"mh":3,"g":"男","s":[["荐杰","你的第一个回合开始时，你令一名其他角色获得“龙印”，然后令另一名其他角色获得“凤印”； 出牌阶段限一次（你的第一个回合除外），或当拥有“龙印”/“凤印”的角色死亡时，你可以转移“龙印”/“凤印”。 •拥有 “龙印”/“凤印” 的角色视为拥有技能〖火计〗/〖连环〗（均一回合限三次）； •同时拥有“龙印”和“凤印”的角色视为拥有技能〖业炎〗，且发动〖业炎〗时移去“龙印”和“凤印”。 •你失去〖荐杰〗或死亡时移除“龙印”/“凤印”。",[]],["称好","当一名角色受到属性伤害后，若其受到此伤害前处于“连环状态”且是此伤害传导的起点，你可以观看牌堆顶的X张牌并将这些牌分配给任意角色（X为横置角色数+1）。",[]],["隐士","锁定技，当你受到属性伤害或锦囊牌造成的伤害时，若你没有“龙印”、“凤印”且装备区内没有防具牌，防止此伤害。",["锁定技"]],["火计","你可以将一张红色手牌当【火攻】使用（每回合限三次）。",["衍生技"]],["连环","你可以将一张♣手牌当【铁索连环】使用或重铸（每回合限三次）。",["衍生技"]],["业炎","限定技，出牌阶段，你可以移去“龙印”和“凤印”并指定一至三名角色，你分别对这些角色造成至多共计3点火焰伤害；若你对一名角色分配2点或更多的火焰伤害，你须先弃置四张不同花色的手牌并失去3点体力。",["限定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"太史慈","t":"北海酬恩","k":"群","kh":4,"mh":4,"g":"男","s":[["击虚","出牌阶段限一次，你可以令任意名体力值相同的其他角色同时猜测你的手牌中是否有【杀】。若有角色猜错，且你：有【杀】，你于本回合使用【杀】额外指定所有猜错的角色为目标；没有【杀】，你弃置所有猜错的角色各一张牌。然后你摸等同于猜错的角色数的牌。若没有角色猜错，则你结束此阶段。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"唐姬","t":"弘农王妃","k":"群","kh":3,"mh":3,"g":"女","s":[["抗歌","你的第一个回合开始时，你选择一名其他角色： 1.当该角色于其回合外获得手牌后，你摸等量的牌（每回合最多摸三张）； 2.每轮限一次，当该角色进入濒死状态时，你可以令其将体力回复至1点； 3.当该角色死亡时，你弃置所有牌并失去1点体力。",[]],["节烈","当你受到除你或〖抗歌〗角色以外的角色造成的伤害时，你可以防止此伤害并选择一种花色，失去X点体力，令〖抗歌〗角色从弃牌堆中随机获得X张此花色的牌（X为伤害值）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陶谦","t":"膺秉温仁","k":"群","kh":3,"mh":3,"g":"男","s":[["招祸","锁定技，当其他角色进入濒死状态时，若你的体力上限大于1，你将体力上限减至1点，然后你摸等同于体力上限减少数张牌。",["锁定技"]],["义襄","锁定技，其他角色的出牌阶段内，其使用的第一张牌对你造成的伤害-1；其使用的第二张牌若为黑色，则对你无效。",["锁定技"]],["揖让","出牌阶段开始时，你可以将所有非基本牌（至少一张）交给一名其他角色。若其体力上限大于你，你将体力上限增加至与该角色相同，然后你回复X点体力（X为你以此法交给其的牌数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"藤甲男孩","t":"火之盾","k":"群","kh":1,"mh":4,"g":"男","s":[["藤固","锁定技，游戏开始时，你废除防具栏；你视为装备着【藤甲】；当你不因受到火焰伤害而进入濒死状态时，若你的体力上限大于1，则你减1点体力上限并回复体力至上限。",["锁定技"]],["钝勇","当你对其他角色造成伤害时，若你的体力上限不为全场唯一最低，你受到等量伤害；当一名角色进入濒死状态时，你摸其体力上限数量的牌，令你本回合使用牌无距离和次数限制。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"田畴","t":"善刀而藏","k":"群","kh":4,"mh":4,"g":"男","s":[["善刀","出牌阶段限一次，你可以将任意名角色的区域内各一张牌置于牌堆顶，视为对这些角色使用一张【五谷丰登】，然后视为对除这些角色外的其他角色使用一张【万箭齐发】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"田丰","t":"河北瑰杰","k":"群","kh":3,"mh":3,"g":"男","s":[["死谏","当你失去最后的手牌后，你可以弃置一名其他角色的一张牌。",[]],["随势","锁定技，当其他角色进入濒死状态时，若伤害来源与你势力相同，你摸一张牌；当其他角色死亡时，若其与你势力相同，你弃置至少一张手牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"田忌","t":"高瞻远瞩","k":"群","kh":3,"mh":3,"g":"男","s":[["围计","当你使用牌指定后，你可以选择1~3中一个数字，令其中一名其他目标角色秘密猜测你选择的数字。若其猜错，你摸所选数字张牌。",[]],["赛马","当你使用坐骑牌后，你可以与一名其他角色进行连续三次拼点。若你赢的次数不小于2，对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"童渊","t":"蓬莱枪神散人","k":"群","kh":4,"mh":4,"g":"男","s":[["朝凤","每阶段限一次，当你于出牌阶段使用牌造成伤害时，你可以弃置一张手牌，然后摸一张牌。若弃置的牌与造成伤害的牌：颜色相同，则多摸一张牌；类型相同，则此伤害+1。",[]],["传术","限定技，准备阶段若你已受伤，或当你死亡时，你可令一名其他角色获得〖朝凤〗，然后你获得〖龙胆〗〖从谏〗〖穿云〗。",["限定技"]],["龙胆","你可以将一张【杀】当【闪】使用或打出，或将一张【闪】当普通【杀】使用或打出。",["衍生技"]],["从谏","当你成为锦囊牌的目标后，若此牌的目标数大于1，则你可以交给其中一名其他目标角色一张牌，然后摸一张牌，若你给出的是装备牌，改为摸两张牌。",["衍生技"]],["穿云","当你使用【杀】指定目标后，你可以令该角色随机弃置一张装备区里的牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"王粲","t":"七子之冠冕","k":"群","kh":3,"mh":3,"g":"男","s":[["散文","每回合限一次，当你获得牌时，若你手中有与这些牌牌名相同的牌，你可以展示之并弃置获得的同名牌，然后摸弃牌数两倍数量的牌。",[]],["七哀","限定技，当你进入濒死状态时，你可以令所有其他角色同时交给你一张牌。",["限定技"]],["登楼","限定技，结束阶段，若你没有手牌，你可以亮出牌堆顶四张牌，然后获得其中的非基本牌，并使用其中的基本牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王濬","t":"遏浪飞艨","k":"群","kh":4,"mh":4,"g":"男","s":[["统业","锁定技，游戏开始时，或当其他角色死亡后，你根据场上势力数（对于其他角色仅计入魏蜀吴群）获得对应效果： 不大于4，手牌上限+3； 不大于3，你的攻击范围+3； 不大于2，出牌阶段使用【杀】次数上限+3； 为1，你回复3点体力。 每满足超过一项，你摸牌阶段摸牌数+1。",["锁定技"]],["长驱","出牌阶段限一次，你可以开一艘战舰，从你的上家或下家开始选择任意名座次连续的其他角色，第一个目标角色获得战舰标记。获得战舰标记的角色选择一项：1.交给你X张手牌，然后将战舰标记移动至下一个目标；2.下次受到的属性伤害+X，然后横置武将牌（X为本次选择1的次数，至少为1）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王烈","t":"通识达道","k":"群","kh":3,"mh":3,"g":"男","s":[["崇望","其他角色使用一张基本牌或普通锦囊牌时，若你为上一张牌的使用者，你可以令其获得其使用的牌或令该牌无效。",[]],["化归","出牌阶段开始时，你可以秘密选择至多X名其他角色（X为最大阵营存活人数），这些角色同时选择：1.交给你一张牌；2.展示一张牌。若均选择展示牌，你获得这些牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王荣","t":"灵怀皇后","k":"群","kh":3,"mh":3,"g":"女","s":[["敏思","出牌阶段限一次，你可以弃置任意张点数之和为13的牌，并摸两倍的牌。本回合以此法获得的牌中，黑色牌无距离限制，红色牌不计入手牌上限。",[]],["吉境","当你受到伤害后，你可以判定，然后你可以弃置任意张点数之和等于判定结果的牌，若如此做，你回复1点体力。",[]],["追德","当你死亡时，你可以令一名其他角色摸四张不同牌名的基本牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王威","t":"苍心辟道","k":"群","kh":4,"mh":4,"g":"男","s":[["锐战","其他角色准备阶段，若其手牌数不小于体力值，你可以与其拼点：若你赢或者拼点牌中有【杀】，你视为对其使用一张【杀】；若两项均满足且此【杀】造成伤害，你获得其一张牌。",[]],["示烈","出牌阶段限一次，你可以选择一项：1.回复1点体力，然后将两张牌置为“示烈”牌（不足则全放，总数不能大于游戏人数）；2.失去1点体力，然后获得两张“示烈”牌。 你死亡时，你可以将“示烈”牌交给除伤害来源外的一名其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王越","t":"锐通玄极","k":"群","kh":4,"mh":4,"g":"男","s":[["试锋","每回合每项限一次，1.其他角色对你使用伤害牌结算后，你可以视为对其使用一张【决斗】；2.其他角色使用【决斗】指定目标后，若目标不为你，你可以获得此牌并将目标更为你。",[]],["剑道","锁定技，你的伤害锦囊牌视为【决斗】，你使用【决斗】或成为伤害牌目标结算后你摸一张伤害牌（不计次数）。当你造成【决斗】伤害后，你下次使用【杀】指定目标，其需弃置一张基本牌，否则此【杀】不可响应。你每造成两次伤害，本局游戏你的【杀】伤害+1，并可以选择手牌中一张非伤害替换为伤害牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王允","t":"忠魂不泯","k":"群","kh":4,"mh":4,"g":"男","s":[["连计","出牌阶段限一次，你可以弃置一张手牌并选择一名其他角色，令其使用牌堆中的一张武器牌。然后该角色选择一项：1.对除你以外的一名角色使用一张【杀】，并将武器牌交给其中一名目标角色；2.视为你对其使用一张【杀】，并将武器牌交给你。",[]],["谋逞","觉醒技，准备阶段，若你发动〖连计〗的两个选项都被选择过，则你失去〖连计〗，获得〖矜功〗。",["觉醒技"]],["矜功","出牌阶段限一次，你可以将一张装备牌或【杀】当一张锦囊牌使用（从两种随机普通锦囊牌和【美人计】、【笑里藏刀】随机一种中三选一）。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"万年公主","t":"还汉明珠","k":"群","kh":3,"mh":3,"g":"女","s":[["枕戈","准备阶段，你可以令一名角色的攻击范围+1（加值至多为5），然后若其他角色都在其的攻击范围内，你可以令其视为对另一名你选择的角色使用一张【杀】。",[]],["兴汉","锁定技，当〖枕戈〗选择过的角色使用【杀】造成伤害后，若此【杀】是本回合的第一张【杀】，你摸一张牌。若你的手牌数不是全场唯一最多，则改为摸X张牌（X为该角色的攻击范围且最多为5）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威董卓","t":"魔震西凉","k":"群","kh":6,"mh":6,"g":"男","s":[["犷勇","锁定技，当你使用牌指定自己为目标后，你摸一张牌并加1点体力上限（至多加到8）；当你使用牌指定其他角色为目标后，获得其中一名目标角色一张牌，然后若你已受伤，你减1点体力上限。",["锁定技"]],["据陲","连招技（装备牌+锦囊牌），你可以选择其中一名目标角色，若其体力上限：不大于你，你令其失去或回复1点体力；大于你，你选择一种牌的类别，获得牌堆中一张此类别的牌且其本回合不能使用此类别的牌。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威公孙瓒","t":"武勇戾猛","k":"群","kh":4,"mh":4,"g":"男","s":[["举袭","出牌阶段限一次，若你手牌中无可使用的伤害牌，你可视为使用一张本回合未以此法使用过的伤害牌，若本阶段此牌名进入弃牌堆，此技能视为未发动。",[]],["追讨","连招
