<!doctype html>
<html lang="zh-CN">
<head><meta property="og:title" content="武将技能查询"><meta property="og:image" content="https://lf3-static.bytednsdoc.com/obj/eden-cn/ylcylz_fsph_ryhs/ljhwZthlaukjlkulzlp/feisuda/avatar/7.svg"><link rel="icon" href="https://lf3-static.bytednsdoc.com/obj/eden-cn/ylcylz_fsph_ryhs/ljhwZthlaukjlkulzlp/feisuda/avatar/7.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武将技能查询</title>
<style>
:root{
  --paper:#f7f4ee; --ink:#1e1c19; --muted:#6d675e; --line:#ded7cb;
  --card:#fffdf8; --accent:#b0392f; --accent-soft:#f5e6e3;
  --wei:#3f5f9e; --shu:#ad3b38; --wu:#2f7551; --qun:#8a7434;
  --god:#a67c22; --jin:#60458a; --qin:#3f6b78; --evil:#6b3f5f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
header{
  position:sticky; top:0; z-index:20;
  background:rgba(247,244,238,.94); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 20px 10px;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.5px}
.brand h1 span{color:var(--accent)}
.brand p{margin:0; font-size:12px; color:var(--muted)}
.searchbar{display:flex; gap:8px; margin-top:9px}
#q{
  flex:1; min-width:0; height:42px; padding:0 13px; font-size:15px; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:9px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
#q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  padding:0 13px; height:36px; font-size:13px; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:9px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:5px; transition:.15s;
}
.btn:hover{border-color:#c9c0b0; background:#fbf9f4}
.btn:active{transform:translateY(1px)}
#clear{height:42px}
.tabs{display:flex; gap:8px; align-items:center; padding:10px 20px 0; flex-wrap:wrap}
.tab{
  height:36px; padding:0 15px; font-size:14px; border:1px solid var(--line); background:#fff;
  border-radius:9px; cursor:pointer; color:var(--muted);
  display:inline-flex; align-items:center; gap:6px; transition:.15s;
}
.tab:hover{border-color:#c9c0b0}
.tab.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:600}
.tab b{font-variant-numeric:tabular-nums; font-weight:600}
.tools{margin-left:auto; display:flex; gap:8px}
.filters{padding:8px 20px 2px}
.fbar{display:none}
.fbody{padding-top:4px}
.fright{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.frst{
  border:1px solid var(--line); background:#fff; color:var(--muted); font-size:11.5px;
  padding:3px 9px; border-radius:999px; cursor:pointer;
}
.frow{display:flex; gap:10px; align-items:flex-start; margin-bottom:6px}
.frow>label{
  flex:0 0 64px; font-size:12px; color:var(--muted); padding-top:6px; letter-spacing:.4px;
  white-space:nowrap;
}
.chips{display:flex; flex-wrap:wrap; gap:6px; min-width:0}
.chip{
  height:27px; padding:0 10px; font-size:12.5px; border:1px solid var(--line); background:#fff;
  border-radius:999px; cursor:pointer; color:#544f46; white-space:nowrap;
  display:inline-flex; gap:5px; align-items:center; transition:.13s;
}
.chip .n{font-size:11px; color:#a79d8c; font-variant-numeric:tabular-nums}
.chip:hover{border-color:#c9c0b0; background:#fbf9f4}
/* 虚拟分类（界限突破 / 各服谋将）：虚线边框，轻微区分 */
.khint{display:inline-block; margin-top:3px; line-height:1.95; letter-spacing:.6px; font-size:12.5px; color:#4c463c}
.chip.virt{border-style:dashed; border-color:#cbb79a; background:#fbf7f0}
.chip.virt .n{color:#a5734a}
.chip.virt.on{border-style:dashed; border-color:#b5462f; background:#f7ece4}
.chip.virt.on .n{color:#8f3320}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
.chip.on .n{color:#b97068}
.vg{
  font-size:10.5px; color:#8a7434; border:1px solid #ded0a8; background:#fbf5e3;
  padding:0 5px; border-radius:3px; margin-left:6px;
}
main{padding:12px 20px 44px; max-width:980px; margin:0 auto}
.meta-line{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
  font-size:12.5px; color:var(--muted); margin:4px 0 12px; gap:4px 12px;
}
.meta-line b{color:var(--ink); font-size:13px; font-variant-numeric:tabular-nums}
.card{
  position:relative; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--line); border-radius:10px;
  padding:11px 15px 7px; margin-bottom:9px; transition:box-shadow .15s;
}
.card:hover{box-shadow:0 2px 10px rgba(90,74,52,.08)}
.st-魏{border-left-color:var(--wei)} .st-蜀{border-left-color:var(--shu)} .st-吴{border-left-color:var(--wu)}
.st-群{border-left-color:var(--qun)} .st-神{border-left-color:var(--god)} .st-晋{border-left-color:var(--jin)}
.st-秦{border-left-color:var(--qin)} .st-魔{border-left-color:var(--evil)} .st-其他{border-left-color:#7a7368}
.card-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.kd{
  font-size:12px; font-weight:700; color:#fff; padding:1px 7px; border-radius:4px; letter-spacing:1px;
}
.kd-魏{background:var(--wei)} .kd-蜀{background:var(--shu)} .kd-吴{background:var(--wu)}
.kd-群{background:var(--qun)} .kd-神{background:var(--god)} .kd-晋{background:var(--jin)}
.kd-秦{background:var(--qin)} .kd-魔{background:var(--evil)} .kd-其他{background:#7a7368}
.card-head h3{margin:0; font-size:17px; font-weight:700; letter-spacing:.3px}
.card-head .title{font-size:12.5px; color:var(--muted); font-style:italic}
.card-head .tagline{margin-left:0; font-size:11.5px; color:#a79d8c; white-space:nowrap}
.card-head .pk{margin-left:auto; font-size:11px; color:#8a6a45; letter-spacing:.2px; white-space:nowrap}
.card-head .hpb{display:inline-flex; align-items:center; height:23px; padding:0 9px; box-sizing:border-box;
    font-size:12px; line-height:23px; color:#7b6752; background:#f5efe6; border:1px solid #e6dac8; border-radius:999px; white-space:nowrap}
.card-head .hpb svg{width:11px; height:12px; flex:none; margin-right:4px; display:block}
.card-head .hpb b{font-weight:700; color:#a5382a}
.card-head .hpb .sep{width:1px; height:11px; background:#e0d2bd; margin:0 8px}
.card-head .hpb i{font-style:normal; font-weight:700; color:#8a6a45}
.ttl{font-size:12.5px; color:var(--muted); font-style:italic; margin:-1px 0 9px}
.skills{margin:7px 0 0; padding:0; list-style:none; border-top:1px dashed var(--line)}
.skills li{padding:6px 0 5px; border-bottom:1px dashed #ece6da}
.skills li:last-child{border-bottom:0; padding-bottom:2px}
.skname{font-weight:700; font-size:15px; margin-right:6px}
.stag{
  font-size:11px; color:var(--accent); border:1px solid #e8c9c4; background:#fdf1ee;
  padding:0 5px; border-radius:3px; margin-right:4px; white-space:nowrap; vertical-align:1px;
}
.sdesc{margin:3px 0 0; font-size:13.5px; color:#494339}
.clamp .sdesc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row{
  position:relative; background:var(--card); border:1px solid var(--line);
  border-left:3px solid var(--line); border-radius:9px; padding:9px 13px; margin-bottom:7px;
  transition:box-shadow .15s;
}
.row:hover{box-shadow:0 2px 8px rgba(90,74,52,.07)}
.row-top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:13.5px}
.row-top .kd{font-size:11px; padding:0 5px}
.row-top .who{font-weight:600}
.row-top .pkg{color:#a79d8c; font-size:11.5px; margin-left:auto}
.row-desc{margin:4px 0 0; font-size:13px; color:#494339}
#more-wrap{text-align:center; padding:2px 20px 44px}
#more{display:none; margin:0 auto; height:40px; padding:0 26px}
#empty{display:none; text-align:center; color:var(--muted); padding:44px 20px; font-size:14px}
footer{
  border-top:1px solid var(--line); padding:16px 20px 30px; max-width:980px; margin:0 auto;
  font-size:11.5px; color:#a79d8c; line-height:1.9;
}
mark{background:#ffe9a8; color:inherit; padding:0 1px; border-radius:2px}
@media (max-width:760px){
  header{padding:10px 14px 9px}
  .brand h1{font-size:18px}
  .brand p{font-size:11.5px}
  .tabs{padding:8px 14px 0; gap:6px}
  .tab{height:34px; padding:0 12px; font-size:13px}
  .tools{margin-left:0; width:100%}
  .tools .btn{flex:1; height:38px}
  .filters{padding:6px 14px 2px}
  .fbar{
    display:flex; align-items:center; gap:8px; justify-content:space-between;
    padding:8px 2px; font-size:12.5px; color:var(--muted); cursor:pointer;
    border-bottom:1px solid transparent;
  }
  .fbar.on{border-bottom-color:var(--line)}
  #fsum{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ftg{flex:0 0 auto; color:var(--accent); font-weight:600}
  .filters.collapsed .fbody{display:none}
  .frow{flex-direction:column; gap:4px; margin-bottom:10px}
  .frow>label{flex:none; padding-top:0; font-size:11.5px; letter-spacing:.6px}
  .chip{height:29px; font-size:12.5px}
  main{padding:10px 14px 30px}
  .card{padding:11px 12px 8px; border-left-width:3px}
  .card-head h3{font-size:16.5px}
  .card-head .tagline{display:none}
  .card-head .pk{font-size:10.5px}
  .skname{font-size:14.5px}
  .sdesc{font-size:13.5px}
  .row{padding:8px 11px}
  .searchbar #clear{display:none}
  footer{padding:14px 14px 26px}
}
.star{color:#c08a2a; margin-right:4px; font-weight:400; font-size:13px}
.skills li.dv{padding-left:2px}
.skills li.dv .skname{color:#4c463c}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>武将技能查询</h1>
    <p id="stat"></p>
  </div>
  <div class="searchbar">
    <input id="q" placeholder="搜索武将 / 称号 / 技能名 / 技能描述，多个关键词用空格分隔" autocomplete="off" spellcheck="false">
    <button class="btn" id="clear">清空</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab on" data-view="general">武将 <b id="cnt-g">0</b></button>
  <button class="tab" data-view="skill"><span id="lbl-s">技能</span> <b id="cnt-s">0</b></button>
  <div class="tools">
    <button class="btn" id="export">导出 CSV</button>
    <button class="btn" id="word">导出 Word</button>
  </div>
</nav>

<section class="filters" id="filters"><div class="fbar" id="fbar"><span id="fsum">全部条目</span><span class="fright"><button class="frst" id="freset">重置</button><span class="ftg" id="ftg">筛选 ▾</span></span></div><div class="fbody">
  <div class="frow"><label>扩展包</label><div class="chips" id="f-pkg"></div></div>
  <div class="frow"><label>势力</label><div class="chips" id="f-kd"></div></div>
  <div class="frow"><label>体力</label><div class="chips" id="f-hp"></div></div><div class="frow"><label>已损失</label><div class="chips" id="f-ls"></div></div><div class="frow"><label>护甲</label><div class="chips" id="f-ar"></div></div><div class="frow"><label>技能标签</label><div class="chips" id="f-tag"></div></div>
</div></section>

<main>
  <div class="meta-line"><span id="hint"></span><span id="count"></span></div>
  <div id="list"></div>
  <div id="empty">没有匹配的条目，试试放宽筛选条件。</div>
</main>
<div id="more-wrap"><button class="btn" id="more">加载更多</button></div>

<footer>
  数据来源：新月杀。可根据筛选条件导出对应内容的文件<br>
  搜索时用“。”分隔可并搜索，如“仁德。奸雄。制衡”可同时搜索出仁德、奸雄、制衡<br>
  搜索时用空格分隔可交搜索，如“仁德 激将”可以搜出标刘备<br>
  搜索特定武将的技能板可以搜到他们的技能板，如魔曹操技能板，可与其他关键词用“。”并列并按前后顺序展示，现在已添加：魔曹操、魔吕布、曹操袁绍<br>
  搜索时用“（）”可限定次级扩展包，如“（山河煮酒）刘备”；括号内可只写片段，如“山”“煮酒”，也可与技能板搭配，如“（十周年）魔曹操技能板”
</footer>

]},{"p":"小程序","sp":"小程序专属","n":"嵇康","t":"广陵绝响","k":"魏","kh":3,"mh":3,"g":"男","s":[["激慨","锁定技，你的回合外，其他角色不能响应你使用的牌；你的回合内，你不能响应其他角色使用的牌。",["锁定技"]],["清狂","出牌阶段，你可以弃置一张牌（每阶段每种颜色限一次），然后摸两张牌。结束阶段，你弃置本回合以此法摸到的牌。",[]],["音忆","当你失去牌后，你获得一枚“音”标记（至多五枚）。一名角色的结束阶段，你可以移去三枚“音”标记并选择一项：1.弃置一张牌，视为对其使用一张【杀】；2.摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极司马懿","t":"狼顾之鬼","k":"魏","kh":3,"mh":3,"g":"男","s":[["隐忍","回合开始时，你可跳过出牌阶段和弃牌阶段，然后获得以下技能中你没有的第一个技能：〖奸雄〗、〖行殇〗、〖明鉴〗。",[]],["夺权","结束阶段，你可观看一名其他角色的手牌，秘密选择一种类型，当其使用下一张牌时，若此牌的类型与你选择的类型相同，则你取消之，然后当此牌结算完毕后，你可使用此牌对应的一张实体牌。",[]],["奸雄","当你受到伤害后，你可以获得对你造成伤害的牌并摸一张牌。",["衍生技"]],["行殇","当其他角色死亡时，你可以获得其所有牌。",["衍生技"]],["明鉴","出牌阶段限一次，你可以将所有手牌交给一名其他角色，然后该角色下回合的手牌上限+1，且出牌阶段内可以多使用一张【杀】。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极王异","t":"决意的巾帼","k":"魏","kh":4,"mh":4,"g":"女","s":[["佐卿","出牌阶段每名角色限一次，你可以失去1点体力或弃置装备区内所有装备牌（至少一张），令一名角色从牌堆中获得一张【杀】并选择其接下来：1.使用；2.打出前X张【杀】时摸两张牌（X为你已损失体力值且至少为1）。",[]],["谏仇","每轮限两次，一名角色受到【杀】或【决斗】造成的伤害后，你可以令其于此牌结算结束后，视为对伤害来源使用一张【决斗】。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极辛宪英","t":"名门智女","k":"魏","kh":3,"mh":3,"g":"女","s":[["言正","摸牌阶段，你可以改为与一名其他角色各摸三张牌。若如此做，直到你的下回合开始，你或其下次造成伤害后，你弃置伤害来源区域内的一张牌。",[]],["高节","出牌阶段开始时，你可以重铸你的区域内点数最大和最小的各一张牌。若如此做，你可以令一名角色摸两张牌或回复1点体力，然后本回合你不能对体力值小于你的角色使用此点数区间内的牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极许褚","t":"虎痴","k":"魏","kh":4,"mh":4,"g":"男","s":[["虎侯","与你进行【决斗】的角色不能打出【杀】；你可将一张装备牌当【杀】使用或打出，且以此法使用的【杀】对目标角色造成伤害时，若伤害来源为你，则此伤害+1；当【决斗】造成伤害时，若你为伤害来源，则此伤害+X（X为你发动本技能打出【杀】响应过此【决斗】的次数）",[]],["武卫","结束阶段，你可以选择一名角色，直到你的下回合开始，当其不因本技能成为伤害牌的目标后，若其体力值不大于你，你令此牌对其无效，然后此牌结算结束后，使用者视为对你使用一张【决斗】。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极荀攸","t":"曹魏的谋主","k":"魏","kh":3,"mh":3,"g":"男","s":[["帷谟","游戏开始时，你摸游戏人数（至多为三）张牌，然后将等量张牌置于你的武将牌上，称为“帷谟”牌。当“帷谟”牌或你的手牌数变化后，若两者数量相同：1.你摸一张牌（每回合至多摸两张，每轮至多摸四张）；2.若此时为你的回合内，你可获得一张“帷谟”牌。",[]],["览策","出牌阶段限一次，你可以将至多两张牌置为“帷谟”牌，然后你可以视为使用一张普通锦囊牌（目标数不能大于放置牌的目标数之和）。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极荀彧","t":"王佐之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["王佐","每回合限一次，你可跳过摸牌阶段、出牌阶段或弃牌阶段，然后令一名其他角色执行一个对应的额外阶段。",[]],["举贤","你的回合内，当其他角色的牌因使用、打出或弃置而进入弃牌堆后，你获得之（每回合至多三张）。",[]],["先识","每轮限一次，其他角色的摸牌阶段开始时，你可观看牌堆顶的三张牌并用任意张手牌交换其中等量张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极张春华","t":"冷血皇后","k":"魏","kh":3,"mh":3,"g":"女","s":[["绝决","锁定技，一名角色回合结束时，若你本回合失去过所有手牌，你令一名角色失去1点体力。",["锁定技"]],["情逝","每回合限两次，你对其他角色使用牌时，或其他角色对你使用牌时，若目标数为1，你可以弃置你与其各X张牌（不足则全弃），然后若此牌造成伤害，你摸X张牌（X为你已损失体力值且至少为1）。",[]],["清绝","限定技，当你进入濒死状态时，你可以回复体力至1点并跳过下个摸牌阶段。",["限定技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极甄姬","t":"薄幸的美人","k":"魏","kh":3,"mh":3,"g":"女","s":[["神赋","①当一名角色受到1点伤害后，你获得1枚“洛神”标记，上限为6。②结束阶段，你弃所有“洛神”标记，亮出牌堆顶等量张牌，然后选择一项：1.可以依次使用其中的黑色牌；2.获得其中的红色牌。",[]],["思怨","当你受到伤害后，你可以选择一名其他角色，令伤害来源视为对其造成过1点伤害，然后你与其各摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"蒯良蒯越","t":"雍论臼谋","k":"魏","kh":3,"mh":3,"g":"男","s":[["荐降","当你成为其他角色使用牌的目标后，你可以令手牌数最少的一名角色摸一张牌。",[]],["审时","出牌阶段限一次，你可以交给手牌数最多的其他角色一张牌，并对其造成1点伤害，若其死亡，你可以令一名角色将手牌摸至四张。 当有手牌的其他角色对你造成伤害后，你可以观看其手牌，并交给其一张牌；当前回合结束阶段，若此牌仍在其手牌或装备区，你将手牌摸至四张。",[]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"李典","t":"深明大义","k":"魏","kh":3,"mh":3,"g":"男","s":[["恂恂","摸牌阶段开始时，你可以观看牌堆顶的四张牌，将其中两张牌以任意顺序置于牌堆顶，其余以任意顺序置于牌堆底。结束阶段，你获得牌堆底的两张牌。",[]],["忘隙","当你对其他角色造成1点伤害后，或当你受到其他角色造成的1点伤害后，你可以与其各摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"李通","t":"万亿吾独往","k":"魏","kh":4,"mh":4,"g":"男","s":[["推锋","当你受到伤害后，你可以将造成伤害的其中一张牌置于武将牌上，称为“锋”。准备阶段，你获得所有“锋”并摸等量的牌，本回合你可以多使用X张【杀】（X为你此次获得的“锋”数）。",[]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"刘伶","t":"避世沈醉","k":"魏","kh":3,"mh":3,"g":"男","s":[["酒颂","你可以将一张锦囊牌当【酒】使用。当一名角色使用【酒】时，你获得一个“醉”标记（“醉”至多3枚）。",[]],["酕醄","当其他角色使用基本牌或普通锦囊牌指定唯一目标时，若没有处于濒死状态的角色，你可以移去1枚“醉”标记，令此牌改为随机指定一个合法目标（无距离限制）。若此法未成功改变牌的目标，则你从牌堆中随机获得一张锦囊牌（每回合限一张）。。",[]],["避仕","锁定技，你不能成为伤害类锦囊牌的目标。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"谋郭嘉","t":"奉己佐君","k":"魏","kh":3,"mh":3,"g":"男","s":[["天妒","转换技，出牌阶段开始时，阳：你可以弃置两张牌，然后视为使用一张普通锦囊牌；阴：你进行判定并于判定牌生效后获得此判定牌：若结果与你本局游戏发动〖天妒〗弃置过的牌花色相同，你受到1点无来源伤害。",["转换技"]],["遗计","当你受到1点伤害后，你可以摸两张牌，然后你可以将至多等量张手牌交给任意名其他角色。 当你每轮首次进入濒死状态时，你可以摸一张牌，然后你可以将此牌交给一名其他角色。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"谋夏侯渊","t":"虎步关右","k":"魏","kh":4,"mh":4,"g":"男","s":[["神速","回合开始时，你可以选择任意项：1.跳过判定阶段和摸牌阶段；2.跳过摸牌阶段和出牌阶段；3.跳过出牌阶段和弃牌阶段。每选择一项便可以视为使用一张【杀】（无距离限制，对应的选项包含跳过出牌阶段则不可被响应）。若这些选项包含跳过相同阶段，你翻面。",[]],["整辎","回合结束时，若你于此回合内造成过的伤害值之和不小于X（X为你的体力值），你可以回复1点体力并复原武将牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"谋张辽","t":"骁军夜袭","k":"魏","kh":4,"mh":4,"g":"男","s":[["突袭","你的回合内限三次，当你不因此技能获得牌后，你可以将其中任意张牌置入弃牌堆，然后你获得至多X名其他角色各一张手牌（X为你此次以此法置入弃牌堆的牌数）。",[]],["登锋","准备阶段，你可以选择一名其他角色并选择一项：1.选择其装备区里至多两张牌，令其获得之；2.你从牌堆中获得一张【杀】。背水：失去1点体力。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"谋甄姬","t":"薄幸幽兰","k":"魏","kh":3,"mh":3,"g":"女","s":[["洛神","准备阶段，你可以选择一名有手牌的其他角色，自其开始X名其他角色依次展示一张手牌（X为场上存活角色数的一半，向上取整）：若为黑色，你获得之（本回合不计入手牌上限）；若为红色，你可以使用之（无次数限制且不计入次数）；否则你弃置展示牌。",[]],["倾国","你可以将一张黑色手牌当【闪】使用或打出。 攻击范围内包含你的角色回合开始时，你可以令其无法使用或打出本回合获得的非伤害牌，直到其使用伤害牌指定你为目标后或本回合结束。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"庞德","t":"抬榇之悟","k":"魏","kh":4,"mh":4,"g":"男","s":[["决死","出牌阶段，你可以弃置一张【杀】并选择一名其他角色，然后该角色弃置一张牌。若其弃置的牌不为【杀】，你获得之，并视为对其使用一张【决斗】。",[]],["马术","锁定技，你与其他角色的距离-1。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"阮籍","t":"命世大贤","k":"魏","kh":3,"mh":3,"g":"男","s":[["咏怀","出牌阶段限一次，你可以弃置一张牌，若此牌的类型为： 基本牌，你摸两张牌，然后本回合基本牌不计入手牌上限； 锦囊牌，视为使用一张普通锦囊牌，且可以增加或减少一个目标（目标数至少为1）； 装备牌，观看牌堆顶三张牌，获得其中一张，将其余牌以任意顺序置于牌堆顶或牌堆底。",[]],["穷途","当你进入濒死状态时，若〖咏怀〗剩余分支数大于一，你可以移除其中一个分支，将体力值回复至1点，然后令一名其他角色执行此分支的效果。",[]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"阮咸","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["正律","出牌阶段各限一次，1.你可以令一名手牌数大于你的角色弃置一张牌，然后若你与其手牌数相同，你视为使用一张【无中生有】；2.你可以令一名手牌数小于你的角色摸一张牌，然后若你与其手牌数相同，你视为使用一张【酒】。",[]],["酣饮","当你使用【酒】结算结束后，你可以移动场上的一张牌，然后因此失去装备区牌的角色摸一张牌。",[]],["辞辟","每回合限一次，当你于摸牌阶段外获得牌时/你使用【酒】时，你可以将获得的牌置入弃牌堆/令此【酒】无效，然后令一名其他角色摸两张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"山涛","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["节身","回合开始时，你可以执行一个额外的弃牌阶段。若如此做，你摸两张牌并选择一名角色，令其跳过下个弃牌阶段。",[]],["启事","当你的手牌首次于回合内因弃置进入弃牌堆后，你回复1点体力，然后若弃置牌不为装备牌，你可以视为使用一张无距离次数限制的同类型牌（延时锦囊牌除外）。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"司马师","t":"摧坚荡异","k":"魏","kh":4,"mh":4,"g":"男","s":[["景略","出牌阶段限一次，若场上没有“死士”牌，你可以观看一名其他角色的手牌，将其中一张牌标记为“死士”。当“死士”牌被其使用时，你令此牌无效；当“死士”不因使用进入弃牌堆后，或其回合结束时“死士”在其区域内，你获得之。",[]],["败移","限定技，出牌阶段，若场上存在已受伤角色，你可以选择其他两名角色，令这两名角色交换座次。",["限定技"]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"王粲","t":"词章纵横","k":"魏","kh":3,"mh":3,"g":"男","s":[["七哀","出牌阶段，你可以令一名角色观看牌堆顶或你手牌中随机的两张牌并选择其中一张牌获得之。若本回合选择过该类型的牌，你令其回复1点体力并摸一张牌，然后此技能本回合失效。",[]],["善檄","出牌阶段开始时，你可以令一名其他角色获得或失去“檄”标记；当有“檄”标记的角色回复体力后，若其不处于濒死状态，其须选择一项：1.交给你两张牌；2.失去1点体力。",[]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"王戎","t":"晦默危乱","k":"魏","kh":3,"mh":3,"g":"男","s":[["俭吝","一名角色的回合结束时，若你本回合有基本牌因使用或打出而进入弃牌堆，你可以选择其中一张获得之。",[]],["死孝","游戏开始时，你选择一名其他角色。每名角色的回合限一次，当其需要使用除【无懈可击】以外的牌时，其可以观看你的手牌，并可以选择其中一张牌使用之，然后你摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"王元姬","t":"蝶影翩跹","k":"魏","kh":3,"mh":3,"g":"女","s":[["谦冲","锁定技，如果你的装备区内有黑色牌，则你拥有〖帷幕〗；如果你装备区内有红色牌，则你拥有〖明哲〗。出牌阶段开始时，若你装备区里牌的颜色数不为1，则你此阶段内使用牌无次数和距离限制。",["锁定技"]],["尚俭","锁定技，一名角色的结束阶段，若你于此回合失去的牌（非因使用装备牌而失去的牌数与你使用装备牌的过程中未进入你装备区的牌数之和）不大于你的体力值，你摸等同于失去数量的牌。",["锁定技"]],["帷幕","锁定技，你不是黑色锦囊牌的合法目标。",["锁定技","衍生技"]],["明哲","当你于回合外因使用、打出或弃置而失去一张红色牌时，你可以摸一张牌。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"夏侯渊","t":"疾行的猎豹","k":"魏","kh":4,"mh":4,"g":"男","s":[["神速","你可以：跳过判定阶段和摸牌阶段； 跳过出牌阶段； 你每选择一项，视为使用一张无距离限制且无视防具的【杀】。",[]]],"r":[]},{"p":"小程序","sp":"小程序专属","n":"向秀","t":"大畅玄风","k":"魏","kh":3,"mh":3,"g":"男","s":[["妙析","出牌阶段限一次，你可以选择一名其他角色，与其同时展示一张手牌，若这些牌：颜色相同，你获得其的展示牌；类别相同，其失去1点体力；点数相同，〖妙析〗视为未发动且此项本回合失效。",[]],["思旧","每轮结束时，若你本轮获得过其他角色的牌，你可以摸一张牌并观看一名其他角色的手牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"许褚","t":"虎痴","k":"魏","kh":4,"mh":4,"g":"男","s":[["裸衣","当你使用【杀】或【决斗】造成伤害时，你可以弃置一张牌，令此伤害+1。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"杨修","t":"恃才放旷","k":"魏","kh":3,"mh":3,"g":"男","s":[["啖酪","出牌阶段限一次，你可以摸X张牌，然后将这些牌分配给任意名角色，然后未以此法获得牌的角色可以视为对你使用【杀】（X为存活角色数）。",[]],["鸡肋","当你受到伤害后，你可以声明一种牌的类别，伤害来源不能使用或打出你声明的此类手牌直到其下回合开始。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"张昌蒲","t":"厉色严教","k":"魏","kh":3,"mh":3,"g":"女","s":[["抵诽","锁定技，每回合限一次，当你受到伤害后，你摸一张牌并弃置零至两张手牌，然后你展示所有手牌，若造成伤害的牌无花色或你的手牌中没有与对你造成伤害的牌花色相同的牌，你回复1点体力。",["锁定技"]],["严教","出牌阶段限一次，你可以将手牌中一种花色的所有牌交给一名其他角色，然后对其造成1点伤害，若如此做，你的下个回合开始时，你摸X张牌（X为你以此法给出的牌数）。",[]]],"r":[]},{"p":"小程序","sp":"小程序-志","n":"志曹操","t":"挟天饲壑","k":"魏","kh":4,"mh":4,"g":"男","s":[["济时","每轮每种牌名限一次，你可以弃置一张牌并视为使用一张【桃】。若如此做，本轮你下次以此法使用牌时，失去1点体力。",[]],["貳材","移志技，每轮每名角色限一次，你使用的牌， 昔：令体力值小于你的角色回复体力时，此回复值+1； 今：对手牌数小于你的角色造成伤害时，此伤害值+1。 你使用牌结算结束后，若你手牌中没有游戏开始时或上次移志时拥有的手牌，你可以令〖济时〗增加一个基本牌牌名，然后摸两张牌并移志（不受次数限制）。",["移志技"]],["权时","每回合限一次，当你受到伤害后，你可以获得X张点数6~9的牌（X为〖济时〗描述中的基本牌名数），若如此做，你可以交给伤害来源其中任意张牌，然后获得造成伤害的牌（交出牌的牌名字数之和不能小于造成伤害的牌名字数）。",[]]],"r":[]},{"p":"小程序","sp":"小程序-志","n":"志曹丕","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["名典","准备阶段，你可以展示至多两名角色的各一张手牌并获得之，然后其使用当前手牌中牌名字数不小于此牌的牌无次数限制，直到其下个结束阶段。",[]],["迈志","成器（3），当你使用手牌中牌名字数最大的牌造成伤害后，你可以选择一项：1.本局游戏中受〖名典〗影响的牌不可被响应；2.选择一个牌名字数，令〖威著〗可以额外获得一张此字数的牌。进学：四张牌名字数均不相同的牌进入弃牌堆。",["成器技"]],["威著","出牌阶段限一次，或当你受到伤害后，你可以获得一张牌名字数为1的牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-志","n":"志曹植","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["高世","锁定技，你使用牌结算结束后，若此牌非因此法获得，你获得一张字数大于等于此牌的非伤害牌（不计入手牌上限）；否则你本回合不能使用字数小于等于此牌的牌。",["锁定技"]],["时悯","准备阶段，你可以选择一项：1.基本牌；2.锦囊牌；3.装备牌；4.强攻：获得一张因此移除类别的牌。然后令此类别的牌不受〖高世〗限制直到本回合结束。",[]]],"r":[]},{"p":"小程序","sp":"小程序-志","n":"志夏侯徽","t":"","k":"魏","kh":3,"mh":3,"g":"女","s":[["竭情","你可以跳过摸牌阶段，令一名其他角色从牌堆或弃牌堆中获得你指定的两种类型的牌各一张。",[]],["襄智","每轮开始时，你可以观看一名角色的手牌。若如此做，其本轮使用普通锦囊牌指定目标时，你可以选择本轮未选择过的一项：1.令此牌不可被响应；2.为此牌增加一个目标；3.令此牌对其中一个目标额外结算一次。",[]],["折愿","移志技，锁定技，当你死亡时，你令杀死你的角色：昔：将所有手牌交给你选择的一名角色；今：获得每名其他角色区域里的一张牌。你于“襄智”角色的回合内受到伤害时，其令你移志。",["移志技","锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-志","n":"志朱士行","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["寻经","出牌阶段限一次，你可以观看牌堆顶的一张牌。若如此做，令你的上家交给你一张牌，若此牌与观看牌花色不同，你可以对其上家重复此流程。此技能结算后，若你获得过与观看牌相同花色的牌，则你将X张手牌交给一名其他角色（X为你本次以此法获得的牌数）。",[]],["求索","你的首个回合开始时，你获得一张点数为2的牌。当你失去以此法获得的牌时，从牌堆或弃牌堆中获得一张点数比此牌大1的非装备牌，然后若你本回合已因此获得过至少三张牌，则你不能使用、打出、弃置此牌，直到本回合结束。若你未因此获得牌，你的手牌上限改为无限。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"鲍三娘","t":"平南之巾帼","k":"蜀","kh":3,"mh":3,"g":"女"," 至装备区里没有坐骑牌的角色的距离视为1。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极马云騄","t":"剑胆琴心","k":"蜀","kh":4,"mh":4,"g":"女","s":[["狩敌","每回合限一次，你可以将一张♦牌当无距离和次数限制的【杀】使用。你使用的【杀】可以额外指定至多X个本回合未以此法指定过的目标，此【杀】结算结束后，若对所有目标均造成过伤害，你摸X张牌（X为场上体力值不大于你的角色数，且至多为4）。",[]],["骋烈","锁定技，你计算与其他角色的距离-X（X为场上体力值不大于你的角色数，且至多为4）。若所有其他角色均在你的攻击范围内，每回合你使用的首张【杀】指定目标后，弃置目标角色一张手牌。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极庞统","t":"凤雏","k":"蜀","kh":3,"mh":3,"g":"男","s":[["韬环","你的回合内，不处于连环状态的角色受到属性伤害时，此伤害+1。准备阶段，你可以选择一名角色，从其开始的X名不处于连环状态的角色依次选择是否进入连环状态（X为其体力值）。",[]],["戢羽","每局游戏限零次，你可以将一张手牌当一张能造成属性伤害的牌使用。当你造成或受到伤害后，你可以重铸你或当前回合角色的一张牌，若此牌花色与你本轮以此法重铸过的花色均不同，你摸一张牌且此技能可发动次数+1。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极秦宓","t":"彻天之舌","k":"蜀","kh":3,"mh":3,"g":"男","s":[["高概","锁定技，你的回合内限两次，同阵营角色失去一种颜色最后的手牌时，你令其将手牌摸至等同于你的体力上限的张数。然后若其场上有“天”标记且此牌颜色与“天”记录颜色相同，你摸两张牌。",["锁定技"]],["论天","摸牌阶段结束时，你可以与至多四名角色各弃置一张牌，然后你进行一次判定：弃置牌颜色与判定牌相同的角色，获得该颜色的“天”标记直到你的下个回合开始。 拥有“天”标记的角色只能使用与标记颜色相同的【杀】或虚拟【杀】，且使用与标记颜色相同的【杀】不可被响应。",[]],["决谏","当你成为【杀】的目标后，你可以令此【杀】无效，然后选择一项：1.你的下个回合摸牌阶段摸牌数-2（仅摸牌数大于0时可选）；2.失去此技能。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极张飞","t":"万夫不当","k":"蜀","kh":4,"mh":4,"g":"男","s":[["虎魄","出牌阶段各限一次，你可以展示你与一名其他角色的手牌，然后你选择一项：1.弃置你与其均拥有的一个牌名的所有手牌；2.弃置其一张你没有的牌名的手牌。",[]],["酣兴","锁定技，每回合你首次对自己使用牌后，你下一次造成的伤害+1。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极赵云","t":"虎威将军","k":"蜀","kh":4,"mh":4,"g":"男","s":[["龙翊","奋武技，当你使用或打出牌时，你可以亮出牌堆顶至多X张牌，若这些牌花色均与你使用或打出的牌不同，你令一名角色获得这些牌（X为存活角色数的一半，向上取整）。",["奋武技"]],["踏澜","锁定技，你使用于出牌阶段和回合外从牌堆获得的牌无次数限制且不计入次数。你于出牌阶段首次使用武器牌后，此回合你使用的下一张【杀】不可被响应。",["锁定技"]],["绝涯","限定技，当你进入濒死状态时，你可以将所有手牌以任意顺序置于牌堆顶，然后将体力回复至1点，获得令你进入濒死状态的角色的一张牌，然后当前回合结束后，你执行一个额外回合。",["限定技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极诸葛亮","t":"卧龙","k":"蜀","kh":3,"mh":3,"g":"男","s":[["三顾","锁定技，每当有三张牌指定你为目标后，你获得3点谋略值，然后你观看牌堆顶的三张牌，以任意顺序置于牌堆顶或牌堆底。",["锁定技"]],["演势","出牌阶段限一次，你可从牌堆顶或牌堆底（不可与你此阶段上一次选择的相同）摸一张牌。若你于此阶段使用了此牌，你可弃置一张牌再次发动〖演势〗。",[]],["妙计","每回合限一次，你可以消耗1~3点谋略值，视为使用对应的牌：1.【过河拆桥】；3.【无懈可击】或【无中生有】。",["衍生技"]]],"r":[]},{"p":"小程序"," ":"小程序","sp":"小程序-登峰造极","n":"极鲁肃","t":"独断的外交家","k":"吴","kh":3,"mh":3,"g":"男","s":[["虑远","每回合限一次，一名角色每回合首次于其摸牌阶段外获得牌后，若其手牌中没有以此法获得的牌，你可以令其从牌堆中获得一张【杀】或【闪】。",[]],["合纵","出牌阶段各限一次，你可以令一名角色：1.从手牌中使用一张非转化、非虚拟的【杀】（无距离次数限制）；2.重铸手牌中所有【闪】。然后若其因此失去了牌，你可以令其摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极陆逊","t":"儒生雄才","k":"吴","kh":3,"mh":3,"g":"男","s":[["谦谋","游戏开始时，你可以弃置至多两张手牌，获得3倍数量的谋略值；当你的谋略值变化后，若与你的手牌数相同，你摸两张牌。",[]],["帷幄","出牌阶段各限一次，你可以：1.对一名手牌数大于X的角色造成1点伤害；2.与一名手牌数小于X的角色各弃置一张牌（X为你的谋略值，至少为1）。然后你获得2点谋略值。",[]],["妙计","每回合限一次，你可以消耗1~3点谋略值，视为使用对应的牌：1.【过河拆桥】；3.【无懈可击】或【无中生有】。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极吕蒙","t":"白衣渡江","k":"吴","kh":4,"mh":4,"g":"男","s":[["遒学","你每回合首次因弃置失去牌时，你获得2点谋略值；每回合限一次，你使用锦囊牌结算后，你可以弃置一张【杀】获得1点谋略值，或消耗2点谋略值视为使用一张无次数限制的【杀】。",[]],["伏渊","觉醒技，准备阶段，若你的谋略值不小于3，你减1点体力上限并回复体力至体力上限，然后获得技能〖图荆〗。",["觉醒技"]],["图荆","出牌阶段每名角色限一次，你可以选择一名角色并弃置一种花色的所有手牌，视为对其使用一张你本回合使用过的普通锦囊牌，若目标手牌中没有与你弃置牌花色相同的牌，此牌对其额外结算一次。",["衍生技"]],["妙计","每回合限一次，你可以消耗1~3点谋略值，视为使用对应的牌：1.【过河拆桥】；3.【无懈可击】或【无中生有】。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极孙策","t":"江东的小霸王","k":"吴","kh":4,"mh":4,"g":"男","s":[["讨逆","出牌阶段开始时，你可失去任意点体力，摸等量的牌，然后令至多X名没有“讨逆”的其他角色各获得1枚“讨逆”（X为你以此法失去的体力值），此回合你的手牌上限为你的体力上限。",[]],["平江","出牌阶段，你可选择一名有“讨逆”标记的角色，移去其“讨逆”，视为对其使用【决斗】。每回合限一次，若其受到了此【决斗】的伤害，你此回合使用的【决斗】目标角色需要打出【杀】的数量+1，对目标角色造成的伤害+1；否则此技能此回合失效。",[]],["鼎业","结束阶段，你回复X点体力。（X为此回合受到过伤害的其他角色数）",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极孙权","t":"年轻的贤君","k":"吴","kh":4,"mh":4,"g":"男","s":[["纵阋","出牌阶段限一次，你可以将至多三张牌以任意顺序置于牌堆顶，然后令X名角色进行逐鹿（X为你以此法置于牌堆的牌数+1），赢的角色摸两张牌。“逐鹿”结束后，你获得其他角色的“逐鹿”牌。",[]],["戮衡","结束阶段，若你本回合发动过〖纵阋〗，你可以选择一名本回合参与过“逐鹿”中手牌数最多的其他角色，视为对其使用一张【杀】。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极孙尚香","t":"弓腰姬","k":"吴","kh":4,"mh":4,"g":"女","s":[["枭捷","奋武技，出牌阶段，你可以选择一名角色，若为你，弃置你区域内的一张牌；否则弃置其场上的一张牌，视为使用一张【杀】或【酒】，然后此牌目标角色本回合受到的伤害+1。若以此法被弃置牌的角色为你，此牌无次数限制；若以此法弃置的牌不是装备牌，此技能失效直到回合结束。",["奋武技"]],["骄豪","出牌阶段限一次，你可以与一名与你手牌数之差不大于3的其他角色同时展示一张手牌，重复此流程，直到展示牌类别相同或有角色展示了所有手牌。然后你弃置其未展示的手牌，并获得其中的非基本牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极太史慈","t":"笃烈之士","k":"吴","kh":4,"mh":4,"g":"男","s":[["绞锋","出牌阶段开始时，你可以选择一名其他角色并选择至多两项：1.你从牌堆随机获得一张【杀】并与其各视为使用一张【酒】；2.本回合其成为你使用【杀】和【决斗】的额外目标。若你选择了所有项，其可使用一张【杀】（无距离限制）。",[]],["赍志","每轮每名角色限一次，当你使用【杀】或【决斗】造成伤害后，你可以令一名角色的下个摸牌阶段摸牌数和其下个出牌阶段使用【杀】的次数上限+2；当你死亡时，你可令一名其他角色获得此技能。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极小乔","t":"矫情之花","k":"吴","kh":3,"mh":3,"g":"女","s":[["同心","韵律技，出牌阶段限一次，平：你可以令一名其他角色交给你一张手牌，然后若其手牌数不大于你，其摸一张牌；仄：你可以交给一名其他角色一张手牌，然后若其手牌数不小于你，你对其造成1点伤害。 转韵：出牌阶段，使用本回合未使用过的类型的牌。",["韵律技"]],["韶颜","每回合限一次，当其他角色使用牌指定你为目标后，若其手牌数大于你，你摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极周瑜","t":"大都督","k":"吴","kh":3,"mh":3,"g":"男","s":[["英锐","摸牌阶段结束时，或当你杀死一名角色后，你获得4点谋略值。",[]],["焚离","出牌阶段限一次，你可以消耗2点“谋略”值，弃置至多两名座次相邻角色各一张牌，若这些牌颜色相同，你可以再消耗2点“谋略”值，对这些角色依次造成1点火焰伤害。",[]],["妙计","每回合限一次，你可以消耗1~3点谋略值，视为使用对应的牌：1.【过河拆桥】；3.【无懈可击】或【无中生有】。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极诸葛恪","t":"兴家赤族","k":"吴","kh":4,"mh":4,"g":"男","s":[["兴愎","锁定技，当你使用【杀】或锦囊牌结算结束后，你依次执行本轮未执行过的一项：1.获得一张你手牌中没有的类别的牌；2.重铸任意张类别相同的牌；3.获得〖赤族〗并横置。",["锁定技"]],["飨恪","当你装备区里的牌数变化后，你可以将手牌调整至X张，然后可以对一名体力值为X的角色造成1点火焰伤害（X为你装备区里的牌数）。",[]],["赤族","锁定技，当你使用伤害牌指定目标后，若所有角色均横置，则你受到1点火焰伤害，否则你令一名未横置的角色横置。",["锁定技","衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"陆抗","t":"社稷之瑰宝","k":"吴","kh":4,"mh":4,"g":"男","s":[["谦节","锁定技，你被横置前，防止之；你不能成为延时类锦囊牌或其他角色拼点的目标。",["锁定技"]],["决堰","出牌阶段限一次，你可以废除你装备区里的一种装备栏，然后执行对应的一项： 武器栏，本阶段你可以多使用三张【杀】； 防具栏，摸三张牌，本回合手牌上限+3； 坐骑栏，本回合获得〖连营〗，且使用牌无距离限制。",[]],["怀柔","出牌阶段，你可以重铸一张装备牌。",[]],["连营","当你失去手牌后，若你没有手牌，你可以摸一张牌。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"吕蒙","t":"白衣渡江","k":"吴","kh":4,"mh":4,"g":"男","s":[["克己","当你于出牌阶段内使用一张基本牌时，你摸一张牌，本回合手牌上限+1。",[]]],"r":[]},{"p":"小程序","sp":"小程序-修改","n":"谋黄盖","t":"轻身为国","k":"吴","kh":4,"mh":4,"g":"男","s":[["苦肉","出牌阶段开始时，你可以交给一名其他角色一张牌，然后你失去1点体力。当你失去1点体力值时，你获得2点护甲。",[]],["诈降","锁定技，①摸牌阶段，你的摸牌基数+X；②出牌阶段，你使用的前X张牌无距离和次数限制且无法响应（X为你已损失的体力值）。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"谋孙权","t":"江东大帝","k":"吴","kh":4,"mh":4,"g":"男","s":[["制衡","出牌 技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极董卓","t":"","k":"群","kh":5,"mh":5,"g":"男","s":[["威乘","出牌阶段限一次，你可以与至少全场半数（向上取整）角色进行一次逐鹿，胜者视为使用一张指定所有败者为目标的【杀】。若有败者使用【闪】抵消此【杀】，此【杀】结算后，未使用【闪】的败者失去1点体力。",[]],["变观","锁定技，当你每轮首次参与逐鹿后，你获得本次逐鹿拼点牌中的所有伤害牌和基本牌，且这些牌在本轮内无使用次数限制；当你死亡时，令场上所有存活角色进行一次逐鹿，所有败者失去1点体力。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-一将","n":"界蔡夫人","t":"襄江的蒲苇","k":"群","kh":3,"mh":3,"g":"女","s":[["窃听","其他角色回合结束时，若其此回合内未对你造成过伤害，你可以选择一项：1.随机观看其两张手牌并获得其中一张牌；2.将其装备区里的一张牌置入你的装备区；3.摸一张牌。",[]],["献州","限定技，出牌阶段，你可以将装备区里的所有牌交给一名其他角色，然后你回复X点体力，该角色对其攻击范围内的至多X名角色各造成1点伤害（X为你以此法交给该角色的牌的数量）。",["限定技"]]],"r":[]},{"p":"小程序","sp":"小程序-一将","n":"界刘表","t":"跨蹈汉南","k":"群","kh":3,"mh":3,"g":"男","s":[["自守","摸牌阶段，你可以多摸三张牌。若如此做，本回合你不能对体力值不大于你的角色使用【杀】。",[]],["宗室","锁定技，你的手牌上限+3。准备阶段，若你的手牌数不小于体力值，本回合你使用【杀】无距离次数限制。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"界庞德","t":"周苛之节","k":"群","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["猛进","当你使用【杀】指定目标后，你可弃置其一张牌，若此牌：为装备牌，其不能响应此【杀】；不为装备牌，你获得此牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"界袁绍","t":"高贵的名门","k":"群","kh":4,"mh":4,"g":"男","s":[["乱击","出牌阶段，你可以将两张手牌当【万箭齐发】使用（不能使用本阶段发动此技能已使用过的花色）；其他角色响应你使用的【万箭齐发】打出【闪】时，你与其各摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-神话再临","n":"界左慈","t":"迷之仙人","k":"群","kh":3,"mh":3,"g":"男","s":[["化身","游戏开始时，你随机获得三张武将牌作为“化身”牌，然后你选择其中一张“化身”牌的一个技能（主公技/限定技/觉醒技/转换技/势力技除外），你视为拥有此技能，且性别和势力视为与此“化身”牌相同。 回合开始或结束时，你可以选择一项：1.重新进行一次“化身”；2.移去至多两张不为亮出的“化身”牌，然后获得等量的新“化身”牌。",[]],["新生","当你受到1点伤害后，若你有技能“化身”，你可以随机获得一张新的“化身”牌并摸一张牌。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极何太后","t":"弄权之蛇蝎","k":"群","kh":3,"mh":3,"g":"女","s":[["覆胤","游戏开始时，你可以令一名其他角色获得“覆胤”标记。拥有“覆胤”标记的角色跳过其每个回合的首个摸牌阶段。摸牌阶段，你多摸三张牌，然后从摸到的牌中交给有“覆胤”标记的角色X张牌（X为其本轮摸牌阶段基础摸牌数）。",[]],["强忌","每回合限两次，当一名其他角色于其回合外获得手牌后，你可以猜测其手牌中牌最多的一种花色，若你猜对，对其造成1点伤害。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极贾诩","t":"冷酷的毒士","k":"群","kh":3,"mh":3,"g":"男","s":[["权变","锁定技，当一名角色成为伤害类牌的唯一目标后，若此牌与上一张指定其为目标的伤害类卡牌：颜色相同，你获得2点谋略值；牌名相同，你下次发动〖妙计〗谋略值消耗-1（至少为0）。",["锁定技"]],["匡势","出牌阶段限一次，你可以选择一名角色：若其区域内牌数小于体力上限，其将手牌摸至体力上限（至多摸五张），然后你可以观看并使用一张其获得的牌；若其区域内牌数大于体力上限，令其将区域内牌数弃至体力上限（至多弃五张），然后你可以使用一张其弃置的牌。",[]],["沉节","限定技，出牌阶段，你可以消耗3点谋略值，令所有其他角色选择：1.当你下次受到伤害时，将此伤害转移给其；2.减1点体力上限。",["限定技"]],["妙计","每回合限一次，你可以消耗1~3点谋略值，视为使用对应的牌：1.【过河拆桥】；3.【无懈可击】或【无中生有】。",["衍生技"]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极孔融","t":"凛然重义","k":"群","kh":3,"mh":3,"g":"男","s":[["诤仁","有角色受到过伤害的回合结束时，你可以选择一名非当前回合角色，然后选择本轮未选择过的一项令当前回合角色执行：1.交给你选择的角色两张牌；2.弃置两张牌，令你选择的角色摸等量的牌；3.用手牌中花色最多的牌交换你选择的角色手牌中花色最少的牌。",[]],["讥谏","出牌阶段结束时，你可以秘密标记一张基本牌或锦囊牌，当此牌于你的回合外进入弃牌堆后，你可以对一名其他角色造成1点伤害。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极吕布","t":"武的化身","k":"群","kh":4,"mh":4,"g":"男","s":[["无双","锁定技，当你使用【杀】指定目标后，其使用【闪】抵消此【杀】的方式改为需连续使用两张【闪】；当你使用【决斗】指定目标后，或当你成为【决斗】的目标后，你令其打出【杀】响应此【决斗】的方式改为需连续打出两张【杀】。",["锁定技"]],["虓虎","你使用【杀】可以额外指定一个目标。出牌阶段开始时，你可以弃置一张手牌，获得一张【杀】。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极袁绍","t":"高贵的名门","k":"群","kh":4,"mh":4,"g":"男","s":[["尊北","出牌阶段限一次，你可与所有其他角色进行一次逐鹿，胜者，视为使用一张【万箭齐发】。此牌结算结束后，你摸X张牌（X为受到此牌伤害的角色数）。",[]],["盟首","每轮限一次，当你受到其他角色造成的伤害时，若其本轮造成的伤害值不大于你，你可防止此伤害。",[]]],"r":[]},{"p":"小程序","sp":"小程序-登峰造极","n":"极袁术","t":"仲家帝","k":"群","kh":4,"mh":4,"g":"男","s":[["方命","出牌阶段，你可以令一名角色选择一项：1.将一张牌置于牌堆顶（不能放置本回合此技能已放置花色），然后你从牌堆底摸一张牌；2.你对其造成1点伤害，然后此技能失效直到回合结束（修改后：本回合你不能再对其发动此技能）。",[]],["圮族","锁定技，当你于回合内对一名角色造成伤害后（每名角色限一次），你亮出牌堆顶X张牌并可以使用其中任意张牌，然后你弃置未使用数量的手牌（X为场上已受到你造成伤害的角色数且至多为4）。然后若你已受伤且对场上所有其他角色均造成过伤害，你增加1点体力上限，回复1点体力，修改〖方命〗并失去此技能。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-一将","n":"沮授","t":"监军谋国","k":"群","kh":3,"mh":3,"g":"男","s":[["渐营","当你于出牌阶段内使用牌时，若此牌与你于此阶段内使用的上一张牌点数或花色相同，你可以摸一张牌。出牌阶段限一次，你可以选择一种花色，令你此阶段内使用的下一张基本或锦囊牌视为此花色。",[]],["矢北","锁定技，当你受到伤害后，若你此回合受到的伤害次数为：1.你回复1点体力；2.随机弃置你和伤害来源各一张牌；3.你失去所有体力。",["锁定技"]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"刘琦","t":"居外而安","k":"群","kh":3,"mh":3,"g":"男","s":[["问计","出牌阶段开始时，你可以令一名其他角色交给你一张牌，你于此阶段使用与该牌同名的牌不能被其他角色响应。",[]],["屯江","结束阶段，若你于本回合出牌阶段内未使用牌指定过其他角色为目标，你可以摸X张牌（X为存活的其他角色数）。",[]]],"r":[]},{"p":"小程序","sp":"小程序-万象","n":"刘繇","t":"宗英外镇","k":"群","kh":4,"mh":4,"g":"男","s":[["戡难","出 未设伏的非装备牌名，称为“伏兵”；你的回合外其他角色使用牌时，你可以移去一张记录牌名相同的“伏兵”，令此牌无效并摸一张牌。",[]],["贲育","当你受到伤害后，若你的手牌数：小于X，你可以将手牌摸至X张（最多摸五张）；大于X，你可以弃置至少X+1张手牌，对伤害来源造成1点伤害（X为伤害来源的手牌数）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"崔芙","t":"戴冠金尾","k":"魏","kh":3,"mh":3,"g":"女","s":[["裁裘","每轮开始时，你观看牌堆顶X张牌（X为游戏人数），然后你可以获得其中至少一张牌。若如此做，当其他角色本轮使用牌结算结束后，若此牌与你因此获得的牌存在同名，你失去1点体力。",[]],["袭裳","锁定技，游戏开始时，你选择本局形象，获得对应的“褽装”；当你不因摸牌而获得牌时，明置之；你的明置手牌于被其他角色选择时不可见。 褽装（桂殿） 褽装（东郊） 褽装（绣阁）",["锁定技"]],["褽装","每回合每项限一次，你可以弃置一张：1.武器牌，视为使用一张任意【杀】；2.防具牌，视为使用一张【闪】；防御坐骑牌，视为使用一张【桃】；进攻坐骑牌，视为使用一张【酒】你以此法使用的牌。无次数限制且不计入次数，且于结算结束后从牌堆或弃牌堆获得一张弃置牌花色的牌。若你的明置牌包含四种花色，将此技能中的弃置改为展示。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"崔琰","t":"伯夷之风","k":"魏","kh":3,"mh":3,"g":"男","s":[["雅俊","摸牌阶段，你多摸一张牌。出牌阶段开始时，你可以用一张本回合获得的牌与一名其他角色拼点，若你：赢，你可以将其中一张拼点牌置于牌堆顶；没赢，你本回合的手牌上限-1。",[]],["尊嫡","出牌阶段限一次，你可以弃置一张手牌并选择一名角色，然后你进行判定，若结果为：黑色，其摸三张牌；红色，其可以移动场上一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"崔琰毛玠","t":"日出月盛","k":"魏","kh":3,"mh":3,"g":"男","s":[["奉迎","限定技，出牌阶段，你可以选择一名角色并令其攻击范围内的所有其他角色须将一张手牌当做【无中生有】对其使用。若该角色体力上限为全场最大，此回合结束时你获得一个额外的回合。",["限定技"]],["征辟","准备阶段，你可以选择至多一名其他角色，其选择令你获得其区域内的一至三张牌，然后你交给其等量张牌。每名角色限一次，若其选择三，你因〖征辟〗选择的角色数+1。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"丁姝","t":"","k":"魏","kh":3,"mh":3,"g":"女","s":[["照抚","每回合限一次，你可以弃置所有手牌，视为使用：1.【杀】；2.【闪】；3.【酒】；4.【桃】。若你恰好因此弃置序数张牌，可以令一名其他角色获得仅能转化对应牌名、且发动后或回合结束时失去的〖照抚〗。",[]],["泣留","锁定技，你每轮首次因〖照抚〗失去所有手牌后，摸X张牌（X为你已执行过的回合数）。你于回合外对其他角色使用【桃】后，其本回合下次受到伤害时，防止之且此技能本轮失效。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-龙血玄黄","n":"毌丘俭","t":"才识拔干","k":"魏","kh":4,"mh":4,"g":"男","s":[["摧阵","游戏开始时，你可以选择至多三名其他角色，废除其武器栏；当你于出牌阶段内使用【杀】或伤害类锦囊牌指定其他角色为目标后，若其手牌数不小于体力值，则你可以废除其武器栏；摸牌阶段，你额外摸X张牌（X为场上被废除的武器栏数+1，至多为3）。",[]],["溃离","锁定技，当你受到伤害后，你恢复伤害来源的武器栏。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"郭女王","t":"文德皇后","k":"魏","kh":3,"mh":3,"g":"女","s":[["易宠","准备阶段，你可以选择一名其他角色并指定一种花色，获得其所有该花色的装备和一张该花色的手牌，并令其获得“雀”标记直到你下个回合开始（若场上已有“雀”标记则转移给该角色）。拥有“雀”标记的角色获得你指定花色的牌时，你获得此牌（你至多因此“雀”标记获得一张牌）。",[]],["诬诽","你使用【杀】或普通锦囊牌造成的伤害的来源视为拥有“雀”的角色。当你受到伤害后，若拥有“雀”标记的角色体力值大于3， n":"界郭皇后","t":"皎月孤悬","k":"魏","kh":3,"mh":3,"g":"女","s":[["矫诏","出牌阶段每名角色限一次，你可以展示一名距离1以内的角色一张手牌，并声明一个基本牌或普通锦囊牌牌名，你下次对其发动此技能前，其可以将之当声明的牌使用（不能对其或本轮已成为过“矫诏”牌目标的角色使用）。",[]],["殚心","你受到伤害后，或有角色因〖矫诏〗使用牌后，你摸一张牌，并可以令一名角色将其“矫诏”牌当【无中生有】使用。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界一将成名","n":"界满宠","t":"政法兵谋","k":"魏","kh":3,"mh":3,"g":"男","s":[["峻刑","出牌阶段限一次，你可以弃置任意张手牌并令一名其他角色选择一项：1.弃置等量的牌并失去1点体力；2.翻面，然后摸等量的牌。",[]],["御策","当你受到伤害后，你可以展示一张手牌，令伤害来源弃置一张类别不同的手牌，否则你回复1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界限突破","n":"界王基","t":"学行坚白","k":"魏","kh":3,"mh":3,"g":"男","s":[["奇制","蓄力技（1/2），出牌阶段每名角色限一次，你可以消耗1点蓄力点，令一名角色摸两张牌，然后本回合你使用基本牌或普通锦囊牌指定目标后，你依次观看本回合因此摸牌的角色的手牌并弃置其一张牌。",["蓄力技"]],["进趋","锁定技，你每于回合内使用两张基本牌或普通锦囊牌后，你令一名角色获得1点蓄力点；结束阶段，你摸X张牌（X为本回合你蓄力点数存在过的最高值）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-界限突破","n":"界夏侯惇","t":"独眼的罗刹","k":"魏","kh":4,"mh":4,"g":"男","s":[["刚烈","当你受到1点伤害后，你可以判定，若结果为：红色，你对来源造成1点伤害；黑色，你弃置来源的一张牌。",[]],["清俭","每回合限一次，当你于摸牌阶段外获得牌后，你可以将任意张手牌扣置于你的武将牌上；一名角色的结束阶段，若你的武将牌上有“清俭”牌，你将这些牌分配给其他角色，若交出的牌大于一张，你摸一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界限突破","n":"界徐晃","t":"周亚夫之风","k":"魏","kh":4,"mh":4,"g":"男","s":[["断粮","你可以将一张黑色非锦囊牌当【兵粮寸断】使用。你对手牌数不小于你的角色使用【兵粮寸断】无距离限制。",[]],["截辎","锁定技，当一名其他角色跳过摸牌阶段后，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-界限突破","n":"界荀彧","t":"王佐之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["驱虎","出牌阶段限一次，你可以与一名体力值大于你的角色拼点。若你赢，该角色对其攻击范围内你指定的另一名角色造成1点伤害；若你没赢，其对你造成1点伤害。",[]],["节命","当你受到1点伤害后，你可以令一名角色摸两张牌，然后若其手牌数小于其体力上限，你摸一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界一将成名","n":"界于禁","t":"讨暴坚垒","k":"魏","kh":4,"mh":4,"g":"男","s":[["节钺","结束阶段，你可以将一张牌交给一名其他角色，然后其选择一项：1.保留手牌和装备区内的各一张牌，然后弃置其余的牌；2.令你摸三张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界一将成名","n":"界钟会","t":"桀骜的野心家","k":"魏","kh":4,"mh":4,"g":"男","s":[["权计","出牌阶段结束时，若你的手牌数大于你的体力值，或当你受到1点伤害后，你可以摸一张牌，然后你将一张手牌置于武将牌上，称为“权”；你的手牌上限+X（X为“权”数）。",[]],["自立","觉醒技，准备阶段，若“权”的数量不小于3，你选择一项：1.回复1点体力；2.摸两张牌。然后减1点体力上限，获得〖排异〗。",["觉醒技"]],["排异","出牌阶段限一次，你可以将一张“权”置入弃牌堆，令一名角色摸两张牌，然后若该角色的手牌数大于你的手牌数，你对其造成1点伤害。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-界一将成名","n":"嵇康","t":"峻峰孤松","k":"魏","kh":3,"mh":3,"g":"男","s":[["清弦","出牌阶段限一次，你可以选择至多X名其他角色并弃置等量的牌（X为你的体力值），若这些角色装备区内的牌数：小于你，其回复1点体力；大于你，其失去1点体力；等于你，其摸一张牌。若你选择的目标数等于X，你摸一张牌。",[]],["绝响","当你死亡时，杀死你的角色弃置装备区里的所有牌并失去1点体力，然后你可以令一名其他角色获得技能〖残韵〗，该角色可以弃置场上一张♣牌，再获得技能〖绝响〗。",[]],["残韵","出牌阶段限一次，你可以选择至多X名其他角色并弃置等量的牌（X为你的体力值，每名角色每局游戏限一次），若这些角色装备区内的牌数：小于你，其回复1点体力；大于你，其失去1点体力；等于你，其摸一张牌。若你选择的目标数等于X，你摸一张牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"骥乐进","t":"折冲御侮","k":"魏","kh":4,"mh":4,"g":"男","s":[["陷坚","当你使用【杀】指定唯一目标后，你可以选择一项：1.你摸一张牌，其弃置X张牌（X为其场上的牌数且至少为1）；2.此【杀】结算结束后，你将此【杀】置入其一个空置装备栏中，称为“陷坚”牌。",[]],["折锐","装备区有“陷坚”牌的角色使用【杀】指定目标后，你对其发动一次由其选择的〖陷坚〗；当一名角色失去装备区的一张“陷坚”牌后，你对其造成1点伤害。",[]],["合御","若友方骥张辽在场，你发动〖陷坚〗的【杀】造成伤害后，你可以对目标角色执行未选择的一项；若友方骥李典在场，每回合有角色首次失去“陷坚”牌后，你摸一张牌。（仅斗地主和2v2模式生效）",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"骥李典","t":"义忘私隙","k":"魏","kh":3,"mh":3,"g":"男","s":[["断津","当你使用一张基本牌结算完毕后，你可以弃置一名本回合使用过牌的其他角色的一张牌。",[]],["慨公","每回合限一次，当你对其他角色造成伤害后或受到其他角色造成的伤害后，你可以展示你或该角色的至多两张手牌并与牌堆底等量张牌交换；若交换的牌至少包含三种花色，你可以使用其中一张牌（无次数限制且不计入次数限制）。",[]],["合御","若友方骥乐进在场，你获得因〖断津〗弃置的牌；若友方骥张辽在场，〖慨公〗使用的牌不可被响应。（仅斗地主和2v2模式生效）",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"骥张辽","t":"气夺三军","k":"魏","kh":4,"mh":4,"g":"男","s":[["冲垒","锁定技，你的出牌阶段内，所有其他角色的非基本手牌均只能作为【闪】使用或打出；出牌阶段内限X次（X为其他角色数），当你使用的牌被其他角色响应后，或当你响应其他角色使用的牌后，你获得该角色一张手牌。",["锁定技"]],["荡势","当你使用伤害牌结算完毕后，你可以令其中一名目标其他角色选择一项：1.弃置X张牌（X为所有角色本轮选择此选项的次数，至少为1）；2.你对其造成1点伤害。",[]],["合御","锁定技，若友方骥乐进在场，〖冲垒〗的“非基本手牌”改为“手牌”；若友方骥李典在场，〖荡势〗的X固定为3。（仅斗地主和2v2模式生效）",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"梁习","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["挟饵","出牌阶段限一次，你可以选择一名其他角色，其选择摸一或两张牌，然后你选择等量项：1.其下回合开始前，其仅能使用这些牌；2.其下次受到的伤害+1。",[]],["安攘","每回合各限一次，你使用【杀】或普通锦囊牌指定唯一目标时，可以将手牌调整至与目标角色相同（至多摸五张），若因此弃牌则此牌额外结算一次。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"礼卢毓","t":"规鉴清理","k":"魏","kh":3,"mh":3,"g":"男","s":[["禀法","每轮开始时，你可以指定两条律法，令所有武将牌正面朝上的角色进行选择。若如此做，本轮内结束时，你依次执行被选择次数最多的项。",[]],["束刑","你的回合内每名角色限一次，当一名其他角色成为【杀】的目标时，你可以令此【杀】对其无效，然后展示其所有手牌。若其手牌中有【闪】，则其须选择一项：1.失去1点体力；2.交给你其中所有【闪】，且下次进行“禀法”选择时，改为由你代替其进行选择。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"刘晔","t":"佐世之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["破橹","锁定技，回合开始时，你获得游戏外、牌堆或弃牌堆中的一张【霹雳车】并使用之；当你受到1点伤害后，若你的装备区里没有【霹雳车】，你摸一张牌，然后随机从牌堆中获得一张武器牌并使用之。",["锁定技"]],["筹略","出牌阶段开始时，你可以令一名其他角色选择是否交给你一张牌，若其执行，你可视为使用上一张除延时锦囊牌以外对你造成伤害的牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-龙血玄黄","n":"李昭焦伯","t":"竭诚尽节","k":"魏","kh":4,"mh":4,"g":"男","s":[["佐佑","转换技，出牌阶段限一次，阳：你可以令一名角色摸三张牌，然后其弃置两张手牌；阴：你可以令一名角色弃置一张手牌，然后其获得1点护甲（若为2v2模式，则改为令一名角色获得1点护甲）。",["转换技"]],["侍守","锁定技，当其他角色执行了“佐佑”的一项后，你执行“佐佑”的另一项。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"娄圭","t":"一日之寒","k":"魏","kh":3,"mh":3,"g":"男","s":[["灌沙","限定技，出牌阶段结束时，你可以将你所有的牌替换为牌堆中等量随机基本牌，本回合手牌上限+X（X为你因此得到的牌名数）。",["限定技"]],["急御","出牌阶段限一次，你可以弃置一张手牌，从牌堆或弃牌堆随机获得与此牌类别不同的牌各一张；每阶段限两次，若你使用了所有因此获得的牌，此技能视为未发动过。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"马钧","t":"没渊瑰璞","k":"魏","kh":3,"mh":3,"g":"男","s":[["精械","出牌阶段，你可以展示你手牌区或装备区里的一张【诸葛连弩】【八卦阵】【仁王盾】【白银狮子】【藤甲】，然后升级此牌；\n当你进入濒死状态时，你可以重铸一张防具牌，然后将体力值回复至1点。",[]],["巧思","出牌阶段限一次，你可以表演一次“水转百戏图”，获得对应的牌，然后你选择一项：1.弃置等量的牌；2.将等量的牌交给一名其他角色。（不足则全给/全弃）",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"毛玠","t":"清公素履","k":"魏","kh":3,"mh":3,"g":"男","s":[["秉清","当你于出牌阶段内使用牌时，若此牌与你此阶段使用过的牌花色均不相同，则你记录此花色。此牌结算结束后，根据此阶段记录的花色数，你可以执行对应效果： 两种，令一名角色摸两张牌； 三种，弃置一名角色区域内的一张牌； 四种，对一名其他角色造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋曹操","t":"魏武大帝","k":"魏","kh":4,"mh":4,"g":"男","s":[["奸雄","游戏开始时，你可以获得至多两枚“治世”标记。当你受到伤害后，你可以获得对你造成伤害的牌并摸1-X张牌，然后你可以移除1枚“治世”（X为“治世”的数量）。",[]],["清正","出牌阶段开始时，你可以选择一名有手牌的其他角色，你弃置3-X（X为你的“治世”标记数）种花色的所有手牌，然后观看其手牌并弃置其中一种花色的所有牌，若其被弃置的牌数小于你弃置的牌数，你对其造成1点伤害。然后若你拥有〖奸雄〗且“治世”标记数小于2，你可以获得1枚“治世”。",[]],["护驾","主公技，每轮限一次，当你受到伤害时，你可以将此伤害转移给一名其他魏势力角色。",["主公技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋曹丕","t":"魏文帝","k":"魏","kh":3,"mh":3,"g":"男","s":[["行殇","当一名角色受到伤害后（每回合限一次）或死亡时，则你获得两枚“颂”标记（你至多拥有9枚“颂”标记）；出牌阶段限两次，你可选择一名角色并移去至少一枚“颂”令其执行对应操作：2枚，复原武将牌或摸三张牌；3枚，回复1点体力并加1点体力上限，然后随机恢复一个已废除的装备栏（目标体力上限不大于9方可选择）；4枚，追思一名已阵亡的角色（你的武将牌上有〖行殇〗时方可选择此项），获得其武将牌上除主公技外的所有技能，然后你失去〖行殇〗、〖放逐〗、〖颂威〗。",[]],["放逐","出牌阶段限一次，若你有〖行殇〗，则你可以选择一名其他角色，并移去至少一枚“颂”标记令其执行对应操作：2枚，直到其下个回合结束，其不能使用除基本牌外的手牌；4枚，直到其下个回合结束，其不可响应除其外的角色使用的牌，6枚，直到其下个回合结束，其所有武将技能失效，或其不能使用除锦囊牌外的手牌；8枚，其翻面，或直到其下个回合结束，其不能使用除装备牌外的手牌（若为斗地主，则令其他角色技能失效、只可使用装备牌及翻面的效果不可选择）。",[]],["颂威","主公技，出牌阶段开始时，若你有〖行殇〗，你获得X枚“颂”标记（X为存活的其他魏势力角色数的两倍）。",["主公技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋曹仁","t":"固若金汤","k":"魏","kh":4,"mh":4,"g":"男","s":[["据守","①出牌阶段限一次，若你的武将牌正面朝上，你可以翻面、弃置至多两张牌并获得等量的护甲。 ②当你受到伤害后，若你的武将牌背面朝上，你可以选择一项：1.翻面；2.获得1点护甲。 ③当你的武将牌从背面翻至正面时，你摸等同于你护甲值的牌。",[]],["解围","出牌阶段限一次，你可以失去1点护甲并选择一名其他角色，你观看其手牌并获得其中一张。",[]]],"r":[],"ar":1},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋郭淮","t":"垂问秦雍","k":"魏","kh":4,"mh":4,"g":"男","s":[["精策","锁定技，回合开始时，若你没有“精策”牌，则你清除未验证的预测记录，然后将牌堆顶三张牌置于你的武将牌上，称为“精策”牌；回合结束时，你预测将获得这些“精策”牌的角色或不被任何角色获得，然后根据预测顺序将这些牌分别置为牌堆顶的第三、六、九张牌（无法置入该位置的牌改为置于牌堆底）。若你预测正确，则你分别摸一、二、三张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋郭嘉","t":"奉己佐君","k":"魏","kh":3,"mh":3,"g":"男","s":[["天妒","转换技，出牌阶段开始时，阳：你可以弃置两张手牌并记录这些牌的花色，然后可以视为使用任意普通锦囊牌；阴：你判定，若结果为你记录过的花色，你受到1点无来源伤害。当此次判定的结果确定后，你获得判定牌。",["转换技"]],["遗计","当你受到伤害后，你可以摸两张牌，然后你可将至多等量张手牌交给其他角色（若为身份模式，则改为仅可给出以此法摸的牌）；当你每轮首次进入濒死状态时，你可以摸一张牌，然后你可将此牌交给一名其他角色（若为团战模式，则改为摸两张牌且可将至多等量张手牌交给其他角色）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋夏侯惇","t":"独眼的罗刹","k":"魏","kh":4,"mh":4,"g":"男","s":[["刚烈","每名角色限一次，出牌阶段限一次，你可以对至少一名对你造成过伤害的角色造成2点伤害。",[]],["清俭","当一张牌不因使用而进入弃牌堆后，若你的“清俭”数不大于X（X为你的体力值-1，且至少为1），则你将此牌置于你的武将牌上，称为“清俭”；出牌阶段结束时，你将你的所有“清俭”分配给任意角色。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋夏侯渊","t":"虎步关右","k":"魏","kh":4,"mh":4,"g":"男","s":[["神速","回合开始时，你可以选择任意项：1.跳过判定阶段和摸牌阶段；2.跳过摸牌阶段和出牌阶段；3.跳过出牌阶段和弃牌阶段。你每以此法选择一项，便视为使用一张无距离限制的任意一种【杀】（不可连续指定相同的目标）。若你跳过了出牌阶段，对应的【杀】不可响应；若你选择跳过的阶段有所重复，你翻面。",[]],["整辎","回合结束时，若你于此回合内造成过的伤害值之和不小于X（X为你的体力值），你可以回复1点体力并复原武将牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋徐晃","t":"径行截辎","k":"魏","kh":4,"mh":4,"g":"男","s":[["断粮","出牌阶段限一次，你可以与一名其他角色进行一次“谋弈”： 围城断粮，你将牌堆顶的一张牌当无距离限制的【兵粮寸断】对其使用，若无法使用改为你获得其一张牌； 擂鼓进军，你视为对其使用一张【决斗】。",[]],["势迫","结束阶段，你可以令一名体力值小于你的角色或所有判定区里有【兵粮寸断】的其他角色选择一项：1.交给你一张手牌，且你可以将此牌交给一名其他角色；2.受到1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋荀彧","t":"王佐之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["驱虎","出牌阶段限一次，若你有牌，你可以与两名有牌的其他角色同时将至少一张牌扣置于各自的武将牌上。若你扣置的牌数唯一最少，则扣置牌较多的其他角色获得你扣置的牌，且双方获得各自扣置的牌；否则扣置牌较多的其他角色对扣置牌较少的其他角色造成1点伤害，并获得你扣置的牌，然后双方将其扣置的牌置入弃牌堆（若双方扣置牌数相等，则与你逆时针最近的角色视为扣置牌数较多）。",[]],["节命","当你受到伤害后，你可以令一名角色摸四张牌，然后其可弃置至少一张牌，若其弃置的牌数小于X（X为你已损失的体力值且至少为1），则你失去1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋于禁","t":"威严毅重","k":"魏","kh":4,"mh":4,"g":"男","s":[["狭援","每轮限一次，其他角色受到伤害后，若此伤害令其失去全部护甲，则你可以弃置两张手牌，令其获得本次伤害结算中其失去的护甲。",[]],["节钺","结束阶段，你可以令一名其他角色获得1点护甲，然后其可以交给你一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋张郃","t":"变数尽展","k":"魏","kh":4,"mh":4,"g":"男","s":[["巧变","准备阶段，你可以弃置任意张不同区域内的牌，然后跳过等量个阶段，并于跳过对应阶段后可以执行相应效果： 1.摸牌阶段，你可以获得至多两名其他角色各一张手牌； 2.出牌阶段，你可以移动场上一张牌，然后若你装备区内的牌数未增加，则你可以令因此场上牌数增加的角色摸两张牌； 3.弃牌阶段，你摸一张牌，然后在结束阶段后，若你手牌数不小于场上角色数，你执行一个额外的出牌阶段。",[]],["料势","每回合限一次，你可以将因〖巧变〗获得的牌当【杀】或【闪】使用或打出。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋张辽","t":"古之召虎","k":"魏","kh":4,"mh":4,"g":"男","s":[["突袭","你的回合内限两次（若为斗地主或2v2模式则改为一次），当你不因此技能获得牌后，你可以将其中任意张牌置入弃牌堆，然后你获得至多X名其他角色各一张手牌（X为你此次以此法置入弃牌堆的牌数）。",[]],["登锋","准备阶段，你可以选择一名其他角色并选择一项：1.选择其装备区里至多两张牌，令其获得之；2.你从牌堆中获得一张【杀】。背水：失去1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋甄姬","t":"薄幸幽兰","k":"魏","kh":3,"mh":3,"g":"女","s":[["洛神","准备阶段，你可以选择一名角色，自其开始的X名其他角色依次展示一张手牌（X为场上存活角色数的一半，向上取整）：若为黑色，你获得之（这些牌不计入你本回合的手牌上限）；若为红色，其弃置之。",[]],["倾国","你可以将一张黑色手牌当【闪】使用或打出。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"牵招","t":"威风远振","k":"魏","kh":4,"mh":4,"g":"男","s":[["势吓","出牌阶段限一次，你可以与一名其他角色拼点，若你赢，直到其下回合结束，防止其对友方角色造成的伤害；没赢，你随机弃置一张牌。",[]],["镇抚","结束阶段，若你本回合因弃置失去过牌，你可以令一名其他角色获得1点护甲。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"清河公主","t":"蛊虿之谗","k":"魏","kh":3,"mh":3,"g":"女","s":[["谮构","出牌阶段限一次，你可以观看一名角色的所有手牌，然后选择一项： 1.视为使用两张其手牌中没有的牌名的基本牌（不计入次数且无次数限制）； 2.你与其依次将手牌区里的共有牌名的牌替换为牌堆中等量的【杀】（以此法得到的【杀】不计入手牌上限，直到各自的回合结束）。 然后其获得一个你指定基本牌名的“诬”标记。拥有此标记的角色每回合使用的第一张牌结算后，若与记录的牌名相同，其移除此标记并失去1点体力。",[]],["诽离","当你受到伤害时，若你拥有〖谮构〗，你可以弃置两张牌防止此伤害；若伤害来源拥有“诬”标记，你可以改为移除此标记防止此伤害，然后你摸两张牌且本局游戏不能对其发动〖谮构〗。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"阮慧","t":"明察福祸","k":"魏","kh":3,"mh":3,"g":"女","s":[["明察","摸牌阶段开始时，你亮出牌堆顶三张牌，然后你可以放弃摸牌并获得其中点数不大于8的牌，若你以此法获得了牌，你可以选择一名其他角色，随机获得其一张牌。",[]],["敬重","弃牌阶段结束时，若你本阶段弃置过至少两张黑色牌，你可以选择一名其他角色；其下回合出牌阶段限三次，当其使用牌结算后，你获得之。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势曹真","t":"荷国天督","k":"魏","kh":4,"mh":4,"g":"男","s":[["伺锋","结束阶段，你可以将牌堆顶的三张牌以任意顺序分配并扣置在至多两名其他角色的武将牌上，称为“伺锋”。 武将牌上有“伺锋”的角色：于其回合内使用牌后，你移去其武将牌上的首张“伺锋”，若其使用的牌与移去的“伺锋”颜色不同，其弃置一张手牌；其回合结束时，若有“伺锋”未被移去，你选择一项：1.获得其武将牌上的“伺锋”；2.移去其武将牌上剩余的“伺锋”，然后对其造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势陈矫","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["清严","你可以展示X张手牌（X为本轮本技能发动次数，且至多为5），视为使用一张【闪】或【无懈可击】，然后此技能失效，直至你手牌中没有以此法展示的牌。",[]],["策断","出牌阶段限一次，你可以选择一名攻击范围内包含你的角色，其攻击范围内的所有角色同时展示一张手牌，然后你将手牌中展示牌最多颜色的所有牌当一张不计入次数限制的任意一种【杀】对其使用。若造成伤害，你摸一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势陈群","t":"片言折狱","k":"魏","kh":3,"mh":3,"g":"男","s":[["定品","每轮限一次，一个回合结束时，你可以令本回合失去牌最多的一名角色摸两张牌。",[]],["法恩","每回合限两次，有角色使用牌时，若上一张牌的使用者为你，你可以令其执行一项：1.摸一张牌；2.弃置一张牌。若如此做，本回合下一名使用牌的角色将额外执行另一项。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势邓艾","t":"勇气陵云","k":"魏","kh":4,"mh":4,"g":"男","s":[["屯田","蓄力技（0/0），当你失去非伤害牌后，你获得1点蓄力点；出牌阶段限一次，你可以消耗至少1点蓄力点，令至多等量名角色随机获得一张♥牌；一名角色的回合开始时，若你蓄力点已满，你摸一张牌且蓄力点上限+1。",["蓄力技"]],["凿险","锁定技，当你一次性消耗的蓄力点数不小于对应值时，你从弃牌堆获得一张对应牌：3，【无中生有】；5，【无懈可击】；7，【五谷丰登】。",["锁定技"]],["急袭","一名角色的回合结束时，若存在本回合成为过你使用牌的目标的其他角色，你可以弃置当前回合角色一张牌，视为使用一张指定其中任意名角色为目标的无视距离的【顺手牵羊】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势董昭","t":"陈筹定势","k":"魏","kh":3,"mh":3,"g":"男","s":[["妙略","游戏开始时，你获得两张【瞒天过海】；当你受到伤害后，你可以选择一项：1.摸两张牌；2.从牌堆或弃牌堆获得一张你指定的智囊。",[]],["迎驾","限定技，一名角色的回合结束时，若你于此回合内使用过至少两张同名锦囊牌，你可以弃置一张手牌，令一名角色执行一个额外回合，此额外回合开始时其摸两张牌。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势国渊","t":"清介有守","k":"魏","kh":3,"mh":3,"g":"男","s":[["清蹈","当其他角色使用的伤害类卡牌结算结束后，若目标中有你，且你：受到过此牌造成的伤害，你可以从牌堆或弃牌堆中获得一张【闪】，或弃置一名角色区域里的一张牌；未受到过此牌造成的伤害，则你可以从牌堆或弃牌堆中获得一张【杀】，或使用一张手牌（无距离限制）。",[]],["修耕","回合开始时，你可以记录至多两名角色的手牌数。若如此做，这些角色的摸牌阶段开始时，若其手牌数：不大于记录值，则其摸两张牌；不小于记录值，则其手牌上限+1。",[]],["陈赦","当一名其他角色进入濒死状态时，你可以依次弃置你、其、伤害来源的各一张牌，若这些角色均被因此弃置了牌且花色均相同，其回复体力至上限，然后你失去此技能。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势桓阶","t":"才周托命","k":"魏","kh":4,"mh":4,"g":"男","s":[["共谋","准备阶段，你可以与一名其他角色交换手牌，若如此做，你获得技能〖奇策〗、其获得技能〖看破〗直到回合结束。",[]],["正朔","限定技，出牌阶段，你可以令所有角色依次弃置所有手牌，然后洗牌，若如此做，所有角色各摸四张牌。",["限定技"]],["奇策","出牌阶段限一次，你可以将所有的手牌当任意普通锦囊牌使用。",["衍生技"]],["看破","你可以将一张黑色手牌当【无懈可击】使用。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势王昶","t":"识度良臣","k":"魏","kh":3,"mh":3,"g":"男","s":[["开济","准备阶段，你可以令至多X名角色各摸一张牌，若有角色因此获得非基本牌，你摸一张牌（X为进入过濒死状态的存活角色数，且至少为1）。",[]],["慑叛","每轮每种牌名限一次，每回合限一次，当你成为其他角色使用伤害类牌的目标后，你可以选择一项：1.摸一张牌；2.将其一张手牌置于牌堆顶。然后若你与其手牌数相同，此牌对你无效。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势夏侯尚","t":"魏胤前驱","k":"魏","kh":4,"mh":4,"g":"男","s":[["探锋","准备阶段，你可以选择任意项：1.弃置一名角色至多两张牌，然后若其手牌数不大于你，你跳过摸牌阶段；2.对一名角色造成1点火焰伤害，然后若其体力值不大于你，你跳过出牌阶段。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势辛宪英","t":"明鉴致节","k":"魏","kh":3,"mh":3,"g":"女","s":[["诫节","每名角色的出牌阶段限一次，当前回合角色可以令你观看其手牌，然后你可以选择一种花色，若其手牌：包含此花色，其本回合使用此花色的牌无次数限制，然后弃置其余花色的手牌；不包含此花色，其从牌堆或弃牌堆中随机获得此花色的一张牌。每轮限两次，若其本轮以此法令你观看的牌所包含的花色为唯一最多，你视为对其发动一次〖清识〗。",[]],["清识","当你受到伤害后，你可以选择一名角色，若你与其阵营：相同，你与其各摸一张牌；不同，你弃置你与其各一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势张既","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["定镇","每轮开始时，你可以令与你距离X以内的至多X名其他角色依次选择一项（X为你当前体力值）：1.弃置一张【杀】；2.本轮其于回合内使用锦囊牌不能指定你为目标。",[]],["攸业","锁定技，其他角色的结束阶段，若其本回合未对你造成过伤害，你将牌堆顶的一张牌置于你的武将牌上，称为“蓄”（至多5张）。当你造成或受到伤害后，你任意分配所有“蓄”，若未分配给当前回合角色，你失去1点体力。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势钟会","t":"荡蜚缴志","k":"魏","kh":4,"mh":4,"g":"男","s":[["肆恣","蓄力技（4/4）。出牌阶段限一次，你可以减至少1点蓄力点，然后获得以下效果，直到X个回合结束后或你的回合开始（X为本次消耗的蓄力点）：1.当一名角色使用【杀】造成伤害时，此伤害+1；2.一名角色的回合结束时，你摸两张牌，然后于本回合内使用过【杀】的角色各失去1点体力。若X大于你的体力值，则额外获得以下效果：一名角色的回合结束时，若本回合没有角色使用过【杀】，当前回合角色失去1点体力。",["蓄力技"]],["挟志","锁定技，当你的体力变化后，你获得X点蓄力点（X为本次变化的值）。若你会因此获得超额蓄力点，你的手牌上限和使用【杀】的次数上限+1。",["锁定技"]],["迂难","觉醒技，你的登场势力为魏；当你令一名角色进入濒死状态时，若本轮有角色死亡，你将势力变更为群，然后获得或升级技能〖克昌〗。",["觉醒技"]],["克昌","一级：主公技，锁定技，群势力角色使用【杀】无距离限制。 二级：主公技，锁定技，群势力角色使用【杀】无距离限制；你使用的【杀】不可被响应。",[]]],"r":[]},{"p":"手杀","sp":"手杀-龙血玄黄","n":"司马孚","t":"徒难夷惠","k":"魏","kh":3,"mh":3,"g":"男","s":[["蹒襄","当一名角色受到伤害时，你可以选择一项（不能选择上次对该角色发动时选择的选项）：1.令此伤害-1，然后伤害来源摸两张牌；2.令此伤害+1，然后其摸三张牌。",[]],["臣节","锁定技，若你有〖蹒襄〗，当一名成为过蹒襄目标的角色死亡后，你弃置你区域内所有牌，然后摸四张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"司马昭","t":"四海威服","k":"魏","kh":3,"mh":3,"g":"男","s":[["昭心","出牌阶段限一次，你可以将任意张牌置于你的武将牌上，称为“望”（其总数不能超过3），然后摸等量的牌。你和你攻击范围内角色的摸牌阶段结束时，其可以获得一张你选择的“望”，然后你可以对其造成1点伤害。",[]],["怠攻","每回合限一次，当你受到伤害时，你可展示所有手牌令伤害来源选择一项：1.交给你一张与你以此法展示的所有牌花色均不同的牌；2.防止此伤害。",[]]],"r":[],"vi":1,"vt":3},{"p":"手杀","sp":"手杀-龙血玄黄","n":"司马昭","t":"独祅吞天","k":"魏","kh":3,"mh":3,"g":"男","s":[["挟征","结束阶段，你可以令至多一名角色（若为斗地主模式，改为两名，本局游戏限一次）依次将随机一张手牌置于牌堆顶，然后视为你使用一张【兵临城下】（若为身份模式，优先指定同势力角色为目标），结算后若未造成过伤害，你失去1点体力。",[]],["谦吞","魏势力技，出牌阶段限一次，你可以令一名有手牌的其他角色展示至少一张手牌，然后你与其拼点（其仅能用展示牌拼点）。若你赢，你获得其展示的手牌；若你没赢，你获得其未展示的手牌。（若为斗地主模式，至多获得两张）",["势力技"]],["昭凶","持恒技，限定技，准备阶段，若你已受伤，你可以将势力变更为群，然后你获得技能〖荡异〗（若为身份模式，则删去〖挟征〗中的“优先指定同势力角色为目标”）。",["持恒技","限定技"]],["荡异","主公技，当你造成伤害时，你可以令此伤害值+1，本局游戏限X次（X为你获得此技能时已损失体力值+1）。",["主公技","衍生技"]]],"r":[],"vi":3,"vt":3},{"p":"手杀","sp":"手杀-龙血玄黄","n":"司马伷","t":"恭温克己","k":"魏","kh":4,"mh":4,"g":"男","s":[["避锋","当你成为基本牌或普通锦囊牌的目标时，若目标数不大于4，则你可取消之。若如此做，此牌结算结束后，若没有其他角色响应过此牌，则你失去1点体力，否则你摸两张牌。",[]],["宿望","一名角色的回合结束时，若其于此回合内使用牌时指定过你为目标且你未受到过伤害（若为2v2模式，则改为受到过的伤害值不大于1），则你将牌堆顶一张牌置于你的武将牌上，称为“宿望”；摸牌阶段，若你有“宿望”，则你可以改为获得你的所有“宿望”，然后你可令一名其他角色摸两张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"苏越","t":"建始承梁","k":"魏","kh":4,"mh":4,"g":"男","s":[["筑殿","出牌阶段限一次，你可以选择至少一张点数不同的牌或一名角色的至少一张“筑殿”牌，将之重铸或置于一名角色的武将牌上（要求点数小于对应角色的所有“筑殿”牌），然后你摸其激活的效果数张牌；你的手牌上限和摸牌阶段摸牌数+X（X为场上〖罗材〗技能数）； 一名角色根据其“筑殿”牌数获得以下效果： 1.获得〖罗材〗； 5.〖罗材〗亮出牌数变为5； 9.〖罗材〗在其每轮首次受到伤害后也可发动； 13.你所在的阵营获得游戏胜利。",[]],["罗材","出牌阶段限一次，你可以亮出牌堆顶的三张牌，获得其中满足以下任一项的牌：\n1.牌名中含有与你的任意“筑殿”牌名相同的字；\n2.与你的任意“筑殿”牌点数相同。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"王粲","t":"词章纵横","k":"魏","kh":3,"mh":3,"g":"男","s":[["七哀","出牌阶段限一次，你可以将一张非基本牌交给一名其他角色，然后其选择一项：1.令你回复1点体力；2.令你摸两张牌。",[]],["善檄","出牌阶段开始时，你可以令一名没有“檄”的角色获得一枚“檄”标记（若场上有该标记则改为转移至该角色）；当有“檄”标记的角色回复体力后，若其不处于濒死状态，其须选择一项：1.交给你两张牌；2.失去1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"王经","t":"青云孤竹","k":"魏","kh":3,"mh":3,"g":"男","s":[["阻进","每回合每种牌名限一次，若你未受伤或体力值不为最低，你可以将一张基本牌当【杀】使用或打出；若你已受伤，你可以将一张基本牌当【闪】或【无懈可击】使用或打出。",[]],["节谏","准备阶段，你可以将任意张手牌交给一名其他角色，令其获得“节谏”标记。每名角色的回合限一次，当“节谏”角色成为其他角色使用非装备牌的唯一目标时，你可以将此牌转移给你，然后摸一张牌。“节谏”角色的回合结束时，移除其“节谏”标记，若其体力值不小于你交给其牌时的体力值，你摸两张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"王朗","t":"凤鹛","k":"魏","kh":3,"mh":3,"g":"男","s":[["鼓舌","出牌阶段限一次，你可以用一张手牌与至多三名角色同时拼点，然后依次结算拼点结果，没赢的角色选择一项：1.弃置一张牌；2.令你摸一张牌。若拼点没赢的角色是你，你需先获得一个“饶舌”标记（你有7个饶舌标记时，你死亡）。",[]],["激词","当你发动〖鼓舌〗拼点牌亮出后，若点数小于X，你可以令点数+X；若点数等于X，你可以令你本阶段〖鼓舌〗可发动次数+1（X为你“饶舌”标记的数量）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"王凌","t":"风节格尚","k":"魏","kh":4,"mh":4,"g":"男","s":[["星启","当你使用一张不为延时锦囊的牌时，若没有此牌名的“备”，则记录此牌牌名为“备”。结束阶段，你可以移除一个“备”，获得牌堆中一张同名牌。",[]],["自缚","锁定技，出牌阶段结束时，若你本阶段未使用牌，你本回合手牌上限-1并移除你所有的“备”。",["锁定技"]],["秘备","使命技， ⬤　成功：当你使用牌结算后，若你拥有每种牌类别的“备”各不少于两个，你从牌堆获得每种类别的牌各一张，然后获得技能〖谋立〗。 ⬤　失败：弃牌阶段结束时，若此时和本回合准备阶段你均没有“备”，你减1点体力上限且使命失败。",["使命技"]],["谋立","出牌阶段限一次，你可以令一名其他角色移除你的一个“备”，然后其获得牌堆中一张同名牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"王双","t":"边城猛兵","k":"魏","kh":4,"mh":4,"g":"男","s":[["异勇","当你受到其他角色使用【杀】造成的伤害后，若你的装备区里有武器牌，你可以获得此【杀】，然后将此【杀】当普【杀】对其使用（若其装备区里没有武器牌，此【杀】对其造成的伤害+1）。",[]],["擅械","出牌阶段限一次，你可以从牌堆中获得一张武器牌（若没有，则随机获得一名其他角色装备区内的武器牌）。其他角色使用【闪】响应你使用的【杀】时，若此【闪】没有点数或点数不大于你攻击范围的两倍，则此【闪】无效。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"王元姬","t":"清雅抑华","k":"魏","kh":3,"mh":3,"g":"女","s":[["谦冲","锁定技，如果你的装备区所有牌均为黑色，则你拥有〖帷幕〗；如果你装备区所有牌均为红色，则你拥有〖明哲〗。出牌阶段开始时，若你不满足上述条件，则你选择一种类型的牌，本阶段内使用此类型的牌无次数和距离限制。",["锁定技"]],["尚俭","锁定技，一名角色的结束阶段，若你于此回合失去的牌（非因使用装备牌而失去的牌数与你使用装备牌的过程中未进入你装备区的牌数之和）不大于你的体力值，你摸等同于失去数量的牌。",["锁定技"]],["帷幕","锁定技，你不是黑色锦囊牌的合法目标。",["锁定技","衍生技"]],["明哲","当你于回合外因使用、打出或弃置而失去一张红色牌时，你可以摸一张牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-龙血玄黄","n":"文钦","t":"淮山骄腕","k":"魏","kh":4,"mh":4,"g":"男","s":[["孛明","游戏开始时，你可以令至多两名角色分别从牌堆中随机获得一张攻击范围为X的武器牌（X为其手牌中的花色数）。",[]],["仇铓","每回合限一次，当你使用【杀】指定唯一目标后或当你成为【杀】的唯一目标后，你可以选择一项：1.令此【杀】伤害+1；2.令此【杀】被抵消后，你可以获得你与其距离1以内的一名其他角色区域内的一张牌。背水：弃置你与其装备区里的武器牌（你或其装备区里有武器牌才可选择）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"文鸯","t":"独骑破军","k":"魏","kh":4,"mh":4,"g":"男","s":[["却敌","每回合限一次，当你使用【杀】或【决斗】指定唯一目标后，你可以选择一项：1.获得其一张手牌；2.弃置一张基本牌，令此【杀】或【决斗】伤害基数+1；背水：减1点体力上限。",[]],["椎锋","魏势力技，出牌阶段限两次，你可以失去1点体力，视为使用一张【决斗】。当你受到以此法使用的【决斗】造成的伤害时，防止此伤害，此技能于此阶段内无效。",["势力技"]],["冲坚","吴势力技，你可以将一张装备牌当【酒】或无距离限制且无视防具的任意一种【杀】使用。当你以此法使用的【杀】对一名角色造成伤害后，你获得其装备区里的X张牌（X为伤害值）。",["势力技"]],["仇决","锁定技，当你杀死一名角色后，你加1点体力上限，摸两张牌，你本回合〖却敌〗可发动次数+1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"夏侯楙","t":"","k":"魏","kh":4,"mh":4,"g":"男","s":[["统围","出牌阶段限一次，你可以重铸手牌中任意张基本牌并选择一项： 1.所有手牌中有同名牌的角色各弃置一张基本牌； 2.获得本回合因弃置进入弃牌堆的所有同名基本牌； 背水：移除一个可〖蹙国〗牌名。",[]],["蹙国","锁定技，你使用伤害牌指定目标后，弃置你与所有目标角色的点数最大的手牌，若弃置了点数小于此牌的牌，此牌额外结算一次。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"星周不疑","t":"稚雀清声","k":"魏","kh":3,"mh":3,"g":"男","s":[["慧夭","出牌阶段限一次，你可以受到1点无来源伤害并选择一名其他角色，视为其对你选择的另一名角色造成1点伤害。",[]],["雀颂","一名角色结束阶段，若你本回合受到过伤害，你可以令一名角色选择一项：1.摸三张牌（若其装备区里的牌数大于2，则改为摸两张牌）并复原武将牌；2.回复1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"辛毗","t":"一节肃六军","k":"魏","kh":3,"mh":3,"g":"男","s":[["引裾","出牌阶段限一次，你可以令一名其他角色选择一项：1.其下个回合的准备阶段，跳过其本回合的出牌阶段和弃牌阶段；2.对你使用一张无距离限制的【杀】。",[]],["持节","每回合限一次，当你成为其他角色使用牌的唯一目标时，你可以进行判定，若点数大于6，则取消之。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"杨阜","t":"勇撼雄狮","k":"魏","kh":3,"mh":3,"g":"男","s":[["借兵","锁定技，当你受到伤害后，你选择除伤害来源外的一名其他角色，随机获得其一张牌并展示之，若此牌为装备牌，则你使用之。",["锁定技"]],["扞难","出牌阶段限一次，你可以与一名其他角色拼点，拼点赢的角色对拼点没赢的角色造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"羊徽瑜","t":"温慧母仪","k":"魏","kh":3,"mh":3,"g":"女","s":[["弘仪","出牌阶段限一次，你可以指定一名其他角色，当其于你的下个回合开始之前造成伤害时，其判定，若结果为：红色，受伤角色摸一张牌；黑色，令伤害值-1。",[]],["劝封","限定技，当一名其他角色死亡后，你可以追思该角色，失去〖弘仪〗，获得其武将牌上的所有技能（主公技除外），加1点体力上限，回复1点体力；当你处于濒死状态时，你可以加2点体力上限，回复4点体力。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"袁涣","t":"随车致雨","k":"魏","kh":3,"mh":3,"g":"男","s":[["请决","每轮限一次，一名其他角色使用牌指定一名体力值小于其的其他角色为唯一目标时，若没有角色处于濒死状态，你可以摸一张牌，与使用者拼点，若你赢或你不是此牌合法目标，取消此牌；若你没赢且是此牌合法目标，此牌目标转移为你。",[]],["奉节","锁定技，准备阶段，你选择一名其他角色，直到你下回合开始，每名角色结束阶段，若你选择的角色存活，你将手牌摸或弃至与该角色的体力值相同（至多摸至四张） :"女","s":[["集智","锁定技，当你使用普通锦囊牌时，你摸一张牌，以此法获得的牌本回合不计入手牌上限。",["锁定技"]],["奇才","你使用锦囊牌无距离限制。出牌阶段限一次，你可以选择一名其他角色，将手牌或弃牌堆中一张装备牌置入其装备区（若为斗地主模式，则改为防具牌且每种牌名限一次），然后其获得“奇”标记。有“奇”标记的角色接下来获得的三张普通锦囊牌须交给你。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋黄忠","t":"没金铩羽","k":"蜀","kh":4,"mh":4,"g":"男","s":[["烈弓","若你未装备武器，你的【杀】只能当作普通【杀】使用或打出。你使用牌时或成为其他角色使用牌的目标后，若此牌的花色未被“烈弓”记录，则记录此种花色。当你使用【杀】指定唯一目标后，你可以亮出牌堆顶的X张牌（X为你记录的花色数-1，且至少为0），然后每有一张牌花色与“烈弓”记录的花色相同，你令此【杀】伤害+1，且其不能使用“烈弓”记录花色的牌响应此【杀】。若如此做，此【杀】结算结束后，清除“烈弓”记录的花色。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋姜维","t":"见危授命","k":"蜀","kh":4,"mh":4,"g":"男","s":[["挑衅","蓄力技（4/4），出牌阶段限一次，你可以消耗任意蓄力点并选择等量的其他角色，令这些角色依次选择一项：1.对你使用一张无距离限制的【杀】；2.交给你一张牌。当你于弃牌阶段弃置牌后，你的蓄力点+X（X为你此次弃置的牌数）。",["蓄力技"]],["志继","觉醒技，准备阶段，若你因发动〖挑衅〗累计消耗的蓄力点大于3，你减1点体力上限，令任意名角色获得“北伐”标记直到你的下回合开始或死亡；拥有“北伐”标记的角色使用牌只能指定你或其为目标。",["觉醒技"]]],"r":[],"ar":1},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋刘备","t":"雄才盖世","k":"蜀","kh":4,"mh":4,"g":"男","s":[["仁德","蓄力技（0/8），出牌阶段开始时，你获得2点蓄力点；出牌阶段，你可以将任意张牌交给一名本阶段未因此获得过牌的其他角色，并获得等量蓄力点。每回合限一次，你可以消耗2点蓄力点，视为使用或打出一张基本牌。",["蓄力技"]],["章武","锁定技，你或一名因〖仁德〗获得过牌的角色杀死角色后，你摸三张牌。一名因〖仁德〗获得过牌的角色死亡后，你的蓄力点上限减半（向上取整）且出【杀】次数和攻击范围+1，然后你选择一种颜色，本局游戏你此颜色的手牌只能当【杀】（黑色为雷【杀】，红色为火【杀】）使用或打出。",["锁定技"]],["激将","主公技，出牌阶段结束时，你可以令一名体力值大于等于你的其他蜀势力角色选择一项：1.视为对你指定的其攻击范围内的一名角色使用一张普通【杀】：2.跳过下一个出牌阶段。",["主公技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋马超","t":"阻戎负勇","k":"蜀","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["铁骑","每当你使用【杀】指定其他角色为目标后，你可令其不能响应此【杀】，且所有非锁定技失效直到回合结束。然后你与其进行谋弈。若你赢，且你选择的选项为：“直取敌营”，则你获得其一张牌；“扰阵疲敌”，你摸两张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋孟获","t":"南蛮王","k":"蜀","kh":4,"mh":4,"g":"男","s":[["祸首","锁定技，①【南蛮入侵】对你无效； ②当其他角色使用【南蛮入侵】指定目标后，你代替其成为此牌造成的伤害的来源； ③出牌阶段开始时，你随机获得弃牌堆中的一张【南蛮入侵】； ④当你于出牌阶段使用【南蛮入侵】后，此阶段内你不能再使用【南蛮入侵】。",["锁定技"]],["再起","蓄力技（3/7），弃牌阶段结束时，你可以消耗任意蓄力点并选择等量的角色，令这些角色依次选择一项：1.令你摸一张牌；2.弃置一张牌，然后你回复1点体力。每回合一次，当你造成伤害后，获得1点蓄力点。",["蓄力技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋庞统","t":"铁索连舟","k":"蜀","kh":3,"mh":3,"g":"男","s":[["连环","出牌阶段，你可以将一张♣手牌当【铁索连环】使用（每个出牌阶段限一次）或重铸；当你使用【铁索连环】时，你可以失去1点体力。若如此做，当此牌指定一名角色为目标后，若其未横置，你随机弃置其一张手牌。",[]],["涅槃","限定技，当你处于濒死状态时，你可以弃置区域里的所有牌，复原你的武将牌，然后摸两张牌并将体力回复至2点，最后修改〖连环〗。\n连环·修改：出牌阶段，你可以将一张♣手牌当【铁索连环】使用（每个出牌阶段限一次）或重铸；你使用【铁索连环】可以额外指定任意名角色为目标；当你使用【铁索连环】指定一名角色为目标后，若其未横置，你随机弃置其一张手牌。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋孙尚香","t":"骄豪明俏","k":"蜀","kh":4,"mh":4,"g":"女","s":[["结姻","使命技，你的登场势力为“蜀”，游戏开始时，你将一名其他角色选择为结姻角色。\n结姻角色死亡后，你减1点体力上限；结姻角色出牌阶段开始时，你选择一项：\n1.令其获得1点护甲；2.你将势力变更为吴，然后获得其X张牌（X为游戏轮数且至多为3）。\n⬤　成功：若结姻角色护甲值为5，你升级〖枭姬〗至三级。\n⬤　成功：若结姻角色装备区里的牌数为4，你升级〖枭姬〗至四级。\n⬤　失败：若结姻角色死亡，或你势力为吴，你清除结姻角色记录，重铸所有♥手牌，然后摸两张牌，升级〖枭姬〗至二级。",["使命技"]],["良助","蜀势力技，锁定技，你或结姻角色回复体力后，对方摸一张牌。 出牌阶段结束时，若你已受伤，你回复1点体力；否则你观看三张装备牌，然后选择一张交给结姻角色（若其对应装备栏空置则使用之）。",["势力技","锁定技"]],["枭姬","你失去装备区里的一张牌时，你摸两张牌。 ⬤　二级：你失去装备区里的一张牌时，你摸两张牌，然后可以弃置场上一张牌。 ⬤　三级：你或结姻角色失去装备区里的一张牌时，你摸两张牌，若为每轮首次发动，你获得1点护甲。 ⬤　四级：你或结姻角色失去装备区里的一张牌时，你摸两张牌，然后本回合使用【杀】次数+1。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋卧龙诸葛亮","t":"忠武侯","k":"蜀","kh":3,"mh":3,"g":"男","s":[["火计","使命技，出牌阶段限一次，你可以选择一名其他角色，对其及其同势力的其他角色各造成1点火焰伤害。 ⬤　成功：准备阶段，若你本局游戏对其他角色造成过至少X点火焰伤害（X为本局游戏人数），你失去〖火计〗〖看破〗，获得〖观星〗〖空城〗。 ⬤　失败：当你进入濒死状态时，使命失败。",["使命技"]],["看破","每轮开始时，你清除〖看破〗记录的牌名，然后你可以选择并记录任意个与你上次以此法记录过的牌名均不相同的非装备牌的牌名（每局游戏至多记录四个牌名，若为斗地主或2V2模式则改为两个牌名）。当其他角色使用与你记录牌名相同的牌时，你可以移除一个对应牌名的记录，然后令此牌无效并摸一张牌。",[]],["观星","准备阶段，你移去所有的“星”，并将牌堆顶的X张牌置于武将牌上（X为7-此前此技能准备阶段发动次数的三倍），称为“星”，然后你可以将任意张“星”置于牌堆顶。结束阶段，若你未于准备阶段将“星”置于牌堆顶，则你可以将任意张“星”置于牌堆顶。你可以如手牌般使用或打出“星”。",["衍生技"]],["空城","锁定技，当你受到伤害时，若你拥有技能〖观星〗且你的武将牌上：有“星”，你判定，若结果点数不大于“星”数，则此伤害-1；没有“星”，此伤害+1。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋夏侯氏","t":"燕语呢喃","k":"蜀","kh":3,"mh":3,"g":"女","s":[["樵拾","每回合限一次，你受到其他角色造成的伤害后，伤害来源可以令你回复等同此次伤害值的体力，若如此做，该角色摸两张牌。",[]],["燕语","出牌阶段限两次，你可以弃置一张【杀】并摸一张牌。出牌阶段结束时，你可以令一名其他角色摸X张牌（X为你此回合以此法弃置【杀】的数量的三倍）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋张飞","t":"义付桃园","k":"蜀","kh":4,"mh":4,"g":"男","s":[["咆哮","锁定技，①你使用【杀】无次数限制；②若你装备了武器牌，你使用【杀】无距离限制；③当你于出牌阶段使用【杀】指定目标后，若你本阶段已使用过【杀】，你令目标角色本回合非锁定技失效，此【杀】不能被响应且【杀】伤害值+1，此【杀】对目标角色造成伤害后若其未死亡，你失去1点体力并随机弃置一张手牌。",["锁定技"]],["协击","准备阶段，你可以选择一名其他角色，与其进行一次“协力”。 该角色的回合结束时，若你与其“协力”成功，你可以视为对至多三名角色使用一张【杀】，此【杀】造成伤害后，你摸等同于此【杀】造成伤害数的牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋赵云","t":"七进七出","k":"蜀","kh":4,"mh":4,"g":"男","s":[["龙胆","蓄力技（1/3），一名角色的回合结束时，你获得1点蓄力点。你可以减少1点蓄力点，将一张【杀】当【闪】、【闪】当普通【杀】使用或打出。你以此法使用牌时，摸一张牌。",["蓄力技"]],["积著","准备阶段，你可以选择一名其他角色，与其进行一次“协力”。\n其回合结束时，若你与其“协力”成功，则直到你的下个回合结束后，你修改〖龙胆〗：将“【杀】当【闪】、【闪】当【杀】”改为“基本牌当任意基本牌”。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋诸葛亮","t":"","k":"蜀","kh":3,"mh":3,"g":"男","s":[["观星","准备阶段，你移去所有的“星”，并将牌堆顶的X张牌置于武将牌上（X为7-此前此技能准备阶段发动次数的三倍），称为“星”，然后你可以将任意张“星”置于牌堆顶。结束阶段，若你未于准备阶段将“星”置于牌堆顶，则你可以将任意张“星”置于牌堆顶。你可以如手牌般使用或打出“星”。",[]],["空城","锁定技，当你受到伤害时，若你拥有技能〖观星〗且你的武将牌上：有“星”，你判定，若结果点数不大于“星”数，则此伤害-1；没有“星”，此伤害+1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋祝融","t":"野性的女王","k":"蜀","kh":4,"mh":4,"g":"女","s":[["巨象","锁定技，【南蛮入侵】对你无效；当其他角色使用的【南蛮入侵】结算结束后，你获得之。结束阶段，若你本回合未使用过【南蛮入侵】，你随机将游戏外一张【南蛮入侵】交给一名角色（游戏外共有2张【南蛮入侵】）。",["锁定技"]],["烈刃","当你使用【杀】指定一名其他角色为唯一目标后，你可以与其拼点。若你赢，此【杀】结算结束后，你可对另一名其他角色造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"庞羲","t":"璧玉佐君","k":"蜀","kh":3,"mh":3,"g":"男","s":[["蓄业","每回合限一次，当全场手牌数最少的角色受到伤害后，你可以令其摸两张牌，然后若其手牌数全场最多，你将其区域内的一张牌置于牌堆顶。",[]],["匡襄","出牌阶段限一次，你可以与一名手牌数不大于你的其他角色交换手牌，直到你下个出牌阶段开始，当你或其失去所有因此获得的手牌后，你可以执行一次〖蓄业〗的效果。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"彭羕","t":"难别菽麦","k":"蜀","kh":3,"mh":3,"g":"男","s":[["达命","①游戏开始时，你获得1点“达命”值；②其他角色的出牌阶段限一次，其可以交给你一张牌，然后你选择另一名其他角色。若后者有相同类型的牌，则后者须交给前者一张相同类型的牌且你获得1点“达命”值，否则你将以此法获得的牌交给前者。",[]],["嚣逆","①出牌阶段限一次，若你的“达命”值大于0，你可以将一张牌当任意一种【杀】或伤害类锦囊牌使用，并减少此牌目标数点“达命”值。 ②你的手牌上限等于X（X为“达命”值，且至多为你的体力值）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"谯周","t":"观星知命","k":"蜀","kh":3,"mh":3,"g":"男","s":[["知命","准备阶段开始时或弃牌阶段结束时，你摸一张牌，然后你可将一张牌置于牌堆顶。",[]],["星卜","结束阶段，你可以亮出牌堆顶的三张牌，然后你可以根据其中红色牌的数量，令一名你指定的其他角色获得以下效果之一： 3张红色牌：«五星连珠»，其下个回合摸牌阶段额外摸2张牌、出牌阶段可以额外使用一张【杀】； 2张红色牌：«白虹贯日»，其下个回合出牌阶段可使用【杀】的次数-1，并跳过弃牌阶段； 不多于1张红色牌：«荧惑守心»，其下个回合准备阶段弃置一张手牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势陈到","t":"白毦督","k":"蜀","kh":4,"mh":4,"g":"男","s":[["往烈","出牌阶段开始时，你可以选择一张手牌，你此阶段使用此牌无距离限制且不可被响应，且你使用此牌结算结束后，你此阶段不能对其他角色使用牌。",[]],["弘毅","锁定技，游戏开始时，你获得2枚“毅”标记；当你造成或受到伤害后，你获得1枚“毅”标记；你至多拥有4枚“毅”标记。 准备阶段，你选择一项，本回合下个结束阶段你执行另一项：1.摸X张牌（X为你此时的“毅”标记数）；2.弃置所有“毅”标记。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势陈祗","t":"承指接竖","k":"蜀","kh":3,"mh":3,"g":"男","s":[["权宠","锁定技，每轮限一次，结束阶段，你弃置所有牌，并于当前回合结束后执行一个额外的回合。若你的体力值不为全场唯一最大，此回合开始时，你失去1点体力。",["锁定技"]],["任行","每轮限两次，每回合首次有牌不于弃牌阶段被弃置时，你可以选择一项：1.与当前回合角色各摸一张牌；2.弃置一名本回合未使用或打出过【杀】的角色一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势高翔","t":"","k":"蜀","kh":4,"mh":4,"g":"男","s":[["驰援","出牌阶段限一次，你可以交给一名体力值小于你的角色一张牌，视为对攻击范围内包含其的一名其他角色使用普通【杀】。若此【杀】造成了伤害，其回复1点体力，否则目标角色各视为对你使用普通【杀】。",[]],["饵敌","结束阶段，你可以选择一名手牌数大于你的角色，失去1点体力，摸一张牌，并与其同时选择是否弃置任意张牌。然后若你弃置的牌数：大于其，你回复1点体力并对其造成1点伤害；小于其，你摸等同于其弃置的牌数张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势魏延","t":"矜忠跨万山","k":"蜀","kh":4,"mh":4,"g":"男","s":[["壮誓","出牌阶段开始时，你可以依次执行其中的任意项：1.弃置任意张手牌，你此阶段使用的前等量张牌无距离限制且不可响应；2.失去任意点体力，你此阶段使用的前等量张牌不计入次数。",[]],["饮战","锁定技，当你使用【杀】对一名角色造成伤害时，若你的：体力值不大于其，此伤害+1；手牌数不大于其，你于此【杀】结算结束后弃置其一张牌。乘势：你回复1点体力并获得其弃置的牌。",["锁定技"]],["忠傲","使命技，游戏开始时，你获得技能〖狂骨〗。\n⬤　成功：当你杀死一名角色后，你升级技能〖狂骨〗。若你于此阶段内：使用的牌数小于因〖壮誓〗弃置的牌数，你摸一张牌；使用的牌数小于因〖壮誓〗失去的体力数，你回复1点体力（未受伤则改为摸一张牌）。\n⬤　失败：当你进入濒死状态时，或你选择不执行技能〖壮誓〗，你失去技能〖壮誓〗并获得技能〖困奋〗。",["使命技"]],["狂骨","当你对距离1以内的角色造成伤害后，你可以选择一项：1.回复1点体力；2.摸一张牌。\n⬤　二级：当你对距离1以内的角色造成伤害后，你可以选择一项：1.回复1点体力；2.摸一张牌。背水：弃置一张牌，然后你此阶段使用【杀】的次数+1。",["衍生技"]],["困奋","锁定技，结束阶段，你失去1点体力，然后摸两张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势赵云","t":"毅志弥奋","k":"蜀","kh":4,"mh":4,"g":"男","s":[["武翊","若你从手牌使用或打出过的基本牌名数大于等于： 1，每轮限一次，你可以视为使用一张【杀】或【闪】； 2，你使用基本牌无次数限制； 3，你使用基本牌无距离限制； 4，你的手牌数始终为4。",[]],["摧锋","每轮限两次，每回合结束时，你可以视为对当前回合角色使用一张伤害值+X的【决斗】（X为本回合所有角色打出【杀】的次数）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"王甫赵累","t":"忱忠不移","k":"蜀","kh":4,"mh":4,"g":"男","s":[["殉义","游戏开始时，你选择一名其他角色，令其获得“义”标记。 当你或有“义”的角色受到1点伤害后，若伤害来源不为另一方，另一方弃置一张牌。 当你或有“义”的角色造成1点伤害后，若受伤角色不为另一方，另一方摸一张牌。 当有“义”的角色死亡时，你可以转移“义”标记。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"吴班","t":"碧血的英豪","k":"蜀","kh":4,"mh":4,"g":"男","s":[["进讨","锁定技，你使用【杀】无距离限制且次数+1。你出牌阶段使用的第一张【杀】不可响应，第二张【杀】伤害值基数+1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"向宠","t":"镇军之岳","k":"蜀","kh":4,"mh":4,"g":"男","s":[["固营","锁定技，每回合限一次，当你于回合外因使用、打出或弃置一次性仅失去一张牌后，当前回合角色须选择一项：1.随机交给你一张牌；2.你获得此牌（若为装备则使用之）。准备阶段，你须弃置X张牌（X为本技能发动次数），然后重置此技能发动次数。",["锁定技"]],["睦阵","出牌阶段各限一次，你可以：将一张装备牌置于一名其他角色装备区内，然后获得其一张手牌；交给一名装备区内有牌的其他角色两张牌，然后获得其装备区内一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"向朗","t":"","k":"蜀","kh":3,"mh":3,"g":"男","s":[["纳学","你可以跳过出牌阶段，若如此做，你可以弃置任意张牌，摸等量的牌，然后交给至多两名其他角色各一张牌。",[]],["遗诫","锁定技，当你死亡时，将场上所有角色的体力值调整至X（X为场上所有其他角色体力值的平均值，向下取整且至少为1）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"想学刘禅","t":"","k":"蜀","kh":3,"mh":3,"g":"男","s":[["想学","锁定技，你每使用2张未使用过的牌名的牌，获得等量个“惘”标记并摸1张牌，然后若“惘”数为： 6，交换上文中的两个数字； 9，删除上文中的“未”； 12，失去此技能。",["锁定技"]],["致用","每局游戏每项限一次，你可以弃置对应数量张牌，视为使用一张普通【杀】： 1.手牌数；2.2；3.“惘”数。 若弃置牌数等于序数，改为弃置一名其他角色对应数量张牌或摸等量张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"杨仪","t":"孤鹬","k":"蜀","kh":3,"mh":3,"g":"男","s":[["度断","每回合限一次，当你成为【杀】的目标后，你可以重铸一张牌，然后你选择一项令此【杀】的使用者执行：1.摸两张牌令此【杀】无效；2.弃置一张牌令此【杀】不可被响应。",[]],["共损","出牌阶段开始时，你可以弃置两张牌并选择一名其他角色，然后你声明一种基本牌或普通锦囊牌的牌名。若如此做，直到你的下个回合开始或你死亡时，你与其均不能使用、打出或弃置此牌名的手牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘关羽","t":"","k":"蜀","kh":4,"mh":4,"g":"男","s":[["武圣","你可以将任意张牌当无距离限制的【杀】使用或打出，此【杀】结算后，若你本回合首次以此数量转化牌，你摸两张牌且此【杀】不计入次数。",[]],["义绝","锁定技，你对一名角色造成致命伤害时，其选择是否交给你任意张牌，然后你选择一项：1.本回合其不能使用或打出牌，你弃置所有与这些牌花色相同的手牌；2.防止此伤害，本轮其与你使用牌指定对方为目标时，取消之。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"张南","t":"澄辉的义烈","k":"蜀","kh":4,"mh":4,"g":"男","s":[["奋武","结束阶段，你可以选择一名其他角色，各视为对对方使用无距离限制的普通【杀】，然后你弃置未受到此【杀】伤害的目标角色的一张牌，若为你，你执行一个额外的摸牌和出牌阶段。",[]],["履锋","锁定技，每名角色限一次，你首次对一名角色造成伤害后，获得一张伤害基数值为X的【杀】（X为此技能发动次数）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"张翼","t":"亢锐怀忠","k":"蜀","kh":4,"mh":4,"g":"男","s":[["执义","锁定技，一名角色的结束阶段，若你本回合使用或打出过基本牌，你选择一项：1.视为使用任意一张你本回合使用或打出过的基本牌；2.摸一张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"赵统赵广","t":"翊赞季兴","k":"蜀","kh":4,"mh":4,"g":"男","s":[["翊赞","你可以将两张牌（其中至少一张是基本牌）当任意基本牌使用或打出。",[]],["龙渊","觉醒技，准备阶段，若你本局游戏内发动过至少三次〖翊赞〗，你修改〖翊赞〗为只需一张牌。",["觉醒技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"赵襄","t":"拾梅鹊影","k":"蜀","kh":4,"mh":4,"g":"女","s":[["芳魂","你每回合首次使用基本牌后，获得1个“梅影”标记；你可以移去1个“梅影”标记，发动〖龙胆〗并摸一张牌。",[]],["扶汉","锁定技，游戏开始时，你将五张未登场蜀势力武将牌置于你的武将牌上。其他蜀势力角色阵亡后或你的首个准备阶段，你加1点体力上限并选择这些武将牌上的一个技能获得。准备阶段，若你是唯一存活蜀势力角色，你摸X张牌（X为你因此获得过的技能数）。",["锁定技"]],["龙胆","你可以将一张【杀】当【闪】、【闪】当【杀】使用或打出，然后若你本回合未造成过伤害，你摸一张牌。 ⬤　二级：你可以将一张基本牌当任意本回合未以此法转化过的基本牌使用或打出，然后你摸一张牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"周群","t":"后圣","k":"蜀","kh":3,"mh":3,"g":"男","s":[["天算","每轮限一次，出牌阶段，你可以抽取一个“命运签”（在抽签开始前，你可以悄悄作弊，额外放入一个“命运签”增加其抽中的机会）。 然后你选择一名角色，其获得命运签的效果直到你的下回合开始。 若其获得的是“上上签”，你观看其手牌并从其区域内获得一张牌；若其获得的是“上签”，你从其处获得一张牌。 各种“命运签”的效果如下： 上上签：防止受到的伤害。 上签：受到伤害时，若伤害值大于1，则将伤害值改为1；每受到一点伤害后，你摸一张牌。 中签：受到伤害时，将伤害改为火焰伤害，若此伤害值大于1，则将伤害值改为1。 下签：受到伤害时，伤害值+1。 下下签：受到伤害时，伤害值+1；不能使用【桃】和【酒】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"诸葛果","t":"凤阁乘烟","k":"蜀","kh":3,"mh":3,"g":"女","s":[["祈禳","当装备牌置入你的装备区后，你可以从牌堆随机获得一张锦囊牌，你使用此锦囊牌时无距离限制并摸一张牌。",[]],["羽化","锁定技，你的非基本牌不计入手牌上限；结束阶段，若你手牌数大于体力值，你观看牌堆顶X张牌（X为你手牌类别数），将其中任意数量的牌置于牌堆顶，其余的牌置于牌堆底。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"好学吕蒙","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["好学","锁定技，你于：出牌阶段外弃置牌时，失去1点体力；出牌阶段内获得牌时，回复1点体力。",["锁定技"]],["穷涉","若以下值为质数，你可以于对应时机亮出牌堆顶的八张牌，获得其中点数为质数的牌：手牌数，摸牌阶段开始时；因此获得牌数，出牌阶段；体力值，弃牌阶段结束时。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"贺齐","t":"马踏群峦","k":"吴","kh":4,"mh":4,"g":"男","s":[["绮胄","锁定技，你根据装备区里牌的花色数获得以下技能：1种以上-〖英姿〗；2种以上-〖奇袭〗；3种以上-〖旋风〗。",["锁定技"]],["闪袭","出牌阶段开始时，你可以弃置一张红色基本牌并指定一名其他角色，将其至多X张牌置于其武将牌上（X为你的体力值），本回合结束时其获得之。",[]],["英姿","摸牌阶段，你可以多摸一张牌。",["衍生技"]],["奇袭","你可以将一张黑色牌当【过河拆桥】使用。",["衍生技"]],["旋风","当你失去装备区里的牌后，或弃牌阶段结束时，若你于此阶段内弃置过你的至少两张手牌，你可以依次弃置至多两名其他角色共计两张牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"疆陆抗","t":"","k":"吴","kh":3,"mh":3,"g":"男","s":[["备戎","每回合限一次，你可以将手牌数调整至当前体力值或体力上限，视为使用一张基本牌，然后你本回合下次使用基本牌时，将手牌数调整至未选择的一项，且若此牌与你之前使用的牌牌名相同，此牌数值+1。",[]],["临疆","若敌方疆羊祜在场，你发动〖备戎〗将手牌调整至未选择的一项后，可以令一名角色视为使用一张【酒】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"蒋钦", kh":3,"mh":3,"g":"男","s":[["好施","结束阶段，你可以选择一名其他角色，直到你的下个回合开始，其可以如手牌般使用或打出你的手牌。当你于此期间前两次因此失去最后的手牌时，你将手牌摸至三张。",[]],["缔盟","出牌阶段限一次，你可以令两名手牌数之差不大于3的角色交换手牌，然后你选择一项：1.弃置X张牌（不足则全弃）；2.交换后手牌数较少的角色摸X张牌（X为你已损失体力值）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势陆郁生","t":"义姑","k":"吴","kh":3,"mh":3,"g":"女","s":[["润微","出牌阶段限一次，你可以展示牌堆顶至多五张牌，令一名角色获得其中一种颜色的所有牌。若如此做：1.每阶段限一次，你失去X张牌后（X为其因此获得的牌数），该技能可以再次发动且不能指定本回合获得过牌的角色为目标；2.本阶段结束时，你弃置以此法获得的手牌。",[]],["霜怀","每回合限一次，当与你距离1以内的其他角色受到伤害时，你可以选择一项：1.防止此伤害；2.令其从弃牌堆中获得一张【桃】。若该角色与你上一次发动时：相同，你与其各摸一张牌；不同，你失去1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势孙綝","t":"蝮影权倾","k":"吴","kh":4,"mh":4,"g":"男","s":[["逆固","出牌阶段限一次，你可以弃置至少一张花色不同的牌，令攻击范围内的角色同时选择是否交给你一张牌，然后你本回合造成的下X次伤害+1（X为选择不交给你牌的角色数）。",[]],["戮连","锁定技，当你使用手牌结算结束后，若你没有此类别的手牌，且有目标角色：体力值小于等于你，此牌的所有目标横置；装备区牌数小于等于你，你摸一张牌。乘势：你对一名体力值不为最小的角色造成1点火焰伤害。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势孙峻","t":"横逆自固","k":"吴","kh":3,"mh":3,"g":"男","s":[["凶图","出牌阶段限一次，你可以展示一名其他角色的一张手牌并选择一项：1.弃置此牌；2.弃置X张牌并对其造成1点伤害（X为本回合未进入过弃牌堆的花色数）。若如此做，本回合此后当你不因此技能造成伤害后，你摸一张牌，且此技能本阶段改为限两次。",[]],["先率","锁定技，你于回合内使用手牌中每个花色的首张牌不计入次数限制且无次数限制。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势太史慈","t":"志踏天阶","k":"吴","kh":4,"mh":4,"g":"男","s":[["酣战","出牌阶段限一次，你可以选择一名其他角色，你与其分别将手牌摸至X张（X为各自体力上限，且每名角色至多摸三张），然后视为你对其使用一张【决斗】。",[]],["战烈","一名角色的回合开始时，你记录X（X为此时你的攻击范围）。本回合中的前X张【杀】进入弃牌堆后，若此牌在弃牌堆内，你获得1枚“烈”标记（你至多拥有6枚“烈”标记）；出牌阶段结束时，你可以移除所有“烈”标记，视为使用一张无次数限制的【杀】，并选择至多Y项（Y为你本次移除的标记数/3，向下取整）：1.此【杀】目标+1；2.此【杀】伤害基数+1；3.此【杀】需目标角色额外弃置一张牌方可响应；4.此【杀】结算结束后你摸两张牌。",[]],["振锋","限定技，出牌阶段，你可以选择一项：1.回复2点体力；2.分别修改〖酣战〗及〖战烈〗中的X为当前体力值、已损失体力值、存活角色数中的一项（拥有对应技能方可选择）。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势小乔","t":"衷音慰徨","k":"吴","kh":3,"mh":3,"g":"女","s":[["合韵","出牌阶段限两次，你可以选择一名与你有相同技能的角色，然后你失去一个技能并令其摸两张牌。",[]],["音洄","每轮开始时，你可以清除因此获得的技能，然后你选择一名其他角色当前拥有的一个技能获得之。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势周瑜","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["炽沄","当你每阶段首次获得牌后，可以交给一名其他角色至少一张手牌，其选择一项：1.展示所有与这些牌颜色相同的手牌，你对其造成1点火焰伤害；2.你摸两张牌，其横置。",[]],["焰洄","当你使用牌指定第一个目标后，你可展示一名目标角色的一张手牌，若此牌本回合已被展示过，你弃置之。若如此做，此阶段结束时，你选择一项：1.对一名本阶段因此弃置过牌的角色造成1点火焰伤害；2.摸X张牌（X为本回合展示过牌的角色数）。",[]],["焚涛","锁定技，当处于连环状态的其他角色受到火焰伤害时，其选择一项：1.此次传导中的伤害+1；2.弃置一半数量的牌（向上取整），此伤害结算后其横置。",["锁定技"]],["雄姿","限定技，准备阶段，你可以令本局游戏你的〖炽沄〗、〖焰洄〗和〖焚涛〗只能在你的回合内发动，仅保留其中全部的一选项或二选项，并摸两张牌。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"苏飞","t":"诤友投明","k":"吴","kh":4,"mh":4,"g":"男","s":[["诤荐","锁定技，结束阶段，你令一名角色获得“诤荐”标记，然后其于你的下个回合开始时摸X张牌并移去“诤荐”标记（X为其此期间使用或打出牌的数量且至多为其体力上限且至多为5）。",["锁定技"]],["告援","当你成为一名角色使用【杀】的目标时，你可以弃置一张牌，将此【杀】转移给另一名有“诤荐”标记的其他角色。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"孙皓","t":"时日曷丧","k":"吴","kh":5,"mh":5,"g":"男","s":[["残蚀","摸牌阶段，你可以改为摸X张牌（X为已受伤的角色数），然后当你本回合内使用基本牌或普通锦囊牌时，你弃置一张牌。",[]],["仇海","锁定技，当你受到伤害时，若你没有手牌，你令此伤害+1。",["锁定技"]],["归命","主公技，锁定技，其他吴势力角色于你的摸牌阶段视为已受伤的角色。",["主公技","锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"孙鲁育","t":"舍身饲虎","k":"吴","kh":3,"mh":3,"g":"女","s":[["魅步","其他角色的出牌阶段开始时，若你在其攻击范围内，你可以弃置一张牌，然后其本回合视为拥有技能〖止息〗。若你以此法弃置的牌不是【杀】或黑色锦囊牌，则本回合其与你距离为1。",[]],["穆穆","出牌阶段开始时，你可以选择一项：弃置场上一张装备牌；获得场上一张防具牌，然后你本回合不能使用或打出【杀】。",[]],["止息","锁定技，出牌阶段，你至多使用X张牌（X为你的体力值）。你使用锦囊牌后，结束出牌阶段。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"孙茹","t":"出水青莲","k":"吴","kh":3,"mh":3,"g":"女","s":[["影箭","准备阶段，你可以视为使用一张无距离限制的【杀】。",[]],["释衅","锁定技，防止你受到的火属性伤害。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"孙邵","t":"创基抉政","k":"吴","kh":3,"mh":3,"g":"男","s":[["定仪","锁定技，游戏开始时，你选择一项，令任意名角色获得对应效果：1.摸牌阶段摸牌数+1；2.手牌上限+2；3.攻击范围+1；4.脱离濒死状态时回复1点体力。",["锁定技"]],["罪辞","每回合限一次，你受到伤害后，可以令一名有“定仪”效果的角色从牌堆中获得一张你选择的智囊牌，然后移去其“定仪”效果。",[]],["辅弼","出牌阶段限一次，你可以选择一名角色并选择一项：1.令其获得一个其未拥有的“定仪”效果；2.令其全部“定仪”效果翻倍直到你的下个出牌阶段开始。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"孙韶","t":"明敌御疆","k":"吴","kh":4,"mh":4,"g":"男","s":[["敢决","出牌阶段限一次，你可以将一张装备区的牌当不计入次数且无距离次数限制的【杀】使用，若目标角色没有与此【杀】花色相同的手牌，其不可响应此【杀】。",[]],["筑墼","出牌阶段结束时，你可以选择一张手牌，弃置与之花色相同的所有手牌，然后获得并使用牌堆中一张该花色的装备牌。若你弃置的牌数不小于你使用此装备前装备区的牌数，你选择一项：1.摸两张牌；2.回复1点体力；3.获得1点护甲。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"孙翊","t":"骁悍激躁","k":"吴","kh":4,"mh":4,"g":"男","s":[["躁厉","锁定技，出牌阶段，你不能使用或打出非本回合获得的手牌。当你使用或打出手牌时，若你的“厉”标记数小于4，你获得1个“厉”标记。回合开始时，若你有“厉”标记，你移去所有“厉”标记并弃置任意张牌（至少弃置一张牌），然后摸X张牌（X为你移去的“厉”标记数与弃置牌数之和）。若你移去的“厉”标记数大于2，你失去1点体力。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"卫温诸葛直","t":"帆至夷洲","k":"吴","kh":4,"mh":4,"g":"男","s":[["浮海","出牌阶段限一次，你可以令所有其他角色同时选择“潮起”或“潮落”，然后你摸X张牌（X为从你的下家开始连续选择相同的角色数）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"吴景","t":"助吴征战","k":"吴","kh":4,"mh":4,"g":"男","s":[["合击","当一名角色使用以唯一其他角色为目标的【决斗】或红色【杀】结算后，你可以从手牌中对相同目标使用一张无距离次数限制的【杀】或【决斗】。若你使用的不为转化牌，你使用此牌时随机获得一张红色牌。",[]],["流兵","锁定技，你每回合使用的第一张非虚拟的【杀】的花色视为♦。其他角色于其出牌阶段内使用的非转化黑色【杀】结算后，若未造成过伤害，你获得之。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"吴珂","t":"智略权谲","k":"吴","kh":3,"mh":3,"g":"女","s":[["谙达","每轮限一次，当一名角色进入濒死状态时，你可以令伤害来源选择一项：1.交给其两张颜色不同的牌；2.该角色回复1点体力。",[]],["助国","出牌阶段限一次，你可以令一名角色将手牌调整至X张（X为其体力上限，至多为5）。然后若其：没有摸牌，其回复1点体力；因此摸牌且手牌数全场最多，你可以选择另一名角色，令其选择是否对此角色使用一张无距离次数限制的【杀】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-界一将成名","n":"薛综","t":"彬彬之玊","k":"吴","kh":3,"mh":3,"g":"男","s":[["复难","其他角色使用或打出牌响应你使用的牌时，你可以获得其使用或打出的牌。\n⬤　二级：其他角色使用或打出牌响应你使用的牌时，你可以获得其使用或打出的牌；你使用以此法获得的牌结算结束后，若没有其他角色响应此牌，你摸一张牌。",[]],["诫训","结束阶段，你可以选择一种花色，令一名其他角色摸等同于场上此花色牌数的牌（至多5张），然后其弃置X张牌（X为本技能发动次数），若其因此弃置了所有手牌，你升级〖复难〗。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"许贡","t":"独计击流","k":"吴","kh":3,"mh":3,"g":"男","s":[["表召","结束阶段，你可以将一张牌扣置于武将牌上，称为“表”。当一张与“表”点数相同的牌进入弃牌堆时，你移去“表”并失去1点体力。准备阶段，你移去“表”，然后令一名角色回复1点体力并摸三张牌。",[]],["业仇","你死亡时，你可以选择一名已损失的体力值大于1的角色。若如此做，每名角色的结束阶段，其失去1点体力，直到其下回合开始。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘孙权","t":"逍遥津战神","k":"吴","kh":4,"mh":4,"g":"男","s":[["势众","锁定技，结束阶段，你摸一张牌并展示所有手牌；准备阶段，你摸X张牌（X为你手牌中剩余上次因“势众”展示的牌），若X与你上次展示的牌数相等，则当你本回合造成伤害时，将伤害值改为十万！",["锁定技"]],["操微","锁定技，当你受到伤害后，你重铸至少一种类别的所有牌并摸一张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"张布","t":"主胜辅义","k":"吴","kh":4,"mh":4,"g":"男","s":[["惩凶","当你使用锦囊牌仅指定其他角色为目标后，你可以选择一名牌数不小于X的角色（X为你此阶段使用的牌数），弃置其一张牌，若此牌颜色与你使用的锦囊牌颜色相同，你对其造成1点伤害。",[]],["妄专","当一名角色受到非游戏牌造成的伤害后，若你是伤害来源或受伤角色，你可以摸一张牌，然后当前回合角色本回合非锁定技失效。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"张奋","t":"究械菁杰","k":"吴","kh":4,"mh":4,"g":"男","s":[["渠冲","出牌阶段，你可以重铸一张装备牌；每个回合结束时，你将弃牌堆中的装备牌移出游戏并获得等量铸造值；出牌阶段开始时，若场上没有【大攻车】（【大攻车·进击】、【大攻车·守御】），则你可按铸造的次数以0、5、10、10点铸造值（若为2v2或斗地主模式，则改为0、2、5、5）选择一种大攻车并将之交给一名角色令其使用；否则你可以将场上的【大攻车】交给另一名角色并令其使用。",[]],["逊节","锁定技，当你受到伤害时，若场上没有【大攻车·进击】或【大攻车·守御】，且伤害来源的体力值大于你，你进行判定，若结果为红色，则此伤害-1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"张温","t":"抱德炀和","k":"吴","kh":3,"mh":3,"g":"男","s":[["戈帛","锁定技，一名角色回复体力后，你从牌堆顶将一张牌置于“仁”区中。",["锁定技"]],["颂蜀","一名体力值大于你的其他角色摸牌阶段开始时，若“仁”区有牌，你可以令其放弃摸牌，改为获得X张“仁”区牌（X为你的体力值，且最大为5）。若如此做，本回合其使用牌时不能指定其他角色为目标。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"周处","t":"英情天逸","k":"吴","kh":4,"mh":4,"g":"男","s":[["乡害","锁定技，其他角色的手牌上限-1，你手牌中的装备牌均视为【酒】。",["锁定技"]],["除害","使命技，出牌阶段限一次，你可以摸一张牌，并与一名其他角色拼点，此次你的拼点牌点数增加X（X为4减去你装备区的装备数量）。若你赢：你观看其手牌，从牌堆或弃牌堆随机获得其手牌中拥有的类别牌各一张；你于此阶段对其造成伤害后，将牌堆或弃牌堆中一张你空置装备栏对应类型的装备牌，置入你对应的装备区。 ⬤　成功：当一张装备牌进入你的装备区后，若你的装备区有不少于3张装备，则你将体力值回复至上限，获得〖彰名〗，失去〖乡害〗。 ⬤　失败：若你于使命达成前，你使用〖除害〗拼点没赢，且你的拼点结果不大于6点，则使命失败。",["使命技"]],["彰名","锁定技，你使用♣牌不能被响应。每回合限一次，你对其他角色造成伤害后，其随机弃置一张手牌，然后你从牌堆或弃牌堆中获得与其弃置牌类型不同的牌各一张（若其无法弃置手牌，改为你从牌堆或弃牌堆获得所有类型牌各一张），以此法获得的牌不计入本回合手牌上限。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"诸葛恪","t":"兴家赤族","k":"吴","kh":3,"mh":3,"g":"男","s":[["傲才","当你于回合外需要使用或打出一张基本牌时，你可以观看牌堆顶的两张牌，使用或打出其中你需要的牌。",[]],["黩武","出牌阶段，你可以弃置X张牌，对你攻击范围内的一名其他角色造成1点伤害（X为该角色的体力值）。若其因此进入濒死状态，则濒死状态结算后你失去1点体力，且此技能本回合失效。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"朱绩","t":"克绍箕裘","k":"吴","kh":4,"mh":4,"g":"男","s":[["竭逐","每回合限一次，你可以将手牌弃置至与你当前手牌数最接近且场上没有的更低值，视为使用一张指定至多X名角色为目标，无距离限制的【杀】（X为弃置牌数）。此【杀】结算结束后，若此【杀】目标数为X且对所有目标造成伤害，你将手牌摸至与你当前手牌数最接近且场上没有的更高值。",[]],["还施","使命技，你每回合使用首张【杀】伤害+1；你于非濒死状态时无法使用但可重铸【酒】。 成功：当你造成或受到伤害后，若伤害值等于你的体力值，你获得技能〖兼虑〗。",["使命技"]],["兼虑","当你一次性弃置至少X张牌后（X为你发动过本技能的次数+1），你可以对一名其他角色造成1点伤害。然后若其死亡，你选择一项：1.令本技能视为未发动过；2.对一名其他角色造成1点伤害。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"鲍信","t":"坚朴的忠相","k":"群","kh":4,"mh":4,"g":"男","s":[["募讨","出牌阶段限一次，你可以选择一名角色，令其将手牌中所有的【杀】置于其武将牌上，然后其依次将这些【杀】随机交给由其下家开始的每一名角色，然后其对最后一名角色造成X点伤害（X为最后一名角色手牌中【杀】的数量且至多为2）。",[]],["毅谋","当至你距离1以内的角色受到伤害后，你可以选择一项：1.令其从牌堆获得一张【杀】；2.令其将一张手牌交给另一名角色，摸一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"曹操","t":"峥嵘而立","k":"群","kh":4,"mh":4,"g":"男","s":[["令法","每轮开始时，若当前轮数不大于2，你可令第X项效果本轮对所有其他角色生效（X为当前轮数）：1.使用【杀】时，其需弃置一张牌，否则你对其造成1点伤害；2.使用【桃】结算结束后，其需交给你一张牌，否则你对其造成1点伤害。若当前轮数大于2，则你失去此技能，获得〖治暗〗和〖奸雄〗。",[]],["治暗","每回合限一次，当一名其他角色使用装备牌或延时锦囊牌结算结束后，你可选择一项：1. 从场上弃置此牌；2. 弃置一张手牌，获得此牌；3. 对其造成1点伤害。",["衍生技"]],["奸雄","当你受到伤害后，你可以获得对你造成伤害的牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"彻里吉","t":"北境寒锋","k":"群","kh":4,"mh":4,"g":"男","s":[["驱乘","锁定技，你使用【杀】无距离限制，且不因此技能使用的【杀】只能指定上家/下家为目标。当你使用指定唯一目标的【杀】结算后，若此【杀】目标角色的上家/下家不是你且未造成伤害，此【杀】不计入次数，然后你视为对其上家/下家使用一张普通【杀】。",["锁定技"]],["羌勇","锁定技，你使用【杀】造成伤害时，弃置受伤角色的X张牌（X为你本回合使用【杀】的次数），然后若其没有手牌，此【杀】伤害+1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"陈登","t":"雄气壮节","k":"群","kh":3,"mh":3,"g":"男","s":[["周旋","出牌阶段限一次，你可以选择一名其他角色并选择一种非基本牌的类型或一种基本牌的牌名。若该角色之后使用或打出的第一张牌与你的选择相同，你观看牌堆顶的三张牌，并分配给任意角色。",[]],["丰积","锁定技，回合开始时，若你的手牌数不小于你上个回合结束后的数量，你摸三张牌且你本回合手牌上限等于你的体力上限。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"陈珪","t":"弄辞巧掇","k":"群","kh":3,"mh":3,"g":"男","s":[["诡谋","锁定技，游戏开始时你随机选择一项，或回合结束时你选择一项：直到你的下个准备阶段，1.记录使用牌最少的其他角色；2.记录弃置牌最少的其他角色；3.记录获得牌最少的其他角色。准备阶段，你选择被记录的一名角色，观看其手牌并可选择其中一张牌，弃置此牌或将此牌交给另一名其他角色。",["锁定技"]],["州贤","锁定技，当你成为其他角色使用伤害牌的目标时，你亮出牌堆顶三张牌，然后其须弃置一张亮出牌中含有的一种类别的牌，否则取消此目标。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"丁原","t":"饲虎成患","k":"群","kh":4,"mh":4,"g":"男","s":[["备诛","出牌阶段限一次，你可以观看一名其他角色的手牌。若其中有【杀】，则其对你依次使用这些【杀】（当你受到因此使用的【杀】造成的伤害后，你摸一张牌），否则你弃置其一张牌并可以令其从牌堆中获得一张【杀】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"董白","t":"魔姬","k":"群","kh":3,"mh":3,"g":"女","s":[["连诛","出牌阶段限一次，你可以展示一张牌并交给一名其他角色。你本阶段对有此牌的角色使用牌无距离次数限制，且对其造成伤害后可以获得此牌。 一名其他角色于本阶段内获得此牌后，其选择一项：1.交给你一张此牌以外的牌，然后将此牌交给其上家；2.令你摸两张牌。",[]],["黠慧","锁定技，你的黑色牌不计入手牌上限；其他角色获得“连诛”牌或你的黑色牌时，其不能使用、打出、弃置这些牌直到其体力值减少。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"董承","t":"沥胆卫汉","k":"群","kh":4,"mh":4,"g":"男","s":[["承诏","一名角色的结束阶段，若你本回合获得过至少两张牌，你可以与一名其他角色拼点，若你赢，视为你对其使用一张无视防具的【杀】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"杜预","t":"文成武德",
