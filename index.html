“生”，摸X+1张牌，然后将X张牌置于你的武将牌上，称为“生”（X为你〖邀虎〗选择势力的角色数）。",["锁定技"]],["邀虎","每轮限一次，你的回合开始时，你须选择场上一个势力。此势力的其他角色出牌阶段开始时，其获得你的一张“生”，然后其须选择一项：1.对你指定的一名其攻击范围内的其他角色使用一张不计入次数的【杀】；2.本阶段其使用伤害类牌指定你为目标时，须交给你两张牌，否则取消之。",[]],["怀璧","主公技，锁定技，你的手牌上限+X（X为你〖邀虎〗选择势力的角色数）。",["主公技","锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"马日磾","t":"少传融业","k":"群","kh":3,"mh":3,"g":"男","s":[["承业","锁定技，当其他角色使用一张非转化牌结算结束后，或一张其他角色区域内的装备牌或延时锦囊牌进入弃牌堆后，若你对应的“六经”处于缺失状态，你将此牌置于你的武将牌上，称为“典”；出牌阶段开始时，若你没有“六经”处于缺失状态，你获得所有“典”。",["锁定技"]],["补续","出牌阶段，若你拥有技能〖承业〗，你可以弃置X张牌并选择一种你缺失的“六经”，然后从牌堆或弃牌堆中随机获得一张对应此“六经”的牌加入“典”中（X为你本阶段此前成功发动过此技能的次数+1）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"马元义","t":"黄天擎炬","k":"群","kh":4,"mh":4,"g":"男","s":[["集兵","摸牌阶段开始时，若你的“兵”数少于X（X为场上势力数），你可以放弃摸牌，改为将牌堆顶两张牌置于你的武将牌上，称为“兵”。你可以将一张“兵”当做普通【杀】或【闪】使用或打出。",[]],["往京","锁定技，当你发动〖集兵〗使用或打出一张“兵”时，若对方是场上体力值最高的角色，你摸一张牌。",["锁定技"]],["谋篡","觉醒技，准备阶段，若你的“兵”数不少于X张（X为场上势力数），你减少1点体力值上限，然后获得技能〖兵祸〗。",["觉醒技"]],["兵祸","一名角色结束阶段，若你本回合发动〖集兵〗使用或打出过“兵”，你可以令一名角色判定，若结果为黑色，你对其造成1点雷电伤害。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"孟达","t":"求栖梧桐","k":"群","kh":4,"mh":4,"g":"男","s":[["积戾","其他角色的回合开始时，若其在你的攻击范围内，你可以秘密选择0~2中一个你本轮未选择过的数字。若如此做，本回合的结束阶段，若其本回合使用牌指定你为目标的次数：小于X，你摸4-X张牌；等于X，你交给其X张牌；大于X，你可以视为对其使用一张无距离限制的【杀】（X为你本次选择的数字）。",[]],["恃术","锁定技，其他角色于其回合内获得你的牌后，你令其选择一项：1.弃置这些牌；2.交给你一张与这些牌类别均不相同的牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"祢衡","t":"鸷鹗啄孤凤","k":"群","kh":3,"mh":3,"g":"男","s":[["狂才","出牌阶段开始时，你可以令你此阶段内的主动出牌时间变为5秒。若如此做，本阶段你使用牌无距离次数限制，且当你使用牌时，你摸一张牌且主动出牌时间-1秒（每阶段至多以此法摸五张牌）。",[]],["舌剑","弃牌阶段结束时，若你本阶段弃置过至少两张牌且花色均不相同，你可以弃置一名其他角色一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋陈宫","t":"刚直壮烈","k":"群","kh":3,"mh":3,"g":"男","s":[["明策","①出牌阶段限一次，你可以交给一名其他角色一张牌，令其选择一项：1.失去1点体力，令你摸两张牌并获得1个“策”标记；2.摸一张牌。 ②出牌阶段开始时，若你拥有“策”标记，你可以选择一名其他角色，对其造成X点伤害并移去所有“策”标记（X为你的“策”标记数）。",[]],["智迟","锁定技，当你受到伤害后，防止本回合你受到的伤害。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋貂蝉","t":"绝世的舞姬","k":"群","kh":3,"mh":3,"g":"女","s":[["离间","出牌阶段限一次，你可以选择至少两名其他角色并弃置X张牌（X为你选择的角色数-1），然后他们依次对逆时针最近座次的你选择的另一名角色视为使用一张【决斗】。",[]],["闭月","锁定技，结束阶段，你摸X张牌（X为本回合受到过伤害的角色数+1，至多为4）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋高顺","t":"攻无不克","k":"群","kh":4,"mh":4,"g":"男","s":[["陷阵","出牌阶段限一次，你可以选择一名其他角色（若为身份模式，则改为一名体力值小于你的其他角色）。本阶段内你对其使用牌无距离限制，且当你使用【杀】指定其为目标后，你可以与其拼点。若你赢，则你对其造成1点伤害（每回合限一次），然后此【杀】无视防具、不计入次数；若其拼点牌为【杀】，则你获得之。",[]],["禁酒","锁定技，你的【酒】均视为【杀】；当你受到【酒】【杀】造成的伤害时，此伤害改为1；你的回合内，其他角色不能使用【酒】；当与你拼点的角色拼点牌亮出后，若此牌为【酒】，则此牌的点数视为1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋公孙瓒","t":"劲震幽土","k":"群","kh":4,"mh":4,"g":"男","s":[["义从","蓄力技（2/4），每轮开始时，你可以消耗至少一点蓄力点并选择一项：1.令你本轮计算与其他角色的距离-1，并将牌堆中的X张【杀】置于你的武将牌上，称为“扈”；2.令其他角色本轮计算与你的距离+1，并将牌堆中X张【闪】置于你的武将牌上，称为“扈”（X为你以此法消耗的蓄力点数）。你至多拥有四张“扈”且你可将“扈”如手牌般使用或打出。",["蓄力技"]],["趫猛","当你使用【杀】对一名角色造成伤害后，若你拥有技能“义从”，你可以选择一项：1.弃置其区域内的一张牌并摸一张牌；2.获得3点蓄力点。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋华雄","t":"跋扈雄狮","k":"群","kh":3,"mh":4,"g":"男","s":[["耀武","锁定技，当你受到【杀】造成的伤害时，若此【杀】：为红色，伤害来源选择回复1点体力或摸一张牌；不为红色，你摸一张牌。",["锁定技"]],["扬威","出牌阶段限一次，你可以摸两张牌且本阶段获得“威”标记，然后此技能失效直到下个回合的结束阶段。 “威”标记效果：使用【杀】的次数上限+1、使用【杀】无距离限制且无视防具牌。",[]]],"r":[],"ar":1},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋贾诩","t":"计深似海","k":"群","kh":3,"mh":3,"g":"男","s":[["完杀","①你的回合内，若有角色处于濒死状态，则不处于濒死状态的其他角色不能使用【桃】。 ②每轮限一次，一名角色进入濒死状态时，你可以观看其手牌并秘密选择其中的0~2张牌，然后令其选择一项：1.由你将被选择的牌分配给除其以外的角色；2.弃置所有未被选择的牌。 二级：“选择其手牌”修改为“选择其区域内牌”。",[]],["帷幕","锁定技，当你成为黑色锦囊牌的目标时，取消之。 二级：增加内容：每轮开始时，若你上一轮成为其他角色使用牌的目标的次数不大于1次，则你从弃牌堆随机获得一张黑色锦囊牌或者防具牌。",["锁定技"]],["乱武","限定技，出牌阶段，你可以令所有其他角色依次选择一项：1.对距离最近的另一名其他角色使用一张【杀】；2.失去1点体力。每有一名角色因此失去体力时，你可以升级“完杀”或者“帷幕”（每个技能各限升级一次）。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋刘表","t":"跨蹈汉南","k":"群","kh":3,"mh":3,"g":"男","s":[["自守","锁定技，其他角色的结束阶段，若本局游戏你与其均未对另一方造成过伤害，其交给你一张牌。",["锁定技"]],["宗室","锁定技，当你受到伤害后，伤害来源弃置所有手牌（每名角色限一次）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋刘赪","t":"泣梧的湘女","k":"群","kh":3,"mh":3,"g":"女","s":[["掠影","你使用【杀】结算结束后，若你拥有至少两个“椎”标记，则你移除两个“椎”标记，然后摸一张牌，且可以选择一名角色视为对其使用一张【过河拆桥】。每阶段限两次，当你于出牌阶段内使用【杀】指定一个目标后，你获得一个“椎”标记。",[]],["莺舞","你使用非伤害类普通锦囊结算结束后，若你拥有至少两个“椎”标记，则你移除两个“椎”标记，然后摸一张牌，且可以选择一名角色视为对其使用一张【杀】（计入次数，无次数限制）。每阶段限两次，当你于出牌阶段内使用非伤害类普通锦囊指定一个目标后，若你拥有技能〖掠影〗，则你获得一个“椎”标记。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋卢植","t":"国之桢干","k":"群","kh":3,"mh":3,"g":"男","s":[["明任","①游戏开始时，你摸两张牌，然后将一张手牌置于你的武将牌上，称为“任”；②结束阶段，你可以用任意一张手牌替换“任”。",[]],["贞良","转换技，阳：出牌阶段限一次，你可以选择一名你攻击范围内的其他角色并弃置X张与“任”颜色相同的牌（X为你与其体力值之差且至少为1），然后对其造成1点伤害； 阴：你的回合外，当一名角色使用或打出牌结算结束后，若此牌与“任”类别相同，你可以令一名角色摸两张牌。",["转换技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋吕布","t":"宇内无双","k":"群","kh":5,"mh":5,"g":"男","s":[["无双","锁定技，你使用的【杀】需两张【闪】才能抵消；与你进行【决斗】的角色每次需打出两张【杀】。每回合限一次，若对方没有使用或打出【杀】或【闪】，则此【杀】或【决斗】对其造成的伤害+1。",["锁定技"]],["利驭","当你使用【杀】对其他角色造成伤害后，你可以获得其区域里至多等同于伤害数张牌，然后其摸等量张牌。若你与其共因此获得了全部类别的牌，其选择一项：1.令你视为对由其指定的另一名其他角色使用一张【决斗】；2.其获得技能〖无双〗直到其下个回合结束。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋杨婉","t":"迷计惑心","k":"群","kh":3,"mh":3,"g":"女","s":[["暝眩","锁定技，出牌阶段开始时，若你有牌且有未被本技能记录的其他角色，你须选择X张花色各不相同的手牌，交给这些角色中随机X名角色各一张牌（X最大为这些角色数且至少为1)。然后依次令交给牌角色选择：1. 对你使用一张【杀】，然后你记录该角色；2. 交给你一张牌，然后你摸一张牌。",["锁定技"]],["陷仇","当你受到伤害后，可以选择一名除来源外的其他角色，该角色可以弃置一张牌，视为对来源使用普【杀】。若此【杀】造成过伤害，则该角色摸一张牌，你回复1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋袁绍","t":"高贵的名门","k":"群","kh":4,"mh":4,"g":"男","s":[["乱击","出牌阶段限一次，你可以将两张手牌当【万箭齐发】使用；当其他角色打出【闪】响应你使用的【万箭齐发】时，你摸一张牌（每回合你以此法至多获得三张牌）。",[]],["血裔","主公技，锁定技，你的手牌上限+2X（X为其他群势力角色数）；当你使用牌指定其他群势力角色为目标后，你摸一张牌（每回合你以此法至多获得两张牌）。",["主公技","锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-谋攻篇","n":"谋张角","t":"驱雷掣电","k":"群","kh":3,"mh":3,"g":"男","s":[["雷击","出牌阶段，你可以移去4个“道兵”标记，对一名其他角色造成1点雷电伤害。",[]],["鬼道","①游戏开始时，你获得2个“道兵”标记（你至多拥有8个“道兵”标记）； ②当一名角色受到属性伤害后，你获得1个“道兵”标记（若不为身份模式改为2个）； ③当你受到伤害时，你可以移去2个“道兵”标记，防止此伤害，若此时为你回合外，你不能以此法获得“道兵”标记直到你的下个回合开始。",[]],["黄天","主公技，锁定技，①第一轮的你的回合开始时，你将游戏外的【太平要术】置入装备区； ②当其他群势力角色造成伤害后，若你拥有技能〖鬼道〗，你获得2个“道兵”标记（每轮你至多以此法获得4个标记）。",["主公技","锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"木鹿大王","t":"八纳洞主","k":"群","kh":3,"mh":3,"g":"男","s":[["兽法","当你每回合首次造成伤害后，你可以选择你距离2以内的一名角色；每回合限五次，当你受到伤害后，你可以选择与你距离大于1的一名角色（若为斗地主，则上述距离改为你距离1以内和与你距离不小于1），其随机执行一种效果： 豹，其受到1点无来源伤害； 鹰，你随机获得其一张牌； 熊，你随机弃置其装备区里的一张牌； 兔，其摸一张牌。",[]],["咒鳞","限定技，出牌阶段，若你有〖兽法〗，则你可以获得2点护甲并选择一种野兽效果，令你直到你的下个回合开始，“兽法”必定执行此野兽效果。",["限定技"]],["御象","锁定技，若你有护甲：你计算与其他角色的距离-1；其他角色计算与你的距离+1；当你受到火焰伤害时，此伤害+1。",["锁定技"]]],"r":[],"ar":1},{"p":"手杀","sp":"手杀-稀有专属","n":"南华老仙","t":"冯虚御风","k":"群","kh":3,"mh":3,"g":"男","s":[["御风","出牌阶段限一次，你可以进行一次御风飞行。若失败你摸X张牌；若成功，你可以选择至多X名其他角色，其下一个准备阶段进行一次判定：若结果为黑色，其跳过本回合的出牌和弃牌阶段；若结果为红色，其跳过本回合的摸牌阶段（若选择角色数不足X，剩余的分数改为摸等量张牌，X为御风飞行得分）。",[]],["天书","出牌阶段开始时，若【太平要术】不在游戏内、在牌堆或弃牌堆中，你可以弃置一张牌，令一名角色获得【太平要术】并使用之。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"庞德公","t":"德懿举世","k":"群","kh":3,"mh":3,"g":"男","s":[["评才","出牌阶段限一次，你可以挑选一个宝物，擦拭掉上面的灰尘。如果擦拭成功，你可以根据宝物类型执行对应的效果： 卧龙：对一名角色造成1点火焰伤害。若场上有存活的卧龙诸葛亮，则改为对至多两名角色各造成1点火焰伤害。 凤雏：横置至多三名角色的武将牌。若场上有存活的庞统，则改为横置至多四名角色的武将牌。 水镜：移动场上的一张防具牌。若场上有存活的司马徽，则改为移动场上的一张装备牌。 玄剑：令一名角色摸一张牌并回复1点体力。若场上有存活的徐庶，则改为令一名角色摸一张牌并回复1点体力，然后你摸一张牌。",[]],["隐世","锁定技，你只有摸牌、出牌和弃牌阶段；你不能被选择为延时锦囊牌的目标。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"裴秀","t":"晋图开秘","k":"群","kh":3,"mh":3,"g":"男","s":[["行图","锁定技，当你使用牌时，若此牌的点数为X的因数，你摸一张牌；你使用点数为X的倍数的牌无次数限制（X为你使用的上一张牌的点数）。",["锁定技"]],["爵制","出牌阶段，你可以弃置至少两张牌，然后从牌堆中随机获得一张点数为X的牌（X为以此法弃置的牌点数和与13的余数，若余数为0则改为13）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-江山如故","n":"起刘备","t":"负戎荷戈","k":"群","kh":4,"mh":4,"g":"男","s":[["积善","每回合各限一次，当一名角色受到伤害时，你可以失去2点体力并防止此伤害，然后你与其各摸一张牌；当你造成伤害后，你可以令一名体力值最小且以此法被防止过伤害的角色回复1点体力。",[]],["振鞘","锁定技，你的攻击范围+1；当你使用【杀】指定目标后，若你的装备区没有武器牌，则此【杀】额外结算一次。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-江山如故","n":"起孙坚","t":"拨定烈志","k":"群","kh":3,"mh":4,"g":"男","s":[["平讨","出牌阶段限一次，你可以令一名其他角色选择一项：1.交给你一张牌，然后你此阶段使用【杀】次数上限+1；2.令你视为对其使用一张无距离和次数限制的【杀】。",[]],["绝烈","当你使用【杀】对目标角色造成伤害时，若你的手牌数或体力值为全场最小，此伤害+1。当你使用【杀】指定一名角色为目标后，你可以弃置一张牌，然后弃置其一张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-江山如故","n":"起王允","t":"居功自矜","k":"群","kh":3,"mh":3,"g":"男","s":[["赦论","出牌阶段限一次，若你有手牌，你可以选择至多两名（若为斗地主模式，则改为一名）你攻击范围内的其他角色，然后你令除其外所有手牌数不大于你的角色议事，若结果为：红色，你弃置其各两张牌；黑色，你对其各造成1点伤害。",[]],["伐异","当你参与议事结束后，你可以对至多两名（若为斗地主模式，则改为一名）意见与你不同的角色造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"少年张辽","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["冲垒","锁定技，你的出牌阶段内，所有其他角色的非基本手牌均只能作为【闪】使用或打出；出牌阶段内限X次（X为其他角色数），当你使用的牌被其他角色响应后，或当你响应其他角色使用的牌后，你获得该角色一张手牌。",["锁定技"]],["突袭","你的回合内限两次（若为斗地主或2v2模式则改为一次），当你不因此技能获得牌后，你可以将其中任意张牌置入弃牌堆，然后你获得至多X名其他角色各一张手牌（X为你此次以此法置入弃牌堆的牌数）。",[]],["困奋","锁定技，结束阶段，你失去1点体力，然后摸两张牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"射曹性","t":"喙晴阴鸷","k":"群","kh":4,"mh":4,"g":"男","s":[["劲镞","出牌阶段限一次，你可以选择一名其他角色与其分别同时展示一张、两张手牌，若你展示牌的点数在所有展示牌中：为中间值，你本回合对其使用的下一张【杀】对其造成的伤害+1且其不可响应；为最值，你弃置所有展示牌。若你因此弃置了牌，本技能可以再次发动。",[]],["暗弦","当你每回合首次弃置手牌后，你可以获得并使用其中一张【杀】，此【杀】不计入次数且无距离次数限制。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"审配","t":"正南义北","k":"群","kh":2,"mh":3,"g":"男","s":[["守邺","每回合限一次，当你成为其他角色使用牌的唯一目标后，你可以与其对策，若你对策成功，此牌对你无效，且此牌结算结束后，你获得之。",[]],["烈直","准备阶段，你可以依次弃置至多两名其他角色区域内的各一张牌；当你受到伤害后，〖烈直〗失效直到你的下个结束阶段。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"十常侍","t":"祸乱纲常","k":"群","kh":1,"mh":1,"g":"男","s":[["党锢","锁定技，游戏开始时，你获得十张不同的“常侍牌”，然后你进行一次“结党”（随机展示一张“常侍”牌，然后随机展示四张“常侍”牌，你从中选择一张与最初展示的“常侍”牌互相认可的与其组成双将）；当你因休整而返回游戏后，你进行一次“结党”并摸一张牌。",["锁定技"]],["殁亡","锁定技，当你即将死亡时，若你拥有技能〖党锢〗且你仍有未亮出的“常侍”牌，则改为休整一轮；回合结束时，你死亡。",["锁定技"]]],"r":[["滔乱","出牌阶段限一次，你可以将一张牌当任意基本牌或普通锦囊牌使用。",[]],["鸱咽","当你使用【杀】指定目标后，你可以将其一张牌扣置于其武将牌旁，该角色于本回合结束时获得此牌；当你使用【杀】对手牌数和装备区内的牌数均不大于你的目标角色造成伤害时，此伤害+1。",[]],["自谋","锁定技，当你于出牌阶段内使用：第二张牌时，你随机获得一张【酒】；第四张牌时，你随机获得一张【杀】；第六张牌时，你随机获得一张【决斗】。",["锁定技"]],["庀材","出牌阶段限一次，你可以进行判定，若结果与本次流程中的其他判定结果均不同，你可重复此流程。最后你可将本次流程中所有生效的判定牌交给一名角色。",[]],["谣诼","出牌阶段限一次，你可以与一名角色拼点。若你：赢，跳过其下个摸牌阶段；没赢：你弃置两张牌。",[]],["宵赂","出牌阶段限一次，你可以摸两张牌，然后选择一项：1.弃置两张手牌；2.将两张手牌交给一名其他角色。",[]],["窥机","出牌阶段限一次，你可以观看一名其他角色的手牌并可弃置你与其手牌中共计四张花色各不相同的牌。",[]],["叱吓","当你使用【杀】指定唯一目标后，你可以亮出牌堆顶两张牌，令其不能使用与亮出的牌花色相同的牌响应此【杀】，且其中每有一张牌与此【杀】花色相同，此【杀】伤害基数便+1。",[]],["逆取","出牌阶段限一次，你可以对一名角色造成1点火焰伤害。",[]],["妙语","你可以将至多两张同花色的牌按以下规则使用或打出：♥当【桃】，♦当火【杀】，♣当【闪】，♠当【无懈可击】。若你以此法使用或打出了两张：♥牌，此牌回复基数+1；♦牌，此牌伤害基数+1；黑色牌，你弃置当前回合角色一张牌。",[]]]},{"p":"手杀","sp":"手杀-兵势篇","n":"势黄祖","t":"守殁枭寒","k":"群","kh":4,"mh":4,"g":"男","s":[["鸱张","你使用伤害类卡牌无距离限制；当你使用手牌中除【闪电】外的伤害类卡牌指定第一个目标后，你可以弃置至少一张手牌，令其他角色不能使用或打出与你以此法弃置牌颜色相同的牌响应此牌。",[]],["断鞅","每回合限一次，当你的手牌不因使用而进入弃牌堆后，你可以将其中随机一张【杀】置于你的武将牌上，并于本阶段结束时使用之（无次数限制）。你以此法使用的【杀】造成伤害后，你可以重铸受伤角色区域里的至多两张牌，然后你摸四张牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势田丰","t":"河北瑰杰","k":"群","kh":3,"mh":3,"g":"男","s":[["刚鲠","出牌阶段限一次，你可以将至少两张手牌交给一名其他角色。回合结束时，若其手牌数：为全场最多，你摸一张牌；不为全场最多，你弃置其区域里的一张牌。",[]],["死谏","每回合限两次，当你失去最后一张手牌后，或当你进入濒死状态时，你可以选择一项：1.选择一名其他角色，其使用下一张牌后需弃置一张牌；2.令当前回合角色摸两张牌。若此时没有角色处于濒死状态，你可以背水：失去X点体力（X为你发动此技能背水的次数）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势文丑","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["轮战","出牌阶段内，你不因本技能使用牌结算完成后，若此牌与你使用的上一张牌有相同目标，你可以弃置手牌中一个牌名的基本牌，增加等同于弃牌数的手牌上限，视为使用一张指定这些相同目标角色的【决斗】。此【决斗】结算中，你失去最后一张手牌后，将手牌摸至手牌上限；结算后，若你未失去过最后的手牌，你回复1点体力并重置手牌上限。",[]],["绝行","锁定技，你的回合内：你使用手牌中的伤害牌额外指定所有本回合未受到过伤害的角色；本回合未受到过伤害的角色的非基本手牌只能当【杀】使用或打出。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"士燮","t":"南交学祖","k":"群","kh":3,"mh":3,"g":"男","s":[["避乱","摸牌阶段开始时，若有角色与你的距离为1，你可以放弃摸牌，令其他角色计算与你的距离+X（X为存活势力数）。",[]],["礼下","锁定技，其他角色的结束阶段，若你不在其攻击范围内，你选择一项：1.摸一张牌；2.令其摸一张牌。然后其他角色计算与你的距离-1。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势颜良","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["急战","出牌阶段内，你对一名角色每连续使用两张牌后，你可以摸一张牌并令手牌上限-X（X为你手牌中的“急战”牌数），然后若你手牌上限为0，你受到1点伤害（因此进入濒死状态则回复体力至1点），令你下次造成伤害+1并重置手牌上限。",[]],["狭勇","锁定技，你的回合内：你对本回合未受到过伤害的角色使用牌无次数限制；本回合受到过伤害的角色的非基本手牌只能当【杀】使用或打出。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势于吉","t":"夙仙望道","k":"群","kh":3,"mh":3,"g":"男","s":[["符济","出牌阶段限一次，你可以展示并交给任意名其他角色各一张牌，这些牌称为“符济”牌。 一名角色使用“符济”牌时获得一张与“符济”牌相同花色的牌。若“符济”牌为【杀】，此【杀】伤害基数值+1；若为【闪】，则结算后使用者摸一张牌。 若你发动此技能交出牌后手牌数为全场最少，你摸一张牌，且你使用的第一张【杀】和【闪】带有以上“符济”牌效果直到你下回合开始。",[]],["道转","每回合限一次，当你需使用基本牌时（每轮每种牌名限一次），你可以将你或当前回合角色的一张牌置入弃牌堆，视为使用此牌。若当前回合角色本次失去了牌，本技能本轮失效。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势臧洪","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["烈志","每回合限一次，你可以减1点体力上限，视为使用【桃】或【酒】。",[]],["据孤","当你成为牌的目标后，若你未受伤，你可以摸两张牌，然后弃置X张牌（X为本回合本技能发动次数）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"势张任","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["伏暗","结束阶段，你可以将基础和因〖引弦〗获得的攻击范围调整至0，摸X张牌（X为本次减少的攻击范围，且至多为5），并记录一个手牌中的花色（每轮每花色限一次）。其他角色的回合结束时，你可以清除一个本回合进入过弃牌堆的花色，视为对一名角色使用一张无距离限制的【杀】，若造成 戾”并随机执行一项：1.受到1点火焰伤害且本回合不能对你使用【杀】；2.流失1点体力且本回合手牌上限-1；3.你随机获得其一张手牌和一张装备区里的牌。",[]],["杀绝","锁定技，其他角色进入濒死状态时，若其需要超过一张【桃】或【酒】救回，你获得一个“暴戾”标记且获得使其进入濒死状态的牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"杨彪","t":"德彰海内","k":"群","kh":3,"mh":3,"g":"男","s":[["昭汉","锁定技，准备阶段，若X：小于4，你加1点体力上限并回复1点体力；不小于4且小于7，你减1点体力上限（X为你发动过本技能的次数）。",["锁定技"]],["让节","当你受到1点伤害后，你可以选择一项：1.移动场上一张牌；2.从牌堆或弃牌堆中随机获得一张你指定类别的牌。最后你摸一张牌。",[]],["义争","出牌阶段限一次，你可以与一名体力值不大于你的角色拼点。若你：赢，跳过其下个摸牌阶段；没赢，你减1点体力上限。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"杨奉","t":"忠勇半途","k":"群","kh":4,"mh":4,"g":"男","s":[["血途","转换技，出牌阶段限一次，你可以：阳，令一名角色回复1点体力；阴，令一名角色摸两张牌。",["转换技"]],["威命","使命技，出牌阶段开始时，你标记一名未标记过的其他角色。 ⬤　成功：当你杀死一名未标记的角色后，你将〖血途〗修改至二级； ⬤　失败：当一名已被标记的角色死亡后，你将〖血途〗修改至三级。",["使命技"]]],"r":[]},{"p":"手杀","sp":"手杀-兵势篇","n":"杨弘","t":"柔迩驭远","k":"群","kh":3,"mh":3,"g":"男","s":[["间计","出牌阶段限一次，你可以秘密选择一张手牌，并令两名角色进行拼点，赢的角色视为对没赢的角色使用一张无距离限制【杀】。此次拼点中，这些角色可以秘密选择改为用你选择的牌进行拼点，然后若此牌为【杀】，你对选择用此牌拼点的角色造成1点伤害。",[]],["远谟","每回合限两次，准备阶段，或当你受到伤害后，你可以移动场上的一张牌，然后你可以令因此失去牌的角色摸X张牌（X为其攻击范围内因此减少的角色数，至多为5）。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"羊祜","t":"鹤德璋声","k":"群","kh":4,"mh":4,"g":"男","s":[["明伐","结束阶段，你可以展示一张牌。你下个回合的首个出牌阶段开始时，若此牌仍在你手牌或装备区，你可以用此牌与一名其他角色拼点，若你：赢，你获得其一张牌，并随机获得牌堆中一张点数为X的牌（X为你拼点的牌的点数-1）；没赢，本回合你不能对其他角色使用牌。当你拼点的牌亮出后，你令此牌的点数+2。",[]],["戎备","限定技，出牌阶段，你可以选择一名装备区有空置装备栏的角色，其为每个空置的装备栏从牌堆或弃牌堆随机使用一张对应类别的装备。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"阳球","t":"身蹈水火","k":"群","kh":4,"mh":4,"g":"男","s":[["扫奸","出牌阶段限一次，你可以观看一名其他角色的手牌并选择其中一张，然后其重复弃置一张手牌，直至弃置了五张牌或你选择的牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"阎圃","t":"盱衡识势","k":"群","kh":3,"mh":3,"g":"男","s":[["缓图","每轮限一次，你攻击范围内一名其他角色摸牌阶段开始前，你可以交给其一张牌，令其跳过摸牌阶段，若如此做，本回合结束阶段你选择一项：1.令其回复1点体力并摸两张牌；2.你摸三张牌并交给其两张手牌。",[]],["避祸","限定技，一名角色脱离濒死状态时，你可以令其摸三张牌，然后除其以外的角色本轮计算与其的距离时+X（X为场上角色数）。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"阎象","t":"明尚夙达","k":"群","kh":3,"mh":3,"g":"男","s":[["苦谏","出牌阶段限一次，你可将至多两张手牌标记为“谏”并交给一名其他角色。当其他角色使用或打出“谏”牌时，你与其各摸两张牌。当其他角色非因使用或打出从手牌区失去“谏”牌后，你与其各弃置一张牌。",[]],["睿敛","每轮开始时，你可选择一名角色，其下个回合结束前，若其此回合弃置过牌，你可选择其此回合弃置过的牌中的一种类别，你与其各从弃牌堆中获得一张此类别的牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"友崔钧","t":"日奋金丝","k":"群","kh":3,"mh":3,"g":"男","s":[["顺逸","当你使用点数唯一最小的手牌时，若此牌的花色为♥且点数大于X（X为你本回合发动本技能的次数），你可以将此花色的所有手牌扣置于武将牌上直至当前回合结束，然后你摸一张牌。",[]],["鄙位","出牌阶段限一次，你可以弃置一张点数唯一最大的手牌并选择一名其他角色，令其弃置所有点数不小于此牌的手牌。若其未因此弃置牌，复原此技能。",[]],["共砺","锁定技，游戏开始时，你令〖顺逸〗增加X个可触发的花色（X为全场友武将数）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"友庞统","t":"凤翥南地","k":"群","kh":3,"mh":3,"g":"男","s":[["漫卷","每轮限五次，当你不因本技能一次性获得至少两张牌后，你可以将其中任意张牌以任意顺序置于牌堆顶。若如此做，你每放置一张牌，便从弃牌堆中随机获得一张与此牌类别不同的牌（每次至多获得五张）。",[]],["养名","出牌阶段结束时，若你本阶段失去过至少三张手牌，你可以亮出牌堆顶的X张牌（X为本回合进入过弃牌堆的牌的花色数），使用其中任意张花色各不相同的牌（无次数限制）。",[]],["共砺","锁定技，若友方友诸葛亮在场，你发动〖养名〗亮出牌张数+1；若友方友徐庶在场，你发动〖养名〗后，获得一张本次亮出牌中未使用过的花色的牌。（仅斗地主和2v2模式生效）",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"友石韬","t":"月堕窠臼","k":"群","kh":3,"mh":3,"g":"男","s":[["钦英","出牌阶段限一次，你可以重铸任意张牌，视为使用一张【决斗】。若如此做，此【决斗】结算过程中限X次（X为你以此法重铸的牌数），你或目标角色可以弃置区域中的一张牌，视为打出一张【杀】。",[]],["论雄","当你造成或受到伤害后，你可以弃置点数唯一最大的手牌，然后摸三张牌，你本局游戏以此法弃置牌的点数须大于此牌。",[]],["共砺","锁定技，游戏开始时，你令本局〖钦英〗减少X个可用于弃置的类别的牌（X为全场友武将数）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"友徐庶","t":"潜悟诲人","k":"群","kh":3,"mh":3,"g":"男","s":[["侠行","游戏开始时，你获得并使用【玄剑】；当【玄剑】进入弃牌堆后，你可以移除2个“启诲”标记获得之。",[]],["启诲","锁定技，当你使用牌时，若你没有此牌对应类别的标记，你获得1个对应类别的“启诲”标记，然后若你拥有3个“启诲”标记，你移除2个“启诲”标记并选择一项：1.回复1点体力；2.摸两张牌；3.你使用的下一张牌不计入次数且无次数限制。",["锁定技"]],["共砺","锁定技，若友方友诸葛亮在场，你发动〖玄剑〗改为将一张手牌当【杀】使用；若友方友庞统在场，你发动〖玄剑〗使用的【杀】无距离限制。（仅斗地主和2v2模式生效）",["锁定技"]],["玄剑","出牌阶段限一次，你可以弃置一张牌，令一名角色摸两张牌，然后其弃置两张牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"友诸葛亮","t":"龙骧九天","k":"群","kh":3,"mh":3,"g":"男","s":[["演策","每轮限一次，首轮开始时，或准备阶段，你可以选择一项：从牌堆中随机获得一张锦囊牌；执行“卧龙演策”。若你执行“卧龙演策”，当一张牌被使用时，若此牌的类别或颜色与你的预测相同，你摸一张牌（每次执行“卧龙演策”至多因此摸五张牌）。 当“卧龙演策”的预测全部验证后，或当你再次执行“卧龙演策”时，若你本次“卧龙演策”正确的预测数量： 为0，你失去1点体力，此后“卧龙演策”可预测的牌数-1； 不足一半，你弃置一张牌； 至少一半（向上取整），你根据本次预测的方式，从牌堆中获得一张符合你声明条件的牌； 全部正确，你摸两张牌，此后“卧龙演策”可预测的牌数+1（至多为7）。",[]],["方遒","限定技，当你执行“卧龙演策”。后，你可以展示你的“卧龙演策”预测，若如此做，本次“卧龙演策”的预测全部验证后，执行效果的值均+1；若预测牌数大于3且全部正确，重置此技能。",["限定技"]],["共砺","锁定技，若友方友庞统在场，你执行“卧龙演策”初始可预测的牌数+1；若友方友徐庶在场，你“卧龙演策”预测的第一张牌的结果始终视为正确。（仅斗地主和2v2模式生效）",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘陈兰","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["据峻","锁定技，你成为过牌的目标且体力值变化过的阶段结束时，你视为使用一张【万箭齐发】。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘高顺","t":"点到为止","k":"群","kh":4,"mh":4,"g":"男","s":[["激刃","限定技，出牌阶段，你可以令所有角色本局游戏使用非武器牌不能指定自己为目标。",["限定技"]],["决止","出牌阶段每项各限一次：1.你可以摸一张牌，视为使用一张【决斗】，然后弃置手牌中的所有非伤害牌；2.你可以摸一张牌，回复1点体力，然后弃置手牌中的所有伤害牌。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘吕布","t":"纵横天下","k":"群","kh":4,"mh":4,"g":"男","s":[["掠阵","出牌阶段开始时，你可以令所有其他角色依次选择一项：1.展示X张手牌（X为其选择过此项的次数+1）；2.令你视为对其使用一张不计入次数且无距离次数限制的【杀】。",[]],["横威","锁定技，当你对其他角色造成伤害时，其需展示并交给你一张手牌，否则此伤害+1；你的回合内，其他角色不能使用与其于本回合内展示过的牌颜色相同的牌。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘梅成","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["壁险","锁定技，你成为过牌的目标且体力值未变化过的阶段结束时，你视为使用一张【决斗】。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-界限突破","n":"袁术","t":"野心渐增","k":"群","kh":4,"mh":4,"g":"男","s":[["妄尊","锁定技，体力值大于你的角色的准备阶段，你摸一张牌（若其为主公或地主，你额外摸一张牌且其本回合的手牌上限-1）。",["锁定技"]],["同疾","当其他角色成为【杀】的目标时，若你在其攻击范围内，且你不是此【杀】的使用者，其可弃置一张牌将此【杀】转移给你。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘蹋顿","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["游掠","锁定技，你于回合内不以此法获得一张牌后，你摸一张牌：你于回合外不以此法失去一张牌后，你弃置一张牌。",["锁定技"]],["连袭","【杀】不计入你的手牌上限；当你的【杀】被弃置进入弃牌堆后，你可以视为使用一张不计入次数且无距离次数限制的普通【杀】。",[]]],"r":[]},{"p":"手杀","sp":"手杀-测试服","n":"缘檀石槐","t":"梦魇","k":"群","kh":4,"mh":4,"g":"男","s":[["连斩","当你使用指定唯一目标的有点数的【杀】结算结束后，你可以对其使用一张无距离次数限制且点数更大的【杀】并摸一张牌。",[]],["寇掠","锁定技，你于摸牌阶段外获得的手牌不计入手牌上限且均视为【杀】。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"于禁","t":"逐暴定乱","k":"群","kh":4,"mh":4,"g":"男","s":[["镇军","出牌阶段开始时，你可以交给一名其他角色一张牌，然后令其选择是否使用一张非黑色的【杀】，且此【杀】结算结束后你摸X张牌（X为此【杀】造成伤害值+1且至多为5）；若其不执行，则你可以对其或其攻击范围内的一名角色造成1点伤害。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"笮融","t":"持宗事魔","k":"群","kh":4,"mh":4,"g":"男","s":[["浮图","每个回合结束时，若你于此回合内：造成的伤害值最多，你将牌堆顶的首张黑色牌置于你的武将牌上，称为“业”；令角色回复的体力最多，你将牌堆顶的首张红色牌置为“业”。当你受到伤害时，你可以移去一张“业”，防止之。",[]],["净土","限定技，出牌阶段，你可以选择一项：1.获得你的所有黑色“业”并对一名角色造成等量伤害；2.获得你的所有红色“业”，令一名角色加等量体力上限并回复等量体力。若你两种颜色的“业”数量相等且均大于1，你可背水。最后你失去技能〖浮图〗并获得技能〖佛宗〗。",["限定技"]],["劫辩","一名角色的出牌阶段结束时，若本阶段没有角色受到过伤害，你可以与当前回合角色或体力值最低的角色拼点（你可以用“业”进行此次拼点），若你赢，你选择一项：1.对没赢的角色造成1点伤害；2.令没赢的角色回复1点体力并摸一张牌，然后获得其至多两张牌。",[]],["佛宗","锁定技，你与因“净土”获得的牌颜色相同的手牌不计入手牌上限，且造成伤害与回复体力的值均+1。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"张宝","t":"地公将军","k":"群","kh":3,"mh":3,"g":"男","s":[["咒缚","出牌阶段限一次，你可以将一张手牌置于一名没有“咒”的其他角色的武将牌旁，称为“咒”；当有“咒”的角色判定时，将“咒”作为判定牌；一名角色的回合结束时，你令本回合移除过“咒”的角色各失去1点体力。",[]],["影兵","锁定技，有“咒”的角色使用与“咒”花色相同的牌时，你摸一张牌；若这是你第二次因该“咒”摸牌，移去该“咒”。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"张琪瑛","t":"禳祷西东","k":"群","kh":3,"mh":3,"g":"女","s":[["法箓","锁定技，当你的牌因弃置而移至弃牌堆后，根据这些牌的花色，你获得对应标记： ♠，你获得1枚“紫微”； ♣，你获得1枚“后土”； ♥，你获得1枚“玉清”； ♦，你获得1枚“勾陈”。 每种标记限拥有一个。游戏开始时，你获得以上四种标记。",["锁定技"]],["真仪","你可以在以下时机弃置相应的标记来发动以下效果： 当一张判定牌生效前，你可以弃置“紫微”，然后将判定结果改为♠5或♥5并终止此时机； 当你处于濒死状态时，你可以弃置“后土”，然后将你的一张手牌当【桃】使用； 当你造成伤害时，你可以弃置“玉清”，然后判定，若结果为黑色，你令伤害值+1； 当你受到属性伤害后，你可以弃置“勾陈”，然后你从牌堆或弃牌堆中随机获得三种类型的牌各一张。",[]],["点化","准备阶段或结束阶段，你可以观看牌堆顶的X张牌（X为你的标记数），将这些牌以任意顺序放回牌堆顶。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"张仲景","t":"医理圣哲","k":"群","kh":3,"mh":3,"g":"男","s":[["济世","锁定技，你使用牌结算后，若此牌没有造成伤害，则将之置入“仁”区；当“仁”牌不因溢出而离开“仁”区后，你摸一张牌。",["锁定技"]],["疗疫","其他角色回合开始时，若其手牌数小于体力值且场上“仁”数量不小于X，则你可以令其获得X张“仁”；若其手牌数大于体力值，则可以令其将X张手牌置入“仁”区（X为其手牌数与体力值之差，且至多为4）。",[]],["病论","出牌阶段限一次，你可以移去一张“仁”牌，令一名角色选择一项：1.摸一张牌；2.其下个回合结束时回复1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"郑玄","t":"兼采定道","k":"群","kh":3,"mh":3,"g":"男","s":[["整经","出牌阶段限一次，你可以整理一次经典，并将你整理出的任意牌置于一名角色的武将牌上，称为“经”，然后你获得剩余的牌。武将牌上有“经”的角色准备阶段，其获得所有“经”，然后跳过本回合的判定阶段和摸牌阶段。",[]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"甄姬","t":"明珠锦玉","k":"群","kh":3,"mh":3,"g":"女","s":[["博鉴","锁定技，出牌阶段结束时，若你本阶段使用的牌数与花色数与你上个出牌阶段均不同，则你摸两张牌；否则你选择弃牌堆中你本阶段使用过的一张牌，将之交给一名角色。",["锁定技"]],["济危","锁定技，其他角色的回合结束时，此回合每满足一项，你便摸一张牌： 1.有角色失去过牌； 2.有角色受到过伤害（若为身份模式，则移除此项；若为斗地主，则满足此项额外摸一张牌）。 准备阶段，若你的手牌数不小于存活人数且不小于你的体力值（若为斗地主或2v2模式，则此条件改为若所有角色均存活且你的手牌数不少于五张），则你须将手牌中数量较多颜色的牌全部分配给其他角色（若数量相同则选择一种颜色）。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"朱儁","t":"功成师克","k":"群","kh":4,"mh":4,"g":"男","s":[["佯解","出牌阶段限一次，你可以与一名角色拼点。若你没赢，你可以令另一名其他角色视为对与你拼点的角色使用一张无距离限制的火【杀】。",[]],["厚俸","每轮限一次，你攻击范围内一名角色出牌阶段开始时，你可以令其“整肃”；你与其共同获得“整肃”奖励。",[]],["拒降","限定技，当一名其他角色的濒死结算结束后，你可对其造成1点伤害。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神郭嘉","t":"星月奇佐","k":"神","kh":3,"mh":3,"g":"男","s":[["慧识","出牌阶段限一次，若你的体力上限小于10，你可以判定，若花色与本次流程中的其他判定结果均不同，且你的体力上限小于10，你可以加1点体力上限并重复此流程。最后你将本次流程中所有生效的判定牌交给一名角色，若其手牌为全场最多，你减1点体力上限。",[]],["天翊","觉醒技，准备阶段，若所有存活角色本局游戏均受到过伤害，你加2点体力上限，回复1点体力，令一名角色获得技能〖佐幸〗。",["觉醒技"]],["辉逝","限定技，出牌阶段，你可以选择一名角色，若其有未发动过的觉醒技且你的体力上限不小于存活角色数，你选择其中一项技能，视为该角色满足其觉醒条件；否则其摸四张牌。最后你减2点体力上限。",["限定技"]],["佐幸","出牌阶段限一次，你可以令神郭嘉减1点体力上限，视为使用一张普通锦囊牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神华佗","t":"悬壶济世","k":"神","kh":3,"mh":3,"g":"男","s":[["五灵","出牌阶段限两次，你可以选择一名没有“五灵”标记的角色，按照你选择的顺序向其传授“五禽戏”。拥有“五灵”标记的角色在其准备阶段按照传授的顺序依次切换为下一种效果： 虎：当你使用指定唯一目标的牌对目标角色造成伤害时，此伤害+1。 鹿：回复1点体力并弃置判定区里的所有牌，你不能成为延时锦囊牌的目标。 熊：每回合限一次，当你受到伤害时，此伤害-1。 猿：获得一名其他角色装备区里的一张牌。 鹤：你摸三张牌。",[]],["游医","弃牌阶段结束时，你可以将此阶段弃置的牌置入“仁”区。出牌阶段限一次，你可以弃置所有“仁”区的牌，令所有角色回复1点体力。",[]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神姜维","t":"万民承霖","k":"神","kh":4,"mh":4,"g":"男","s":[["星魂","出牌阶段限一次，你可观看牌堆顶五张牌，用任意张手牌与其中等量牌进行交换并排序，然后你令一名其他角色展示你手牌与牌堆顶共五张牌，你对其依次使用其中的【杀】。",[]],["天涛","锁定技，结束阶段，你选择一个区域并弃置其中所有牌，然后依次弃置任意名其他角色相同区域各一张牌，因此弃置牌且未弃置【杀】的角色失去1点体力。",["锁定技"]],["神霈","限定技，你进入濒死时，可回复X点体力（X为你本局游戏进入过濒死的次数），对一名角色造成等量雷电伤害并获得〖回天〗。",["限定技"]],["回天","一名体力值大于你的角色回合结束时，你可摸一张牌并执行一个额外的回合。每轮开始时，若你发动过此技能，你死亡。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神鲁肃","t":"兴吴之邓禹","k":"神","kh":3,"mh":3,"g":"男","s":[["榻谟","游戏开始时，你可以重新分配所有角色的座次（若为身份模式，则改为除主公外的所有角色；若为斗地主，则改为除三号位外的所有角色）。",[]],["定州","出牌阶段限一次，你可以选择一名其他角色并交给其X张牌（X为其场上的牌数），然后你获得其场上的所有牌。",[]],["智盟","回合结束时，你可以与一名其他角色随机平均分配手牌（若不为身份模式，则改为手牌数不大于你手牌数+1的其他角色），若总牌数为奇数，则你分配较多张数。",[]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"神吕布","t":"修罗之道","k":"神","kh":5,"mh":5,"g":"男","s":[["狂暴","锁定技，游戏开始时，你获得2枚“暴怒”；当你造成或受到1点伤害后，你获得1枚“暴怒”。",["锁定技"]],["无谋","锁定技，你的普通锦囊牌只能当普通【杀】使用或打出，此【杀】的目标改为原锦囊的目标。",["锁定技"]],["无前","出牌阶段，你可以移除2个“暴怒”，令一名角色防具牌失效且你获得〖无双〗，直至你下次使用伤害牌但未造成伤害。你的出牌阶段使用【杀】次数+X（X为当前被“无前”的角色数）；结束阶段，若你的手牌中没有伤害牌，你随机获得一张伤害牌。",[]],["神愤","出牌阶段限一次，你可以弃6枚“暴怒”，对所有其他角色各造成1点伤害，然后这些角色各弃置其装备区里的所有牌，各弃置四张手牌，最后你翻面。",[]],["无双","锁定技，当你使用【杀】指定目标后，其使用【闪】抵消此【杀】的方式改为需连续使用两张【闪】；当你使用【决斗】指定目标后，或当你成为【决斗】的目标后，你令其打出【杀】响应此【决斗】的方式改为需连续打出两张【杀】。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神马超","t":"势震九天","k":"神","kh":4,"mh":4,"g":"男","s":[["驭雳","锁定技，1.你造成的伤害改为雷电伤害，已是雷电伤害则伤害+1；2.你受到雷电伤害时，防止之并摸等量牌。",["锁定技"]],["霆威","你使用【杀】指定目标后，可以获得4个“霆”标记并选择一名目标角色，其选择任意项（每选择一项，你失去1个“霆”标记）： 1.非锁定技失效至其下个回合结束； 2.交给你一张装备牌； 3.此牌对其造成伤害+1： 4.随机弃一张牌。 若其均不选择，其进入连环状态。",[]],["寂灭","限定技，出牌阶段结束时，你可以失去8个“霆”，对一名角色造成等于其体力上限的伤害。然后你〖驭雳〗的两项均执行后，此技能可再次发动。",["限定技"]]],"r":[]},{"p":"手杀","sp":"手杀-稀有专属","n":"神司马懿","t":"三分一统","k":"神","kh":4,"mh":4,"g":"男","s":[["忍戒","锁定技，每轮限四次，当你需要使用或打出牌以响应一张牌时，若你不为使用者且未响应，你获得一枚“忍”标记。",["锁定技"]],["拜印","觉醒技，准备阶段，若你的“忍”标记数不少于4，你减1点体力上限，然后获得〖极略〗。",["觉醒技"]],["连破","当你杀死其他角色后，你可以选择一项：1.于此回合结束后获得一个额外的回合（每回合限一次）；2.若你有〖极略〗，则你选择并获得一项你未拥有的〖极略〗中的技能。",[]],["极略","当你获得此技能时，你获得〖鬼才〗，然后根据你的势力获得对应技能：\n魏〖放逐〗；蜀〖集智〗；吴〖制衡〗；群〖完杀〗。\n出牌阶段开始时，你可以选择一项：1.移去X枚“忍”标记，选择并获得一项你未拥有的“极略”中的技能（X为你选择过此项的次数+1，且至少为2）；2.移去至多两枚“忍”标记，然后摸等量的牌。",["衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神孙策","t":"踞江鬼雄","k":"神","kh":1,"mh":6,"g":"男","s":[["英霸","出牌阶段限一次，你可以令一名体力上限大于1的其他角色减1点体力上限，并令其获得一枚“平定”标记，然后你减1点体力上限；你对拥有“平定”标记的角色使用牌无距离限制。",[]],["覆海","锁定技，当你使用牌指定拥有“平定”标记的角色为目标后，其不能响应此牌，且你摸一张牌（每回合限摸两张）；当拥有“平定”标记的角色死亡时，你增加X点体力上限并摸X张牌（X为其“平定”标记数）。",["锁定技"]],["冯河","锁定技，你的手牌上限基值为你已损失的体力值；当你受到其他角色造成的伤害时，若你的体力上限大于1且你有手牌，你防止此伤害，减1点体力上限并将一张手牌交给一名其他角色，然后若你有技能〖英霸〗，伤害来源获得一枚“平定”标记。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神太史慈","t":"义信天武","k":"神","kh":4,"mh":4,"g":"男","s":[["笃烈","锁定技，当你成为体力值大于你的角色使用【杀】的目标时，你判定，若结果为♥，取消之。",["锁定技"]],["破围","使命技，游戏开始时，你令所有其他角色获得“围”标记；回合开始时，你令所有拥有“围”标记的角色将“围”标记移动至下家（若下家为你，则改为移动至你的下家）；有“围”标记的角色受到伤害后，移去其“围”标记；有“围”的角色的回合开始时，你可以选择一项并令你本回合视为处于其攻击范围内：1.弃置一张手牌，对其造成1点伤害；2.若其体力值不大于你，你获得其一张手牌。 ⬤　成功：回合开始时，若场上没有“围”标记，则你获得技能〖神著〗； ⬤　失败：当你进入濒死状态时，若你的体力值小于1，你回复体力至1点，移去场上所有的“围”标记，然后弃置你装备区里所有的牌。",["使命技"]],["神著","锁定技，当你使用非转化且非虚拟的【杀】结算结束后，你须选择一项：1.摸一张牌，令你于本回合内使用【杀】的次数上限+1；2.摸三张牌，令你于本回合内不能使用【杀】。",["锁定技","衍生技"]]],"r":[]},{"p":"手杀","sp":"手杀-始计篇","n":"神荀彧","t":"洞心先识","k":"神","kh":3,"mh":3,"g":"男","s":[["天佐","锁定技，游戏开始时，将8张【奇正相生】加入牌堆；【奇正相生】对你无效。",["锁定技"]],["灵策","锁定技，当非虚拟且非转化的锦囊牌被使用时，若此牌的牌名属于智囊牌名、〖定汉〗已记录的牌名或【奇正相生】，你摸一张牌。",["锁定技"]],["定汉","当你成为锦囊牌的目标时，若此牌牌名未被记录，则记录此牌名，然后取消此目标；回合开始时，你可以增加或移除一种锦囊牌的牌名记录。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"卞夫人","t":"奕世之雍容","k":"魏","kh":3,"mh":3,"g":"女","s":[["挽危","每回合限一次，当你的牌被其他角色弃置或获得后，你可以从牌堆获得一张同名牌（无同名牌则改为摸一张牌）。",[]],["约俭","每回合限两次，当其他角色对你使用的牌结算完毕置入弃牌堆时，你可以展示所有手牌，若花色与此牌均不同，你获得之。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"蔡瑁","t":"蛟海腾云","k":"魏","kh":4,"mh":4,"g":"男","s":[["佐练","出牌阶段限一次，你可以选择至多X名有手牌的角色（X为你的体力值），你随机展示这些角色的各一张手牌，你可以令这些角色各将展示的牌与弃牌堆或牌堆中的火【杀】或雷【杀】交换。",[]],["精舟","当你受到伤害时，你可以令至多X名角色改变“连环状态”。（X为你的体力值）",[]]],"r":[]},{"p":"OL","sp":"OL-测试服","n":"蔡贞姬","t":"","k":"魏","kh":3,"mh":3,"g":"女","s":[["柯笛","当你每回合前两次使用牌结算结束后，你可以令一名角色重铸一张牌。你可以无次数限制地使用弃牌堆里的以此法重铸的牌，直到你的下个回合开始。",[]],["存择","锁定技，所有角色的【桃】双倍计入手牌上限。结束阶段，你选择一名角色并摸X张牌（X为其手牌中【桃】的数量）。直到你下回合开始，其进入濒死状态时，若为首次，其回复体力至1点，否则本次濒死结算中你不能使用【桃】。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"曹纯","t":"虎豹骑首","k":"魏","kh":4,"mh":4,"g":"男","s":[["缮甲","游戏开始时，你获得3个“损”标记。当你失去装备牌后，你移去1个“损”。出牌阶段限一次，你可以摸三张牌，并可以使用一张【杀】，然后你此阶段使用下X张手牌时，你弃置一张牌（X为“损”数）。若如此做，此阶段结束时，若你此阶段未因“缮甲”弃置过牌或仅弃置过装备牌，你可以视为使用一张无距离限制的【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"曹金玉","t":"春秋盈昃","k":"魏","kh":3,"mh":3,"g":"女","s":[["春晖","锁定技，准备阶段或当你受到伤害后，令一名角色交给你一张手牌。若此牌为黑色，本回合你或其下一次成为红色牌的目标时，各弃置一张手牌。",["锁定技"]],["夏晟","锁定技，若你手牌中：红色牌较多，你使用黑色牌时摸一张牌；黑色牌较多，你使用红色牌可以多指定一个目标。",["锁定技"]],["秋暮","锁定技，本回合成为过你的红色牌目标的角色进入濒死状态时，你将〖春晖〗〖夏晟〗〖秋暮〗描述中的“红色”改为“黑色”，若描述变化，你获得其所有黑色手牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"曹仁","t":"鬼神之勇","k":"魏","kh":4,"mh":4,"g":"男","s":[["伪溃","出牌阶段限一次，你可以失去1点体力并选择一名有手牌的其他角色观看其手牌：若其手牌中有【闪】，则视为你对其使用一张不计入次数限制的【杀】，且本回合你计算与其的距离视为1；若其手牌中没有【闪】，你弃置其中一张牌。",[]],["励战","结束阶段，你可以令任意名已受伤的角色摸一张牌。",[]]],"r":[],"vi":1,"vt":2},{"p":"OL","sp":"OL-神话","n":"曹仁","t":"大将军","k":"魏","kh":4,"mh":4,"g":"男","s":[["据守","结束阶段，你可以翻面，摸四张牌，然后选择一项：1.使用一张装备牌手牌；2.弃置一张非装备牌手牌。",[]],["解围","你可将一张装备区里的牌当【无懈可击】使用。当你翻面后，若你的武将牌正面朝上，你可以弃置一张牌，然后移动场上一张牌。",[]]],"r":[],"vi":2,"vt":2},{"p":"OL","sp":"OL-祈福","n":"曹爽","t":"托孤辅政","k":"魏","kh":4,"mh":4,"g":"男","s":[["托孤","当一名角色死亡时，你可以令其选择其武将牌上的一个技能（限定技、觉醒技、主公技、隐匿技、使命技除外），你失去上次以此法获得的技能，然后获得此技能。",[]],["擅专","当你对一名其他角色造成伤害后，若其判定区没有牌，你可以将其一张牌置于其判定区，若此牌不是延时锦囊牌，则红色牌视为【乐不思蜀】，黑色牌视为【兵粮寸断】。结束阶段，若你本回合未造成伤害，你可以摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"曹羲","t":"魁立倾厦","k":"魏","kh":3,"mh":3,"g":"男","s":[["刚述","当你使用非基本牌后，你可以令你以下一项数值+1直到你抵消牌（至多增加至5）：攻击范围；下个摸牌阶段摸牌数；出牌阶段使用【杀】次数上限。",[]],["谏旋","当你受到伤害后，你可以令一名角色摸一张牌，若其手牌数与〖刚述〗中的任意项相同，其重复此流程。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"曹婴","t":"龙城凤鸣","k":"魏","kh":4,"mh":4,"g":"女","s":[["凌人","每回合限一次，当你使用【杀】或伤害锦囊牌时，你可以猜测其中一个目标的手牌中是否有基本牌、锦囊牌或装备牌，若至少猜对：1项，本回合你下次对其伤害+1；2项，此牌不计入次数，你摸两张牌；3项，你获得〖奸雄〗〖行殇〗直到你下回合开始。",[]],["伏间","锁定技，准备阶段或结束阶段，你随机观看手牌数不是全场最多的一名其他角色的手牌。",["锁定技"]],["奸雄","当你受到伤害后，你可以获得对你造成伤害的牌并摸一张牌。",["衍生技"]],["行殇","当其他角色死亡时，你可以获得其所有牌。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"曹宇","t":"大魏燕王","k":"魏","kh":3,"mh":3,"g":"男","s":[["恭节","每轮的第一个回合开始时，你可以令任意名其他角色各获得你一张牌，然后你摸X张牌（X为被获得牌的花色数）。",[]],["相胥","当你的手牌数变为全场最小后，本回合结束时，你可以将手牌调整至与当前回合角色相同（至多摸至五张），若你以此法弃置了至少两张牌，你回复1点体力。",[]],["襄胙","限定技，当你进入濒死状态时，你可以交给一名其他角色任意张牌，若你对其发动过〖恭节〗和〖相胥〗，你回复等量体力。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-一将","n":"曹真","t":"荷国天督","k":"魏","kh":4,"mh":4,"g":"男","s":[["司敌","其他角色出牌阶段开始时，你可以弃置一张与你装备区里任意牌颜色相同的非基本牌，令其本阶段不能使用和打出与此牌颜色相同的牌，然后此阶段结束时，若其本阶段未使用过【杀】，你视为对其使用一张【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-文德武备","n":"成济成倅","t":"袒忿半瓦","k":"魏","kh":6,"mh":6,"g":"男","s":[["透髓","你可以将任意张牌置于牌堆底，视为使用一张需要等量张【闪】抵消的【杀】。",[]],["畜鸣","锁定技，当你对其他角色造成伤害或受到其他角色造成的伤害时，若此伤害：没有对应的实体牌，此伤害+1；有对应的实体牌，其本回合结束时将造成伤害的牌当【借刀杀人】或【过河拆桥】对你使用。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"程昱","t":"泰山捧日","k":"魏","kh":3,"mh":3,"g":"男","s":[["设伏","结束阶段，你可以将一张手牌扣置于武将牌上，称为“伏兵”。 ；你计算与其他角色的距离-X（X为“田”的数量）。",[]],["凿险","觉醒技，准备阶段，若“田”的数量大于等于3，你减1点体力上限，然后获得〖急袭〗。此回合结束后，你获得一个额外回合。",["觉醒技"]],["急袭","你可以将一张“田”当【顺手牵羊】使用。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界典韦","t":"临危横贯","k":"魏","kh":4,"mh":4,"g":"男","s":[["强袭","出牌阶段限两次，你可以受到1点普通伤害或弃置一张武器牌，选择一名于此阶段内未选择过的其他角色，你对其造成1点普通伤害。",[]],["狞恶","锁定技，当一名角色于当前回合内第二次受到伤害后，若其为你或来源为你，你摸一张牌，弃置其场上一张牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界郭淮","t":"临危济难","k":"魏","kh":4,"mh":4,"g":"男","s":[["精策","你每于回合内使用一种花色的手牌，本回合的手牌上限便+1；一名角色的出牌阶段结束时，你可以摸X张牌（X为你本回合使用过牌的类别数）。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界郭皇后","t":"垂宪后叶","k":"魏","kh":3,"mh":3,"g":"女","s":[["矫诏","出牌阶段限一次，你可以将一张牌当本轮没有角色使用过的基本牌或普通锦囊牌使用。",[]],["殚心","当你受到伤害后，你可以摸X张牌，然后修改〖矫诏〗（X为你修改〖矫诏〗的次数）。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界李典","t":"深明大义","k":"魏","kh":3,"mh":3,"g":"男","s":[["恂恂","摸牌阶段开始时，你可以观看牌堆顶的四张牌，将其中两张牌以任意顺序置于牌堆顶，其余以任意顺序置于牌堆底。",[]],["忘隙","当你对其他角色造成1点伤害后，或当你受到其他角色造成的1点伤害后，你可以摸两张牌，然后将其中一张牌交给该角色。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界王异","t":"翳月之夷光","k":"魏","kh":3,"mh":3,"g":"女","s":[["贞烈","当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以失去1点体力令此牌对你无效，然后选择一项：1.获得使用者的一张牌；2.于当前回合（你的回合除外）的结束阶段发动〖秘计〗。",[]],["秘计","结束阶段，若你已受伤，你可以摸X张牌，然后可以将至多X张牌交给其他角色。（X为你已损失的体力值）",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界夏侯渊","t":"虎步关右","k":"魏","kh":4,"mh":4,"g":"男","s":[["神速","你可以做出如下选择：1.跳过判定阶段和摸牌阶段；2.跳过出牌阶段并弃置一张装备牌；3.跳过弃牌阶段并翻面。你每选择一项，便视为使用一张无距离限制的【杀】。",[]],["设变","当你翻面后，你可以移动场上一张装备牌。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界辛宪英","t":"镜鉴","k":"魏","kh":3,"mh":3,"g":"女","s":[["才识","当你每轮首次使用一种类别的牌后，你手牌上限+1。然后若你的手牌上限为全场最大，你可以令一名角色回复1点体力，然后此技能本回合失效。",[]],["忠鉴","出牌阶段限一次，你可以展示一名其他角色X张手牌（X为其体力值），然后你展示一张手牌。若其展示的牌包含： 与你展示牌颜色相同的牌，你摸一张牌或弃置其一张牌； 与你展示牌牌名相同的牌，本阶段此技能改为“出牌阶段限两次”。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界徐晃","t":"功逾孙子右","k":"魏","kh":4,"mh":4,"g":"男","s":[["断粮","你可以将一张黑色非锦囊牌当【兵粮寸断】使用。若你于当前回合内未造成过伤害，你使用【兵粮寸断】无距离限制。",[]],["截辎","每回合限一次，当一名角色跳过摸牌阶段后，你可以选择一名角色，若其手牌数为全场最少且没有“辎”，其获得1枚“辎”；否则其摸一张牌。当有“辎”的角色的摸牌阶段结束时，其弃所有“辎”，获得一个额外摸牌阶段。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界荀彧","t":"万岁亭侯","k":"魏","kh":3,"mh":3,"g":"男","s":[["驱虎","出牌阶段限一次，你可以与一名体力值大于你的角色拼点。若你赢，该角色对其攻击范围内你指定的另一名角色造成1点伤害；若你没赢，其对你造成1点伤害。",[]],["节命","当你受到1点伤害后或当你死亡时，你可令一名角色摸X张牌，其将手牌弃置至X张。（X为其体力上限且至多为5）",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界于禁","t":"治法御人","k":"魏","kh":4,"mh":4,"g":"男","s":[["镇军","准备阶段，你可以弃置一名角色X张牌（X为其手牌数减体力值且至少为1），然后选择一项：1.你弃置与其中非装备牌数等量的牌；2.结束阶段，其摸与其中非装备牌数等量的牌。",[]],["毅重","锁定技，体力值大于等于你的角色的黑色【杀】对你无效；手牌数小于等于你的角色无法响应你的黑色【杀】。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界张春华","t":"翦草除根","k":"魏","kh":3,"mh":3,"g":"女","s":[["绝情","锁定技，你造成的伤害均视为体力流失。",["锁定技"]],["伤逝","当你的手牌数小于你已损失的体力值时，你可以将手牌补至已损失体力值。",[]],["翦灭","出牌阶段限一次，你可以选择一名其他角色，你与其同时选择一种颜色，弃置所有各自选择颜色的手牌，然后弃置牌数较多的角色视为对另一名角色使用【决斗】。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界张郃","t":"识变善营","k":"魏","kh":4,"mh":4,"g":"男","s":[["巧变","游戏开始时，你获得2枚“变”标记。你可以弃置一张牌或移除1枚“变”标记并跳过你的一个阶段（准备阶段和结束阶段除外）：若跳过摸牌阶段，你可以获得至多两名角色的各一张手牌；若跳过出牌阶段，你可以移动场上的一张牌。结束阶段开始时，若你的手牌数与之前你的每一回合结束阶段开始时的手牌数均不相等，你获得1枚“变”标记。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界钟会","t":"登岭峨嵋","k":"魏","kh":4,"mh":4,"g":"男","s":[["权计","当你造成或受到伤害后，你可以摸一张牌，当前回合角色将一张手牌置于你的武将牌上，称为“权”。然后若你手牌数最多，你将一张手牌置为“权”。每有一张“权”，你的手牌上限便+1。",[]],["自立","觉醒技，每个准备阶段，若你“权”的数量大于等于3，你回复1点体力或摸两张牌，然后获得〖排异〗。",["觉醒技"]],["排异","出牌阶段限一次，你可以移去半数“权”（向上取整），指定一名角色并选择：1.其摸两张牌；2.你对其造成1点伤害。然后若其手牌数大于你，执行另一项，本阶段此技能改为限两次。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-一将","n":"嵇康","t":"峻峰孤松","k":"魏","kh":3,"mh":3,"g":"男","s":[["清弦","当你受到伤害/回复体力后，若没有角色处于濒死状态，你可以选择一项令伤害来源/一名其他角色执行：1.失去1点体力并随机使用牌堆一张装备牌；2.回复1点体力并弃置一张装备牌。若其使用或弃置的牌花色为♣，你摸一张牌。",[]],["绝响","当你死亡时，你可以令一名其他角色随机获得〖激弦〗〖烈弦〗〖柔弦〗〖和弦〗中的一个技能，然后直到其下回合开始前，该角色不能成为除其以外的角色使用♣牌的目标。",[]],["激弦","当你受到伤害后，若没有角色处于濒死状态，你可以令伤害来源失去1点体力并随机使用牌堆一张装备牌。",["衍生技"]],["烈弦","当你回复体力后，若没有角色处于濒死状态，你可以令一名其他角色失去1点体力并随机使用牌堆一张装备牌。",["衍生技"]],["柔弦","当你受到伤害后，若没有角色处于濒死状态，你可以令伤害来源回复1点体力并弃置一张装备牌。",["衍生技"]],["和弦","当你回复体力后，若没有角色处于濒死状态，你可以令一名其他角色回复1点体力并弃置一张装备牌。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"乐曹洪","t":"","k":"魏","kh":4,"mh":4,"g":"男","s":[["摸金","锁定技，游戏开始时，你进行一次“摸金”。每当“摸金”成功后，你获得奖励并重新进行一次“摸金”。回合开始时，将【洛阳铲】置入你的武器栏。",["锁定技"]],["定宝","限定技，出牌阶段，你可以直接完成一次“摸金”并结束此阶段。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"乐曹丕","t":"","k":"魏","kh":2,"mh":4,"g":"男","s":[["魏代","锁定技，当魏势力角色对你使用牌后，你增加1点体力上限，若因此你的体力上限全场最大，你将体力上限调整至体力值，并摸失去体力上限张牌。若摸牌数大于等于存活角色数，你将一名角色势力改为魏。",["锁定技"]],["梁姿","锁定技，你的装备牌只能当【酒】使用，且每回合前X张【酒】无次数限制（X为场上魏势力角色数）。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"乐邓艾","t":"期期艾艾","k":"魏","kh":3,"mh":5,"g":"男","s":[["暗度","锁定技，当你使用一张“阴平”牌结算结束后，随机获得一名其他角色手牌中的一张“阴平”牌。",["锁定技"]],["期期","每轮限一次，当你使用牌指定目标时，若牌名字数不小于你的体力值，你可以摸两张牌，令此牌额外结算一次并进行判定，若为♥，你减1点体力上限。",[]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"乐钟会","t":"","k":"魏","kh":3,"mh":3,"g":"男","s":[["明忠","每轮开始时，将你的随机半数手牌标记为“忠”，将其他角色的随机半数手牌标记为“内”。有“忠”于你回合内被使用、打出或弃置后，你选择一项：1.回复1点体力；2.视为使用一张本回合被使用过的基本牌或普通锦囊牌（没有角色处于濒死状态方可选择）；有“内”被使用、打出或弃置后，你于结束阶段对该角色造成1点伤害。",[]],["昏君","锁定技，你脱离濒死状态后，令你进入濒死状态的角色弃置所有牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"李通","t":"万亿吾独往","k":"魏","kh":4,"mh":4,"g":"男","s":[["推锋","当你受到1点伤害后，你可以将一张牌置于武将牌上，称为“锋”。准备阶段，若你的武将牌上有“锋”，你将所有“锋”置入弃牌堆，摸2X张牌，然后你于此回合的出牌阶段内使用【杀】的次数上限+X（X为你此次置入弃牌堆的“锋”数）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"刘晔","t":"算谋励樑","k":"魏","kh":3,"mh":3,"g":"男","s":[["平垣","游戏开始时或回合开始时，若你的装备区没有【霹雳车】，你可以将之置入装备区（替换原装备）并摸一张牌；若你的装备区有【霹雳车】，你可以移动之或视为使用一张【杀】。",[]],["料意","当前回合角色本回合首次对你使用牌时，你可以选择一项：1.摸一张牌；2.令此牌对你无效。然后你不能再对其发动此技能。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"李婉","t":"遐雁归迩","k":"魏","kh":3,"mh":3,"g":"女","s":[["联句","结束阶段，你可以令一名其他角色获得弃牌堆里你于本回合内使用过的至多两张颜色相同的牌，然后其下个结束阶段，你可以获得弃牌堆中其于此回合内使用过的另一种颜色的至多两张牌。",[]],["思闾","锁定技，一名角色因〖联句〗获得的牌称为“闾”；当你受到伤害后，你摸一张牌并称为“闾”。当一名角色的“闾”因弃置进入弃牌堆后，其获得之。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"鲁芝","t":"夷夏慕德","k":"魏","kh":3,"mh":3,"g":"男","s":[["清忠","出牌阶段开始时，你可以摸两张牌，然后本阶段结束时，你与一名手牌数最少的角色交换手牌。",[]],["卫境","每轮限一次，当你需要使用【杀】或【闪】时，你可以视为使用之。",[]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔曹操","t":"逆溯的帝魔","k":"魏","kh":4,"mh":4,"g":"男","s":[["霸朝","出牌阶段开始时，你可以令所有其他角色同时选择是否交给你一张牌，然后你可以对未以此法交给你非基本牌的一名角色造成1点伤害，若你选择自己，本阶段你使用当前手牌无次数和距离限制并入魔。",[]],["覆载","锁定技，你不能使用装备牌且只能将你的装备牌当【借刀杀人】或【无中生有】使用；若你的装备区里没有牌，则你视为装备着一张随机的武器牌和防具牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔司马懿","t":"无天的魔狼","k":"魏","kh":3,"mh":3,"g":"男","s":[["诡伏","每轮开始时或你体力值变化后，你获得一张不计入手牌上限的【闪】。当技能或牌造成伤害后，你记录此技能或牌名。你可以将因此技能获得的【闪】当记录的牌名使用（不计入次数限制，每回合每种牌名限一次）。",[]],["谋变","准备阶段，若你的“诡伏”记录不小于3，你可以入魔，获得记录的技能，然后获得技能〖骤袭〗。",[]],["骤袭","准备阶段，你从三个可造成伤害的技能中选择一个获得直到你下回合开始。受到你伤害的角色于本轮结束时视为对你使用一张【杀】。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋程昱","t":"岁聿责谋","k":"魏","kh":3,"mh":3,"g":"男","s":[["戾断","你使用【杀】后，令你使用的下一张锦囊牌可以多指定一个目标；你使用锦囊牌后，令你使用的下一张【杀】可以多指定一个目标。",[]],["胆持","每回合限一次，距离1以内的角色受到伤害后，你可以令受到伤害的角色选择一个类型。然后伤害来源本回合使用下一张牌后，你视为使用一张【无中生有】，若与“胆持”选择的类型不同，你额外可以视为使用一张【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋邓艾","t":"曜威奋武","k":"魏","kh":4,"mh":5,"g":"男","s":[["积谷","锁定技，一名角色于其出牌阶段外使用的牌置入弃牌堆后，若“谷”数小于你的体力上限，将其中的非♥牌置于你的武将牌上，称为“谷”。体力上限与你相同的角色回合开始时，你用任意张手牌替换等量“谷”。",["锁定技"]],["解腕","每个准备阶段，你可以减1点体力上限或移除两张“谷”，然后你可以将一张手牌当距离限制为X的【顺手牵羊】使用（X为你的“谷”数，至少为1）。每个结束阶段，若你的“谷”数与手牌数相同且你的体力上限不为全场唯一最多，你加1点体力上限。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋董昭","t":"天阶登志","k":"魏","kh":3,"mh":3,"g":"男","s":[["顺机","每轮每名角色限一次，当一名角色受到伤害后，你可以摸至多两张牌，然后交给其等量张牌。若你因此失去了一个牌名的所有牌（每个牌名限一次），你对其造成1点伤害。",[]],["移势","出牌阶段限一次，你可保留手牌中每个花色各一张牌并展示，将其余牌置入弃牌堆，然后移动场上的一张牌。若你未因此失去手牌，直到你的下个回合开始，你不因使用失去与移动牌花色相同的牌后，摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋郭嘉","t":"纵才扬军","k":"魏","kh":3,"mh":3,"g":"男","s":[["定论","出牌阶段限一次，你可以选择至多半数角色（向上取整），若这些角色的手牌数之和大于其他角色手牌数之和，这些角色获得〖趋袭〗至你下一个准备阶段并摸一张牌。",[]],["解罹","每轮限一次，当你成为一张牌的唯一目标时，你可以选择一项：1.由你重新选定此牌的目标；2.观看一名其他角色的所有手牌获得其中与此牌花色相同的牌。",[]],["趋袭","出牌阶段各限一次，你的【闪】/【桃】可以当做【过河拆桥】/【顺手牵羊】使用。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋戏志才","t":"烬途明灯","k":"魏","kh":3,"mh":3,"g":"男","s":[["薪传","当你使用的锦囊牌置入弃牌堆后，你可以令一名角色依次摸X张牌并依次弃置X张牌（X为本回合弃牌堆缺失的花色数），若其手牌数变为体力值，其下家继续执行剩余流程。",[]],["金烬","你可以移出本回合弃牌堆中任意张不同花色的牌并失去本技能视为使用一张普通锦囊牌，然后你下次受到伤害的回合结束时令一名角色获得移出牌和本技能。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"牛金","t":"独进的兵胆","k":"魏","kh":4,"mh":4,"g":"男","s":[["挫锐","锁定技，游戏开始时，你将手牌数摸至X张（X为场上角色数）。当你成为延时锦囊牌的目标后，你跳过下个判定阶段。",["锁定技"]],["裂围","当你杀死一名角色时，你可以摸三张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"裴秀","t":"雅量弘博","k":"魏","kh":4,"mh":4,"g":"男","s":[["茂著","锁定技，回合开始，或你绘制了一幅“地图”的所有城市，你将手牌中的花色补至4，并展开一幅“地图”。回合结束时，你获得一个本回合已展开的“地图”技能，直到你下回合结束。",["锁定技"]],["尽览","当你于回合内使用♠/♥/♣/♦牌后，你可以绘制东/西/南/北方位的所有“地图”。你绘制一座城市后，执行对应城市的效果。",[]],["采风","出牌阶段每幅地图限一次，你可以弃置任意张牌，然后从牌堆或弃牌堆中随机获得等量张其余花色的牌。",[]]],"r":[],"vi":1,"vt":2},{"p":"OL","sp":"OL-其他","n":"裴秀","t":"勋德茂著","k":"魏","kh":4,"mh":4,"g":"男","s":[["茂著","锁定技，你使用【杀】的次数上限和手牌上限+X（X为你的技能数）；当你于出牌阶段内首次造成伤害时，若受伤角色的技能数少于你，则此伤害+1。",["锁定技"]],["尽览","出牌阶段限一次，你可以将手牌摸至X张（X为存活角色中技能最多角色的技能数）。",[]]],"r":[],"vi":2,"vt":2},{"p":"OL","sp":"OL-璀璨星河","n":"牵招","t":"雁门无烟","k":"魏","kh":4,"mh":4,"g":"男","s":[["威抚","出牌阶段，你可以弃置一张牌并判定，你本回合下次使用与判定牌类别相同的牌无距离限制且可以多指定一个目标；若弃置牌与判定牌类别相同，你摸一张牌。",[]],["款塞","每回合限一次，当一张牌指定目标后，若目标数不小于你的体力值，你可以令其中一个目标选择一项：1.交给你一张牌；2.你回复1点体力。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"清河公主","t":"魏长公主","k":"魏","kh":3,"mh":3,"g":"女","s":[["谮构","当你攻击范围内一名角色使用【闪】时，你可以弃置一张非基本牌或失去1点体力，令此【闪】无效，然后你获得之。",[]],["长姬","一名角色的结束阶段，若你本回合：造成过伤害，你可以令其摸两张牌；受到过伤害，你可以令其弃置两张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"秦朗","t":"跼高蹐厚","k":"魏","kh":3,"mh":3,"g":"男","s":[["贤膺","准备阶段或当你受到伤害后，你可以摸两张牌并弃置任意张牌（不能是本轮以此法弃置过的张数），若弃置牌同名，你可以于本回合结束时视为使用之。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"唐咨","t":"工学之奇才","k":"魏","kh":4,"mh":4,"g":"男","s":[["兴棹","锁定技，场上受伤的角色为：1个或以上，你拥有技能〖恂恂〗；2个或以上，你使用装备牌时摸一张牌；3个或以上，你跳过弃牌阶段。",["锁定技"]],["恂恂","摸牌阶段开始时，你可以观看牌堆顶的四张牌，将其中两张牌以任意顺序置于牌堆顶，其余以任意顺序置于牌堆底。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"田豫","t":"威震北疆","k":"魏","kh":4,"mh":4,"g":"男","s":[["扫狄","当你使用【杀】或普通锦囊牌仅指定一名其他角色为目标时，你可以令你与其之间（计算座次较短的方向）的角色均成为此牌的目标。",[]],["追讨","准备阶段，你可以令你与一名未以此法减少距离的其他角色的距离-1。当你对其造成伤害后，失去你以此法对其减少的距离。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"王皑","t":"流水行云","k":"魏","kh":4,"mh":4,"g":"女","s":[["勤励","准备阶段或当你受到1点伤害后，你摸一张牌。每回合结束时，你可以将所有“勤励”牌置入弃牌堆，对当前回合角色造成1点伤害。若你因此失去所有手牌，改为对其造成等量伤害。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"王瓘","t":"假降误撞","k":"魏","kh":3,"mh":3,"g":"男","s":[["谬焰","转换技，阳：你可以将一张黑色牌当【火攻】使用，若此牌造成伤害，你获得本阶段展示过的所有手牌；阴：你可以将一张黑色牌当【火攻】使用，若此牌未造成伤害，本轮本技能失效。",["转换技"]],["失路","锁定技，当你受到伤害后，你摸等同体力值张牌并展示攻击范围内一名其他角色的一张手牌，令此牌视为【杀】。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"王朗","t":"凤鹛","k":"魏","kh":3,"mh":3,"g":"男","s":[["鼓舌","出牌阶段限一次，你可以用一张手牌与至多三名角色同时拼点，然后依次结算拼点结果，没赢的角色选择一项：1.弃置一张牌；2.令你摸一张牌。若拼点没赢的角色是你，你需先获得一个“饶舌”标记（你有7个饶舌标记时，你死亡）。",[]],["激词","当你的拼点牌亮出后，若点数不大于X，你可以令点数+X并视为此阶段未发动过〖鼓舌〗。（X为你“饶舌”标记的数量）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"文钦","t":"困兽鸱张","k":"魏","kh":4,"mh":4,"g":"男","s":[["犷骜","你使用【杀】可以额外指定一个目标；其他角色使用【杀】可以额外指定你为目标（均有距离限制）。以此法使用的【杀】指定目标后，若你的手牌数为偶数，你摸一张牌，令此【杀】对任意名角色无效。",[]],["彗企","觉醒技，每个回合结束时，若本回合仅有包括你的三名角色成为过牌的目标，你回复1点体力并获得〖偕举〗。",["觉醒技"]],["偕举","出牌阶段限一次，你可以选择令任意名本回合成为过牌的目标的角色，这些角色依次可以将一张黑色牌当【杀】使用。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"夏侯恩","t":"长坂剑圣","k":"魏","kh":4,"mh":4,"g":"男","s":[["引锋","锁定技，游戏开始时，你将【赤血青锋】置入手牌。【赤血青锋】因弃置进入弃牌堆后，你失去1点体力并获得之。当其他角色得到你的手牌后，若你手牌中有【赤血青锋】，你对其造成1点伤害；若其获得了【赤血青锋】，其对你造成1点伤害。",["锁定技"]],["负掳","当你使用【杀】结算后，你可以交给一名目标角色一张手牌，然后获得其至多两张手牌。体力值小于你的角色使用【杀】结算后，若你为此【杀】目标，其可以交给你一张手牌，然后获得你至多两张手牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"夏侯玄","t":"朗朗日月","k":"魏","kh":3,"mh":3,"g":"男","s":[["宦浮","当你使用【杀】指定目标后或成为【杀】的目标后，你可以弃置任意张牌（至多为你的体力上限），此【杀】结算后，若对目标角色造成的伤害值为弃牌数，你摸弃牌数两倍的牌。",[]],["清议","出牌阶段限一次，你可以与至多两名有牌的其他角色同时弃置一张牌，若类型相同，你可以重复此流程。若以此法弃置了两种颜色的牌，结束阶段，你可以获得其中颜色不同的牌各一张。",[]],["迮阅","限定技，准备阶段，你可以令一名你上个回合结束后（首轮为游戏开始后）对你造成过伤害的其他角色失去武将牌上一个技能（锁定技、觉醒技、限定技除外）。每轮开始时，其视为对你使用X张【杀】（X为其已失去此技能的轮数），当你受到此【杀】伤害后，其获得以此法失去的技能。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"辛毗","t":"一节肃六军","k":"魏","kh":3,"mh":3,"g":"男","s":[["持节","每回合限一次，当你受到其他角色使用伤害牌造成的伤害后，你可以令此伤害牌无效；当其他角色对你使用牌后，若此牌未造成伤害，你可以获得之。",[]],["引裾","限定技，出牌阶段，你可以选择一名其他角色。本回合：1.当你对其造成伤害时，改为令其回复等量的体力；2.当你使用牌指定该角色为目标后，你与其各摸一张牌。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-一将","n":"辛宪英","t":"名门智女","k":"魏","kh":3,"mh":3,"g":"女","s":[["忠鉴","出牌阶段限一次，你可以展示一张手牌，并展示一名其他角色的X张手牌（X为其体力值）。若其以此法展示的牌与你展示的牌中：有颜色相同，你摸一张牌或弃置一名其他角色的一张牌；有点数相同，本回合此技能改为“出牌阶段限两次”；均不同，你的手牌上限-1。",[]],["才识","摸牌阶段开始时，你可以选择一项：1.手牌上限+1；2.回复1点体力，本回合你不能对自己使用牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"戏志才","t":"负俗的夭才","k":"魏","kh":3,"mh":3,"g":"男","s":[["天妒","当你的判定牌生效后，你可以获得之。",[]],["先辅","锁定技，游戏开始时，你选择一名其他角色，当其受到伤害后，若其存活，你受到等量的伤害；当其回复体力后，你回复等量的体力。",["锁定技"]],["筹策","当你受到1点伤害后，你可以进行判定，若结果为：黑色，你弃置一名角色区域里的一张牌；红色，你令一名角色摸一张牌（先辅的角色摸两张）。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"薛灵芸","t":"红烛垂泪","k":"魏","kh":3,"mh":3,"g":"女","s":[["思泣","当你的牌移至弃牌堆后，你将其中的红色牌置于牌堆底。当你受到伤害后，你可以亮出牌堆底的X张牌（X为从牌堆底开始连续的红色牌数且至多为3），依次可以使用其中的所有【桃】、【无中生有】和装备牌（可以对其他角色使用），然后摸等同于其他牌数的牌。",[]],["巧织","出牌阶段，你可以弃置一张牌，亮出牌堆顶的两张牌，获得其中的一张牌。此技能于你以此法得到的牌从你的手牌区离开之前无效。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"杨阜","t":"匪拯之正","k":"魏","kh":4,"mh":4,"g":"男","s":[["屏忠","锁定技，你每回合使用的前X张牌可以额外指定至多X个目标；当你受到伤害后，你摸X张牌（X为没有手牌的角色数+1）。",["锁定技"]],["肃衣","出牌阶段限一次，你可以令一名其他角色随机使用牌堆中的一张装备牌，然后视为对其使用一张【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-一将","n":"于禁","t":"弗克其终","k":"魏","kh":4,"mh":4,"g":"男","s":[["镇军","准备阶段，你可以弃置一名角色X张牌（X为其手牌数减体力值且至少为1），然后你选择一项：1.弃置其中非装备牌张数的牌；2.该角色摸其中非装备牌张数的牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"张昌蒲","t":"矜严明训","k":"魏","kh":3,"mh":3,"g":"女","s":[["严教","出牌阶段限一次，你可以选择一名其他角色并亮出牌堆顶的四张牌，然后令该角色将这些牌分成点数之和相等的两组牌分配给你与其，剩余未分组的牌置入弃牌堆。若未分组的牌超过一张，你本回合手牌上限-1。",[]],["省身","当你受到伤害后，你可以摸随机1~2张牌且令下一次发动〖严教〗亮出的牌数+X（X为你已损失体力值，至多亮出十张）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"赵俨","t":"刚毅有度","k":"魏","kh":4,"mh":4,"g":"男","s":[["同协","出牌阶段开始时，你可以令你与至多两名其他角色直到你的下回合开始成为“同协”角色，然后令其中手牌唯一最少的角色摸一张牌。 当同协角色不以此法使用的仅指定唯一目标的【杀】结算后，其他同协角色可以依次对目标使用一张无距离限制的【杀】。 当同协角色受到伤害时，本回合未失去过体力的其他同协角色可以防止此伤害并失去1点体力。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"诸葛诞","t":"薤露蒿里","k":"魏","kh":4,"mh":4,"g":"男","s":[["功獒","锁定技，当一名角色死亡后，你增加1点体力上限，回复1点体力。",["锁定技"]],["举义","觉醒技，准备阶段，若你体力上限大于存活角色数，你摸X张牌（X为你的体力上限），然后获得技能〖崩坏〗和〖威重〗。",["觉醒技"]],["崩坏","锁定技，结束阶段，若你不是体力值最小的角色，你选择：1.减1点体力上限；2.失去1点体力。",["锁定技","衍生技"]],["威重","锁定技，每当你的体力上限变化时，若你手牌数：不为全场最少，你摸一张牌；为全场最少，你摸两张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"朱灵","t":"良将之亚","k":"魏","kh":4,"mh":4,"g":"男","s":[["急陷","摸牌阶段结束时，你可以视为对 蜀","kh":3,"mh":3,"g":"男","s":[["散谣","出牌阶段各限一次，你可以弃置一张牌，对一名体力值最大/手牌数最多的角色造成1点伤害。",[]],["制蛮","当你对其他角色造成伤害时，你可以防止此伤害，然后获得其区域内一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"马云騄","t":"剑胆琴心","k":"蜀","kh":4,"mh":4,"g":"女","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["凤魄","当你于回合内首次使用【杀】或【决斗】指定目标后，你可以选择一项：1.摸X张牌；2.此牌伤害+X（X为其♦手牌数）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"马忠","t":"笑合南中","k":"蜀","kh":4,"mh":4,"g":"男","s":[["抚蛮","出牌阶段每名角色限一次，你可以将一张手牌交给一名其他角色，此牌视为【杀】直到离开其手牌区。当其使用此【杀】结算后，你摸一张牌；若此【杀】造成过伤害，你改为摸两张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孟达","t":"腾挪反复","k":"蜀","kh":4,"mh":4,"g":"男","s":[["苟得","每回合结束时，若有势力相同的角色此回合执行过以下效果，你可以执行另一项：1.摸一张牌；2.弃置一名角色一张手牌；3.视为使用一张【杀】；4.变更势力。",[]]],"r":[]},{"p":"OL","sp":"OL-神话","n":"孟获","t":"南蛮王","k":"蜀","kh":4,"mh":4,"g":"男","s":[["祸首","锁定技，【南蛮入侵】对你无效；当其他角色使用【南蛮入侵】指定目标后，你代替其成为此牌造成的伤害的来源。",["锁定技"]],["再起","摸牌阶段，若你已受伤，你可以放弃摸牌，改为亮出牌堆顶X+1张牌（X为你已损失体力值），你将其中的♥牌置入弃牌堆并回复等量体力，获得其余的牌。",[]]],"r":[],"vi":2,"vt":2},{"p":"OL","sp":"OL-璀璨星河","n":"糜竺","t":"挥金追义","k":"蜀","kh":3,"mh":3,"g":"男","s":[["资援","出牌阶段限一次，你可以将任意张点数之和为13的手牌交给一名其他角色，然后该角色回复1点体力。",[]],["巨贾","锁定技，你的手牌上限+X；游戏开始时，你摸X张牌。（X为你的体力上限）",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋关羽","t":"威震华夏","k":"蜀","kh":4,"mh":4,"g":"男","s":[["威临","每回合限一次，你可以将一张牌当任意一种【杀】或【酒】使用。此牌指定目标后，你令其所有与此牌颜色相同的手牌均视为【杀】直到回合结束。",[]],["夺首","锁定技，每回合你首次使用红色牌无距离限制、首次使用基本牌不计入限制的次数、首次造成伤害后摸一张牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋黄月英","t":"才惠双绝","k":"蜀","kh":3,"mh":3,"g":"女","s":[["理贤","当你受到伤害后，你可将一张牌当【无中生有】使用。当你以此法使用过三种不同牌名的锦囊牌后，此技能于你的结束阶段也可发动。",[]],["并才","每回合第一张基本牌被使用时，你可重铸一张牌，若这两张牌均为伤害牌或非伤害牌，则此牌额外结算一次。然后若重铸的牌为锦囊牌，你为〖理贤〗添加一个牌名：【顺手牵羊】；【过河拆桥】；【铁索连环】。以上牌名均添加完后，〖理贤〗于你的准备阶段也可发动。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋姜维","t":"炎志灼心","k":"蜀","kh":4,"mh":4,"g":"男","s":[["逐日","你的阶段结束时，若你本阶段手牌数变化过，你可以拼点：若你赢，你可以使用一张拼点牌；若你没赢，你失去1点体力或本技能直到回合结束。",[]],["燃己","限定技，结束阶段，若你本回合使用过牌的阶段数：不小于体力值，你可以获得〖困奋〗；不大于体力值，你可以获得〖诈降〗。若如此做，你将手牌数或体力值调整至体力上限，然后你不能回复体力，直到你杀死角色。",["限定技"]],["困奋","结束阶段，你可以失去1点体力，然后摸两张牌。",["衍生技"]],["诈降","锁定技，当你失去1点体力后，你摸三张牌，若在你的出牌阶段，你本回合你使用【杀】次数上限+1、使用红色【杀】无距离限制且不可被响应。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋孟获","t":"","k":"蜀","kh":4,"mh":4,"g":"男","s":[["击虚","每回合各限一次，你使用伤害牌时，你可以观看一个目标的手牌并可以用一张手牌交换其中一张牌，若交换牌中有能响应该伤害牌的牌，你摸两张牌；你使用伤害牌后，若造成了伤害，你可以将任意张牌当【决斗】对等量角色使用。",[]],["再砺","每回合限一次，当本回合弃牌堆中【杀】的数量等于你已损失体力值时，你可以将这些牌交给一名角色，然后〖击虚〗视为未发动过。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋庞统","t":"定鼎巴蜀","k":"蜀","kh":3,"mh":3,"g":"男","s":[["鸿图","每阶段结束时，若你于此阶段获得过至少两张牌，你可摸三张牌，展示三张手牌令一名其他角色选择一张使用，随机弃置另一张牌。若使用牌点数于三张牌中：最大，其获得〖飞军〗至其下个回合结束；不为最大和最小，其获得〖潜袭〗至其下个回合结束；最小，其手牌上限+2至其下个回合结束。若其未以此法使用牌，你对其与你各造成1点火焰伤害。",[]],["栖梧","每回合你首次受到伤害时，若伤害来源为你或在你攻击范围内，你可弃置一张红色牌，防止此伤害。",[]],["飞军","出牌阶段限一次，你可以弃置一张牌，然后选择一项：1.令一名手牌数大于你的角色交给你一张牌；2.令一名装备区里牌数大于你的角色弃置一张装备区里的牌。",["衍生技"]],["潜袭","准备阶段，你可以摸一张牌然后弃置一张牌。若如此做，你选择距离为1的一名角色，然后直到回合结束，该角色不能使用或打出与你以此法弃置的牌颜色相同的手牌。",["衍生技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋张飞","t":"虎烈匡国","k":"蜀","kh":4,"mh":4,"g":"男","s":[["敬贤","出牌阶段每名角色限一次，你可以交给其至多两张非基本牌，然后其选择等量项：1.其与你各摸一张牌；2.令你从牌堆中获得一张【杀】。",[]],["狭勇","出牌阶段限一次，你可以选择一名其他角色，直到其下个回合结束：你处于【酒】的状态；其对除其以外的角色使用牌后，你可以对其使用一张无视防具的【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋赵云","t":"白首之心","k":"蜀","kh":4,"mh":4,"g":"男","s":[["逆澜","当你不因此技能造成伤害后，你可以执行一项：1.弃置所有手牌，若其中有【杀】，则你可以对一名其他角色造成1点伤害；2.摸两张牌。若如此做，你下一次受到伤害后可以执行另一项。",[]],["绝崖","若你没有手牌，你可以于需要时视为使用一张基本牌（每种牌名限一次）。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋诸葛亮","t":"武侯","k":"蜀","kh":3,"mh":3,"g":"男","s":[["知天","出牌阶段，牌堆顶的7张牌对你可见。你的【火攻】结算中，你可观看并选择牌堆顶7张牌中的一张牌代替【火攻】弃牌。",[]],["武靖","锁定技，你的回合内，有牌不因使用而进入弃牌堆后，你使用的下一张牌无次数限制；每回合首次有不为手牌的牌进入弃牌堆后，你摸一张牌。",["锁定技"]],["智绝","转换技，出牌阶段，阳：你可将牌堆顶的一张牌当【火攻】使用；阴：将一种颜色的手牌置入弃牌堆（每种颜色每回合限一次），然后可视为使用其中一张基本或普通锦囊牌。若未造成伤害，你令〖知天〗可见牌与观看牌数-1（至少为1），然后你摸2张牌。",["转换技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋祝融","t":"见放崇山","k":"蜀","kh":4,"mh":4,"g":"女","s":[["刃掣","出牌阶段限X次，你可以弃置X张牌并令至多X名其他角色各弃置一张牌（X为本回合弃牌堆中【杀】的数量且至少为1）。每有角色因此弃置牌不为【杀】，你便摸一张牌。",[]],["牙镰","每阶段结束时，若你此阶段不因使用失去过【杀】，你可以视为对任意名手牌数小于等于X的角色使用一张火【杀】（X为本回合弃牌堆中【杀】的数量且至少为1）。",[]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔张飞","t":"祭命的战神","k":"蜀","kh":5,"mh":5,"g":"男","s":[["灼魂","锁定技，你的回合内：你的【闪】均视为【杀】；一名角色的勾玉首次变为一个颜色后，你摸一张牌。",["锁定技"]],["瞋视","锁定技，若其他角色的勾玉颜色与你：\n不同，你使用黑色【杀】能额外指定其为目标；\n相同，你对其，或其对你使用的黑色【杀】改为【决斗】。\n你因【杀】和【决斗】首次造成了或受到了至少3点伤害后，你回复1点体力，修改〖灼魂〗并入魔。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"彭羕","t":"翻然轻举","k":"蜀","kh":3,"mh":3,"g":"男","s":[["嚣翻","当你需要使用牌时，你可以观看牌堆底的X+1张牌，使用其中你需要的牌，然后弃置你的前X区域里的所有牌：1.判定区；2.装备区；3.手牌区。（X为你于当前回合内使用过的牌的类别数）",[]],["侻失","锁定技，你不能使用【无懈可击】。你使用点数为字母的牌无效并摸一张牌，且下次对手牌数小于你的角色使用牌无距离和次数限制。当你一回合内使用过三张未造成过伤害的伤害类牌后，〖嚣翻〗于此回合内失效。",["锁定技"]],["寸目","锁定技，当你摸牌时，改为从牌堆底摸牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"蒲元","t":"鬼斧神工","k":"蜀","kh":4,"mh":4,"g":"男","s":[["神工","出牌阶段各限一次，你可以弃置一张武器/防具/坐骑或宝物牌，进行一次“锻造”，选择一张武器/防具/宝物牌置于一名角色的装备区（替换原装备）。当以此法获得的装备牌进入弃牌堆时，销毁之，然后此回合结束阶段，你摸一张牌。",[]],["奇思","游戏开始时，将两张不同副类别的装备牌并置入你的装备区。摸牌阶段，你可以声明一种装备牌副类别，若牌堆或弃牌堆中有符合的牌，你获得其中一张且本阶段少摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-江山如故","n":"闪赵云","t":"北伐之柱","k":"蜀","kh":4,"mh":4,"g":"男","s":[["龙临","当其他角色于其出牌阶段内首次使用【杀】指定目标后，你可以弃置一张牌令此【杀】无效，然后其可以视为对你使用一张【决斗】，你以此法造成伤害后，其本阶段使用的下一张牌不能指定除其以外的角色为目标。",[]],["镇胆","你可以将一张非基本手牌当你本轮未使用过的基本牌使用或打出；当你受到伤害后或每轮结束时，你摸X张牌，然后此技能本轮失效（X为本轮所有角色执行完毕过的回合数且至多为5）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙乾","t":"折冲樽俎","k":"蜀","kh":3,"mh":3,"g":"男","s":[["谦雅","当你成为锦囊牌的目标后，你可以将任意张手牌交给一名其他角色。",[]],["说盟","出牌阶段结束时，你可以与一名角色拼点，若你赢，视为你使用【无中生有】；若你没赢，视为其对你使用【过河拆桥】。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"卧龙凤雏","t":"一匡天下","k":"蜀","kh":4,"mh":4,"g":"男","s":[["游龙","转换技，每轮各限一次，你可以废除一个装备栏并视为使用一张未以此法使用过的：阳：普通锦囊牌；阴：基本牌。",["转换技"]],["鸾凤","限定技，当一名角色处于濒死状态时，若其体力上限不小于你，你可以令其将体力回复至3点，恢复其被废除的装备栏，令其手牌补至6-X张（X为以此法恢复的装备栏数量）。若该角色为你，重置你〖游龙〗使用过的牌名。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"许靖","t":"品评名士","k":"蜀","kh":3,"mh":3,"g":"男","s":[["誉虚","当你于出牌阶段内使用牌结算后，你可以摸一张牌，若如此做，当你此阶段使用下一张牌后，你弃置一张牌。",[]],["实荐","一名其他角色于其出牌阶段使用的第二张牌结算结束后，你可以弃置一张牌，令其获得〖誉虚〗直到回合结束。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"杨婉","t":"融沫之鲡","k":"蜀","kh":3,"mh":3,"g":"女","s":[["诱言","出牌和弃牌阶段各限一次，当你的牌因弃置置入弃牌堆后，你可以从牌堆中获得与弃置牌花色不同的牌各一张。",[] 段，若你已受伤，你可以选择一名其他角色并选择一项：1.令其摸X张牌，然后弃置一张牌；2.令其摸一张牌，然后弃置X张牌（X为你已损失的体力值）。",[]],["武烈","限定技，结束阶段，你可以失去任意点体力，令等量的其他角色各获得1枚“烈”标记。当有“烈”的角色受到伤害时，其弃所有“烈”，防止此伤害。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界孙鲁班","t":"","k":"吴","kh":3,"mh":3,"g":"女","s":[["谮毁","当你使用【杀】或普通锦囊牌（不含【借刀杀人】）指定唯一目标时，你可以令另一名能成为此牌目标的其他角色选择一项：1.交给你一张牌并代替你成为此牌的使用者（不计次数）；2.成为此牌的额外目标。若选项与上次不同，你摸一张牌（每回合限一次）。",[]],["骄矜","当你受到伤害时，你可以弃置一张非伤害锦囊牌或装备牌，防止此伤害，并获得造成伤害的牌。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界孙权","t":"东吴大帝","k":"吴","kh":4,"mh":4,"g":"男","s":[["制衡","出牌阶段限一次，你可以弃置任意张牌并摸等量的牌。若你以此法弃置了所有的手牌，你多摸一张牌。",[]],["救援","主公技，其他吴势力角色于其回合内回复体力时，若其体力值不小于你，则其可以改为令你回复1点体力，然后其摸一张牌。",["主公技"]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界太史慈","t":"信义笃烈","k":"吴","kh":4,"mh":4,"g":"男","s":[["天义","出牌阶段限一次，你可以与一名角色拼点：若你赢，在本回合结束之前，你可以多使用一张【杀】、使用【杀】无距离限制且可以多选择一个目标；若你没赢，本回合你不能使用【杀】。",[]],["酣战","当你与其他角色拼点，或其他角色与你拼点时，你可令其改为用随机一张手牌拼点，你拼点后，你可获得其中点数最大的【杀】。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界吴国太","t":"慈怀瑾瑜","k":"吴","kh":3,"mh":3,"g":"女","s":[["甘露","出牌阶段限一次，你可以令两名角色交换装备区里的牌。若X大于你已损失体力值，你须先弃置X张手牌。（X为其装备区牌数之差）",[]],["补益","当一名角色进入濒死状态时，你可以选择其一张牌，若此牌不为基本牌，其弃置此牌，然后回复1点体力。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界小乔","t":"仙姿玉质","k":"吴","kh":3,"mh":3,"g":"女","s":[["天香","当你受到伤害时，你可以弃置一张♥牌并选择一名其他角色。你防止此伤害并选择一项：1.伤害来源对其造成1点伤害，其摸X张牌（X为其已损失的体力值且至多为5）；2.令其失去1点体力，其获得牌堆或弃牌堆中你以此法弃置的牌。",[]],["红颜","锁定技，你的♠牌或你的♠判定牌的花色视为♥。若你的装备区里有♥牌，你的手牌上限改为体力上限。",["锁定技"]],["飘零","结束阶段，你可判定，然后当判定结果确定后，若为♥，你选择：1.将判定牌置于牌堆顶；2.令一名角色获得判定牌，若其为你，你弃置一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界徐盛","t":"誓卫吴疆","k":"吴","kh":4,"mh":4,"g":"男","s":[["破军","当你使用【杀】指定一个目标后，你可以将其至多X张牌移出游戏直到当前回合结束（X为其体力值）。你使用的【杀】对手牌数与装备区牌数均不大于你的角色造成的伤害+1。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界虞翻","t":"犯颜谏争","k":"吴","kh":3,"mh":3,"g":"男","s":[["纵玄","当你的牌因弃置而置入弃牌堆后，或你上家的牌于当前回合内第一次因弃置而置入弃牌堆后，你可以将其中任意张牌置于牌堆顶。",[]],["直言","你或你上家的结束阶段，你可以令一名角色摸一张牌并展示之，若此牌：为装备牌，其使用此牌并回复1点体力；不为装备牌且其体力值不等于你，其失去1点体力。",[]]],"r":[]},{"p":"OL","sp":"OL-界限突破","n":"界张昭张纮","t":"内事之托","k":"吴","kh":3,"mh":3,"g":"男","s":[["直谏","出牌阶段，你可以将一张装备牌置于其他角色装备区（替换原装备），然后摸一张牌。",[]],["固政","每阶段限一次，当其他角色的至少两张牌因弃置而置入弃牌堆后，你可以令其获得其中一张牌，然后你可以获得剩余牌。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界朱桓","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["奋励","若你的手牌数/体力值/装备区里的牌数为全场最大，你可以跳过摸牌阶段/出牌阶段/弃牌阶段。",[]],["平寇","结束阶段，你可以对至多X名其他角色各造成1点伤害（X为你本回合跳过的阶段数），然后可以摸两张牌并执行一个本回合跳过的阶段。",[]]],"r":[]},{"p":"OL","sp":"OL-界一将","n":"界朱然","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["胆守","出牌阶段每项限一次，若你有牌，你可以选择一名角色执行以下一项：1.你弃置其一张牌；2.你获得其一张牌；3.你对其造成1点伤害；4.你与其各摸两张牌。然后你弃置你本次执行序号数张牌（不足则全弃）。若你因此失去所有手牌，可以令一名角色发动一次仅执行本项的〖胆守〗。",[]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"乐吕蒙","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["精进","出牌阶段限四次，你可以获得牌至四张（若手牌数大于2，则先将手牌弃至2），然后用手牌完成一次24点或结束出牌阶段。你每成功完成一次24点，本阶段使用【杀】次数+1。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"凌操","t":"激流勇进","k":"吴","kh":4,"mh":4,"g":"男","s":[["独进","摸牌阶段，你可以多摸X+1张牌（X为装备区里的牌数的一半且向上取整）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"李异","t":"兼人之勇","k":"吴","kh":4,"mh":4,"g":"男","s":[["缠双","出牌阶段限一次，你可以与一名其他角色同时选择一项执行：1.重铸一张牌；2.使用一张【杀】；3.弃置两张牌。结束阶段，你依次执行上述前X项（X为你本回合以任意方式执行过的项数）。",[]],["蘸金","锁定技，若你的装备区里没有武器牌且你的武器栏未被废除，你视为装备着【贯石斧】。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"陆凯","t":"节概梗梗","k":"吴","kh":3,"mh":3,"g":"男","s":[["玄注","转换技，每回合限一次，阳：你可以将一张牌移出游戏，视为使用任意基本牌；阴：你可以将一张牌移出游戏，视为使用仅指定唯一角色为目标的普通锦囊牌。若移出游戏的牌：不为装备牌，你弃置一张牌；为装备牌，你重铸以此法移出游戏的牌。",["转换技"]],["謇谔","锁定技，当你对其他角色使用的牌生效后，其本回合不能抵消牌；当你抵消牌后，你本回合不能成为牌的目标。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"陆郁生","t":"义姑","k":"吴","kh":3,"mh":3,"g":"女","s":[["藏心","锁定技，摸牌阶段开始时，你展示牌堆底三张牌并摸其中♥牌数的牌。当你每回合首次受到伤害时，你展示牌堆底三张牌并弃置其中任意张牌，令伤害值-X（X为以此法弃置的♥牌数）。",["锁定技"]],["润微","一名角色弃牌阶段开始时，若其已受伤，你可以选择一项：1.令其弃置一张牌，其本回合手牌上限+1；2.令其摸一张牌，其本回合手牌上限-1。",[]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔孙权","t":"隳堕的英谋","k":"吴","kh":4,"mh":4,"g":"男","s":[["权御","锁定技，每轮开始时，你令所有角色同时选择一项“权御”效果（每人每项限一次），然后你摸X张牌（X为本次所选“权御”效果与你相同的角色数，且至多为3）： 白虹，伤害+1； 青冥，目标+1； 辟邪，无视防具； 紫电，不可响应； 百里，额外结算一次； 流星，不计次数。 当你使用【杀】指定唯一目标时，执行你本轮选择的“权御”效果。",["锁定技"]],["天恩","锁定技，每回合每项各限一次，当你使用牌指定唯一目标后，若本轮你与其选择的“权御”效果不同，你随机弃置其一张牌，对其发动一次〖权御〗；若与你相同，你获得一张不计入手牌上限的【杀】。",["锁定技"]],["乾纲","出牌阶段，你可以入魔，失去〖天恩〗，然后本局游戏当你使用【杀】指定唯一目标时，额外执行目标所选择过的所有“权御”效果。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋鲁肃","t":"渊谟肇石城","k":"吴","kh":3,"mh":3,"g":"男","s":[["独断","回合开始时，你可以摸一张牌，令你跳过本回合首个判定、摸牌、出牌、弃牌中的一个阶段（每个阶段每局游戏限跳过一次），然后交换另外两个阶段的顺序。",[]],["英略","出牌阶段各限一次，你可以令一名角色：1.失去1点体力，其下个摸牌阶段摸牌数+2；2.摸两张牌，其下个弃牌阶段手牌上限-2。",[]],["盟势","限定技，结束阶段，你可以失去X点体力（X为两者体力之差），令两名其他角色交换体力值。每个回合结束时，你摸一张牌并回复1点体力，直到其中一名角色死亡。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋孙坚","t":"乌程侯","k":"吴","kh":4,"mh":5,"g":"男","s":[["虎烈","每回合各限一次，当你使用【杀】或【决斗】指定唯一目标后，你可以令此牌伤害+1。此牌结算后，若未造成伤害，你可以令目标角色视为对你使用一张【杀】。",[]],["毅魄","当你的体力值变化后，若当前体力值大于0且为本局游戏首次变化到，你可以选择一名角色并选择一项：1.其摸X张牌，然后弃置一张牌；2.其摸一张牌，然后弃置X张牌。（X为你已损失体力值，至少为1）",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋太史慈","t":"矢志全忠孝","k":"吴","kh":4,"mh":4,"g":"男","s":[["笃烈","每回合限一次，当你成为其他角色使用基本牌或普通锦囊牌的唯一目标时，你可以令此牌的效果结算两次，然后此牌结算结束后，你摸X张牌（X为你的攻击范围且至多为5）。",[]],["斗缠","锁定技，准备阶段，若牌堆中：有【决斗】，你从牌堆中获得一张【决斗】；没有【决斗】，你的攻击范围和出牌阶段使用【杀】的次数上限+1（增加次数至多为游戏人数）。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋小乔","t":"醉月迷花","k":"吴","kh":3,"mh":3,"g":"女","s":[["迷落","出牌阶段限一次，你可以展示并交给至多两名其他角色各一张牌，这些牌本轮称为“迷落”牌。每轮结束时，你可以令其中一名手牌中没有“迷落”牌的角色失去1点体力，或令其中一名手牌中有“迷落”牌的角色回复1点体力。",[]],["绝颜","每轮各限一次，当你需要使用手牌中一张普通锦囊牌或红色基本牌时，可改为展示并视为使用之。你每轮首次展示一种花色的手牌后摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋周瑜","t":"雅量之魁英","k":"吴","kh":4,"mh":4,"g":"男","s":[["顾曲","锁定技，你的回合内：被展示过的手牌称为“阙”；手牌中有“阙”的其他角色只能使用“阙”；“阙”只能因〖醉锋〗转化；当有“阙”被使用后，你摸两张牌。",["锁定技"]],["醉锋","出牌阶段限X次（X为你的体力上限），你可以弃置一个花色的唯一手牌并选择一名角色，你观看其的手牌并展示其中一张。若弃置牌与展示牌花色相同，你对其造成1点火焰伤害。其可以将此牌当【酒】对你使用。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"潘淑","t":"江东神女","k":"吴","kh":3,"mh":3,"g":"女","s":[["威仪","每名角色限一次，当一名角色受到伤害后，若其体力值：1.不小于你，你可以令其失去1点体力；2.不大于你，你可以令其回复1点体力。",[]],["锦织","当你需使用或打出基本牌时，你可以弃置X张颜色相同的牌（为你本轮发动本技能的次数），然后摸一张牌，视为使用或打出此基本牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"乔国老","t":"计结鸾俦","k":"吴","kh":3,"mh":3,"g":"男","s":[["媒言","出牌阶段限一次，你可以与所有体力值大于等于你的角色议事，若议事结果为红色，你获得所有红色意见牌；若议事结果为黑色，你与意见为红色的角色各摸一张牌。",[]],["妁语","每回合限一次，你攻击范围内的角色成为【杀】的目标时，你可以与所有体力值不大于你的角色议事，若意见为红色，弃置所有意见牌，将此【杀】转移给一名未参与议事的角色。",[]],["作保","限定技，你参与的议事展示意见时，你可以令此次议事中，所有♠意见牌视为♥。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-一将","n":"全琮","t":"钱唐侯","k":"吴","kh":4,"mh":4,"g":"男","s":[["邀名","每回合限一次，当你造成或受到伤害后，你可以选择一项：1.弃置手牌数大于你的一名角色一张手牌；2.令手牌数小于你的一名角色摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"屈晃","t":"泥头自缚","k":"吴","kh":3,"mh":3,"g":"男","s":[["切谏","当一名角色失去手牌后，若其没有手牌，你可以与其各摸一张牌，然后选择一项：1.弃置你或其场上的一张牌；2.你本轮内不能对其发动此技能。",[]],["泥首","锁定技，当你装备区里的牌进入弃牌堆后，你选择一项：1.将此牌当【闪电】使用；2.本阶段结束时，你与一名全场手牌数最少的角色交换手牌且本阶段内你无法选择此项。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"芮姬","t":"伶形俐影","k":"吴","kh":3,"mh":3,"g":"女","s":[["巧力","出牌阶段各限一次，1.你可以将一张武器牌当【决斗】使用，此牌对目标角色造成伤害后，你摸与之攻击范围等量张牌，然后可以分配其中任意张牌；2.你可以将一张非武器装备牌当【决斗】使用且不能被响应，然后于结束阶段随机获得一张装备牌。",[]],["清靓","每回合限一次，当你成为其他角色使用的【杀】或伤害锦囊牌的唯一目标时，你可以展示所有手牌并选择一项：1.你与其各摸一张牌；2.弃置一种花色的所有手牌，取消此目标。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"苏飞","t":"与子同袍","k":"吴","kh":4,"mh":4,"g":"男","s":[["联翩","每回合限三次，当你于出牌阶段内使用牌指定目标后，若此牌与你此阶段内使用的上一张牌有共同的目标角色，你可以摸一张牌，然后你可以将摸到的牌交给其中一名角色。",[]]],"r":[]},{"p":"OL","sp":"OL-测试服","n":"孙寒华","t":"","k":"吴","kh":3,"mh":3,"g":"女","s":[["华光","每轮开始时、准备阶段，你可以选择一项：1.将【彩莲】置入一个装备栏；2.修改【彩莲】花色。",[]],["玄白","锁定技，当【彩莲】进入你的一个装备栏后，你切换为不同的形态： 武器栏-〖荡魔〗；防具栏-〖济惠〗；宝物栏-〖霞举〗。",["锁定技"]],["荡魔","锁定技，当你使用仅指定单一目标的伤害牌时，选择一项：1.令此牌额外结算一次；2.令此牌目标数+1。",["锁定技","衍生技"]],["济惠","锁定技，每回合首次有角色回复体力后，你摸一张牌。你本轮首次失去牌数大于体力值后，你获得一张【桃】。",["锁定技","衍生技"]],["霞举","锁定技，你每回合首次失去牌后，你获得一张未拥有花色的牌。若因此凑齐四种花色，下次此技能获得牌数+1。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙皓","t":"时日曷丧","k":"吴","kh":5,"mh":5,"g":"男","s":[["残蚀","摸牌阶段，你可以多摸X张牌（X为已受伤的角色数），若如此做，当你于此回合内使用【杀】或普通锦囊牌时，你弃置一张牌。",[]],["仇海","锁定技，当你受到伤害时，若你没有手牌，你令此伤害+1。",["锁定技"]],["归命","主公技，锁定技，其他吴势力角色于你的摸牌阶段视为已受伤的角色。",["主公技","锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙弘","t":"谮诉构争","k":"吴","kh":3,"mh":3,"g":"男","s":[["险诐","出牌阶段限一次，你可以将手牌调整至与一名角色装备区里的牌数相同，然后每因此弃置一张牌，你随机获得弃牌堆中另一张类型相同的牌。",[]],["谮润","每阶段限一次，当你摸牌时，你可以改为获得一名其他角色等量张牌，然后其选择一项：1.摸等量的牌；2.本局游戏中你发动〖险诐〗和〖谮润〗不能指定其为目标。",[]]],"r":[]},{"p":"OL","sp":"OL-神话","n":"孙亮","t":"寒江枯木","k":"吴","kh":3,"mh":3,"g":"男","s":[["溃诛","弃牌阶段结束时，你可以选择一项：1.令至多X名角色各摸一张牌；2.对任意名体力值之和为X的角色造成1点伤害（X为你此阶段弃置的牌数）。",[]],["掣政","锁定技，你于你的出牌阶段内对攻击范围内不包含你的其他角色造成伤害时，防止之。出牌阶段结束时，若你本阶段使用的牌数小于这些角色数，你弃置其中一名角色一张牌。",["锁定技"]],["立军","主公技，其他吴势力角色的出牌阶段内限一次，当其使用【杀】结算结束后，其可以将此【杀】交给你，然后你可以令其摸一张牌且其此阶段使用【杀】次数上限+1。",["主公技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙鲁育","t":"舍身饲虎","k":"吴","kh":3,"mh":3,"g":"女","s":[["魅步","其他角色的出牌阶段开始时，若你在其攻击范围内，你可以弃置一张牌，然后其本回合视为拥有技能〖止息〗。若你以此法弃置的牌不是【杀】或黑色锦囊牌，则本回合其与你距离为1。",[]],["穆穆","出牌阶段开始时，你可以选择一项：弃置一名其他角色装备区内的一张牌；获得一名角色装备区内的防具牌，然后你本回合不能使用或打出【杀】。",[]],["止息","锁定技，出牌阶段，你至多使用X张牌，你使用锦囊牌后，不能再使用牌（X为你的体力值）。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙茹","t":"淑慎温良","k":"吴","kh":3,"mh":3,"g":"女","s":[["持室","每回合限一次，当前回合角色失去其一个区域内最后一张牌后，你可以令其摸两张牌且本回合手牌上限+2。",[]],["慰勉","出牌阶段限一次，你可以废除至多三个装备栏，然后令一名角色选择等量项：1.恢复一个被废除的装备栏；2.回复1点体力；3.弃置所有手牌，摸四张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙邵","t":"廊庙才","k":"吴","kh":3,"mh":3,"g":"男","s":[["弼政","摸牌阶段结束时，你可令一名其他角色摸两张牌，然后你与其之中，手牌数大于体力上限的角色弃置两张牌。",[]],["佚典","若你使用的基本牌或普通锦囊牌在弃牌堆中没有同名牌，你可以为此牌指定一个额外目标（无距离限制）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孙鸢","t":"仗钺临戎","k":"吴","kh":4,"mh":4,"g":"女","s":[["飒影","出牌阶段开始时，你可以获得一名其他角色区域内的一张牌，然后若你在其攻击范围内，其可以对你使用一张【杀】；若你不在其攻击范围内，本轮你与其视为在对方的攻击范围内。",[]],["恫心","每回合各限一次，当你造成或受到伤害后，你可以弃置受伤角色X+1张牌，对伤害来源造成1点伤害（X为受伤角色已损失体力值），然后你获得弃置的【杀】，你使用这些【杀】无次数限制。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"滕芳兰","t":"铃兰凋落","k":"吴","kh":3,"mh":3,"g":"女","s":[["落宠","准备阶段或当你每回合首次受到伤害后，你可以选择一项，令一名角色：1.回复1点体力；2.失去1点体力；3.弃置两张牌；4.摸两张牌。每轮每项限一次，每轮对每名角色限一次。",[]],["哀尘","锁定技，当你进入濒死状态时，若〖落宠〗选项数大于1，你移除其中一项。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"吴景","t":"助吴征战","k":"吴","kh":4,"mh":4,"g":"男","s":[["合击","一名角色使用仅指定唯一目标的【决斗】或红色【杀】后，你可对同目标使用一张【杀】或【决斗】。若你以此法使用的不为转化牌，你随机获得一张红色牌。",[]],["流兵","锁定技，你每回合使用的第一张实体【杀】的花色视为♦。若其他角色于其出牌阶段内使用的非黑色【杀】未造成伤害，此牌进入弃牌堆后，你获得之。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"吾彦","t":"断浪南竹","k":"吴","kh":4,"mh":4,"g":"男","s":[["澜疆","结束 r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"孔淑","t":"寄在璺","k":"群","kh":3,"mh":3,"g":"女","s":[["累卵","你可以将X张牌当一张你本轮未使用过的基本牌使用（X为已连环的角色数且至少为1）。若你以此法失去最后的手牌，你摸两张牌，从本回合弃牌堆中获得一张普通锦囊牌，然后此技能失效，直到你下次受到伤害后。",[]],["覆巢","锁定技，你使用基本牌后，当前回合角色进入连环状态。每轮结束时，你与已连环的角色各摸一张牌，然后已连环的角色弃置X张牌（X为已连环的角色数且至少为1）。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"狂李儒","t":"殴帝三拳","k":"群","kh":4,"mh":4,"g":"男","s":[["花拳","锁定技，当你使用牌指定其他角色为目标后，你为此牌秘密选择一个效果：重拳，令此牌伤害基数+1；轻拳，此牌使用结算结束后你摸一张牌。然后目标中的所有其他角色同时猜测你选择的效果。",["锁定技"]],["三殴","锁定技，当其他角色受到你造成的伤害后或猜错“花拳”的效果后，你摸一张牌并令其获得一枚“击倒”标记，然后若其拥有至少三枚“击倒”标记，其移去所有“击倒”标记并进入“击倒”状态，直到有10张牌离开牌堆或进入弃牌堆后。处于“击倒”状态的角色跳过其出牌阶段。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"李傕","t":"池阳侯","k":"群","kh":5,"mh":5,"g":"男","s":[["扬武","锁定技，准备阶段，你对所有其他角色各造成1点伤害，然后你失去1点体力。",["锁定技"]],["魔军","锁定技，当友方角色使用【杀】造成伤害后，你判定，若结果为黑色，友方角色各摸一张牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"灵雎","t":"情随梦逝","k":"群","kh":3,"mh":3,"g":"女","s":[["竭缘","当你对其他角色造成伤害时，若其体力值不小于你，你可以弃置一张黑色手牌令此伤害+1；当你受到其他角色造成的伤害时，若其体力值不小于你，你可以弃置一张红色手牌令此伤害-1。",[]],["焚心","锁定技，当一名其他角色死亡后，根据其身份修改〖竭缘〗：忠臣，你减少伤害无体力值限制；反贼，你增加伤害无体力值限制；内奸，弃置牌时无颜色限制且可以弃置装备牌。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-文德武备","n":"李肃","t":"巧言令色","k":"群","kh":3,"mh":3,"g":"男","s":[["巧言","锁定技，在你的回合外，当其他角色对你造成伤害时，若你：没有“珠”，你防止此伤害并摸一张牌，然后将一张牌置于你的武将牌上，称为“珠”；有“珠”，其获得“珠”。",["锁定技"]],["献珠","锁定技，出牌阶段开始时，你令一名角色获得“珠”；若不为你，其视为对你攻击范围内你指定的一名角色使用一张【杀】。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"刘备","t":"潜龙勿用","k":"群","kh":4,"mh":4,"g":"男","s":[["虚待","限定技，当你使用或打出牌响应一张牌后或受到伤害后，你可以令一名其他角色获得〖煮酒〗。",["限定技"]],["煮酒","你可以将至少X+1张牌当【酒】使用（X为你本回合使用【酒】次数），若不均为♣，此技能本回合失效。",[]],["惊雷","每回合限一次，一名角色使用【酒】结算后，若没有处于濒死状态的角色，你可以受到1点无来源的雷电伤害，令一名拥有〖煮酒〗的角色将手牌调整至体力上限（至多摸至五张），若不为你，其将以此法弃置的牌交给你。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"刘磐","t":"骁隽悍勇","k":"群","kh":4,"mh":4,"g":"男","s":[["披荆","每回合限一次，当你使用【杀】或普通锦囊牌指定目标时，你可以为此牌增加或取消目标合计至多X名其他角色，并随机交给你一张牌（X为你已损失的体力值且至少为1），这些角色下次使用基本牌或普通锦囊牌指定唯一目标时，其可以指定你为额外目标或摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"刘辟","t":"易城报君","k":"群","kh":4,"mh":4,"g":"男","s":[["易城","出牌阶段限一次，你可以展示牌堆顶X张牌（X为你的体力上限），然后可以用任意张手牌交换其中等量张，若展示牌点数之和因此增加，你可以用所有手牌交换展示牌。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"刘琦","t":"居外而安","k":"群","kh":3,"mh":3,"g":"男","s":[["问计","出牌阶段开始时，你可以令一名其他角色交给你一张牌，你于本回合内使用与该牌同名的牌不能被其他角色响应。",[]],["屯江","结束阶段，若你未跳过本回合的出牌阶段，且你于本回合出牌阶段内未使用牌指定过其他角色为目标，你可以摸X张牌（X为全场势力数）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"刘璋","t":"据土怀益","k":"群","kh":3,"mh":3,"g":"男","s":[["丰蔚","锁定技，每轮开始时，你摸至多五张牌；若你手牌中有本轮以此法获得的牌，你跳过摸牌阶段，你受到牌造成的伤害+1。",["锁定技"]],["宗护","每回合限一次，当你需要使用【杀】或【闪】时，你可以将X张牌交给一名其他角色，然后视为你使用之（X为游戏轮数，至多为3）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"卢氏","t":"蝉蜕蛇解","k":"群","kh":3,"mh":3,"g":"女","s":[["驻颜","弃牌阶段结束时，你可以令一名角色将以下项调整至与其上个结束阶段时（若无则改为游戏开始时）相同：体力值；手牌数（至多摸至五张）。每名角色每项限一次。",[]],["雷劫","出牌阶段限一次，你可以令一名角色判定，若结果为♠2~9，你依次视为对其使用两张雷【杀】，否则其摸两张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-神话","n":"卢植","t":"国之桢干","k":"群","kh":3,"mh":3,"g":"男","s":[["明任","游戏开始时，你摸两张牌，然后将一张手牌置于武将牌上，称为“任”。结束阶段，你可以用一张手牌替换“任”。",[]],["贞良","转换技，阳：出牌阶段限一次，你可以选择攻击范围内的一名其他角色，弃置一张与“任”颜色相同的牌，对其造成1点伤害；阴：当你于回合外使用或打出的牌进入弃牌堆时，若此牌与“任”颜色相同，你可以令一名角色摸一张牌。",["转换技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"吕伯奢","t":"醉乡路稳","k":"群","kh":4,"mh":4,"g":"男","s":[["缚豕","当一名角色使用【杀】后，若你至其距离小于2，你将此【杀】置于你的武将牌上。你可以重铸任意张“缚豕”牌，视为使用一张具有以下等量项效果的【杀】：1.目标数+1；2.对一个目标造成的伤害-1；3.对一个目标造成的伤害+1。若你选择的选项相邻且目标均相邻，此【杀】不计入限制的次数。",[]],["东道","转换技，阳：农民回合结束后，你可以令地主执行一个额外回合；阴：农民回合结束后，其可以执行一个额外回合。（仅斗地主模式生效）",["转换技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"吕旷吕翔","t":"降将列侯","k":"群","kh":4,"mh":4,"g":"男","s":[["齐攻","当你使用的仅指定唯一目标的【杀】被【闪】抵消后，你可以令一名角色对此目标再使用一张无距离限制的【杀】，此【杀】不可被响应。",[]],["列侯","出牌阶段限一次，你可以令你攻击范围内一名有手牌的角色交给你一张手牌，然后你将一张手牌交给你攻击范围内的另一名其他角色。",[]]],"r":[]},{"p":"OL","sp":"OL-祈福","n":"吕玲绮","t":"红袖仗钺","k":"群","kh":4,"mh":4,"g":"女","s":[["绮武","出牌阶段限一次，你可弃置任意张牌，视为使用一张无距离和次数限制的【杀】，目标角色需弃置X张牌（X为你弃置牌的花色数）。若你们因此弃置了牌：且包含【闪】，你获得弃置牌中的【闪】，且本回合不计入手牌上限；且不包含【闪】，此【杀】不可响应。",[]],["妆戎","锁定技，回合开始时，将以下随机一件装备置入你的空置装备栏：【束发紫金冠】【玲珑狮蛮带】【红锦百花袍】【无双方天戟】（每件限一次，离开装备区后销毁）。每回合结束时，若你发动这些装备的效果至少两次，你增加1点体力上限，回复1点体力（每局游戏限一次）。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"马超","t":"西凉的猛狮","k":"群","kh":4,"mh":4,"g":"男","s":[["追击","锁定技，你计算与体力值不大于你的角色的距离始终为1。当你使用【杀】指定距离为1的角色为目标后，其弃置一张牌或重铸装备区里的所有牌。",["锁定技"]],["誓仇","你使用【杀】可以多选择至多X+1名角色为目标（X为你已损失的体力值）。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"马日磾","t":"南冠楚囚","k":"群","kh":4,"mh":6,"g":"男","s":[["秉节","出牌阶段开始时，你可以减1点体力上限，然后当你本回合使用【杀】或普通锦囊牌指定第一个目标后，除你以外的目标角色各弃置一张牌。",[]],["正订","锁定技，当你于回合外使用或打出牌响应其他角色使用的牌时，若这两张牌颜色相同，你加1点体力上限。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"马玩","t":"驱率羌胡","k":"群","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["浑疆","出牌阶段限一次，你可以令攻击范围内任意名角色同时选择一项：1.令你于本阶段内使用【杀】可以指定其为额外目标；2.令你摸一张牌。若这些角色均选择同一项，则依次执行另一项。",[]]],"r":[]},{"p":"OL","sp":"OL-璀璨星河","n":"马休马铁","t":"颉翥三秦","k":"群","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["垦伤","你可以将至少两张牌当【杀】使用，然后目标可以改为等量的角色。你以此法使用的【杀】结算后，若这些牌数大于此牌造成的伤害，你摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-其他","n":"玫瑰金小杀","t":"","k":"群","kh":4,"mh":4,"g":"女","s":[["赋能","锁定技，游戏开始时，你获得100K Token。小杀助手会根据你的牌型为距离1以内的角色推荐卡牌。若其使用了推荐的牌型，消耗你1K Token，否则其弃置一张牌。若你没有Token，你无法响应牌。其他角色死亡时，你获得50K Token。",["锁定技"]],["对话","出牌阶段限两次，你可以消耗20K Token并展示一张牌，生成与此牌最直接、最相关、最不绕弯子、且胜率最高的一组牌。你可以获得这些牌，或额外消耗10K Token并弃置展示牌，重新生成一组牌。",[]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"孟获","t":"夷汉并服","k":"群","kh":4,"mh":4,"g":"男","s":[["蛮王","出牌阶段，你可以弃置任意张牌依次执行前等量项：1.获得〖叛侵〗；2.摸一张牌；3.回复1点体力；4.摸两张牌并失去〖叛侵〗。",[]],["叛侵","出牌阶段结束时，或弃牌阶段结束时，你可以将本阶段你因弃置进入弃牌堆且仍在弃牌堆的牌当【南蛮入侵】使用，然后若此牌目标数不小于这些牌的数量，你执行并移除〖蛮王〗的最后一项。",["衍生技"]]],"r":[],"vi":1,"vt":2},{"p":"OL","sp":"OL-SP","n":"祢衡","t":"狂才傲世","k":"群","kh":3,"mh":3,"g":"男","s":[["狂狷","出牌阶段限X次（X为你的体力上限），你可以将手牌数调整至与一名其他角色相同，然后摸你弃置牌数的牌。你本回合使用以此法摸的牌无次数限制。",[]],["飞辩","锁定技，游戏开始时，你的出牌时间改为15秒。当你于回合内使用一张牌后，或当其他角色对你使用一张牌后，使用者随机弃置一张手牌且本轮出牌时间减1秒（最少为1秒）。每个回合结束时，本回合出牌超时的角色失去1点体力。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔貂蝉","t":"倾世的魅影","k":"群","kh":3,"mh":3,"g":"女","s":[["幻惑","每轮开始时，你摸两张牌，然后你可弃置至多两张牌并选择等量名其他角色获得2枚“幻惑”标记直到其下个出牌阶段结束。其下个出牌阶段内具有以下效果： 1.若其有可使用的手牌且其有“幻惑”标记，将其出牌阶段空闲时间点操作改为：其只能使用一张随机的可使用的手牌 2.当其使用牌结算结束后，若其有“幻惑”标记，则其随机弃置一张牌并移除一枚“幻惑”标记。",[]],["倾世","准备阶段，你可以入魔，令所有角色获得一张单目标伤害牌。当一名角色成为其他角色使用此牌的唯一目标时，你可弃置一张牌，重新指定此牌的目标（无距离限制）。当这些牌：造成伤害后，你摸一张牌；不因使用而进入弃牌堆后，你获得之。准备阶段，若这些牌均离开手牌区，你令所有角色获得一张单目标伤害牌。",[]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔吕布","t":"荡宇的捷拳","k":"群","kh":4,"mh":4,"g":"男","s":[["夺炁","锁定技，一号位首个回合开始前，你执行一个不能使用延时锦囊牌的额外出牌阶段。所有角色的初始手牌称为“炁”。你每回合对一名角色首次造成伤害后，你获得其一张“炁”。",["锁定技"]],["狂魔","出牌阶段，你可以入魔并选择一名其他角色，你与其成为“狂”角色，每回合对彼此首次造成的伤害+1；击败对方后，获得对方所有“炁”。“狂”角色死亡后，你重新指定。",[]],["罡拳","若你使用的上一张牌为“炁”，你可以将一张装备牌当指定相邻角色为目标的火【杀】使用；否则，你可以将一张锦囊牌当【决斗】使用。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋董卓","t":"翦覆四海","k":"群","kh":4,"mh":4,"g":"男","s":[["观变","锁定技，游戏开始时，你的手牌上限、其他角色与你的距离、你与其他角色的距离+X。首轮结束后或你发动〖凶逆〗或〖封赏〗后，你失去此技能。（X为游戏人数）",["锁定技"]],["凶逆","出牌阶段开始时，你可以弃置一张牌，所有其他角色需弃置一张花色相同的牌，否则你对其造成1点伤害。",[]],["封赏","出牌阶段限一次，或有角色进入濒死状态时（每回合限一次），你可以将本回合弃牌堆中两张花色相同的牌分配给等量角色（每轮每种花色限一次），若你未以此法获得牌，你视为使用一张不计入次数的【酒】。",[]],["执柄","主公技，锁定技，准备阶段，若其他群雄势力角色累计使用黑色牌达到：3张，你加1点体力上限并回复1体力；6张，你获得〖焚城〗；9张，你获得〖崩坏〗。",["主公技","锁定技"]],["焚城","限定技，出牌阶段，你可以选择一名角色，从该角色开始，所有其他角色依次选择一项：1.弃置至少X张牌（X为上一名角色因此弃置的牌数+1）；2.你对其造成2点火焰伤害。",["限定技","衍生技"]],["崩坏","锁定技，结束阶段，若你不是体力值最小的角色，你选择：1.减1点体力上限；2.失去1点体力。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋公孙瓒","t":"辽海龙吟","k":"群","kh":4,"mh":4,"g":"男","s":[["剿狄","锁定技，你的攻击范围始终等于你的当前体力值。当你使用【杀】指定唯一目标时，若目标的攻击范围不大于你，你令此【杀】伤害+1，然后获得该角色一张手牌；若目标的攻击范围不小于你，你弃置该角色区域内一张牌，选择一名角色成为此【杀】的额外目标。",["锁定技"]],["保京","出牌阶段限一次，你可以令一名其他角色的攻击范围+1/-1（至多减至1），直到你的下个出牌阶段开始。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋华雄","t":"汜水关死神","k":"群","kh":6,"mh":6,"g":"男","s":[["搏决","出牌阶段限两次，你可以与一名其他角色同时选择摸或弃置一张牌，若你与其手牌数因此变化之和为：0，你与其弃置对方一张牌；2，你与其视为对对方使用一张【杀】。",[]],["扬威","锁定技，当你一回合于摸牌阶段外摸至少两张牌后，你下一次造成伤害+1；当你一回合于弃牌阶段外弃置至少两张牌后，你下一次受到伤害+1。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋贾诩","t":"良平之奇","k":"群","kh":3,"mh":3,"g":"男","s":[["乱朝","限定技，每轮开始时，你可以令所有角色依次选择从牌堆获得一张【杀】或【闪】。获得【杀】的角色本轮首次造成的伤害+1。",["限定技"]],["完策","出牌阶段限一次，你可以指定一名角色并声明一张指定唯一目标的普通锦囊牌，然后其依次将X张手牌当此牌使用（X为游戏轮数且至多为3）。其以此法指定目标时，你可以弃置一张牌并更改目标。",[]],["沉智","你每轮受到第X次以后的伤害时，你弃置一张牌防止之（X为游戏轮数且至多为3）。每轮结束时，若你本轮未发动此技能，则你可以复原一名角色的一个限定技（每局游戏限一次）。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋沮授","t":"三军监统","k":"群","kh":3,"mh":3,"g":"男","s":[["固粮","每回合限一次，其他角色对你使用牌时，你可以令此牌对你无效，若如此做，你无法响应其对你使用的牌直到回合结束。",[]],["徐图","锁定技，游戏开始时，你将牌堆顶三张牌置于你的武将牌上，称为“资”。每个结束阶段，你将本回合弃牌堆的一张牌与一张“资”交换，然后令一名角色获得三张花色或点数相同的“资”，若如此做，你将“资”补至三张。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋孔融","t":"豪气贯长虹","k":"群","kh":4,"mh":4,"g":"男","s":[["立文","游戏开始时，你获得三枚“贤”标记；当你使用或打出非虚拟牌时，若此牌与你使用或打出的上一张非虚拟牌花色或类别相同，你获得一枚“贤”标记；回合结束时，你需将任意个“贤”标记分配给等量的角色（每名角色“贤”标记上限为5个），然后有“贤”标记的角色按照标记从多到少的顺序，依次使用一张手牌，若其不使用，移去其“贤”标记，你摸等量的牌。",[]],["争义","当有“贤”标记的角色受到非属性伤害时，其他有“贤”标记的角色同时选择是否失去体力，若有角色同意，则防止此伤害，同意的角色中体力值最大的角色失去等同于此伤害值的体力。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋李傕","t":"","k":"群","kh":4,"mh":5,"g":"男","s":[["邀宴","出牌阶段限一次，你可以与一名其他角色同时选择弃置至少X张牌，然后依次视为使用一张无距离次数限制的【酒】或【杀】（X为本回合各自使用牌的数量+1）。若因此使用牌指定的目标相同，你将手牌摸至体力上限，并失去1点体力或体力上限，将此技能改为本阶段限两次。",[]],["沉势","锁定技，你对体力值与已损失体力值均小于你的角色使用的伤害牌结算完成后，若未造成伤害，你对此牌所有目标造成1点伤害。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋卢植","t":"弘毅抗矫","k":"群","kh":3,"mh":4,"g":"男","s":[["司兵","每回合限一次，当你使用伤害牌指定唯一目标时，你可以弃置任意张红色牌，目标需弃置等量红色手牌，否则其不能响应此牌；以你为目标的伤害牌结算完成后，若未对你造成伤害，你可以弃置一张黑色牌，视为使用一张【杀】。",[]],["敛策","每轮限一次，当你的手牌数变化后，若为全场最少，你可以将手牌摸至体力上限，然后本回合下次有角色造成伤害时，此伤害+1。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋田丰","t":"坚贞不移","k":"群","kh":3,"mh":3,"g":"男","s":[["执谏","出牌阶段限一次，你可以摸3-X张牌并交给一名其他角色一张牌，此牌称为“谏”直到其下个回合结束或其使用了“谏”。然后若其使用的下一张牌不为“谏”，你可以再次对其发动此技能（X为此技能本回合此前已发动次数）。",[]],["效竭","当你成为【杀】的目标后，你可以令你不可响应之。若如此做，你于此【杀】结算完毕后，视为使用你使用的上一张普通锦囊牌或摸一张牌。",[]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋文丑","t":"万夫之勇","k":"群","kh":4,"mh":4,"g":"男","s":[["轮战","出牌阶段，你可以将任意张牌当一张【决斗】使用（至多为5，且本回合不可重复）。若你以此法对唯一目标造成了伤害，你可以摸X张牌，然后你本回合不能再对目标角色发动此技能（X为本回合你使用牌指定其为目标的次数）。",[]],["决绝","锁定技，当你于回合内首次使用所有手牌指定其他角色为唯一目标时，令其弃置X张牌（X为本回合你使用牌指定其为目标的次数）。",["锁定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋许攸","t":"帷幄擎炬","k":"群","kh":3,"mh":3,"g":"男","s":[["迁附","转换技，出牌阶段，阳：你可以将一张黑色牌当【过河拆桥】使用；阴，你可以将一张红色牌当【火攻】使用。结算结束后，你可以将因此弃置的牌置于牌堆顶。",["转换技"]],["驭势","当你造成或受到伤害后，你可以令一名：有转换技的角色切换其转换技状态；无转换技的角色获得出牌阶段各限一次的〖迁附〗，直到其失去最后一张手牌。每轮限X次，有转换技切换状态后，你摸一张牌（X为你的体力上限）。",[]],["焚巢","限定技，结束阶段，你可以令一名角色获得弃牌堆中的伤害牌（不能超过存活角色数），这些牌造成的伤害改为火焰伤害。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋袁绍","t":"席卷八荒","k":"群","kh":4,"mh":4,"g":"男","s":[["玉锋","游戏开始时，将【思召剑】置入你的装备区。",[]],["合讨","当其他角色使用牌指定大于一个目标后，你可以弃置一张与此牌颜色相同的牌，令此牌对其中一个目标生效两次且对其他目标无效。",[]],["神离","出牌阶段限一次，你使用【杀】指定目标后，可令所有其他角色均成为此【杀】的目标。然后若此【杀】造成的伤害值： ⬤大于你的手牌数，你摸X张牌（X为此【杀】造成的伤害值且至多为5）； ⬤大于你的体力值，你对相同目标再次使用此【杀】。",[]],["士首","主公技，当其他群势力角色失去装备区里的牌后，若你的装备区里没有武器牌，其可以将【思召剑】置入你的装备区。",["主公技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋袁术","t":"画脂镂冰","k":"群","kh":4,"mh":4,"g":"男","s":[["矜名","锁定技，回合开始时，你选择一项条件：1.回复过1点体力；2.弃置过两张牌；3.使用过三种类型的牌；4.造成过4点伤害。回合结束时，你摸X张牌，然后若你本回合未满足条件，你删除此选项（X为你本回合发动〖矜名〗选择项的序号）。",["锁定技"]],["枭噬","出牌阶段内限一次，当你使用基本牌或普通锦囊牌指定目标时，可以额外指定一个目标（无距离限制），若此牌未造成伤害，你失去1点体力或令其中一个目标摸X张牌（X为你本回合发动〖矜名〗选择项的序号）。",[]],["厌粱","主公技，其他群势力角色出牌阶段限一次，其可以交给你一张装备牌，视为使用一张【酒】。",["主公技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋张让","t":"侵威乱天常","k":"群","kh":3,"mh":3,"g":"男","s":[["赂存","每轮各限一次，你可以视为使用一张有目标的基本牌或普通锦囊牌（未以此法使用过），然后目标中手牌最多的随机一名角色将一张手牌置于你的武将牌上，称为“赂”。每个回合结束时，你随机移去一张“赂”，然后摸一张牌。",[]],["蜕生","限定技，准备阶段或当你进入濒死状态时，你可以重置你本局使用过的〖赂存〗牌名，然后选择一项并回复1点体力：1.将所有手牌置为“赂”；2.你随机从弃牌堆中获得游戏轮数张重置前〖赂存〗使用牌名的牌。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋张绣","t":"枪啸风吟","k":"群","kh":4,"mh":4,"g":"男","s":[["追剿","锁定技，你使用【杀】时，若你使用的上一张牌未造成伤害，则你摸一张牌并令此【杀】伤害+1，此【杀】结算后，若仍未造成伤害，你弃置一张牌。",["锁定技"]],["仇猎","限定技，回合开始时，你可以选择一名其他角色，本回合你的每个阶段开始时，你可以弃置一张牌视为对其使用一张【杀】，其可以弃置一张基本牌或武器牌令此【杀】无效。",["限定技"]]],"r":[]},{"p":"OL","sp":"OL-魔","n":"魔张角","t":"正世的道首","k":"群","kh":3,"mh":3,"g":"男","s":[["济宇","锁定技，每当弃牌堆凑齐一组花色或类型后，你获得一张能造成属性伤害的牌（每回合限一次）。你每回合首次受到伤害时，令至多X名角色随机获得一张〖济宇〗记录花色或类型的牌（X为当前〖济宇〗记录类型、花色数）。",["锁定技"]],["天启","出牌阶段，你可以重铸一张能造成属性伤害的牌，并获得对应技能。若你因此技能全场最多，你入魔，获得〖震寰〗。",[]],["震寰","限定技，出牌阶段，你可以对牌的花色或类型进行排序，然后将弃牌堆的牌根据你的排序按组洗入牌堆顶，然后修改〖济宇〗。",["限定技","衍生技"]],["济宇（升级）","锁定技，每当弃牌堆凑齐一组花色或类型后，你获得一张能造成属性伤害的牌。你每回合首次受到伤害时，防止此伤害，进行一次【闪电】判定。",["锁定技","衍生技"]]],"r":[]},{"p":"OL","sp":"OL-SP","n":"南华老仙","t":"逍遥仙游","k":" ,"kh":3,"mh":3,"g":"男","s":[["潜凶","①出牌阶段限一次，你可以观看牌堆顶五张牌，将其中一张牌扣置于一名角色的武将牌上。②有“潜凶”牌的角色出牌阶段开始时，你选择一项：1.本回合当其使用或打出与“潜凶”牌相同牌名的牌时，你对其造成1点伤害，本回合结束时将与其本回合使用或打出过的相同牌名的“潜凶”牌置入弃牌堆；2.你依次使用其所有“潜凶”牌。",[]],["争嫡","①游戏开始时，你令两名其他角色获得〖隽嗣〗。②有〖隽嗣〗的角色死亡后或首轮开始时，若你有〖隽嗣〗，你可以令一名角色因〖隽嗣〗摸牌数+1或-1，或弃牌数+1或-1。",[]],["隽嗣","锁定技，每回合各限两次，当你对有〖隽嗣〗的角色造成伤害后，你摸一张牌；当你受到有〖隽嗣〗的角色造成的伤害后，你弃置一张牌。若场上仅你有〖隽嗣〗，此技能描述中的“有〖隽嗣〗的角色”改为“一名角色”。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻曹植","t":"赋怀山河","k":"魏","kh":3,"mh":3,"g":"男","s":[["翰鸿","出牌阶段每种花色限一次或受到伤害后，你可以声明一种花色并弃置X张牌（X为你手牌中花色最多的牌数），观看牌堆顶前X张你声明花色的牌，获得其中至多两张牌。若你弃置了♣牌，你摸一张牌。",[]],["华章","出牌阶段结束时，你可以重铸任意张手牌，若X不小于2，这些牌每满足一项：花色相同、点数连续、牌名相同，你便依次执行一项：1.摸X张牌；2.本回合手牌上限+X；3.摸X张牌且本回合手牌上限+X（X为重铸的牌数）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻典韦","t":"拔山超海","k":"魏","kh":4,"mh":4,"g":"男","s":[["灭围","①出牌阶段开始时，你可以令此阶段使用【杀】次数上限改为你攻击范围内的角色数。②当你使用【杀】对目标角色造成伤害时，此伤害+X（X为本回合成为过【杀】目标的角色数，至多为5）。",[]],["弥勇","限定技，出牌阶段，你可以展示手牌中的至多两张【杀】。当此【杀】于一回合内因首次使用、首次打出或首次弃置而进入弃牌堆时，你获得之。",["限定技"]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻丁夫人","t":"懿德广扬","k":"魏","kh":3,"mh":3,"g":"女","s":[["拾忆","出牌阶段限一次，你可以与一名其他角色互相观看手牌，各展示自己的一张手牌，然后从牌堆或弃牌堆中获得一张与此牌类型相同的牌。若你与其展示的牌：类型相同，你与其摸两张牌；类型不同，你与其从牌堆或弃牌堆中获得一张与展示的牌类型相同的牌。",[]],["春晖","每回合限一次，当你距离1以内体力值不大于你的角色成为伤害类普通锦囊牌的目标后，你可以令其观看你的手牌并获得其中一张牌（若为你则跳过）；此牌结算结束后，若未对其造成伤害，你摸两张牌。",[]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻司马懿","t":"权谋并施","k":"魏","kh":3,"mh":3,"g":"男","s":[["纵权","准备阶段或结束阶段，你可以选择一名角色，你进行判定，若结果为红色，其摸一张牌；若结果为黑色，其弃置一张牌；若你本次与上一次发动〖纵权〗所选择的目标角色相同但结果颜色不同，则改为摸/弃置三张牌。然后你令一名角色获得判定牌。",[]],["鬼谋","每回合限两次，当一名角色的判定牌生效前，你可以观看牌堆底的四张牌，选择其中一张牌代替之，然后将其余牌以任意顺序置于牌堆顶。",[]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻张郃","t":"追敌入彀","k":"魏","kh":4,"mh":4,"g":"男","s":[["溃端","锁定技，当你使用【杀】指定唯一目标后，你与其各将随机两张手牌标记为“溃端”牌（视为【杀】）。你的“溃端”牌不记入手牌上限。结束阶段，你视为对一名其他角色使用一张【决斗】，此牌造成伤害后，伤害来源摸X张牌（X为你手牌中【杀】和“溃端”牌的数量且至多为5）。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"贾逵","t":"肃齐万里","k":"魏","kh":3,"mh":3,"g":"男","s":[["忠佐","一名角色的结束阶段结束时，若你于本回合内造成或受到过伤害，你可令一名角色摸两张牌，若其已受伤，你摸一张牌。",[]],["挽澜","限定技，当一名角色进入濒死状态时，你可发动此技能，若你有手牌则你弃置所有手牌，令其回复体力至1点，此次濒死结算结束后，你对当前回合角色造成1点伤害。",["限定技"]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"蒋济","t":"盛魏昌杰","k":"魏","kh":3,"mh":3,"g":"男","s":[["急筹","①每回合限一次，你可视为使用一种普通锦囊牌，然后本局游戏你无法以此法或自手牌中使用此牌名的牌，且不可响应此牌名的牌。②出牌阶段限一次，你可将手牌中“急筹”使用过的其牌名的一张牌交给一名角色。",[]],["机论","当你受到伤害后，你可选择一项：1.摸X张牌（X为以“急筹”使用过的锦囊牌数，至少为1至多为5）；2.视为使用一种以“急筹”使用过的牌（每牌名限一次）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界曹休","t":"龙光骐骥","k":"魏","kh":4,"mh":4,"g":"男","s":[["千驹","锁定技，你计算与其他角色的距离-X（X为你的装备区里的牌数）；每回合限一次，当你对你至其的距离小于2的角色造成伤害后，你将牌堆或弃牌堆中一张装备牌置入你的装备区。",["锁定技"]],["倾袭","每回合你使用的第一张【杀】指定目标后，你可以令目标角色选择一项：1.令你摸X张牌，此【杀】不可被响应（X为你装备区牌的数量且至少为1）；2.弃置装备区里的所有牌（至少一张）并弃置等量你装备区的牌（不足则全弃），此【杀】伤害+1。",[]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界郭淮","t":"垂问秦雍","k":"魏","kh":4,"mh":4,"g":"男","s":[["精策","当你出牌阶段使用的第X张牌结算结束后（X为你的体力值），你可摸两张牌，然后若这不是你此阶段第一次摸牌或此回合你已造成过伤害，你获得1枚“策”。",[]],["御嶂","①你可弃1枚“策”，跳过一个阶段。②当你受到伤害后，你可弃1枚“策”并选择一项，令伤害来源执行：1.本回合不能使用或打出手牌；2.弃置两张牌（不足则全弃）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"骥李典","t":"义忘私隙","k":"魏","kh":3,"mh":3,"g":"男","s":[["断津","当你使用一张基本牌结算完毕后，你可以弃置一名其他角色的一张牌。",[]],["慨公","每回合限一次，当你对其他角色造成伤害后或受到其他角色造成的伤害后，你可以展示你或该角色的至多两张手牌并与牌堆底等量张牌交换；若交换的牌至少包含两种花色，你可以使用其中一张牌（不计入次数、无次数限制且无距离限制）。",[]],["合御","若友方骥乐进在场，你获得因〖断津〗弃置的牌；若友方骥张辽在场，〖慨公〗使用的牌不可被响应。（仅斗地主和2v2模式生效）",[]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"骥张辽","t":"气夺三军","k":"魏","kh":4,"mh":4,"g":"男","s":[["冲垒","锁定技，你的出牌阶段内，所有其他角色的非基本手牌均只能作为【闪】使用或打出；出牌阶段内限X次（X为其他角色数），当你使用的牌被其他角色响应后，或当你响应其他角色使用的牌后，你获得该角色一张手牌。",["锁定技"]],["荡势","当你使用伤害牌结算完毕后，你可以令其中一名目标其他角色选择一项：1.对你使用一张非转化且非虚拟的牌名相同的伤害牌；2.弃置X张牌（X为所有角色本轮选择此选项的次数，至少为1）；3.你对其造成1点伤害。然后若其选择了本阶段未被选择过的选项，你摸一张牌且本阶段使用【杀】的次数上限+1。",[]],["合御","锁定技，若友方骥乐进在场，〖冲垒〗的“非基本手牌”改为“手牌”；若友方骥李典在场，〖荡势〗的X固定为3。（仅斗地主和2v2模式生效）",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"谋曹丕","t":"魏文帝","k":"魏","kh":3,"mh":3,"g":"男","s":[["行殇","一名角色死亡时，你可以将其区域内的所有牌分配给任意角色；出牌阶段结束时，你可将一名角色区域内的牌数弃置至X张，然后你可使用其中至多X张因此弃置的牌（X为其体力值）。",[]],["放逐","每轮限一次，每个回合开始时，你可以令一名角色（不能为当前回合角色及其上家）与其下家交换座次；当你受到伤害后，若此为伤害来源本轮首次对你造成的伤害，你可以选择一项：1.令其非锁定技失效并获得技能“远步”直到其下个回合结束；2.令其不能使用或打出当前手牌直到其下个回合结束。",[]],["颂威","主公技，锁定技，其他魏势力角色的回合开始时，你摸X张牌（X为本轮未执行过回合的角色数且至多为3）。",["主公技","锁定技"]],["远步","锁定技，你的手牌上限+X；你与其他角色的距离+X；其他角色与你的距离+X（X为存活的其他角色数，且至多为4）。",["锁定技","衍生技"]]],"r":[],"vi":1,"vt":2},{"p":"国际服","sp":"国际服-谋攻篇","n":"谋曹丕","t":"魏文帝","k":"魏","kh":3,"mh":3,"g":"男","s":[["行殇","一名角色死亡时，你可以将其区域内的所有牌分配给任意角色；出牌阶段结束时，你可将一名角色区域内的牌数弃置至X张，然后你可使用其中至多X张因此弃置的牌（X为其体力值，且以此法使用的牌不计入次数限制）。",[]],["放逐","每轮限一次，每个回合开始时，你可以令一名角色（不能为当前回合角色及其上家）与其下家交换座次；当你受到伤害后，若此为伤害来源本轮首次对你造成的伤害，你可以选择一项：1.令其非锁定技失效并获得技能〖远步〗直到其下个回合结束；2.令其不能使用或打出当前手牌直到其下个回合结束。",[]],["颂威","主公技，锁定技，其他魏势力角色的回合开始时，你摸X张牌（X为本轮未执行过回合的角色数且至多为3）。",["主公技","锁定技"]],["远步","锁定技，你的手牌上限+X；你与其他角色的距离+X；其他角色与你的距离+X（X为存活的其他角色数，且至多为4）。",["锁定技","衍生技"]]],"r":[],"vi":2,"vt":2},{"p":"国际服","sp":"国际服-谋攻篇","n":"谋张郃","t":"变数尽展","k":"魏","kh":4,"mh":4,"g":"男","s":[["巧变","准备阶段，你可以弃置任意张区域内的牌，然后跳过等量个下述阶段，并于跳过对应阶段后可以执行相应效果： 1.摸牌阶段，你可以获得至多两名其他角色各一张手牌； 2.出牌阶段，你可以移动场上一张牌，然后若你装备区内的牌数未增加，则你可以令因此场上牌数增加的角色摸两张牌； 3.弃牌阶段，你摸两张牌，然后在结束阶段后，若你手牌数不小于场上角色数，你执行一个额外的出牌阶段。",[]],["料势","每回合限一次，你可以将因〖巧变〗获得的牌当【杀】或【闪】使用或打出。",[]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"牛金","t":"独进的兵胆","k":"魏","kh":4,"mh":4,"g":"男","s":[["挫锐","限定技，准备阶段，你可将手牌摸至X张（X为全场最大的手牌数，至多摸五张），废除判定区。若你发动过〖挫锐〗，你可选择一名其他角色，对其造成1点伤害。",["限定技"]],["裂围","锁定技，当一名角色死亡后，若其是你杀死的，你选择：1.摸两张牌；2.若〖挫锐〗发动过，令〖挫锐〗于此局游戏内的发动次数上限+1。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"庞山民","t":"抱玉向晚","k":"魏","kh":4,"mh":4,"g":"男","s":[["才思","当你于回合内/回合外使用基本牌后，你可以从牌堆/弃牌堆随机获得一张非基本牌。每次发动该技能后，若发动次数：不大于体力上限：本回合下次获得牌张数翻倍；大于体力上限：本回合此技能失效。",[]],["擢吏","锁定技，每个回合结束时，若你本回合使用牌或获得牌的张数大于体力值，你加1点体力上限并回复1点体力（体力上限不能超过角色数）。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"清河公主","t":"蛊虿之谗","k":"魏","kh":3,"mh":3,"g":"女","s":[["谮构","出牌阶段限一次，你可以观看一名角色的所有手牌，然后选择一项： 1.视为使用两张其手牌中没有的牌名的基本牌（不计入次数且无次数限制）； 2.你与其依次将手牌区里的共有牌名的牌替换为牌堆中等量的【杀】（以此法得到的【杀】不计入手牌上限，直到各自的回合结束）。 然后其获得一个你指定基本牌名的“诬”标记。拥有此标记的角色每回合使用的前三张牌结算后，若与记录的牌名相同，其移除此标记并失去1点体力。",[]],["诽离","当你受到伤害时，若你拥有〖谮构〗，你可以弃置两张牌防止此伤害；若伤害来源拥有“诬”标记，你可以改为移除此标记防止此伤害，并摸四张牌，然后本局游戏不能对其发动〖谮构〗。",[]]],
