技（黑色牌+伤害牌），你可选择一名本回合未以此法选择过的其他角色并摸2张牌，本回合你与其计算距离为1，你对其使用伤害牌或黑色牌结算后，每满足一项可弃置其一张牌。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威吕布","t":"虓虎叱北地","k":"群","kh":5,"mh":5,"g":"男","s":[["骁武","出牌阶段限一次，你可以弃置一张牌，从牌堆获得一张牌面信息包含【杀】的牌（以此法获得的牌不计次数）。当你造成伤害后，此技能视为未发动过且本回合改为获得两张。",[]],["霸关","连招技（单目标牌+武器牌），你可以将至多X张手牌当一张【杀】使用（X为此武器牌的牌名字数），伤害基数等于你用于转化的牌数。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威马超","t":"雄烈盖世","k":"群","kh":4,"mh":4,"g":"男","s":[["众讨","出牌阶段限一次，你可以选择X种花色（X为你已损失的体力值+1，且至多为4），随机从场上、弃牌堆或牌堆获得你选择花色的牌各一张。若如此做，你使用三种类别的牌后，此技能视为未发动过。",[]],["极斩","连招技（装备牌+黑色牌）你选择一项：1.弃置其他角色共计至多X张牌；2.对一名其他角色造成X点伤害，然后此技能本回合失效（X为你本回合发动过“极斩”的次数）。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威马腾","t":"千骑卷黄沙","k":"群","kh":4,"mh":4,"g":"男","s":[["合骑","游戏开始时，你获得3个“骑”。你不以此法使用【杀】结算后，可以视为对拥有“骑”的其他角色使用X张【杀】（X为该角色“骑”的数量，此【杀】造成的伤害无伤害来源），你对拥有“骑”的角色使用牌无距离限制。",[]],["挥锐","出牌阶段开始或当你受到伤害后，你可以选择一项发动：1.获得两个“骑”；2.移动场上任意一个“骑”至任意其他角色处；3.你视为使用一张【杀】。",[]],["骁贲","连招技（伤害牌+非基本牌）你可以移动一个“骑”并可以移除所有其他角色的“骑”，其他角色每失去一个“骑”便受到1点伤害。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"卫青","t":"追亡逐北","k":"群","kh":3,"mh":3,"g":"男","s":[["北进","出牌阶段，你可以摸一张牌且此牌无次数限制。若你本回合使用的下一张牌不包含以此法摸的牌，或你发动此技能时手牌中有以此法摸的牌，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威张辽","t":"威锐镇西风","k":"群","kh":4,"mh":4,"g":"男","s":[["驭袭","当你造成或受到伤害时，你可以摸一张牌，以此法获得的牌无次数限制。",[]],["破戎","连招技（伤害牌+【杀】），你可以获得此【杀】目标和其相邻角色各一张手牌，并令此【杀】额外结算一次。",["连招技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威祝融","t":"","k":"群","kh":5,"mh":5,"g":"女","s":[["群象","回合开始时或你受到伤害后，你可以弃置一张牌并随机恢复两个装备栏，然后从牌堆或弃牌堆将两张【南蛮入侵】置入你的装备区，若没有【南蛮入侵】则改为置入随机装备牌。",[]],["驭兽","你使用【南蛮入侵】时可自选此牌的目标。若你的装备区有【南蛮入侵】：回合结束时你可以视为使用之；你使用【南蛮入侵】造成的伤害+1；其他角色计算与你的距离+1。",[]],["捍族","你对其他角色使用伤害牌结算完毕后，你可以废除至多此牌目标数个装备栏，然后弃置此牌的目标共计至多等量张牌，若你废除的装备栏中每有一张牌，你可以获得一张弃置的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"武安国","t":"虎口折腕","k":"群","kh":4,"mh":4,"g":"男","s":[["叠嶂","转换技，你出牌阶段使用【杀】次数上限+1。阳：当你使用牌被其他角色抵消后，你可以弃置一张牌视为对其使用(一)张【杀】；阴：当你使用牌抵消其他角色使用的牌后，你可以摸(一)张牌视为对其使用一张【杀】。",["转换技"]],["断腕","限定技，当你处于濒死状态时，你可以将体力回复至2点，然后修改〖叠嶂〗：失去当前状态的效果，括号内的数字+1。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"伍孚","t":"忠虹贯日","k":"群","kh":3,"mh":3,"g":"男","s":[["忠锷","出牌阶段限一次，你可以将手牌调整至体力上限，然后与一名其他角色同时选择一项并依次执行：1.你与其依次摸一张牌；2.你与其依次视为对对方使用一张【杀】。若其选择的项与你不同，每项操作在你执行时均多执行一次。",[]],["绝忾","限定技，出牌阶段，你可以重置〖忠锷〗，然后直到出牌阶段结束，此阶段获得过牌的角色无法再使用手牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武皇甫嵩","t":"襄武翼汉","k":"群","kh":1,"mh":4,"g":"男","s":[["朝镇","准备阶段或当你进入濒死状态时，你可以从场上或牌堆中随机获得一张点数最小的牌，若此牌点数为A，你回复1点体力，此技能本回合失效。",[]],["连捷","当你使用手牌指定目标后，若此牌点数不大于你的其他手牌，你可以将一名角色手牌中一张点数最小的牌置于牌堆底（每回合每名角色限一次），若如此做，你将手牌摸至体力上限，本回合使用以此法摸到的牌无距离次数限制。",[]],["将贤","限定技，出牌阶段，你可以令本回合使用因〖连捷〗摸的牌造成伤害时，此伤害+X（X为你本回合造成伤害次数，至多为5）。若如此做，回合结束后失去〖连捷〗或〖朝镇〗。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"无名","t":"","k":"群","kh":3,"mh":3,"g":"男","s":[["出山","锁定技，游戏开始时，你从随机六项技能中选择两项技能获得。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吴普","t":"健体养魄","k":"群","kh":4,"mh":4,"g":"男","s":[["锻体","锁定技，当你每使用或打出五张牌结算结束后，你回复1点体力，加1点体力上限（最多加5）。",["锁定技"]],["识草","出牌阶段，你可以声明一种类别，从牌堆顶/牌堆底摸一张牌，若此牌不为你声明的类别，你观看牌堆底/牌堆顶的两张牌，此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"兀突骨","t":"霸体金刚","k":"群","kh":15,"mh":15,"g":"男","s":[["燃殇","锁定技，当你受到1点火焰伤害后，你获得1枚“燃”标记；结束阶段，你失去X点体力（X为“燃”标记数），然后若“燃”标记的数量超过2个，则你减2点体力上限并摸两张牌。",["锁定技"]],["悍勇","当你使用【南蛮入侵】、【万箭齐发】或♠普通【杀】时，若你已受伤，你可以令此牌造成的伤害+1，然后若你的体力值大于游戏轮数，你获得一个“燃”标记。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"邢道荣","t":"零陵上将","k":"群","kh":4,"mh":6,"g":"男","s":[["虚猲","出牌阶段开始时，你可以减1点体力上限，然后你弃置距离1以内的每名角色各一张牌或令这些角色各摸一张牌。出牌阶段结束时，若你体力上限不为全场最高，你加1点体力上限，然后回复1点体力或摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星董卓","t":"千里草的魔阀","k":"群","kh":5,"mh":5,"g":"男","s":[["威临","锁定技，你于回合内对一名角色造成伤害时，若其本回合没有受到过伤害且你本回合已使用牌数不小于其体力值，则此伤害+1。",["锁定技"]],["掌戎","准备阶段，你可以选择一项：1.令至多X名体力值不小于你的角色各失去1点体力；2.令至多X名手牌数不小于你的角色各弃置一张手牌（X为你的体力值）。然后你摸选择角色数量的牌，这些角色依次执行选项。本回合结束时，若这些角色中有存活且本回合未受到伤害的角色，你失去1点体力。",[]],["豪首","主公技，其他群雄势力角色使用【酒】时，可以令你回复1点体力。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星孙坚","t":"破虏将军","k":"群","kh":4,"mh":5,"g":"男","s":[["锐军","当你于出牌阶段内第一次使用牌指定其他角色为目标后，你可以摸X张牌（X为你已损失的体力值+1），此阶段内：除其外的其他角色视为不在你的攻击范围内；你对其使用牌无距离限制；当你对其造成伤害时，伤害值比上次增加1（至多为5）。",[]],["刚毅","锁定技，若你于回合内未造成过伤害，你于此回合内不能使用【桃】。当你于濒死状态因【桃】或【酒】回复体力时，回复值+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星太史慈","t":"信义为先","k":"群","kh":4,"mh":4,"g":"男","s":[["重围","锁定技，你计算与其他角色的距离+3；当你造成伤害后，此数值-1，然后若数值减至0，你回复1点体力，摸体力值张牌，然后“冲阻”增加一个选项，失去此技能。",["锁定技"]],["冲阻","当你使用牌结算结束后，若目标包含你，你可以选择一项：1.令你使用的下一张牌无次数和距离限制；2.摸两张牌，然后本回合不可选择此选项。（增加选项：3.令你使用下一张牌指定第一个目标后，可对目标中的一名其他角色造成1点伤害）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星王允","t":"气连霄汉","k":"群","kh":4,"mh":4,"g":"男","s":[["仕厉","每轮开始时，你可以将武将牌翻面。若你的武将牌背面向上，你成为其他角色使用【杀】的目标后，可以将一张手牌当【杀】对其使用，若你以此法使用的【杀】造成伤害，你摸一张牌且该角色使用的【杀】无效。当你进入濒死状态时，若你的武将牌背面向上，你可以复原武将牌并将体力值回复至1点。你的武将牌翻回正面时，你获得〖谋济〗直到本轮结束，你因此失去〖谋济〗时，进行一个额外的回合。",[]],["谋济","每个回合结束时，你摸两张牌。你使用以此法获得的锦囊牌无距离限制且不能被响应。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星文丑","t":"夔威天下","k":"群","kh":4,"mh":4,"g":"男","s":[["连战","当你使用伤害牌指定唯一目标时，你可以选择一项：1.额外指定一个目标；2.此牌额外结算一次。然后若此牌对目标造成伤害次数为2，你可以回复1点体力（若你未受伤改为摸两张牌）；为0，目标角色视为对你使用同名牌。",[]],["威名","锁定技，体力值小于你或本轮受到过你造成伤害的其他角色对你使用牌时，随机弃置一张手牌，若皆满足，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星颜良","t":"狰颤四方","k":"群","kh":4,"mh":4,"g":"男","s":[["急战","当你于回合内首次使用伤害牌指定第一个目标后，你可以令此牌对其中一个目标造成的伤害+2（本回合你每使用过一张非伤害牌，此数值便-1）。然后此牌结算结束后，若此牌未造成过伤害，其对你造成1点伤害。",[]],["促狭","锁定技，当其他角色对你使用牌时，若其体力值大于你或本轮对你造成过伤害，其随机弃置一张手牌；若均满足，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星袁绍","t":"熏灼群魔","k":"群","kh":4,"mh":4,"g":"男","s":[["硝焰","游戏开始时，所有其他角色各受到你造成的1点火焰伤害，然后这些角色可以依次交给你一张牌并回复1点体力。",[]],["纵势","出牌阶段，你可以展示一张基本牌或普通锦囊牌，然后将此花色的所有其他手牌当这张牌使用（此牌可指定的目标数改为以此法使用的牌数）。",[]],["骄妄","锁定技，每轮结束时，若本轮没有角色死亡，你失去1点体力并发动〖硝焰〗。",["锁定技"]],["傲势","主公技，其他群势力角色的出牌阶段限一次，其可以交给你一张手牌，然后你可以发动一次〖纵势〗。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星袁术","t":"狂貔猖貅","k":"群","kh":4,"mh":4,"g":"男","s":[["残玺","锁定技，游戏开始时，你获得场上各势力的“玺角”标记，其中魏、蜀、吴、群每少一个势力你加1点体力上限。每轮开始时，你选择一个“玺角”势力并选择一个效果生效直到下轮开始： 「妄生」：该势力角色每回合首次造成伤害+1，计算与其他角色距离-1； 「向死」：该势力其他角色每回合首次回复体力后失去1点体力，每回合对你使用的第一张牌对你无效。",["锁定技"]],["圮秩","锁定技，结束阶段，你摸X张牌；有角色死亡时，若其势力与生效“玺角”的势力相同或是该势力最后一名角色，失去该“玺角”，然后摸X张牌并回复1点体力（X为你失去的“玺角”数）。",["锁定技"]],["冢骨","主公技，锁定技，若游戏轮数不小于群势力角色数，你摸牌阶段摸牌数+2，否则-1。",["主公技","锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星张郃","t":"河北之庭柱","k":"群","kh":4,"mh":4,"g":"男","s":[["峻袭","出牌阶段开始时，你可以选择一名其他角色并记录你此时的手牌数。此阶段结束时，该角色需弃置牌并失去体力，弃牌和失去体力总数为X（X为你此时手牌数和此阶段开始时手牌数之差）；若X为0，你弃置两张牌。",[]],["机先","若你回合的第一个出牌阶段没有使用基本和锦囊牌，则弃牌阶段结束后你可以执行一个额外的出牌阶段，此阶段你不能使用装备牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星张让","t":"斗筲穿窬","k":"群","kh":3,"mh":3,"g":"男","s":[["蠹害","当你成为其他角色使用牌的目标后，你可以选择一种花色，令其获得此花色的“蠹”标记。该角色的回合结束时，若其手牌中有“蠹”标记花色的牌，其失去这些花色数的体力，然后移去这些花色的“蠹”标记。",[]],["令色","出牌阶段限一次，你可以交给一名其他角色一张牌，然后随机获得其两张此类别的牌，若不足两张，其视为对你使用一张【杀】，若此【杀】造成伤害，此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"荀谌","t":"三公谋主","k":"群","kh":3,"mh":3,"g":"男","s":[["锋略","出牌阶段限一次，你可以和一名角色拼点。若：你赢，你获得其区域里的两张牌；你与其均没赢，你获得你的拼点牌且此技能视为未发动过；其赢，其获得你拼点的牌。",[]],["暗涌","当一名角色于其回合内第一次造成伤害后，若此伤害值为1，你可以弃置一张牌对受到伤害的角色造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"徐荣","t":"玄菟战魔","k":"群","kh":4,"mh":4,"g":"男","s":[["凶镬","游戏开始时，你获得3个“暴戾”标记（标记上限为3）。出牌阶段，你可以交给一名其他角色一个“暴戾”标记，你对有此标记的其他角色造成的伤害+1，且其出牌阶段开始时，移去“暴戾”并随机执行一项：1.受到1点火焰伤害且本回合不能对你使用【杀】；2.流失1点体力且本回合手牌上限-1；3.你随机获得其两张牌。",[]],["杀绝","锁定技，其他角色进入濒死状态时，你获得一个“暴戾”标记，若其需要超过一张【桃】或【酒】救回，你获得使其进入濒死状态的牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"许劭","t":"识人读心","k":"群","kh":4,"mh":4,"g":"男","s":[["评荐","出牌阶段，或结束阶段，或当你受到伤害后，你可以从对应时机的技能池中随机抽取三个技能，选择并发动其中一个（每个技能限发动一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"严夫人","t":"霜天薄裳","k":"群","kh":3,"mh":3,"g":"女","s":[["谗逆","出牌阶段限一次，你可以交给一名其他角色任意张手牌，然后该角色可以将X张手牌当一张【决斗】使用（X至多为你以此法交给其的牌数），其此使用【决斗】：造成伤害后，其摸X张牌；受到伤害后，你弃置所有手牌。",[]],["匿伏","锁定技，每名角色的回合结束时，你将手牌摸或弃至三张。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杨彪","t":"德彰海内","k":"群","kh":3,"mh":3,"g":"男","s":[["昭汉","摸牌阶段，你可以多摸两张牌，然后选择一项：1.交给一名没有手牌的角色两张手牌；2.弃置两张手牌。",[]],["尽节","每轮限一次，一名角色进入濒死状态时，你可以令其摸0~3张牌，然后你可以弃置等量的牌令其回复1点体力。",[]],["举讹","每轮限一次，一名角色的结束阶段，你可以视为随机对其使用【过河拆桥】、【杀】或【五谷丰登】共计X次（X为本回合因弃置而进入弃牌堆的牌数，至多为其体力上限）；若为你，改为你选择一名其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杨弘","t":"柔迩驭远","k":"群","kh":3,"mh":3,"g":"男","s":[["间计","出牌阶段限一次，你可以令至多X名相邻的角色各弃置一张牌（X为你的攻击范围），然后你令其中手牌数最多的一名角色选择是否视为对其中的另一名角色使用一张【杀】。",[]],["远谟","准备阶段或你受到伤害后，你可以选择一项：1.令你的攻击范围+1，然后获得任意名因此进入你攻击范围内的角色各一张牌；2.令你的攻击范围-1，然后摸两张牌。 结束阶段，若你攻击范围内没有角色，你可以令你的攻击范围+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"阎象","t":"冢中鸣鹄","k":"群","kh":3,"mh":3,"g":"男","s":[["谕诤","出牌阶段每项各限一次，你可以令一名角色选择一项：1.将手牌数调整至与全场最少角色相同，本轮其下X次使用或打出牌后摸两张牌（X为其以此法弃置的牌数）；2.摸等同于体力上限张牌（至多为5），本轮增加等量手牌上限，且本轮至多可以再使用等量张牌。",[]],["邃识","一名角色的结束阶段，若其手牌数不小于体力值，你可以声明一种伤害牌牌名，令其可以将一张牌当此牌使用，若此牌造成伤害，受到伤害的角色不能使用与造成伤害的牌颜色相同的牌直到其回合结束。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"爻袁术","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["爻疑","锁定技，分发起始手牌时，你的起始手牌背置。你可以将一张背置的牌当一张基本牌或普通锦囊牌使用或打出（每回合每张牌名限一次）。",["锁定技"]],["谶纬","转换技，阳：当你使用一张背置牌时，你可以令一名角色将你的一张手牌翻面；阴：当你使用一张非背置牌时，你可以将获得一名其他角色的牌并将此牌背置。",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"袁谭袁尚袁熙","t":"兄弟阋墙","k":"群","kh":4,"mh":4,"g":"男","s":[["内伐","出牌阶段开始时，你可以摸三张牌，然后弃置一张牌。若弃置的牌：是基本牌，你本回合不能使用锦囊牌，本阶段使用【杀】次数上限+X，目标上限+1；锦囊牌，你本回合不能使用基本牌，使用普通锦囊牌的目标+1或-1（X为发动技能时手牌中因本技能不能使用的牌且至多为5）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"袁胤","t":"载路素车","k":"群","kh":3,"mh":3,"g":"男","s":[["墨守","当你成为黑色牌的目标后，你可以摸体力上限张牌，然后下次以此法摸牌数-1。若你以此法摸牌数为1，则重置为体力上限。",[]],["运柩","当一名角色死亡时，你可以将其一张牌交给一名其他角色。若如此做，你加1点体力上限并回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"于毒","t":"朝歌渠帅","k":"群","kh":5,"mh":5,"g":"男","s":[["坚垒","你可以将装备区内的黑色/红色牌当【杀】/【闪】使用或打出。你的装备栏内每有一种花色，你的攻击范围+1，若包含四种花色，其他角色计算与你的距离+1。",[]],["踞峙","出牌阶段每种花色限一次，你可以将一张手牌置于你的空置装备栏，视为对攻击范围内的一名角色使用一张【杀】；回合结束时，若你在以此法指定的目标攻击范围内，其可以弃置一张牌并视为对你使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"笮融","t":"刺血济饥","k":"群","kh":4,"mh":4,"g":"男","s":[["残肆","锁定技，准备阶段，你选择一名其他角色，你与其各回复1点体力，然后依次视为对其使用【杀】【决斗】和【火攻】，其每因此受到1点伤害，你摸两张牌。",["锁定技"]],["佛宗","锁定技，出牌阶段开始时，若你的手牌多于七张，你将超出数量的手牌置于武将牌上，然后若你武将牌上有至少七张牌，其他角色依次选择一项：1.获得其中一张牌并令你回复1点体力；2.令你失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张宝","t":"地公将军","k":"群","kh":3,"mh":3,"g":"男","s":[["咒缚","出牌阶段限一次，你可以将一张手牌置于一名没有“咒”的其他角色的武将牌旁，称为“咒”（当有“咒”的角色判定时，将“咒”作为判定牌）。",[]],["影兵","锁定技，每回合每名角色限一次，当你使用牌指定有“咒”的角色为目标后，你摸两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张楚","t":"大贤后裔","k":"群","kh":3,"mh":3,"g":"女","s":[["集众","出牌阶段限一次，你可以令一名其他角色摸两张牌，其选择：1.成为“信众”；2.令你获得其三张牌。",[]],["日慧","每回合限一次，当你使用指定唯一其他角色为目标的普通锦囊牌或黑色基本牌后，若其：不是“信众”，所有“信众”均视为对其使用此牌；是“信众”，你可以获得其区域内的一张牌。",[]],["光噬","锁定技，准备阶段，若所有其他角色均是“信众”，你摸X张牌（X为这些角色数），失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张横","t":"戾鹘枭鹰","k":"群","kh":8,"mh":8,"g":"男","s":[["粮绝","锁定技，每当一张黑色牌进入或者离开你的判定区或装备区后，你摸两张牌，然后若你的体力值大于1，你失去1点体力。",["锁定技"]],["挡灾","出牌阶段开始时，你可以选择一名判定区内有牌的其他角色，将其判定区里的任意张牌移至你的判定区。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"张奂","t":"正身洁己","k":"群","kh":4,"mh":4,"g":"男","s":[["义拒","锁定技，其他角色使用牌指定你为唯一目标后，你弃置一张牌。",["锁定技"]],["戍国","每回合结束时，你可以依次使用本回合因弃置而置入弃牌堆的牌直到你使用了其他角色弃置的牌。若你的手牌数不为全场唯一最多，每有一张本回合弃置的牌没有使用，你摸一张牌（至多摸五张）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张济","t":"武威雄豪","k":"群","kh":4,"mh":4,"g":"男","s":[["掠命","出牌阶段限一次，你选择一名装备区装备少于你的其他角色，令其选择一个点数，然后你进行判定：若点数相同，你对其造成2点伤害；不同，你随机获得其区域内的一张牌。",[]],["屯军","限定技，出牌阶段，你可以选择一名角色，令其随机使用牌堆中的X张不同类型的装备牌（不替换原有装备，X为你发动〖掠命〗的次数）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张闿","t":"无餍狍鸮","k":"群","kh":4,"mh":4,"g":"男","s":[["相鼠","其他角色出牌阶段开始时，若其手牌数不小于体力值，你可以声明一个0~5的数字（若你弃置一张手牌，则数字不公布）。此阶段结束时，若其手牌数与你声明的数：相差1以内，你获得其一张牌；相等，你对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"张梁","t":"人公将军","k":"群","kh":4,"mh":4,"g":"男","s":[["集军","当你于出牌阶段内使用武器或非装备牌指定你为目标后，你可以判定。当此次判定的判定牌移至弃牌堆后，你可以将此判定牌置于你的武将牌上（称为“方”）。",[]],["方统","结束阶段，你可以弃置一张牌，然后将至少一张“方”置入弃牌堆。若此牌与你以此法置入弃牌堆的所有“方”的点数之和为36，你对一名其他角色造成3点雷电伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张曼成","t":"蚁萃宛洛","k":"群","kh":4,"mh":4,"g":"男","s":[["掠城","出牌阶段限一次，你可以选择一名其他角色，你本回合对其使用当前手牌中的【杀】无次数限制。若如此做，回合结束时，该角色展示手牌：若其中有【杀】，其可以对你依次使用手牌中所有的【杀】。",[]],["螽集","当你使用牌时，若你没有该花色的手牌且手牌数小于体力上限，你可以将手牌摸至体力上限并弃置X张牌（X为本回合发动此技能的次数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张邈","t":"苔岑往却","k":"群","kh":4,"mh":4,"g":"男","s":[["谋逆","准备阶段，你可对一名其他角色依次使用你手牌中所有的【杀】直到该角色进入濒死状态。若以此法使用的【杀】中有未造成伤害的【杀】，你本回合跳过出牌阶段和弃牌阶段。",[]],["纵反","觉醒技，回合结束时，若你本回合发动〖谋逆〗使用过【杀】且未跳过出牌阶段，你交给一名其他角色任意张牌，加X点体力上限并回复X点体力（X为你交给该角色的牌数且最多为5），失去〖谋逆〗，获得〖战孤〗。",["觉醒技"]],["战孤","锁定技，回合开始时，若你体力上限大于1且没有手牌或装备区没有牌，你减1点体力上限，然后从牌堆中随机获得三张不同类别的牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张宁","t":"大贤后人","k":"群","kh":3,"mh":3,"g":"女","s":[["天则","当其他角色于其出牌阶段内使用第一张黑色牌结算结束后，你可以弃置一张黑色牌，对其造成1点伤害；当其他角色的黑色判定牌生效后，你摸一张牌。",[]],["地法","每回合限一次，当你于回合内得到红色牌后，你可以弃置其中一张牌，然后选择一种锦囊牌的牌名，从牌堆或弃牌堆获得一张此牌名的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"张琪瑛","t":"禳祷西东","k":"群","kh":3,"mh":3,"g":"女","s":[["法箓","当你失去一张手牌时，记录此牌花色（只记录最近三次）。当记录的三个花色相同时，你移除记录花色并从牌堆中获得其他三种花色的牌各一张；当记录的三个花色各不相同时，你移除记录花色并可以令一名角色失去或回复1点体力。",[]],["真仪","锁定技，当“法箓”移除三个同花色后，你本局游戏使用此花色的牌无距离限制且不能被响应。当“法箓”移除三个各不相同的花色后，你本局游戏“点化”可观看的牌数+1（最多+4）。",["锁定技"]],["点化","准备阶段或结束阶段，你可以观看牌堆顶1张牌，然后获得其中一张牌，其余的牌以任意顺序放回牌堆顶。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张让","t":"窃幸绝禋","k":"群","kh":3,"mh":3,"g":"男","s":[["滔乱","每种牌名限一次、每回合每种花色限一次，你可以将一张牌当任意基本牌或普通锦囊牌使用，然后令一名其他角色选择：1.交给你一张类别不同的牌；2.本回合此技能失效，且此回合结束时你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张任","t":"索命神射","k":"群","kh":4,"mh":4,"g":"男","s":[["穿心","当你于出牌阶段内使用【杀】或【决斗】对目标角色造成伤害时，你可以防止此伤害。若如此做，该角色选择一项：1.弃置装备区内的所有牌，然后失去1点体力；2.弃置两张手牌，然后非锁定技失效直到回合结束。",[]],["锋矢","当你使用【杀】指定目标后，若你不在其攻击范围内，你可以弃置该角色装备区内的一张防具牌或防御坐骑牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张世平","t":"慷赀桃园","k":"群","kh":3,"mh":3,"g":"男","s":[["镔济","每轮开始时，你可以摸三张牌，然后交给至多三名其他角色各一张牌，这些角色失去这些牌时从牌堆或弃牌堆随机获得一张武器牌，然后你摸一张牌。",[]],["驵贸","出牌阶段限三次，你可以：1.弃置任意张♦牌，然后从牌堆或弃牌堆随机获得等量张坐骑牌；2.交给一名其他角色一张♦牌，然后获得其装备区一张坐骑牌；3.将一张坐骑牌置入一名其他角色装备区，然后其交给你两张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张勋","t":"仲家将军","k":"群","kh":4,"mh":4,"g":"男","s":[["随征","结束阶段，你可以选择一名角色，该角色下个回合的出牌阶段使用【杀】无距离限制且可以多使用一张【杀】；其出牌阶段结束时，你可以视为对其本阶段造成过伤害的一名其他角色使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"张燕","t":"黑山飞燕","k":"群","kh":4,"mh":4,"g":"男","s":[["趫掠","当你使用牌指定其他角色为目标后，若目标角色本局游戏第一次成为此牌名的目标，你可以获得其一张牌。",[]],["悍捷","其他角色回合开始时，若其体力值不小于你，你可以将一张黑色手牌当一张伤害牌对其使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"张仲景","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["病论","每回合限一次，有角色受到伤害时，你可以选择一名角色，你摸一张牌并选择一张手牌置于其武将牌上，称为“论”。有“论”的角色每回合首次使用与“论”花色相同的牌无次数限制。若一名角色拥有相同花色的“论”时，移除其此花色的“论”，其摸一张牌并回复1点体力。",[]],["坐堂","每轮限两次，其他角色出牌阶段开始时，你可以令其交给你至多两张手牌，你可以交给其等量手牌并令其回复1点体力，若其未交给你牌，直到其下个回合开始，其受到伤害后失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵云","t":"白马先锋","k":"群","kh":4,"mh":4,"g":"男","s":[["冲阵","每当你发动〖龙胆〗使用或打出一张手牌时，你可以立即获得对方的一张手牌或对对方造成1点伤害。若其因此失去最后一张手牌或进入濒死状态，你摸两张牌。",[]],["龙胆","你可以将一张【杀】当【闪】使用或打出，或将一张【闪】当普通【杀】使用或打出。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵忠","t":"骄纵窃幸","k":"群","kh":6,"mh":6,"g":"男","s":[["殃众","当你造成或受到伤害后，伤害来源可以弃置两张牌，令受到伤害的角色失去1点体力。",[]],["惶恐","锁定技，你的回合外，当你成为【杀】或普通锦囊牌的目标后，若你没有手牌，你摸两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"郑玄","t":"博世儒宗","k":"群","kh":4,"mh":4,"g":"男","s":[["注经","每轮开始时或你的回合开始时，你可以令至多三名角色获得一项效果直到本轮结束： 1.使用【杀】须指定所有可指定的目标； 2.手牌中的【闪】可以当【无懈可击】使用； 3.处于濒死状态时才可使用【桃】或【酒】，且使用后本回合下次受到伤害+1； 4.每回合只能使用两张锦囊牌，且只能指定攻击范围内的角色为目标。",[]],["敷教","锁定技，有〖注经〗效果的角色使用被效果影响的牌时，你摸一张牌。你阵亡时，你令至多三名角色获得一项〖注经〗效果，若已经执行过所有选项，改为选择两个选项。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"甄姬","t":"善言贤女","k":"群","kh":3,"mh":3,"g":"女","s":[["己诫","锁定技，每回合各限一次，当其他角色于其回合外得到牌后/回复体力后，你摸等量的牌/回复等量的体力。",["锁定技"]],["惠济","出牌阶段限一次，你可以令一名角色摸两张牌或使用牌堆中的一张随机装备牌。然后若其手牌数不小于存活角色数，其视为使用一张【五谷丰登】（改为从该角色的手牌中挑选）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"诸葛京","t":"武侯遗秀","k":"群","kh":4,"mh":4,"g":"男","s":[["研作","出牌阶段限一次，你可以将一张牌置于武将牌上，然后视为使用一张“研作”基本牌或普通锦囊牌。",[]],["祖荫","锁定技，当你成为其他角色使用【杀】或普通锦囊牌的目标后，若“研作”牌中：没有同名牌，令〖研作〗出牌阶段可发动次数+1（至多为3），然后你从牌堆或弃牌堆中将一张同名牌置为“研作”牌；有同名牌，令此牌无效并移去“研作”牌中全部同名牌。",["锁定技"]],["辟剑","锁定技，结束阶段，若“研作”牌数不少于存活角色数，你移去这些牌，然后对一名角色造成2点伤害。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"朱建平","t":"识面知秋","k":"群","kh":3,"mh":3,"g":"男","s":[["相面","出牌阶段限一次，你可以令一名其他角色进行一次判定，当该角色使用判定花色的牌或使用第X张牌后（X为判定点数），其失去所有体力。每名其他角色限一次。",[]],["天机","锁定技，生效后的判定牌进入弃牌堆后，你从牌堆随机获得与该牌类型、花色和点数相同的牌各一张。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"朱儁","t":"征无疑虑","k":"群","kh":4,"mh":4,"g":"男","s":[["攻坚","每回合限一次，当一名角色使用【杀】指定目标后，若此【杀】与上一张【杀】有相同的目标，则你可以弃置其中相同目标角色各至多两张牌，你获得其中的【杀】。",[]],["溃蟒","锁定技，当一名角色死亡时，若你对其造成过伤害，你摸两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"祝融","t":"诗惹喜莫","k":"群","kh":4,"mh":4,"g":"女","s":[["蛮后","出牌阶段限一次，你可以摸至多四张牌，依次执行前等量项：1.失去〖探乱〗；2.弃置一张手牌；3.弃置场上一张牌； 4.失去1点体力并获得〖探乱〗。",[]],["探乱","出牌阶段限一次，你可以使用一张本回合因弃置而进入弃牌堆的牌（有次数限制），若因此使用的牌被【无懈可击】抵消或对其他角色造成了伤害，〖蛮后〗视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"猪猪侠","t":"","k":"群","kh":4,"mh":4,"g":"男","s":[["糖果","你使用牌指定自己为目标后，获得一个“糖果”。你使用牌指定其他角色为目标后，若“糖果”数大于其手牌数，其不能响应此牌。出牌阶段限一次，你可以移去任意个“糖果”并摸等量的牌。",[]],["亢掌","当你对其他角色造成伤害后，你可以将一张♠手牌当【杀】对该角色使用，或将一张♥手牌当【桃】对自己使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"邹氏","t":"惑心之魅","k":"群","kh":3,"mh":3,"g":"女","s":[["祸水","准备阶段，你可以令至多X名其他角色（X为你已损失体力值，至少为1，至多为3）按你选择的顺序依次执行一项：1.本回合所有非锁定技失效；2.交给你一张手牌；3.弃置装备区里的所有牌。",[]],["倾城","出牌阶段限一次，你可以与一名手牌数不大于你的男性角色交换手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"东海龙王","t":"呼风唤雨","k":"神","kh":3,"mh":3,"g":"男","s":[["龙宫","每回合限一次，当你受到伤害时，你可以防止此伤害，改为令伤害来源随机获得牌堆中的一张装备牌。",[]],["司天","出牌阶段，你可以弃置两张不同花色的手牌，然后改变天气（从两个选项中选择一项）： 烈日：对其他角色各造成1点火焰伤害； 雷电：所有其他角色各进行一次【闪电】判定； 大浪：所有其他角色弃置装备区所有牌（没有装备则失去1点体力）； 暴雨：弃置一名角色所有手牌（没有手牌则失去1点体力）； 大雾：所有其他角色使用的下一张基本牌无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"李白","t":"诗人卧词","k":"神","kh":3,"mh":3,"g":"男","s":[["酒仙","你使用【酒】无次数限制，你可以将多目标锦囊牌当【酒】使用。",[]],["诗仙","你使用一张牌时，若此牌与你本回合使用的上一张牌押韵，你可以摸一张牌并令此牌额外执行一次效果。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"哪吒","t":"三坛海会大神","k":"神","kh":3,"mh":3,"g":"男","s":[["三头","锁定技，你的体力上限始终为3，防止你受到的所有伤害。 若你体力值不小于3且本回合已因此技能防止过该伤害来源的伤害，你失去1体力； 若你体力值为2且防止的伤害为属性伤害，你失去1体力； 若你体力值为1且防止的伤害为红色牌造成的伤害，你失去1体力。",["锁定技"]],["法器","出牌阶段，当你使用装备牌后，你可以视为使用一张普通锦囊牌（每回合每种牌名限一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神曹丕","t":"月晦书轮回","k":"神","kh":4,"mh":4,"g":"男","s":[["阴鸷","出牌阶段限一次，你可以选择一名其他角色并摸X张牌，该角色直至其回合开始：所有非锁定技失效，其每次使用或打出手牌后你摸X张牌（X为本局游戏你对其发动〖阴鸷〗的次数且至多为3）。然后其于其回合内不能使用或打出非本回合内获得的牌，若其对你造成伤害，则此效果消失。",[]],["刻名","当你受到其他角色造成的伤害后，若其武将牌上有此时机触发的技能，则你可以触发此技能；若没有，则你可以从“曹”姓武将中随机触发一个此时机的技能。当你对其他角色造成伤害后，该角色下次发动准备阶段、结束阶段或出牌阶段内发动的技能后，若该角色因此技能摸牌或使用了牌，你可以摸等量同名牌（至多五张）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神邓艾","t":"带砺山河","k":"神","kh":4,"mh":4,"g":"男","s":[["拓域","锁定技，你的手牌区域添加三个未开发的副区域： 丰田：伤害和回复值+1； 清渠：无距离和次数限制； 峻山：不能被响应。 出牌阶段开始时和结束时，你将手牌分配至已开发的副区域中，每个区域至多五张。",["锁定技"]],["险进","锁定技，当你造成或受到两次伤害后开发一个手牌副区域，摸X张牌（X为你已开发的手牌副区域数，若你手牌全场最多则改为1）。",["锁定技"]],["奇径","觉醒技，每个回合结束时，若你的手牌副区域均已开发，你减1点体力上限，获得技能〖摧心〗，然后将座次移动至相邻的两名其他角色之间并执行一个额外回合。",["觉醒技"]],["摧心","当你不以此法对上家/下家使用的牌结算后，你可以视为对下家/上家使用一张同名牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神典韦","t":"袒裼暴虎","k":"神","kh":4,"mh":4,"g":"男","s":[["捐甲","锁定技，游戏开始时，你废除防具栏，然后获得一个额外的武器栏。",["锁定技"]],["挈挟","锁定技，准备阶段，若你有空置的武器栏，则你随机观看武将牌堆中五张武将牌（须带有描述中含有“【杀】”且不具有除锁定技以外标签的技能），将其中至少一张当武器牌置入装备区（称为【左膀】和【右臂】，无花色点数，攻击范围为对应武将牌的体力上限，效果为其符合上述条件的技能，离开你的装备区时销毁）。",["锁定技"]],["摧决","出牌阶段，你可以弃置一张牌，然后对攻击范围内距离最远且本回合未以此法选择过的一名其他角色造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神貂蝉","t":"","k":"神","kh":4,"mh":4,"g":"女","s":[["绯祸","锁定技，每轮开始时，你令所有其他角色获得〖迷朦〗。一名角色〖迷朦〗可用次数大于2时，该角色非锁定技失效。",["锁定技"]],["神魅","每轮限一次，其他角色的出牌阶段开始时，你可以与其各弃置任意牌，若：其弃置的牌数小于等于你；你弃置的牌包含♥或♠；你们为异性；每满足一项，其〖迷朦〗可用次数+1。",[]],["迷朦","锁定技，每局游戏限0次，你使用牌指定目标时，改为由神貂蝉指定任意名合法目标，此牌结算后神貂蝉摸一张牌。你每回合首次对神貂蝉造成伤害后，本技能可发动次数+1。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神关羽","t":"神鬼再临","k":"神","kh":5,"mh":5,"g":"男","s":[["武神","锁定技，你的♥手牌视为【杀】；你使用♥【杀】无距离和次数限制，且造成伤害后你摸一张牌。",["锁定技"]],["武魂","锁定技，当你造成/受到1点伤害后，你令受伤角色/伤害来源获得1枚“梦魇”；当你死亡时，你令拥有“梦魇”标记最多的一名其他角色进行判定，若结果不为【桃】或【桃园结义】，其死亡。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神黄忠","t":"战意破苍穹","k":"神","kh":4,"mh":4,"g":"男","s":[["裂穹","当你对其他角色造成伤害后，你可以选择以下任一部位进行“击伤”： 力烽：令其随机弃置一半手牌（向上取整）； 地机：令其下次受到伤害+1直到其回合结束； 中枢：令其使用下一张牌失效直到其回合结束。 气海：令其不能使用或打出♥牌直到其回合结束。 若你本回合击伤过该角色，则额外出现“天冲”：令其失去所有体力，然后若其死亡，则你加1点体力上限。",[]],["斩决","出牌阶段开始时，你可以选择一项：1.摸体力值数量的牌，令你此阶段使用下一张【杀】无距离限制且不可被响应；2.摸已损失体力值数量的牌，令你于此阶段下一次造成伤害后回复等量体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神华佗","t":"灵魂的医者","k":"神","kh":3,"mh":3,"g":"男","s":[["静域","锁定技，每项技能每轮限一次，当一名角色发动除〖静域〗外的技能时，你摸一张牌。 注：请不要反馈此技能相关的任何问题",["锁定技"]],["滤心","出牌阶段限一次，你可以交给一名其他角色一张手牌，然后选择一项：1.令其摸X张牌；2.令其随机弃置X张手牌（X为游戏轮数且至多为5）。若其以此法摸到/弃置与你交给其的牌名相同的牌，则其下次发动技能时，其回复1点体力/失去1点体力。 注：请不要反馈此技能相关的任何问题",[]],["寰道","限定技，出牌阶段，你可以选择一名其他角色，令其复原武将牌，然后其可随机获得一项同名武将的技能并选择失去一项其他技能。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神姜维","t":"怒麟布武","k":"神","kh":4,"mh":4,"g":"男","s":[["天任","锁定技，当一张基本牌或普通锦囊牌不因使用而置入弃牌堆后，你获得1个“天任”标记，然后若“天任”标记数不小于X，你移去X个“天任”标记，加1点体力上限并摸两张牌（X为你的体力上限）。",["锁定技"]],["九伐","当你每累计使用或打出九张不同牌名的牌后，你可以亮出牌堆顶的九张牌，然后若其中有点数相同的牌，你选择并获得其中每个重复点数的牌各一张。",[]],["平襄","限定技，出牌阶段，若你的体力上限大于9，你可以减9点体力上限。若如此做，你失去技能〖九伐〗且本局游戏内你的手牌上限等于体力上限，然后你可以视为使用至多九张火【杀】。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神刘备","t":"誓守桃园义","k":"神","kh":6,"mh":6,"g":"男","s":[["龙怒","转换技，锁定技，出牌阶段开始时，阳：你失去1点体力并摸等同于你已损失体力值张牌，然后本回合你的红色手牌均视为火【杀】且无距离限制；阴：你减1点体力上限并摸等同于你体力值张牌，然后本回合你的锦囊牌均视为雷【杀】且无次数限制。",["转换技","锁定技"]],["结营","锁定技，你始终处于横置状态；已横置的角色手牌上限+2；结束阶段，你横置一名其他角色，然后令任意名已横置的角色各摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神马超","t":"神威天将军","k":"神","kh":4,"mh":4,"g":"男","s":[["狩骊","游戏开始时，从下家开始所有角色随机使用牌堆中的一张坐骑。你可以将场上的一张进攻马当【杀】（无次数限制）、防御马当【闪】使用或打出，以此法失去坐骑的其他角色本回合非锁定技失效，你与其本回合受到的伤害+1且改为雷电伤害。",[]],["横骛","当你使用或打出牌时，若你没有该花色的手牌，你可以摸X张牌（X为场上与此牌花色相同的装备数量）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神庞统","t":"丹血浴火","k":"神","kh":1,"mh":1,"g":"男","s":[["鸾锁","锁定技，你的回合内，所有角色不能弃置手牌且当前手牌与本回合进入弃牌堆的牌花色均不同的牌视为【铁索连环】。",["锁定技"]],["凤燎","锁定技，转换技，当你使用牌指定唯一目标后，阳：你令其摸一张牌；阴：你对其造成1点火焰伤害。",["锁定技","转换技"]],["鹍浴","锁定技，你的体力上限始终为1，当你濒死求桃结算后，若体力值仍小于1，你将牌堆中的一张火属性伤害牌移出游戏，然后将体力值调整至1点。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神孙权","t":"瀚海碧君","k":"神","kh":4,"mh":4,"g":"男","s":[["沧溟","锁定技，游戏开始时，所有角色同时将手牌置于武将牌上，称为“溟”；当有牌被置为“溟”后，每有一种颜色，你摸一张牌；一名角色受到伤害后或其回合开始时，该角色获得其所有“溟”。",["锁定技"]],["筹汐","出牌阶段，你可以将一张牌当场上“溟”里的一张无距离和次数限制的基本牌或普通锦囊牌使用（每种牌名每回合限一次）。",[]],["激潮","出牌阶段限一次，你可以选择一项：1.令一名其他角色随机将一半数量的手牌（向上取整）和装备区里的牌置于武将牌上称为“溟”；2.令所有其他角色同时将其所有牌置于武将牌上称为“溟”，然后此项失效直到你累计造成3点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神许褚","t":"嗜战的熊罴","k":"神","kh":5,"mh":5,"g":"男","s":[["争擎","锁定技，每轮结束时，移去所有“擎”标记，然后本轮单回合内造成伤害值最多的角色获得X个“擎”标记并与你各摸一张牌（X为其该回合造成的伤害数）。若是你获得“擎”，你改为摸X张牌（最多摸5张）。",["锁定技"]],["壮魄","你可以将牌面信息中有【杀】字的牌当【决斗】使用。若你拥有“擎”，则此【决斗】指定目标后，你可以移去任意个“擎”，然后令其弃置等量的牌；若此【决斗】指定了有“擎”的角色为目标，则你摸一张牌且此【决斗】伤害+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神张飞","t":"两界大巡环使","k":"神","kh":4,"mh":4,"g":"男","s":[["神裁","出牌阶段限一次，你可以令一名其他角色进行判定，你获得判定牌。若判定牌包含以下内容，其获得（已有标记则改为修改）对应标记： 体力：“笞”标记，每次受到伤害后失去等量体力； 武器：“杖”标记，无法响应【杀】； 打出：“徒”标记，不因本技能失去手牌后随机弃置一张手牌； 距离：“流”标记，结束阶段将武将牌翻面； 若判定牌不包含以上内容，该角色获得一个“死”标记且手牌上限减少其身上“死”标记个数，然后你获得其区域内一张牌。“死”标记个数大于场上存活人数的角色回合结束时，其立即死亡。",[]],["巡使","锁定技，你的多目标锦囊牌均视为无色【杀】。你使用无色牌无距离和次数限制且可以额外指定任意个目标，然后〖神裁〗的发动次数+1（至多为5）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神张角","t":"末世的起首","k":"神","kh":4,"mh":4,"g":"男","s":[["异兆","锁定技，你使用或打出一张牌，或你的牌因弃置进入弃牌堆时，获得等同于此牌点数的“黄”标记，然后若“黄”标记数的十位数变化，你随机获得牌堆中一张点数为变化后十位数的牌。",["锁定技"]],["三首","当你受到伤害时，你可以亮出牌堆顶的三张牌，若其中有本回合所有角色均未使用过的牌的类型，防止此伤害。",[]],["肆军","准备阶段，若“黄”标记数大于牌堆里的牌数，你可以移去所有“黄”标记并洗牌，然后获得随机张点数之和为36的牌。",[]],["天劫","一名角色的回合结束时，若本回合牌堆进行过洗牌，你可以对至多三名其他角色各造成X点雷电伤害（X为其手牌中【闪】的数量且至少为1）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神张辽","t":"雁门之刑天","k":"神","kh":5,"mh":5,"g":"男","s":[["夺锐","锁定技，你对其他角色造成伤害时，你废除其一个装备栏直到你的下个出牌阶段开始。",["锁定技"]],["猝袭","其他角色回合开始时，你可以弃置一张牌，然后令其选择一项：1.跳过摸牌阶段并令你摸两张牌；2.其受到你造成的1点伤害。",[]],["止啼","锁定技，摸牌阶段，你多摸X张牌（X为场上所有被废除的装备栏数，至多为5）；其他角色弃牌阶段结束时，若其有被废除的装备栏，你弃置其区域内等量张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"神钟会","t":"荡徊的蜚螭","k":"神","kh":4,"mh":4,"g":"男","s":[["凛界","每轮开始时，你可以对一名没有“凛”的角色造成1点伤害，然后令其获得一枚“凛”标记。有“凛”的其他角色受到伤害后，其随机弃置一张手牌，若其因此弃置了最后一张手牌，你对其造成1点伤害并移去其“凛”。",[]],["独仗","每回合限一次，当你使用黑色牌指定唯一目标后或成为黑色牌的唯一目标后，你可以摸一张牌并获得一枚“凛”。你的手牌上限+X（X为你的“凛”数）。",[]],["降祸","觉醒技，回合开始时，若所有存活角色本局游戏均受到过伤害，你将所有“凛”移至你的武将牌上，摸“凛”等量的牌，然后加1点体力上限，失去〖凛界〗，获得〖立世〗。",["觉醒技"]],["立世","锁定技，结束阶段，若你没有“凛”，你受到1点雷电伤害；若你有“凛”，你失去任意个“凛”并选择等量选项令所有其他角色执行：\n1.下个准备和结束阶段非锁定技失效；\n2.下个判定阶段在【闪电】、【乐不思蜀】和【兵粮寸断】中选择两个并依次进行判定；\n3.下个摸牌阶段摸到的牌若颜色相同，则全部弃置；\n4.下个出牌阶段每种类型的手牌仅能使用一张；\n5.下个弃牌阶段弃置的牌改为被你获得。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"孙悟空","t":"斗战胜佛","k":"神","kh":3,"mh":3,"g":"男","s":[["金睛","锁定技，其他角色的手牌对你可见。",["锁定技"]],["如意","锁定技，你手牌中的武器牌均视为【杀】，你废除武器栏。你的攻击范围基数为3，出牌阶段限一次，你可以调整攻击范围（1~4）。若你的攻击范围基数为：1，使用【杀】无次数限制；2，使用【杀】伤害+1；3，使用【杀】无法响应；4，使用【杀】可额外选择一个目标。",["锁定技"]],["慈悲","每回合每名角色限一次，当你对其他角色造成伤害时，你可以防止此伤害，摸五张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"涛神","t":"驱水为涛","k":"神","kh":3,"mh":3,"g":"男","s":[["怒涛","锁定技，当你使用锦囊牌指定目标后，你随机对一名其他目标角色造成1点雷电伤害；当你于出牌阶段造成雷电伤害后，你本阶段使用【杀】次数上限+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"小约翰可汗","t":"","k":"神","kh":3,"mh":3,"g":"男","s":[["通辽","摸牌阶段结束时，你可以将手牌中点数最小的一张牌标记为“通辽”。当你失去“通辽”牌后，你摸X张牌（X为“通辽”牌的点数）。",[]],["悟道","当你于一回合连续使用两张同类别牌时，你可以令你本回合使用此类别的牌伤害+1且不能被响应。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"朱铁雄","t":"","k":"神","kh":3,"mh":3,"g":"男","s":[["变装","出牌阶段限一次，你可以从两名武将中选择一个进行变装，然后视为使用一张【杀】（无距离和次数限制），根据变装此【杀】获得额外效果。当你使用装备牌后，重置本阶段〖变装〗发动次数。当你发动三次〖变装〗后，本局游戏你进行变装时增加一个选项。",[]]],"r":[]},{"p":"线下","sp":"线下-山河煮酒","n":"丁奉","t":"寿春解围","k":"吴","kh":4,"mh":4,"g":"","s":[["短兵","你使用【杀】可以额外指定一名距离为1的角色为目标。你对距离为1的角色使用【杀】需额外使用一张【闪】才能抵消。当你对距离为1的角色每回合首次造成伤害后，你摸一张牌。",[]],["奋迅","出牌阶段限一次，你可以弃置一张牌并选择一名其他角色，令你与其的距离视为1，直到回合结束。",[]]],"r":[],"vi":1,"vt":2},{"p":"线下","sp":"线下-山河煮酒","n":"乌鹊","t":"密执生死","k":"群","kh":4,"mh":4,"g":"","s":[["暗杀","其他角色回合开始时，你可以将一张牌当刺【杀】对其使用，此牌结算后，其计算与你距离视为1直到本轮结束。",[]],["藏身","锁定技，其他角色计算与你距离+1；当你使用【杀】后，〖藏身〗本轮失效。",["锁定技"]],["凶刃","锁定技，你对与你距离大于1的角色使用【杀】造成伤害+1；你对与你距离不大于1的角色使用【杀】无距离次数限制。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-山河煮酒","n":"乐綝","t":"广昌亭侯","k":"魏","kh":4,"mh":4,"g":"","s":[["破锐","每轮限两次，其他角色的结束阶段，你可以弃置两张牌，然后视为对一名本回合失去过牌的角色使用X+1张【杀】（X为其本回合失去的牌数且至多为5）。",[]]],"r":[]},{"p":"线下","sp":"线下-山河煮酒","n":"于禁","t":"讨暴坚垒","k":"魏","kh":4,"mh":4,"g":"","s":[["毅重","锁定技，若你的装备区里没有防具牌，黑色【杀】对你无效；若你的装备区里没有武器牌，你出牌阶段使用【杀】次数上限+1。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-山河煮酒","n":"亡鹊","t":"神鬼莫测","k":"群","kh":3,"mh":3,"g":"","s":[["待发","其他角色回合结束时，若其本回合获得过除其以外角色的牌，你可以将一张牌当无距离限制的刺【杀】对其使用。",[]],["藏身","锁定技，其他角色计算与你距离+1；当你使 []},{"p":"线下","sp":"线下-珍藏","n":"友诸葛亮","t":"龙骧九天","k":"群","kh":3,"mh":3,"g":"","s":[["演策","每轮开始时，你可以摸五张牌并将等量张手牌以任意顺序扣置于武将牌上直到本轮结束。当一张牌被使用时，你移去武将牌上的首张牌，每满足一项便摸一张牌：1.两者花色相同；2.两者类别相同。",[]],["方遒","限定技，当你因〖演策〗放置牌后，你可以展示武将牌上的所有牌，直到本轮结束你因〖演策〗获得的牌数翻倍。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"司马炎","t":"晋武帝","k":"晋","kh":3,"mh":3,"g":"","s":[["举棋","转换技，阳：准备阶段，你摸三张牌/其他角色的准备阶段，其可以展示并交给你一张黑色手牌；阴：准备阶段，令你本回合使用牌无次数限制且造成的伤害+1/其他角色的准备阶段，其可以展示并交给你一张红色手牌。",["转换技"]],["封土","当其他角色死亡后，若其未处于休整状态，你可以令一名未以此法扣减过体力上限的角色减1点体力上限，然后其获得死亡角色座次每轮的额定回合。",[]],["泰始","主公技，限定技，一名角色的回合开始前，你可以令所有隐匿角色依次登场。",["主公技","限定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"孙尚香","t":"梦醉良缘","k":"蜀","kh":4,"mh":4,"g":"女","s":[["良助","当一名角色于其出牌阶段内回复体力时，你可以选择一项：1.摸一张牌；2.令该角色摸两张牌。",[]],["返乡","觉醒技，准备阶段，若全场有至少一名已受伤的角色，且你令其执行过〖良助〗选项2的效果，则你减1点体力上限并回复1点体力，获得技能〖枭姬〗。",["觉醒技"]],["枭姬","当你失去一张装备区的装备牌后，你可以摸两张牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"孙皓","t":"归命侯","k":"吴","kh":5,"mh":5,"g":"","s":[["设座","准备阶段，你可以选择一项，本回合下次拼点结算后拼点没赢的角色执行：1.依次弃置两张牌，不足则失去等量体力；2.横置并受到1点火焰伤害；3.将所有手牌当任意一张普通锦囊牌使用。出牌阶段限一次，你可以摸一张牌并拼点。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"孙邵","t":"清庙之器","k":"吴","kh":3,"mh":3,"g":"","s":[["定仪","每轮开始时，你可以摸一张牌，然后将一张与“定仪”牌花色均不同的牌置于一名没有“定仪”牌的角色武将牌旁。有“定仪”牌的角色根据花色获得对应效果： ♠，手牌上限+4； ♥ ，每回合首次脱离濒死状态时，回复2点体力； ♣，使用牌无距离限制； ♦ ，摸牌阶段多摸两张牌。",[]],["罪辞","当你受到伤害后，你可以获得一名角色的“定仪”牌，然后你从额外牌堆选择一张智囊牌令其获得。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"庞统","t":"南州士冠","k":"吴","kh":3,"mh":3,"g":"","s":[["过论","当你于出牌阶段使用牌指定一名其他角色为唯一目标后，你可以展示其一张手牌，然后你可以用一张牌交换此牌，以此法获得点数大的牌的角色摸一张牌。",[]],["送丧","限定技，一名角色死亡后，你可以加1点体力上限并回复1点体力，然后你获得〖展骥〗。",["限定技"]],["展骥","锁定技，当你于出牌阶段内不因此技能摸牌后，你摸一张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"张星彩","t":"兰芷锋镝","k":"蜀","kh":4,"mh":4,"g":"女","s":[["横刃","转换技，其他角色出牌阶段：阳，开始时；阴，结束时，若其本阶段有【杀】的剩余使用次数，你可以使用一张【杀】（将占用其次数且伤害+1）。",["转换技"]],["胆决","与你距离1以内的角色成为【杀】的目标后，你可以令此【杀】不计次数，然后目标摸一张牌并可以交给你一张牌。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"张温","t":"炜晔曜世","k":"吴","kh":3,"mh":3,"g":"","s":[["颂蜀","一名角色出牌阶段开始时，你可以将一张牌置入“仁”区，然后若“仁”区牌数不小于其手牌数，你令其本回合只能使用或打出“仁”区牌。",[]],["戈帛","锁定技，一名角色回复体力后，你从牌堆顶将一张牌置于“仁”区中。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"成济","t":"劣犬良弓","k":"魏","kh":4,"mh":4,"g":"","s":[["狂戾","锁定技，出牌阶段开始时，所有其他角色依次进行判定；每阶段限两次，当你于出牌阶段内使用牌指定一名以此法判定点数为最大或最小的角色为目标后，你弃置你与其各一张牌，然后你摸两张牌。",["锁定技"]],["凶肆","限定技，出牌阶段，若你的手牌不少于三张，你可以弃置所有手牌，然后令所有其他角色各失去1点体力。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"曹奂","t":"陈留王","k":"魏","kh":3,"mh":3,"g":"","s":[["君威","每回合限一次，你可以将两张相同颜色的牌当【无懈可击】使用，此【无懈可击】生效后，你可以为目标普通锦囊牌额外指定至多两个目标。",[]],["默然","锁定技，当你受到伤害后，你选择1~3的数字，你在所选数字个回合结束后（包括当前回合）摸两倍的牌，在此期间你的所有技能失效。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"曹节","t":"悬壶济世","k":"群","kh":3,"mh":3,"g":"女","s":[["守玺","当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以声明一种牌的类别，令使用者选择一项：1.弃置一张此类别的牌，然后其可以获得你的一张手牌；2.此牌对你无效。",[]],["惠民","结束阶段，你可以选择任意名手牌数小于体力值的角色，你摸等量的牌，然后交给这些角色各一张手牌。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"李严","t":"矜风流务","k":"蜀","kh":3,"mh":3,"g":"","s":[["督粮","出牌阶段限一次，你可以获得一名其他角色至多X张手牌（X为其已损失体力值且至少为1），然后选择一项：1.其观看牌堆顶的两倍的牌，获得其中任意张基本牌；2.其下个摸牌阶段多摸等量的牌。",[]],["腹鳞","当你于回合内获得牌后，你可以将其中任意张牌以任意顺序置于牌堆顶；回合结束时，你摸X张牌（X为本回合你以此法失去的牌数）。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"李傕","t":"奸谋恶勇","k":"群","kh":4,"mh":6,"g":"","s":[["狼袭","准备阶段，你可以亮出牌堆顶的一张牌，若此牌为基本牌/装备牌，你对一名体力不大于你的其他角色造成1/2点伤害，否则你获得此牌。",[]],["亦算","每阶段限一次，当你于出牌阶段内使用普通锦囊牌结算后，你可以减1点体力上限，从弃牌堆获得之。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"杜预","t":"弼朝博虬","k":"群","kh":4,"mh":4,"g":"","s":[["武库","锁定技，当你使用装备牌时或其他角色失去装备区内的一张牌时，你获得1枚“武库”标记（至多3枚）。",["锁定技"]],["三陈","觉醒技，准备阶段或结束阶段，若你的“武库”标记为3，你加1点体力上限，回复1点体力，获得〖灭吴〗。",["觉醒技"]],["灭吴","每回合限一次，你可以弃置1个“武库”，将一张牌当做任意一张基本牌或锦囊牌使用或打出；若如此做，你摸一张牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"极孙策","t":"江东的小霸王","k":"吴","kh":4,"mh":4,"g":"","s":[["讨逆","出牌阶段开始时，你可失去任意点体力，摸等量的牌，然后令至多X名没有“讨逆”的其他角色各获得1枚“讨逆”（X为你以此法失去的体力值），此回合你的手牌上限为你的体力上限。",[]],["平江","出牌阶段，你可以移去一名角色的“讨逆”标记，视为对其使用【决斗】。若你因此造成伤害，你本回合使用的【决斗】需要响应的【杀】的数量+1，伤害+1；若你因此受到伤害，此技能本回合失效。",[]],["鼎业","结束阶段，你回复X点体力。（X为此回合受到过伤害的其他角色数）",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"极鲁肃","t":"独断的外交家","k":"吴","kh":3,"mh":3,"g":"","s":[["虑远","结束阶段，你可以弃置任意张牌并摸等量的牌，然后若你以此法弃置了至少两张牌且颜色相同，直到你的下回合开始时，当你失去另一种颜色的一张手牌后，你摸一张牌。",[]],["合纵","每轮开始时，你可以选择两名角色，本轮内：当其中一名角色使用【杀】指定除这些角色以外的角色为唯一目标结算后，另一名角色须对相同目标使用一张【杀】，否则交给其一张牌；当其中一名角色成为除这些角色以外的角色使用【杀】的唯一目标时，另一名角色须交给目标角色一张【闪】，否则成为此【杀】的额外目标。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"桥公","t":"高风硕望","k":"吴","kh":3,"mh":3,"g":"","s":[["遗珠","结束阶段，你可以依次将至多两张花色不同的红色牌正面朝上置于牌堆顶前X张的任意位置（X为角色数）。当其他角色获得“遗珠”牌后，你可以与其各摸一张牌。",[]],["鸾俦","出牌阶段限一次，你可以移除场上所有“姻”标记并选择两名角色，令其获得“姻”。有“姻”的角色视为拥有技能〖共患〗。",[]],["共患","锁定技，每回合限一次，当另一名拥有“姻”的角色受到伤害时，若其体力值小于你，将此伤害转移给你；然后移除双方的“姻”标记。",["锁定技","衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"步骘","t":"积跬靖边","k":"吴","kh":3,"mh":3,"g":"","s":[["弘德","当你一次获得或失去至少两张牌后，你可以令一名本回合未选择过的其他角色摸等量张牌。",[]],["定叛","出牌阶段限X次，你可以令一名装备区里有牌的角色摸一张牌，然后其选择一项：1.令你弃置其装备区里的一张牌；2.获得其装备区里的所有牌，若如此做，你对其造成1点伤害（X为场上存活的反贼数）。",[]]],"r":[],"vi":2,"vt":2},{"p":"线下","sp":"线下-珍藏","n":"毌丘俭","t":"镌功铭征荣","k":"魏","kh":4,"mh":4,"g":"","s":[["征荣","转换技，锁定技，游戏开始时，你将牌堆顶一张牌置于武将牌上，称为“荣”。当你于出牌阶段对其他角色使用牌结算后，阳：你选择任意张手牌替换等量的“荣”；阴：你将一名其他角色的一张牌置为“荣”。",["转换技","锁定技"]],["鸿举","觉醒技，准备阶段，若“荣”数不小于3，你摸等同于“荣”数的牌，然后减1点体力上限，获得〖清侧〗。",["觉醒技"]],["清侧","出牌阶段，你可以移去一张“荣”，然后弃置场上的一张牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"玉真子","t":"神功天授","k":"群","kh":4,"mh":4,"g":"","s":[["化境","游戏开始时，你获得六个额外武器栏；出牌阶段限一次，你可以展示至多四张手牌，从游戏外将至多X张专属武器牌置入你的装备区（X为其中花色数）。",[]],["天授","锁定技，回合结束时，若你本回合使用【杀】造成过伤害，你须移动你装备区内的一张武器牌并摸两张牌。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"界周泰","t":"历战之躯","k":"吴","kh":4,"mh":4,"g":"","s":[["不屈","锁定技，当你不因〖不屈〗进入濒死状态时，你将体力回复至1点并重置〖奋激〗，然后将牌堆顶的一张牌置于武将牌上，称为“创”，若与另一张“创”点数相同，移去此“创”；当你移去“创”时，你失去等量的体力；你的手牌上限+X（X为“创”的数量）。",["锁定技"]],["奋激","每回合每名角色限一次，一名角色非因使用或打出而失去手牌后，你可以失去1点体力，该角色摸两张牌。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"界蔡邕","t":"大鸿儒","k":"群","kh":3,"mh":3,"g":"","s":[["辟撰","当你使用♠牌时，或你成为其他角色使用♠牌的目标后，你可以将牌堆顶的一张牌置于武将牌上，称为“书”；你至多拥有四张“书”，你的手牌上限+X（X为“书”的数量）。",[]],["通博","摸牌阶段结束时，你可以用任意张牌替换等量的“书”，然后你可以将四张“书”任意分配给其他角色，若花色各不相同，你回复1点体力，“书”的数量上限+1（至多增加等同于角色数的上限）。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"界颜良文丑","t":"虎狼兄弟","k":"群","kh":4,"mh":4,"g":"","s":[["双雄","出牌阶段开始时，你可以令一名角色弃置一张牌，若如此做，此阶段你可以将与此牌颜色不同的手牌当【决斗】使用。",[]],["狭勇","结束阶段，若你本回合使用的【杀】和【决斗】均对目标角色造成了伤害，你可以摸等同于这些伤害值的牌。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"祖茂","t":"碧血染赤帻","k":"吴","kh":4,"mh":4,"g":"","s":[["引兵","结束阶段，你可以将任意名攻击范围内包含你的角色各一张手牌置于你的武将牌上。当你受到【杀】或【决斗】造成的伤害后，伤害来源可以获得一张“引兵”牌。",[]],["绝地","锁定技，准备阶段，你选择一项：1.移去“引兵”牌，然后将手牌摸至体力上限；2.令一名体力值不大于你的其他角色获得“引兵”牌，然后回复1点体力并摸等量的牌。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"神张角","t":"末世的起首","k":"神","kh":3,"mh":3,"g":"","s":[["异兆","锁定技，当你使用或打出一张牌时，获得等同于此牌点数的“黄”标记，然后若“黄”标记数的十位数变化，你观看牌堆顶十张牌，展示并获得其中任意张点数为变化后十位数的牌。",["锁定技"]],["三首","当你受到伤害时，你可以亮出牌堆顶的三张牌，若其中有本回合所有角色均未使用过的牌的类型，防止此伤害。",[]],["肆军","准备阶段，若“黄”标记数大于牌堆的牌数，你可以移去所有“黄”标记，然后重复亮出并获得牌堆顶的一张牌，直到获得牌的点数之和不小于36，然后洗牌。",[]],["天劫","每个回合结束时，若本回合牌堆进行过洗牌，你可以令至多三名其他角色展示手牌，对这些角色分别造成X点雷电伤害（X为其手牌中【闪】的数量且至少为1）。",[]]],"r":[],"vi":2,"vt":2},{"p":"线下","sp":"线下-珍藏","n":"神荀彧","t":"洞心先识","k":"神","kh":3,"mh":3,"g":"","s":[["灵策","锁定技，其他角色使用的智囊牌对你无效；一名角色使用智囊牌时，你摸一张牌。",["锁定技"]],["定汉","准备阶段，你可以移除一张智囊牌的记录，然后重新记录一张智囊牌（初始为【无中生有】【过河拆桥】【无懈可击】）。",[]],["天佐","锁定技，游戏开始时，将8张【奇正相生】加入牌堆；【奇正相生】对你无效。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"神郭嘉","t":"倚星折月","k":"神","kh":3,"mh":3,"g":"","s":[["慧识","出牌阶段限一次，你可以进行判定，若结果的花色与本阶段以此法进行判定的结果均不同，你可以重复此流程。然后你可以将所有生效的判定牌交给一名角色。",[]],["天翊","觉醒技，准备阶段，若所有存活角色均受到过伤害，你增加体力上限至10点，然后令一名角色获得〖佐幸〗。",["觉醒技"]],["辉逝","限定技，当你进入濒死状态时，你可以选择一名角色，若其有未发动的觉醒技，你可以选择其中一个令其视为已满足觉醒条件，否则其摸四张牌。",["限定技"]],["佐幸","出牌阶段限一次，你可以令神郭嘉减1点体力上限，视为使用一张普通锦囊牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"罗贯中","t":"湖海散人","k":"群","kh":4,"mh":4,"g":"","s":[["著魂","游戏开始时，你随机亮出四张未加入游戏的武将牌，确认后洗混扣置（仅对你可见），然后你摸等量的牌并在每张扣置的武将牌上正面放置一张手牌，称为“魂”。",[]],["经世","其他角色回合开始时，其可以根据“魂”的提示猜测并翻开一张扣置的武将牌，若猜对，你摸两张牌并可以交给其两张牌。当所有武将牌被翻开后，移去这些牌并再次发动〖著魂〗。",[]],["染瀚","出牌阶段限一次，你可以弃置场上任意张花色各不同的牌，然后从游戏外将【湖海笔】置入你的装备区。",[]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"羊祜","t":"鹤德璋声","k":"群","kh":3,"mh":3,"g":"","s":[["明伐","你的拼点牌点数+2。出牌阶段开始时，你可以展示一张手牌，用此牌与一名其他角色拼点，若你：赢，你获得其一张牌，然后你摸一张牌；没赢，本回合你不能对其他角色使用牌。",[]],["戎备","限定技，出牌阶段，你可以选择一名装备区有空置装备栏的角色，其为每个空置的装备栏从额外牌堆随机使用一张对应类别的装备。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"荀谌","t":"谋刃略锋","k":"群","kh":3,"mh":3,"g":"","s":[["危迫","出牌阶段限一次，你可以选择一名其他角色，弃置其每个区域各一张牌（无牌则不弃），然后从额外牌堆选择一张【兵临城下】或一张智囊令其获得。",[]],["陈势","当其他角色使用【兵临城下】指定目标后，或当其他角色成为【兵临城下】的目标后，其可以交给你一张牌，然后其观看牌堆顶三张牌并将其中任意张置入弃牌堆。",[]],["谋识","锁定技，当你受到牌造成的伤害时，若你本回合受到过此花色的牌造成的伤害，防止此伤害。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"许靖","t":"篡贤取良","k":"蜀","kh":3,"mh":3,"g":"","s":[["博名","出牌阶段限两次，你可以将一张牌交给一名其他角色。结束阶段，你摸X张牌（X为本局游戏你发动此技能交给过牌的角色数）。",[]],["恶荐","锁定技，当其他角色获得你的牌后，其展示所有手牌，若其有除此牌以外与此牌类别相同的牌，其选择一项：1.弃置这些牌；2.受到你造成的1点伤害，你重置〖博名〗记录的角色。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"诸葛尚","t":"碧落玄鹄","k":"蜀","kh":3,"mh":3,"g":"","s":[["三顾","一名角色出牌阶段开始时，若其手牌数不小于其体力上限，你可以观看牌堆顶三张牌并亮出其中任意张牌名不同的基本牌或普通锦囊牌。若如此做，此阶段每种牌名限一次，该角色可以将一张手牌当你亮出的一张牌使用。",[]],["轶祖","锁定技，每回合限一次，当你成为【杀】或【决斗】的目标后，若你的体力值不大于使用者的体力值，你回复1点体力。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"谋司马师","t":"唯几成务","k":"魏","kh":3,"mh":3,"g":"","s":[["散士","锁定技，游戏开始时，你声明一个点数，该点数的所有牌标记为“死士”牌。每个回合结束时，若本回合有“死士”牌进入弃牌堆：若不因你使用或打出，你获得这些牌；否则将这些牌移出游戏。你使用“死士”牌不能被响应。",["锁定技"]],["震扰","每回合每名角色限一次，当你使用牌指定其他角色为目标后，或当其他角色使用牌指定你为目标后，你可以选择手牌数大于你的其中一个目标或使用者，对其造成1点伤害。",[]],["沉略","限定技，出牌阶段，你可以令所有其他角色展示手牌，你从场上、其他角色的手牌、因〖散士〗移出游戏的牌中获得所有“死士”牌，本回合你使用“死士”牌无次数限制。此阶段结束时，将这些牌移出游戏直到你死亡。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"谋曹爽","t":"托孤傲臣","k":"魏","kh":4,"mh":4,"g":"","s":[["渐专","锁定技，出牌阶段每项限一次，当你使用牌时，你选择一项：1.令一名其他角色弃置X张牌；2.摸X张牌；3.重铸X张牌；4.弃置X张牌（X为你此阶段发动此技能次数）。出牌阶段结束时，若所有选项于此阶段内都被选择过，你删除一个选项。",["锁定技"]],["返势","觉醒技，结束阶段，若〖渐专〗的选项数小于2，你依次执行3次剩余项（X视为1），加2点体力上限并回复2点体力，失去〖渐专〗，获得〖覆斗〗。",["觉醒技"]],["覆斗","当你使用黑色牌指定其他角色为唯一目标后，若其本局游戏对你造成过伤害，你可以与其各失去1点体力；当你使用红色牌指定其他角色为唯一目标后，若其本局游戏没对你造成过伤害，你可以与其各摸一张牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-珍藏","n":"貂蝉","t":"群芳之魁","k":"蜀","kh":3,"mh":3,"g":"女","s":[["低语","每轮开始时，你可以令一名角色本轮造成的伤害+1，然后你从〖崩坏〗〖同疾〗〖弼昏〗〖义拒〗中选择一个未选择过的技能令其获得。",[]],["拂衣","当你成为【杀】的目标时，你可以为此牌选择一个额外目标并令所有目标摸一张牌，此牌被一名目标抵消后，对其余目标无效。",[]],["就计","每轮结束后，你可以令两名角色依次执行一个仅能对对方使用牌且双方技能互换的额外回合 ]},{"p":"线下","sp":"线下-珍藏","n":"骆统","t":"辨如悬河","k":"吴","kh":4,"mh":4,"g":"","s":[["悯施","出牌阶段限一次，你可以选择所有手牌数少于体力值的角色并观看额外牌堆中至多三张基本牌，将其中任意张牌交给任意角色。然后你选择的角色中每有一名未获得牌的角色，你失去1点体力。",[]],["显名","每回合限一次，当额外牌堆中失去最后一张基本牌后，你可以摸两张牌并回复1点体力。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋于禁","t":"威严毅重","k":"魏","kh":4,"mh":4,"g":"","s":[["狭援","每轮限一次，其他角色受到伤害后，若此伤害令其失去全部护甲，则你可以弃置两张手牌，令其获得本次伤害结算中其失去的护甲。",[]],["节钺","结束阶段，你可以令一名其他角色摸两张牌并获得1点护甲，然后其交给你两张牌。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋公孙瓒","t":"劲震幽土","k":"群","kh":4,"mh":4,"g":"","s":[["义从","每轮开始时，你可以令你本轮计算与其他角色的距离-1/其他角色本轮计算与你的距离+1，然后亮出牌堆顶四张牌，将其中所有【杀】/【闪】置于你的武将牌上，称为“扈”（你至多拥有四张“扈”）。你可以将“扈”如手牌般使用或打出。",[]],["趫猛","当你使用【杀】造成伤害后，你可以选择一项：1.摸一张牌，然后弃置其区域内的一张牌；2.亮出牌堆顶四张牌，将其中所有【杀】或【闪】置为“扈”。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋关羽","t":"关圣帝君","k":"蜀","kh":4,"mh":4,"g":"","s":[["武圣","你可以将一张手牌当任意【杀】使用或打出；出牌阶段开始时，你可以令一名其他角色展示所有手牌，本阶段你对其使用前X张【杀】无距离次数限制且结算结束后摸一张牌（X为其展示的红色牌数）。",[]],["义绝","锁定技，准备阶段，你令所有其他角色依次选择是否交给你一张牌，以此法交给你牌的角色本回合首次受到你的【杀】造成的伤害时，防止此伤害。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋刘备","t":"雄才盖世","k":"蜀","kh":4,"mh":4,"g":"","s":[["仁德","出牌阶段开始时，你获得2枚“仁望”标记（至多8枚）；出牌阶段每名角色各限一次，你可以将任意张牌交给一名其他角色并获得等量的“仁望”标记；每回合限一次，你可以移去2枚“仁望”并视为使用或打出一张基本牌。",[]],["章武","限定技，出牌阶段，你可以移去任意枚“仁望”标记并摸等量张牌，然后〖仁德〗失效直到你进入濒死状态，本回合你使用【杀】无距离限制。",["限定技"]],["激将","主公技，出牌阶段结束时，你可以选择一名其他角色，令一名攻击范围内含有其且体力值不小于你的其他蜀势力角色选择一项：1.视为对其使用一张【杀】；2.跳过下一个出牌阶段。",["主公技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋卧龙诸葛亮","t":"忠武侯","k":"蜀","kh":3,"mh":3,"g":"","s":[["火计","使命技，出牌阶段限一次，你可以选择一名其他角色，对其及其同势力的其他角色各造成1点火焰伤害。 ⬤　成功：准备阶段，若你本局游戏对其他角色造成过至少X点火焰伤害（X为本局游戏人数），你失去〖火计〗〖看破〗，获得〖观星〗〖空城〗。 ⬤　失败：当你进入濒死状态时，使命失败。",["使命技"]],["看破","游戏开始时，你摸三张牌，然后你可以将至多三张牌扣置于你的武将牌上，称为“谋”。当其他角色使用牌时，你可以移除一张牌名相同的“谋”，然后令此牌无效并摸一张牌。",[]],["观星","准备阶段，你可以观看牌堆顶5张牌（场上存活角色数小于4时改为3张），并以任意顺序置于牌堆顶或牌堆顶。若你将这些牌均放至牌堆底，则结束阶段你可以发动〖观星〗。",["衍生技"]],["空城","锁定技，若你没有手牌，你不能被选择为【杀】或【决斗】的目标。",["锁定技","衍生技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋大乔","t":"国色芳华","k":"吴","kh":3,"mh":3,"g":"女","s":[["国色","出牌阶段限一次，你可以将一张 ♦ 牌当【乐不思蜀】使用，或移动场上一张【乐不思蜀】。",[]],["流离","当你成为【杀】的目标时，你可以弃置一张牌，将目标转移给你攻击范围内除使用者以外的一名角色，令其获得“流离”标记（若场上已有则转移给其）。有“流离”标记的角色回合开始时，移去“流离”标记并执行一个额外的出牌阶段。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋姜维","t":"见危授命","k":"蜀","kh":4,"mh":4,"g":"","s":[["挑衅","出牌阶段限一次，你可以令至多X名其他角色依次选择一项（X为你的体力值）：1.对你使用一张【杀】（无距离限制），若此【杀】未造成伤害，你获得其一张牌；2.令你获得其一张牌。",[]],["志继","觉醒技，当你进入濒死状态时，你将体力回复至2点，减1点体力上限并获得〖北伐〗，然后若你手牌数最少，则你摸两张牌。",["觉醒技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋孙尚香","t":"骄豪明俏","k":"蜀","kh":4,"mh":4,"g":"女","s":[["结姻","锁定技，出牌阶段开始时，你令一名手牌数不大于你的角色选择一项：1.若其有手牌，其交给你两张手牌（不足则全给），然后其获得1点护甲；2.你回复1点体力并获得所有“妆”，然后减1点体力上限，变更势力为吴。",["锁定技"]],["良助","蜀势力技，出牌阶段限一次，你可以将一名其他角色装备区内一张牌置于你的武将牌上，称为“妆”，然后你令一名其他角色回复1点体力。",["势力技"]],["枭姬","吴势力技，当你失去装备区里的一张牌后，你摸两张牌，然后你可以弃置场上的一张牌。",["势力技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋孙权","t":"江东大帝","k":"吴","kh":4,"mh":4,"g":"","s":[["制衡","出牌阶段限一次，你可以弃置至少一张牌，然后摸等量的牌，若你以此法弃置了装备区里的牌，则你多摸一张牌。",[]],["统业","锁定技，若本局游戏牌堆未洗过牌，则你视为拥有〖英姿〗和〖固政〗。",["锁定技"]],["救援","主公技，出牌阶段限一次，你可以获得一名其他吴势力角色装备区里的所有牌，然后你回复1点体力。",["主公技"]],["英姿","锁定技，摸牌阶段，你多摸一张牌；你的手牌上限等同于你的体力上限。",["锁定技","衍生技"]],["固政","其他角色的弃牌阶段结束时，你可以将此阶段中其弃置的一张手牌交给该角色，然后你可以获得其余此阶段内弃置的牌。",["衍生技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋孟获","t":"南蛮王","k":"蜀","kh":4,"mh":4,"g":"","s":[["祸首","锁定技，【南蛮入侵】对你无效；当其他角色使用【南蛮入侵】指定第一个目标后，你代替其成为伤害来源；出牌阶段结束时，你弃置所有手牌，视为使用一张【南蛮入侵】。",["锁定技"]],["再起","弃牌阶段结束时，你可以令至多X名角色依次选择一项（X为你本回合弃置过的牌数）：1.令你摸一张牌；2.弃置一张牌，你回复1点体力。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋小乔","t":"矫情之花","k":"吴","kh":3,"mh":3,"g":"女","s":[["天香","当你受到伤害时，你可以展示两张手牌，令一名其他角色选择获得其中一张牌，若此牌：为 ♥ ，你将此伤害转移给其；不为 ♥ ，其本回合不能使用与此牌类别相同的手牌。",[]],["红颜","锁定技，你的♠牌或你的♠判定牌视为 ♥ 。当你每回合首次失去 ♥ 牌后，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋庞统","t":"凤雏","k":"蜀","kh":3,"mh":3,"g":"","s":[["连环","出牌阶段，你可以将一张♣手牌当【铁索连环】使用或重铸；当你使用【铁索连环】指定一名未横置的角色为目标后，你可以弃置其一张牌。",[]],["涅槃","限定技，当你处于濒死状态时，你可以弃置区域里的所有牌，复原你的武将牌，然后摸三张牌并将体力回复至3点。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋曹丕","t":"魏文帝","k":"魏","kh":3,"mh":3,"g":"","s":[["行殇","当一名角色受到伤害后（每回合限一次）或死亡时，则你获得2枚“颂”标记（至多9枚）。 出牌阶段限两次，你可以选择一名角色，移去任意数量的“颂”令其执行一次“祭奠”： 2枚，复原武将牌，摸三张牌； 3枚，回复1点体力并加1点体力上限，恢复一个已废除的装备栏； 4枚，若该角色为你，追思一名已死亡的角色。",[]],["放逐","出牌阶段限一次，你可以选择一名其他角色，移去任意数量的“颂”标记令其执行一次“流放”： 2枚，只能使用基本牌直到其下个回合结束； 4枚，不可响应除其外的角色使用的牌直到其下个回合结束； 6枚，只能使用锦囊牌直到其下个回合结束； 6枚，武将技能失效直到其下个回合结束； 8枚，只能使用装备牌直到其下个回合结束； 8枚，翻面。",[]],["颂威","主公技，锁定技，出牌阶段开始时，你获得X枚“颂”标记（X为本局游戏其他魏势力角色数的两倍）。",["主公技","锁定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋曹操","t":"魏武大帝","k":"魏","kh":4,"mh":4,"g":"","s":[["奸雄","游戏开始时，你可以获得至多两枚“治世”标记。当你受到伤害后，你可以获得对你造成伤害的牌并摸2-X张牌，然后你可以移除1枚“治世”（X为“治世”的数量）。",[]],["清正","出牌阶段开始时，你可以选择一名有手牌的其他角色，你弃置3-X（X为你的“治世”标记数）种花色的所有手牌，然后观看其手牌并弃置其中一种花色的所有牌，若其被弃置的牌数小于你弃置的牌数，你对其造成1点伤害。然后若你拥有〖奸雄〗且“治世”标记数小于2，你可以获得1枚“治世”。",[]],["护驾","主公技，每轮限一次，当你受到伤害时，你可以将此伤害转移给一名其他魏势力角色。",["主公技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋甘宁","t":"兴王定霸","k":"吴","kh":4,"mh":4,"g":"","s":[["奇袭","出牌阶段限一次，你可以选择一张手牌并选择一名其他角色，令其猜测此牌的花色。若猜错，该角色从未猜测过的花色中再次猜测；若猜对，你弃置此牌，然后你弃置其区域内X-1张牌（X为该角色猜测的次数，不足则全弃）。",[]],["奋威","限定技，当一张锦囊牌指定多个目标后，你可以令此牌对其中任意个目标无效，若包含你，本回合结束时你可以发动一次〖奇袭〗。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋荀彧","t":"王佐之才","k":"魏","kh":3,"mh":3,"g":"","s":[["驱虎","出牌阶段限一次，若你有牌，你可以与两名有牌的其他角色依次弃置至少一张牌。若有弃置牌数唯一最多的其他角色，其对弃置牌数最少的角色各造成1点伤害，然后获得你弃置的牌；否则这两名角色各摸其弃置牌数的牌。",[]],["节命","当你受到伤害后，你可以令一名角色摸四张牌，然后其可弃置至少一张牌，若其弃置的牌数小于X（X为你已损失的体力值且至少为1），则你失去1点体力。",[]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋袁绍","t":"高贵的名门","k":"群","kh":4,"mh":4,"g":"","s":[["乱击","出牌阶段限一次，你可以将两张手牌当【万箭齐发】使用。当其他角色打出【闪】响应你使用的【万箭齐发】时，若你的手牌数小于体力值且小于其手牌数，你摸一张牌。",[]],["血裔","主公技，锁定技，你的手牌上限+2X（X为其他群势力角色数）。当你使用牌结算后，你令响应过此牌的其他群势力角色本阶段不能使用或打出手牌。",["主公技","锁定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋诸葛亮","t":"","k":"蜀","kh":3,"mh":3,"g":"","s":[["观星","准备阶段，你移去所有的“星”，并将牌堆顶X张牌置于武将牌上（X为7-此前此技能准备阶段发动次数的两倍），称为“星”。 出牌阶段或结束阶段开始时，你可以将任意张“星”置于牌堆顶。 你可以如手牌般使用或打出“星”。",[]],["空城","锁定技，当你受到伤害时，若你的武将牌上：有“星”，你判定，若结果点数小于“星”数，则此伤害-1；没有“星”，此伤害+1。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-谋攻篇","n":"谋贾诩","t":"计深似海","k":"群","kh":3,"mh":3,"g":"","s":[["完杀","你的回合内，不处于濒死状态的其他角色不能使用【桃】。 每轮限一次，当一名角色进入濒死状态时，你可以观看其手牌并秘密选择其区域内的 列","n":"神貂蝉","t":"三界若空华","k":"神","kh":3,"mh":3,"g":"女","s":[["魅魂","结束阶段或当你成为【杀】目标后，你可以令一名其他角色交给你一张你声明的花色的牌，若其没有则你观看其手牌然后弃置其中一张。",[]],["惑心","限定技，一名角色回合开始时，你可以将此回合改为由你操控。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"神魏延","t":"子午创世神","k":"神","kh":4,"mh":7,"g":"","s":[["极谋","限定技，准备阶段，你可以失去任意点体力上限并选择一名其他角色，除你与其之外的角色休整直到有角色死亡或此后你与其进行了等量个回合。",["限定技"]],["浴血","每回合限一次，你可以将任意张非伤害牌当一张可指定等量目标且无距离限制的【杀】使用，你可以吸取因此受伤目标角色的1点体力上限。",[]],["馈伐","你使用伤害牌指定多个目标时，你可以选择一项： 1.若目标数小于存活角色数，你可以令你本回合使用【杀】次数+1； 2.若目标数不小于你的体力值，你可以摸不为此牌目标的其他角色数张牌。 乘势：此牌不可响应。 背水：你失去X点体力（X为你背水次数）。",[]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔吕布","t":"雷勘火折","k":"群","kh":4,"mh":4,"g":"","s":[["夺炁","锁定技，一号位首个回合开始前，你执行一个不能使用延时锦囊牌的额外出牌阶段。你每回合对一名角色首次造成伤害后，你获得其一张牌。",["锁定技"]],["狂魔","出牌阶段，你可以 入魔 并选择一名其他角色，你与其成为“狂”角色，每回合对彼此首次造成的伤害+1；击败对方后，获得对方所有牌。“狂”角色死亡后，你重新指定。",[]],["罡拳","若你使用的上一张牌为锦囊，你可以将一张装备牌当指定相邻角色为目标的火【杀】使用；否则，你可以将一张锦囊牌当【决斗】使用。",[]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔孙策","t":"狂心枭魔","k":"魔","kh":6,"mh":6,"g":"","s":[["狂沸","出牌阶段，你可以摸一张牌。",[]],["鏖斗","当你获得牌时，你可以将一张牌当【决斗】使用。",[]],["蔽锋","锁定技，当你每回合第至少X次发动除此技能以外的技能时，你选择一项：1.失去1点体力；2.减1点体力上限（X为你的体力上限）。",["锁定技"]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔庞统","t":"焚星凤鸣","k":"魔","kh":3,"mh":9,"g":"","s":[["燃尽","回合开始时，你可以横置任意名角色，然后选择一项：1.摸未横置角色数的牌；2.对一名未横置角色造成你体力值的火焰伤害。",[]],["凤息","锁定技，每轮限一次，当你进入濒死状态时，将体力值和手牌数调整至等同于场上横置人数。",["锁定技"]],["隐焚","限定技，当一名角色造成属性伤害时，你可以令此伤害在未横置角色间传导（每名角色至多传导一次）。",["限定技"]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔神孙策","t":"一身纳魔","k":"魔","kh":6,"mh":6,"g":"","s":[["枭扬","锁定技，你的出牌阶段：只能使用一张【杀】；你失去一张牌后可以摸一张牌。",["锁定技"]],["临渊","觉醒技，回合结束时，若你本回合造成的伤害不大于1，你入魔；若你本回合造成的伤害大于体力上限，你化神。",["觉醒技"]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔貂蝉","t":"幻梦惑心","k":"群","kh":3,"mh":3,"g":"女","s":[["幻惑","每轮开始时，你摸两张牌，然后弃置至多两张牌并选择等量名其他角色。其下回合出牌阶段每使用一张牌后弃置一张牌，直到其使用了两张牌后。",[]],["倾世","准备阶段，你可以 入魔 ，令所有角色在你的每个准备阶段获得一张【杀】。其他角色使用此【杀】指定唯一目标时，你可以弃置一张牌重新指定目标（无距离限制）。这些【杀】造成伤害后，你摸一张牌。",[]]],"r":[]},{"p":"线下","sp":"线下-官盗S系列","n":"魔魏延","t":"戾骨噬汉魔","k":"魔","kh":2,"mh":2,"g":"","s":[["逆谋","限定技，准备阶段，你可以失去任意点体力上限并选择等量名其他角色，这些角色休整直到有角色死亡或此后其他角色均进行了回合。",["限定技"]],["渴血","每回合限一次，你可以将任意张非伤害牌当一张需等量【闪】抵消的【杀】使用，若此【杀】造成伤害且目标未使用【闪】响应，你可以吸取其1点体力上限。",[]],["竭伐","你使用伤害牌指定唯一目标时，你可以选择一项： 1.若其体力值大于存活角色数，此牌可以额外指定一个目标； 2.若你的体力上限小于其，你可以令此牌额外结算一次。 乘势：你将体力回复至上限或将手牌摸至上限。 背水：你失去X点体力上限（X为你背水次数）。",[]]],"r":[],"ar":4},{"p":"OL","sp":"OL-门阀士族","n":"族法正","t":"","k":"蜀","kh":3,"mh":3,"g":"男","s":[["分机","准备阶段，你可以令一名角色将至少X+2张牌置于其武将牌上（X为其有牌的区域数），称为“诱”。此回合结束时，其获得全场所有“诱”。",[]],["威迫","回合内每个类型限一次，当你使用手牌中一个类型最后一张牌时，你可以令一名角色执行一项：1.其获得所有“诱”，然后你对其造成1点伤害；2.令其将X+2张牌放置为“诱”（X为其有牌的区域数），然后你与其本回合不能使用当前的手牌。",[]],["破立","宗族技，出牌阶段限一次，若你的手牌均置灰，你可以将一名同族角色的一张牌置于牌堆顶，然后获得一张不同类别的牌。",["宗族技"]]],"r":[]},{"p":"OL","sp":"OL-门阀士族","n":"族法衍","t":"","k":"群","kh":3,"mh":3,"g":"男","s":[["破立","宗族技，出牌阶段限一次，若你的手牌均置灰，你可以将一名同族角色的一张牌置于牌堆顶，然后获得一张不同类别的牌。",["宗族技"]]],"r":[]},{"p":"OL","sp":"OL-谋","n":"谋徐庶","t":"","k":"蜀","kh":4,"mh":4,"g":"男","s":[["启慧","锁定技，你的基本或锦囊牌指定目标后，若目标数与你手牌中另一种类别牌的数量相同，你摸等量张牌。",["锁定技"]],["破阵","每回合各限一次，你可以将至少半数手牌（向下取整），当无次数的【杀】或【决斗】使用，然后因此受到伤害的角色本回合不能使用手牌。当你首次因此【决斗】受到伤害时，防止之，然后你失去此技能，变更势力至魏，获得〖靖谋〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"颜良","t":"狭行狞虎","k":"群","kh":5,"mh":5,"g":"男","s":[["骁决","出牌阶段限两次，你可以视为使用一张【决斗】。你使用【决斗】指定唯一目标后，你可以重铸你与目标角色相同数量的任意张牌，且你与其各只能使用或打出因此重铸获得的牌直到本回合结束。",[]],["独勇","锁定技，你每回合首次造成或受到伤害后，摸两张牌并展示一种花色的所有手牌，这些牌不受〖骁决〗限制，且于你的回合结束时弃置这些牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"鲍信","t":"虞殡梁甫","k":"群","kh":4,"mh":4,"g":"男","s":[["举盟","一名角色回合结束时，若其手牌数或体力值为全场最高，你可以选择任意名本回合获得过牌的角色，这些角色依次可以将一张手牌当【杀】使用，因此造成伤害的【杀】置入牌堆底，使用【杀】且未造成伤害的角色摸一张牌。",[]],["赴义","你距离1以内的角色成为伤害牌的唯一目标后，你可以与其从牌堆顶或牌堆底各摸一张牌。",[]]],"r":[]},{"p":"国际服","sp":"国际服-谋攻篇","n":"谋夏侯惇","t":"独眼的罗刹","k":"魏","kh":4,"mh":4,"g":"男","s":[["刚烈","出牌阶段限一次，你可以选择任意名本局游戏对你造成过伤害的角色，对这些角色各造成2点伤害（每局游戏每名角色限一次）。",[]],["清俭","锁定技，当一张牌非因使用而进入弃牌堆后，若你的“清俭”数小于X（X为你的体力值+1，至少为1），你将之置于你的武将牌上，称为“清俭”牌；出牌阶段结束时，你将所有“清俭”牌分配给任意角色。",["锁定技"]]],"r":[]},{"p":"手杀","sp":"手杀-SP","n":"马超","t":"西凉的猛狮","k":"群","kh":4,"mh":4,"g":"男","s":[["追击","锁定技，你计算与体力值小于等于你的角色的距离视为1；你使用【杀】指定
