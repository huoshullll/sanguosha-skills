角色将一张牌作为“芳妍”牌置于你的武将牌上。",[]],["芳妍","锁定技，结束阶段或当你的体力值减少后，你可以获得武将牌上所有“芳妍”牌并摸等量张牌。除“芳妍”牌包含的花色外，你所有其他花色的牌和判定牌视为♥。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻徐盛","t":"","k":"吴","kh":4,"mh":4,"g":"男","s":[["当锋","每回合每名角色限一次，你使用【杀】指定目标后，可观看其中一名目标的手牌并弃置其中一张牌。若此牌为非装备牌，此【杀】不可响应；若此牌为装备牌，此【杀】结算结束后，你视为对相同目标使用一张无次数限制且不计入次数的【杀】。",[]],["独当","出牌阶段开始时，你可弃置任意张手牌，本阶段你使用的第一张【杀】无距离限制且可以多选择X个目标（X为你弃置的手牌数）。你使用【杀】造成伤害时，若目标在你的攻击范围内，此【杀】伤害+1；若在攻击范围外，你获得其一张牌。结束阶段，你摸X张牌（X为其他角色本回合失去牌的数量且至多为5）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-IF篇","n":"幻周瑜","t":"幻焰浮瑛","k":"吴","kh":4,"mh":4,"g":"男","s":[["督鍪","你每阶段首次获得与失去牌后，你可以选择一项：1.展示牌堆顶的一张牌并令一名角色获得之；2.重铸一名角色三张牌（不足则全部重铸）。每回合结束时，本回合因此获得牌唯一最多的角色失去1点体力。",[]],["撼天","出牌阶段限一次，你可视为使用一张【火攻】，目标须优先展示其本回合获得的牌。你造成的火焰伤害+X（X为受到伤害角色本回合获得牌的次数）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"蒋钦","t":"祁奚之器","k":"吴","kh":4,"mh":4,"g":"男","s":[["尚义","出牌阶段限一次，你可以弃置一张牌并令一名有手牌的其他角色观看你的手牌，然后你观看其手牌并选择一项：1.弃置其中一张牌；2.与其交换一张手牌。若弃置的为黑色牌或交换的两张均为红色牌，则你摸一张牌。",[]],["翔羽","锁定技，你的回合内，每有一名角色失去过牌，本回合你的攻击范围便+1（至多+5）。你使用【杀】指定一名角色为目标时，若你与其距离小于你的攻击范围，则其需依次使用两张【闪】才能抵消此【杀】。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界程普","t":"三朝虎臣","k":"吴","kh":4,"mh":4,"g":"男","s":[["疠火","当你使用普通【杀】时，你可以将此【杀】改为火【杀】，当此【杀】结算结束后，若此【杀】令其他角色进入过濒死状态，你失去1点体力。你使用火【杀】可以多选择一个目标。",[]],["醇醪","准备阶段，若场上没有“醇”，你可以选择一名角色，将其区域内的一张牌置于其武将牌上，称为“醇”。有“醇”的角色使用【杀】时，其可以交给你一张牌，令此【杀】伤害+1；其进入濒死状态时，你可以移去其“醇”并摸一张牌，然后其回复1点体力。",[]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界顾雍","t":"庙堂的玉磬","k":"吴","kh":3,"mh":3,"g":"男","s":[["慎行","出牌阶段，你可弃置X张牌，摸一张牌（X为你发动过〖慎行〗的次数且至多为2）。",[]],["秉壹","结束阶段，你可展示所有手牌，若颜色均相同或类型均相同，你令至多X名角色各摸一张牌（X为你的手牌数）。若你展示的牌数大于1且这些牌颜色和类型均相同，则〖慎行〗的X修改为0。",[]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界韩当","t":"石城侯","k":"吴","kh":4,"mh":4,"g":"男","s":[["弓骑","①你的攻击范围无限。②出牌阶段限一次，你可弃置一张牌，你于此阶段内使用与弃置的牌花色相同的【杀】无次数限制。若弃置的为装备牌，你可弃置一名其他角色的一张牌。",[]],["解烦","限定技，出牌阶段，你可选择一名角色，令攻击范围内有其的所有角色选择一项：1.弃置一张武器牌；2.令其摸一张牌。当你上一次发动〖解烦〗指定的角色进入濒死状态时，此技能视为未发动过。",["限定技"]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界凌统","t":"豪情烈胆","k":"吴","kh":4,"mh":4,"g":"男","s":[["旋风","当你失去装备区里的牌后，或当你于弃牌阶段弃置过至少两张牌，你可以选择一项：1.弃置至多两名其他角色的共计两张牌；2.将一名其他角色装备区里的一张牌移动到另一名其他角色的对应区域。背水：废除一个装备栏。",[]],["勇进","每个阶段结束时，若你于此阶段失去过牌，你可以视为对任意名本阶段失去牌数与你相同的角色使用一张无距离次数限制的【杀】；此【杀】造成伤害后，你随机恢复一个装备栏，若没有可恢复的装备栏，改为将弃牌堆中随机一张装备牌置入你空置的装备栏。",[]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界孙坚","t":"武烈帝","k":"吴","kh":4,"mh":5,"g":"男","s":[["英魂","准备阶段，若你已受伤，你可以选择一名其他角色并选择一项：1.令其摸X张牌，然后弃置一张牌；2.令其摸一张牌，然后弃置X张牌（X为你已损失的体力值）。",[]],["武烈","限定技，结束阶段，你可以失去任意点体力，令等量的其他角色各获得1枚“烈”标记。当有“烈”的角色受到伤害时，其弃所有“烈”，防止此伤害。",["限定技"]],["破虏","主公技，当吴势力角色杀死一名角色或死亡后，你可令任意名角色各摸X张牌（X为你发动过此技能的次数+1）。",["主公技"]]],"r":[]},{"p":"国际服","sp":"国际服-界限突破","n":"界朱治","t":"王事靡盬","k":"吴","kh":4,"mh":4,"g":"男","s":[["安国","游戏的首个回合结束时，你令一名其他角色获得“安国”。拥有“安国”的角色拥有以下效果：1.摸牌阶段多摸一张牌；2.手牌上限等于其体力上限。出牌阶段开始时，你可以将“安国”移动给另一名其他角色。出牌阶段限一次，若拥有“安国”的角色已受伤，你可以摸X张牌，然后交给其等量张牌。（X为其已损失的体力值且最大为2）当你或拥有“安国”的角色进入濒死状态时，你可以移除“安国”的一项效果，令濒死角色将体力回复至1点。",[]]],"r":[]},{"p":"国际服","sp":"国际服-蚀心入魔","n":"慢陆逊","t":"孺子为将","k":"吴","kh":3,"mh":4,"g":"男","s":[["谄谀","出牌阶段限一次，你可以令一名其他角色摸其体力值张牌（至多摸五张）并与你用各自点数最小的手牌拼点，然后双方展示手牌，赢的角色可交换双方一种颜色或类别的所有手牌。",[]],["从风","转换技，当你使用牌指定目标后，或当你成为牌的目标后，你可以：阳，弃置使用者两张牌；阴，与使用者各摸一张牌。初始为“阴”。",["转换技"]]],"r":[]},{"p":"国际服","sp":"国际服-蚀心入魔","n":"慢吕蒙","t":"病入膏肓","k":"吴","kh":3,"mh":4,"g":"男","s":[["空志","锁定技，当你使用【杀】指定唯一目标后，你获得其至多三张牌；若你已受伤，则普通锦囊牌对你无效且你的基本牌均视为【闪】。",["锁定技"]],["鄙诈","准备阶段或结束阶段，你可以摸一张牌并拼点：若对方没赢，其失去2点体力并令你观看其手牌，然后你可使用其中至多两张点数小于其拼点牌的牌；若你没赢，你减1点体力上限。",[]]],"r":[]},{"p":"国际服","sp":"国际服-谋攻篇","n":"谋诸葛瑾","t":"才猷蕴借","k":"吴","kh":3,"mh":3,"g":"男","s":[["缓释","当一名角色的判定牌生效前，你观看牌堆顶的一张牌，然后你可以用此牌或一张手牌替换之。",[]],["弘援","蓄力技（1/3），当你一次获得大于等于两张牌时，你可以消耗1点蓄力点令至多两名角色各摸一张牌。当一名其他角色一次失去大于等于两张牌时，你可以消耗1点蓄力点令其摸两张牌。",["蓄力技"]],["明哲","锁定技，每轮限两次，当你于回合外失去牌时，你选择一名角色，若其有蓄力技，令其获得1点蓄力点；若你失去的牌中有非基本牌，则其摸两张牌。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-谋攻篇","n":"谋朱然","t":"不动之督","k":"吴","kh":4,"mh":4,"g":"男","s":[["镇围","出牌阶段限一次，你可以令一名其他角色与你同时选择是否弃置至少一张牌。然后你可执行至多X项（X为你弃置牌不小于其的条件数：1.牌数；2.花色数；3.类别数）： 1.获得1点护甲；2.摸四张牌；3.对其造成1点伤害。",[]],["合援","结束阶段，你可以选择一名角色并弃置X张牌（X为你上次发动〖镇围〗时弃置的牌数），令其执行你于上次〖镇围〗执行的最后一项，且此后你对除其外的角色发动〖镇围〗时，该角色也可同时选择是否弃置牌（这些牌于计算〖镇围〗中的X时视为你弃置的牌）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-其他","n":"魔周瑜","t":"太虚幻魇","k":"吴","kh":4,"mh":4,"g":"男","s":[["炬湮","锁定技，当你对一名角色造成火焰伤害后，你摸一张牌，然后令其减1点体力上限。",["锁定技"]],["疠火","当你使用普通【杀】时，你可以将此【杀】改为火【杀】，当此【杀】结算结束后，若此【杀】令其他角色进入过濒死状态，你失去1点体力。你使用火【杀】可以多选择一个目标。",[]],["影箭","准备阶段，你可以视为使用一张无距离限制的【杀】。",[]],["易燃","锁定技，你受到的火焰伤害+1。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"濮阳兴","t":"协邪肆民","k":"吴","kh":4,"mh":4,"g":"男","s":[["征建","游戏开始时，你选择一项：1.使用过非基本牌；2.获得过牌。其他角色的出牌阶段结束时，若其此阶段未完成“征建”要求的选项，其交给你一张牌，然后你可变更〖征建〗的选项。",[]],["众斥","锁定技，当累计有X名角色因〖征建〗交给你牌后（X为游戏人数的一半，向上取整），你本局游戏受到【杀】的伤害+1，并将〖征建〗中的“其交给你一张牌”修改为“你可对其造成1点伤害”。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"桥公","t":"高风硕望","k":"吴","kh":3,"mh":3,"g":"男","s":[["遗珠","游戏开始时或结束阶段，你摸X张牌，然后选择两张牌作为“遗珠”牌随机洗入牌堆顶前2X张牌中（X为存活角色数且至多为4），并展示“遗珠”牌的牌名。其他角色使用“遗珠”牌指定唯一目标后，你可以修改或增加一个目标，然后你将此牌从“遗珠”记录中移除并摸一张牌。",[]],["鸾俦","每轮开始时，你可以选择两名角色视为拥有〖共患〗直到你下次发动此技能。",[]],["共患","每回合限一次，当体力值不大于你且有〖共患〗的其他角色受到伤害时，你可以将此伤害转移给自己。",["衍生技"]]],"r":[]},{"p":"国际服","sp":"国际服-兵势篇","n":"势陆郁生","t":"义姑","k":"吴","kh":3,"mh":3,"g":"女","s":[["润微","出牌阶段限一次，你可以展示牌堆顶至多五张牌，令一名角色获得其中一种颜色的所有牌。若如此做：1.每阶段限一次，你失去X张牌后（X为其因此获得的牌数），该技能可以再次发动且不能指定本回合获得过牌的角色为目标；2.本阶段结束时，你弃置以此法获得的手牌。",[]],["霜怀","每回合限一次，当与你距离1以内的角色受到伤害时，你可以选择一项：1.防止此伤害；2.令其从弃牌堆中获得一张【桃】。若其为此技能上次发动的目标，你与其各摸一张牌，否则你失去1点体力。",[]]],"r":[]},{"p":"国际服","sp":"国际服-兵势篇","n":"势孙綝","t":"蝮影权倾","k":"吴","kh":4,"mh":4,"g":"男","s":[["逆固","出牌阶段限一次，你可以弃置至少一张花色不同的牌，令攻击范围内的角色同时选择是否交给你一张牌。",[]],["戮连","锁定技，当你使用手牌结算结束后，若你没有此类别的手牌，且有目标角色：体力值小于等于你，此牌的所有目标横置；装备区牌数小于等于你，你摸一张牌。乘势：你对一名角色造成1点火焰伤害。",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-兵势篇","n":"势太史慈","t":"志踏天阶","k":"吴","kh":4,"mh":4,"g":"男","s":[["酣战","出牌阶段限一次，你可以选择一名其他角色，你与其分别将手牌摸至X张（X为各自体力上限，且每名角色至多摸三张），然后视为你对其使用一张【决斗】。",[]],["战烈","一名角色的回合开始时，你记录X（X为此时你的攻击范围）。本回合中的前X张【杀】进入弃牌堆后，若此牌在弃牌堆内，你获得1枚“烈”标记（你至多拥有6枚“烈”标记）；出牌阶段结束时，你可以移除所有“烈”标记，视为使用一张无次数限制的【杀】，并选择至多Y项（Y为你本次移除的标记数/2，向下取整）：1.此【杀】目标+1；2.此【杀】伤害基数+1；3.此【杀】需目标角色额外弃置一张牌方可响应；4.此【杀】结算结束后你摸三张牌。",[]],["振锋","限定技，出牌阶段，你可以选择一项：1.回复2点体力；2.分别修改〖酣战〗及〖战烈〗中的X为当前体力值、已损失体力值、存活角色数中的一项（拥有对应技能方可选择）。",["限定技"]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"孙翊","t":"骁悍激躁","k":"吴","kh":4,"mh":4,"g":"男","s":[["躁厉","锁定技，出牌阶段，你只能使用或打出本回合获得的手牌。出牌阶段开始时，你弃置你所有装备牌和任意张非装备牌，然后摸X张牌，并从牌堆中将你弃置牌中相同子类别的装备牌置入装备区，若你以此法置入装备区的牌数大于2，你失去1点体力。（X为你以此法弃置的牌的总数）",["锁定技"]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"吴景","t":"坚攻勉策","k":"吴","kh":4,"mh":4,"g":"男","s":[["锋悍","每回合限一次，当你使用【杀】或伤害锦囊牌指定目标后，你可以令至多X名角色摸一张牌（X为目标数）。",[]],["从击","当你于回合外弃置牌后，你可将其中的所有红色牌交给一名其他角色。",[]]],"r":[]},{"p":"国际服","sp":"国际服-SP","n":"薛综","t":"彬彬之玊","k":"吴","kh":3,"mh":3,"g":"男","s":[["复难","1级：其他角色响应你使用的牌时，你可令其获得你使用的牌，其本回合不能使用或打出之，然后你获得其使用或打出的牌。\n2级：其他角色响应你使用的牌时，你可获得其使用或打出的牌。",[]],["诫训","1级：结束阶段，你可选择一名其他角色并选择一种花色，令其摸场上此花色牌数张牌，然后其弃置X张牌（X为此技能发动过的次数）。若其以此法弃置了所有牌，你选择一项：1. 摸X张牌，然后重置X为0；2. 升级〖复难〗和〖诫训〗。\n2级：结束阶段，你可选择一种花色，令一名其他角色摸场上此花色牌数张牌，然后其弃置X张牌（X为此技能升级前的X）。",[]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"张纮","t":"为世令器","k":"吴","kh":3,"mh":3,"g":"男","s":[["劝迁","昂扬技，其他角色摸牌阶段结束时，你可以将手牌摸至等同于场上手牌数最多的角色（至多摸五张），然后你可以交给当前回合角色任意张牌，你以此法给出的牌：每有一种类别，你摸一张牌；每有一种花色，其本回合使用【杀】次数+1。激昂：累计X名目标角色未受到以其为目标的伤害类牌造成的伤害（X为你上次发动此技能交出的牌数，至少为1）。",["昂扬技"]],["柔克","当你成为其他角色使用的伤害类牌的目标后，若其本回合已造成过伤害，你可以令此牌无效并与其各摸一张牌；若其本轮因此技能摸牌数大于你的体力值，此技能与其非锁定技本轮失效。",[]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"张温","t":"抱德炀和","k":"吴","kh":3,"mh":3,"g":"男","s":[["戈帛","锁定技，游戏开始时或一名角色回复体力后，你亮出牌堆顶三张牌，选择获得一张牌，其余牌置于“仁”区中。",["锁定技"]],["颂蜀","一名体力值不小于你的其他角色出牌阶段开始时，若“仁”区有至少X张牌，你可以观看其手牌并用X张“仁”区牌代替其中等量的牌（X为你的体力值，且最大为5）（原手牌置入弃牌堆）。若如此做，本回合其第一次使用牌指定自己为目标后，你可以令一名角色回复1点体力。",[]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"张媱","t":"琼楼孤蒂","k":"吴","kh":3,"mh":3,"g":"女","s":[["怨语","出牌阶段限一次，你可以摸两张牌并将一张手牌置于武将牌上，称为“怨”，然后选择一名其他角色：你与其弃牌阶段开始时，或当该角色造成1点伤害后，其也须放置一张“怨”直到你触发〖夕颜〗。",[]],["夕颜","每次增加“怨”时，若“怨”的花色数达到4种，你可以获得所有“怨”。然后若此时是你的回合，你的〖怨语〗视为未发动过，本回合手牌上限+4且使用牌无次数限制；若不是你的回合，你可以令当前回合角色本回合手牌上限-4且本回合不能使用基本牌。",[]]],"r":[]},{"p":"国际服","sp":"国际服-沧海遗珠","n":"张昭","t":"功勳克举","k":"吴","kh":3,"mh":3,"g":"男","s":[["力谏","昂扬技，其他角色的弃牌阶段结束时，你可获得任意张此回合因 发动。",["限定技"]]],"r":[]},{"p":"国际服","sp":"国际服-运筹帷幄","n":"神孙策","t":"踞江鬼雄","k":"神","kh":1,"mh":6,"g":"男","s":[["英霸","出牌阶段限一次，你可以令一名体力上限大于1的其他角色，令其失去1点体力并减1点体力上限，并令其获得一枚“平定”标记，然后你减1点体力上限。你对拥有“平定”标记的角色使用牌无距离限制。有“平定”标记的角色每回合前X张牌不能指定你为目标（X为其拥有的“平定”标记数）。",[]],["覆海","锁定技，当你使用牌指定拥有“平定”标记的角色为目标后，其不能响应此牌，且你摸一张牌（每回合限摸三张）；当拥有“平定”标记的角色死亡时，你增加X点体力上限并摸X张牌（X为其“平定”标记数）。",["锁定技"]],["冯河","锁定技，你的手牌上限基值为你的体力上限；当你受到其他角色造成的伤害时，若你的体力上限大于1且你有手牌，你防止此伤害，减1点体力上限，选择一项：1.将一张牌交给一名其他角色；2.重铸一张牌。然后若你有技能〖英霸〗，伤害来源获得一枚“平定”标记。",["锁定技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"曹操","t":"铜雀囚凰","k":"魏","kh":4,"mh":4,"g":"男","s":[["揽娇","出牌阶段对每名角色限一次，你可以展示一名其他角色两张手牌，然后你获得展示的牌；其可以于展示时失去1点体力并摸一张牌，令你重新展示。若你一回合内因此获得过♥和♦牌，此技能本回合失效。",[]]],"r":[],"vi":1,"vt":2},{"p":"蚀心入魔","sp":"蚀心入魔·疑","n":"曹丕","t":"兄友弟恭","k":"魏","kh":3,"mh":3,"g":"男","s":[["争嗣","出牌阶段，你可以选择包括你在内的三名有手牌的角色，令其中一名角色先展示一张手牌，其余角色再同时展示一张手牌：点数最大的角色弃置两张手牌，点数最小的角色失去1点体力。",[]],["承命","出牌阶段结束时，若你是本阶段“争嗣”角色中：手牌数最多的，你可以回复2点体力；体力值最大的，你可以获得“争嗣”角色各一张牌。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"曹仁","t":"坚壳之蚌","k":"魏","kh":4,"mh":4,"g":"男","s":[["佯北","准备阶段和结束阶段，你可以翻面并摸三张牌。当你使用【杀】或普通锦囊牌指定唯一目标后，其可以弃置所有手牌令此技能本回合失效。",[]],["阴锋","锁定技，当你每回合首次造成伤害后，将受伤角色体力上限减至其体力值且其接下来造成和受到的伤害均视为失去体力，直到你下回合开始。",["锁定技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·疑","n":"蒋干","t":"舌锁千帆","k":"魏","kh":3,"mh":3,"g":"男","s":[["纵横","准备阶段，你可以观看两名其他角色的手牌，你展示并获得其中一名角色的一张手牌，然后可以弃置另一名角色的手牌中与此牌类别、花色、点数相同的牌各一张。",[]],["对辩","当你每回合首次受到伤害时，你可以与伤害来源延时拼点并防止此伤害，然后其可以令你弃置其一张牌并公开拼点结果：若其赢，你失去1点体力。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·贪","n":"吕布","t":"饥鹰饱虎","k":"魏","kh":5,"mh":5,"g":"男","s":[["辘辘","若你没有手牌，你可以将其他角色的一张牌当【决斗】使用；指定目标后所有角色同时选择是否展示并交给你一张手牌。",[]],["择主","若你的手牌数全场最多，你可以将所有手牌当一张无距离次数限制的【杀】对至少半数角色使用；此牌于结算中被第二次抵消时，抵消角色获得之。",[]],["累勋","限定技，结束阶段，你可以将你本局游戏出牌阶段使用【杀】的次数上限改为你本回合使用的【杀】数。",["限定技"]]],"r":[],"vi":1,"vt":2},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"庞德","t":"狂徒","k":"魏","kh":4,"mh":4,"g":"男","s":[["搦战","准备阶段，你可以摸一张牌令一名其他角色声明一种伤害类牌，然后你选择你或其视为对对方使用此牌且伤害+1，若未对目标造成伤害，则使用者失去1点体力，然后你可对相同角色重复此流程。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·疑","n":"王垕","t":"一刀斩讫","k":"魏","kh":4,"mh":4,"g":"男","s":[["聚谷","准备阶段，你可以依次将任意名角色共计至多五张牌置于牌堆顶（正面朝上），此回合结束时，这些角色获得牌堆中各自放置的牌（没有则跳过），然后各摸一张牌。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·疑","n":"荀彧","t":"末路见疑","k":"魏","kh":3,"mh":3,"g":"男","s":[["迥策","出牌阶段限一次，你可以依次进行两次拼点（目标不能为同一名角色），然后赢的角色各对另一次拼点中没赢的角色造成1点伤害。",[]],["异合","锁定技，你的回合内各限一次，当一名角色受到伤害时，若其和伤害来源的体力值与手牌数大小关系：不同，此伤害+1；相同，双方各摸两张牌。",["锁定技"]],["赍志","锁定技，其他角色不能对你使用【桃】；当你每回合首次进入濒死状态时，你回复1点体力。",["锁定技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"关银屏","t":"天骄虎女","k":"蜀","kh":4,"mh":4,"g":"女","s":[["姻谋","男性角色的结束阶段，其可以连接你和其各一张未被连接的手牌；当你每回合首次失去连接牌后，本次一同失去连接牌的角色依次摸X张牌（X为这些角色数且至多为5）。",[]],["驱斥","出牌阶段限一次，你可以对一名角色造成1点火焰伤害，若其有连接牌，则重置其连接牌令此伤害+1。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"寇封","t":"不动如山","k":"蜀","kh":4,"mh":4,"g":"男","s":[["怀兵","准备阶段，你可以选择两名有手牌的角色，获得这些角色各一张手牌，然后你展示手牌， 令其中体力值较少的角色下个摸牌阶段摸牌数、出牌阶段【杀】的使用次数、弃牌阶段手牌上限改为其中红色牌的数量。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"糜芳","t":"负荆之臣","k":"蜀","kh":3,"mh":3,"g":"男","s":[["火厄","结束阶段，你可以视为对至多四名其他角色使用一张【火攻】，若你能执行此【火攻】效果的弃牌，则你须弃置牌且此【火攻】对剩余目标无效（否则当前目标观看你的手牌）。最后你分配因此【火攻】效果展示的牌，然后若这些牌点数和小于13则你失去1点体力。",[]],["贪惰","弃牌阶段开始前，若你计入手牌上限的手牌数大于手牌上限，则将此阶段改为摸牌阶段。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"于禁","t":"立地成佛","k":"蜀","kh":4,"mh":4,"g":"男","s":[["肃伍","准备阶段，你可以连接至多四名角色各一张手牌；若你有连接牌，则有连接牌的角色每回合首次使用的伤害类牌不可被响应且结算后其摸两张牌。",[]],["仁王","每回合限一次，你可以将你的一张连接牌当【桃】使用。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"赵云","t":"坐收渔利","k":"蜀","kh":4,"mh":4,"g":"男","s":[["诈夺","结束阶段，你可以获得两名其他角色各一张牌，视为对其中一名角色使用一张【杀】，然后另一名角色视为对你使用一张【决斗】；在和其中一名角色的结算过程中，你视为拥有另一名角色的所有技能。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"诸葛亮","t":"人也神也","k":"蜀","kh":3,"mh":3,"g":"男","s":[["并驱","准备阶段，你可以与一名其他角色各声明一种普通锦囊牌，然后双方依次将半数手牌（向上取整）当对方声明的牌使用。",[]],["燔心","游戏开始或“燔心”角色死亡后，你可以令一名其他角色获得〖狂暴〗〖无谋〗；其回合开始时，你可以移去其至多5枚“暴怒”并摸等量的牌。",[]],["狂暴","锁定技，游戏开始时，你获得2枚“暴怒”；当你造成或受到1点伤害后，你获得1枚“暴怒”。",["锁定技","衍生技"]],["无谋","锁定技，当你使用普通锦囊牌时，你选择：1.弃1枚“暴怒”；2.失去1点体力。",["锁定技","衍生技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"贾华","t":"拔剑四顾","k":"吴","kh":5,"mh":5,"g":"男","s":[["伏备","出牌阶段限一次，你可以将手牌摸至体力上限，然后将两张牌正面朝上置于牌堆顶前十张的任意位置（对其他角色可见）；每名角色回合结束时，若牌堆顶的牌正面朝上，你须对其造成1点伤害。",[]],["殚瘁","契定技，当你造成伤害时，你可以弃置两张牌（没有则不弃），令此伤害+1。",["契定技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"鲁肃","t":"养虺成蛇","k":"吴","kh":3,"mh":3,"g":"男","s":[["万利","首轮开始时，你可以交给一名其他角色任意张牌，第四轮结束时若你存活，其交给你三倍数量的牌（不足则全给并失去所有技能）；若其已还牌或死亡，你摸牌阶段多摸三张牌。",[]],["理说","当你成为黑色牌的目标后，你可以摸一张牌与未还牌的“万利”角色拼点：若你赢，其提前一轮还牌。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"陆逊","t":"孺子为将","k":"吴","kh":3,"mh":3,"g":"男","s":[["谄谀","出牌阶段限一次，你可以令一名其他角色摸其体力值张牌并与你用各自点数最小的手牌拼点，然后双方展示手牌，赢的角色可交换双方一种颜色或类别的所有手牌。",[]],["从风","转换技，当你使用牌指定目标后，或当你成为牌的目标后，你可以：阳，与使用者各摸一张牌；阴，弃置使用者两张牌。",["转换技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·慢","n":"吕蒙","t":"病入膏肓","k":"吴","kh":3,"mh":4,"g":"男","s":[["空志","锁定技，当你使用【杀】指定唯一目标后，你获得其至多三张牌；若你已受伤，则普通锦囊牌对你无效且你的基本牌均视为【闪】。",["锁定技"]],["鄙诈","结束阶段，你可以摸一张牌并拼点：若对方没赢，其失去2点体力并令你观看其手牌，然后你可以使用其中至多两张点数小于其拼点牌的牌；若你没赢，你减1点体力上限。",[]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"孙尚香","t":"生死相随","k":"吴","kh":3,"mh":3,"g":"女","s":[["骄纵","准备阶段或当你成为【杀】的目标后，你可以移动场上一张装备牌至一名角色装备区内，其本回合不能使用与之颜色相同的牌且受到的伤害+1。",[]],["妇随","限定技，出牌阶段，你可以令一名男性角色失去一个非标签技能，然后你与其获得〖比翼〗并防止你们本轮受到的伤害。",["限定技"]],["比翼","转换技，阳：因此次〖妇随〗失去的技能；阴，〖枭姬〗。",["转换技","衍生技"]],["枭姬","当你失去一张装备区的装备牌后，你可以摸两张牌。",["衍生技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·嗔","n":"张昭","t":"迂儒","k":"吴","kh":3,"mh":3,"g":"男","s":[["挟众","准备阶段，你可以令场上半数角色（向上取整）依次选择并执行一项：1.摸两张牌，失去1点体力；2.将两张牌当【杀】使用；然后你可以令另一名角色执行两次被选择较多的一项。",[]],["乞施","契定技，结束阶段，你可以获得本回合弃牌堆内其他角色置入的至多五张牌，然后跳过你下个摸牌阶段。",["契定技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·贪","n":"陈宫","t":"暴怒的军师","k":"群","kh":3,"mh":3,"g":"男","s":[["狭策","准备阶段，你可以令一名角色于其下个出牌阶段仅能使用一张手牌，且此牌额外结算两次。",[]],["莽伏","其他角色准备阶段，你可以获得其至多两张手牌并发动等量次〖设伏〗，此回合结束时，你移去你的剩余“伏兵”并失去等量体力。",[]],["设伏","结束阶段，你可以扣置一张牌为“伏兵”；其他角色于你的回合外使用手牌时，你可以移去一张颜色和类别均相同的“伏兵”，令此牌无效。",["衍生技"]]],"r":[]},{"p":"蚀心入魔","sp":"蚀心入魔·贪","n":"陈珪陈登","t":"股掌戏虎","k":"群","kh":3,"mh":3,"g":"男","s":[["鬻主","每轮开始时，你可以选择两名角色，本轮内：其中一名角色视为同时装备【仁王盾】【八卦阵】【藤甲】且每受到1点伤害后交给你和来源各一张牌；另一名角色视为装备【青釭剑】。",[]],["请丧","结束阶段，你可以令一名其他角色视为对你指定的角色使用一张【决斗】，每当目标打出【 角色至多三张牌并令其指定等量角色，然后你执行一个不能对其指定角色使用牌的额外回合。 ⬤　失败：此回合你未使用过牌，你减1点体力上限。",["使命技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"柏灵筠","t":"玲珑心窍","k":"魏","kh":3,"mh":3,"g":"女","s":[["灵慧","一名角色的结束阶段，若其为你或有角色于本回合内进入过濒死状态，你可以观看牌堆顶的三张牌，你可以使用其中一张牌，然后随机获得剩余牌中的一张。",[]],["黠策","每回合各限一次，当你受到伤害后，你可以令一名其他角色的所有非锁定技于本回合内失效；当你造成伤害后，你可以弃置一张牌并回复1点体力。",[]],["御心","限定技，当一名角色进入濒死状态时，你可以令其回复体力至X点（X为你的体力值且至少为1）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"卞喜","t":"伏龛蛇影","k":"魏","kh":4,"mh":4,"g":"男","s":[["钝袭","当你使用伤害牌时，你可以令其中一个目标获得1个“钝”标记。有“钝”标记的角色使用指定唯一目标的基本牌或锦囊牌时，若没有角色处于濒死状态，其移去一个“钝”，然后目标改为随机一名角色。若随机的目标与原本目标相同，则其于此牌结算结束后失去1点体力并结束出牌阶段。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"卞玥","t":"暮辉映族","k":"魏","kh":3,"mh":3,"g":"女","s":[["庇族","出牌阶段，你可以令所有手牌数与你相等的角色各摸一张牌，若这些角色与你本回合此前发动此技能时选择的角色完全相同，此技能本回合失效且你回复1点体力。",[]],["无胁","回合结束时，你可以选择一名其他角色，与其交换手牌，然后你将手牌中的所有伤害牌置入牌堆底。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蔡瑁张允","t":"乘雷潜狡","k":"魏","kh":4,"mh":4,"g":"男","s":[["连舟","锁定技，准备阶段，将你的武将牌横置，然后横置任意名体力值等于你的角色。",["锁定技"]],["惊澜","锁定技，当你造成伤害后，若你的手牌数：大于体力值，你弃四张手牌；等于体力值，你弃一张牌并回复1点体力；小于体力值，你受到1点火焰伤害并摸五张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蔡阳","t":"一据千里","k":"魏","kh":4,"mh":4,"g":"男","s":[["寻嫉","出牌阶段限一次，你可以秘密选择一名其他角色。该角色的下个结束阶段，若其本回合使用过黑色牌，则你视为对其使用一张【决斗】；若此【决斗】对其造成伤害且其存活，其对你造成等量的伤害。",[]],["交锋","锁定技，当你每回合首次造成伤害时，若你已损失体力值：大于0，你摸一张牌；大于1，此伤害+1；大于2，你回复1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹安民","t":"履薄临深","k":"魏","kh":4,"mh":4,"g":"男","s":[["险卫","锁定技，准备阶段，你废除一个装备栏并摸等同于你未废除装备栏数的牌，然后令一名其他角色使用牌堆中第一张此副类别的装备牌（没有则其摸一张牌）。 你的所有装备栏均废除后，你加2点体力上限，然后你和其他角色始终互相视为在对方攻击范围内。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"曹纯","t":"虎豹骑首","k":"魏","kh":4,"mh":4,"g":"男","s":[["缮甲","出牌阶段开始时，你可以摸三张牌，然后弃置三张牌（你每不因使用而失去过一张装备牌，便少弃置一张），若你本次没有弃置过：基本牌，你此阶段使用【杀】次数上限+1；锦囊牌，你此阶段使用牌无距离限制；都满足，你可以视为使用【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹芳","t":"迷瞑终觉","k":"魏","kh":4,"mh":4,"g":"男","s":[["置民","锁定技，每轮开始时，你选择至多X名其他角色（x为你的体力值），获得这些角色点数最小的一张手牌。你于回合外得到牌后，这些牌称为“民”。当你失去“民”后，你将手牌补至体力上限。",["锁定技"]],["拒谏","主公技，出牌阶段限一次，你可以令一名其他魏势力角色摸一张牌，直到本轮结束，其使用的普通锦囊牌对你无效。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹华","t":"殊凰求凤","k":"魏","kh":3,"mh":3,"g":"女","s":[["彩翼","转换技，结束阶段，你可以令一名角色选择一项并移除该选项：阳：1.回复X点体力；2.摸X张牌；3.复原武将牌；4.随机执行一个已移除的阳选项；阴：1.受到X点伤害；2.弃置X张牌；3.翻面并横置；4.随机执行一个已移除的阴选项。（X为当前状态剩余选项数）",["转换技"]],["归离","你的第一个回合开始时，你选择一名其他角色。该角色每轮的第一个回合结束时，若其本回合未造成过伤害，你执行一个额外的回合。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹金玉","t":"金乡公主","k":"魏","kh":3,"mh":3,"g":"女","s":[["隅泣","每回合限两次，当一名角色受到伤害后，若你与其距离0或者更少，你可以观看牌堆顶的3张牌，将其中至多1张交给受伤角色，至多1张自己获得，剩余的牌放回牌堆顶。",[]],["善身","当一名角色死亡时，你可以令〖隅泣〗中的一个数字+2（单项不能超过5）。若你没有对其造成过伤害，你回复1点体力。",[]],["娴静","准备阶段，你可以令〖隅泣〗中的一个数字+1（单项不能超过5）。若你满体力值，则再令〖隅泣〗中的一个数字+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹髦","t":"霸业的终耀","k":"魏","kh":3,"mh":4,"g":"男","s":[["潜龙","当你受到伤害后，你可以展示牌堆顶的三张牌并获得其中至多X张牌（X为你已损失的体力值），然后将剩余的牌置于牌堆底。",[]],["忿肆","锁定技，准备阶段，你对一名体力值不小于你的角色造成1点伤害；若受伤角色不为你，则其视为对你使用一张【杀】。",["锁定技"]],["决讨","限定技，出牌阶段开始时，若你的体力值为1，你可以选择一名其他角色，依次使用牌堆底的牌直到你无法使用，这些牌不能指定除你和该角色以外的角色为目标。",["限定技"]],["助势","主公技，其他魏势力角色每回合限一次，该角色回复体力时，你可以令其选择是否令你摸一张牌。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹嵩","t":"依权弼子","k":"魏","kh":4,"mh":4,"g":"男","s":[["礼赂","摸牌阶段，你可以放弃摸牌，改为将手牌摸至体力上限（最多摸至5张），并将至少一张手牌交给一名其他角色；若你交出的牌数大于上次以此法交出的牌数，你增加1点体力上限并回复1点体力。",[]],["翊正","结束阶段，你可以选择一名其他角色。直到你的下回合开始，当该角色造成伤害或回复体力时，若其体力上限小于你，你减1点体力上限，然后此伤害或回复值+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"曹宪","t":"蝶步韶华","k":"魏","kh":3,"mh":3,"g":"女","s":[["灵犀","出牌阶段开始时或结束时，你可以将至多体力上限张牌置于你的武将牌上，称为“翼”。当“翼”被移去后，你将手牌调整至“翼”花色数的两倍。",[]],["知否","当你使用牌结算结束后，你可以移去至少X张“翼”（X为你本回合发动此技能的次数）并令一名角色执行一项（每回合每项限一次）：1.将一张牌置入“翼”；2.弃置两张牌；3.失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"曹轶","t":"飒姿缔燹","k":"魏","kh":4,"mh":4,"g":"女","s":[["蜜饴","准备阶段，你可以选择一项令任意名角色执行：1.回复1点体力；2.你对其造成1点伤害。若如此做，结束阶段，这些角色执行另一项。",[]],["寅君","当你对其他角色从手牌使用指定唯一目标的【杀】或锦囊牌结算后，你可以视为对其使用一张【杀】（此【杀】伤害无来源）。若本回合发动次数大于你当前体力值，此技能本回合无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"程昱","t":"泰山捧日","k":"魏","kh":3,"mh":3,"g":"男","s":[["设伏","结束阶段，你可以将一张牌扣置于武将牌上并记录一个基本牌或锦囊牌的名称，称为“伏兵”（须与其他“伏兵”记录的名称均不同）。当其他角色于你的回合外使用手牌时，你可以将记录的牌名与此牌相同的一张“伏兵”置入弃牌堆，然后此牌无效。若此时是使用者的回合，其本回合所有技能失效。",[]],["贲育","当你受到伤害后，你可以选择一项：1.将手牌摸至与伤害来源相同（最多摸至5张）；2.弃置大于伤害来源手牌数张牌，然后对其造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈矫","t":"刚断骨鲠","k":"魏","kh":3,"mh":3,"g":"男","s":[["协守","每回合限一次，一名角色受到伤害后，若你与其距离不大于2，你可以令你的手牌上限-1，然后其选择一项：1.回复1点体力；2.复原武将牌并摸两张牌。",[]],["清严","每回合限两次，当你成为其他角色使用黑色牌的目标后，若你的手牌数：小于体力值，你可以将手牌摸至体力上限；不小于体力值，你可以弃置一张手牌令手牌上限+1。",[]],["弃子","锁定技，其他角色处于濒死状态时，若你与其距离大于2，你不能对其使用【桃】。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈琳","t":"破竹之咒","k":"魏","kh":3,"mh":3,"g":"男","s":[["笔伐","结束阶段，你可以将一张手牌移出游戏并指定一名其他角色。该角色的回合开始时，其观看你移出游戏的牌并选择一项：1.交给你一张与此牌同类型的手牌并获得此牌；2.将此牌置入弃牌堆，然后失去1点体力。",[]],["颂词","出牌阶段，你可以选择一项（每名角色限一次）：1.令一名手牌数不大于体力值的角色摸两张牌；2.令一名手牌数大于体力值的角色弃置两张牌。弃牌阶段结束时，若你对所有存活角色均发动过“颂词”，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈泰","t":"岳峙渊渟","k":"魏","kh":4,"mh":4,"g":"男","s":[["救陷","出牌阶段限一次，你可以重铸一半手牌（向上取整），然后视为使用一张【决斗】。此牌对目标角色造成伤害后，你可以令其攻击范围内的一名其他角色回复1点体力。",[]],["沉勇","结束阶段，你可以摸X张牌（X为本回合你使用过牌的类型数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"车胄","t":"当车螳臂","k":"魏","kh":4,"mh":4,"g":"男","s":[["慑伏","锁定技，你的牌造成的伤害改为X，其他角色的牌对你造成的伤害改为X（X为该牌在手中的轮数）。",["锁定技"]],["披挂","当你对其他角色造成伤害后，若伤害值大于1，可以获得其至多当前轮数张的手牌，这些牌本回合不计入手牌上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"崔令仪","t":"鸾裾织命","k":"魏","kh":3,"mh":3,"g":"女","s":[["华裳","游戏开始时，将每种颜色各一张牌置入你的装备区。 若你的装备区有两种颜色的牌，你使用牌无距离限制。 当你使用一张牌结算后，你可以将一张相同花色的非装备手牌置入装备区。 当你失去手牌后，你将手牌补至等同于你装备区牌的花色数。",[]],["逾制","锁定技，当你成为【杀】的目标时，你需选择一项：1.弃置一张装备区内的牌，视为使用【闪】，失去此选项至你的回合开始；2.此【杀】伤害+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"崔琰毛玠","t":"日出月盛","k":"魏","kh":3,"mh":3,"g":"男","s":[["征辟","出牌阶段开始时，你可以选择一名其他角色并选择一项：1.此阶段结束时，若其此阶段获得过手牌，你获得其一张手牌和装备区内一张牌；2.交给其一张基本牌，然后其交给你一张非基本牌或两张基本牌。",[]],["奉迎","限定技，出牌阶段，你可以弃置所有手牌，若如此做，此回合结束后，你执行一个额外回合；此额外回合开始时，若你的体力值全场最少，你将手牌摸至体力上限。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"丁尚涴","t":"与君不载","k":"魏","kh":3,"mh":3,"g":"女","s":[["讽言","出牌阶段各限一次，你可以：1.令一名体力值不大于你的其他角色交给你一张手牌；2.视为对一名手牌数不大于你的其他角色使用一张【杀】（无距离次数限制）。",[]],["抚悼","游戏开始时，你选择一名其他角色： 你与其每回合首次使用牌指定对方为目标后，各摸两张牌； 杀死你或该角色的其他角色获得“决裂”标记，你或该角色对有“决裂”的角色造成的伤害+1； “决裂”角色使用黑色牌指定你为目标后，其本回合不能再使用牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"董昭","t":"筹定魏勋","k":"魏","kh":3,"mh":3,"g":"男","s":[["移驾","你距离1以内的角色受到伤害后，你可以将场上一张装备牌移动至其装备区（替换原装备），若其因此脱离了一名角色的攻击范围，你摸一张牌。",[]],["定基","准备阶段，你可以令一名角色将手牌数调整至五，然后其展示所有手牌，若牌名均不同，其可以视为使用其中一张基本牌或普通锦囊牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"段巧笑","t":"柔荑点绛唇","k":"魏","kh":3,"mh":3,"g":"女","s":[["彩妆","出牌阶段限一次，你可以弃置任意张牌，然后重复摸牌直到手牌中的花色数等同于弃牌花色数。",[]],["华衣","结束阶段，你可以判定，然后直到你的下回合开始时根据结果获得以下效果：红色，每个回合结束时摸一张牌；黑色，受到伤害后摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杜夫人","t":"沛王太妃","k":"魏","kh":3,"mh":3,"g":"女","s":[["异色","当其他角色获得你的牌后，若此牌为：红色，你可以令其回复1点体力；黑色，其下次受到【杀】造成的伤害时，此伤害+1。",[]],["顺世","准备阶段或当你于回合外受到伤害后，你可以交给一名其他角色一张牌（伤害来源除外），然后直到你的回合结束，你摸牌阶段多摸一张牌、出牌阶段使用【杀】次数上限+1、手牌上限+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"杜畿","t":"卧镇京畿","k":"魏","kh":3,"mh":3,"g":"男","s":[["安东","当你受到其他角色造成的伤害时，你可以令伤害来源选择一项：1.防止此伤害，本回合弃牌阶段♥牌不计入手牌上限；2.观看其手牌，若其中有♥牌则你获得这些牌。",[]],["应势","出牌阶段开始时，若没有武将牌旁有“酬”的角色，你可将所有♥牌置于一名其他角色的武将牌旁，称为“酬”。若如此做，当一名角色使用【杀】对武将牌旁有“酬”的角色造成伤害后，其可以获得一张“酬”。当武将牌旁有“酬”的角色死亡时，你获得所有“酬”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杜夔","t":"律吕调阳","k":"魏","kh":3,"mh":3,"g":"男","s":[["泛音","出牌阶段开始时，你可以亮出牌堆中点数最小的一张牌并选择一项：1.使用之（无距离限制）；2.令你本回合使用的下一张牌可以多选择一个目标。然后亮出牌堆中点数翻倍的一张牌并重复此流程。",[]],["配器","当你受到伤害后，你可以移动场上一张牌。然后若所有角色均在相互的攻击范围内，你可以再移动场上一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杜预","t":"文成武德","k":"魏","kh":4,"mh":4,"g":"男","s":[["谏国","出牌阶段各限一次，你可以令一名角色：1.摸一张牌，然后弃置一半手牌（向上取整）；2.弃置一张牌，然后摸当前手牌数一半的牌（向上取整）。",[]],["倾势","当你于回合内使用【杀】或锦囊牌指定其他角色为目标后，若此牌是你本回合使用的第X张牌（X为你的手牌数），你可以对其中一名目标角色造成1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"费曜","t":"后将军","k":"魏","kh":4,"mh":4,"g":"男","s":[["镇锋","每回合限一次，一名其他角色于其回合内使用牌时，若其手牌数不大于体力值，你可以猜测其手牌中与此牌类别相同的牌数。若你猜对，你摸X张牌并视为对其使用一张【杀】（X为你连续猜对次数且最多为5）；若猜错且差值大于1，则视为其对你使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"管辂","t":"问天通神","k":"魏","kh":3,"mh":3,"g":"男","s":[["推演","出牌阶段开始时，你可以观看牌堆顶的三张牌。",[]],["卜算","出牌阶段限一次，你可以选择一名其他角色，然后选择至多两种基本牌或锦囊牌牌名。该角色下次摸牌阶段摸牌时，改为从牌堆或弃牌堆中获得你选择的牌。",[]],["命戒","结束阶段，你可以摸一张牌，若此牌为红色，你可以重复此流程直到摸到黑色牌或摸到第三张牌。当你以此法摸到黑色牌时，若你的体力值大于1，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"关羽","t":"汉寿亭侯","k":"魏","kh":4,"mh":4,"g":"男","s":[["武圣","你可以将一张红色牌当【杀】使用或打出。你使用♦【杀】无距离限制。",[]],["单骑","觉醒技，准备阶段，若你区域里的牌数大于体力值，你减1点体力上限，回复体力至体力上限，摸X张牌（X为你以此法回复的体力值），获得〖马术〗和〖怒嗔〗。",["觉醒技"]],["马术","锁定技，你与其他角色的距离-1。",["锁定技","衍生技"]],["怒嗔","出牌阶段限一次，你可以展示一名其他角色的一张手牌，然后你选择一项：1.弃置任意张相同花色的牌，对其造成等量的伤害；2.获得其手牌中所有此花色的牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"郭缇萦","t":"逆运定势","k":"魏","kh":3,"mh":3,"g":"女","s":[["堪舆","当一名角色进行判定时或当你受到伤害时，你可以观看牌堆顶和牌堆底各一张牌，然后可以获得其中任意张牌并将其余牌以任意顺序置于牌堆顶。若你因此获得牌，本局游戏【闪电】对你生效的范围增加获得牌的花色点数。",[]],["谪厄","锁定技，游戏开始时，你随机将牌堆中一张【闪电】置入你的判定区；每个回合结束时，若弃牌堆中有【闪电】，你随机将其中一张置入你的判定区。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"郭照","t":"碧海青天","k":"魏","kh":3,"mh":3,"g":"女","s":[["偏宠","摸牌阶段，你可以改为从牌堆获得红色牌和黑色牌各一张，然后选择一项直到你的下回合开始：1.你每失去一张红色牌后摸一张黑色牌；2.你每失去一张黑色牌后摸一张红色牌。",[]],["尊位","出牌阶段限一次，你可以选择一名其他角色，选择执行以下一项，然后移除该选项：1.将手牌数摸至与该角色相同（最多摸五张）；2.随机使用牌堆中的装备牌至与该角色相同；3.将体力回复至与该角色相同。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"韩龙","t":"冯河易水","k":"魏","kh":4,"mh":4,"g":"男","s":[["独往","锁定技，游戏开始时，你将牌堆顶五张不为【杀】的牌置于武将牌上，称为“刺”。若你有“刺”，你与其他角色互相计算距离均+1。",["锁定技"]],["刺北","当【杀】使用结算结束后，若此【杀】造成过伤害，你可以将此【杀】与一张不为【杀】的“刺”交换，然后弃置一名角色区域内的一张牌。一名角色的回合结束时，若所有“刺”均为【杀】，你获得所有“刺”，这些【杀】不能被弃置、不计入手牌上限、使用时无距离和次数限制。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"何晏","t":"傅粉何郎","k":"魏","kh":3,"mh":3,"g":"男","s":[["崖柴","当你受到伤害后，你可以令伤害来源选择一项：1.弃置一半手牌（向上取整）；2.其本回合不能再使用手牌，你摸两张牌；3.展示所有手牌，然后交给你一种花色的所有手牌。",[]],["清谈","出牌阶段限一次，你可以令所有角色同时选择一张手牌并展示。你可以获得其中一种花色的牌，然后展示此花色牌的角色各摸一张牌。弃置其余的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"桓范","t":"雍国竝世","k":"魏","kh":3,"mh":3,"g":"男","s":[["谏诤","出牌阶段限一次，你可以观看一名其他角色的手牌，然后若其中有你可以使用的牌，你可以获得并使用其中一张，若指定了其为目标，则横置你与其武将牌，然后其观看你的手牌。",[]],["腹谋","当你受到伤害后，你可以令至多X名角色依次选择一项（从你开始逆时针结算）：1.移动场上一张牌；2.弃置所有手牌并摸两张牌；3.弃置装备区所有牌并回复1点体力。（X为你已损失的体力值）",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"环怀瑾","t":"慧心育麟","k":"魏","kh":3,"mh":3,"g":"女","s":[["怜幼","每轮每项限一次，你的回合开始或你受到伤害后，你可以选择一项：1.令一名角色回复1点体力；2.令一名角色随机使用牌堆或弃牌堆中两张装备牌；3.摸三张牌并可以交给一名其他角色三张牌。",[]],["慈厉","每轮开始时，你可以选择一名角色并记录其当前体力值，直到其下个回合结束，若其使用的牌数：小于记录值，你可以令其随机弃置记录值张牌；大于等于记录值，你可以令其摸记录值张牌（至多五张）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"桓阶","t":"冰鉴丹忱","k":"魏","kh":3,"mh":3,"g":"男","s":[["谏立","出牌阶段限两次，你可以交给一名其他角色至多两张牌，然后其可使用一张手牌，若其未因此使用牌造成伤害，你受到其造成的1点伤害。",[]],["清政","每回合每项限一次，当你的体力值、手牌数、装备区牌数变化后，若值为1，你可以选择一项：1.摸X张牌；2.回复X点体力；3.将牌堆中X张装备牌置入你的装备区。若X大于2，此技能视为未发动过且令你的当前手牌无次数限制（X为你的体力值、手牌数、装备区牌数为1的数量）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"华歆","t":"渊清玉洁","k":"魏","kh":3,"mh":3,"g":"男","s":[["望归","当你造成伤害后，你可以对与你势力不同的一名角色造成1点伤害（每回合限一次）；当你受到伤害后，你可以令一名与你势力相同的角色摸一张牌，若不为你，你也摸一张牌。",[]],["息兵","每回合限一次，当一名其他角色在其出牌阶段内使用黑色【杀】或黑色普通锦囊牌指定唯一目标后，你可以令该角色将手牌摸至体力值（至多摸至五张），然后其本回合不能再使用牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"胡班","t":"血火照路","k":"魏","kh":4,"mh":4,"g":"男","s":[["崇义","一名角色于出牌阶段内使用的第一张牌若为【杀】，你可以令其摸两张牌且此阶段使用【杀】次数上限+1；一名角色的出牌阶段结束时，若其于此阶段使用的最后一张牌为【杀】，你可以令其此回合手牌上限+1，然后你获得弃牌堆中的此【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"胡遵","t":"蓝翎紫璧","k":"魏","kh":4,"mh":4,"g":"男","s":[["斩涛","当你或你攻击范围内的角色受到有点数的牌造成的伤害后，若伤害来源不为你，你可以判定，若点数大于造成伤害的牌的点数，你视为对伤害来源使用【杀】。",[]],["安境","每回合限一次，当你造成伤害后，你可以令至多X名已受伤角色各摸一张牌，然后其中体力值最少的随机一名角色回复1点体力。（X为此技能发动次数）",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"贾充","t":"始作俑者","k":"魏","kh":3,"mh":3,"g":"男","s":[["悖逆","出牌阶段限一次，你可以将手牌数调整至体力上限，然后令一名角色视为对另一名角色使用一张【杀】；这两名角色的非锁定技本回合失效。",[]],["恃纵","当你需要使用一张基本牌时，你可以交给一名其他角色X张牌（X为此技能本回合发动次数），然后其可以将一张牌置于牌堆底，视为你使用之。若其不为当前回合角色，此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蒋干","t":"锋谪悬信","k":"魏","kh":3,"mh":3,"g":"男","s":[["伪诚","其他角色获得你的手牌后，若你的手牌数小于体力值，你可以摸一张牌。",[]],["盗书","出牌阶段限一次，你可以选择一名其他角色并选择一种花色，然后获得其一张手牌。若此牌与你选择的花色：相同，你对其造成1点伤害且此技能视为未发动过；不同，你交给其一张其他花色的手牌（若没有需展示所有手牌）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"贾诩","t":"料事如神","k":"魏","kh":3,"mh":3,"g":"男","s":[["缜略","锁定技，你使用的普通锦囊牌不能被抵消，你不能被选择为延时锦囊牌的目标。",["锁定技"]],["间书","出牌阶段限一次，你可以将一张黑色手牌交给一名其他角色，然后选择另一名其他角色，令这两名角色拼点：赢的角色随机弃置一张牌，没赢的角色失去1点体力。若有角色因此死亡，此技能视为未发动过。",[]],["拥嫡","限定技，出牌阶段，你可以选择一名男性角色：若其体力值全场最少，其回复1点体力；体力上限全场最少，其加1点体力上限；手牌数全场最少，其摸体力上限张牌（最多摸五张）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹冲","t":"妙法仁心","k":"魏","kh":3,"mh":3,"g":"男","s":[["称象","当你受到伤害后，你可以亮出牌堆顶的四张牌，获得其中任意张点数之和不大于13的牌。若获得的牌点数之和为13，你复原武将牌。",[]],["仁心","当体力值为1的其他角色受到伤害时，你可以弃置一张装备牌，将武将牌翻面并防止此伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹叡","t":"魏明帝","k":"魏","kh":3,"mh":3,"g":"男","s":[["恢拓","当你受到伤害后，你可以令一名角色进行判定，若结果为：红色，其回复1点体力；黑色，其摸X张牌（X为伤害值）。",[]],["明鉴","出牌阶段限一次，你可以将所有手牌交给一名其他角色，该角色下回合：使用【杀】次数上限和手牌上限+1；首次造成伤害后，你可以发动〖恢拓〗。",[]],["兴衰","主公技，限定技，当你进入濒死状态时，你可令其他魏势力角色依次选择是否令你回复1点体力。选择是的角色在此次濒死结算结束后受到1点无来源的伤害。",["主公技","限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹休","t":"征东大将军","k":"魏","kh":4,"mh":4,"g":"男","s":[["千驹","锁定技，你计算与其他角色的距离-X。（X为你已损失的体力值）",["锁定技"]],["倾袭","当你使用【杀】或【决斗】指定目标后，你可以令其选择一项：1.弃置等同于你攻击范围内的角色数张手牌（至多为2，若你装备区有武器牌则改为至多为4），然后弃置你的武器；2.令此牌对其伤害+1且你进行一次判定，若结果为红色，该角色不能响应此牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹彰","t":"黄须儿","k":"魏","kh":4,"mh":4,"g":"男","s":[["将驰","出牌阶段开始时，你可以选择一项：1.摸两张牌，此阶段不能使用或打出【杀】；2.摸一张牌；3.弃置一张牌，此阶段使用【杀】无距离限制且可以多使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹真","t":"子丹佳人","k":"魏","kh":4,"mh":4,"g":"男","s":[["司敌","结束阶段，你可以将一张非基本牌置于武将牌上，称为“司”。其他角色的出牌阶段开始时，你可以移去一张“司”，令其此阶段不能使用或打出与此“司”颜色相同的牌，此阶段结束时，若其没有使用过：【杀】，你视为对其使用一张【杀】；锦囊牌，你摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界曹植","t":"八斗之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["落英","当其他角色的♣牌因弃置或判定进入弃牌堆后，你可以获得之。",[]],["酒诗","当你需使用【酒】时，若你的武将牌正面朝上，你可以翻面视为使用一张【酒】；当你的武将牌背面朝上，你受到伤害时，你可以在伤害结算后翻面；当你使用【酒】后，你出牌阶段使用【杀】次数上限+1，直到你回合结束。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界陈群","t":"九品中正","k":"魏","kh":3,"mh":3,"g":"男","s":[["品第","出牌阶段每名角色限一次，你可以弃置一张本阶段未以此法弃置类型的牌并选择一名角色，令其摸X张牌或弃置X张牌（X为本回合此技能发动次数）。若其已受伤，横置或重置你的武将牌。",[]],["法恩","当一名角色的武将牌翻至正面朝上或横置后，你可以令其摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界杜畿","t":"卧镇京畿","k":"魏","kh":3,"mh":3,"g":"男","s":[["安东","当你受到其他角色造成的伤害时，你可以令伤害来源选择一项：1.防止此伤害，本回合弃牌阶段♥牌不计入手牌上限；2.观看其手牌，若其中有♥牌则你获得这些牌。若选择2且其没有手牌，则下一次发动时改为由你选择。",[]],["应势","出牌阶段开始时，你可以展示一张手牌并选择一名其他角色，然后令另一名角色对其使用一张【杀】（无距离限制）。若其使用了【杀】，则其获得你展示的牌；若此【杀】造成了伤害，则其再获得牌堆中所有与展示牌花色点数均相同的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界郭淮","t":"方策精详","k":"魏","kh":4,"mh":4,"g":"男","s":[["精策","结束阶段，若你本回合使用的牌数不小于体力值，你可以执行一个额外摸牌阶段或出牌阶段。若花色数也不小于体力值，则两项均执行。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界郭皇后","t":"月华驱霾","k":"魏","kh":3,"mh":3,"g":"女","s":[["矫诏","出牌阶段限一次，你可以展示一张手牌并选择一名距离最近的其他角色，该角色声明一种基本牌或普通锦囊牌的牌名，本回合你可以将此牌当声明的牌使用（不能指定自己为目标）。",[]],["殚心","当你受到伤害后，你可以摸一张牌并修改〖矫诏〗。第1次修改：将“一名距离最近的其他角色”改为“你”；第2次修改：删去“不能指定自己为目标”并将“出牌阶段限一次”改为“出牌阶段每种类型限声明一次”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界韩浩史涣","t":"禁卫军","k":"魏","kh":4,"mh":4,"g":"男","s":[["慎断","当你的黑色非锦囊牌因弃置而置入弃牌堆后，你可以将此牌当【兵粮寸断】使用（无距离限制）。",[]],["勇略","其他角色的判定阶段开始时，你可以弃置其判定区里的一张牌，然后若该角色：在你的攻击范围内，你摸一张牌；在你的攻击范围外，视为你对其使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界司马朗","t":"再世神农","k":"魏","kh":3,"mh":3,"g":"男","s":[["郡兵","一名角色的结束阶段，若其手牌数小于体力值，该角色可以摸一张牌并将所有手牌交给你，然后你可以将等量的牌交给其。",[]],["去疾","出牌阶段限一次，若你已受伤，你可以弃置X张牌，令至多X名已受伤的角色各回复1点体力（X为你已损失的体力值），然后其中仍受伤的角色各摸一张牌。若弃置的牌中包含黑色牌，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界王异","t":"忠贞礼节","k":"魏","kh":4,"mh":4,"g":"女","s":[["贞烈","当你成为其他角色使用【杀】或普通锦囊牌的目标后，你可以失去1点体力使此牌对你无效，然后你弃置其一张牌。",[]],["秘计","结束阶段，你可以摸X张牌（X为你已损失体力值），然后你可以将等量手牌分配给其他角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界文聘","t":"坚城宿将","k":"魏","kh":5,"mh":5,"g":"男","s":[["镇卫","当其他角色成为【杀】或黑色锦囊牌的唯一目标时，若该角色的体力值不大于你，你可以弃置一张牌并选择一项：1.摸一张牌，然后将此牌转移给你；2.令此牌无效，然后当前回合结束后，使用者获得此牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界荀攸","t":"曹魏的谋主","k":"魏","kh":3,"mh":3,"g":"男","s":[["奇策","出牌阶段限一次，你可以将所有的手牌当任意普通锦囊牌使用。",[]],["智愚","当你受到伤害后，你可以摸一张牌，然后展示所有手牌且伤害来源弃置一张手牌。若你的手牌颜色均相同，你获得其弃置的牌且下回合〖奇策〗可发动次数+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界于禁","t":"弗克其终","k":"魏","kh":4,"mh":4,"g":"男","s":[["镇军","准备阶段或结束阶段，你可以弃置一名角色X张牌（X为其手牌数减体力值且至少为1），若其中没有装备牌，你选择一项：1.弃置一张牌；2.该角色摸等量的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界张春华","t":"冷血皇后","k":"魏","kh":3,"mh":3,"g":"女","s":[["绝情","当你造成伤害时，你可以失去等量的体力，令伤害值翻倍。若如此做，此伤害结算结束后，你失去此技能，获得〖绝情〗。",[]],["伤逝","当你的手牌数小于你已损失的体力值时，你可以将手牌补至已损失体力值。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界钟会","t":"桀骜野心家","k":"魏","kh":4,"mh":4,"g":"男","s":[["权计","当你的牌被其他角色获得后或受到1点伤害后，你可以摸一张牌，然后将一张手牌置于武将牌上，称为“权”；每有一张“权”，你的手牌上限便+1。",[]],["自立","觉醒技，准备阶段，若“权”的数量不小于3，你回复1点体力并摸两张牌，然后减1点体力上限，获得技能〖排异〗。",["觉醒技"]],["排异","出牌阶段各限一次，你可以移去一张“权”并选择一项：1.令一名角色摸X张牌；2.对至多X名角色各造成1点伤害（X为“权”数且至少为1）。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界钟繇","t":"定陵侯","k":"魏","kh":3,"mh":3,"g":"男","s":[["活墨","当你需要使用基本牌时（每种牌名每回合限一次），你可以将一张黑色非基本牌置于牌堆顶，视为使用此基本牌。",[]],["佐定","当其他角色于其出牌阶段内使用♠牌指定目标后，若本阶段没有角色受到过伤害，你可以令其中一名目标角色摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界诸葛诞","t":"严毅威重","k":"魏","kh":4,"mh":4,"g":"男","s":[["功獒","锁定技，一名其他角色首次进入濒死状态时，你加1点体力上限，然后回复1点体力。",["锁定技"]],["举义","觉醒技，准备阶段，若你已受伤且体力上限大于存活角色数，你将手牌摸至体力上限，然后获得技能〖崩坏〗和〖威重〗。",["觉醒技"]],["崩坏","锁定技，结束阶段，若你不是体力值最小的角色，你选择：1.减1点体力上限；2.失去1点体力。",["锁定技","衍生技"]],["威重","锁定技，当你的体力上限变化后，你摸两张牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"经典曹操","t":"乱世的奸雄","k":"魏","kh":4,"mh":4,"g":"男","s":[["奸雄","当你受到伤害后，你可以摸一张牌，并获得造成伤害的牌。当你发动此技能后，摸牌数+1（至多为5）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蒯祺","t":"依云睦月","k":"魏","kh":3,"mh":3,"g":"男","s":[["良秀","出牌阶段，你可以弃置两张不同类型的牌，然后将两张与你弃置牌类别均不同的牌交给任意角色（每种类别每阶段限一次）。",[]],["殉节","每轮各限一次，每个回合结束时，若你本回合获得过手牌（摸牌阶段除外），你可以令一名角色将手牌/体力值调整至其体力值/手牌数。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐曹植","t":"漱律缀章","k":"魏","kh":3,"mh":3,"g":"男","s":[["赋乐","锁定技，你的初始手牌增加“赋”标记且不计入手牌上限。“赋”随机获得另一种非装备牌牌名，使用“赋”时可以选择使用该牌所拥有的任意一种牌名。",["锁定技"]],["文澜","你每使用或打出两张牌结算后：若为包含相同牌名的两张“赋”，你从牌堆中获得这两张“赋”中所含牌名的牌各一张，并标记为“赋”；否则你选择任意张手牌标记为“赋”或替换“赋”牌名。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐綝","t":"广昌亭侯","k":"魏","kh":4,"mh":4,"g":"男","s":[["破锐","每轮限一次，其他角色的结束阶段，你可以弃置一张牌并选择本回合失去过牌的另一名其他角色，视为对该角色依次使用X+1张【杀】，然后你交给其X张手牌。（X为其本回合失去的牌数且最多为5）",[]],["共护","锁定技，当你于回合外一回合失去超过一张基本牌后，〖破锐〗改为“每轮限两次”； 当你于回合外一回合造成或受到伤害超过1点伤害后，你删除〖破锐〗中交给牌的效果； 若以上两个效果均已触发，则你本局游戏使用红色基本牌无法响应，使用红色普通锦囊牌可以额外指定一个目标。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐进","t":"奋强突固","k":"魏","kh":4,"mh":4,"g":"男","s":[["骁果","其他角色的结束阶段，你可以弃置一张手牌。若如此做，该角色需弃置一张装备牌并令你摸一张牌，否则受到你对其造成的1点伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"李典","t":"深明大义","k":"魏","kh":3,"mh":3,"g":"男","s":[["恂恂","摸牌阶段开始时，你可以观看牌堆顶的四张牌，将其中两张牌以任意顺序置于牌堆顶，其余以任意顺序置于牌堆底。",[]],["忘隙","当你对其他角色造成1点伤害后，或当你受到其他角色造成的1点伤害后，若其存活，你可以摸两张牌，然后将一张牌交给该角色。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"令狐愚","t":"名愚性浚","k":"魏","kh":4,"mh":4,"g":"男","s":[["蓄志","出牌阶段限一次，你可以令两名角色同时选择至少一张手牌并交换这些牌，获得牌数较少的角色视为使用一张无距离限制的【杀】；若获得牌数相等，你摸两张牌，且可以对本阶段未以此法选择过的角色再发动〖蓄志〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘衿刘佩","t":"并蒂连枝","k":"魏","kh":3,"mh":3,"g":"女","s":[["契心","每回合限两次，当你不因此技能使用基本牌/一次摸两张牌时，你可以摸两张牌/使用一张基本牌。",[]],["纠思","每回合限一次，当你需要使用基本牌时，你可以翻面，视为使用一张基本牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘晔","t":"佐世之才","k":"魏","kh":3,"mh":3,"g":"男","s":[["破垣","游戏开始时或回合开始时，若你的装备区里没有【霹雳车】，你可以将【霹雳车】置入装备区；若有，你可以弃置一名其他角色至多两张牌。",[]],["画策","出牌阶段限一次，你可以将一张手牌当上一轮没有角色使用过的普通锦囊牌使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"刘桢","t":"妙绝时人","k":"魏","kh":3,"mh":3,"g":"男","s":[["五绝","你使用手牌结算完毕后，获得此牌名字数个“绝”标记，当“绝”的数量为5的倍数时，你移去所有“绝”，然后亮出牌堆顶的三张牌，你可以将其中牌名字数之和为5的任意张牌交给一名角色。",[]],["贞骨","你受到伤害后，你可以令一名角色随机从牌堆获得两张牌名字数不同的牌并将你的武将牌翻面，然后若你的翻面状态与伤害来源：不同，本轮〖五绝〗亮出的牌数+1（至多为5）；相同，你本回合无法响应其他角色使用的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"李婉","t":"才媛淑美","k":"魏","kh":3,"mh":3,"g":"女","s":[["联对","当你使用一张牌时，若上一张牌的使用者不为你，你可以令其摸两张牌；其他角色使用一张牌时，若上一张牌的使用者为你，其可以令你摸两张牌。",[]],["别君","其他角色出牌阶段限一次，其可以交给你一张手牌。当你每回合第一次受到伤害时，若你手牌中没有本回合以此法获得的牌，你可以翻面并防止此伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吕旷吕翔","t":"数合斩将","k":"魏","kh":4,"mh":4,"g":"男","s":[["数合","出牌阶段限一次，你可以展示一张手牌，并获得场上与展示牌相同点数的牌，令〖列侯〗额外摸牌数+1（至多为5）。若你没有因此获得牌，你需将展示牌交给一名其他角色。",[]],["列侯","锁定技，摸牌阶段，你额外摸一张牌，然后选择一项：1.弃置等量的牌；2.失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"吕虔","t":"恩威并诸","k":"魏","kh":4,"mh":4,"g":"男","s":[["威虏","锁定技，当你受到其他角色造成的伤害后，伤害来源在你下回合出牌阶段开始时失去体力至1，此阶段结束时其回复以此法失去的体力值。",["锁定技"]],["赠刀","限定技，出牌阶段，你可以将装备区内任意数量的牌置于一名其他角色的武将牌旁，该角色造成伤害时，移去一张“赠刀”牌，然后此伤害+1。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"马钧","t":"名巧天下","k":"魏","kh":3,"mh":3,"g":"男","s":[["工巧","出牌阶段限一次，你可以将一张手牌置入你的装备区（替换原装备，视为没有效果的“工巧”装备牌）。若你的装备区内有：基本牌，你使用基本牌的数值+1；锦囊牌，你每回合首次使用一种类别的牌后摸一张牌；装备牌，你的手牌上限+3。",[]],["精益","锁定技，当牌进入你的装备区后，你摸X张牌（X为你装备区里的牌数），然后弃置两张牌（每种副类别每回合限一次）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孟达","t":"据国向己","k":"魏","kh":4,"mh":4,"g":"男","s":[["利傍","出牌阶段限一次，你可以弃置一张牌，获得两名其他角色各一张牌并展示，然后你判定，若结果与这两张牌的颜色：均不同，你交给其中一名角色两张牌或失去1点体力；至少一张相同，你获得判定牌并视为对其中一名角色使用一张【杀】。",[]],["无节","锁定技，你使用的无色牌不计入次数且无距离限制；其他角色杀死你后不执行奖惩。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"莫琼树","t":"琼黛鬓墨雪","k":"魏","kh":3,"mh":3,"g":"女","s":[["宛蝉","出牌阶段限一次，你可以选择一名角色，令其摸X张牌（X为你与其距离且最多为3），然后其可以使用一张基本牌或普通锦囊牌（无距离次数限制），且目标相邻的角色也成为此牌的目标。",[]],["绛脂","当你成为基本牌或普通锦囊牌的目标后，若你不是唯一目标，你可以判定，若结果为：红色，你摸三张牌；黑色，你可以弃置一名其他角色至多两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋曹昂","t":"两全忠孝","k":"魏","kh":4,"mh":4,"g":"男","s":[["丰愍","锁定技，每回合限一次，当一名角色失去其装备区里的牌后，你摸其装备区空位数的牌。",["锁定技"]],["质亡","锁定技，结束阶段开始时，你弃置装备区里的所有牌。若你以此法弃置了牌，你选择弃牌堆里的一张伤害牌，令一名其他角色使用此牌（此牌对你造成的伤害视为无来源）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋曹洪","t":"奉令西迎","k":"魏","kh":4,"mh":4,"g":"男","s":[["迎驾","锁定技，你对其他角色使用牌后，本回合你计算与其距离视为1，然后若你与所有其他角色距离均为1，你可以获得一名其他角色所有手牌，然后交给其等量的牌（每名角色每回合限一次）。",["锁定技"]],["险拒","出牌阶段限一次，你可以获得攻击范围内所有角色各一张牌，若如此做，此阶段结束时，你弃置X张牌（X为你攻击范围外的其他角色数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋曹爽","t":"托孤傲臣","k":"魏","kh":4,"mh":4,"g":"男","s":[["渐专","锁定技，出牌阶段每项限一次，当你使用牌时，你选择一项：1.令一名其他角色弃置X张牌；2.摸X张牌；3.重铸X张牌；4.弃置X张牌（X为你此阶段发动此技能次数）。出牌阶段结束时，若所有选项于此阶段内都被选择过，随机删除一个选项。",["锁定技"]],["返势","觉醒技，结束阶段，若〖渐专〗的选项数小于2，你依次执行3次剩余项（X视为1），加2点体力上限并回复2点体力，失去〖渐专〗，获得〖覆斗〗。",["觉醒技"]],["覆斗","当你使用黑色牌指定其他角色为唯一目标后，若其本局游戏对你造成过伤害，你可以与其各失去1点体力；当你使用红色牌指定其他角色为唯一目标后，若其本局游戏没对你造成过伤害，你可以与其各摸一张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋程昱","t":"沐风知秋","k":"魏","kh":3,"mh":3,"g":"男","s":[["识诈","每回合限一次，有角色体力变化后，你可观看牌堆顶三张牌并选择其中一张牌获得并秘密记录此牌名，直至本轮结束该牌名牌被使用时移除记录牌名，你可令此牌无效。",[]],["告谏","出牌阶段限一次，你可令一名角色亮出牌堆顶一张牌，若为伤害牌其受到X点火焰伤害，若不为伤害牌，其选择一项执行：1.获得此牌并再次亮牌（次数不能超过存活人数）；2.直至其回合结束其攻击范围-X。（X为因此亮出的牌数）",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋邓艾","t":"奇锋厄川","k":"魏","kh":4,"mh":4,"g":"男","s":[["骤袭","出牌阶段限一次，你弃置所有当前无法指定其他角色目标的手牌，根据弃牌数依次选择等量项：1.本回合与其他角色距离-X；2.视为对至多X名角色使用【顺手牵羊】；3.视为对至多X名角色使用【杀】。若你执行了所有选项此技能视为未使用过（X为该项被选择的次序）。",[]],["恃矜","限定技，出牌阶段，若本回合你造成过伤害，你可以摸两张牌，直至你的下个回合开始前你受到伤害时防止此伤害并摸一张牌，你的下个回合开始时弃置所有【杀】与锦囊牌并失去等量体力，若你未因此流失体力此技能视为未发动过。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋典韦","t":"狂战怒莽","k":"魏","kh":4,"mh":5,"g":"男","s":[["狂战","出牌阶段限一次，你可以将手牌摸至体力上限并依次拼点X次（X为你以此法摸牌数），每次拼点若你：赢，你视为对所有本回合拼点未赢的其他角色使用一张【杀】；没赢，其视为对你使用一张【杀】。",[]],["亢勇","锁定技，回合开始时，你回复体力至体力上限；回合结束时，你失去等量体力（至多失去至1点）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋郭嘉","t":"翼谋奇佐","k":"魏","kh":3,"mh":3,"g":"男","s":[["先谋","转换技，游戏开始时可自选阴阳状态。一名角色的回合结束时，若你本回合失去过牌，你可以：阳，观看牌堆顶五张牌并获得其中至多X张牌，若获得牌数少于X，则你获得〖遗计〗直到你下次发动本项；阴，观看一名角色的手牌并弃置其中至多X张牌，若弃置牌数等于X，你进行一次【闪电】判定（X为你本回合失去过的牌数）。",["转换技"]],["论势","当你需要使用【无懈可击】抵消其他角色对除其外的角色使用的普通锦囊牌时，若你手牌中的红色和黑色牌数相等，你可以将一张手牌当不可被响应的【无懈可击】使用。",[]],["遗计","当你受到1点伤害后，你可以摸两张牌，然后你可以将至多两张手牌分配给其他角色。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋黄权","t":"智答魏诏","k":"魏","kh":3,"mh":3,"g":"男","s":[["巧对","每回合限一次，当你使用牌指定其他角色为目标后，你可以交给一名其他角色至多两张牌，令此牌额外结算一次；当你成为其他角色使用牌的目标后，你可以交给一名其他角色至多两张牌，令此牌无效。",[]],["推诚","锁定技，当你交给其他角色牌后，其需交给你等量张牌（不能是本回合你交给其的牌），否则你摸等量张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋胡烈","t":"暗舆平叛","k":"魏","kh":4,"mh":4,"g":"男","s":[["传舆","每轮开始时，你可以交给一名角色一张牌，称为“舆”。每当“舆”因使用进入弃牌堆后，你可以将之交给本轮未获得过“舆”的一名角色。每轮结束时，你可以令本轮所有获得过“舆”的角色依次视为对你指定的一名角色使用【杀】（无距离限制），然后弃置所有“舆”。",[]],["倚投","其他角色的出牌阶段开始时，若其手牌数为全场最多，你可以将所有手牌交给该角色，直到本回合结束，该角色造成伤害后，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋蒋干","t":"反笺沉江","k":"魏","kh":3,"mh":3,"g":"男","s":[["明访","回合开始时，你可以令一名其他角色展示一张手牌，此牌在其手牌中时，其受到的伤害+1。出牌阶段开始时，你可以与一名其他角色拼点，若你赢，你对其造成1点伤害，本回合结束阶段可以再次拼点；若你没赢，你摸一张牌并与其横置。",[]],["急辩","当你拼点时，你可以摸至多三张牌，若如此做，你本次拼点牌点数-X（X为你本次摸牌数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋蒋济","t":"策论万机","k":"魏","kh":3,"mh":3,"g":"男","s":[["势举","每名角色的出牌阶段限一次，其可以交给你一张牌，你可以使用此牌，然后其本回合攻击范围+X（X为你装备区内牌的数量），若此牌是装备牌或此牌造成了伤害，你与其各摸两张牌。",[]],["应时","当你使用普通锦囊牌指定目标后，你可以令其中一个目标选择一项：令此牌对其额外结算一次；弃置X张牌（X为你装备区内牌的数量+1），然后此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋司马师","t":"唯几成务","k":"魏","kh":3,"mh":3,"g":"男","s":[["散士","锁定技，游戏开始时，你将牌堆中每个点数的随机一张牌标记为“死士”牌。每个回合结束时，若本回合有“死士”牌不因你使用或打出而进入弃牌堆，你获得弃牌堆中的这些牌。你使用“死士”牌不能被响应。",["锁定技"]],["震扰","每回合每名角色限一次，当你使用牌指定其他角色为目标后，或当其他角色使用牌指定你为目标后，你可以选择手牌数大于你的其中一个目标或使用者，对其造成1点伤害。",[]],["沉略","限定技，出牌阶段，你可以从牌堆、弃牌堆、场上或其他角色的手牌中获得所有“死士”牌，此阶段结束时，将这些牌移出游戏直到你死亡。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋司马懿","t":"韬谋韫势","k":"魏","kh":3,"mh":3,"g":"男","s":[["平辽","锁定技，当你使用【杀】时，不公开指定的目标，你攻击范围内的角色依次选择是否打出一张红色基本牌，若此【杀】的目标未打出基本牌，其本回合无法使用或打出手牌；若有至少一名非目标打出基本牌，你摸两张牌且此阶段使用【杀】次数上限+1。",["锁定技"]],["权谋","转换技，游戏开始时可自选阴阳状态。出牌阶段每名角色限一次，你可以令攻击范围内的一名其他角色交给你一张牌，阳：防止你此阶段下次对其造成的伤害；阴：你此阶段下次对其造成伤害后，可以对至多三名该角色外的其他角色各造成1点伤害。",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋王凌","t":"风节格尚","k":"魏","kh":4,"mh":4,"g":"男","s":[["集筹","结束阶段，若你本回合使用的牌名均不同，你可以从弃牌堆中将这些牌交给你选择的角色各一张，然后摸X张牌（X为其中此前没有因此给出过的牌名张数）。",[]],["谋立","觉醒技，回合结束时，若你因〖集筹〗给出的牌名不同的牌超过5种，你加1点体力上限并回复1点体力，获得〖自缚〗。",["觉醒技"]],["自缚","锁定技，出牌阶段开始时，你将手牌摸至体力上限（至多摸至5张）。若你因此摸牌，你保留手牌中每种牌名的牌各一张，弃置其余的牌。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋卫瓘","t":"明识清允","k":"魏","kh":4,"mh":4,"g":"男","s":[["清势","你使用手牌结算完成后，若你手牌中没有【杀】，则你可以视为对本回合未受到伤害的一名其他角色使用一张【杀】（无距离限制）。若如此做，结束阶段，本回合因此受伤的角色可以对你使用一张【杀】。",[]],["造疾","当你受到伤害后，你可以摸三张牌，然后弃置其中的【杀】。当你造成伤害时，你可以弃置一张【杀】令此伤害+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋荀彧","t":"贞谋弼汉","k":"魏","kh":3,"mh":3,"g":"男","s":[["弼佐","限定技，一名角色回合结束时，若一号位角色体力值为全场最低，你可以令一名角色执行一个额外回合：此回合中除你与其以外的角色非锁定技失效；此回合结束时，你可以分配本回合所有不因弃置进入弃牌堆的牌。",["限定技"]],["势谋","转换技，游戏开始时可自选阴阳状态。出牌阶段限一次，你可以选择一名：阳：手牌数全场最少的角色；阴：手牌数全场最多的角色，其将手牌调整至体力上限（至多摸五张），然后你选择一张普通锦囊牌牌名和一个目标，视为其使用之。若因此摸牌，你可以为此牌额外指定一个目标；若因此弃牌，你可以令此牌额外结算一次。",["转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋钟会","t":"策诡凌云","k":"魏","kh":4,"mh":4,"g":"男","s":[["精练","每个回合结束时，若你本回合至少失去过两张牌，则你可以摸三张牌。若摸的牌里有装备牌或多目标锦囊牌，则你可以弃置之并对至多等量名其他角色各造成1点伤害。",[]],["挟术","每回合限一次，你使用牌指定其他角色为目标后，你可以令此牌对其中一个目标无效并获得其一张牌。",[]],["纵恣","觉醒技，你本局游戏已造成或受到共计至少3点伤害后，你加1点体力上限，回复1点体力，然后你选择一项：1.再增加1点体力上限，失去〖精练〗并获得〖矜祸〗；2.令〖挟术〗取消次数限制。",["觉醒技"]],["矜祸","你获得其他角色或其他角色获得你的牌时，你可以将手牌摸至体力上限。然后若你的手牌数比该角色多，其本回合非锁定技失效。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"牛金","t":"独进的兵胆","k":"魏","kh":4,"mh":4,"g":"男","s":[["摧锐","限定技，出牌阶段，你可以选择至多X名其他角色（X为你的体力值），获得这些角色各一张手牌。",["限定技"]],["裂围","每回合限X次（X为你的体力值，你的回合内无此限制），有角色进入濒死状态时，你可以摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"庞会","t":"临渭亭侯","k":"魏","kh":5,"mh":5,"g":"男","s":[["异勇","当你对其他角色造成伤害时，你可以与该角色同时弃置至少一张牌（该角色无牌则不弃）。若你弃置的牌的点数之和：不大于其，你摸X张牌（X为该角色弃置的牌数+1）；不小于其，此伤害+1。",[]],["夙仇","锁定技，出牌阶段开始时，你需选择一项：1.减1点体力上限或失去1点体力，你于此阶段内使用牌不能被响应；2.失去此技能。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"庞山民","t":"抱玉向晚","k":"魏","kh":3,"mh":3,"g":"男","s":[["才思","当你于回合内/回合外使用基本牌后，你可以从牌堆/弃牌堆随机获得一张非基本牌。每次发动该技能后，若发动次数：不大于体力上限：本回合下次获得牌张数翻倍；大于体力上限：本回合此技能失效。",[]],["擢吏","锁定技，每个回合结束时，若你本回合使用牌或获得牌的张数大于体力值，你加1点体力上限并回复1点体力（体力上限不能超过角色数）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"清河公主","t":"大魏长公主","k":"魏","kh":3,"mh":3,"g":"女","s":[["长姬","锁定技，一张牌指定包括你在内的多名角色为目标时，先结算对你产生的效果，然后你摸X张牌（X为剩余目标数）。",["锁定技"]],["谮构","出牌阶段限一次，你可以交给一名其他角色至多你体力上限张牌并摸等量的牌，若如此做，其下次回复体力或使用牌后展示所有手牌，每有一张“谮构”牌，其失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"秦朗","t":"跼高蹐厚","k":"魏","kh":4,"mh":4,"g":"男","s":[["昊宠","当你使用一张牌后，你可以将手牌调整至手牌上限（最多摸五张），然后若你以此法：获得牌，你的手牌上限-1；失去牌，你的手牌上限+1。",[]],["矜谨","每回合限两次，当你造成或受到伤害后，你可以将你的手牌上限重置为当前体力值。若如此做，伤害来源可以弃置至多X张牌（X为你因此变化的手牌上限数且至少为1），然后其每少弃置一张，你便摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"忍邓艾","t":"忍尤攘诟","k":"魏","kh":4,"mh":4,"g":"男","s":[["讷言","转换技，锁定技，你使用非装备牌时，阳：需弃置一张同类型牌令此牌额外结算一次，否则此牌无效；阴：此牌无次数限制。",["转换技","锁定技"]],["潜曜","限定技，回合开始时，你可以摸X张牌，视为使用一张【杀】且依次执行等量项：1.此【杀】目标+1；2.此【杀】伤害+1；3.此【杀】不可响应（X为当前轮数）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"任婉","t":"孤贞不徙","k":"魏","kh":3,"mh":3,"g":"女","s":[["狷急","出牌阶段每项限一次，你可以： 1.与一名其他角色各回复X点体力，然后对你与其各造成X点伤害； 2.弃置至多X名其他角色各一张牌，然后你翻面； 3.摸X张牌，然后弃置等量的牌。 （X为本回合发动此技能次数）",[]],["纫霜","锁定技，当你的体力值变为1后，复原你的武将牌，然后可以视为使用一张普通锦囊牌（每种牌名每轮限一次）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"阮籍","t":"命世大贤","k":"魏","kh":3,"mh":3,"g":"男","s":[["昭文","出牌阶段开始时，你可以展示所有手牌。若如此做，本回合其中的黑色牌可以当任意普通锦囊牌使用（每回合每种牌名限一次），其中的红色牌你使用时摸一张牌。",[]],["酒遁","你的【酒】状态改为获得一枚不会因回合结束而消失的“酒”标记。当你成为其他角色使用黑色牌的目标后，若你未处于【酒】状态，你可以摸一张牌并视为使用一张【酒】；若你处于【酒】状态，你可以弃置一张手牌令此牌对你无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"阮瑀","t":"斐章雅律","k":"魏","kh":3,"mh":3,"g":"男","s":[["兴作","出牌阶段开始时，你可以观看牌堆底的三张牌并用任意张手牌替换其中等量的牌。若如此做，结束阶段，你可以令一名有手牌的角色用所有手牌替换牌堆底的三张牌，然后若交换前该角色的手牌数大于3，你失去1点体力。",[]],["妙弦","每回合限一次，你可以将手牌中的唯一黑色牌当任意一张普通锦囊牌使用；当你使用手牌中的唯一红色牌时，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"司马孚","t":"仁孝忠德","k":"魏","kh":3,"mh":3,"g":"男","s":[["备预","出牌阶段限一次，你可以将手牌摸至体力上限，然后将一种花色的所有手牌以任意顺序置于牌堆底。",[]],["督持","每回合限一次，当你成为其他角色使用牌的目标后，你可以从牌堆底摸一张牌并展示所有手牌，若颜色均相同，此牌对你无效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"孙礼","t":"百炼公才","k":"魏","kh":4,"mh":4,"g":"男","s":[["伉厉","当你造成或受到伤害后，你可以摸两张牌，然后你下次造成伤害时弃置这些牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙资刘放","t":"谄陷负讥","k":"魏","kh":3,"mh":3,"g":"男","s":[["勤慎","弃牌阶段结束时，你可以摸X张牌（X为本回合没有进入过弃牌堆的花色数量）。",[]],["伪谠","其他角色的结束阶段，你可以将一张牌名字数为X的牌置于牌堆底，然后获得牌堆中一张牌名字数为X的牌（X为本回合没有进入过弃牌堆的花色数），能使用则使用之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"苏越","t":"秉笔东园","k":"魏","kh":3,"mh":3,"g":"男","s":[["宫图","游戏开始时，你可以依次指定两种类别；当连续两张被使用的牌的类别与你选择的顺序相同时，你可从牌堆随机获得两张不同点数的牌（点数由你选择）。",[]],["夯筑","出牌阶段限一次，你可以将至少一张牌置于你的武将牌上，称为“基”，然后令一名其他角色弃置所有这些点数的牌。若“基”中有重复点数，则弃置所有重复点数的“基”并摸等量张牌；若“基”包含13个点数，你可将所有“基”交给一名角色并令其回复体力至上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"唐咨","t":"工学之奇才","k":"魏","kh":4,"mh":4,"g":"男","s":[["兴棹","锁定技，场上受伤的角色为1个或以上，你获得〖恂恂〗；2个或以上，你装备区进入或离开牌时摸一张牌；3个或以上，你跳过判定和弃牌阶段；0个、4个或以上，你造成的伤害+1。",["锁定技"]],["恂恂","摸牌阶段开始时，你可以观看牌堆顶的四张牌，将其中两张牌以任意顺序置于牌堆顶，其余以任意顺序置于牌堆底。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"田尚衣","t":"婀娜盈珠袖","k":"魏","kh":3,"mh":3,"g":"女","s":[["婆娑","出牌阶段每种花色限一次，若你本阶段未对其他角色造成过伤害，你可以将一张手牌当此花色有的一张伤害牌使用。",[]],["绡刃","每回合限一次，当你造成伤害后，你可以判定，若结果为：红色，你可以选择一名角色，其回复1点体力，然后若其未受伤，其摸一张牌；黑色，对受伤角色的上家或下家造成1点伤害，然后你可以再次判定并执行对应结果直到有角色进入濒死状态。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王昶","t":"攥策及江","k":"魏","kh":3,"mh":3,"g":"男","s":[["开济","转换技，出牌阶段限一次，阳：你可以摸体力上限张数的牌；阴：你可以弃置至多体力上限张数的牌（至少一张）。",["转换技"]],["平袭","结束阶段，你可以选择至多X名其他角色（X为本回合因弃置而进入弃牌堆的牌数），弃置这些角色各一张牌（无牌则不弃），然后视为对这些角色各使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"王朗","t":"凤鹛","k":"魏","kh":3,"mh":3,"g":"男","s":[["鼓舌","出牌阶段，你可以用一张手牌与至多三名角色同时拼点，没赢的角色选择一项: 1.弃置一张牌；2.令你摸一张牌。若你没赢，获得一个“饶舌”标记；若你有7个“饶舌”标记，你死亡。当你一回合内累计七次拼点赢时（每有一个“饶舌”标记，此累计次数减1），本回合此技能失效。",[]],["激词","锁定技，当你的拼点牌亮出后，若此牌点数不大于X，则点数+X（X为“饶舌”标记的数量）且你获得本次拼点中点数最大的牌。你死亡时，杀死你的角色弃置7-X张牌并失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王双","t":"遏北的悍锋","k":"魏","kh":8,"mh":8,"g":"男","s":[["追猎","锁定技，你使用【杀】无距离限制；当你使用【杀】指定你攻击范围外的角色为目标后，此【杀】不计入次数且你进行一次判定，若结果为武器牌或坐骑牌，此【杀】伤害基数值增加至该角色的体力值，否则你失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王元姬","t":"素业谦冲","k":"魏","kh":3,"mh":3,"g":"女","s":[["识预","每轮限一次，其他角色的回合开始时，你可以秘密猜测每种类型的牌本回合内是否被该角色使用，此回合结束时，你每猜对一种，你获得其一张牌并防止其本轮下次对你造成的伤害；每猜错一种，你与其依次对对方造成1点伤害。若你全部猜对，本轮此技能可使用次数+1。",[]],["率俭","你的回合开始时和结束时，你可以选择一项执行：1.令手牌数最多的一名角色将手牌弃置至不为全场最多，然后你令一名角色摸弃牌数张牌；2.令装备区牌数最多的一名角色将装备区牌弃置至不为全场最多，然后你令一名角色回复弃牌数点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威曹操","t":"山海归心","k":"魏","kh":4,"mh":4,"g":"男","s":[["掇月","出牌阶段开始时，你可以进行至多三次拼点，你可令赢的角色摸X张牌（X为当前拼点次数）。若你赢，你可以改为对一名角色造成1点伤害并终止后续拼点。",[]],["军合","准备阶段，你可以展示任意张颜色或类别相同的牌并获得“军合”效果：你下X次（X为你展示的牌数+1）：造成伤害时，可弃置一张与所有展示牌颜色或类别均相同的牌，令此伤害+1；受到伤害后，摸两张牌。",[]],["雄威","你与魏势力角色拼点后，你获得其拼点牌，若如此做，且其没有“军合”效果，你可以将任意次“军合”效果转移给其。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威曹丕","t":"威泽四海都","k":"魏","kh":4,"mh":4,"g":"男","s":[["肃纲","出牌阶段开始时，你可以进行判定并获得生效后的判定牌，然后你选择至多两项： 1.本回合你可以将此牌当任意伤害牌使用； 2.展示一张手牌，本回合所有角色只能使用点数介于判定结果和展示牌之间的手牌； 3.本回合你获得〖行殇〗且〖典论〗的“等量”改为“两倍”。",[]],["典论","出牌阶段限一次，你可以弃置任意张点数之差相同的手牌，然后摸等量的牌，这些牌本回合不受〖肃纲〗限制且无距离次数限制。",[]],["极威","其他魏势力角色的出牌阶段限一次，其可以交给你一张手牌，然后你可以令其发动一次至多弃置3张牌的〖典论〗。",[]],["行殇","当一名角色受到伤害后（每回合限一次）或死亡时，则你获得两枚“颂”标记（你至多拥有9枚“颂”标记）；出牌阶段限两次，你可选择一名角色并移去至少一枚“颂”令其执行对应操作：2枚，复原武将牌或摸三张牌；3枚，回复1点体力并加1点体力上限，然后随机恢复一个已废除的装备栏（目标体力上限不大于9方可选择）；4枚，追思一名已阵亡的角色（你的武将牌上有〖行殇〗时方可选择此项），获得其武将牌上除主公技外的所有技能，然后你失去〖行殇〗、〖放逐〗、〖颂威〗。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威曹彰","t":"功武驰誉","k":"魏","kh":5,"mh":5,"g":"男","s":[["溃叛","连招技（装备牌+伤害牌），你可以令你与此牌的目标各失去1点体力，然后你摸已损失体力值张牌，此牌结算完毕后，你选择此牌的其中一个目标并令所有本回合获得过牌的角色依次选择是否视为对其使用此牌。",["连招技"]],["凝袍","出牌阶段限一次，你可以弃置至多两张牌，令任意名角色各摸等量张牌，直到你的下回合开始，这些角色每回合首次受到伤害时，你可以失去1点体力防止此伤害并发动此技能。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"魏讽","t":"趁浪逐波","k":"魏","kh":3,"mh":3,"g":"男","s":[["惑众","出牌阶段限两次，你可以展示一张手牌并选择攻击范围内任意名其他角色，这些角色依次选择一项：1.获得一名不为其与你的角色一张牌；2.交给你一张牌。然后手牌数最多的其他角色展示手牌并将所有与你展示牌类型相同的牌置入牌堆顶。",[]],["蛀国","锁定技，每回合限三次，牌堆牌数量增加后，你从牌堆底摸两张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"文钦","t":"困兽鸱张","k":"魏","kh":4,"mh":4,"g":"男","s":[["犷骜","你使用【杀】可以额外指定一个目标；其他角色使用【杀】可以额外指定你为目标（均有距离限制）。以此法使用的【杀】指定目标后，若你的手牌数为偶数，你摸一张牌，令此【杀】对任意名角色无效。",[]],["彗企","觉醒技，每个回合结束时，若本回合仅有包括你的三名角色成为过牌的目标，你获得〖偕举〗并执行一个额外的回合。",["觉醒技"]],["偕举","出牌阶段限一次，你可以选择令任意名本回合成为过牌的目标的角色，这些角色依次视为使用一张【杀】。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"文鸯","t":"万将披靡","k":"魏","kh":5,"mh":5,"g":"男","s":[["膂力","每名角色的回合限一次，当你造成伤害后，你可以将手牌摸至与体力值相同或将体力回复至与手牌数相同。",[]],["仇决","觉醒技，每名角色的回合结束时，若你的手牌数和体力值相差3或更多，你减1点体力上限并获得〖背水〗，然后修改〖膂力〗为“每名其他角色的回合限一次（在自己的回合限两次）”。",["觉醒技"]],["背水","觉醒技，准备阶段，若你的手牌数或体力值小于2，你减1点体力上限并获得〖清剿〗，然后修改〖膂力〗为“当你造成或受到伤害后”。",["觉醒技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吴质","t":"佐世佯悲","k":"魏","kh":3,"mh":3,"g":"男","s":[["伪涕","出牌阶段限两次，你可以选择一项令一名角色执行：1.受到1点伤害，然后摸两张与手牌点数均不同的牌；2.回复1点体力，然后弃置两张点数不同的牌。",[]],["圆融","回合结束时，令“圆融”牌为本回合到目前为止进入弃牌堆的牌，你先选择是否将其中一张黑色牌当任意普通锦囊牌使用，再选择是否将其中一张红色牌当任意基本牌使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯恩","t":"乌禾同仓","k":"魏","kh":5,"mh":5,"g":"男","s":[["持剑","锁定技，你出牌阶段可使用【杀】次数+1，若你装备区没有武器牌，你视为装备【青釭剑】。",["锁定技"]],["恃武","其他角色回合开始，你可视为对其使用【决斗】，若你对其造成伤害，你从牌堆中获得一张伤害牌，若其对你造成伤害，其获得〖持剑〗，你失去〖持剑〗直至其回合结束。杀死你的角色获得〖持剑〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯徽","t":"雅有识度","k":"魏","kh":3,"mh":3,"g":"女","s":[["笃君","游戏开始时，你选择一名其他角色： 你不能响应其使用的牌； 你与其每回合首次造成或受到伤害后，你可以摸两张牌，然后可以将这些牌交给一名角色。",[]],["济困","每当你失去五张牌后，你可以选择一名其他角色，令其随机获得每名手牌数最多的角色各一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯杰","t":"当阳虎胆","k":"魏","kh":5,"mh":5,"g":"男","s":[["裂胆","锁定技，其他角色的准备阶段，你的手牌数、体力值和装备区里的牌数每有一项大于该角色，便摸一张牌。若均大于其，你加1点体力上限（至多加至8）；若均不大于其，你失去1点体力并获得1枚“裂胆”标记。准备阶段，若“裂胆”标记不小于5，你死亡。",["锁定技"]],["壮胆","锁定技，其他角色的回合结束时，若你的手牌数为全场唯一最大，〖裂胆〗失效直到你的回合结束。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯令女","t":"女义如山","k":"魏","kh":4,"mh":4,"g":"女","s":[["浮萍","当其他角色以你为目标的基本牌或锦囊牌结算后，若你未记录此牌，你可以废除一个装备栏并记录此牌。你可以将一张非基本牌当记录的牌使用或打出（每种牌名每回合限一次）。若你的装备栏均已废除，你使用牌无距离限制。",[]],["炜烈","每局游戏限一次，出牌阶段，你可以弃置一张牌令一名角色回复1点体力，然后若其已受伤，其摸一张牌。你每次发动〖浮萍〗记录牌名时，此技能可发动次数+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"夏侯楙","t":"束甲之鸟","k":"魏","kh":4,"mh":4,"g":"男","s":[["统围","出牌阶段限一次，你可以指定一名其他角色并重铸两张牌。若如此做，其使用下一张牌结算后，若此牌点数介于你上次此法重铸牌点数之间，你视为对其使用一张【杀】或【过河拆桥】。",[]],["蹙国","锁定技，当你对一名角色使用的牌被抵消后，若你本回合未发动此技能，你须弃置一张牌，令你于此牌结算后视为对该角色使用一张牌名相同的牌，若此牌仍被抵消，你失去1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"夏侯玄","t":"玄隐山林","k":"魏","kh":3,"mh":3,"g":"男","s":[["博玄","当你使用指定其他角色为目标的不为延时类锦囊牌的手牌结算完毕后，你可以展示牌堆底三张牌，若其中有牌与你使用的牌： 牌名字数相同，你摸一张牌； 花色相同，你可以弃置一名其他角色的一张牌； 类别相同，你可以使用一张展示的牌。",[]],["议政","回合开始时，你可以与任意名其他角色同时展示一张手牌，若展示的牌类别均相同，你可以将这些牌交给一名角色，否则弃置这些牌。",[]],["归林","限定技，出牌阶段或当你进入濒死状态时，你可以回复体力至体力上限，然后失去〖议政〗、修改〖博玄〗（时机改为“当你使用指定角色为目标的手牌结算完毕后”）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星曹仁","t":"伏波四方","k":"魏","kh":4,"mh":4,"g":"男","s":[["肃军","当你使用一张牌时，若你手牌中基本牌与非基本牌数量相等，你可以摸两张牌。",[]],["砺锋","你可以将一张本回合未被使用过的颜色的手牌当不计次数的【杀】或【无懈可击】使用。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星荀彧","t":"怀忠念治","k":"魏","kh":3,"mh":3,"g":"男","s":[["安庶","每轮结束时，你可以将弃牌堆中牌名不同的基本牌各一张置于牌堆顶，然后视为使用一张【五谷丰登】，你选择从你或一名已受伤角色开始结算此【五谷丰登】。直到下轮结束，若有角色失去了因此【五谷丰登】选择的牌，当前回合结束时你可以令其将手牌摸至体力上限（最多摸至五张）。",[]],["匡祚","限定技，出牌阶段，你可以令一名角色获得技能〖承奉〗（若其为主公且没有主公技，则额外获得〖统荫〗），然后令另一名角色将每种花色各一张牌置于获得技能角色的武将牌上（称为“匡祚”牌）。",["限定技"]],["承奉","每回合限一次，你可以将一张红色“匡祚”牌当【闪】或黑色“匡祚”牌当【无懈可击】对即将对你生效的牌使用，此牌结算后，若“匡祚”不足两种颜色，你可以将牌堆顶一张牌置为“匡祚”。",["衍生技"]],["统荫","主公技，当你受到其他角色使用牌造成的伤害后，若伤害来源与你势力相同，你可以将造成伤害的牌置为“匡祚”；若与你势力不同，你可以将其一张牌置为“匡祚”。",["主公技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-星河璀璨","n":"星张春华","t":"皑雪皎月","k":"魏","kh":3,"mh":3,"g":"女","s":[["梁燕","出牌阶段限一次，你可以选择一名其他角色并选择：1.你摸一至两张牌，其弃置等量的牌，若你与其手牌数相同，你跳过下个弃牌阶段；2.你弃置一至两张牌，其摸等量的牌，若你与其手牌数相同，其跳过下个弃牌阶段。",[]],["明慧","一名角色的回合结束时，若你是手牌数最小的角色，你可以视为使用一张【杀】（无距离限制）。若你是手牌数最大的角色，你可以将手牌弃置至不为全场最多，令一名角色回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"辛毗","t":"一节肃六军","k":"魏","kh":3,"mh":3,"g":"男","s":[["持节","每回合每项各限一次，当其他角色使用牌对你生效时，你可以令此牌在接下来的结算中对其他角色无效；当其他角色使用牌结算结束后，若你是目标之一且此牌没有造成过伤害，你可以获得之。",[]],["引裾","限定技，出牌阶段，你可以选择一名其他角色。本回合：1.当你对其造成伤害时，改为令其回复等量的体力；2.当你使用牌指定该角色为目标后，你与其各摸一张牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"辛宪英","t":"忠鉴清识","k":"魏","kh":3,"mh":3,"g":"女","s":[["忠鉴","出牌阶段限一次，你可以秘密选择一名本回合未选择过的角色，并秘密选一项，直到你的下回合开始：1.当该角色下次造成伤害后，其弃置两张牌；2.当该角色下次受到伤害后，其摸两张牌。当〖忠鉴〗被触发时，你摸一张牌。",[]],["才识","摸牌阶段结束时，若你本阶段摸的牌：花色相同，本回合〖忠鉴〗改为“出牌阶段限两次”；花色不同，你可以回复1点体力，然后本回合你不能对自己使用牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"宣公主","t":"高陵翩蝶","k":"魏","kh":4,"mh":4,"g":"女","s":[["齐眉","出牌阶段限一次，你可以选择一名其他角色，你与其各摸两张牌并依次展示至多三张手牌，根据展示牌的花色数，你执行以下效果： 1，你可以依次使用这些牌； 2，你与其复原武将牌并各回复1点体力； 3，你与其重铸这些牌； 4，你与其各摸一张牌。",[]],["追姬","当你死亡后，你可以令一名角色从牌堆和弃牌堆中随机使用有空余栏位的装备牌，直至其装备区满，若如此做，当其失去以此法使用的装备牌后，废除对应的装备栏。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"薛灵芸","t":"霓裳缀红泪","k":"魏","kh":3,"mh":3,"g":"女","s":[["霞泪","当你的红色牌进入弃牌堆后，你可以观看牌堆顶三张牌，获得其中一张并可以将其余牌置于牌堆底，然后你本回合观看牌数-1。",[]],["暗织","出牌阶段，或当你受到伤害后，你可以判定，若结果为：红色，重置〖霞泪〗；黑色，你可以令一名非当前回合角色获得本回合进入弃牌堆的两张牌，然后此技能本回合失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"荀勖","t":"博律明识","k":"魏","kh":3,"mh":3,"g":"男","s":[["笛音","锁定技，你每失去七次牌后，你获得下一次进入弃牌堆的牌；当你受到伤害后，所有体力与你相同的角色各摸一张牌。",["锁定技"]],["博洽","每回合限一次，你可以将三张牌当一张基本牌或非伤害普通锦囊牌使用，若这三张牌的花色或类型均不同，此牌结算后你令一名角色将手牌调整至其体力上限，然后此技能可再次发动（每回合每种牌名限一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"荀彧荀攸","t":"谋定天下","k":"魏","kh":3,"mh":3,"g":"男","s":[["智囊","当你使用锦囊牌后，你可以获得一个技能台词包含“谋”的技能直到下次获得；当你使用装备牌后，你可以获得一个技能名包含“谋”的技能直到下次获得。",[]],["苟渚","当你失去技能后，若此技能为： 锁定技，你回复1点体力； 觉醒技，你获得一张基本牌； 限定技，你对随机一名其他角色造成1点伤害； 转换技，你的手牌上限+1； 主公技，你加1点体力上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"徐妏","t":"笔授魂赋","k":"魏","kh":3,"mh":3,"g":"女","s":[["赋绘","你可将两张手牌当作任意一张基本牌或普通锦囊牌使用（每种牌名每回合限一次），若两张手牌的花色组合为本回合首次，你摸一张牌。",[]],["摹画","每轮限一次，其他角色回合结束时，你可依序使用其出牌阶段使用的相同牌名的基本牌或普通锦囊牌（视为该角色使用），若此牌目标与其使用该牌时存在相同的目标，你摸此牌目标数的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"羊祜","t":"制纮同轨","k":"魏","kh":3,"mh":3,"g":"男","s":[["德劭","每回合限两次，当你成为其他角色使用黑色牌的目标后，你可以摸一张牌，然后若其手牌数不少于你，你弃置其一张牌。",[]],["明伐","每阶段限一次，当你于出牌阶段使用非转化的【杀】或普通锦囊牌结算完毕后，若你没有“明伐”牌，你可以将此牌置于武将牌上并选择一名其他角色。该角色的结束阶段，视为你对其使用X张“明伐”牌（X为其手牌数，最少为1，最多为5），然后移去“明伐”牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"羊徽瑜","t":"俪皇协运","k":"魏","kh":3,"mh":3,"g":"女","s":[["固请","出牌阶段限一次，你可以选择一名其他角色，其需将至多两张手牌交给另一名角色，每少交出一张牌，其失去1点体力，你回复1点体力。若其未交出牌，直到其下个回合结束之前，其当前所有手牌均视为【无懈可击】。",[]],["尊后","锁定技，当你成为牌的目标时，若没有与此牌点数相同的“尊后”，你从牌堆底将一张此点数的牌置于武将牌上（称为“尊后”），当你受到伤害时或你的回合结束时，你将所有“尊后”交给一名角色。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"杨修","t":"恃才放旷","k":"魏","kh":3,"mh":3,"g":"男","s":[["啖酪","当你成为【杀】或锦囊牌的目标后，若你不是唯一目标，你可以摸一张牌，然后此牌对你无效。",[]],["鸡肋","当你受到伤害后，你可以声明一种牌的类别，伤害来源不能使用、打出或弃置你声明的此类手牌直到其下回合开始。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"阎柔","t":"冠玉啸北","k":"魏","kh":4,"mh":4,"g":"男","s":[["仇讨","当你使用【杀】指定目标后，或当你成为【杀】的目标后，你可以弃置此【杀】使用者的一张牌，令此【杀】不能被抵消。若使用者为你，此【杀】不计入次数。",[]],["襄戍","限定技，结束阶段，若你本回合造成过伤害，你可以令一名已受伤角色回复X点体力并摸X张牌（X为你本回合造成的伤害值且最多为5）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"尹夫人","t":"委身允翕","k":"魏","kh":3,"mh":3,"g":"女","s":[["媵予","准备阶段，你可以展示两名角色的各一张手牌，若花色不同，则你选择其中一名角色获得另一名角色的展示牌。",[]],["拥嬖","限定技，出牌阶段，你可将所有手牌交给一名男性角色，然后〖媵予〗改为结束阶段也可以发动。根据其中牌的花色数量，你与其永久获得以下效果：至少两种，手牌上限+2；至少三种，受到大于1点的伤害时伤害-1。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"臧霸","t":"节度青徐","k":"魏","kh":4,"mh":4,"g":"男","s":[["横江","当你受到1点伤害后，你可以令当前回合角色本回合手牌上限-1，此回合结束时，若其本回合弃牌阶段：没有弃置牌，你摸X张牌（X为本回合你发动此技能次数）；弃置过牌，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张昌蒲","t":"矜严明训","k":"魏","kh":3,"mh":3,"g":"女","s":[["严教","出牌阶段限一次，你可以选择一名其他角色并亮出牌堆顶的四张牌，然后令该角色将这些牌分成点数之和相等的两组牌分配给你与其，剩余未分组的牌置入弃牌堆。若未分组的牌超过一张，你本回合手牌上限-1。",[]],["省身","当你受到伤害后，你可以摸一张牌并令下一次发动〖严教〗亮出的牌数+1。若你的手牌数为全场最少，则改为摸两张牌；若你的体力值为全场最少，则下一次发动〖严教〗亮出的牌数改为+2（加值总数至多为6）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张恭","t":"西域长歌","k":"魏","kh":3,"mh":3,"g":"男","s":[["遣信","出牌阶段限一次，若牌堆中没有“信”，你可以令所有角色同时选择一张手牌，并将此牌随机置入牌堆的上半部分，称为“信”。当你获得“信”时，你将手牌摸至四张，并可以令当前回合角色手牌上限-2。当其他角色获得“信”时，你摸一张牌。",[]],["镇行","结束阶段或当你受到伤害后，你可以观看牌堆顶三张牌，然后获得其中与其余牌花色均不同的一张牌，并将剩余的牌置于牌堆顶，称为“信”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"张虎","t":"晋阳侯","k":"魏","kh":4,"mh":4,"g":"男","s":[["摧坚","出牌阶段限一次，你可以选择一名有手牌的其他角色，若其手牌中有【闪】，其将所有【闪】和防具牌交给你，然后你交给其等量的牌。",[]],["同援","锁定技，当你使用红色锦囊牌后，〖摧坚〗增加效果“若其没有【闪】，你摸两张牌”； 当你使用或打出红色基本牌后，〖摧坚〗将“交给”的效果删除； 若以上两个效果均已触发，则你本局游戏使用红色普通锦囊牌无法被响应，使用红色基本牌可以额外指定一个目标。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵昂","t":"剜心筑城","k":"魏","kh":3,"mh":4,"g":"男","s":[["忠节","每轮限一次，当一名角色因失去体力而进入濒死状态时，你可以令其回复1点体力并摸一张牌。",[]],["夙守","一名角色的出牌阶段开始时，若其手牌数是全场唯一最多的，你可以失去1点体力并摸X张牌。若此时不是你的回合内，你观看当前回合角色一半数量的手牌（向下取整），你可以用至多X张手牌替换其中等量的牌。（X为你已损失的体力值）",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"赵俨","t":"扬历干功","k":"魏","kh":3,"mh":3,"g":"男","s":[["抚宁","当你使用一张牌时，你可以摸两张牌然后弃置X张牌（X为此技能本回合发动次数）。",[]],["秉纪","出牌阶段每种花色限一次，若你的手牌均为同一花色，则你可以展示所有手牌（至少一张），然后视为对一名其他角色使用一张【杀】（有距离限制且不计入次数）或一张【桃】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"郑浑","t":"民安寇灭","k":"魏","kh":3,"mh":3,"g":"男","s":[["强峙","出牌阶段限一次，你可以弃置你和一名其他角色共计三张牌。若有角色因此弃置三张牌，其对另一名角色造成1点伤害。",[]],["辟田","当你的牌因弃置而进入弃牌堆后或当你受到伤害后，你的手牌上限+1。结束阶段，若你的手牌数小于手牌上限，你可以将手牌摸至手牌上限（最多摸五张），然后重置因此技能而增加的手牌上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"钟毓","t":"智辩捷才","k":"魏","kh":3,"mh":3,"g":"男","s":[["智对","当你使用牌时，若与上一张被使用的牌：牌名字数和类别均相同，你可以选择一项：1.摸两张牌；2.此牌不计入次数限制；均不同，此技能本回合失效。",[]],["捷思","出牌阶段限一次，你可以获得一张指定牌名字数的牌，若本阶段未以此法获得过该牌名，你可以弃置此牌牌名字数张牌，令此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"周不疑","t":"幼有异才","k":"魏","kh":3,"mh":3,"g":"男","s":[["十计","一名角色的结束阶段，若其本回合未造成伤害，你可以声明一种普通锦囊牌（每轮每种牌名限一次），其可以将一张牌当你声明的牌使用（不能指定其为目标）。",[]],["四论","准备阶段或当你受到伤害后，你可以摸四张牌，然后将四张牌依次置于场上、牌堆顶或牌堆底，装备区的牌数因此变化的角色复原其武将牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"周宣","t":"夜华青乌","k":"魏","kh":3,"mh":3,"g":"男","s":[["寤寐","每轮限一次，回合开始前，你可以令一名角色执行一个额外的回合：该回合结束时，所有存活角色将体力值调整为此额外回合开始时的数值。",[]],["占梦","你使用牌时，可以执行以下一项（每回合每项各限一次）： 1.上一回合内，若没有同名牌被使用，你获得一张非伤害牌。 2.下一回合内，当同名牌首次被使用后，你获得一张伤害牌。 3.令一名其他角色弃置两张牌，若点数之和大于10，对其造成1点火焰伤害。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"诸葛梦雪","t":"仙苑停云","k":"魏","kh":3,"mh":3,"g":"女","s":[["寄春","出牌阶段各限一次，你可以展示一张牌，然后选择一项：1.将此牌交给一名手牌数小于你的角色，然后摸X张牌；2.弃置此牌，然后弃置一名手牌数大于你的角色区域里至多X张牌。（X为此牌的牌名字数）",[]],["寒英","准备阶段，你可以展示牌堆顶第一张装备牌，然后令一名手牌数等于你的角色使用之。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"诸葛若雪","t":"玉榭霑露","k":"魏","kh":3,"mh":3,"g":"女","s":[["琼英","出牌阶段限一次，你可以移动场上一张牌，然后你弃置一张同花色的手牌（若没有需展示手牌）。",[]],["暖惠","结束阶段，你可以选择一名角色，该角色可以视为使用X张基本牌（X为其装备区牌数且至少为1）。若其使用了同名牌，其弃置装备区所有牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"朱灵","t":"良将之亚","k":"魏","kh":4,"mh":4,"g":"男","s":[["战意","出牌阶段开始时，你可以弃置一种类别的所有牌，另外两种类别的牌获得以下效果直到你的下个回合开始： 基本牌，你使用基本牌无距离限制且造成的伤害和回复值+1； 锦囊牌，你使用锦囊牌时摸一张牌，你的锦囊牌不计入手牌上限； 装备牌，当装备牌置入你的装备区后，可以弃置一名其他角色的一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"朱铄","t":"醇浆遏斗","k":"魏","kh":4,"mh":4,"g":"男","s":[["疏和","每回合限一次，当其他角色使用伤害牌时，你可以从牌堆中获得一张【酒】（没有则摸一张牌），令其选择一项：1.此牌无效并视为使用一张【酒】，2.令你摸一张牌。",[]],["急烈","出牌阶段限一次，你可以弃置当前体力值张牌，弃置牌中每弃置一种花色进行两次判定，若结果为【杀】，你可以视为使用之，此【杀】伤害基数值为你本回合使用【杀】的次数。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"鲍三娘","t":"南中武娘","k":"蜀","kh":4,"mh":4,"g":"女","s":[["舞槊","当你使用【杀】或成为【杀】的目标后，你可以令此【杀】的使用者本回合攻击范围+1或-1。若此时其攻击范围： 小于1，你回复1点体力且此技能本回合失效； 等于1，你摸两张牌； 等于2，你从牌堆获得一张不计次数及手牌上限的【杀】； 等于3，你可以移动场上一张牌； 大于3，你对一名角色造成1点火焰伤害且此技能本回合失效。",[]],["和鸣","游戏开始时，你选择一名男性角色。每轮限一次，你发动〖舞槊〗结算后，若该角色与你攻击范围相同，你与其各摸两张牌并令其执行一次〖舞槊〗中对应攻击范围的效果。",[]]],"r":[]},{"p":"十周年","sp":"十周年-一将成名","n":"陈式","t":"裨将可期","k":"蜀","kh":4,"mh":4,"g":"男","s":[["擎北","每轮开始时，你可以选择任意种花色令你本轮无法使用，然后本轮你使用有花色的手牌后，摸本轮〖擎北〗选择过的花色数的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"陈祗","t":"朝野弄权","k":"蜀","kh":4,"mh":4,"g":"男","s":[["权势","转换技，你使用牌时可令此牌不可响应，阳：摸此牌名字数张牌，若此牌未造成伤害，此技能本回合失效；阴：弃此牌名字数张牌，若此牌造成伤害，此技能本回合失效。",["转换技"]],["仇隙","当你受到伤害后，你可以视为使用一张牌名字数至多为X的伤害牌。当你弃置手牌时，若弃置手牌数大于剩余手牌数，你随机获得一张牌名字数至多为X的伤害牌，此牌无次数限制（X为本轮此技能使用的次数）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"崔芷","t":"烈烛烬明","k":"蜀","kh":4,"mh":4,"g":"女","s":[["燃缕","有角色受到非属性伤害后，你可以选择一项执行并移除：1.横置或重置至多四名角色；2.摸三张牌；3.弃置一名角色两张牌。",[]],["绝殉","每回合限一次，你失去手牌后，若手牌数不为全场最多，你可以重置〖燃缕〗，然后可以对自己造成1点火焰伤害，若你的体力值不为全场最多，令处于横置状态的其他角色下次受到属性伤害+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"邓芝","t":"绝境的外交家","k":"蜀","kh":3,"mh":3,"g":"男","s":[["简亮","摸牌阶段开始时，若你的手牌数不为全场最多，你可以令至多两名角色各摸一张牌。",[]],["危盟","出牌阶段限一次，你可以获得一名其他角色至多X张手牌，然后交给其等量的牌（X为你的体力值）。若你给出的牌点数之和：大于获得的牌，你摸一张牌；小于获得的牌，你弃置其区域内一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"费祎","t":"宽济尽忠","k":"蜀","kh":3,"mh":3,"g":"男","s":[["谦素","其他角色的结束阶段，若其手牌数比你多，你可以摸三张牌，然后交给该角色其中一张牌。",[]],["兴邦","出牌阶段限一次，你可以摸一张牌并交给一名其他角色一张牌。然后你获得其一张手牌，若此牌：是你交给该角色的牌，视为对其使用一张【杀】；不是你交给该角色的牌，重复获得牌的流程（至多获得三张）。",[]],["泛祸","限定技，出牌阶段，你可以令〖兴邦〗改为“出牌阶段限三次”直到回合结束，然后你于此回合结束时失去3点体力。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"傅肜傅佥","t":"奕世忠义","k":"蜀","kh":4,"mh":6,"g":"男","s":[["血卫","结束阶段，你可以选择一名体力值不大于你的角色。直到你的下回合开始前，该角色受到伤害时，防止此伤害，然后你失去1点体力并与其各摸一张牌。",[]],["御关","每个回合结束时，若你是损失体力值最多的角色，你可以减1点体力上限，然后令至多X名角色将手牌摸至体力上限（X为你已损失的体力值）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"甘夫人","t":"昭烈皇后","k":"蜀","kh":3,"mh":3,"g":"女","s":[["淑慎","当你回复1点体力后，你可以选择一名其他角色，令其回复1点体力或与其各摸一张牌。",[]],["神智","准备阶段，若你手牌数大于体力值，你可以弃置一张手牌并回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"甘夫人糜夫人","t":"千里婵娟","k":"蜀","kh":3,"mh":3,"g":"女","s":[["婵娟","每种牌名限两次，你使用指定唯一目标的基本牌或普通锦囊牌结算完毕后，你可以视为使用一张同名牌，若目标完全相同，你摸一张牌。",[]],["殉别","限定技，当你进入濒死状态时，你可以将武将牌改为甘夫人或糜夫人，然后回复体力至1并防止你受到的伤害直到回合结束。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"高翔","t":"玄乡侯","k":"蜀","kh":4,"mh":4,"g":"男","s":[["驰应","出牌阶段限一次，你可以选择一名体力值不大于你的角色，其可以弃置其攻击范围内任意名其他角色各一张牌。若选择的角色不为你，其获得其中的基本牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"关宁","t":"承义秉文","k":"蜀","kh":3,"mh":3,"g":"男","s":[["修文","你使用一张牌时，若此牌名是你本局游戏第一次使用，你摸一张牌。",[]],["龙诵","出牌阶段开始时，你可以交给或随机获得一名其他角色一张红色牌，然后你本阶段获得一个“出牌阶段”的技能（优先获得该角色的技能，若未获得则改为随机获得一个技能池中的技能，只能发动一次）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"关索","t":"倜傥孑侠","k":"蜀","kh":4,"mh":4,"g":"男","s":[["征南","每名角色限一次，当一名角色进入濒死状态时，你可以回复1点体力，然后摸一张牌并选择获得下列技能中的一个：〖武圣〗〖当先〗〖制蛮〗（若均已获得，则改为摸三张牌）。",[]],["撷芳","锁定技，你计算与其他角色的距离-X（X为女性角色数）。",["锁定技"]],["武圣","你可以将一张红色牌当【杀】使用或打出。你使用♦【杀】无距离限制。",["衍生技"]],["当先","锁定技，回合开始时，你执行一个额外的出牌阶段，此阶段开始时你失去1点体力并从弃牌堆获得一张【杀】。",["锁定技","衍生技"]],["制蛮","当你对其他角色造成伤害时，你可以防止此伤害，然后获得其区域内一张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"关樾","t":"动心忍性","k":"蜀","kh":4,"mh":4,"g":"男","s":[["守执","锁定技，一名角色的回合结束时，若你的手牌数比回合开始时多，你弃置一张手牌；比回合开始时少，你摸两张牌。",["锁定技"]],["奋恚","限定技，出牌阶段，你可以令一名其他角色获得X枚“恨”（X为你对其使用牌的次数且至多为5），你摸等量的牌。当其受到伤害时，其移去一枚“恨”，此伤害+1；当其脱离濒死状态或其死亡时，若其有“恨”，你减1点体力上限，〖守执〗改为非锁定技并获得〖兴门〗。",["限定技"]],["兴门","当你因〖守执〗弃置手牌后，你可以回复1点体力。当你一次从牌堆获得超过一张牌后，这些牌不计次数且不能被响应。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"花鬘","t":"芳踪载馨","k":"蜀","kh":3,"mh":3,"g":"女","s":[["蛮裔","锁定技，【南蛮入侵】对你无效。",["锁定技"]],["蛮嗣","出牌阶段限一次，你可以将所有手牌当【南蛮入侵】使用；当一名角色受到【南蛮入侵】的伤害后，你摸一张牌。",[]],["薮影","每回合限一次，当你使用基本牌或普通锦囊牌指定其他角色为唯一目标后，若此牌不是本回合你对其使用的第一张牌，你可以弃置一张牌获得之；当其他角色使用基本牌或普通锦囊牌指定你为唯一目标后，若此牌不是本回合其对你使用的第一张牌，你可以弃置一张牌令此牌对你无效。",[]],["战缘","觉醒技，准备阶段，若你发动〖蛮嗣〗获得不少于七张牌，你加1点体力上限并回复1点体力。然后你可以选择一名男性角色，你与其获得技能〖系力〗，你失去技能〖蛮嗣〗。",["觉醒技"]],["系力","每回合限一次，其他拥有〖系力〗的角色于其回合内对没有〖系力〗的角色造成伤害时，你可以弃置一张牌令此伤害+1，然后你与其各摸两张牌。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"黄皓","t":"便辟佞慧","k":"蜀","kh":3,"mh":3,"g":"男","s":[["寝情","结束阶段，你可以弃置攻击范围内含有一号位的一名其他角色的一张牌，然后若其手牌数比一号位多，你摸一张牌。",[]],["贿生","当你受到其他角色造成的伤害时，你可以选择至少一张牌，令其观看并选择一项：1.获得其中一张，防止此伤害，然后你不能再对其发动此技能；2.弃置等量的牌。",[]],["存畏","锁定技，当你成为锦囊牌的目标后，若你：是此牌唯一目标，你摸一张牌；不是此牌唯一目标，你弃置一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"黄权","t":"忠事三朝","k":"蜀","kh":3,"mh":3,"g":"男","s":[["劝谏","出牌阶段每项限一次，你选择一项令一名其他角色选择是否执行：1.对一名其攻击范围内你指定的角色造成1点伤害；2.将手牌调整至手牌上限（最多摸到5张），其不能使用手牌直到回合结束。若其不执行，则其本回合下次受到的伤害+1。",[]],["途绝","限定技，当你处于濒死状态时，你可以将所有牌交给一名其他角色，然后你回复等量的体力并摸等量的牌。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"黄舞蝶","t":"刀弓双绝","k":"蜀","kh":4,"mh":4,"g":"女","s":[["双锐","准备阶段，你可以选择一名其他角色，视为对其使用一张【杀】。若其：不在你攻击范围内，此【杀】不可响应，你获得〖狩星〗直到回合结束；在你攻击范围内，此【杀】伤害+1，你获得〖铩雪〗直到回合结束。",[]],["伏械","出牌阶段，你可以弃置一张武器牌或失去一个其他技能，令一名其他角色弃置两张牌。",[]],["狩星","你可以将X张牌当一张不计次数的【杀】对一名攻击范围外的角色使用（X为你计算与该角色的距离）。",["衍生技"]],["铩雪","当你对其他角色造成伤害后，你可以摸两张牌，然后弃置X张牌（X为你计算与该角色的距离）。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"胡金定","t":"怀子求怜","k":"蜀","kh":3,"mh":6,"g":"女","s":[["德释","锁定技，当你受到【杀】造成的伤害时，若你已受伤，你防止此伤害并获得一张【杀】，然后减1点体力上限。",["锁定技"]],["武缘","出牌阶段限一次，你可以将一张【杀】交给一名其他角色，然后你回复1点体力并与其各摸一张牌；若此【杀】为：红色，其回复1点体力；属性【杀】，其多摸一张牌。",[]],["怀子","锁定技，你的手牌上限等于体力上限。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"霍峻","t":"坚磐石锐","k":"蜀","kh":4,"mh":4,"g":"男","s":[["孤扼","每名其他角色的回合内限一次，当你需要使用或打出【杀】或【闪】时，你可以：展示所有手牌，若其中【杀】和【闪】的总数小于2，视为你使用或打出之。",[]],["伺攻","其他角色的回合结束时，若其本回合内使用牌被响应过，你可以将手牌调整至一张，视为对其使用一张需要X张【闪】抵消且伤害+1的【杀】（X为你以此法弃置牌数且至少为1）。若此【杀】造成伤害，此技能本轮失效。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"蒋琬","t":"社稷之器","k":"蜀","kh":4,"mh":4,"g":"男","s":[["方整","准备阶段，若你手牌的花色数为偶数，你可以观看牌堆顶四张牌，并以任意顺序将这些牌置于牌堆顶或牌堆底；出牌阶段每个数字限一次，若你的手牌数为偶数，你使用下一张牌时可以令至多两名角色各摸两张牌，且因此摸的牌本回合不计入手牌上限。结束阶段，若你手牌的花色数为偶数，你随机获得弃牌堆中点数最大和最小的牌牌各一张。",[]],["举阵","你的回合外，其他角色对你使用的基本牌或普通锦囊牌结算完成后，若你的手牌数大于等于体力值，你可以将一张手牌当此牌对该角色使用，若其体力值因此变化，你回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"蒋琬费祎","t":"蜀汉名相","k":"蜀","kh":3,"mh":3,"g":"男","s":[["生息","结束阶段，若你于此回合内未造成过伤害，你可以摸两张牌。",[]],["守成","每回合限一次，当一名角色于其回合外失去最后的手牌后，你可以令其摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界法正","t":"恩怨分明","k":"蜀","kh":3,"mh":3,"g":"男","s":[["恩怨","当你得到一名其他角色至少两张牌后，你可以令其摸一张牌；当你受到1点伤害后，你可令伤害来源选择一项：2.交给你一张手牌，若不为♥，你摸一张牌；2.失去1点体力。",[]],["眩惑","摸牌阶段结束时，你可以交给一名其他角色两张手牌，并选择另一名其他角色，该角色选择一项：1.视为对后者使用任意一种【杀】或【决斗】，2.交给你所有手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界关平","t":"龙吟九霄","k":"蜀","kh":4,"mh":4,"g":"男","s":[["竭忠","限定技，出牌阶段开始时，你可以将手牌摸至体力上限。",["限定技"]],["龙吟","当一名角色于其出牌阶段使用【杀】时，你可以弃置一张牌令此【杀】不计入出牌阶段使用次数。若此【杀】为红色，你摸一张牌；若你弃置的牌点数与此【杀】相同，你重置〖竭忠〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界关兴张苞","t":"龙兄虎弟","k":"蜀","kh":4,"mh":4,"g":"男","s":[["父魂","你可以将两张手牌当【杀】使用或打出；当你于出牌阶段内以此法造成伤害后，本回合获得〖武圣〗和〖咆哮〗。",[]],["同心","锁定技，你的攻击范围+2。",["锁定技"]],["武圣","你可以将一张红色牌当【杀】使用或打出。你使用♦【杀】无距离限制。",["衍生技"]],["咆哮","锁定技，你使用【杀】无次数限制；当你使用的【杀】被抵消后，你本回合下次【杀】造成的伤害+1。",["锁定技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界简雍","t":"舌灿莲花","k":"蜀","kh":3,"mh":3,"g":"男","s":[["巧说","出牌阶段，你可以与一名角色拼点。若你赢，本回合你使用下一张基本牌或普通锦囊牌可以增加或减少一个目标（无距离限制）；若你没赢，你结束出牌阶段且本回合锦囊牌不计入手牌上限。",[]],["纵适","每当你拼点赢，你可以获得对方此次拼点的牌；每当你拼点没赢，你可以收回你此次拼点的牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界廖化","t":"历尽沧桑","k":"蜀","kh":4,"mh":4,"g":"男","s":[["当先","锁定技，回合开始时，你执行一个额外的出牌阶段，此阶段开始时你失去1点体力并从弃牌堆获得一张【杀】。",["锁定技"]],["伏枥","限定技，当你处于濒死状态时，你可以将体力回复至X点且手牌摸至X张（X为全场势力数），然后〖当先〗中失去体力的效果改为可选。若X不小于3，你翻面。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界刘谌","t":"北地王","k":"蜀","kh":4,"mh":4,"g":"男","s":[["战绝","出牌阶段，你可以将所有手牌（至少一张）当【决斗】使用，此【决斗】结算结束后，你和因此【决斗】受伤的角色各摸一张牌。若你本阶段因此至少摸过三张牌，本回合〖战绝〗失效。",[]],["勤王","主公技，出牌阶段限一次，你可以令其他蜀势力角色依次选择是否交给你一张【杀】，然后你可以令所有交给你【杀】的角色摸一张牌（以此法获得的【杀】于本回合不会被〖战绝〗使用）。",["主公技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界刘封","t":"先主假子","k":"蜀","kh":4,"mh":4,"g":"男","s":[["陷嗣","准备阶段，你可以将至多两名角色的各一张牌置于你的武将牌上，称为“逆”。当其他角色需要对你使用一张【杀】时，该角色可以移去你武将牌上的两张“逆”，视为对你使用一张【杀】。若“逆”超过你的体力值，你可以移去一张“逆”，视为使用一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界马岱","t":"出其不意","k":"蜀","kh":4,"mh":4,"g":"男","s":[["马术","锁定技，你与其他角色的距离-1。",["锁定技"]],["潜袭","准备阶段，你可以摸一张牌并弃置一张牌，然后选择一名距离为1的其他角色，本回合：其不能使用或打出与你弃置的牌颜色相同的手牌；你无视其装备区里与你弃置的牌颜色相同的防具；该角色回复体力时，你摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界马谡","t":"街亭之殇","k":"蜀","kh":3,"mh":3,"g":"男","s":[["散谣","出牌阶段限一次，你可以弃置任意张牌，然后对体力值最多的等量名其他角色造成1点伤害。",[]],["制蛮","当你对其他角色造成伤害时，你可以防止此伤害，然后获得其区域内一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"界马忠","t":"笑合南中","k":"蜀","kh":4,"mh":4,"g":"男","s":[["抚蛮","出牌阶段每名角色限一次，你可以弃置一张牌，令一名角色从弃牌堆中获得一张【杀】，然后其于其回合结束前失去此【杀】时，其摸一张牌。若为因使用或打出而失去，你摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界吴懿","t":"奔袭千里","k":"蜀","kh":4,"mh":4,"g":"男","s":[["奔袭","锁定技，当你于回合内使用牌时，本回合你计算与其他角色距离-1；你的回合内，若你与所有其他角色的距离均为1，你使用仅指定一个目标的【杀】或普通锦囊牌时，依次选择至多两项：1.为此牌额外指定一个目标；2.此牌无视防具；3.此牌不能被抵消；4.此牌造成伤害时，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界夏侯氏","t":"燕语呢喃","k":"蜀","kh":3,"mh":3,"g":"女","s":[["樵拾","其他角色的结束阶段，若其手牌数等于你，你可以与其各摸一张牌，若这两张牌花色相同，你可以重复此流程。",[]],["燕语","出牌阶段，你可以重铸【杀】；出牌阶段结束时，你可以令一名男性角色摸X张牌（X为你此阶段因此重铸的【杀】数，至多为3）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界徐庶","t":"折节学问","k":"蜀","kh":4,"mh":4,"g":"男","s":[["诛害","其他角色的结束阶段，若其本回合造成过伤害，你可以将一张手牌当【杀】或【过河拆桥】对其使用（无距离限制）。",[]],["潜心","觉醒技，当你造成伤害后，若你已受伤，你减1点体力上限，获得〖荐言〗。",["觉醒技"]],["荐言","出牌阶段各限一次，你可以声明一种牌的类别或颜色，亮出牌堆中第一张符合你声明的牌，交给一名男性角色。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界张松","t":"博学强识","k":"蜀","kh":3,"mh":3,"g":"男","s":[["强识","出牌阶段开始时，你可以展示一名其他角色的一张手牌，当你于此阶段内使用与此牌类别相同的牌时，你可以摸一张牌。",[]],["献图","其他角色出牌阶段开始时，你可以摸两张牌，然后将两张牌交给该角色。若如此做，此阶段结束时，若其于此阶段内没有造成过伤害，你失去1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界张嶷","t":"无当飞军","k":"蜀","kh":5,"mh":5,"g":"男","s":[["怃戎","出牌阶段限一次，你可以与一名其他角色同时展示一张手牌：若你展示的是【杀】且该角色不是【闪】，你对其造成1点伤害；你展示的不是【杀】且该角色是【闪】，你获得其一张牌。",[]],["矢志","锁定技，若你的体力值为1，你的【闪】视为【杀】；当你使用这些【杀】造成伤害后，你回复1点体力。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-界一将成名","n":"界周仓","t":"忠勇当先","k":"蜀","kh":4,"mh":4,"g":"男","s":[["忠勇","当你使用【杀】结算结束后，你可以将此【杀】和响应此【杀】的【闪】交给另一名其他角色，然后若你交给的牌中包含：红色牌，其可以对你攻击范围内的一名角色使用一张【杀】；黑色牌，其摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"经典刘备","t":"乱世的枭雄","k":"蜀","kh":4,"mh":4,"g":"男","s":[["仁德","出牌阶段每名其他角色限一次，你可以获得一名其他角色两张手牌，然后视为使用一张基本牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"雷铜","t":"石铠之鼋","k":"蜀","kh":4,"mh":4,"g":"男","s":[["溃击","出牌阶段限一次，你可以将一张黑色基本牌当【兵粮寸断】对你使用，然后摸一张牌。若如此做，你可以对体力值最大的一名其他角色造成2点伤害。该角色因此进入濒死状态时，你可以令另一名体力值最少的角色回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"乐诸葛果","t":"玉笛朝真","k":"蜀","kh":3,"mh":3,"g":"女","s":[["羲笛","锁定技，游戏开始时，你的初始手牌增加“笛”标记且不计入手牌上限。准备阶段和结束阶段，你观看牌堆顶的X张牌（X为你的“笛”数，至少为1至多为8），以任意顺序置于牌堆顶或牌堆底。",["锁定技"]],["乘烟","你使用【杀】或普通锦囊牌指定其他角色为目标后，可以摸一张牌并展示。 若展示牌为【杀】或普通锦囊牌，将使用牌的效果改为展示牌的效果；否则摸一张牌并标记为“笛”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李丰","t":"继责尽任","k":"蜀","kh":3,"mh":3,"g":"男","s":[["囤储","锁定技，游戏开始时，你将手牌摸至等同于游戏人数四倍；你不能弃置或被弃置手牌；准备阶段，若你的手牌数大于体力值，则你本回合只能使用三张牌。",["锁定技"]],["输粮","每个回合结束时，你可以交给任意名没有手牌的其他角色各一张牌。若此牌可指定该角色自己为目标，则其可以使用此牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘巴","t":"清尚之节","k":"蜀","kh":3,"mh":3,"g":"男","s":[["铸币","当♦牌因弃置而进入弃牌堆后，你可以从牌堆或弃牌堆将一张【无中生有】置于牌堆顶。",[]],["流转","锁定技，其他角色的回合内，其于摸牌阶段外获得的牌无法对你使用，这些牌本回合进入弃牌堆后，你获得之。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘理","t":"安平王","k":"蜀","kh":3,"mh":3,"g":"男","s":[["抚黎","出牌阶段限一次，你可以展示所有手牌，弃置其中一种类别的牌，然后摸X张牌（X为以此法弃置的牌名字数之和，至多为场上手牌最多的角色的手牌数），然后你可以令一名角色攻击范围-1直到你下回合开始。若以此法弃置了伤害牌，则改为其攻击范围减至0直到你下回合开始。",[]],["德化","锁定技，每轮开始时，你视为使用一张伤害牌，然后你不能从手牌中使用此牌名的牌；你的手牌上限增加以此法使用过的牌名数。若所有伤害牌均被选择过，你失去此技能，本局游戏伤害牌不计入你的手牌上限。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"刘盼兮","t":"慧心识味","k":"蜀","kh":4,"mh":4,"g":"女","s":[["寻香","每回合每种花色各限一次，当你使用的牌结算结束后，你可以观看牌堆顶的四张牌，获得其中与使用的牌花色相同的牌。每回合你使用过的牌花色数达到2时，此技能观看牌数+1（至多+3）。",[]],["制肴","出牌阶段限一次，你可以弃置至多五张牌并进行等量次判定，若弃置牌中含有【桃】、【酒】、【顺手牵羊】、【五谷丰登】、坐骑牌，每有一张额外判定一次，若结果为：♦，你对一名角色造成1点火焰伤害；♠，你令一名角色随机弃置两张牌；♣，你令一名角色获得此判定牌且使用无次数限制；♥，你令一名角色回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"柳婒","t":"维情所止","k":"蜀","kh":3,"mh":3,"g":"女","s":[["经音","每回合限一次，当一名角色于其回合外使用的【杀】进入弃牌堆后，你可以令除其以外的一名角色获得之，且使用时无次数限制。",[]],["迟行","一名角色的出牌阶段结束时，若此阶段有【杀】进入弃牌堆，你可以摸等量的牌，然后你可以使用摸到的一张【杀】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘璿","t":"依劝移行","k":"蜀","kh":4,"mh":4,"g":"男","s":[["漠规","你的回合内，可以执行以下选项并移除： 1.判定阶段开始时，令一名角色回复1点体力并弃置判定区所有牌； 2.摸牌阶段开始时，令一名角色摸牌阶段摸牌数+1，出牌阶段使用【杀】次数+1； 3.弃牌阶段开始时弃置至多五张牌，令一名角色手牌上限+1并摸等量张牌。",[]],["遵谏","觉醒技，回合开始时，若你已移除〖漠规〗所有选项，你回复1点体力并选择一项：1.摸两张牌并重置〖漠规〗；2.再回复1点体力，然后失去〖漠规〗并修改〖仁诚〗。",["觉醒技"]],["仁诚","出牌阶段限一次，你可以摸两张牌，然后你可以交给一名其他角色至多两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"刘永","t":"甘陵王","k":"蜀","kh":3,"mh":3,"g":"男","s":[["诛佞","出牌阶段限一次，你可以交给一名其他角色任意张牌，这些牌标记为“隙”，然后你可以视为使用一张不计次数的【杀】或伤害类锦囊牌，然后若此牌没有造成伤害，此技能本阶段改为“出牌阶段限两次”。",[]],["封乡","锁定技，当你受到伤害后，手牌中“隙”唯一最多的角色回复1点体力（没有唯一最多的角色则改为你摸一张牌）；当有角色因手牌数改变而使“隙”唯一最多的角色改变后，你摸一张牌。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"李娴","t":"义忠烈妇","k":"蜀","kh":4,"mh":4,"g":"女","s":[["斥怠","每轮限三次，一名角色的回合开始时，若其手牌数小于体力值，你可以令其回复1点体力并摸X张牌；若其手牌数大于体力值，你可以随机获得其X张手牌；若其手牌数等于体力值，你可以摸两张牌（X为其手牌数与体力值之差，且至多为5）。",[]],["缢节","每回合限两次，其他角色获得你的牌后，你可以失去1点体力并弃置这些牌；你获得其他角色的牌后，你可以弃置这些牌并回复1点体力。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"李昭仪","t":"贞骨陨玉","k":"蜀","kh":3,"mh":3,"g":"女","s":[["明节","游戏开始，你选择一名其他角色，你与其获得对方因为弃牌阶段弃置的牌，你或其的阶段被跳过时各摸两张牌并可以令对方防止下次受到的伤害。所选角色阵亡时，你立即阵亡。",[]],["娴辅","每回合限一次，当你成为牌目标时，你可以跳过你下回合的除准备阶段和结束阶段外的一个阶段令此牌对你无效，然后你与“明节”角色互相观看手牌并各可以获得对方的至多三张手牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-测试服","n":"罗宪","t":"忠烈果毅","k":"蜀","kh":5,"mh":5,"g":"男","s":[["析势","每轮开始时，你可以选择一名其他角色，你观看并选择其一张手牌，其可以选择弃置任意张手牌，若未弃置你选择的牌，其弃置此牌，且本轮你受到伤害后可以发动〖析势〗；若弃置你选择的牌，其摸一张牌。",[]],["倾守","每轮限三次，有牌被弃置时，若你手牌中有同名牌，你可以令一名角色摸一张牌，此牌不计入手牌上限。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吕凯","t":"铁心司南","k":"蜀","kh":3,"mh":3,"g":"男","s":[["图南","出牌阶段限一次，你可以令一名其他角色观看牌堆顶一张牌，然后该角色选择一项：1.使用此牌（无距离限制）；2.将此牌当【杀】使用。",[]],["闭境","结束阶段，你可以选择至多两张手牌标记为“闭境”。若你于回合外失去“闭境”牌，当前回合角色的弃牌阶段开始时，其需弃置两张牌。准备阶段，你重铸手牌中的“闭境”牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马伶俐","t":"火树银花","k":"蜀","kh":3,"mh":3,"g":"女","s":[["骊马","锁定技，场上每有一张坐骑牌，你计算与其他角色的距离-1（至少为1）。",["锁定技"]],["硝引","准备阶段，你可以亮出牌堆顶X张牌（X为你距离1以内的角色数），获得其中红色牌，将其中任意张黑色牌作为“硝引”放置在等量名座次连续（不计入你的座位）的其他角色的武将牌上。 有“硝引”牌的角色受到伤害时：若为火焰伤害，伤害来源可以弃置一张与“硝引”同类别的牌并随机移去一张此类别的“硝引”牌令此伤害+1；不为火焰伤害，伤害来源可以获得其一张“硝引”牌并将此伤害改为火焰伤害。",[]],["花火","出牌阶段限一次，你可以将一张红色手牌当无次数限制的【杀】使用。若目标有“硝引”牌，此【杀】可改为指定所有有“硝引”牌的角色为目标。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"马邈","t":"退路自有","k":"蜀","kh":4,"mh":4,"g":"男","s":[["仗关","每个回合开始时，你可以将手牌数调整至体力值，若你的手牌数没有因此变多，你回复1点体力，然后获得当前回合角色一张牌。",[]],["从风","你/其他角色不因此技能获得其他角色/你的牌后，可以再随机获得一张。",[]]],"r":[]},{"p":"十周年","sp":"十周年-星火燎原","n":"马云騄","t":"关山凤吟","k":"蜀","kh":4,"mh":4,"g":"女","s":[["凤魄","当你于回合内首次使用【杀】或【决斗】指定唯一目标后，你可以选择一项：1.摸X张牌，此牌伤害+1；2.摸一张牌，此牌伤害+X（X为其♦牌数）。",[]],["马术","锁定技，你与其他角色的距离-1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"糜芳傅士仁","t":"进退维谷","k":"蜀","kh":4,"mh":4,"g":"男","s":[["锋势","当你使用牌指定目标后，若有目标角色的手牌数小于你，你可以弃置你与其各一张牌，然后此牌对其伤害+1；当你成为其他角色使用牌的目标后，若你的手牌数小于其，你可以弃置你与其各一张牌，然后此牌对你伤害+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"糜夫人","t":"乱世沉香","k":"蜀","kh":3,"mh":3,"g":"女","s":[["闺秀","锁定技，你的第一个回合开始时，你摸两张牌；当你发动〖存嗣〗后，你回复1点体力。",["锁定技"]],["存嗣","限定技，出牌阶段，你可以令一名角色获得〖勇决〗；若不为你，你摸两张牌。",["限定技"]],["勇决","当你于出牌阶段内使用第一张【杀】时，你可以令其不计入使用次数或获得之。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"名将吴懿","t":"五一名将","k":"蜀","kh":4,"mh":4,"g":"男","s":[["奔袭","锁定技，转换技，当你失去手牌后，阳：随机念一句含有wuyi的技能台词；阴：获得你上次以此法念出台词的技能直到你下回合开始，若已拥有则改为对一名角色造成1点伤害。",["锁定技","转换技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋法正","t":"洞人识心","k":"蜀","kh":3,"mh":3,"g":"男","s":[["缜鉴","每轮开始时，你可以选择一名其他角色并秘密选择一种普通锦囊牌名，本轮内其使用普通锦囊牌时，若与你选择的牌名：不同，你可以令此牌增加或减少一个目标（目标数至少为1）；相同，你摸一张牌，此技能本回合失效。",[]],["悉性","出牌阶段限一次，你可以观看一名其他角色的手牌并获得其中一张牌，然后若你使用的下一张牌对其造成伤害，此技能视为未发动过。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋关平","t":"百战烈烈","k":"蜀","kh":4,"mh":4,"g":"男","s":[["武威","出牌阶段限一次，你可以将一种颜色的所有手牌当【杀】使用（无距离次数限制）并依次选择X次（X为用于转化的类别数）：1.摸一张牌；2.目标角色本回合非锁定技失效；3.此技能本回合可发动次数+1。若执行了所有项，此【杀】伤害+1。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋关羽","t":"单刀赴会","k":"蜀","kh":4,"mh":4,"g":"男","s":[["冠武","锁定技，回合开始时，你从场上、弃牌堆或牌堆中获得【青龙偃月刀】。本轮你每使用两张【杀】，你本轮使用的【杀】伤害+1。",["锁定技"]],["威势","每回合每项限一次，1.你成为其他角色非伤害牌目标后，你可以弃置半数手牌（向上取整），令此牌对你无效；2.你成为其他角色伤害牌目标结算后，你可以摸两张牌，并可以对其使用一张【杀】。",[]],["倨傲","出牌阶段限一次，你可以弃置一张牌，视为对攻击范围内任意名其他角色使用一张【杀】或普通锦囊牌，若如此做，此牌目标下次使用【杀】或普通锦囊牌必须指定你为目标，且无距离次数限制。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋姜维","t":"锲谋昭汉","k":"蜀","kh":3,"mh":4,"g":"男","s":[["绝谋","转换技，游戏开始时可自选阴阳状态。当你使用锦囊牌时，你可以：阳：对自己造成1点伤害并摸已损失体力值张数的牌；阴：令一名角色弃置另一名角色一张牌并受到其造成的1点伤害。若你因此技能的伤害进入濒死状态，你回复体力值至1点。",["转换技"]],["复盏","限定技，当一名角色脱离濒死状态时，你可以回复体力至体力上限，修改〖绝谋〗（增加时机“回合开始时或结束时”）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋马谡","t":"服心屈兵","k":"蜀","kh":4,"mh":4,"g":"男","s":[["呈策","每轮开始时，你可以观看牌堆顶两张牌并用任意张手牌替换其中等量牌，然后你令一名其他角色观看牌堆顶两张牌并获得其中一张。若其获得的牌为非伤害牌，你获得三张非伤害牌，其获得〖心战〗直到本轮结束；若其获得的牌为伤害牌，你获得三张伤害牌，其随机三张非伤害手牌视为【杀】直到本轮结束。",[]],["心战","你每回合首次使用【杀】或普通锦囊牌指定其他角色为唯一目标时，你可以猜测此牌是否被响应（每回合各一次）。此牌结算完毕后，若你猜对，观看此牌目标的手牌并获得其中一张；若你猜错，其视为对你使用【决斗】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋庞统","t":"机谋辟业","k":"蜀","kh":3,"mh":3,"g":"男","s":[["寅谋","转换技，游戏开始时可自选阴阳状态。每个回合结束时，若本回合有角色失去手牌数不小于当前手牌数，你可以观看牌堆顶三张牌并交给其中一名角色一张牌，此牌离开其手牌区后，阳：摸当前体力值张牌（至多摸五张）；阴：弃置当前体力值张手牌。",["转换技"]],["宏策","首轮开始时，你令一名角色选择一项执行： 1.将一半手牌替换为伤害牌，并视为使用一张【杀】； 2.重铸一张手牌，视为使用一张单目标普通锦囊牌； 3.摸三张牌，这些牌不计入手牌上限。 然后你修改此技能为“出牌阶段限一次，你可以令一名角色执行首轮开始时被选择的选项”。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋王平","t":"佯败溯战","k":"蜀","kh":5,"mh":5,"g":"男","s":[["诱夷","每回合每项限一次，你成为其他角色使用牌的目标时，你可以令其本阶段使用【杀】次数上限+1，然后你选择一项执行：1.弃置任意张牌并摸一张牌，本回合结束时摸等量张牌；2.失去至多4点体力并令一名角色摸等量张牌，本回合结束时回复以此法失去的体力。",[]],["返攻","限定技，出牌阶段，你可以回复体力至体力上限并摸五张牌。你因〖诱夷〗失去的体力值和牌数的总和每累计达到7后，此技能视为未发动过。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋吴懿","t":"恤下媲子","k":"蜀","kh":4,"mh":4,"g":"男","s":[["识变","每轮开始时，你可以选择一名其他角色，本轮其攻击范围内的角色视为在你的攻击范围内，且你使用【杀】和普通锦囊牌可以指定其攻击范围内的一名角色为额外目标。",[]],["庇部","你的上家和下家每回合首次成为其他角色使用的【杀】或普通锦囊牌的唯一目标时，你可以摸一张牌，令此牌的目标改为你；你的上家和下家每回合首次使用【杀】或普通锦囊牌结算结束后，你可以摸一张牌，然后可以视为使用此牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-谋","n":"谋诸葛亮","t":"威谋定疆","k":"蜀","kh":4,"mh":4,"g":"男","s":[["靖谋","转换技，游戏开始时你可自选阴阳状态。任意角色出牌阶段开始时，若你没有记录的花色或牌类别，你可以弃置任意张牌并秘密记录其中至多三种包含的花色或牌类别。当一名角色使用与记录的花色或类别相同的牌时，移除该记录， 阳：你可以令此牌无效并弃置牌堆顶的一张牌，若与使用的牌花色相同，你对其造成1点火焰伤害； 阴：此牌结算结束后，你将之交给一名角色。 若你移除过所有花色和类别，你获得技能〖定南〗。",["转换技"]],["孤熠","锁定技，每回合限三次，当“熠”牌离开手牌区后，你观看牌堆顶X张牌，选择其中一张牌获得并标记为“熠”，然后将其余牌以任意顺序置于牌堆顶（X为你本轮触发此效果的次数，至多为7）。每回合开始时，若你手牌中没有“熠”，你摸一张牌并选择一张手牌标记为“熠”。",["锁定技"]],["定南","出牌阶段限一次，你可以令任意名角色依次打出一张【杀】，否则其受到1点伤害。",["衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"庞凤衣","t":"瞳悉万机","k":"蜀","kh":3,"mh":3,"g":"女","s":[["异瞳","锁定技，游戏开始时，你选择一种花色。每回合限一次，当此花色的牌因使用而移至弃牌堆后，你随机获得除此花色外的不同花色的牌各一张。",["锁定技"]],["醅酿","你可以将“异瞳”花色的牌当【酒】使用（不计次数）。当一名角色进入濒死状态时，你可以对其使用一张【酒】。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"庞宏","t":"针砭时弊","k":"蜀","kh":3,"mh":3,"g":"男","s":[["评骘","转换技，出牌阶段限一次，你可以观看一名角色手牌并选择其中一张牌令其展示，阳：你弃置此牌，其视为对你使用【火攻】，若未造成伤害此技能视为未发动；阴：其使用此牌，若造成伤害则此技能视为未发动。",["转换技"]],["刚简","锁定技，每个回合结束时，若你本回合未受到过伤害，你摸X张牌。（X为本回合展示、因拼点亮出、因火攻弃置的牌数，至多为5）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"蒲元","t":"变废为宝","k":"蜀","kh":4,"mh":4,"g":"男","s":[["辨才","每名角色的回合开始时，你可以进行判定并获得判定牌，若结果为：红色，你从牌堆中获得一张装备牌；黑色，你从弃牌堆中获得一张装备牌。",[]],["淬刃","出牌阶段限一次，你可以弃置一张装备牌，并根据弃置牌的类别获得以下效果直到回合结束： 武器：你使用牌无距离和次数限制； 防具：你使用牌无法被响应； 坐骑，你使用牌指定目标时，可以多指定任意个目标。",[]],["神锋","当你使用【杀】指定一个目标后，你可以弃置一张装备牌，然后选择一项：1.此【杀】伤害+1；2.令此【杀】造成的伤害视为失去体力；3.令目标角色弃置两张牌。",[]]],"r":[],"vi":1,"vt":2},{"p":"十周年","sp":"十周年-群英荟萃","n":"蒲元","t":"淬炼百兵","k":"蜀","kh":4,"mh":4,"g":"男","s":[["天匠","游戏开始时，将牌堆中随机两张不同副类别的装备牌置入你的装备区。出牌阶段，你可以将装备区里的一张牌移动至其他角色的装备区（可替换原装备），若你移动的是〖铸刃〗打造的装备，你摸两张牌。",[]],["铸刃","出牌阶段限一次，你可以弃置一张手牌。根据此牌的花色点数，你有一定概率打造成功并获得一张武器牌（若打造失败或武器已有则改为摸一张【杀】，花色决定武器名称，点数决定成功率）。此武器牌进入弃牌堆时销毁。",[]]],"r":[],"vi":2,"vt":2},{"p":"十周年","sp":"十周年-一将成名","n":"谯周","t":"谶星沉祚","k":"蜀","kh":3,"mh":3,"g":"男","s":[["识命","每轮限一次，一名角色的摸牌阶段开始时，你可以观看牌堆顶三张牌并调整顺序，且可以将其中一张置于牌堆底，若如此做，当前回合角色可以放弃摸牌，改为对自己造成1点伤害，然后从牌堆底摸三张牌。",[]],["将息","一名角色回合结束时，若一号位本回合进入过濒死状态或未受到过伤害，你重置〖识命〗并摸一张牌。若所有角色均未受到过伤害，你可以与当前回合角色各摸一张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-其他","n":"忍姜维","t":"忍辱负重","k":"蜀","kh":4,"mh":4,"g":"男","s":[["惑乱","出牌阶段限一次，你可以与至多两名其他角色同时拼点，你可以将拼点牌更改为任意点数，记录你的原拼点牌，点数唯一最小者视为被其余角色各使用一张【杀】，点数唯一最大者摸等同于其体力值的牌，若你两者皆不符，此技能视为未发动过。",[]],["孤星","限定技，回合开始时，你可依次执行X项，从牌堆和弃牌堆中：1.获得记录牌；2.获得与记录牌点数花色皆相同的牌；3.获得与记录牌同名牌，每种牌名至多5张（X为当前轮数）。",["限定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"沙摩柯","t":"五溪蛮夷","k":"蜀","kh":4,"mh":4,"g":"男","s":[["蒺藜","当你于一回合内使用或打出第X张牌时，你可以摸X张牌（X为你的攻击范围）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"孙狼","t":"恶惮远役","k":"蜀","kh":4,"mh":4,"g":"男","s":[["铤险","每回合限一次，你使用【杀】指定目标后，你可以摸X张牌，然后可以令此【杀】对其中至多X个目标无效（X为你装备区的牌数+1）。",[]],["奔矢","锁定技，你使用【杀】须指定攻击范围内所有角色为目标。你的攻击范围+1。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王桃","t":"晔兮如华","k":"蜀","kh":3,"mh":3,"g":"女","s":[["护关","一名角色于其出牌阶段内使用第一张牌时，若为红色，你可以声明一个花色，本回合此花色的牌不计入其手牌上限。",[]],["摇佩","其他角色弃牌阶段结束时，若你本回合对其发动过〖护关〗，你可以弃置一张其此阶段没弃置过的花色的牌，然后令你与其中一名角色回复1点体力，另一名角色摸两张牌。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"王悦","t":"温乎如莹","k":"蜀","kh":3,"mh":3,"g":"女","s":[["护关","一名角色于其出牌阶段内使用第一张牌时，若为红色，你可以声明一个花色，本回合此花色的牌不计入其手牌上限。",[]],["鸣鸾","其他角色的结束阶段，若本回合有角色回复过体力，你可以弃置至少一张牌，然后摸等同于当前回合角色手牌数的牌（最多摸至五张）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威关银屏","t":"凋棠醒春薄","k":"蜀","kh":4,"mh":4,"g":"女","s":[["绍威","每回合限一次，你失去♦牌后，你可以摸两张牌；你失去♥牌后，你可以回复1点体力并恢复一个装备栏。",[]],["涤仇","锁定技，其他角色对你使用牌时获得一个“仇”标记。你的回合开始时，废除一个装备栏并获得一名其他角色一张牌，本回合你攻击范围与出【杀】次数增加此牌名字数。你对有“仇”的角色使用牌时摸一张牌并移去一个“仇”。你的回合结束时，移去所有“仇”并对任意名本回合失去“仇”的角色各造成1点火焰伤害。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威刘备","t":"志昭义烈","k":"蜀","kh":4,"mh":4,"g":"男","s":[["烈骧","出牌阶段限一次，你可以摸至多5张牌并对一名其他角色造成1点伤害，若你的手牌： 大于其，本回合你出【杀】次数+1且可交给一名其他角色至多X张牌； 等于其，你获得其一张牌且其下回合使用的前X张牌无效； 小于其，你失去X点体力，本回合此技能改为“出牌阶段限两次”且可选目标数+X。 （X为你选择的摸牌数）",[]],["仁彀","其他蜀势力角色出牌阶段限一次，其可以弃置1张牌并令你回复1点体力，然后你可以令其发动一次至多摸2张牌的〖烈骧〗。",[]]],"r":[]},{"p":"十周年","sp":"十周年-威","n":"威张星彩","t":"帼姿凤舞","k":"蜀","kh":3,"mh":3,"g":"女","s":[["煌怒","出牌阶段或受到伤害后，你可以选择一项：1.选择一名角色令其随机弃置一张你指定类别的牌；2.视为使用一张【杀】；3.令一名角色本回合下次使用的牌无效。执行后随机恢复X个装备栏（X为此技能本回合发动次数），若恢复数不足对应数量则此技能本回合失效。",[]],["贤贶","有角色非因使用失去基本牌进入弃牌堆时，你可以废除一个装备栏并选择一项：1.获得此牌；2.令此角色摸你废除的装备栏数张牌（一回合因此技能获得牌累计大于一张时，此技能本回合失效）。",[]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"文鸳","t":"揾泪红袖","k":"蜀","kh":3,"mh":3,"g":"女","s":[["铿锵","每回合限一次，当你使用伤害牌时，你可以选择一项：1.摸X张牌（X为你的体力上限）；2.此牌伤害+1，且你获得造成伤害的牌。",[]],["匮饬","锁定技，回合结束时，若你本回合摸牌数和造成的伤害值均不小于你的体力上限，你失去1点体力。",["锁定技"]],["殇决","觉醒技，当你进入濒死状态时，你将体力值回复至1点，加1点体力上限，并获得〖困励〗，然后将〖铿锵〗改为每回合各限一次。",["觉醒技"]],["困励","觉醒技，当你进入濒死状态时，你将体力值回复至2点，加1点体力上限，并失去〖匮饬〗。",["觉醒技","衍生技"]]],"r":[]},{"p":"十周年","sp":"十周年-群英荟萃","n":"吴班","t":"激东奋北","k":"蜀","kh":4,"mh":4,"g":"男","s":[["诱战","锁定技，其他角色在你的回合失去牌后，你摸一张牌且此牌本回合不计入手牌上限，其本回合下次受到的伤害+1。结束阶段，若这些角色本回合未受到过伤害，其摸X张牌（X为其本回合失去牌的次数，至多为3）。",["锁定技"]]],"r":[]},{"p":"十周年","sp":"十周年-限定专属","n":"武关羽","t":"义武千秋","k":"蜀","kh":5,"mh":5,"g":"男","s":[["绝武","你可以将点数为2的牌当伤害牌或【水淹七军】使用（每回合每种牌名限一次）。当你得到其他角色的牌后，这些牌的点数视为2。",[]],["武佑","每名角色的出牌阶段限一次，其可以交给你一张手牌，然后你可以从五个随机非装备牌名中选择一个并交给其一张手牌，此牌视为你选择的牌名且无距离次数限制。（若为你则跳过交给手牌）",[]],["义贤","限定技，出
